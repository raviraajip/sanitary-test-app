<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>ASWMO — T32 Non-Tech</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
:root{--bg:#0b0c15;--surface:#12142a;--text:#e4e6f0;--accent:#00e8a0;--gold:#f0c040;--danger:#ff4d6d;--border:rgba(255,255,255,.08);--muted:#8a8fa8;}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:Inter,system-ui,sans-serif;background:radial-gradient(1000px 700px at 20% 0%,#00e8a011,transparent),var(--bg);color:var(--text);min-height:100vh;line-height:1.55;}
.container{max-width:900px;margin:2rem auto;padding:0 1.2rem;}
h1{font-size:1.6rem;font-weight:700;background:linear-gradient(135deg,#fff,var(--accent));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.card{background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:16px;padding:1.5rem;margin-bottom:1rem;}
.question{font-size:1.05rem;font-weight:500;margin-bottom:.8rem;line-height:1.35;}
.options{display:grid;gap:.5rem;}
.option{padding:.7rem 1rem;background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:10px;cursor:pointer;font-size:.92rem;transition:.2s;}
.option:hover,.option.selected{border-color:var(--accent);background:rgba(0,232,160,.12);font-weight:600;}
.timer{font-family:monospace;font-weight:700;font-size:2rem;color:var(--accent);}
button{background:linear-gradient(135deg,var(--accent),#00b87e);color:#0a0c12;border:none;padding:.7rem 1.4rem;border-radius:10px;font-weight:700;cursor:pointer;}
.hidden{display:none!important}</style>
</head>
<body>
<div class="container">
<header><h1 id="ptitle">ASWMO — T32 Non-Tech</h1></header>

<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;">
<div><div class="timer" id="timer">65:00</div><div style="font-size:.75rem;color:var(--muted);">Time Remaining</div></div>
<button onclick="submitTest()">Submit Test</button></div>
<div style="height:6px;background:rgba(255,255,255,.1);border-radius:3px;overflow:hidden;margin-top:.5rem;"><div id="bar" style="height:100%;width:100%;background:linear-gradient(90deg,var(--accent),#00b87e);transition:width 1s linear;"></div></div></div>

<div class="card" id="qCard">
<div style="font-size:.8rem;color:var(--muted);margin-bottom:.4rem;">Question <span id="qNum">1</span> / <span id="qTotal">?</span></div>
<div class="question" id="qText">Loading...</div>
<div class="options" id="opts"></div>
<div style="margin-top:1rem;display:flex;gap:.5rem;flex-wrap:wrap;">
<button onclick="prev()">&#8592; Prev</button><button onclick="next()">Next &#8594;</button><button onclick="submitTest()">Submit</button></div>
</div>

<div class="card hidden" id="resCard" style="text-align:center;padding:2rem;">
<h2 style="color:var(--gold);font-size:2rem;">Test Completed!</h2>
<div id="score" style="font-size:3rem;font-weight:800;color:var(--accent);margin:1rem 0;"></div>
<div id="detail" style="color:var(--muted);font-size:.95rem;"></div>
<div style="margin-top:1.5rem;"><a href="index.html" style="color:var(--accent);font-weight:600;">&#8592; Back</a></div>
</div>
</div>

Zinc","Lead","Aluminum"],"answer":"2"},{"id":"79429","q":"Which Buddhist Council was held at Pataliputra during the reign of Ashoka?","options":["First","Second","Third","Fourth"],"answer":"3"},{"id":"79430","q":"What is the full form of 'WORM' in computer storage?","options":["Write Once, Read Many","Wireless Operating Real-time Memory","Web-Oriented Resource Management","Win-Online Remote Monitoring"],"answer":"1"},{"id":"79431","q":"The \"Panchayati Raj\" system was first adopted by which state?","options":["Bihar","Uttar Pradesh","Rajasthan","Andhra Pradesh"],"answer":"3"},{"id":"79432","q":"The \"Blue Revolution\" in India is related to the growth of which sector?","options":["Fertilizer production","Fish production","Indigo cultivation","Space research"],"answer":"2"},{"id":"79433","q":"Which instrument is used to measure \"Atmospheric Pressure\"?","options":["Hygrometer","Barometer","Altimeter","Thermometer"],"answer":"2"},{"id":"79434","q":"In a database, \"Data Integrity\" refers to:","options":["The speed of data access","The accuracy and consistency of data","The size of the database","The number of tables in the database"],"answer":"2"},{"id":"79435","q":"Which dam is built on the river Son in Bihar?","options":["Indrapuri Barrage","Gandhi Sagar","Tehri Dam","Bhakra Nangal"],"answer":"1"},{"id":"79436","q":"The \"Repo Rate\" is the rate at which:","options":["Commercial banks lend to the RBI","The RBI lends to commercial banks","Commercial banks lend to the public","The government borrows from the RBI"],"answer":"2"},{"id":"79437","q":"\"Scurvy\" is a disease caused by the deficiency of which vitamin?","options":["Vitamin A","Vitamin B","Vitamin C","Vitamin D"],"answer":"3"},{"id":"79438","q":"Which key is used to \"Indent\" a paragraph in MS Word?","options":["Tab","Shift","Spacebar","Esc"],"answer":"1"},{"id":"79439","q":"The \"Sher Shah Suri Tomb\" is located in which city?","options":["Patna","Sasaram","Rohtas","Delhi"],"answer":"2"},{"id":"79440","q":"\"Engel's Law\" states that as family income rises, the proportion of income spent on food:","options":["Increases","Decreases","Remains constant","Becomes zero"],"answer":"2"},{"id":"79441","q":"Which protocol is used for \"Remote Login\" to a computer over a network?","options":["HTTP","FTP","Telnet","SMTP"],"answer":"3"},{"id":"79442","q":"The \"Kaimur Plateau\" is famous for which of the following?","options":["Limestone","Coal","Copper","Gold"],"answer":"1"},{"id":"79443","q":"What is the chemical formula for \"Washing Soda\"?","options":["NaHCO 3","Na2CO 3 . 10H 2 O","Ca(OH) 2","NaOH"],"answer":"2"},{"id":"79444","q":"Which pass connects Srinagar and Leh?","options":["Nathu La","Zoji La","Shipki La","Rohtang Pass"],"answer":"2"},{"id":"79445","q":"The \"Maximum Gap\" between two sessions of Parliament cannot exceed:","options":["3 months","6 months","9 months","1 year"],"answer":"2"},{"id":"79446","q":"\"Ransomware\" is a type of malware that:","options":["Deletes all files","Steals passwords","Encrypts files and demands payment","Increases internet speed"],"answer":"3"},{"id":"79447","q":"The first session of the Bihar Provincial Congress was held in 1908 at:","options":["Gaya","Patna","Muzaffarpur","Bhagalpur"],"answer":"2"},{"id":"79448","q":"Which device converts \"Chemical Energy\" into \"Electrical Energy\"?","options":["Motor","Generator","Battery","Transformer"],"answer":"3"},{"id":"79449","q":"Who was the first Mughal Emperor to have a \"Coronation\" in Patna?","options":["Aurangzeb","Farrukhsiyar","Shah Alam II","Bahadur Shah I"],"answer":"2"},{"id":"79450","q":"\"Aqua Regia\" is a mixture of which two acids?","options":["HCl and H 2 SO 4","HCl and HNO 3","HNO 3 and H 2 SO 4","Citric and Acetic acid"],"answer":"2"},{"id":"79451","q":"In MS Excel, the intersection of a row and a column is called a:","options":["Block","Box","Cell","Range"],"answer":"3"},{"id":"79452","q":"Which Fundamental Right was described by Dr. B.R. Ambedkar as the \"Heart and Soul of the Constitution\"?","options":["Right to Equality","Right to Freedom of Religion","Right to Constitutional Remedies","Right against Exploitation"],"answer":"3"},{"id":"79453","q":"What is the \"Time Limit\" for the government to provide information under the RTI Act, 2005 (general cases)?","options":["15 days","30 days","45 days","60 days"],"answer":"2"},{"id":"79454","q":"\"Mycology\" is the study of:","options":["Algae","Fungi","Bacteria","Viruses"],"answer":"2"},{"id":"79455","q":"The \"Gandak River\" joins the Ganga near which place?","options":["Patna (Sonepur)","Bhagalpur","Munger","Katihar"],"answer":"1"},{"id":"79456","q":"Which layer of the OSI model is responsible for \"Routing\" data packets?","options":["Physical Layer","Data Link Layer","Network Layer","Transport Layer"],"answer":"3"},{"id":"79457","q":"\"Kunwar Singh\" led the Revolt of 1857 from which place in Bihar?","options":["Patna","Jagdishpur","Arrah","Dumraon"],"answer":"2"},{"id":"79458","q":"What is the SI unit of \"Luminous Intensity\"?","options":["Mole","Candela","Kelvin","Ampere"],"answer":"2"},{"id":"79459","q":"Which part of the cell is known as the \"Suicide Bag\"?","options":["Ribosome","Lysosome","Golgi body","Centrosome"],"answer":"2"},{"id":"79460","q":"The \"Simla Pact\" (1972) was signed between Indira Gandhi and:","options":["Yahya Khan","Zulfiqar Ali Bhutto","Benazir Bhutto","Ayub Khan"],"answer":"2"},{"id":"79461","q":"Which function key is used to \"Edit\" the content of a cell in MS Excel?","options":["F1","F2","F5","F7"],"answer":"2"}];
let idx=0, answers={}, timerSec=3900, timerInt=null;

function render(){
  const q=DATA[idx];
  if(!q){document.getElementById('qText').textContent='No data.';return;}
  document.getElementById('qNum').textContent=idx+1;
  document.getElementById('qTotal').textContent=DATA.length;
  document.getElementById('qText').textContent=q.q;
  document.getElementById('opts').innerHTML=q.options.map((o,i)=>
    `<div class="option ${answers[idx]==(i+1)?'selected':''}" onclick="select(${i+1})">${String.fromCharCode(65+i)}. ${o}</div>`
  ).join('');
}
window.select=o=>{answers[idx]=o; render();};
window.prev=()=>{if(idx>0){idx--; render();}};
window.next=()=>{if(idx<DATA.length-1){idx++; render();}};

function submitTest(){
  clearInterval(timerInt);
  let c=0; for(let i=0;i<DATA.length;i++){if(answers[i]==DATA[i].answer)c++;}
  const pct=Math.round(c/DATA.length*100)||0;
  document.getElementById('qCard').classList.add('hidden');
  document.getElementById('resCard').classList.remove('hidden');
  document.getElementById('score').textContent=pct+'%';
  document.getElementById('detail').innerHTML='<b>'+c+'/'+DATA.length+'</b> correct';
}

function tick(){timerSec--; document.getElementById('timer').textContent=Math.floor(timerSec/60)+':'+String(timerSec%60).padStart(2,'0'); document.getElementById('bar').style.width=(timerSec/3900*100)+'%'; if(timerSec<=0){clearInterval(timerInt); submitTest();}}

render(); timerInt=setInterval(tick,1000);
</script>
