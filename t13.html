es.","It reduces the liquidity in the banking system, potentially leading to higher interest rates.","It has no impact on liquidity but increases the government's fiscal deficit.","It directly causes the Indian Rupee to appreciate against the US Dollar."],"answer":"2"},{"id":"72290","q":"In the context of the global climate negotiations (COP meetings), what is the primary focus of the 'Loss and Damage' fund?","options":["To finance the transition of developing countries from fossil fuels to renewable energy.","To provide financial assistance to vulnerable nations to cope with the unavoidable impacts of climate change.","To fund research and development of new green technologies.","To compensate large corporations for phasing out carbon-intensive operations"],"answer":"2"},{"id":"72291","q":"Arrange the following events from the Indian freedom struggle in the correct chronological order: Formation of the Swaraj Party Chauri Chaura incident Dandi March Jallianwala Bagh massacre","options":["4, 2, 1, 3","1, 4, 2, 3","4, 1, 2, 3","2, 4, 1, 3"],"answer":"1"},{"id":"72292","q":"The 'Lorenz Curve' and the 'Gini Coefficient' are tools used by economists to measure:","options":["The rate of inflation.","The growth rate of the economy.","The level of income inequality within a population.","The Human Development Index."],"answer":"3"},{"id":"72293","q":"The 'One Sun, One World, One Grid' initiative, championed by India, is a global proposal to:","options":["Create a single global currency based on solar energy production.","Establish a worldwide standard for solar panel manufacturing.","Develop a trans-national electricity grid to supply solar power across the globe.","Launch a single satellite to monitor solar radiation for all countries."],"answer":"3"},{"id":"72294","q":"The 'Monetary Policy Committee (MPC)' of the RBI is statutorily tasked with maintaining a specific target. What is this primary target?","options":["Ensuring the stability of the Indian Rupee exchange rate.","Maintaining a high rate of GDP growth.","Keeping inflation within a specified target range.","Reducing the level of non-performing assets (NPAs) in the banking system."],"answer":"3"},{"id":"72295","q":"Who among the following personalities from Bihar was a key organizer of the Champaran Satyagraha (1917) and is often referred to as 'Desh Ratna'?","options":["Jayaprakash Narayan","Sri Krishna Sinha","Dr. Rajendra Prasad","Swami Sahajanand Saraswati"],"answer":"3"},{"id":"72296","q":"The Supreme Court of India, in a landmark 2024 judgment, struck down the 'Electoral Bonds Scheme' primarily on the grounds that it violated which Fundamental Right?","options":["Right to Equality (Article 14)","Right to Freedom of Speech and Expression, including the voter's right to information (Article 19(1)(a))","Right to Life and Personal Liberty (Article 21)","Right against Exploitation (Article 23)"],"answer":"2"},{"id":"72297","q":"The 'Kakori Conspiracy Case of 1925 was an act of train robbery carried out by members of which revolutionary organization?","options":["Anushilan Samiti","Jugantar","Hindustan Republican Association (HRA)","India House"],"answer":"3"},{"id":"72298","q":"The 16th Finance Commission, constituted in late 2023 under the chairmanship of Dr. Arvind Panagariya, has been given a specific new term of reference to review the financing of which of the following?","options":["Disaster Management initiatives.","Universal Basic Income schemes.","Urban infrastructure development.","National defence modernization."],"answer":"1"},{"id":"72299","q":"The policy of 'Subsidiary Alliance', which was used by the British to bring Indian princely states under their control, was masterminded by:","options":["Robert Clive","Warren Hastings","Lord Wellesley","Lord Cornwallis"],"answer":"3"},{"id":"72300","q":"What is 'Core Inflation'?","options":["The inflation rate calculated using the Consumer Price Index (CPI).","The total inflation in an economy, including all goods and services.","A measure of inflation that excludes volatile items such as food and energy prices.","The inflation rate specifically for industrial and manufacturing goods."],"answer":"3"},{"id":"72301","q":"India's UPI (Unified Payments Interface) system achieved a significant milestone by being linked with a similar instant payment system of another country. Which was the first country to launch this cross-border linkage?","options":["United Arab Emirates","Singapore (PayNow)","United States","United Kingdom"],"answer":"2"},{"id":"72302","q":"What was the primary objective of the 'Insolvency and Bankruptcy Code (IBC), 2016' in India?","options":["To provide tax relief to new start-up companies.","To consolidate and amend the laws relating to reorganization and insolvency resolution in a time-bound manner.","To regulate the activities of non-banking financial companies (NBFCs).","To recapitalize public sector banks through government bonds."],"answer":"2"},{"id":"72303","q":"Assertion (A): The Permanent Settlement system introduced by Cornwallis in 1793 led to the widespread impoverishment of the peasantry. Reason (R): The system fixed the land revenue demand of the state in perpetuity, but the Zamindars were free to extract exorbitant rents from the tenants, who lacked occupancy rights.","options":["Both (A) and (R) are true, and (R) is the correct explanation of (A).","Both (A) and (R) are true, but (R) is not the correct explanation of (A).","(A) is true, but (R) is false.","(A) is false, but (R) is true."],"answer":"1"},{"id":"72304","q":"The term 'Carbon Border Adjustment Mechanism' (CBAM), proposed by the European Union, refers to a policy that:","options":["Provides carbon credits to developing nations for afforestation.","Aims to put a fair price on the carbon emitted during the production of carbon-intensive goods entering the EU.","Bans the import of all goods produced using fossil fuels.","Offers financial aid to help other countries transition to green energy."],"answer":"2"},{"id":"72305","q":"The 'Battle of Talikota' (1565) was a decisive battle that led to the decline of which powerful South Indian empire?","options":["The Chola Empire","The Chalukya Empire","The Vijayanagara Empire","The Hoysala Empire"],"answer":"3"},{"id":"72306","q":"'Blue Economy' refers to the sustainable use of:","options":["Forest resources for economic growth.","Water resources in arid regions for agriculture.","Ocean resources for economic growth, improved livelihoods, and jobs while preserving the health of the ocean ecosystem.","The IT and services sector, often referred to as 'blue-collar' jobs."],"answer":"3"},{"id":"72307","q":"Who was posthumously awarded the Bharat Ratna in 2024, having served as the Chief Minister of Bihar and known for implementing reservations for backward classes?","options":["Lalu Prasad Yadav","Karpoori Thakur","B. P. Mandal","Jagannath Mishra"],"answer":"2"},{"id":"72308","q":"What does the term 'Crowding Out' signify in macroeconomics?","options":["A situation where private investment is reduced due to increased government borrowing and higher interest rates.","The process of small firms being driven out of the market by large monopolies.","The decline in a country's exports due to an overvalued currency.","A phenomenon where a surplus of labor leads to lower wages."],"answer":"1"},{"id":"72309","q":"The 'Vibrant Villages Programme' launched by the Indian government is specifically targeted towards the comprehensive development of villages located:","options":["In drought-prone regions of central India.","Along the coastal areas affected by soil salinity.","Along India's northern land border.","In regions affected by Left-Wing Extremism."],"answer":"3"},{"id":"72310","q":"The 'Ghadar Party' was a revolutionary group founded in the early 20th century by Indians primarily based in which foreign city?","options":["London","Tokyo","Berlin","San Francisco"],"answer":"4"},{"id":"72311","q":"The 'Laffer Curve' is a theoretical concept that illustrates the relationship between:","options":["Inflation and unemployment.","Government spending and economic growth.","Tax rates and the amount of tax revenue collected by governments.","The money supply and the price level."],"answer":"3"},{"id":"72312","q":"The 'Great Nicobar Project', a mega-infrastructure plan, has raised significant concerns among environmentalists primarily due to its potential impact on:","options":["The region's seismic stability.","Indigenous tribal populations and rich biodiversity, including coral reefs and rainforests.","The area's agricultural productivity.","The maritime shipping lanes in the Indian Ocean."],"answer":"2"},{"id":"72313","q":"The ancient university of Nalanda, a renowned center of learning in Bihar, was founded during the reign of which dynasty?","options":["The Mauryas","The Kushans","The Guptas","The Palas"],"answer":"3"},{"id":"72314","q":"'Green GNP' is:","options":["GNP calculated based on the production from the agricultural sector only.","A measure of national income that accounts for the depletion of natural resources and environmental degradation.","The total value of exports of organic and eco-friendly products.","A special fund created by the government for afforestation projects."],"answer":"2"},{"id":"72315","q":"In 2024, India invoked the 'force majeure' clause in its long-term LNG import deal with a major supplier. What does this clause typically allow a party to do in a contract?","options":["Renegotiate the price of the commodity based on market fluctuations.","Neglect its contractual obligations due to unforeseeable and extraordinary events.","Sell the contracted commodity to a third party for a higher profit.","Unilaterally terminate the contract without any penalty."],"answer":"2"},{"id":"72316","q":"The 'Ilbert Bill controversy' during the viceroyalty of Lord Ripon arose because the bill proposed to:","options":["Impose severe restrictions on the vernacular press.","Allow Indian judges to preside over cases involving Europeans.","Increase the age limit for the Indian Civil Service examination.","Annex the state of Awadh on grounds of misgovernance."],"answer":"2"},{"id":"72317","q":"The 'World Investment Report' is an annual flagship publication of which international organization?","options":["The World Bank","The International Monetary Fund (IMF)","The World Economic Forum (WEF)","The United Nations Conference on Trade and Development (UNCTAD)"],"answer":"4"},{"id":"72318","q":"What is a 'Giffen Good' in economics?","options":["A luxury good for which demand increases more than proportionally as income rises.","A good for which there are no substitutes.","A low-income, non-luxury product that defies standard economic and consumer demand theory, where demand increases as the price increases.","A good that is provided by the government free of cost."],"answer":"3"},{"id":"72319","q":"Megasthenes, in his account 'Indica', describes the Mauryan municipal administration in detail. Which of the following was NOT a feature of this administration as described by him?","options":["A city council of 30 members divided into six boards of five members each.","A specific board dedicated to the registration of births and deaths.","A board responsible for collecting a tax of one-tenth of the value of goods sold.","A board tasked with the construction of public temples and religious monuments."],"answer":"4"},{"id":"72320","q":"The 'Quit India Movement' of 1942 was launched in response to the failure of the:","options":["Simon Commission","Round Table Conferences","Cripps Mission","Cabinet Mission"],"answer":"3"},{"id":"72321","q":"'Priority Sector Lending (PSL)' norms in India mandate that banks must allocate a certain percentage of their lending to specific sectors. Which of the following is NOT typically included under PSL?","options":["Agriculture","Micro, Small and Medium Enterprises (MSMEs)","Large-scale corporate infrastructure projects","Weaker Sections"],"answer":"3"},{"id":"72322","q":"What was the primary objective of the 'Artemis Accords', a U.S.-led international agreement to which India became a signatory?","options":["To establish a framework for international cooperation in demilitarizing the Arctic region.","To create common principles and guidelines for the civil exploration and use of outer space, including the Moon and Mars.","To combat global cybercrime through shared intelligence and joint operations.","To regulate the use of artificial intelligence in autonomous weapons systems."],"answer":"2"},{"id":"72323","q":"Which committee's recommendations led to the establishment of the Monetary Policy Committee (MPC) in India?","options":["C. Rangarajan Committee","Bimal Jalan Committee","Urjit Patel Committee","Nachiket Mor Committee"],"answer":"3"},{"id":"72324","q":"The system of 'Dyarchy' or dual government was introduced in the Indian provinces by the:","options":["Indian Councils Act of 1909","Government of India Act of 1919","Government of India Act of 1935","Indian Independence Act of 1947"],"answer":"2"},{"id":"72325","q":"The 'Base Effect' in the context of inflation refers to:","options":["The impact of government subsidies on the price level.","The effect of a change in the base year for calculating the CPI.","The distortion in a monthly inflation figure that results from an abnormally high or low level of inflation in the corresponding month of the prior year.","The impact of international oil prices on domestic inflation."],"answer":"3"},{"id":"72326","q":"The 'Gaganyaan' mission aims to:","options":["Send an unmanned probe to study the Sun's corona.","Establish a permanent space station in low Earth orbit.","Demonstrate human spaceflight capability by launching a crew into an orbit of 400 km for a 3-day mission.","Land a rover on the south pole of Mars."],"answer":"3"},{"id":"72327","q":"The 'Twin Deficit Problem' for a country refers to the simultaneous occurrence of:","options":["High inflation and high unemployment.","A fiscal deficit and a current account deficit.","A trade deficit and a budget surplus.","Low economic growth and a balance of payments surplus."],"answer":"2"},{"id":"72328","q":"The 'Tomb of Sher Shah Suri', an exemplary piece of Indo-Islamic architecture, is located in which town of Bihar?","options":["Patna","Gaya","Sasaram","Rajgir"],"answer":"3"},{"id":"72329","q":"The 'Pradhan Mantri Janjati Adivasi Nyaya Maha Abhiyan' (PM-JANMAN) is a comprehensive scheme focused on the welfare of:","options":["All Scheduled Tribe (ST) communities in India.","Particularly Vulnerable Tribal Groups (PVTGs).","Nomadic and semi-nomadic tribes.","Denotified tribes."],"answer":"2"},{"id":"72330","q":"Which Mughal emperor was responsible for introducing the 'Mansabdari system', a graded administrative system for the military and civil services?","options":["Babur","Humayun","Akbar","Shah Jahan"],"answer":"3"},{"id":"72331","q":"India's first indigenous aircraft carrier, INS Vikrant, utilizes a STOBAR (Short Take-Off But Arrested Recovery) mechanism. What does this system involve?","options":["A powerful electromagnetic catapult to launch aircraft.","A 'ski-jump' ramp for take-off and arrester wires for landing.","Vertical take-off and landing (VTOL) capability for all its aircraft.","A long runway built into the carrier for conventional take-offs."],"answer":"2"},{"id":"72332","q":"The key difference between Foreign Direct Investment (FDI) and Foreign Portfolio Investment (FPI) is:","options":["FDI involves investment in physical assets and long-term interest, while FPI is generally short-term investment in financial assets like stocks and bonds.","FDI can only be made by foreign governments, while FPI can be made by individuals.","FDI is taxed at a higher rate than FPI.","FDI is measured in domestic currency, while FPI is measured in foreign currency."],"answer":"1"},{"id":"72333","q":"The concept of 'Sulh-i-Kul' (absolute peace), which promoted harmony among different religions, was a cornerstone of the administrative policy of which Mughal emperor?","options":["Akbar","Jahangir","Shah Jahan","Aurangzeb"],"answer":"1"},{"id":"72334","q":"The term 'Disinvestment' refers to:","options":["The government withdrawing subsidies from a particular sector.","The sale of government-owned equity in a public sector undertaking (PSU) to private entities.","A reduction in public expenditure to control the fiscal deficit.","The process of repaying the national debt."],"answer":"2"},{"id":"72335","q":"The James Webb Space Telescope (JWST) has been able to observe the early universe with unprecedented clarity primarily because it is designed to detect which type of electromagnetic radiation?","options":["Visible light","Ultraviolet (UV) light","X-rays","Infrared (IR) light"],"answer":"4"},{"id":"72336","q":"The 'Pitts India Act of 1784' was significant primarily because it:","options":["Granted complete autonomy to the East India Company.","Established a Board of Control in Britain to supervise the civil, military, and revenue affairs of the Company in India.","Officially ended the Company's trade monopoly with India.","Made the Governor of Bengal the Governor-General of India."],"answer":"2"},{"id":"72337","q":"The 'World Economic Outlook' report is published by which organization?","options":["The World Bank","The International Monetary Fund (IMF)","The Organisation for Economic Co-operation and Development (OECD)","The World Trade Organization (WTO)"],"answer":"2"},{"id":"72338","q":"The 'Anuvadini' app, launched by the Government of India, has the primary purpose of:","options":["Providing real-time air quality index data for all major cities.","Serving as a digital platform for farmers to sell their produce directly.","Translating study materials and educational content into various Indian languages using AI.","Acting as a secure messaging application for government employees."],"answer":"3"},{"id":"72339","q":"The archaeological site of 'Dholavira', known for its unique water management system, is located in the present-day state of:","options":["Rajasthan","Punjab","Gujarat","Haryana"],"answer":"3"},{"id":"72340","q":"The term 'CRISPR-Cas9' refers to a revolutionary technology in the field of:","options":["Quantum computing","Artificial intelligence","Gene editing","Battery storage"],"answer":"3"},{"id":"72341","q":"In the context of the government's budget, what is the 'Fiscal Deficit'?","options":["The difference between total revenue and total expenditure.","The total borrowings required by the government to meet its expenditure.","The difference between revenue expenditure and revenue receipts.","The total of all government liabilities."],"answer":"2"},{"id":"72342","q":"Which Indian film song won the Oscar for Best Original Song at the 95th Academy Awards?","options":["\"Jai Ho\" from Slumdog Millionaire","\"Naatu Naatu\" from RRR","\"Ghar More Pardesiya\" from Kalank","\"Apna Time Aayega\" from Gully Boy"],"answer":"2"},{"id":"72343","q":"The 'Round Tripping' in the context of FDI refers to:","options":["A foreign company investing in multiple sectors of the Indian economy.","Domestic funds being routed abroad and then reinvested back into the country, disguised as foreign investment, to take advantage of tax benefits.","A situation where FDI inflows are immediately matched by FDI outflows.","The process of repatriating profits from FDI back to the home country."],"answer":"2"}];
let idx=0, answers={}, timerSec=3900, timerInt=null;

function render(){
  const q=DATA[idx];
  if(!q){document.getElementById('qText').textContent='No data.';return;}
  document.getElementById('qNum').textContent=idx+1;
  document.getElementById('qTotal').textContent=DATA.length;
  document.getElementById('qText').textContent=q.q;
  document.getElementById('opts').innerHTML=q.options.map((o,i)=>
    `<div class="option ${answers[idx]==(i+1)?'selected':''}" onclick="select(${i+1})">${String.fromCharCode(65+i)}. ${o}</div>`
  ).join('');
}
window.select=o=>{answers[idx]=o; render();};
window.prev=()=>{if(idx>0){idx--; render();}};
window.next=()=>{if(idx<DATA.length-1){idx++; render();}};

function submitTest(){
  clearInterval(timerInt);
  let c=0; for(let i=0;i<DATA.length;i++){if(answers[i]==DATA[i].answer)c++;}
  const pct=Math.round(c/DATA.length*100)||0;
  document.getElementById('qCard').classList.add('hidden');
  document.getElementById('resCard').classList.remove('hidden');
  document.getElementById('score').textContent=pct+'%';
  document.getElementById('detail').innerHTML='<b>'+c+'/'+DATA.length+'</b> correct';
}

function tick(){timerSec--; document.getElementById('timer').textContent=Math.floor(timerSec/60)+':'+String(timerSec%60).padStart(2,'0'); document.getElementById('bar').style.width=(timerSec/3900*100)+'%'; if(timerSec<=0){clearInterval(timerInt); submitTest();}}

render(); timerInt=setInterval(tick,1000);
</script>
