<!DOCTYPE html>
<html lang="hi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>ASWMO Test</title>
<style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
:root{--bg:#0b0c15;--surface:#12142a;--text:#e4e6f0;--accent:#00e8a0;--gold:#f0c040;--danger:#ff4d6d;--border:rgba(255,255,255,.08);}
body{font-family:Inter,system-ui,sans-serif;background:radial-gradient(1000px 700px at 20% 0%,#00e8a011,transparent),var(--bg);color:var(--text);min-height:100vh;line-height:1.55;}
.container{max-width:900px;margin:2rem auto;padding:0 1.2rem;}
h1{font-size:1.6rem;font-weight:700;background:linear-gradient(135deg,#fff,var(--accent));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.card{background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:16px;padding:1.5rem;margin-bottom:1rem;}
.question{font-size:1.05rem;font-weight:500;margin-bottom:.8rem;line-height:1.35;}
.options{display:grid;gap:.5rem;}
.option{padding:.7rem 1rem;background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:10px;cursor:pointer;font-size:.92rem;transition:.2s;}
.option:hover,.option.selected{border-color:var(--accent);background:rgba(0,232,160,.12);font-weight:600;}
.option.correct{border-color:var(--accent);background:rgba(0,232,160,.1);}
.timer{font-family:monospace;font-weight:700;font-size:2rem;color:var(--accent);}
button{background:linear-gradient(135deg,var(--accent),#00b87e);color:#0a0c12;border:none;padding:.7rem 1.4rem;border-radius:10px;font-weight:700;cursor:pointer;}
</style></head><body>
<div class="container">
<header><h1 id="ptitle">ASWMO — Test</h1><span id="ptype" class="tag" style="display:inline-block;padding:.15rem .55rem;border-radius:999px;font-size:.7rem;background:linear-gradient(135deg,var(--accent-2),#9f7bff);color:#fff;"></span></header>

<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;"><div><div class="timer" id="timer">65:00</div><div style="font-size:.75rem;color:var(--muted);">Timer</div></div><button onclick="submitTest()">Submit</button></div><div style="height:6px;background:rgba(255,255,255,.1);border-radius:3px;overflow:hidden;margin-top:.5rem;"><div id="bar" style="height:100%;width:100%;background:linear-gradient(90deg,var(--accent),#00b87e);transition:width 1s linear;"></div></div></div>

<div class="card" id="qCard">
<div style="font-size:.8rem;color:var(--muted);margin-bottom:.4rem;">Q <span id="qNum">1</span> / <span id="qTotal">?</span></div>
<div class="question" id="qText">Loading...</div>
<div class="options" id="opts"></div>
<div style="margin-top:1rem;display:flex;gap:.5rem;flex-wrap:wrap;"><button onclick="prev()">← Prev</button><button onclick="next()">Next →</button><button onclick="submitTest()">Submit</button></div>
</div>

<div class="card hidden" id="resCard" style="text-align:center;padding:2rem;"><h2 style="color:var(--gold);font-size:2rem;">Done</h2><div id="score" style="font-size:3rem;font-weight:800;color:var(--accent);margin:1rem 0;"></div><div id="detail" style="color:var(--muted);font-size:.95rem;"></div><a href="index.html" style="color:var(--accent);font-weight:600;">← Dashboard</a></div>
</div>

<script>
let questions=[], idx=0, answers={}, timerSec=65*60, timerInt=null;
const params=new URLSearchParams(location.search);
const paperFile='T17 Full Length Test-Series Technical.html';
const paperName='T17 Full Length Test-Series Technical.html';'Paper';
document.getElementById('ptitle').textContent='ASWMO — '+paperName;
document.getElementById('ptype').textContent=paperFile;

function render(){const q=questions[idx]; if(!q){document.getElementById('qText').textContent='No data loaded.';return;} document.getElementById('qNum').textContent=idx+1; document.getElementById('qTotal').textContent=questions.length; document.getElementById('qText').textContent=q.q; document.getElementById('opts').innerHTML=q.options.map((o,i)=`<div class="option ${answers[idx]==(i+1)?'selected':''}" onclick="select(${i+1})">${String.fromCharCode(65+i)}. ${o}</div>`).join('');}
window.select=o=>{answers[idx]=o; render();};
window.prev=()=>{if(idx>0){idx--; render();}};
window.next=()=>{if(idx<questions.length-1){idx++; render();}};

function submitTest(){clearInterval(timerInt); let c=0; for(let i=0;i<questions.length;i++)if(answers[i]==questions[i].answer)c++; const pct=Math.round(c/questions.length*100)||0; document.getElementById('qCard').classList.add('hidden'); document.getElementById('resCard').classList.remove('hidden'); document.getElementById('score').textContent=pct+'%'; document.getElementById('detail').innerHTML='<b>'+c+'/'+questions.length+'</b> correct • '+Math.round(timerSec/60)+' min';}

function tick(){timerSec--; document.getElementById('timer').textContent=Math.floor(timerSec/60)+':'+String(timerSec%60).padStart(2,'0'); document.getElementById('bar').style.width=(timerSec/(65*60)*100)+'%'; if(timerSec<=0){clearInterval(timerInt); submitTest();}}

window.onload=()=>{
  const safe=paperFile.replace('.html','').replace(' ','-').replace('&','and').replace("'",'');
  fetch('papers/'+safe+'.json').then(r=>{if(!r.ok)throw new Error('404');return r.json();}).then(d=>{questions=Array.isArray(d)?d:[]; document.getElementById('qTotal').textContent=questions.length||0; render(); timerInt=setInterval(tick,1000);}).catch(e=>{
    questions=[{q:'Demo Q: SWM Rules 2016 — multi-layered packaging responsibility?',options:['Municipal Corp','Consumer','Manufacturer/Brand owner','SPCB'],answer:'3'}]; document.getElementById('qTotal').textContent=1; render(); timerInt=setInterval(tick,1000);
  });
};
</script>
</body></html>
