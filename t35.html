<!DOCTYPE html>
<html lang="hi">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>ASWMO — T35 Full Test-Tech</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
:root{--bg:#0b0c15;--surface:#12142a;--text:#e4e6f0;--accent:#00e8a0;--gold:#f0c040;--danger:#ff4d6d;--border:rgba(255,255,255,.08);--muted:#8a8fa8;}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:Inter,system-ui,sans-serif;background:radial-gradient(1000px 700px at 20% 0%,#00e8a011,transparent),var(--bg);color:var(--text);min-height:100vh;line-height:1.55;}
.container{max-width:900px;margin:2rem auto;padding:0 1.2rem;}
h1{font-size:1.6rem;font-weight:700;background:linear-gradient(135deg,#fff,var(--accent));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.card{background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:16px;padding:1.5rem;margin-bottom:1rem;}
.question{font-size:1.05rem;font-weight:500;margin-bottom:.8rem;line-height:1.35;}
.options{display:grid;gap:.5rem;}
.option{padding:.7rem 1rem;background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:10px;cursor:pointer;font-size:.92rem;transition:.2s;}
.option:hover,.option.selected{border-color:var(--accent);background:rgba(0,232,160,.12);font-weight:600;}
.timer{font-family:monospace;font-weight:700;font-size:2rem;color:var(--accent);}
button{background:linear-gradient(135deg,var(--accent),#00b87e);color:#0a0c12;border:none;padding:.7rem 1.4rem;border-radius:10px;font-weight:700;cursor:pointer;}
.hidden{display:none!important}</style>
</head>
<body>
<div class="container">
<header><h1 id="ptitle">ASWMO — T35 Full Test-Tech</h1></header>

<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;">
<div><div class="timer" id="timer">65:00</div><div style="font-size:.75rem;color:var(--muted);">Time Remaining</div></div>
<button onclick="submitTest()">Submit Test</button></div>
<div style="height:6px;background:rgba(255,255,255,.1);border-radius:3px;overflow:hidden;margin-top:.5rem;"><div id="bar" style="height:100%;width:100%;background:linear-gradient(90deg,var(--accent),#00b87e);transition:width 1s linear;"></div></div></div>

<div class="card" id="qCard">
<div style="font-size:.8rem;color:var(--muted);margin-bottom:.4rem;">Question <span id="qNum">1</span> / <span id="qTotal">?</span></div>
<div class="question" id="qText">Loading...</div>
<div class="options" id="opts"></div>
<div style="margin-top:1rem;display:flex;gap:.5rem;flex-wrap:wrap;">
<button onclick="prev()">&#8592; Prev</button><button onclick="next()">Next &#8594;</button><button onclick="submitTest()">Submit</button></div>
</div>

<div class="card hidden" id="resCard" style="text-align:center;padding:2rem;">
<h2 style="color:var(--gold);font-size:2rem;">Test Completed!</h2>
<div id="score" style="font-size:3rem;font-weight:800;color:var(--accent);margin:1rem 0;"></div>
<div id="detail" style="color:var(--muted);font-size:.95rem;"></div>
<div style="margin-top:1.5rem;"><a href="index.html" style="color:var(--accent);font-weight:600;">&#8592; Back</a></div>
</div>
</div>

<script>
const DATA=[{"id":"80452","q":"The term \"Refuse\" in solid waste management generally refers to:","options":["Only biodegradable waste from households","All putrescible and non-putrescible solid wastes, except body wastes (excreta)","Only construction and demolition waste","Only hazardous industrial waste"],"answer":"2"},{"id":"80453","q":"In a sanitary landfill, the \"Field Capacity\" represents:","options":["The total volume of waste the landfill can hold","The maximum amount of moisture the waste can retain against gravity","The amount of gas generated per day","The bearing capacity of the soil liner"],"answer":"2"},{"id":"80454","q":"Which of the following equations correctly represents \"Stokes' Law\" for the settling of discrete particles?","options":["[Image-based option 1 — see original]","[Image-based option 2 — see original]","[Image-based option 3 — see original]","[Image-based option 4 — see original]"],"answer":"1"},{"id":"80455","q":"Under the Bio-Medical Waste Management Rules, 2016, \"Human Anatomical Waste\" falls under which category?","options":["Red Category","Blue Category","Yellow Category","White Category"],"answer":"3"},{"id":"80456","q":"Which of the following is an example of a \"Secondary Air Pollutant\"?","options":["Sulphur Dioxide ( )","Carbon Monoxide (CO)","Peroxyacetyl Nitrate (PAN)","Nitrogen Oxide (NO)"],"answer":"3"},{"id":"80457","q":"The \"3Ts\" of efficient incineration are:","options":["Time, Temperature, and Turbulence","Time, Temperature, and Toxicity","Temperature, Turbulence, and Transportation","Time, Technology, and Transfer"],"answer":"1"},{"id":"80458","q":"In the Activated Sludge Process, \"Bulking of Sludge\" is primarily caused by:","options":["Low F/M ratio","Growth of filamentous micro-organisms","High dissolved oxygen","Excess removal of sludge"],"answer":"2"},{"id":"80459","q":"According to the Solid Waste Management Rules, 2016, the responsibility to segregate waste into three categories (Wet, Dry, and Domestic Hazardous) lies with:","options":["The Municipal Corporation","The Waste Generator","The Rag Pickers","The State Pollution Control Board"],"answer":"2"},{"id":"80460","q":"A \"Skimming Tank\" is used in a wastewater treatment plant to remove:","options":["Suspended solids","Dissolved solids","Oil and Grease","Grit and Sand"],"answer":"3"},{"id":"80461","q":"The \"Cradle to Grave\" concept is most closely associated with the management of:","options":["Municipal Solid Waste","Hazardous Waste","Agricultural Waste","Construction Waste"],"answer":"2"},{"id":"80462","q":"Which gas is the principal component of \"Landfill Gas\" (LFG) by volume?","options":["Carbon Dioxide ( )","Methane ( )","Nitrogen ( )","Hydrogen Sulfide ( )"],"answer":"2"},{"id":"80463","q":"The Environmental Impact Assessment (EIA) Notification, 2006 classifies projects into:","options":["Category I and Category II","Category A and Category B","Category Red and Category Green","Large Scale and Small Scale"],"answer":"2"},{"id":"80464","q":"The minimum dissolved oxygen (DO) required to sustain fish life in a river is approximately:","options":["0 mg/L","2 mg/L","4 mg/L","10 mg/L"],"answer":"3"},{"id":"80465","q":"\"Composting\" is an example of:","options":["Endothermic process","Exothermic process","Adiabatic process","Isothermal process"],"answer":"2"},{"id":"80466","q":"Under the Hazardous Waste Management Rules, 2016, who grants authorization to a facility for the treatment, storage, and disposal (TSDF) of hazardous waste?","options":["Central Pollution Control Board (CPCB)","State Pollution Control Board (SPCB)","Ministry of Environment, Forest and Climate Change (MoEFCC)","District Magistrate"],"answer":"2"},{"id":"80467","q":"The \"Imhoff Cone\" is used to measure:","options":["Total Solids","Settleable Solids","Dissolved Solids","Volatile Solids"],"answer":"2"},{"id":"80468","q":"Which type of landfill liner is made of High-Density Polyethylene?","options":["Clay Liner","Geomembrane Liner","Geotextile Liner","Geonet"],"answer":"2"},{"id":"80469","q":"\"Eutrophication\" in water bodies is primarily caused by the excess presence of:","options":["Heavy Metals","Nitrates and Phosphates","Pesticides","Suspended Solids"],"answer":"2"},{"id":"80470","q":"The standard \"BOD\" test is conducted at what temperature and duration?","options":["for 3 days","for 3 days (Indian Standard) or for 5 days","for 5 days","for 2 days"],"answer":"2"},{"id":"80471","q":"Which of the following is NOT a method of \"Thermal Treatment\" of solid waste?","options":["Pyrolysis","Gasification","Incineration","Sanitary Landfilling"],"answer":"4"},{"id":"80472","q":"The \"Basel Convention\" deals with:","options":["Protection of Ozone Layer","Control of Transboundary Movements of Hazardous Wastes","Conservation of Biodiversity","Reduction of Greenhouse Gases"],"answer":"2"},{"id":"80473","q":"In a Septic Tank, the decomposition of organic matter is primarily:","options":["Aerobic","Anaerobic","Facultative","Photolytic"],"answer":"2"},{"id":"80474","q":"Which equipment is used for the \"Size Reduction\" (Shredding) of solid waste?","options":["Trommel Screen","Hammer Mill","Magnetic Separator","Air Classifier"],"answer":"2"},{"id":"80475","q":"The ratio of Carbon to Nitrogen (C/N) ideal for \"Vermicomposting\" is:","options":["10:1","30:1","50:1","100:1"],"answer":"2"},{"id":"80476","q":"\"Leachate\" is best defined as:","options":["Liquid that drains from a landfill","Gas produced in a digester","Solid residue after incineration","Floating scum in a septic tank"],"answer":"1"},{"id":"80477","q":"The \"Self-cleansing Velocity\" in a sewer is generally taken as:","options":["0.45 m/s","0.75 m/s - 1.0 m/s","2.0 m/s","5.0 m/s"],"answer":"2"},{"id":"80478","q":"Which of the following is a \"Physical Characteristic\" of wastewater?","options":["BOD","pH","Turbidity","Nitrogen content"],"answer":"3"},{"id":"80479","q":"\"Pyrolysis\" occurs in the:","options":["Presence of excess oxygen","Absence of oxygen","Presence of water","Presence of sunlight"],"answer":"2"},{"id":"80480","q":"The \"Minamata Disease\" was caused by poisoning from:","options":["Lead","Mercury","Cadmium","Arsenic"],"answer":"2"},{"id":"80481","q":"Under the Construction and Demolition (C&D) Waste Management Rules, 2016, a \"Bulk Waste Generator\" is one who generates:","options":["More than 20 tons in one day or 300 tons in one month","More than 10 tons in one day","More than 5 tons in one day","More than 100 tons in one year"],"answer":"1"},{"id":"80482","q":"Which test uses \"Ferroin Indicator\"?","options":["BOD Test","COD Test","Hardness Test","Chlorination Test"],"answer":"2"},{"id":"80483","q":"\"Soak Pits\" are used for the disposal of:","options":["Solid Waste","Effluent from Septic Tanks","Hazardous Waste","Electronic Waste"],"answer":"2"},{"id":"80484","q":"The \"National Green Tribunal (NGT) Act\" was enacted in the year:","options":["2000","2005","2010","2015"],"answer":"3"},{"id":"80485","q":"Which of the following is an \"Attached Growth\" process in wastewater treatment?","options":["Activated Sludge Process","Oxidation Pond","Trickling Filter","Aerated Lagoon"],"answer":"3"},{"id":"80486","q":"The color code \"Blue\" in Biomedical Waste Management is for:","options":["Glassware and Metallic Body Implants","Plastic Waste","Human Anatomical Waste","Sharps"],"answer":"1"},{"id":"80487","q":"\"Itai-Itai\" disease is associated with:","options":["Mercury","Cadmium","Lead","Chromium"],"answer":"2"},{"id":"80488","q":"Which act provides for the prevention and control of water pollution in India?","options":["The Water (Prevention and Control of Pollution) Act, 1974","The Environment (Protection) Act, 1986","The Air Act, 1981","The Public Liability Insurance Act, 1991"],"answer":"1"},{"id":"80489","q":"In a \"Transfer Station\", waste is:","options":["Burned","Composted","Transferred from smaller collection vehicles to larger transport vehicles","Permanently stored"],"answer":"3"},{"id":"80490","q":"The \"Zone of Settling\" in a sedimentation tank is designed based on:","options":["Weir Loading Rate","Surface Overflow Rate","Displacement Velocity","Detention Time"],"answer":"2"},{"id":"80491","q":"\"Vermicompost\" is rich in:","options":["Heavy Metals","Methane","Nutrients like Nitrogen, Phosphorus, and Potassium","Plastics"],"answer":"3"},{"id":"80492","q":"Which of the following is a \"Greenhouse Gas\" produced from enteric fermentation in cattle?","options":["[Image-based option 1 — see original]","Methane ( )","CFCs","Nitrous Oxide"],"answer":"2"},{"id":"80493","q":"\"TCLP\" stands for:","options":["Total Characteristic Leaching Procedure","Toxicity Characteristic Leaching Procedure","Toxic Chemical Leaching Protocol","Total Chemical Loading Parameter"],"answer":"2"},{"id":"80494","q":"The \"Public Hearing\" process in EIA is exempted for:","options":["Category A projects","Projects located in Industrial Estates","River Valley Projects","Thermal Power Plants"],"answer":"2"},{"id":"80495","q":"The \"Bangalore Method\" of composting is:","options":["An Anaerobic method","An Aerobic method","A Vermicomposting method","An Incineration method"],"answer":"1"},{"id":"80496","q":"\"Fly Ash\" is a byproduct of:","options":["Hydroelectric Power Plants","Thermal Power Plants","Nuclear Power Plants","Wind Mills"],"answer":"2"},{"id":"80497","q":"Which of the following is an \"Intangible Benefit\" in Cost-Benefit Analysis?","options":["Revenue from sale of electricity","Cost of machinery","Improvement in public health and aesthetics","Salary of employees"],"answer":"3"},{"id":"80498","q":"The pH range suitable for \"Methanogenesis\" in an anaerobic digester is:","options":["4.0 - 5.0","6.6 - 7.4","8.5 - 9.5","10.0 - 12.0"],"answer":"2"},{"id":"80499","q":"\"Extended Producer Responsibility\" (EPR) is a key feature of:","options":["E-Waste Management Rules","Plastic Waste Management Rules","Battery Waste Management Rules","All of the above"],"answer":"4"},{"id":"80500","q":"A \"Trap\" in a plumbing system is used to:","options":["Prevent the backflow of water","Prevent the entry of foul gases from the sewer into the building","Reduce the water pressure","Filter suspended solids"],"answer":"2"},{"id":"80501","q":"The \"Recycling Symbol\" with the number '1' inside refers to:","options":["HDPE","PET (Polyethylene Terephthalate)","PVC","LDPE"],"answer":"2"},{"id":"80502","q":"Which of the following is NOT a characteristic of Hazardous Waste?","options":["Ignitability","Corrosivity","Reactivity","Biodegradability"],"answer":"4"},{"id":"80503","q":"\"Screening\" is the first unit operation in wastewater treatment used to remove:","options":["Floating matter and large solids","Dissolved organics","Bacteria","Grit"],"answer":"1"},{"id":"80504","q":"The \"Montreal Protocol\" aims to protect:","options":["The Ozone Layer","Wetlands","Endangered Species","Marine Life"],"answer":"1"},{"id":"80505","q":"The solid residue remaining after the incineration of waste is called:","options":["Bottom Ash","Fly Ash","Soot","Clinker"],"answer":"1"},{"id":"80506","q":"Which organism is used as an indicator of \"Fecal Pollution\" in water?","options":["Salmonella","E. coli (Escherichia coli)","Vibrio cholerae","Entamoeba"],"answer":"2"},{"id":"80507","q":"\"Proximate Analysis\" of solid waste determines:","options":["Chemical formula","Moisture, Volatile Matter, Fixed Carbon, and Ash","Elemental composition (C, H, O, N, S)","Energy content"],"answer":"2"},{"id":"80508","q":"The \"Air (Prevention and Control of Pollution) Act\" was enacted in:","options":["1974","1981","1986","2000"],"answer":"2"},{"id":"80509","q":"\"Biomedical Waste\" must be stored for a maximum period of:","options":["24 hours","48 hours","7 days","30 days"],"answer":"2"},{"id":"80510","q":"Which of the following is used to control \"Particulate Matter\" emissions from industries?","options":["Electrostatic Precipitator (ESP)","Catalytic Converter","Activated Carbon Filter","Reverse Osmosis"],"answer":"1"},{"id":"80511","q":"The \"Indore Method\" of composting involves:","options":["Anaerobic decomposition","Aerobic decomposition with turning","Deep burial","No turning"],"answer":"2"},{"id":"80512","q":"\"Black Water\" refers to wastewater originating from:","options":["Kitchen sinks","Showers and basins","Toilets (containing excreta)","Laundry"],"answer":"3"},{"id":"80513","q":"The capacity of a \"Septic Tank\" is usually designed for a detention period of:","options":["30 minutes","2 to 4 hours","24 to 48 hours","10 days"],"answer":"3"},{"id":"80514","q":"\"ISO 14001\" pertains to:","options":["Quality Management Systems","Environmental Management Systems (EMS)","Occupational Health and Safety","Information Security"],"answer":"2"},{"id":"80515","q":"A \"Manhole\" is generally provided at:","options":["Every change in alignment","Every change in gradient","Every junction of sewers","All of the above"],"answer":"4"},{"id":"80516","q":"The \"Polluter Pays Principle\" implies that:","options":["The government pays for pollution control","The polluter bears the expenses of carrying out pollution control and prevention measures","Pollution is allowed if a fee is paid","Society pays for the pollution"],"answer":"2"}];
let idx=0, answers={}, timerSec=3900, timerInt=null;

function render(){
  const q=DATA[idx];
  if(!q){document.getElementById('qText').textContent='No data.';return;}
  document.getElementById('qNum').textContent=idx+1;
  document.getElementById('qTotal').textContent=DATA.length;
  document.getElementById('qText').textContent=q.q;
  document.getElementById('opts').innerHTML=q.options.map((o,i)=>
    `<div class="option ${answers[idx]==(i+1)?'selected':''}" onclick="select(${i+1})">${String.fromCharCode(65+i)}. ${o}</div>`
  ).join('');
}
window.select=o=>{answers[idx]=o; render();};
window.prev=()=>{if(idx>0){idx--; render();}};
window.next=()=>{if(idx<DATA.length-1){idx++; render();}};

function submitTest(){
  clearInterval(timerInt);
  let c=0; for(let i=0;i<DATA.length;i++){if(answers[i]==DATA[i].answer)c++;}
  const pct=Math.round(c/DATA.length*100)||0;
  document.getElementById('qCard').classList.add('hidden');
  document.getElementById('resCard').classList.remove('hidden');
  document.getElementById('score').textContent=pct+'%';
  document.getElementById('detail').innerHTML='<b>'+c+'/'+DATA.length+'</b> correct';
}

function tick(){timerSec--; document.getElementById('timer').textContent=Math.floor(timerSec/60)+':'+String(timerSec%60).padStart(2,'0'); document.getElementById('bar').style.width=(timerSec/3900*100)+'%'; if(timerSec<=0){clearInterval(timerInt); submitTest();}}

render(); timerInt=setInterval(tick,1000);
</script>
</body></html>
