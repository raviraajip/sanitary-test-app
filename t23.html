<!DOCTYPE html>
<html lang="hi">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>ASWMO — T23 Full Test-Tech</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
:root{--bg:#0b0c15;--surface:#12142a;--text:#e4e6f0;--accent:#00e8a0;--gold:#f0c040;--danger:#ff4d6d;--border:rgba(255,255,255,.08);--muted:#8a8fa8;}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:Inter,system-ui,sans-serif;background:radial-gradient(1000px 700px at 20% 0%,#00e8a011,transparent),var(--bg);color:var(--text);min-height:100vh;line-height:1.55;}
.container{max-width:900px;margin:2rem auto;padding:0 1.2rem;}
h1{font-size:1.6rem;font-weight:700;background:linear-gradient(135deg,#fff,var(--accent));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.card{background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:16px;padding:1.5rem;margin-bottom:1rem;}
.question{font-size:1.05rem;font-weight:500;margin-bottom:.8rem;line-height:1.35;}
.options{display:grid;gap:.5rem;}
.option{padding:.7rem 1rem;background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:10px;cursor:pointer;font-size:.92rem;transition:.2s;}
.option:hover,.option.selected{border-color:var(--accent);background:rgba(0,232,160,.12);font-weight:600;}
.timer{font-family:monospace;font-weight:700;font-size:2rem;color:var(--accent);}
button{background:linear-gradient(135deg,var(--accent),#00b87e);color:#0a0c12;border:none;padding:.7rem 1.4rem;border-radius:10px;font-weight:700;cursor:pointer;}
.hidden{display:none!important}</style>
</head>
<body>
<div class="container">
<header><h1 id="ptitle">ASWMO — T23 Full Test-Tech</h1></header>

<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;">
<div><div class="timer" id="timer">65:00</div><div style="font-size:.75rem;color:var(--muted);">Time Remaining</div></div>
<button onclick="submitTest()">Submit Test</button></div>
<div style="height:6px;background:rgba(255,255,255,.1);border-radius:3px;overflow:hidden;margin-top:.5rem;"><div id="bar" style="height:100%;width:100%;background:linear-gradient(90deg,var(--accent),#00b87e);transition:width 1s linear;"></div></div></div>

<div class="card" id="qCard">
<div style="font-size:.8rem;color:var(--muted);margin-bottom:.4rem;">Question <span id="qNum">1</span> / <span id="qTotal">?</span></div>
<div class="question" id="qText">Loading...</div>
<div class="options" id="opts"></div>
<div style="margin-top:1rem;display:flex;gap:.5rem;flex-wrap:wrap;">
<button onclick="prev()">&#8592; Prev</button><button onclick="next()">Next &#8594;</button><button onclick="submitTest()">Submit</button></div>
</div>

<div class="card hidden" id="resCard" style="text-align:center;padding:2rem;">
<h2 style="color:var(--gold);font-size:2rem;">Test Completed!</h2>
<div id="score" style="font-size:3rem;font-weight:800;color:var(--accent);margin:1rem 0;"></div>
<div id="detail" style="color:var(--muted);font-size:.95rem;"></div>
<div style="margin-top:1.5rem;"><a href="index.html" style="color:var(--accent);font-weight:600;">&#8592; Back</a></div>
</div>
</div>

<script>
const DATA=[{"id":"76857","q":"The waste water from bathrooms, kitchens, washing places and wash basin, etc is called....","options":["Garbage","Sanitary sewage","Rubbish","Sullage"],"answer":"4"},{"id":"76858","q":"Bangalore method of composting solid waste involves:","options":["Facultative process","Cumulative process","Anaerobic process","Aerobic process"],"answer":"3"},{"id":"76859","q":"The term 'Refuse' generally does not include","options":["Putrescible solid waste","Excreta","Non-putrescible solid waste","Ashes"],"answer":"2"},{"id":"76860","q":"A coastal city produces Municipal Solid Waste (MSW) with high moisture content, high organic materials, low calorific value and low inorganic materials. The most effective and sustainable option for MSW management in that city is","options":["Composting","Incineration","Landfill","Dumping in sea"],"answer":"1"},{"id":"76861","q":"The maximum C/N ratio in a Municipal Solid Waste Compost is","options":["10 : 1","20 : 1","30 : 1","40 : 1"],"answer":"3"},{"id":"76862","q":"Consider the following statements regarding pyrolysis: 1. It is an irreversible chemical change brought about by the action of heat in oxygen free atmosphere. 2. Range of temperature is 500°C and 1000°C. 3. Internal heating causes organic matter to decompose physically and chemically rather than burn. 4. It is a highly exothermic process. Which of the above statements are correct?","options":["1, 2, 3 and 4","1, 3 and 4 only","2 and 4 only","1, 2 and 3 only"],"answer":"4"},{"id":"76863","q":"How is municipal solid waste classified on the basis of its source?","options":["Residential waste and industrial waste","House refuse, street refuse and trade refuse","Residential refuse and non-residential refuse","Industrial waste and non-industrial waste"],"answer":"2"},{"id":"76864","q":"The 3R principle is a concept for ----.","options":["Sanitation","Water treatment","Waste management","Plastic waste treatment"],"answer":"3"},{"id":"76865","q":"Which of the following municipal solid wastes CANNOT be recycled?","options":["Plastics","Papers","Fruit peelings","Glasses"],"answer":"3"},{"id":"76866","q":"Match the following. Bin colour Type of biomedical waste I. Yellow A. To be incinerated II. Red B. To be autoclaved III. Black C. For burial","options":["I-B, II-C, III-A","I-A, I1-C, III-B","I-A, II-B, III-C","I-B, II-A, III-C"],"answer":"3"},{"id":"76867","q":"The waste from printers, scanners, refrigerators, etc. is called","options":["industrial waste","municipal waste","e-waste","electrical waste"],"answer":"3"},{"id":"76868","q":"Which of the given options is NOT recommended as a desirable property of the transporting truck used for collection of municipal solid waste?","options":["Sharp corners and edges","Strength and durability","Water-tightness","Made of stainless steel"],"answer":"1"},{"id":"76869","q":"Some steps related to collection of municipal solid waste have been mentioned below. A. Collection by sweepers in small hand driven carts. B. Dumping into masonry chambers constructed along roadsides. C. Collection in small containers in individual houses. D. Collection into municipal trucks What is the correct sequence of the conventional system of collection of municipal solid waste, as per Indian scenario from start to end?","options":["C – B – A - D","A – C – D - B","C – A – B - D","A – D – B - C"],"answer":"3"},{"id":"76870","q":"Which of the following options is NOT considered as a component of the 3R principles of municipal solid waste management?","options":["Reduce","Recycle","Reuse","Recover"],"answer":"4"},{"id":"76871","q":"Which of the following sources of solid waste has the highest chance of causing infections like Hepatitis B and C through skin route if not handled property?","options":["Biomedical","Industrial","Electronic","Municipal"],"answer":"1"},{"id":"76872","q":"To prevent groundwater contamination, a modern sanitary landfill liner system typically consists of:","options":["A single layer of compacted soil","A Composite Liner (Geomembrane + Compacted Clay Liner","A layer of gravel only","A concrete slab"],"answer":"2"},{"id":"76873","q":"Which of the given options is the best suited condition for energy recovery from municipal solid waste?","options":["More moisture content","Presence of inorganic matter such as metal","Presence of more non-renewable resources like glass","High calorific value of solid waste"],"answer":"4"},{"id":"76874","q":"The major segregation of biomedical solid waste for safe and economic disposal is done on the basis of :","options":["color of the waste","biodegradable and non-biodegradable categories","organic and inorganic categories","hazardous and nonhazardous categories"],"answer":"4"},{"id":"76875","q":"Municipal solid waste is also known as:","options":["Municipal rubbish","leachate","street sweepings","refuse"],"answer":"4"},{"id":"76876","q":"Which of the following statements is true for trickling filter sludge?","options":["It is more difficult to dewater than activated sludge","It is bulky","It has a comparatively low concentration of sludge solids","It has a comparatively low sludge volume index"],"answer":"4"},{"id":"76877","q":"Environmental Impact Assessment (EIA) is carried out before which stage of a project?","options":["Operation","Planning","Decommissioning","Marketing"],"answer":"2"},{"id":"76878","q":"In India, EIA is legally mandated under which act?","options":["Wildlife Protection Act, 1972","Environmental Protection Act, 1986","Forest Conservation Act, 1980","Water Act, 1974"],"answer":"2"},{"id":"76879","q":"Public Hearing (PH) is mandatory under which schedule of EIA Notification 2006?","options":["For all projects","Only for Category A projects","Only for Category B1 projects","Except for projects exempted in the notification"],"answer":"4"},{"id":"76880","q":"Category A projects require clearance from:","options":["State Level Environment Impact Assessment Authority (SEIAA)","Ministry of Environment, Forest and Climate Change (MoEFCC)","Central Pollution Control Board (CPCB)","State Pollution Control Board (SPCB)"],"answer":"2"},{"id":"76881","q":"Sludge volume index is used to indicate","options":["Physical state of the sludge produced","BOD concentration","Sludge to volume ratio","Desired sludge rate"],"answer":"1"},{"id":"76882","q":"Self cleaning velocity desired to be provided for septic tanks is","options":["0.5 m/sec","0.75 m/sec","0.9 m/sec","1.05 m/sec"],"answer":"1"},{"id":"76883","q":"Soak pit is connected to","options":["manhole","septic tank","gulley trap","nahani trap"],"answer":"2"},{"id":"76884","q":"Grit chamber has a detention period of","options":["20 min to 30 min","2 hrs to 4 hrs","45 sec to 90 sec","2 min to 5 min"],"answer":"3"},{"id":"76885","q":"Activated sludge process is an example of …….. growth process.","options":["anaerobic suspended","aerobic suspended","aerobic attached","facultative attached"],"answer":"2"},{"id":"76886","q":"In activated sludge plants, Rising sludge occurs due to:","options":["Industrial waste","Low pH","De-nitrification in the settling tank","Sudden discharge of septic solids"],"answer":"3"},{"id":"76887","q":"Which of the following solid waste disposal methods is ecologically most acceptable?","options":["Sanitary landfill","incineration","composing","pyrolysis"],"answer":"3"},{"id":"76888","q":"Bulking of sludge can be controlled by","options":["Denitrification","Aeration","Coagulation","Chlorination"],"answer":"4"},{"id":"76889","q":"Lower Food to Micro-organic (F/M) ratio in a conventional activated treatment plant will mean:","options":["Lower BOD removal","Higher BOD removal","No effect on BOD removal","Medium BOD removal"],"answer":"2"},{"id":"76890","q":"Leachate is a colored liquid that comes out of","options":["Septic tanks","Sanitary land fills","Aerated lagoons","Compost plants"],"answer":"2"},{"id":"76891","q":"BOD of secondary effluent from an activated sludge plant normally will be in the range of","options":["less than 30 mg/Litre","35 to 50 mg/Litre","75 to 100 mg/Litre","100 to 125 mg/Litre"],"answer":"1"},{"id":"76892","q":"The proportion of solids in sewage is about:","options":["2.5% or more","1% or more","0.1% or less","zero"],"answer":"3"},{"id":"76893","q":"The pH value to be maintained in the digestion zone of a sludge digester is","options":["5.5 - 6.5","7 - 8","8.5 - 9.5","above 10.0"],"answer":"1"},{"id":"76894","q":"The phenomenon by virtue of which soil pores gets clogged with sewage matter is called","options":["Sewage farming","Sewage bulking","Sewage sickness","Sewage irrigation"],"answer":"3"},{"id":"76895","q":"In which one of the following tests is the organic matter in the waste water used as food by micro-organisms?","options":["BOD","Most probable number","COD","Chlorine demand"],"answer":"1"},{"id":"76896","q":"The MLSS concentration in an aeration tank is 2000 mg/ l and the sludge volume after 30 minutes of settling in a 1000 m l graduated cylinder is 176 m l . The value of sludge density index (SDI) will be nearly","options":["3.34 g/ml","2.22 g/ml","1.14 g/ml","0.26 g/ml"],"answer":"3"},{"id":"76897","q":"The spacing between bars of a coarse screen during the sewage treatment process is about:","options":["20 mm or more","30 mm or more","50 mm or more","60 mm or more"],"answer":"3"},{"id":"76898","q":"What would be the liquid capacity of a septic tank designed for 25 users? [ Take per user volume requirement as 0.1 m³]","options":["3.50 m 3","3.50 m³","2.50 m³","1.80 m³"],"answer":"3"},{"id":"76899","q":"A sedimentation tank removes 210 kg of suspended solid per day. What will be the volume of sludge produced per day if the moisture content of sludge is 95% (by weight) and specific gravity of wet sludge is 1.05?","options":["5 m³","10 m³","4 m³","20 m³"],"answer":"3"},{"id":"76900","q":"What is the full form of CETP?","options":["Common environment treatment plant","Common effluent treatment plant","Concave environmental treatment plant","Combined effluent treatment plant"],"answer":"2"},{"id":"76901","q":"Among the following treatment units, anaerobic decomposition takes place in?","options":["oxidation pond","activated sludge process","Imhoff tank","trickling filter"],"answer":"3"},{"id":"76902","q":"The detention period for oxidation ponds is usually kept as:","options":["4-8 hrs","24 hrs","10 to 15 days","3 months"],"answer":"3"},{"id":"76903","q":"A stream has flow of 20 cumec and BOD concentration of 10 mg/L receives the industrial waste water having flow of 1.5 cumecs and BOD concentration of 250 mg/L. What is the BOD concentration (mg/L) of stream at downstream point of meeting of stream with industrial waste ?","options":["2.67","12.09","13","26.74"],"answer":"4"},{"id":"76904","q":"The minimum dissolved oxygen which should always be present in water in order to save the aquatic life is:","options":["1 ppm","4 ppm","10 ppm","40 ppm"],"answer":"2"},{"id":"76905","q":"The ratio of 5 day BOD to ultimate BOD is about","options":["1/3","2/3","3/4","1.0"],"answer":"2"},{"id":"76906","q":"Sewage treatment units are normally designed for:","options":["for 5 – 10 years","for 15 – 20 years","for 30 – 40 years","for 40 – 50 years"],"answer":"2"},{"id":"76907","q":"Scoping refers to:","options":["Identifying baseline conditions","Predicting impacts","Listing key issues & preparing Terms of Reference (ToR)","Monitoring impacts"],"answer":"3"},{"id":"76908","q":"Which phase of EIA includes collection of baseline environmental data?","options":["Screening","Scoping","Impact Prediction","Assessment"],"answer":"3"},{"id":"76909","q":"Screening in EIA is:","options":["( a) Check to decide if project needs EIA","Checking health impacts","Preparing monitoring plan","Reviewing EIA document"],"answer":"1"},{"id":"76910","q":"Rapid EIA is conducted over a period of:","options":["1 week","One season except monsoon","Full year (all seasons)","Five years"],"answer":"2"},{"id":"76911","q":"EIA is fundamentally based on the principle of:","options":["Precautionary principle","Equity principle","Polluter pays principle","Intergenerational equity"],"answer":"1"},{"id":"76912","q":"Which method is widely used for impact identification in EIA?","options":["Scatter diagram","Leopold Matrix","Pareto chart","Gantt chart"],"answer":"2"},{"id":"76913","q":"EMP in EIA refers to:","options":["Environmental Manpower Plan","Environmental Monitoring Program me","Environmental Management Plan","Environmental Material Procurement"],"answer":"3"},{"id":"76914","q":"Which organization prepares EIA guidelines in India?","options":["NITI Aayog","CPCB","MoEFCC","WHO"],"answer":"3"},{"id":"76915","q":"In India, the validity of Environmental Clearance (EC) for mining projects is:","options":["5 years","10 years","20 years","30 years"],"answer":"4"},{"id":"76916","q":"Social Impact Assessment (SIA) is mandatory for:","options":["Hydropower projects only","Land acquisition under RFCTLARR Act, 2013","Category B2 projects","All infrastructure projects"],"answer":"2"},{"id":"76917","q":"Which is not a component of baseline environmental study?","options":["Air quality","Water quality","Flora & fauna","Project financial cost"],"answer":"4"},{"id":"76918","q":"In the EIA process, cumulative impact assessment primarily evaluates:","options":["Direct impacts only","Indirect impacts only","Impacts from multiple projects in a region over time","Impacts that occur only after project commissioning"],"answer":"3"},{"id":"76919","q":"The significance of an environmental impact in EIA is determined by:","options":["Magnitude × Duration only","Magnitude × Frequency only","Magnitude × Sensitivity of receptor","Magnitude × Cost of mitigation"],"answer":"3"},{"id":"76920","q":"Strategic Environmental Assessment (SEA) differs from EIA mainly because SEA:","options":["Is conducted after project approval","Addresses policies, plans & programmers’ rather than individual projects","Deals only with ecological components","Has no public participation"],"answer":"2"},{"id":"76921","q":"Which of the following is most appropriate for identifying secondary or indirect impacts?","options":["Checklists","Overlays","Network diagrams","Leopold Matrix"],"answer":"3"}];
let idx=0, answers={}, timerSec=3900, timerInt=null;

function render(){
  const q=DATA[idx];
  if(!q){document.getElementById('qText').textContent='No data.';return;}
  document.getElementById('qNum').textContent=idx+1;
  document.getElementById('qTotal').textContent=DATA.length;
  document.getElementById('qText').textContent=q.q;
  document.getElementById('opts').innerHTML=q.options.map((o,i)=>
    `<div class="option ${answers[idx]==(i+1)?'selected':''}" onclick="select(${i+1})">${String.fromCharCode(65+i)}. ${o}</div>`
  ).join('');
}
window.select=o=>{answers[idx]=o; render();};
window.prev=()=>{if(idx>0){idx--; render();}};
window.next=()=>{if(idx<DATA.length-1){idx++; render();}};

function submitTest(){
  clearInterval(timerInt);
  let c=0; for(let i=0;i<DATA.length;i++){if(answers[i]==DATA[i].answer)c++;}
  const pct=Math.round(c/DATA.length*100)||0;
  document.getElementById('qCard').classList.add('hidden');
  document.getElementById('resCard').classList.remove('hidden');
  document.getElementById('score').textContent=pct+'%';
  document.getElementById('detail').innerHTML='<b>'+c+'/'+DATA.length+'</b> correct';
}

function tick(){timerSec--; document.getElementById('timer').textContent=Math.floor(timerSec/60)+':'+String(timerSec%60).padStart(2,'0'); document.getElementById('bar').style.width=(timerSec/3900*100)+'%'; if(timerSec<=0){clearInterval(timerInt); submitTest();}}

render(); timerInt=setInterval(tick,1000);
</script>
</body></html>
