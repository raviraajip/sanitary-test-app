<!DOCTYPE html>
<html lang="hi">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>ASWMO — T03 Hazardous Waste</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
:root{--bg:#0b0c15;--surface:#12142a;--text:#e4e6f0;--accent:#00e8a0;--gold:#f0c040;--danger:#ff4d6d;--border:rgba(255,255,255,.08);--muted:#8a8fa8;}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:Inter,system-ui,sans-serif;background:radial-gradient(1000px 700px at 20% 0%,#00e8a011,transparent),var(--bg);color:var(--text);min-height:100vh;line-height:1.55;}
.container{max-width:900px;margin:2rem auto;padding:0 1.2rem;}
h1{font-size:1.6rem;font-weight:700;background:linear-gradient(135deg,#fff,var(--accent));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.card{background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:16px;padding:1.5rem;margin-bottom:1rem;}
.question{font-size:1.05rem;font-weight:500;margin-bottom:.8rem;line-height:1.35;}
.options{display:grid;gap:.5rem;}
.option{padding:.7rem 1rem;background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:10px;cursor:pointer;font-size:.92rem;transition:.2s;}
.option:hover,.option.selected{border-color:var(--accent);background:rgba(0,232,160,.12);font-weight:600;}
.timer{font-family:monospace;font-weight:700;font-size:2rem;color:var(--accent);}
button{background:linear-gradient(135deg,var(--accent),#00b87e);color:#0a0c12;border:none;padding:.7rem 1.4rem;border-radius:10px;font-weight:700;cursor:pointer;}
.hidden{display:none!important}</style>
</head>
<body>
<div class="container">
<header><h1 id="ptitle">ASWMO — T03 Hazardous Waste</h1></header>

<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;">
<div><div class="timer" id="timer">65:00</div><div style="font-size:.75rem;color:var(--muted);">Time Remaining</div></div>
<button onclick="submitTest()">Submit Test</button></div>
<div style="height:6px;background:rgba(255,255,255,.1);border-radius:3px;overflow:hidden;margin-top:.5rem;"><div id="bar" style="height:100%;width:100%;background:linear-gradient(90deg,var(--accent),#00b87e);transition:width 1s linear;"></div></div></div>

<div class="card" id="qCard">
<div style="font-size:.8rem;color:var(--muted);margin-bottom:.4rem;">Question <span id="qNum">1</span> / <span id="qTotal">?</span></div>
<div class="question" id="qText">Loading...</div>
<div class="options" id="opts"></div>
<div style="margin-top:1rem;display:flex;gap:.5rem;flex-wrap:wrap;">
<button onclick="prev()">&#8592; Prev</button><button onclick="next()">Next &#8594;</button><button onclick="submitTest()">Submit</button></div>
</div>

<div class="card hidden" id="resCard" style="text-align:center;padding:2rem;">
<h2 style="color:var(--gold);font-size:2rem;">Test Completed!</h2>
<div id="score" style="font-size:3rem;font-weight:800;color:var(--accent);margin:1rem 0;"></div>
<div id="detail" style="color:var(--muted);font-size:.95rem;"></div>
<div style="margin-top:1.5rem;"><a href="index.html" style="color:var(--accent);font-weight:600;">&#8592; Back</a></div>
</div>
</div>

<script>
const DATA=[{"id":"68588","q":"When did Hazardous waste management act enacted in India?","options":["1988","1989","1990","1991"],"answer":"2"},{"id":"68589","q":"Who is responsible for safe disposal of the generated hazardous waste?","options":["Generator","Receiver","Waste facility","TSDF"],"answer":"1"},{"id":"68590","q":"The activities of hazardous waste management facility are?","options":["OPA","HAS","TSD","SOS"],"answer":"3"},{"id":"68591","q":"Regulations for waste management is provided under subtitle C of","options":["CERLA","NPL","HPL","RCRA"],"answer":"4"},{"id":"68592","q":"Tracking of the hazardous waste is done to prevent?","options":["Export","Import","Midnight dumping","Traffic"],"answer":"3"},{"id":"68593","q":"Why is manifest system necessary?","options":["To monitor journey of waste","To track waste","To analyse chemicals","To export"],"answer":"1"},{"id":"68594","q":"Under MTCA, the process for cleaning up a hazardous waste site is","options":["SHA","NPL","HAP","SHP"],"answer":"1"},{"id":"68595","q":"According to the Solid Waste Management Rules, what is the mandatory segregation requirement for waste generators?","options":["Two streams: wet and dry.","Three streams: biodegradable, dry, and domestic hazardous.","Four streams: organic, paper, plastic, and metal.","Two streams: biodegradable and non-biodegradable."],"answer":"2"},{"id":"68596","q":"The Solid Waste Management Rules, 2024, introduce environmental compensation based on which principle?","options":["Precautionary Principle.","Polluter Pays Principle.","Zero Waste Principle.","Extended Producer Responsibility (EPR)."],"answer":"2"},{"id":"68597","q":"Under the E-Waste (Management) Amendment Rules, 2024, the Central Government may establish a platform for trading what?","options":["Waste collection permits.","EPR certificates.","Carbon credits.","Recycled materials."],"answer":"2"},{"id":"68598","q":"The active period of landfill range from years.","options":["10-25 years","20-30 years","30-40 years","40-50 years"],"answer":"1"},{"id":"68599","q":"At what flash point is liquid waste considered ignitable?","options":["< 50°C","< 60°C","< 70°C","< 80°C"],"answer":"2"},{"id":"68600","q":"Hydrological investigation has to be done for ?","options":["Landfill design","Analysis","Recovery","Collection of hydrological data"],"answer":"4"},{"id":"68601","q":"Before shipment, hazardous waste has to be properly.","options":["Packed and labelled","Sealed","Analysed","Verified"],"answer":"1"},{"id":"68602","q":"How many hazard classes should be taken into account while packing the waste?","options":["6","7","8","9"],"answer":"4"},{"id":"68603","q":"Inorganic liquid waste are best suitable in ?","options":["Plastic cans","Bags","Drums","Cans"],"answer":"1"},{"id":"68604","q":"Hazard labels are shaped. ?","options":["Rectangular","Triangular","Circular","Diamond"],"answer":"4"},{"id":"68605","q":"Labels should be at least mm square ?","options":["99","98","100","101"],"answer":"3"},{"id":"68606","q":"Incineration of HW is done at TSDF to reduce?","options":["Area","Volume","Analysis","Record keeping"],"answer":"2"},{"id":"68607","q":"An external safety audit at an incinerator facility is typically carried out once every ______ years.","options":["1","2","3","4"],"answer":"2"},{"id":"68608","q":"What type of waste does Subtitle D of RCRA regulate?","options":["Solid hazardous waste","Chemical hazardous waste","Radioactive waste","Non-hazardous solid waste"],"answer":"4"},{"id":"68609","q":"Hazardous waste Permits are typically granted for a period up to _ _____years.","options":["7","8","60","10"],"answer":"4"},{"id":"68610","q":"What is the first step in development of dose-response relationship curve?","options":["Toxicological end point","End point","Start point","Intermediate point"],"answer":"1"},{"id":"68611","q":"The toxicological end point for dose-response relationship should be","options":["Definitive","Biotech","Vague","Aerospace"],"answer":"1"},{"id":"68612","q":"According to the graph, greater the dose more the response.","options":["Severe","Less","Neutral","Adverse"],"answer":"1"},{"id":"68613","q":"The highest dose that has no harmful effect on a population is known as","options":["NOAEL","NOEL","NOAL","NOPA"],"answer":"1"},{"id":"68614","q":"As per UNEPA in 1985, waste is considered hazardous if it?","options":["Poses threat to human and environment","Specific source","Non-specific","Substance not under regulation"],"answer":"1"},{"id":"68615","q":"According to EPA hazardous mixed waste is regulated under?","options":["SARA","CERCLA","RCRA","NPL"],"answer":"3"},{"id":"68616","q":"Under Schedule II of the Hazardous and Other Wastes (Management and Transboundary Movement) Rules, 2016, Class C2 focuses on which characteristic?","options":["Corrosivity","Flammability","Toxicity","Reactivity"],"answer":"1"},{"id":"68617","q":"What is the maximum concentration limit (in mg/L) for the Class A1 element according to Schedule II of the Hazardous Waste Management Rules?","options":["2","3","4","5"],"answer":"4"},{"id":"68618","q":"When did the Toxic Substances Control Act came into force?","options":["1974","1975","1976","1977"],"answer":"3"},{"id":"68619","q":"What is the purpose of TSCA compliance monitoring program?","options":["Inspection","Analysis","Import","Export"],"answer":"1"},{"id":"68620","q":"_______ plays a major role in the regulation of most industrial chemicals in the US.","options":["RCRA inventory","SARA inventory","CERCLA inventory","TSCA inventory"],"answer":"4"},{"id":"68621","q":"Any chemical that is not on the Inventory is considered as ________","options":["New chemical substance","Old chemical substance","Existing chemical substance","Flag chemical substance"],"answer":"1"},{"id":"68622","q":"The chemicals are added to the Inventory only after?","options":["Receiving complete NOC by EPA","Receiving complete NOC by UNEPA","Receiving complete DOC by EPA","Receiving complete NOOC by USEPA"],"answer":"1"},{"id":"68623","q":"EPA's collecting of the public TSCA Inventory information is updated a year.","options":["Once","Twice","Thrice","Four times"],"answer":"2"},{"id":"68624","q":"11. What is the aim of TSCA?","options":["Regulation new chemicals","Classification of new chemicals","Export of new chemicals","Import of new chemicals"],"answer":"1"},{"id":"68625","q":"The program for the cleanup of closed or abandoned hazardous waste sites is administered by EPA .","options":["Superfund","HZAMAT","NPL","HPS"],"answer":"1"},{"id":"68626","q":"Which policy offers a national framework for waste management and resource recovery in Australia?","options":["National hazard policy","National waste policy","National policy","Environmental policy"],"answer":"2"},{"id":"68627","q":"Which act is responsible for reducing pollution at source?","options":["NGER","ΝΕΡΜ","Pollution prevention act","Waste reduction act"],"answer":"3"},{"id":"68628","q":"_______ law covers the discharge of waste into environment in NY.","options":["HWRP","HARP","HRPA","HPRA"],"answer":"1"},{"id":"68629","q":"Which of the following HW cannot be recycled?","options":["Used oil","Treatment waste","Paints","Batteries"],"answer":"2"},{"id":"68630","q":"Which of the following techniques can be implemented to reduce hazardous waste?","options":["Analysis","Transportation","Trans boundary movement","Chemical exchange"],"answer":"4"},{"id":"68631","q":"Which approach should be considered to reduce the impact of waste on the environment?","options":["LCA (Life Cycle Analysis)","NPL (National Priorities List)","CERCLA (Comprehensive Environmental Response, Compensation, and Liability Act)","RCRA (Resource Conservation and Recovery Act)"],"answer":"1"},{"id":"68632","q":"When was The National Environmental Policy Act was signed into law?","options":["January 1, 1970","January 2, 1970","January 1, 1971","January 1, 1972"],"answer":"1"},{"id":"68633","q":"What do Section 102 in Title I of the NEPA Act requires?","options":["Risk assessment","environmental considerations in their planning","Risk analysis","Site clean-up"],"answer":"2"},{"id":"68634","q":"The National Environmental Policy Act (NEPA) is ________environmental law.","options":["United States","United Kingdom","Indian","Australian"],"answer":"1"},{"id":"68635","q":"What are three levels of analysis that a federal agency must undertake to comply with the law NEPA?","options":["CatEx, EA and EIS","Fax, IA and SOF","CatEx and EIS","EIS and EIA"],"answer":"1"},{"id":"68636","q":"Safety and Health Achievement Recognition Program (SHARP) recognizes","options":["Small employers who operate safety and health management system","Large employers who operate safety and health management system","All employers who operate safety and health management system","Workers who operate safety and health management system"],"answer":"1"},{"id":"68637","q":"In 2016, the EPA announced final updates to its New Source Performance Standards (NSPS) to reduce emissions of which type of landfill gas?","options":["Sulphur-rich","TSDF & Monitoring in TSDF","Methane-rich","E-waste Regulation & Injection Well Disposal"],"answer":"3"},{"id":"81064","q":"In the context of the transport of hazardous waste, what does \"TREM Card\" stand for?","options":["Transport Emergency Card","Transport Environment Management Card","Transit Emission Monitoring Card","Toxic Release Emergency Measure"],"answer":"1"},{"id":"81065","q":"As per the Hazardous Waste Management Rules, 2016, a waste generator can store hazardous waste for a maximum period of:","options":["45 days","60 days","90 days","180 days"],"answer":"3"},{"id":"81066","q":"The \"Manifest System\" for the movement of hazardous waste within the country requires how many copies (color-coded) to be generated?","options":["3 Copies","5 Copies","6 Copies","7 Copies"],"answer":"4"},{"id":"81067","q":"Which form is used for filing the \"Annual Return\" by the hazardous waste generator to the State Pollution Control Board?","options":["Form 3","Form 4","Form 5","Form 10"],"answer":"2"},{"id":"81068","q":"The toxicity of a hazardous waste is often measured using the \"LD50\" value. What does \"LD50\" signify?","options":["Lethal Dose that kills 50% of the test population","Lethal Duration of 50 minutes","Low Dose affecting 50 species","Level of Danger 50"],"answer":"1"},{"id":"81069","q":"In a \"Secure Landfill\" for hazardous waste, the double liner system typically consists of:","options":["Two layers of sand","A primary HDPE geomembrane and a secondary compacted clay liner (or GCL)","A single layer of concrete","Two layers of gravel"],"answer":"2"},{"id":"81070","q":"Which process involves the addition of reagents to a liquid hazardous waste to produce a chemically stable solid product?","options":["Vitrification","Incineration","Stabilization / Solidification","Pyrolysis"],"answer":"3"},{"id":"81071","q":"Hazardous waste containing \"Mercury\" (e.g., thermometer waste) requires which specific treatment method?","options":["Incineration at","Retorting (Thermal Desorption) and Recovery","Open burning","Composting"],"answer":"2"},{"id":"81072","q":"Under the Hazardous Waste Rules, \"Schedule I\" lists hazardous wastes based on:","options":["Industrial processes generating the waste","Concentration of hazardous substances","List of waste to be imported","List of exempt wastes"],"answer":"1"},{"id":"81073","q":"\"Leachate Collection System\" is a mandatory component of:","options":["Secured Landfill","Incinerator","Transfer Station","Recycling Plant"],"answer":"1"},{"id":"81074","q":"For the construction of a hazardous waste landfill, the bottom liner must have a permeability coefficient (k) less than:","options":["cm/sec","cm/sec","cm/sec","cm/sec"],"answer":"4"},{"id":"81075","q":"Which of the following color codes is used for the \"Manifest Copy\" intended for the transporter?","options":["White","Yellow","Pink","Orange"],"answer":"4"},{"id":"81076","q":"\"Pantograph\" or \"Fingerprint Analysis\" of hazardous waste is done to:","options":["Identify the person who generated it","Verify the composition of waste against the declared parameters","Check the fingerprints of the driver","Measure the weight of the truck"],"answer":"2"},{"id":"81077","q":"Which hazardous waste treatment method uses high-temperature oxidation to destroy organic contaminants?","options":["Autoclaving","Incineration","Encapsulation","Landfarming"],"answer":"2"},{"id":"81078","q":"The \"Rotterdam Convention\" primarily deals with:","options":["Prior Informed Consent (PIC) procedure for certain hazardous chemicals and pesticides","Reduction of Persistent Organic Pollutants (POPs)","Prevention of Marine Pollution","Protection of Ozone Layer"],"answer":"1"}];
let idx=0, answers={}, timerSec=3900, timerInt=null;

function render(){
  const q=DATA[idx];
  if(!q){document.getElementById('qText').textContent='No data.';return;}
  document.getElementById('qNum').textContent=idx+1;
  document.getElementById('qTotal').textContent=DATA.length;
  document.getElementById('qText').textContent=q.q;
  document.getElementById('opts').innerHTML=q.options.map((o,i)=>
    `<div class="option ${answers[idx]==(i+1)?'selected':''}" onclick="select(${i+1})">${String.fromCharCode(65+i)}. ${o}</div>`
  ).join('');
}
window.select=o=>{answers[idx]=o; render();};
window.prev=()=>{if(idx>0){idx--; render();}};
window.next=()=>{if(idx<DATA.length-1){idx++; render();}};

function submitTest(){
  clearInterval(timerInt);
  let c=0; for(let i=0;i<DATA.length;i++){if(answers[i]==DATA[i].answer)c++;}
  const pct=Math.round(c/DATA.length*100)||0;
  document.getElementById('qCard').classList.add('hidden');
  document.getElementById('resCard').classList.remove('hidden');
  document.getElementById('score').textContent=pct+'%';
  document.getElementById('detail').innerHTML='<b>'+c+'/'+DATA.length+'</b> correct';
}

function tick(){timerSec--; document.getElementById('timer').textContent=Math.floor(timerSec/60)+':'+String(timerSec%60).padStart(2,'0'); document.getElementById('bar').style.width=(timerSec/3900*100)+'%'; if(timerSec<=0){clearInterval(timerInt); submitTest();}}

render(); timerInt=setInterval(tick,1000);
</script>
</body></html>
