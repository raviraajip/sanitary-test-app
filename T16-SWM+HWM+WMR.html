<script>
const DATA=[{"id":"73959","q":"Which of the following conditions is not suitable for the disposal of excreta or sewage?","options":["The waste does not pollute the ground surface","It is not exposed to the atmosphere","It should be accessible for children","It does not give odour nuisance"],"answer":"3","solution":"Answer: c Solution: The place and criteria for the disposal of waste play a major role. It should be off the sight of the people so it doesn't cause displease for the vision and it must not be accessible for children and household pets with respect to health aspects."},{"id":"73960","q":"Which of the following is an advantage of the conservancy system over water carriage system?","options":["Labour force","Water consumption","Compact house design","Spread of epidemic"],"answer":"2","solution":"Answer: b Solution: In the conservancy system, compact house design is not possible, a large labor force is required and there is a spread of an epidemic. Hence, little water consumption is an advantage of the conservancy system over water carriage system."},{"id":"73961","q":"What is an artificial channel for conveying water, typically in the form of a bridge across a valley or other gap called?","options":["Aquifer","Canals","Aqueduct","Tunnel"],"answer":"3","solution":"Answer: c Solution: An aqueduct is an artificial channel or structure, often in the form of a bridge, built to convey water from one place to another, particularly across a valley or other gap. An aquifer is an underground layer of water-bearing permeable rock, rock fractures, or unconsolidated materials (gravel, sand, or silt). A canal is a man-made waterway for transportation or irrigation. A tunnel is an underground passageway."},{"id":"73962","q":"What is the wastewater flow in a sewer system during the periods of dry weather with minimum infiltration called?","options":["Wet weather flow","Dry weather flow","Wet flow","Dry flow"],"answer":"2","solution":"Correct (b): Explanation: Ash is the solid residue remaining after combustion. Bottom ash is the heavier residue, and fly ash is the fine particulate collected from the flue gas, both of which are forms of residue. Dry weather flow (DWF) is the wastewater flow in a sewer system during periods of dry weather when there is minimal infiltration of groundwater or rainwater. It primarily consists of domestic and industrial wastewater. In contrast, wet weather flow (WWF) includes DWF plus stormwater runoff and other flows that enter the sewer system during or after a rain event."},{"id":"73963","q":"The quantity of sanitary sewage entering the sewers would be ______ the total quantity of water supplied.","options":["Less than","Equal to","More than","Greater than"],"answer":"1","solution":"correct (a) The quantity of sanitary sewage entering the sewers is typically less than the total quantity of water supplied. This is because some of the supplied water is used for purposes that do not result in it entering the sewage system, such as evaporation, leaks, gardening, and consumption by people and animals."},{"id":"73964","q":"What is the lowest wastewater flow in hospitals?","options":["50 lpcd","700 lpcd","900 lpcd","40 lpcd"],"answer":"4","solution":"Correct (d) : The lowest wastewater flow in hospitals is typically 40 lpcd (liters per capita per day). This value represents the minimum amount of wastewater generated per person per day in a hospital setting. The other options are either in different units (lpcd - gallons per capita per day) or represent higher flow rates."},{"id":"73965","q":"Which of these equations is used to calculate the water velocity inside of a pipe ?","options":["A=Q/I","V=0.408Q/(D 2 )","L=C \u2217 Q","Q=A \u2217 V"],"answer":"2","solution":"correct (b) . Explanation The first formula is used to calculate the infiltration area. The third formula is used to calculate the load of wastewater. The fourth formula is used to calculate the rate of flow. The second formula is used to calculate the velocity of flow inside of a pipe (V) where Q stands for flow rate of water inside pipe and D stands for pipe diameter (inside)."},{"id":"73966","q":"What is the maximum allowable velocity in public water mains?","options":["3 ft/sec","8 ft/sec","10 ft/sec","12 ft/sec"],"answer":"2","solution":"correct (b) Explanation: The velocity of 3 ft/sec is considered to be minimum to keep the foreign particles moving in sewers. The Washington State Department of Health (DOH) recommends a maximum velocity of 8 ft/sec but permits greater velocities during fire flow conditions."},{"id":"73967","q":"Storm water is collected from streets into the ______ which in turn discharged into main drains of open type.","options":["Link drains","Lateral drains","Sub mains","Interseptal mains"],"answer":"2","solution":"correct (b). Explanation: Stormwater is collected from streets and flows into lateral drains. These lateral drains then discharge the water into main drains of an open type. Lateral drains are the smaller drains that collect water from a specific area before it is conveyed to a larger main drain."},{"id":"73968","q":"Which of the following is considered if sewers are placed on the softer grounds?","options":["The trench is excavated to confirm the shape of the pipe","Sewers are laid embedded in the concrete","The width of the trench is kept to 15 cm","The desired slope is considered"],"answer":"2","solution":"Correct (b). When sewers are placed on soft ground, it is necessary to provide a stable foundation to prevent the pipe from settling or moving. Embedding the sewers in concrete provides a rigid and durable base that distributes the load and protects the pipe from the surrounding unstable soil. This method, known as a concrete cradle or encasement, is a common practice to ensure the long-term stability and integrity of the sewer system in challenging ground conditions."},{"id":"73969","q":"What is the value of bazins constant (k) for very smooth surface?","options":["0.11","0.12","0.13","0.14"],"answer":"1","solution":"Correct (a): According to the provided table, the Bazin's constant (K) for different surfaces is as follows: Very smooth surfaces: 0.11 Smooth brick and concrete surfaces: 0.29 Rough brick and concrete surfaces: 0.50 Smooth rubble and masonry surfaces: 0.83 Good earthen channels: 1.54 Rough earthen channels: 3.17"},{"id":"73970","q":"The abbreviation of SUE is?","options":["Subsurface utility engineering","Surface utility engineering","Storm usage engineering","Storm utility engineering"],"answer":"1","solution":"Correct (a) Subsurface Utility Engineering (SUE) is an engineering practice that involves the management of risks related to underground utilities during construction projects. It combines civil engineering, surveying, and geophysics to accurately locate and map buried utilities. This process helps to prevent damage to existing utilities, which can lead to project delays, property damage, and other issue."},{"id":"73971","q":"Which pump among the ones mentioned below can be located above the suction reservoir without an external priming system?","options":["Slurry pumps","Self-priming pumps","Submersible pumps","Trash pumps"],"answer":"2","solution":"Correct (b) Explanation: Priming is the process of filling a pump with the fluid to be pumped to ensure that it operates correctly. Most pumps, particularly centrifugal pumps, need to be primed before they can operate, as they cannot pump air. A self-priming pump is specifically designed with an internal casing that retains a certain amount of liquid after the pump is shut down. This liquid is used to mix with the air in the suction line during the next startup, allowing the pump to create a vacuum and lift the fluid from the reservoir without the need for an external priming system."},{"id":"73972","q":"A grit chamber is usually installed ______ primary sedimentation tanks.","options":["Before","After","In between","In"],"answer":"1","solution":"correct (a) A grit chamber is a part of a sewage treatment plant that is installed before the primary sedimentation tanks. Its purpose is to remove heavy inorganic solids such as sand, gravel, and grit from the wastewater, which could otherwise damage pumps and other mechanical equipment in the subsequent treatment stages."},{"id":"73973","q":"Stoke's law holds good for Reynolds's number ______.","options":["Less than 1","Equal to 1","Greater than 1","Nearer to 1"],"answer":"1","solution":"Correct (a): Stoke's law is a formula used to calculate the drag force on a spherical object in a viscous fluid. The law is valid for very slow fluid motion, which corresponds to a low Reynolds number. Specifically, Stoke's law holds good for a Reynolds number less than 1."},{"id":"73974","q":"What is type IV settling also called as?","options":["Zone settling","Hindered settling","Compression settling","Expansion settling"],"answer":"3","solution":"Correct (c) Compression settling, also known as Type IV settling, occurs when the concentration of particles is very high, and the particles are in physical contact with each other. This type of settling is typically found in the secondary sedimentation tank following a trickling filter. During this process, the settled particles are subjected to a consolidating force that tends to pack them more densely."},{"id":"73975","q":"In the sedimentation processes of a water treatment unit, zone settling refers to:","options":["sedimentation of discrete particles in a suspension of low solids concentration","flocculent suspension of high concentration","flocculent suspension of intermediate concentration","dilute suspension of particles that coalesce or flocculate during the sedimentation process"],"answer":"3","solution":"Correct (c) There are several types of settling. Type 1 or \"discrete settling\" is the sedimentation of discrete particles in a suspension of low solids concentration. Type 2 or hindered settling is a flocculent suspension of high concentration. Type 3 or zone settling is a flocculent suspension of intermediate concentration where particles are close enough to interact and form flocs, settling as a zone. Type 4 or \"compression settling\" relates to a dilute suspension of particles that coalesce or flocculate during the sedimentation process. \"Zone settling\" refers to a flocculent suspension of intermediate concentration where particles interact to form clumps or flocs which settle as a group or zone."},{"id":"73976","q":"A Bioretention Facility (Rain Garden) is an example of a Best Management Practice (BMP) primarily used for:","options":["Removing pathogens through UV disinfection","Filtering and infiltrating stormwater runoff to reduce non-point source pollution","Aerating sludge prior to land application","Preventing industrial wastewater spills"],"answer":"2","solution":"correct (b) A bioretention facility, or rain garden, is a type of Best Management Practice (BMP) designed to manage stormwater runoff. It uses a vegetated depression to collect and filter stormwater, allowing it to slowly infiltrate into the ground. This process helps to remove pollutants and reduce the volume of runoff, thereby mitigating non-point source pollution."},{"id":"73977","q":"Why is the Food-to-Microorganism (F/M) ratio a critical operational parameter in the Activated Sludge process?","options":["It ensures the wastewater has a high enough pH for pathogen destruction.","It balances the supply of organic food with the consuming microbial biomass.","It determines the required amount of chlorine for final disinfection.","It measures the total flow rate of the incoming raw sewage."],"answer":"2","solution":"Answer: (b) Explanation: The Food-to-Microorganism (F/M) ratio is a crucial parameter in the activated sludge process because it represents the relationship between the amount of biodegradable organic matter (food) entering the system and the amount of microorganisms (biomass) available to consume it. Maintaining the correct F/M ratio is essential for the health and efficiency of the microbial population, which is responsible for treating the wastewater. A balanced ratio ensures that the microorganisms have enough food to remain active and reproduce, but not so much that they become overwhelmed, leading to poor treatment and sludge bulking."},{"id":"73978","q":"A key regulatory driver for the separation of sanitary sewage from stormwater in new infrastructure is to prevent:","options":["Odour complaints from treatment plant neighbours.","Combined Sewer Overflows (CSOs) that discharge untreated waste into waterways.","Excessive sludge production in the clarifier.","Damage to bar screens and comminutors."],"answer":"2","solution":"correct answer (b) Explanation : Combined sewer systems are designed to carry both sanitary sewage and stormwater in a single pipe network. During heavy rainfall, the volume of water can exceed the capacity of the system, leading to a Combined Sewer Overflow (CSO). This overflow is a discharge of untreated wastewater, which can include raw sewage, into nearby waterways, posing risks to public health and the environment. To prevent this, regulations often require the separation of sanitary sewage and stormwater in new infrastructure, creating separate systems for each."},{"id":"73979","q":"What is the primary management difference between a Conditionally Exempt Small Quantity Generator (CESQG) and a Large Quantity Generator (LQG)?","options":["CESQGs are completely exempt from RCRA regulations, including the manifest system.","LQGs are regulated by state laws, while CESQGs are regulated by federal laws.","CESQGs must treat all of their waste on-site, whereas LQGs must ship it off-site.","LQGs can store waste indefinitely, while CESQGs have a strict 90-day limit."],"answer":"1","solution":"correct (a) Explanation Conditionally Exempt Small Quantity Generators (CESQGs) generate less than 100 kg of hazardous waste per month and are exempt from most of the Resource Conservation and Recovery Act (RCRA) regulations as long as they comply with certain conditions. This includes not having to use the hazardous waste manifest system. Large Quantity Generators (LQGs) generate more than 1,000 kg of hazardous waste per month and are subject to the full RCRA regulations, including the use of a manifest system for tracking waste shipments."},{"id":"73980","q":"What is the main concern with the long-term disposal of hazardous waste via Deep Well Injection?","options":["Release of methane gas (CH4) into the atmosphere.","Potential contamination of underground sources of drinking water (USDW).","Inefficient removal of volatile organic compounds (VOCs).","High surface area requirements and visible site impact."],"answer":"2","solution":"correct (b). The main concern with the long-term disposal of hazardous waste via deep well injection is the potential for contamination of underground sources of drinking water. Deep well injection involves injecting hazardous and non-hazardous waste into deep, isolated rock formations below the lowermost underground source of drinking water (USDW). These formations are separated from drinking water sources by layers of impermeable clay and rock. However, there is a risk that the injected waste could migrate upward or laterally and contaminate the drinking water supply."},{"id":"73981","q":"The purpose of the Polymer Addition step in sludge dewatering is to:","options":["Bind fine solid particles into larger, more cohesive clumps (flocs).","Increase the flowability of the sludge for pumping.","Disinfect the sludge prior to final land application.","Reduce the concentration of heavy metals through chemical precipitation."],"answer":"1","solution":"Correct (a ) The purpose of adding polymers during sludge dewatering is to condition the sludge. This process, also known as flocculation, involves adding a chemical polymer to the sludge to cause the fine solid particles to clump together. These clumps, called flocs, are larger and more cohesive, which makes it easier to separate the solids from the liquid during the dewatering process. This improves the efficiency of dewatering methods such as belt presses, centrifuges, or filter."},{"id":"73982","q":"A key benefit of a Sequencing Batch Reactor (SBR) over a conventional Activated Sludge system is that it:","options":["Continuously discharges effluent, requiring constant monitoring.","Is only suitable for very large, high-flow municipal treatment plants.","Requires a secondary clarifier and separate equalization basin.","Combines all stages (filling, aeration, settling, drawing) into a single tank, simplifying infrastructure."],"answer":"4","solution":"Integrated Process: The primary advantage of a Sequencing Batch Reactor (SBR) is its ability to perform all treatment steps\u2014filling, aeration (react), settling, and drawing (decant)\u2014in a single reactor tank. Reduced Footprint: Because it acts as both a biological reactor and a clarifier, it eliminates the need for separate secondary clarifiers and return activated sludge pumps, significantly reducing the system's physical footprint and infrastructure costs. Operational Flexibility: The time-based cycles can be easily adjusted to optimize for specific goals like nutrient removal (nitrogen and phosphorus) without changing the physical hardware."},{"id":"73983","q":"In the context of liquid waste management, a Constructed Wetland serves which primary function?","options":["Physical/biological polishing of effluent to remove residual BOD, TSS, and nutrients.","Pre-treatment of raw sewage by removing large solids.","On-site incineration of dewatered sludge.","Rapid disinfection using chemical oxidants."],"answer":"1","solution":"Correct (a) Constructed wetlands are an eco-friendly and cost-effective wastewater treatment technology that uses natural processes involving vegetation, soil, and associated microbial assemblages to treat wastewater. Their primary function is to serve as a \"polishing\" step, which is a tertiary treatment process for removing residual contaminants from wastewater that has already undergone primary and secondary treatment. This process involves the physical and biological removal of pollutants such as Biochemical Oxygen Demand (BOD), Total Suspended Solids (TSS), and nutrients like nitrogen and phosphorus."},{"id":"73984","q":"Which of the following scenarios would necessitate a Type C Corrective Action under RCRA?","options":["A Conditionally Exempt Small Quantity Generator (CESQG) incorrectly labelling a satellite accumulation area container.","A permitted Treatment, Storage, and Disposal (TSD) facility with a confirmed release of hazardous waste into the environment.","A transporter losing a hazardous waste manifest during shipment.","A generator exceeding their monthly hazardous waste generation limit."],"answer":"2","solution":"correct (b): Explanation: Under the Resource Conservation and Recovery Act (RCRA), corrective actions are required for releases of hazardous waste or hazardous constituents into the environment from solid waste management units (SWMUs) at permitted Treatment, Storage, and Disposal (TSD) facilities. A confirmed release of hazardous waste into the environment from a TSD facility would necessitate a corrective action. The other scenarios listed do not typically require a Type C corrective action under RCRA."},{"id":"73985","q":"Which type of hazardous waste treatment process involves injecting air into contaminated groundwater to strip volatile organic compounds (VOCs)?","options":["Pump and treat followed by Activated Sludge.","In-situ Solidification/Stabilization.","Chemical Oxidation using Ozone.","Air Sparging or Air Stripping."],"answer":"4","solution":"Correct (d) Air sparging is an in-situ remediation technology that involves injecting air into the subsurface saturated zone to transfer volatile organic compounds (VOCs) from a dissolved state to a vapor phase. This process is also known as air stripping. The injected air bubbles rise through the contaminated groundwater, causing the VOCs to volatilize and move into the air phase. The vaporized contaminants are then typically removed from the unsaturated zone using a soil vapor extraction system."},{"id":"73986","q":"A key challenge in the management of stormwater from industrial sites (regulated under NPDES Stormwater Permits) is the potential for Hotspot Contaminants which include:","options":["Biochemical Oxygen Demand (BOD) and total coliform bacteria.","High concentrations of dissolved salts and total suspended solids (TSS).","Large amounts of non-hazardous leaves and yard debris.","Heavy metals (Cu, Zn, Pb) and oil/grease from vehicle maintenance and storage areas."],"answer":"4","solution":"Correct: (d) Explanation: \"Hotspot contaminants\" are pollutants that are typically found in higher concentrations in stormwater runoff from specific industrial activities. Heavy metals (such as copper, zinc, and lead) and oil/grease are common contaminants associated with vehicle maintenance and storage areas at industrial sites. These are considered \"hotspots\" because they are a concentrated source of these specific pollutants."},{"id":"73987","q":"What specialized wastewater treatment method involves the use of granular media, often sand or activated carbon, to physically filter and/or adsorb contaminants from effluent after secondary treatment?","options":["Deep Bed Filtration","Primary Clarification","Anaerobic Sequencing Batch Reactor (ASBR)","Sludge Thickening."],"answer":"1","solution":"correct (a) Filtration, such as deep bed sand filtration or multimedia filtration, is a tertiary process used to remove residual total suspended solids (TSS) and associated BOD/pathogens, 'polishing' the effluent."},{"id":"73988","q":"Why is the Gas Collection and Control System (GCCS) at a RCRA Subtitle D landfill operated under a negative pressure?","options":["To enhance the biological activity of the anaerobic microbes in the landfill cell.","To compress the gas for easier transportation via pipeline to a processing facility.","To increase the energy content of the methane (CH_4) captured for flaring or energy recovery.","To prevent fugitive gas emissions from migrating laterally into the surrounding environment and structures."],"answer":"4","solution":"Correct (d) The Gas Collection and Control System (GCCS) in a landfill is operated under a negative pressure to create a vacuum effect. This ensures that the landfill gas, which contains methane and other volatile organic compounds, is drawn into the collection system rather than escaping through the landfill cover or into the surrounding soil. By maintaining negative pressure, the system prevents the migration of these gases, which can be a safety hazard and a source of environmental pollution."},{"id":"73989","q":"The RCRA P-list code P071 is assigned to which acutely hazardous discarded commercial chemical product?","options":["Methyl parathion.","Nickel carbonyl.","Nicotine.","Mercury (elemental)."],"answer":"1","solution":"The RCRA P-list (specifically found at 40 CFR \u00a7 261.33) identifies acutely hazardous discarded commercial chemical products. The code P071 is assigned specifically to Methyl parathion (O,O-Dimethyl O-(4-nitrophenyl) phosphorothioate), a potent organophosphate insecticide."},{"id":"73990","q":"In a municipal wastewater treatment plant, which factor will cause the largest decrease in the Standard Oxygen Transfer Efficiency (SOTE) of an aeration system?","options":["Switching from fine-bubble diffusers to coarse-bubble diffusers.","Increasing the water depth of the aeration basin.","Reducing the air flow rate to the diffusers.","Decreasing the water temperature from 20\u00b0C to 10\u00b0C."],"answer":"1","solution":"CORRECRT (A): The Standard Oxygen Transfer Efficiency (SOTE) is a measure of how effectively oxygen is transferred from the air into the wastewater. Fine-bubble diffusers produce smaller bubbles with a larger surface area-to-volume ratio compared to coarse-bubble diffusers. This increased surface area allows for a more efficient transfer of oxygen. Therefore, switching from fine-bubble diffusers to coarse-bubble diffusers will create larger bubbles with less surface area, leading to a significant decrease in the SOTE."},{"id":"73991","q":"Under the Comprehensive Environmental Response, Compensation, and Liability Act (CERCLA or Superfund), the liability standard for Potentially Responsible Parties (PRPs) is defined as:","options":["Joint and Several, but Limited to the amount of waste contributed by the PRP.","Fault-based, requiring the EPA to prove negligence in the waste disposal process.","Strict, Joint and Several, and Retroactive.","Limited liability, provided the PRP followed all applicable laws at the time of disposal."],"answer":"3","solution":"Correct Answer: (c): The Comprehensive Environmental Response, Compensation, and Liability Act (CERCLA), also known as Superfund, establishes a liability standard for Potentially Responsible Parties (PRPs) that is strict, joint and several, and retroactive. Strict liability means that a PRP can be held liable regardless of fault or negligence. Joint and several liability means that any single PRP can be held responsible for the entire cleanup cost, even if they only contributed a small amount of the hazardous waste. Retroactive liability means that PRPs can be held responsible for actions that were legal at the time they occurred."},{"id":"73992","q":"During the pre-treatment of feed water for Reverse Osmosis (RO) membranes, which chemical is typically dosed to prevent membrane biofouling without causing downstream membrane damage?","options":["Alum (Al 2 (SO 4 ) 3 )","Chlorine (Cl 2 )","Glutaraldehyde (C 5 H 8 O 2 )","Sodium Bisulfite (NaHSO 3 )"],"answer":"3","solution":"Correct Answer: (c). Explanation: Glutaraldehyde is a biocide commonly used in the pre-treatment of feed water for Reverse Osmosis (RO) membranes. It is effective at preventing biofouling (the growth of microorganisms) without causing damage to the RO membranes themselves. While chlorine is also a biocide, it can damage the polyamide membranes used in RO systems and must be removed before the water reaches the membrane. Alum is a coagulant used to remove suspended solids, and sodium bisulfite is a dechlorinating agent."},{"id":"73993","q":"Thermal Desorption Units (TDUs) are used to treat hazardous wastes by:","options":["Chemically destroying organic contaminants by oxidation at temperatures above 1000\u00b0C.","Neutralizing corrosive waste by mixing it with inert high-pH lime.","Melting the waste into a glassy slag to solidify heavy metals.","Physically separating volatile and semi-volatile organic contaminants from the soil or sludge matrix."],"answer":"4","solution":"Correct Answer: (d) Thermal Desorption Units (TDUs) use heat to physically separate organic contaminants from a solid matrix like soil or sludge. The process heats the waste to a temperature high enough to volatilize the contaminants, which are then collected and treated separately. This is a physical separation process, not a chemical destruction process."},{"id":"73994","q":"The necessity of adding Seed biomass to a BOD5 test sample is primarily to ensure that:","options":["Nitrification (nitrogenous demand) is completely suppressed.","The sample contains sufficient microorganisms to degrade the organic matter.","The test measures only COD and not BOD.","The DO (Dissolved Oxygen) concentration is 0 mg/L at the beginning of the test."],"answer":"2","solution":"Correct Answer: (b) The purpose of adding seed biomass to a (BOD 5 ) (Biochemical Oxygen Demand) test sample is to introduce a sufficient population of microorganisms. These microorganisms are essential for the biological degradation of the organic matter present in the water sample. The BOD 5 test measures the amount of oxygen consumed by these microorganisms as they break down the organic pollutants over a five-day period. If the sample itself does not contain enough microorganisms, the test would not accurately reflect the true biochemical oxygen demands."},{"id":"73995","q":"A key challenge in implementing Ion Exchange (IX) technology for treating industrial wastewater is the potential for:","options":["Ineffective removal of heavy metal ions.","High residual BOD that poisons the resin.","High energy consumption due to the need for high pressures.","The generation of a concentrated, highly toxic regeneration brine requiring specialized hazardous waste treatment."],"answer":"4","solution":"Correct Answer: (d) Explanation: Ion exchange (IX) technology is effective for removing heavy metal ions and other contaminants from wastewater. However, a significant challenge is the regeneration of the resin. During this process, the captured contaminants are released, creating a concentrated, highly toxic waste stream known as regeneration brine. This brine requires specialized and often costly hazardous waste treatment and disposal, which is a major operational challenge and can be a significant cost factor in implementing IX technology for industrial wastewater treatment."},{"id":"73996","q":"A solid waste is characterized as hazardous by the Toxicity Characteristic (TCLP for lead (D008)). What is the primary mandated Land Disposal Restriction (LDR) treatment standard for this waste before it can be landfilled?","options":["Incineration to achieve 99.99% Destruction and Removal Efficiency (DRE).","Solidification/Stabilization (S/S) to meet a specific concentration limit for lead in the leachate.","Deep well injection into a Class I non-hazardous well.","Neutralization to a pH between 6.0 and 9.0."],"answer":"2","solution":"Correct: (b). Explanation: The Land Disposal Restrictions (LDR) program, under the Resource Conservation and Recovery Act (RCRA), requires that hazardous wastes be treated to specific standards before they can be landfilled. For wastes that are hazardous due to the presence of lead (D008), the primary mandated treatment standard is solidification/stabilization (S/S). This process reduces the mobility and leachability of the lead, ensuring that it meets the required concentration limits in the leachate before disposal."},{"id":"73997","q":"If a wastewater treatment plant operates its aeration basin with an MCRT of 3 days and an F/M ratio of 0.5 kg BOD/kg MLVSS-day, the system is most likely operating in the:","options":["Nitrification/Denitrification regime.","Extended Aeration regime.","High-Rate Aeration regime.","Contact Stabilization regime."],"answer":"3","solution":"Correct : (c). Explanation: The High-Rate Aeration regime is characterized by a short Mean Cell Residence Time (MCRT), typically 3-5 days, and a high Food-to-Microorganism (F/M) ratio, usually between 0.4 and 1.5 kg BOD/kg MLVSS-day. The provided values of MCRT = 3 days and F/M = 0.5 kg BOD/kg MLVSS-day fall within the typical range for this regime."},{"id":"73998","q":"The principle of CT Value (Concentration \u00d7 Time) is used in disinfection design to account for the impact of:","options":["The combined effect of disinfectant strength and exposure duration on pathogen inactivation.","The flow rate of the wastewater and the total mass of microorganisms.","The total dissolved solids (TDS) content in the final effluent.","The pH and temperature on the disinfectant's chemical speciation."],"answer":"1","solution":"Correct: (a). The CT Value (Concentration \u00d7 Time) is a measure used in disinfection to determine the effectiveness of a disinfectant. It represents the product of the disinfectant's concentration and the contact time, which together indicate the dose of disinfectant received by the microorganisms. A higher CT value generally leads to greater pathogen inactivation."},{"id":"73999","q":"In the Anaerobic Digestion process, the conversion of Volatile Fatty Acids (VFAs) to methane (CH4) and carbon dioxide (CO_2 ) is performed by which group of microorganisms?","options":["Sulphate-Reducing Bacteria (SRB).","Acetogenic bacteria.","Methanogenic archaea.","Hydrolytic bacteria."],"answer":"3","solution":"Correct (c) Explanation: Methanogenic archaea are the microorganisms responsible for the final stage of anaerobic digestion, known as methanogenesis. In this process, they convert volatile fatty acids (VFAs) and other simple compounds into methane and carbon dioxide . Hydrolytic bacteria break down complex organic matter into simpler molecules, while acetogenic bacteria convert these simpler molecules into acetate, hydrogen, and carbon dioxide. Sulfate-reducing bacteria compete with methanogenic archaea for substrates but produce hydrogen sulfide instead of methane."},{"id":"74000","q":"In the BOD 5 test, the chemical Allyl Thiourea (ATU) is sometimes added to samples to selectively suppress the activity of:","options":["Heterotrophic bacteria, thereby measuring only the chemical oxygen demand.","Nitrifying bacteria, allowing for the measurement of only carbonaceous BOD (CBOD).","Sulphate-reducing bacteria, preventing the formation of H 2 S.","Methanogenic archaea, increasing volatile fatty acid production."],"answer":"2","solution":"Correct (b) Explanation: In the BOD 5 test, Allyl Thiourea (ATU) is used as a nitrification inhibitor. It selectively suppresses the activity of nitrifying bacteria, which are responsible for oxidizing ammonia to nitrite and then to nitrate. By inhibiting these bacteria, the oxygen consumed during the test is primarily due to the decomposition of organic matter by heterotrophic bacteria. This allows for the measurement of carbonaceous biochemical oxygen demand (CBOD) separately from the nitrogenous biochemical oxygen demand (NBOD)."},{"id":"74001","q":"The formation of trihalomethanes (THMs) and other disinfection by-products (DBPs) during chlorination is primarily a concern because these compounds are:","options":["Carcinogenic or mutagenic, posing a long-term public health risk.","Heavy metals that cannot be removed by subsequent filtration.","Highly volatile, requiring an elaborate air stripping mechanism for removal.","Highly corrosive to concrete sewer pipes."],"answer":"1","solution":"Correct (a) Explanation: Trihalomethanes (THMs) and other disinfection by-products (DBPs) are formed when disinfectants like chlorine react with natural organic matter in water. The primary concern with these compounds is that they have been shown to be carcinogenic and mutagenic, which can lead to long-term public health risks."},{"id":"74002","q":"The efficiency of Biological Phosphorus Removal (BPR) is critically dependent on which ratio in the anaerobic zone?","options":["Sludge Volume Index (SVI) to Mean Cell Residence Time (MCRT).","Volatile Fatty Acids (VFAs) to Phosphate (PO).","Total BOD to Total Suspended Solids (TSS).","Dissolved Oxygen (DO) to Nitrate (NO 3 )."],"answer":"2","solution":"Correct b. The efficiency of Biological Phosphorus Removal (BPR) is critically dependent on the ratio of Volatile Fatty Acids (VFAs) to Phosphate (PO43\u2212\u200b) in the anaerobic zone. VFAs serve as the carbon source for phosphorus-accumulating organisms (PAOs), which are essential for BPR. A sufficient amount of VFAs is needed to drive the uptake of phosphorus in the subsequent aerobic zone."},{"id":"74003","q":"A key regulatory and operational advantage of using a Soil Vapor Extraction (SVE) system over 'dig and haul' for contaminated soil is that SVE:","options":["is highly effective for non-volatile contaminants like PCBs and heavy metals.","Treats the contamination in-situ (in place), eliminating the need for expensive hazardous waste transportation and disposal.","Requires no air emissions controls because the VOCs are naturally dispersed into the atmosphere.","Eliminates the need for a CERCLA Remedial Investigation/Feasibility Study (RI/FS)."],"answer":"2","solution":"correct (b) Explanation: Soil Vapor Extraction (SVE) is a remediation technology that removes volatile organic compounds (VOCs) from the soil by applying a vacuum to the subsurface. This process treats the contamination in-situ, or in place, which means the contaminated soil does not need to be excavated and transported off-site. This eliminates the costs and logistical challenges associated with \"dig and haul\" methods, which require expensive hazardous waste transportation and disposal."},{"id":"74004","q":"A key advantage of the Anaerobic-Anoxic-Oxic (A_2 O) process for BNR is the inclusion of the anaerobic zone, which provides selection pressure for:","options":["Phosphate Accumulating Organisms (PAOs) and simultaneous NO 3 reduction in the anoxic zone.","Filamentous bacteria, which enhances sludge settling.","The fastest-growing heterotrophic bacteria.","Nitrifying bacteria (AOB), which require a long hydraulic residence time."],"answer":"1","solution":"correct A . The Anaerobic-Anoxic-Oxic (A 2 \u200bO) process is a biological nutrient removal (BNR) system used in wastewater treatment. The anaerobic zone is crucial for the selection of Phosphate Accumulating Organisms (PAOs). In this zone, PAOs release phosphate and store readily biodegradable chemical oxygen demand (C O D) as polyhydroxyalkanoates (PHAs). The subsequent anoxic and Oxic zones allow these PAOs to take up excess phosphate from the wastewater, leading to its removal. The anoxic zone also facilitates simultaneous denitrification, where nitrate (NO 3 \u200b) is reduced to nitrogen gas."},{"id":"74005","q":"In a wastewater treatment process, the addition of methanol or another readily biodegradable carbon source is often necessary in the anoxic zone to enhance:","options":["Biological phosphorus release by providing Volatile Fatty Acids (VFAs).","Nitrification efficiency by suppressing heterotrophic decay.","The settling characteristics (SVI) of the sludge.","The denitrification rate in low-carbon municipal or industrial wastewater."],"answer":"4","solution":"Correct (d) Denitrification is a biological process in which bacteria reduce nitrate ( ) and nitrite (NO\u2082) into nitrogen gas (N\u2082). Denitrifying bacteria are heterotrophs, meaning they require an organic carbon source as an electron donor to complete this conversion. In many modern wastewater treatment plants, most of the available organic carbon is consumed in earlier, oxygen-rich (aerobic) stages. When the water moves to the oxygen-poor (anoxic) stage for denitrification, there may not be enough residual carbon for the denitrifying bacteria to be effective. Adding an external carbon source like methanol provides the necessary electron donors for the bacteria to continue the denitrification process and achieve high rates of nitrogen removal."},{"id":"74006","q":"The Biological Oxygen Demand (BOD) to Nitrogen (N) to Phosphorus (P) ratio for optimal growth of microorganisms in an aerobic wastewater treatment process is typically cited as:","options":["50:1:5","100:10:1","100:5:1","1:100:10"],"answer":"3","solution":"In aerobic wastewater treatment, microorganisms require specific nutrients to synthesize new biomass and metabolize organic matter. The organic matter is measured as Biological Oxygen Demand (BOD), while the primary macronutrients required are Nitrogen (N) and Phosphorus (P). The standard ratio used in the industry to ensure that microbial growth is not nutrient-limited is:(BOD:N:P=100:5:1) Key Considerations Nitrogen: Required primarily for the synthesis of proteins and nucleic acids. In the ratio, it is usually represented as Total Kjeldahl Nitrogen (TKN) or ammonia. Phosphorus: Essential for energy transfer molecules like ATP and for the structure of DNA/RNA. Limiting Factors: If the wastewater (such as industrial effluent) is deficient in N or P, the treatment efficiency drops, and issues like filamentous bulking or \"non-settleable\" sludge can occur. Supplemental nutrients (like urea or phosphoric acid) are often added to maintain this balance. Anaerobic Variation: Note that for anaerobic processes, the nutrient requirement is significantly lower because less biomass is produced, typically cited as (BOD:N:P=250:5:1) or (700:5:1) depending on the specific system."},{"id":"74007","q":"A Waste Analysis Plan (WAP) is a mandatory RCRA document required for permitted TSD facilities and is used to determine:","options":["The appropriate generator status of the facility.","The proper storage, treatment method, and final disposal of all incoming hazardous waste streams.","The total volume of waste generated annually for fee calculations.","The required length of the manifest retention period."],"answer":"2","solution":"In aerobic wastewater treatment, microorganisms require specific nutrients to synthesize new biomass and metabolize organic matter. The organic matter is measured as Biological Oxygen Demand (BOD), while the primary macronutrients required are Nitrogen (N) and Phosphorus (P). The standard ratio used in the industry to ensure that microbial growth is not nutrient-limited is:(BOD:N:P=100:5:1) Key Considerations Nitrogen: Required primarily for the synthesis of proteins and nucleic acids. In the ratio, it is usually represented as Total Kjeldahl Nitrogen (TKN) or ammonia. Phosphorus: Essential for energy transfer molecules like ATP and for the structure of DNA/RNA. Limiting Factors: If the wastewater (such as industrial effluent) is deficient in N or P, the treatment efficiency drops, and issues like filamentous bulking or \"non-settleable\" sludge can occur. Supplemental nutrients (like urea or phosphoric acid) are often added to maintain this balance. Anaerobic Variation: Note that for anaerobic processes, the nutrient requirement is significantly lower because less biomass is produced, typically cited as (BOD:N:P=250:5:1) or (700:5:1) depending on the specific system."},{"id":"74008","q":"Which parameter would be the most critical operational control to prevent scale formation on the membranes of a Reverse Osmosis (RO) unit?","options":["The pH and the Lonelier Saturation Index (LSI) of the brine (reject) stream.","The SDI (Silt Density Index).","The DRE (Destruction and Removal Efficiency) of the pre-treatment unit.","The BOD5 concentration of the incoming feed water."],"answer":"1","solution":"Correct (a) Scale formation, or scaling, in Reverse Osmosis (RO) units is caused by the precipitation of sparingly soluble salts on the membrane surface. This precipitation is influenced by the concentration of these salts, the temperature, and the pH of the water. The Langelier Saturation Index (LSI) is a calculated value used to predict the scaling potential of water. A positive LSI indicates that the water is supersaturated with calcium carbonate and has a tendency to form scale, while a negative LSI indicates the water is corrosive. Therefore, controlling the pH and monitoring the LSI of the concentrated brine (reject) stream, where the concentration of salts is highest, are the most critical operational controls to prevent scale."},{"id":"74009","q":"In the BOD 5 test, if the initial DO is 8.0 mg/L and the DO after 5 days is 4.0 mg/L in a 300 mL bottle, and the sample dilution was 1% (i.e. 3 mL sample), the BOD 5 is:","options":["133 mg/L","800 mg/L","400 mg/L","1200 mg/L"],"answer":"3","solution":"Correct (c) BOD = (DO initial \u2212 DO final) / Dilution Fraction. BOD = (8.0\u22124.0)/0.01=4.0/0.01=400 mg/L. (Seed correction is assumed negligible for simplicity) ."},{"id":"74010","q":"When measuring the BOD of an industrial wastewater sample suspected of being toxic to the seed biomass, the most appropriate modification to the standard BOD 5 test procedure is to:","options":["Use a specialized ATU inhibitor to suppress the toxic component.","Increase the dilution factor to reduce the concentration of the inhibitory substance.","Use a chemical COD test instead, as it is immune to toxicity effects.","Increase the incubation temperature to 35\u00b0C to overcome inhibition."],"answer":"2","solution":"correct (b). The standard BOD 5 test relies on the activity of microorganisms (seed biomass) to consume organic matter. If the wastewater sample contains toxic substances, these can inhibit or kill the seed microorganisms, leading to an inaccurate, low BOD reading. Increasing the dilution factor of the sample reduces the concentration of the toxic substance to a level that is no longer inhibitory to the seed biomass, allowing for an accurate measurement of the biochemical oxygen demand."},{"id":"74011","q":"A core objective of a Primary Effluent Filtration system (e.g., cloth media filtration) used before biological treatment in a WWTP is to:","options":["Remove sufficient BOD and TSS to significantly reduce the size requirement of the downstream bioreactor.","Eliminate the need for all subsequent disinfection processes.","Increase the F/M ratio in the downstream aeration basin.","Reduce the total solids loading to an MBR unit to prevent fouling."],"answer":"1","solution":"correct (a). A primary effluent filtration system, such as cloth media filtration, is used in a wastewater treatment plant (WWTP) to remove a significant amount of biochemical oxygen demand (BOD) and total suspended solids (TSS) before the wastewater enters the biological treatment stage. By reducing the BOD and TSS load, the downstream bioreactor can be smaller, as it has less organic material to treat. This makes the overall treatment process more efficient and cost-effective."},{"id":"74012","q":"In the aerobic zone of an Activated Sludge plant, the phenomenon where the DO concentration drops significantly due to high microbial activity immediately after the influent enters the basin is known as:","options":["The Oxygen Sink effect.","Endogenous Respiration.","Immediate Oxygen Demand (IOD).","The Initial DO Sag or Plug-Flow Demand Zone."],"answer":"4","solution":"correct (d) The phenomenon described, where the dissolved oxygen (DO) concentration drops significantly due to high microbial activity immediately after the influent enters the aerobic zone of an Activated Sludge plant, is known as the Initial DO Sag or Plug-Flow Demand Zone. This occurs because the microorganisms in the activated sludge rapidly consume the readily biodegradable organic matter in the incoming wastewater, leading to a high oxygen uptake rate and a temporary decrease in DO levels."},{"id":"74013","q":"The conversion of dissolved oxygen concentration from a Standard Temperature of 20\u00b0C to the actual operating temperature is necessary because:","options":["The BOD 5 test is only valid at 20\u00b0C.","The solubility of oxygen in water is inversely proportional to temperature.","The alpha (a) factor is undefined at temperatures other than 20\u00b0C.","The microbial decay rate (ka) increases exponentially with temperature."],"answer":"2","solution":"Correct (b) Explanation: The solubility of a gas, such as oxygen, in a liquid, such as water, is inversely proportional to the temperature of the liquid. As the temperature of the water increases, the solubility of oxygen decreases, and as the temperature decreases, the solubility of oxygen increases. Therefore, to accurately measure the dissolved oxygen concentration, the measurement must be adjusted from the standard temperature to the actual operating temperature."},{"id":"74014","q":"The final effluent from a Secondary Wastewater Treatment Plant has a BOD5 of 20 mg/L and TSS of 30 mg/L. This quality level indicates the plant is meeting the minimal requirements set by the:","options":["Federal CWA Secondary Treatment Standards (30/30 Rule).","Maximum LDR Concentration Based Standards.","Advanced Treatment Standards (e.g., 10/10 or 5/5 mg/L).","Drinking water Maximum Contaminant Level (MCL) standards."],"answer":"1","solution":"The final effluent from a Secondary Wastewater Treatment Plant with a (BOD 5 ) of 20 mg/L and TSS of 30 mg/L indicates the plant is meeting the minimal requirements set by the Federal CWA Secondary Treatment Standards (30/30 Rule). Details: Secondary Treatment Standards: According to the US Environmental Protection Agency (EPA) 40 CFR Part 133, secondary treatment requires a 30-day average of \\(BOD 5 ) and TSS not to exceed 30 mg/L.30/30 Rule: This standard is often referred to as the 30/30 rule (30 mg/L BOD and 30 mg/L TSS).Performance: An effluent quality of 20 mg/L (BOD 5 ) and 30 mg/L TSS is within these limits.Other options: Advanced Treatment Standards (10/10 or 5/5) are much stricter, and Maximum Contaminant Level (MCL) standards apply to drinking water, not municipal effluent."},{"id":"74015","q":"The critical flux concept in Membrane Bioreactors (MBRs) primarily helps the operator avoid the onset of:","options":["Membrane scaling by calcium carbonate (CaCO_3).","Membrane oxidation by free chlorine residual.","The High-Rate Aeration regime in the bioreactor.","Concentration polarization, where solutes build up near the membrane surface and drastically reduce filtration."],"answer":"4","solution":"correct (d). The critical flux concept in Membrane Bioreactors (MBRs) refers to the point at which the rate of filtration through the membrane begins to decline rapidly due to fouling. This decline is primarily caused by the buildup of solutes and other foulants on the membrane surface, a phenomenon known as concentration polarization. By operating at or below the critical flux, the operator can avoid this rapid fouling, thereby maintaining a stable filtration rate and extending the membrane's lifespan."},{"id":"74016","q":"Which of the following is an example of an 'end-of-pipe' pollution control measure in the context of a project's Environmental Management Plan (EMP)?","options":["Installing a wastewater treatment plant to treat effluents before they are discharged.","Changing the manufacturing process to use less hazardous raw materials.","Implementing a strict segregation policy for waste at the source.","Reusing waste materials as a feedstock for a different process."],"answer":"1","solution":"In an Environmental Management Plan (EMP), 'end-of-pipe' control measures refer to technologies or methods used to remove, neutralize, or treat pollutants after they have been created but before they are released into the environment. A wastewater treatment plant is a classic example because it deals with the \"effluent\" (waste stream) at the very end of the process pipe."},{"id":"74017","q":"The EIA Notification, 2006, mandates a specific timeframe for the State Pollution Control Board to conduct a public hearing after receiving a request from the project proponent. What is this timeframe?","options":["30 days","15 days","60 days","45 days"],"answer":"4","solution":"correct (d) Under the EIA Notification, 2006, the State Pollution Control Board (SPCB) is mandated to conduct a public hearing within 45 days of receiving a request from the project proponent. This timeframe is crucial for ensuring timely public consultation in the environmental clearance process."},{"id":"74018","q":"When Environmental Lapse Rate (ELR) is greater than Adiabatic Lapse Rate (ALR), then which of the following occurs?","options":["Super adiabatic lapse rate","Neutral lapse rate","Adiabatic lapse rate","Sub adiabatic lapse rate"],"answer":"1","solution":"correct (a) When the Environmental Lapse Rate (ELR) is greater than the Adiabatic Lapse Rate (ALR), it means that the actual decrease in temperature with altitude is more rapid than the rate at which a parcel of dry air would cool if lifted adiabatically. This condition is known as a super adiabatic lapse rate. This situation leads to atmospheric instability, as a rising parcel of air will be warmer than its surroundings and will continue to rise, while a sinking parcel will be colder than its surroundings and will continue to sink, promoting strong vertical air movements."},{"id":"74019","q":"What is the primary difference in management between 'domestic hazardous waste' and 'bio-medical waste' as per the SWM Rules and BMW Rules, 2016?","options":["Domestic hazardous waste is managed by households, while bio-medical waste is managed by hospitals.","Domestic hazardous waste is disposed of in a landfill, while bio-medical waste is always incinerated.","Domestic hazardous waste can be recycled, while bio-medical waste cannot.","Bio-medical waste is disposed of in the wet waste stream, while domestic hazardous waste is in the dry waste stream."],"answer":"1","solution":"Correct (a) The Solid Waste Management (SWM) Rules, 2016, primarily govern the management of domestic waste, including domestic hazardous waste, and place the responsibility on households and local authorities. In contrast, the Bio-Medical Waste Management (BMW) Rules, 2016, specifically address the handling, treatment, and disposal of bio-medical waste, and place the responsibility for its management on healthcare facilities like hospitals, nursing homes, and clinics."},{"id":"74020","q":"According to the Solid Waste Management Rules, 2016, a 'Spot Fine' may be levied on a person or entity for which of the following actions?","options":["Failing to pay the monthly user fee for waste collection.","Burning solid waste on streets or in open public spaces.","Failure to provide a waste collection service.","Building a waste management facility without proper land."],"answer":"2","solution":"Correct (b) The Solid Waste Management Rules, 2016, specifically prohibit the burning of solid waste, including on streets, in open public spaces, or in landfills, as it releases harmful pollutants into the environment. These rules empower authorities to impose 'Spot Fines' on individuals or entities found violating this provision. The other options (failing to pay user fees, failure to provide service, or improper facility construction) are typically addressed through different regulatory mechanisms or penalties, not specifically 'Spot Fines' for immediate environmental violation."},{"id":"74021","q":"According to the Solid Waste Management Rules, 2016, what is the key responsibility of an 'event organizer' for an event with more than 100 people?","options":["To pay a 'User Fee' for waste collection.","To ensure segregation of waste at the source and hand over segregated waste to a waste collector.","To transport all waste from the event to a nearby landfill.","To process all organic waste from the event on-site."],"answer":"2","solution":"Explanation: Correct (b) The Solid Waste Management Rules, 2016, specifically place the responsibility on event organizers to manage waste generated during their events. This includes ensuring that waste is segregated at the source (i.e., at the event venue) into different categories such as organic, dry, and domestic hazardous waste. The segregated waste must then be handed over to an authorized waste collector or agency for further processing and disposal."},{"id":"74022","q":"Recognize the WRONG statement related to the characteristics of Rubbish in Indian conditions.","options":["Rubbish constitutes more than 50% of the total municipal solid waste.","Rubbish includes rags paper pieces, broken pieces of glass and furniture, card-boards, etc.","Rubbish includes all non-putrescible wastes except ashes.","Rubbish has a density varying between 50 to 400 kg/m 3 ."],"answer":"1","solution":"Correct (a) Rubbish is a general term applied to solid wastes originating in households, commercial establishments and institutions, excluding garbage and ashes. It can be combustible (e.g., paper, wood, plastics, rags) or noncombustible (e.g., metals, glass, ceramics). The density of rubbish usually varies between 50 to 400 kg/m\u00b3."},{"id":"74023","q":"Which of the following toxic substances is normally found in E-waste 'cathode ray tubes (CRT)'?","options":["Cadmium","Boron","Magnesium","Chromium"],"answer":"1","solution":"correct (a). Cathode Ray Tubes (CRTs) are an essential part of older television sets and computer monitors and contain various toxic substances. Among the listed options, Cadmium is a well-known toxic substance found in CRTs. Cadmium is mainly used in phosphors, which are responsible for producing colors in CRT screens, and is commonly found in the red phosphor coatings inside CRT displays."}];
let idx=0, answers={}, timerSec=65*60, timerInt=null;

function render(){
  const q=DATA[idx];
  if(!q){document.getElementById('qText').textContent='No data.';return;}
  document.getElementById('qNum').textContent=idx+1;
  document.getElementById('qTotal').textContent=DATA.length;
  document.getElementById('qText').textContent=q.q;
  document.getElementById('opts').innerHTML=q.options.map((o,i)=>
    `<div class="option ${answers[idx]==(i+1)?'selected':''}" onclick="select(${i+1})">${String.fromCharCode(65+i)}. ${o}</div>`
  ).join('');
}
window.select=o=>{answers[idx]=o; render();};
window.prev=()=>{if(idx>0){idx--; render();}};
window.next=()=>{if(idx<DATA.length-1){idx++; render();}};

function submitTest(){
  clearInterval(timerInt);
  let c=0; for(let i=0;i<DATA.length;i++){if(answers[i]==DATA[i].answer)c++;}
  const pct=Math.round(c/DATA.length*100)||0;
  document.getElementById('qCard').classList.add('hidden');
  document.getElementById('resCard').classList.remove('hidden');
  document.getElementById('score').textContent=pct+'%';
  document.getElementById('detail').innerHTML='<b>'+c+'/'+DATA.length+'</b> correct';
}

function tick(){timerSec--; document.getElementById('timer').textContent=Math.floor(timerSec/60)+':'+String(timerSec%60).padStart(2,'0'); document.getElementById('bar').style.width=(timerSec/(65*60)*100)+'%'; if(timerSec<=0){clearInterval(timerInt); submitTest();}}

render(); timerInt=setInterval(tick,1000);
</script>
</body></html>
