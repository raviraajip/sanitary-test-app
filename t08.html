<style>

:root{--bg:#0b0c15;--surface:#12142a;--text:#e4e6f0;--accent:#00e8a0;--gold:#f0c040;--danger:#ff4d6d;--border:rgba(255,255,255,.08);--muted:#8a8fa8;}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:Inter,system-ui,sans-serif;background:radial-gradient(1000px 700px at 20% 0%,#00e8a011,transparent),var(--bg);color:var(--text);min-height:100vh;line-height:1.55;}

.option:hover,.option.selected{border-color:var(--accent);background:rgba(0,232,160,.12);font-weight:600;}
.timer{font-family:monospace;font-weight:700;font-size:2rem;color:var(--accent);}

ocol","Environmental Protection Act","Basel Convention"],"answer":"3"},{"id":"69034","q":"Following option international standard is most commonly associated with EMS?","options":["ISO 9001","ISO 45001","ISO 14001","ISO 50001"],"answer":"3"},{"id":"69035","q":"When conducting an environmental aspect evaluation, an EMS should consider factors including:","options":["Resource use, emissions, and waste generation.","Not a Public perception.","Financial implications are not considered","Legal requirements with scientific not assessment."],"answer":"1"},{"id":"69036","q":"As per the rules, who is responsible for collecting the user fee for solid waste management from households and establishments?","options":["The waste collector or the local body","The Central Pollution Control Board (CPCB)","The Ministry of Environment, Forest and Climate Change","The State Pollution Control Board (SPCB)"],"answer":"1"},{"id":"69037","q":"The SWM Rules, 2016, specify that non-recyclable inert waste having a calorific value of more than 1500 Kcal/kg should be used for which purpose?","options":["Landfilling","Incineration in a dedicated waste-to-energy plant","Composting","Road construction and cement kilns"],"answer":"2"},{"id":"69038","q":"As per the rules, the responsibility of a street vendor for the waste they generate ends with which action?","options":["Paying a user fee to the local body.","Segregating the waste and handing it over to the designated waste collector.","Disposing of the waste in the nearest public dustbin.","Paying a spot fine if found littering."],"answer":"2"},{"id":"69039","q":"What is the mandatory time frame for a local body to provide a solid waste collection service to every household and commercial establishment in its area?","options":["Within 12 months from the date of the rules' notification","Within 18 months from the date of the rules' notification","Within 24 months from the date of the rules' notification","No specific time frame is mentioned"],"answer":"4"},{"id":"69040","q":"During the preparation of an Environmental Impact Assessment (EIA) report for a proposed industrial facility, the noise impact of two heavy crushers must be evaluated. If Crusher A produces a noise level of 80 dB and Crusher B produces a noise level of 80 dB, what is the combined noise level that must be reported for environmental clearance?","options":["160 dB","86 dB","83 dB","80 dB"],"answer":"3"},{"id":"69041","q":"The SWM Rules also apply to \"Special Economic Zones.\" Who is the designated authority responsible for implementing the rules in these zones","options":["The Ministry of Commerce and Industry","The developer of the Special Economic Zone","The Central Pollution Control Board","The State Pollution Control Board"],"answer":"2"},{"id":"69042","q":"A municipality is seeking Environmental Clearance (EC) for a new sanitary landfill. The EIA study projects that the facility will receive 100,000 tonnes of municipal solid waste annually. If the waste is compacted to a density of 800 \\(kg/m^3\\) and the State Pollution Control Board restricts the maximum depth of the waste to 10 meters to protect the aquifer, what is the minimum active landfill area required per year? (Assume 1 tonne = 1000 kg and ignore daily soil cover volume).","options":["1.25 Hectares","12.5 Hectares","8.0 Hectares","0.8 Hectares"],"answer":"1"},{"id":"69043","q":"Which of the following is considered a \"bulk waste generator\" under the rules, based on the quantity of waste generated per day?","options":["A residential society generating more than 10 kg","A commercial establishment generating more than 20 kg","A hostel or hotel generating more than 50 kg","None of these"],"answer":"4"},{"id":"69044","q":"According to the PWM Rules, 2016, what is the minimum thickness mandated for plastic carry bags at the point of manufacture and import?","options":["40 microns","50 microns","60 microns","75 microns"],"answer":"2"},{"id":"69045","q":"The concept of Extended Producer Responsibility (EPR) in plastic waste management makes which entity financially responsible for the waste generated by their products?","options":["The end-consumer","The waste collector","The producer, importer, and brand owner","The local municipality"],"answer":"3"},{"id":"69046","q":"The PWM Rules mandate that brand owners must register with which authority?","options":["The Central Government","The Urban Local Body (ULB)","The Central or State Pollution Control Board","The Ministry of Commerce and Industry"],"answer":"3"},{"id":"69047","q":"The rules specify a minimum thickness for carry bags. This rule does not apply to which of the following?","options":["Plastic sheets used for packaging","Plastic films used for food wrapping","Compostable plastic bags","Plastic bags made from recycled material"],"answer":"3"},{"id":"69048","q":"Which of the following single-use plastic items is NOT covered under the nationwide ban?","options":["Earbuds with plastic sticks","Plastic stirrers","Plastic wrapping sheets for sweets","Multi-layered plastic (MLP) pouches for milk"],"answer":"4"},{"id":"69049","q":"The rules prohibit the use of plastic sachets for which specific product?","options":["Edible oil","Milk","Pan masala, gutkha, and tobacco","Packaged drinking water"],"answer":"3"},{"id":"69050","q":"Under the E-Waste (Management) Rules, 2016, which of the following is a key responsibility of a producer under Extended Producer Responsibility (EPR)?","options":["Providing financial assistance to local authorities for waste collection.","Ensuring that e-waste is channelled to an authorized dismantler or recycler.","Setting up municipal solid waste processing facilities.","Conducting public awareness campaigns about general waste disposal."],"answer":"2"},{"id":"69051","q":"What is the correct term for the system established by a producer to ensure the collection of e-waste from consumers, as per the rules?","options":["Collection Centre","Take-back system","Drop-off Point","channelization mechanism"],"answer":"2"},{"id":"69052","q":"The E-Waste Rules prohibit the use of certain hazardous substances in the manufacture of EEE. What is the maximum concentration value by weight in homogeneous materials for lead, mercury, and hexavalent chromium?","options":["0.01%","0.1%","1%","2%"],"answer":"2"},{"id":"69053","q":"Who is responsible for providing the necessary infrastructure for the collection of e-waste from their designated collection points?","options":["The State Pollution Control Board","The Urban Local Body (ULB)","The producer","The recycler"],"answer":"3"},{"id":"69054","q":"What is the minimum penalty for a producer who fails to meet their EPR targets, as per the rules?","options":["A fine of up to ₹1 lakh","A fine of up to ₹5 lakh","A fine calculated as a percentage of their turnover","No specific minimum penalty is mentioned"],"answer":"4"},{"id":"69055","q":"What is the mandatory time limit within which bio-medical waste must be treated and disposed of from its generation, as per the rules?","options":["12 hours","24 hours","36 hours","48 hours"],"answer":"4"},{"id":"69056","q":"A \"Common Bio-medical Waste Treatment Facility\" (CBWTF) is licensed for what purpose?","options":["Only incineration of bio-medical waste.","To transport and store bio-medical waste.","To collect, transport, treat, and dispose of bio-medical waste for multiple healthcare facilities.","To audit and monitor the waste management practices of hospitals."],"answer":"3"},{"id":"69057","q":"What is the correct protocol for the disposal of solid, liquid, or gaseous waste from a bio-medical incinerator?","options":["It should be disposed of in a common landfill.","It must comply with the emission and discharge standards specified in Schedule III of the rules.","It must be re-treated on-site.","It must be handed over to a common hazardous waste treatment facility."],"answer":"2"},{"id":"69058","q":"Which of the following color-coded bags is used for the disposal of discarded and contaminated linen, beddings, and dressings?","options":["Red","Yellow","Blue","White"],"answer":"2"},{"id":"69059","q":"Which of the following is considered \"liquid bio-medical waste\"?","options":["Discarded plaster casts","Laboratory wastes","Sharps","Human anatomical waste"],"answer":"2"},{"id":"69060","q":"What is the primary objective of \"transboundary movement\" rules for hazardous waste?","options":["To facilitate the export of hazardous waste for disposal in other countries","To regulate the import and export of hazardous waste for recycling and recovery","To ensure that hazardous waste is always disposed of within the country of its origin","To encourage illegal trade in hazardous waste"],"answer":"2"},{"id":"69061","q":"Which of the following is NOT required for the transport of hazardous waste?","options":["A manifest document","A valid authorization from the SPCB","Proper packaging and labelling as per the rules","A no-objection certificate from the local police"],"answer":"4"},{"id":"69062","q":"What is the primary purpose of a \"Construction and Demolition Waste Management Plan\"","options":["To secure financial approval for a project","To detail how the waste will be segregated, stored, and managed on-site","To obtain a license from the local municipality","To list all the contractors and subcontractors"],"answer":"2"},{"id":"69063","q":"The rules state that a local authority can collect a \"tipping fee\" for the waste it processes. What does this fee cover","options":["The cost of transporting the waste","The cost of final disposal in a sanitary landfill","The cost of segregation and recycling","The cost of initial collection"],"answer":"2"},{"id":"69064","q":"What is the mandatory minimum percentage of the new batteries a producer sells that they must collect back for recycling in the first year of their operation?","options":["5%","70%","20%","30%"],"answer":"2"},{"id":"69065","q":"The rules were recently amended to incorporate which new type of batteries under the EPR framework?","options":["Used household alkaline batteries.","Used portable batteries.","Used electric vehicle (EV) batteries.","All of the above."],"answer":"3"},{"id":"69066","q":"Which of the following is NOT a recognized method of solid waste disposal?","options":["Landfilling","Incineration","Composting","Open dumping"],"answer":"4"},{"id":"69067","q":"A \"Waste Management and Handling Plan\" is a requirement for whom?","options":["All citizens and residents","All waste generators, as per their respective rules","Only large-scale industrial units","Only municipal corporations"],"answer":"2"},{"id":"69068","q":"The \"Extended Producer Responsibility (EPR)\" framework is based on which of the following principles?","options":["Precautionary Principle","Polluter-Pays Principle","Life Cycle Principle","Command and Control Principle"],"answer":"2"},{"id":"69069","q":"The concept of \"resource efficiency\" in waste management refers to:","options":["The use of fewer resources to produce the same amount of goods.","The efficient use of waste as a resource.","The efficient collection and transportation of waste.","The efficient disposal of waste in a landfill."],"answer":"1"},{"id":"69070","q":"hat is the full form of the term \"CPCB \"","options":["Central Pollution Control Board","Central Planning and Control Bureau","Cleanliness Promotion and Conservation Board","Central Public Committee for Bio-waste"],"answer":"1"},{"id":"69071","q":"The Environment (Protection) Act, 1986, provides for penalties for non-compliance with the rules. What is the maximum imprisonment for a person who violates any rule?","options":["One year","Two years","Five years","Ten years"],"answer":"3"},{"id":"69072","q":"What is the core principle of \"Integrated Solid Waste Management\"?","options":["The disposal of all waste in a single, large landfill","A comprehensive approach combining source reduction, recycling, and disposal","The management of waste by a single government authority","The use of a single technology for all types of waste"],"answer":"2"},{"id":"69073","q":"The concept of \"Life Cycle Assessment\" in waste management refers to","options":["The lifespan of a product","The environmental impact of a product from \"cradle to grave\"","The durability and reusability of a product","The cost of a product's disposal"],"answer":"2"},{"id":"69074","q":"What is the first and most preferred option for the management of hazardous waste, as per the hierarchy in the rules?","options":["Disposal","Recovery, Recycling, and Reuse","Treatment","Incineration"],"answer":"2"},{"id":"69075","q":"Under these rules, \"co-processing\" of hazardous waste is permitted. What does co-processing refer to?","options":["Mixing hazardous waste with non-hazardous waste for disposal.","The use of hazardous waste as a raw material or fuel substitute in industrial processes, such as in cement kilns.","Jointly managing waste with another waste generator.","A process to chemically neutralize hazardous waste"],"answer":"2"},{"id":"69076","q":"What is the correct protocol for the disposal of solid, liquid, or gaseous waste from a bio-medical incinerator?","options":["It should be disposed of in a common landfill.","It must comply with the emission and discharge standards specified in Schedule III of the rules.","It must be re-treated on-site.","It must be handed over to a common hazardous waste treatment facility."],"answer":"2"},{"id":"69077","q":"Which category of bio-medical waste is to be disposed of in a yellow bag with a label indicating the \"type of waste\"?","options":["Human anatomical waste","Sharps","Cytotoxic drugs","Expired medicines"],"answer":"1"},{"id":"69078","q":"Who was recently appointed as the brand ambassador of FICCI FRAMES?","options":["Sachin Tendulkar","Akshay Kumar","Virat Kohli","Ayushmann Khurrana"],"answer":"4"},{"id":"69079","q":"Which player of the Indian women's cricket team was appointed as DSP in UP Police?","options":["Harmanpreet Kaur","Smriti Mandhana","Mithali Raj","Jhulan Goswami"],"answer":"4"},{"id":"69080","q":"Which state is at the top of the Fiscal Health Index Report 2025, recently released by NITI Aayog?","options":["Karnataka","Tamil Nadu","Kerala","Odisha"],"answer":"4"},{"id":"69081","q":"Who inaugurated the All India Campaign 'Our Constitution, Our Respect'?","options":["Vice President Jagdeep Dhankhar","PM Narendra Modi","Mr. Rajnath Singh","Om Birla"],"answer":"1"},{"id":"69082","q":"Which Indian Navy ship conducted the hydrographic survey of Mauritius recently?","options":["INS Viraat","INS Sarvekshak","INS Kalvari","INS Saryu"],"answer":"2"},{"id":"69083","q":"What is the reason behind bats flying in the dark?","options":["They have a perfect vision in the dark.","They produce high-pitched sounds called ultrasonics.","The light startles them.","None of the above."],"answer":"2"},{"id":"69084","q":"Which of these is the small-scale industry in India?","options":["Jute industry","Paper Industry","Textile Industry","Handloom Industry"],"answer":"4"},{"id":"69085","q":"At which place on earth are there days and nights of equal length always?","options":["Equator","Poles","Prime Meridian","Nowhere"],"answer":"1"},{"id":"69086","q":"The largest public sector undertaking in the country is?","options":["Railways","Airways","Roadways","Iron and Steel Plants"],"answer":"1"},{"id":"69087","q":"What is the full form of DRDL?","options":["Differential Research and Documentation Laboratory","Department of Research and Development Laboratory","Defense Research and Development Laboratory","None of the above"],"answer":"3"},{"id":"69088","q":"Who is known as the 'father of Indian missile technology'?","options":["Dr. Homi Bhabha","Dr. Chidambaram","Dr. U.R. Rao","Dr. A.P.J. Abdul Kalam"],"answer":"4"},{"id":"69089","q":"Which of the following microorganisms causes diseases like polio and chicken pox?","options":["Protozoa","Bacteria","Virus","Algae"],"answer":"3"},{"id":"69090","q":"What is commonly known as 'white plague'?","options":["Typhoid","Malaria","Tuberculosis","Plague"],"answer":"3"},{"id":"69091","q":"Which organ is the main digester and absorber of food?","options":["Colon","Stomach","Liver","Small intestine"],"answer":"4"},{"id":"69092","q":"A gold ring which is 50% pure. Its purity can be alternatively shown as __:","options":["18 Carat","18 Karat","12 Carat","12 Karat"],"answer":"4"}];
let idx=0, answers={}, timerSec=3900, timerInt=null;

function render(){
  const q=DATA[idx];
  if(!q){document.getElementById('qText').textContent='No data.';return;}
  document.getElementById('qNum').textContent=idx+1;
  document.getElementById('qTotal').textContent=DATA.length;
  document.getElementById('qText').textContent=q.q;
  document.getElementById('opts').innerHTML=q.options.map((o,i)=>
    `<div class="option ${answers[idx]==(i+1)?'selected':''}" onclick="select(${i+1})">${String.fromCharCode(65+i)}. ${o}</div>`
  ).join('');
}
window.select=o=>{answers[idx]=o; render();};
window.prev=()=>{if(idx>0){idx--; render();}};
window.next=()=>{if(idx<DATA.length-1){idx++; render();}};

function submitTest(){
  clearInterval(timerInt);
  let c=0; for(let i=0;i<DATA.length;i++){if(answers[i]==DATA[i].answer)c++;}
  const pct=Math.round(c/DATA.length*100)||0;
  document.getElementById('qCard').classList.add('hidden');
  document.getElementById('resCard').classList.remove('hidden');
  document.getElementById('score').textContent=pct+'%';
  document.getElementById('detail').innerHTML='<b>'+c+'/'+DATA.length+'</b> correct';
}

function tick(){timerSec--; document.getElementById('timer').textContent=Math.floor(timerSec/60)+':'+String(timerSec%60).padStart(2,'0'); document.getElementById('bar').style.width=(timerSec/3900*100)+'%'; if(timerSec<=0){clearInterval(timerInt); submitTest();}}

render(); timerInt=setInterval(tick,1000);
</script>
