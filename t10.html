<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>ASWMO — T10 HWM + WMR</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
:root{--bg:#0b0c15;--surface:#12142a;--text:#e4e6f0;--accent:#00e8a0;--gold:#f0c040;--danger:#ff4d6d;--border:rgba(255,255,255,.08);--muted:#8a8fa8;}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:Inter,system-ui,sans-serif;background:radial-gradient(1000px 700px at 20% 0%,#00e8a011,transparent),var(--bg);color:var(--text);min-height:100vh;line-height:1.55;}
.container{max-width:900px;margin:2rem auto;padding:0 1.2rem;}
h1{font-size:1.6rem;font-weight:700;background:linear-gradient(135deg,#fff,var(--accent));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.card{background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:16px;padding:1.5rem;margin-bottom:1rem;}
.question{font-size:1.05rem;font-weight:500;margin-bottom:.8rem;line-height:1.35;}
.options{display:grid;gap:.5rem;}
.option{padding:.7rem 1rem;background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:10px;cursor:pointer;font-size:.92rem;transition:.2s;}
.option:hover,.option.selected{border-color:var(--accent);background:rgba(0,232,160,.12);font-weight:600;}
.timer{font-family:monospace;font-weight:700;font-size:2rem;color:var(--accent);}
button{background:linear-gradient(135deg,var(--accent),#00b87e);color:#0a0c12;border:none;padding:.7rem 1.4rem;border-radius:10px;font-weight:700;cursor:pointer;}
.hidden{display:none!important}</style>
</head>

<script>
const DATA=[{"id":"70228","q":"In the context of the informal waste management sector, what is the primary economic and environmental role of waste pickers in urban areas?","options":["They are primarily responsible for waste collection and transport to landfills.","They add to the burden on municipalities by illegally occupying space.","They play a crucial role in waste segregation and recycling, diverting valuable materials from landfill","They are responsible for the open burning of waste."],"answer":"3"},{"id":"70229","q":"Which of the following is not amongst the responsibilities of Carroll Model?","options":["Ethical responsibility","Water responsibility","Economic responsibility","Legal responsibility"],"answer":"2"},{"id":"70230","q":"What is the main difference between incineration and gasification as waste-to-energy technologies?","options":["Incineration uses high-temperature combustion, while gasification uses low-temperature pyrolysis","Incineration produces solid ash, while gasification produces a combustible gas called syngas.","Incineration requires a lack of oxygen, while gasification requires excess oxygen.","Gasification is used only for hazardous waste, while incineration is used for municipal waste."],"answer":"2"},{"id":"70231","q":"A waste material is defined as 'ignitable' under hazardous waste rules if it has a flash point of:","options":["Less than 25°C","Less than 30°C","Less than 40°C","Less than 60°C"],"answer":"4"},{"id":"70232","q":"The Recycler is a key stakeholder under the E-Waste (Management) Rules. Their primary function is:","options":["To collect e-waste from consumers and producers.","To repair and refurbish electronic goods for reuse.","To process dismantled e-waste components to recover valuable materials.","To manage public awareness campaigns about e-waste."],"answer":"3"},{"id":"70233","q":"What is the main purpose of the Toxicity Characteristic Leaching Procedure (TCLP) in hazardous waste management?","options":["To determine if a waste is ignitable.","To measure the amount of volatile organic compounds in a waste.","To simulate the leaching of toxic chemicals from a waste into groundwater in a landfill.","To test the reactivity of a waste with water."],"answer":"3"},{"id":"70234","q":"What is the main purpose of biomining a legacy waste dumpsite?","options":["To use biological processes to generate biogas from the waste.","To excavate and process the old waste to recover valuable materials and space.","To add new waste to an old landfill site.","To generate compost from the waste without segregation."],"answer":"2"},{"id":"70235","q":"What is the key difference between a Comprehensive EIA and a Rapid EIA?","options":["A Comprehensive EIA is for small projects, while a Rapid EIA is for large projects.","A Comprehensive EIA is conducted over a full year, while a Rapid EIA is conducted over a single season.","A Comprehensive EIA is required for all projects, while a Rapid EIA is only for non-hazardous projects.","They are the same and the terms can be used interchangeably."],"answer":"2"},{"id":"70236","q":"Which of the following is an example of an ex-situ hazardous waste treatment method?","options":["In-place stabilization of contaminated soil.","Aerobic treatment of contaminated groundwater at the site.","Removing contaminated soil and treating it at a separate facility.","Bio-remediation of a contaminated site."],"answer":"3"},{"id":"70237","q":"In India, the State Pollution Control Boards (SPCBs) have been delegated powers under various environmental acts. Their primary role in hazardous waste management is to:","options":["Implement and enforce hazardous waste rules within their state.","Fund all hazardous waste treatment facilities.","Generate hazardous waste manifests.","Directly manage all hazardous waste transport."],"answer":"1"},{"id":"70238","q":"The main purpose of a 'Project Description' in an EIA report is to:","options":["Predict the environmental impacts of the project.","Outline the legal framework and policy context.","Provide a detailed overview of the proposed project, its location, size, and processes.","Summarize the public's opinion on the project."],"answer":"3"},{"id":"70239","q":"What is Refuse-Derived Fuel (RDF) and what is its primary use in waste management?","options":["RDF is a type of waste that can be composted to produce fertilizer.","It's a non-biodegradable waste material used to generate electricity through incineration.","RDF is a processed fuel produced from segregated dry municipal solid waste, used as an alternative to fossil fuels.","It's a liquid fuel produced from the pyrolysis of plastic waste."],"answer":"3"},{"id":"70240","q":"Which of the following is incorrect, if we only achieve two out of three pillars of Sustainable Development?","options":["Social + Economic Sustainability = Equitable","Social + Environmental Sustainability = Bearable","Economic + Environmental Sustainability = Viable","Political + Environmental Sustainability = Bearable"],"answer":"4"},{"id":"70241","q":"Which of the following is an example of an indirect environmental impact?","options":["Noise from a construction site.","Water pollution from a factory's direct discharge.","An increase in air pollution due to an increase in traffic caused by a new highway.","Habitat loss from a project's footprint."],"answer":"3"},{"id":"70242","q":"When was Biodiversity Act passed?","options":["2010","2002","2004","2003"],"answer":"2"},{"id":"70243","q":"In the context of the EIA process, the term 'Scoping' is a critical step because it:","options":["Determines if an EIA is required.","Identifies the key issues and impacts that need to be addressed in the EIA report.","Provides the final approval for the project.","Analyses the project's financial feasibility."],"answer":"2"},{"id":"70244","q":"Which of the following would be considered a hazardous waste from an electroplating facility?","options":["Used packaging materials","Sludge containing heavy metals","Expired office supplies","General kitchen waste"],"answer":"2"},{"id":"70245","q":"A city decides to implement a Zero Liquid Discharge (ZLD) system in its new industrial park. This means that:","options":["All liquid waste will be stored in underground tanks.","No liquid waste will be discharged into the environment.","All liquid waste will be evaporated into the atmosphere.","The city will not use any water."],"answer":"2"},{"id":"70246","q":"The primary role of ragpickers and the informal waste sector is most aligned with which principle of the waste management hierarchy?","options":["Final Disposal","Waste-to-Energy","Recycling and Recovery","Source Reduction"],"answer":"3"},{"id":"70247","q":"The concept of 'Waste-to-Wealth' is most closely aligned with which of the following principles?","options":["Landfilling","Open burning","Source reduction and resource recovery","The Polluter Pays Principle"],"answer":"3"},{"id":"70248","q":"Under India's E-Waste (Management) Rules, what is the primary responsibility of a refurbished?","options":["To collect and dismantle e-waste into individual components.","To repair and restore old electronic equipment for reuse.","To burn e-waste to recover precious metals.","To generate EPR certificates for producers."],"answer":"2"},{"id":"70249","q":"What is the main environmental benefit of vermicomposting over traditional composting?","options":["It is a faster process.","It can be done on a much larger scale.","It produces a superior quality compost (vermicast) and requires less labour for turning.","It is suitable for all types of waste, including plastics."],"answer":"3"},{"id":"70250","q":"Under the E-Waste (Management) Rules, what is the primary role of a dismantler?","options":["To collect e-waste from consumers and producers.","To repair and restore old electronic equipment for reuse.","To scientifically break down e-waste into different components for further recycling.","To generate EPR certificates for producers."],"answer":"3"},{"id":"70251","q":"What is the primary objective of a plasma gasification system in waste management?","options":["To produce biogas from organic waste in an anaerobic environment.","To combust municipal solid waste at high temperatures to reduce volume.","To convert waste into a synthesis gas (syngas) using an extremely high-temperature plasma torch.","To separate and recycle plastic waste."],"answer":"3"},{"id":"70252","q":"What is a key difference between a sanitary landfill and a bioreactor landfill?","options":["A sanitary landfill is used for hazardous waste, while a bioreactor landfill is for municipal waste.","A sanitary landfill is engineered to minimize decomposition, while a bioreactor landfill accelerates it.","A sanitary landfill is more expensive to build than a bioreactor landfill.","A sanitary landfill produces more landfill gas than a bioreactor landfill."],"answer":"2"},{"id":"70253","q":"The management of radioactive waste from nuclear power plants is governed by which authority in India?","options":["The Central Pollution Control Board (CPCB)","The Ministry of Environment, Forest and Climate Change (MoEF&CC)","The Atomic Energy Regulatory Board (AERB)","The National Green Tribunal (NGT)"],"answer":"3"},{"id":"70254","q":"What is the primary role of a public hearing in the EIA process?","options":["To inform the government about the project's financial status.","To provide a platform for project proponents to justify their project.","To allow affected people and interested parties to voice their concerns and provide suggestions on the draft EIA report.","To formally approve the project."],"answer":"3"},{"id":"70255","q":"A manufacturing facility is found to be illegally disposing of lead sludge in a municipal dump. Which law is most likely to be violated?","options":["The Water (Prevention and Control of Pollution) Act","The Air (Prevention and Control of Pollution) Act","The Hazardous and Other Wastes (Management and Transboundary Movement) Rules","The Plastic Waste Management Rules"],"answer":"3"},{"id":"70256","q":"The National Green Tribunal (NGT) can hear cases under which of the following acts?","options":["The Water (Prevention and Control of Pollution) Act, 1974","The Forest (Conservation) Act, 1980","The Environment (Protection) Act, 1986","All of the above"],"answer":"4"},{"id":"70257","q":"What is an industrial symbiosis ?","options":["When industries co-operative sector produced a product by one of them is part of a larger product produced by the other.","When industries co-operate by integrating environmental work so that a common environmental management system is established.","When industries co-operate so that the waste of one serve as input in the production of the others as for example heat.","When industries operate without any chemical pollution."],"answer":"3"},{"id":"70258","q":"Which of the following is a 'listed waste' under the RCRA hazardous waste regulations?","options":["Spent solvent from a degreasing operation","Waste from the production of wood","Paper and cardboard waste","Household garbage"],"answer":"1"},{"id":"70259","q":"What is the primary difference between a Phase I and a Phase II Environmental Site Assessment?","options":["A Phase I is non-intrusive and a Phase II involves physical sampling and testing.","A Phase I is a financial audit, and a Phase II is an environmental audit.","A Phase I is for industrial sites, and a Phase II is for commercial sites.","A Phase I is conducted by the buyer, and a Phase II is conducted by the seller."],"answer":"1"},{"id":"70260","q":"What is the primary purpose of the 'remediation' phase of a contaminated site assessment?","options":["To conduct a historical review of the site","To evaluate the health risks of the contamination","To clean up or treat the contamination to a safe level","To identify if a site is contaminated"],"answer":"3"},{"id":"70261","q":"What is the primary purpose of a site reconnaissance in a Phase I Environmental Site Assessment?","options":["To clean up any identified contamination","collect and analyse soil samples","To interview past owners of the property","To visually inspect the property for potential environmental concerns"],"answer":"4"},{"id":"70262","q":"What is the primary purpose of a post-closure plan for a landfill?","options":["To design the original landfill liner system","To monitor and maintain the site after it has stopped receiving waste","To increase the amount of waste the landfill can accept","To find a new location for a new landfill"],"answer":"2"},{"id":"70263","q":"What is the main objective of a 'Brownfield' remediation program?","options":["To identify all environmentally sensitive areas for preservation","To prevent future industrial pollution","To clean up highly contaminated sites that pose an immediate risk to public health","To clean up and redevelop abandoned or underutilized industrial properties with minor contamination"],"answer":"4"},{"id":"70264","q":"What is the primary purpose of a 'chain of custody' form in environmental sampling?","options":["To outline the safety procedures for the sampling team","To list the types of contaminants expected to be found at a site","To document the collection and handling of samples to ensure their integrity and legal defensibility","To provide a financial estimate for the laboratory analysis"],"answer":"3"},{"id":"70265","q":"What is the primary purpose of a 'green building' certification program, such as LEED?","options":["To ensure a building is resistant to natural disasters","To increase the aesthetic appeal of a building","To promote the design, construction, and operation of environmentally friendly buildings","To increase the cost of building materials"],"answer":"3"},{"id":"70266","q":"What is the primary purpose of a 'stormwater pollution prevention plan' (SWPPP)?","options":["manage the disposal of all hazardous waste","To treat contaminated groundwater","To prevent all water from leaving a site","To prevent non-point source pollution from entering waterways via stormwater runoff"],"answer":"4"},{"id":"70267","q":"What is the primary function of a landfill 'cap' or 'cover' system?","options":["To allow rainwater to filter through the waste","To provide a barrier that contains waste, prevents odours, and minimizes water infiltration","To increase the temperature inside the landfill for faster decomposition","To make the landfill site a recreational park immediately after closure"],"answer":"2"},{"id":"70268","q":"What is the primary purpose of an 'Environmental Management System' (EMS), such as ISO 14001?","options":["To determine the financial cost of a clean-up operation","To ensure 100% compliance with all environmental regulations","To provide a framework for an organization to manage its environmental responsibilities and impacts","conduct a one-time audit of a facility's environmental performance"],"answer":"3"},{"id":"70269","q":"What is the primary objective of the 'Closed-Loop Recycling' process?","options":["To incinerate waste to reduce its volume","To recycle materials back into the same product or a product of similar value","To convert waste materials into new products of lower value","To dispose of materials in a landfill"],"answer":"2"},{"id":"70270","q":"Which of the following is a common method for stabilizing hazardous waste before landfilling?","options":["Using a filter press to remove liquids.","Incineration","Bioremediation","Mixing the waste with cement or other pozzolanic materials."],"answer":"4"},{"id":"70271","q":"Which of the following is an example of a 'non-point source' of water pollution?","options":["Runoff of fertilizer and pesticides from agricultural fields.","A wastewater treatment plant discharge pipe.","A pipe from an industrial factory.","A storm sewer outfall pipe."],"answer":"1"},{"id":"70272","q":"Which of the following is the most environmentally responsible method for a municipality to manage household hazardous waste (e.g., old paint, batteries, and used motor oil)?","options":["Encouraging residents to pour it down the drain or into the garbage.","Providing a designated one-day-per-year collection event at a central location.","Building a large-scale municipal incinerator to burn all hazardous waste.","Partnering with a licensed and certified hazardous waste management company for regular collection and treatment."],"answer":"4"},{"id":"70273","q":"Which of the following describes a key environmental advantage of digestion over composting for organic waste?","options":["It can process a wider variety of waste, including plastics and metals.","produces a compost that is ready to use in a shorter period.","It captures the methane gas produced, which can be used as a renewable energy source.","It can be done in an open-air pile, making it a low-cost method."],"answer":"3"},{"id":"70274","q":"In the context of a new urban development project, which of the following is an example of an off-site mitigation measure?","options":["Installing permeable pavement in the parking lots to reduce stormwater runoff.","Building a green roof on a new building within the development to manage stormwater runoff.","Re-establishing a wetland in a different location to compensate for the loss of a wetland on the development site.","Avoiding construction in a sensitive ecological area of the site to prevent habitat destruction."],"answer":"3"},{"id":"70275","q":"Which of the following is an example of a waste management strategy based on reverse logistics?","options":["An electronics company establishes a system to retrieve used products from consumers for repair, reuse, or recycling.","A manufacturing company designs its products to be more easily recyclable at the end of their life.","A company reduces the amount of packaging for its products to minimize waste.","A municipality's waste management authority sets up a new sorting facility."],"answer":"1"},{"id":"70276","q":"What is a major challenge in developing a waste-to-hydrogen facility?","options":["The process produces more greenhouse gases than traditional incineration.","There is no market for the hydrogen produced from waste.","The inability of the technology to process different types of waste.","The high cost and technological complexity of converting waste into a clean-burning fuel."],"answer":"4"},{"id":"70277","q":"In the context of hazardous waste treatment, vitrification is a process that is often used for:","options":["The solidification and stabilization of low-level radioactive waste.","The biological treatment of organic solvents.","The separation of plastics from a mixed recycling stream.","The incineration of medical waste in a hospital."],"answer":"1"},{"id":"70278","q":"What is the difference between \"reuse\" and \"recycling\"?","options":["There is no difference; the terms are interchangeable.","Reuse is using an item again in its original form, while recycling involves breaking d item to make new products.","Reuse is for plastic only, and recycling is for paper.","Recycling is better for the environment than reuse."],"answer":"2"},{"id":"70279","q":"In which year did the word 'sustainable development' come into existence?","options":["1992","1978","1980","1987"],"answer":"4"},{"id":"70280","q":"Which of the following is a significant concern related to the long-term storage of radioactive waste?","options":["Biological degradation","Thermal instability","Radiation leakage","High flammability"],"answer":"3"},{"id":"70281","q":"What is the term for the sustainable use and management of forests for environmental, economic, and social benefits?","options":["Afforestation","Deforestation","Reforestation","Sustainable forestry"],"answer":"4"},{"id":"70282","q":"According to the Plastic Waste Management Rules, 2016, a system of \"producer responsibility organization\" (PRO) is introduced to:","options":["Produce more plastic","Fund government officials","Assistant producers in setting up a system for plastic waste collection and recycling.","Distribute free plastic bags"],"answer":"3"},{"id":"70283","q":"What is the purpose of a buffer zone around a solid waste processing and disposal facility as per the SWM Rules, 2016?","options":["To promote the growth of trees.","To create a recreational area for the public.","To minimize the nuisance of odour, flies, and noise.","To generate additional revenue for the local body."],"answer":"3"},{"id":"70284","q":"What is the term for the process of restoring or enhancing ecosystems to improve their ecological function and biodiversity?","options":["Greenwashing","Conservation","Restoration ecology","Desertification"],"answer":"3"},{"id":"70285","q":"What is the main environmental hazard of improperly disposing of lithium-ion batteries found in e-waste?","options":["Soil acidification","Water contamination","Air pollution","Forest fires"],"answer":"2"},{"id":"70286","q":"Which of the following is NOT a stage in the Environmental Impact Assessment (EIA) process in India?","options":["Scoping","Financial Assessment","Public Hearing","Screening"],"answer":"2"},{"id":"70287","q":"What is the purpose of the 'baseline data collection' stage in an EIA?","options":["To predict the future financial profitability of the project.","To collect information on the current environmental and social status of the project area.","To determine the legal framework for the project's operation.","To outline the specific mitigation measures for the project"],"answer":"2"},{"id":"70288","q":"According to recent data from the European Union, what percentage of the total waste generated in the EU in 2022 was classified as hazardous?","options":["Less than 2%","Approximately 5%","About 15%","Over 25%"],"answer":"2"},{"id":"70289","q":"What is the term for the process of restoring damaged ecosystems to their natural state?","options":["Sustainable development","Conservation","Ecological restoration","Desertification"],"answer":"3"},{"id":"70290","q":"The generation of hazardous waste is projected to increase in the coming years. By what percentage is the total global waste production (including both municipal and hazardous waste) expected to increase by 2050, according to recent World Bank estimates?","options":["10%","25%","70%","100%"],"answer":"3"},{"id":"70291","q":"ASP is a/an treatment of which of the following?","options":["anaerobic","aerobic","facultative","None of the above"],"answer":"2"},{"id":"70292","q":"Oxidation ditch is essentially process.","options":["trickling filter","RBC","UASB","extended aeration"],"answer":"4"}];
let idx=0, answers={}, timerSec=3900, timerInt=null;

function render(){
  const q=DATA[idx];
  if(!q){document.getElementById('qText').textContent='No data.';return;}
  document.getElementById('qNum').textContent=idx+1;
  document.getElementById('qTotal').textContent=DATA.length;
  document.getElementById('qText').textContent=q.q;
  document.getElementById('opts').innerHTML=q.options.map((o,i)=>
    `<div class="option ${answers[idx]==(i+1)?'selected':''}" onclick="select(${i+1})">${String.fromCharCode(65+i)}. ${o}</div>`
  ).join('');
}
window.select=o=>{answers[idx]=o; render();};
window.prev=()=>{if(idx>0){idx--; render();}};
window.next=()=>{if(idx<DATA.length-1){idx++; render();}};

function submitTest(){
  clearInterval(timerInt);
  let c=0; for(let i=0;i<DATA.length;i++){if(answers[i]==DATA[i].answer)c++;}
  const pct=Math.round(c/DATA.length*100)||0;
  document.getElementById('qCard').classList.add('hidden');
  document.getElementById('resCard').classList.remove('hidden');
  document.getElementById('score').textContent=pct+'%';
  document.getElementById('detail').innerHTML='<b>'+c+'/'+DATA.length+'</b> correct';
}

function tick(){timerSec--; document.getElementById('timer').textContent=Math.floor(timerSec/60)+':'+String(timerSec%60).padStart(2,'0'); document.getElementById('bar').style.width=(timerSec/3900*100)+'%'; if(timerSec<=0){clearInterval(timerInt); submitTest();}}

render(); timerInt=setInterval(tick,1000);
</script>
