<!DOCTYPE html>
<html lang="hi">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>ASWMO — T25 Full Test-Tech</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
:root{--bg:#0b0c15;--surface:#12142a;--text:#e4e6f0;--accent:#00e8a0;--gold:#f0c040;--danger:#ff4d6d;--border:rgba(255,255,255,.08);--muted:#8a8fa8;}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:Inter,system-ui,sans-serif;background:radial-gradient(1000px 700px at 20% 0%,#00e8a011,transparent),var(--bg);color:var(--text);min-height:100vh;line-height:1.55;}
.container{max-width:900px;margin:2rem auto;padding:0 1.2rem;}
h1{font-size:1.6rem;font-weight:700;background:linear-gradient(135deg,#fff,var(--accent));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.card{background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:16px;padding:1.5rem;margin-bottom:1rem;}
.question{font-size:1.05rem;font-weight:500;margin-bottom:.8rem;line-height:1.35;}
.options{display:grid;gap:.5rem;}
.option{padding:.7rem 1rem;background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:10px;cursor:pointer;font-size:.92rem;transition:.2s;}
.option:hover,.option.selected{border-color:var(--accent);background:rgba(0,232,160,.12);font-weight:600;}
.timer{font-family:monospace;font-weight:700;font-size:2rem;color:var(--accent);}
button{background:linear-gradient(135deg,var(--accent),#00b87e);color:#0a0c12;border:none;padding:.7rem 1.4rem;border-radius:10px;font-weight:700;cursor:pointer;}
.hidden{display:none!important}</style>
</head>
<body>
<div class="container">
<header><h1 id="ptitle">ASWMO — T25 Full Test-Tech</h1></header>

<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;">
<div><div class="timer" id="timer">65:00</div><div style="font-size:.75rem;color:var(--muted);">Time Remaining</div></div>
<button onclick="submitTest()">Submit Test</button></div>
<div style="height:6px;background:rgba(255,255,255,.1);border-radius:3px;overflow:hidden;margin-top:.5rem;"><div id="bar" style="height:100%;width:100%;background:linear-gradient(90deg,var(--accent),#00b87e);transition:width 1s linear;"></div></div></div>

<div class="card" id="qCard">
<div style="font-size:.8rem;color:var(--muted);margin-bottom:.4rem;">Question <span id="qNum">1</span> / <span id="qTotal">?</span></div>
<div class="question" id="qText">Loading...</div>
<div class="options" id="opts"></div>
<div style="margin-top:1rem;display:flex;gap:.5rem;flex-wrap:wrap;">
<button onclick="prev()">&#8592; Prev</button><button onclick="next()">Next &#8594;</button><button onclick="submitTest()">Submit</button></div>
</div>

<div class="card hidden" id="resCard" style="text-align:center;padding:2rem;">
<h2 style="color:var(--gold);font-size:2rem;">Test Completed!</h2>
<div id="score" style="font-size:3rem;font-weight:800;color:var(--accent);margin:1rem 0;"></div>
<div id="detail" style="color:var(--muted);font-size:.95rem;"></div>
<div style="margin-top:1.5rem;"><a href="index.html" style="color:var(--accent);font-weight:600;">&#8592; Back</a></div>
</div>
</div>

sues being tackled at present. Which of the following is a good example for it?","options":["Keep parks and roads clean","Use less water to clean vessels","Recycle non- biodegradable waste","Reduce use of electronic gadgets"],"answer":"3"},{"id":"77387","q":"Which of the following statements are correct? Stationary containers: They are used for contents to be directly transferred to a processing plant, transfer station, or disposal site for emptying before being returned to the storage site. Hauled containers: These are used for contents to be transferred to collection vehicles at the site of storage.","options":["Only 1","Only 2","Both 1 and 2","Neither 1 nor 2"],"answer":"4"},{"id":"77388","q":"Which of the following is NOT one of the advantages of hauled container system used in collection of solid wastes?","options":["Useful when generation rate is high and containers are large","May eliminate spillage associated with multiple smaller containers","Utilization rate is high even if the containers are not filled","It is flexible. A larger container can be used if more capacity is needed."],"answer":"3"},{"id":"77389","q":"Which one of the following is not a method of drying?","options":["Convection drying","Conduction drying","Radiation drying","Microwave-vacuum drying"],"answer":"4"},{"id":"77390","q":"The municipal solid waste does NOT normally include which of the following waste types generated by a community?","options":["Municipal services waste","Institutional waste","Demolition Waste","Industrial Waste"],"answer":"4"},{"id":"77391","q":"Biodegradable organic waste is part of","options":["both domestic and industrial waste","industrial waste","domestic waste","None"],"answer":"1"},{"id":"77392","q":"In India, Central Pollution Control Board (CPCB) has been mandated to formulate the guidelines for thermoset plastic, it is an important feature in which of the following?","options":["Bio-Medical Waste Management Rules, 2016","Plastic Waste Management (Amendment nd submitted with the EC application?","options":["Environmental Rights Report","Environmental Management Plan (EMP)","Traffic Report","Profit & Loss Statement"],"answer":"2"},{"id":"77411","q":"Baseline environmental data in an EIA refers to:","options":["Future climatic projections","Existing environmental conditions before the project","Data from other countries","Financial baseline"],"answer":"2"},{"id":"77412","q":"Hazardous waste is generally defined as waste that:","options":["Occupies more landfill space","Is biodegradable","Exhibits characteristics like toxicity, ignitability, corrosivity, or reactivity","Is generated only from households"],"answer":"3"},{"id":"77413","q":"Which of the following is NOT a typical characteristic of hazardous waste?","options":["Toxic","Corrosive","Bio-degradable","Reactive"],"answer":"3"},{"id":"77414","q":"Classification of hazardous waste is generally based on:","options":["Colour of waste container","Physical state and hazardous characteristics","Weather conditions","The age of waste"],"answer":"2"},{"id":"77415","q":"A major source of hazardous waste in urban areas is:","options":["Grocery stores","Petrochemical industries","Vegetable markets","Hair salons"],"answer":"2"},{"id":"77416","q":"Improper storage of hazardous waste mainly increases the risk of:","options":["Faster recycling","Fire, explosion, and leakage","Clean groundwater","Reduced toxicity"],"answer":"2"},{"id":"77417","q":"In developing countries, one major challenge in hazardous waste management is:","options":["Excessive budget allocation","Lack of proper infrastructure and trained personnel","Too many treatment facilities","Strict enforcement of regulations"],"answer":"2"},{"id":"77418","q":"Hazardous waste should ideally be stored in containers that are:","options":["Open at the top for ventilation","Compatible with the waste and leak-proof","Made from recycled paper","Placed directly into soil pits"],"answer":"2"},{"id":"77419","q":"Collection of hazardous waste from industries typically requires:","options":["Untrained labour","Specialized handling and labelled containers","Mixing with municipal waste","Open burning"],"answer":"2"},{"id":"77420","q":"Protection of public health in hazardous waste management focuses on:","options":["Minimizing exposure to toxic chemicals and preventing contamination","Increasing landfill size","Storing all waste together","Reducing employment"],"answer":"1"},{"id":"77421","q":"Which physical treatment method is commonly used for hazardous waste?","options":["Ozonation","Evaporation, sedimentation, filtration","Incineration only","Biological composting"],"answer":"2"},{"id":"77422","q":"The Plastic Waste Management Rules, 2016 apply to:","options":["Only urban areas","All villages with population above 10,000","Every municipal area, Gram Panchayat, producer, brand owner, and plastic user","Only plastic manufacturing industries"],"answer":"3"},{"id":"77423","q":"Under PWM Rules, 2016 (as amended), registration of PIBOs (Producers, Importers & Brand Owners) must be obtained through:","options":["State-only registration","CPCB’s centralised EPR portal for plastic","District-level committees","Ministry of Housing and Urban Affairs"],"answer":"2"},{"id":"77424","q":"Under E-Waste Rules 2016, producers must submit annual compliance reports to:","options":["State Pollution Control Board only","CPCB through online portal","Municipal Corporation","Ministry of Electronics"],"answer":"2"},{"id":"77425","q":"Biomedical waste is defined as:","options":["Any solid waste from households","Waste generated during diagnosis, treatment, or immunization of humans or animals","E-waste only","Plastic and municipal waste"],"answer":"2"},{"id":"77426","q":"The Solid Waste Management Rules, 2016 apply to:","options":["Only cities with population above 1 lakh","All urban local bodies, towns, and census towns","Only state capitals","Only municipal corporations"],"answer":"2"}];
let idx=0, answers={}, timerSec=3900, timerInt=null;

function render(){
  const q=DATA[idx];
  if(!q){document.getElementById('qText').textContent='No data.';return;}
  document.getElementById('qNum').textContent=idx+1;
  document.getElementById('qTotal').textContent=DATA.length;
  document.getElementById('qText').textContent=q.q;
  document.getElementById('opts').innerHTML=q.options.map((o,i)=>
    `<div class="option ${answers[idx]==(i+1)?'selected':''}" onclick="select(${i+1})">${String.fromCharCode(65+i)}. ${o}</div>`
  ).join('');
}
window.select=o=>{answers[idx]=o; render();};
window.prev=()=>{if(idx>0){idx--; render();}};
window.next=()=>{if(idx<DATA.length-1){idx++; render();}};

function submitTest(){
  clearInterval(timerInt);
  let c=0; for(let i=0;i<DATA.length;i++){if(answers[i]==DATA[i].answer)c++;}
  const pct=Math.round(c/DATA.length*100)||0;
  document.getElementById('qCard').classList.add('hidden');
  document.getElementById('resCard').classList.remove('hidden');
  document.getElementById('score').textContent=pct+'%';
  document.getElementById('detail').innerHTML='<b>'+c+'/'+DATA.length+'</b> correct';
}

function tick(){timerSec--; document.getElementById('timer').textContent=Math.floor(timerSec/60)+':'+String(timerSec%60).padStart(2,'0'); document.getElementById('bar').style.width=(timerSec/3900*100)+'%'; if(timerSec<=0){clearInterval(timerInt); submitTest();}}

render(); timerInt=setInterval(tick,1000);
</script>
</body></html>
