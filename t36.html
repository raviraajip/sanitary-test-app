<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>ASWMO — T36 Non-Tech</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
:root{--bg:#0b0c15;--surface:#12142a;--text:#e4e6f0;--accent:#00e8a0;--gold:#f0c040;--danger:#ff4d6d;--border:rgba(255,255,255,.08);--muted:#8a8fa8;}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:Inter,system-ui,sans-serif;background:radial-gradient(1000px 700px at 20% 0%,#00e8a011,transparent),var(--bg);color:var(--text);min-height:100vh;line-height:1.55;}
.container{max-width:900px;margin:2rem auto;padding:0 1.2rem;}
h1{font-size:1.6rem;font-weight:700;background:linear-gradient(135deg,#fff,var(--accent));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.card{background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:16px;padding:1.5rem;margin-bottom:1rem;}
.question{font-size:1.05rem;font-weight:500;margin-bottom:.8rem;line-height:1.35;}
.options{display:grid;gap:.5rem;}
.option{padding:.7rem 1rem;background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:10px;cursor:pointer;font-size:.92rem;transition:.2s;}
.option:hover,.option.selected{border-color:var(--accent);background:rgba(0,232,160,.12);font-weight:600;}
.timer{font-family:monospace;font-weight:700;font-size:2rem;color:var(--accent);}
button{background:linear-gradient(135deg,var(--accent),#00b87e);color:#0a0c12;border:none;padding:.7rem 1.4rem;border-radius:10px;font-weight:700;cursor:pointer;}
.hidden{display:none!important}</style>
</head>
<body>
<div class="container">
<header><h1 id="ptitle">ASWMO — T36 Non-Tech</h1></header>

<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;">
<div><div class="timer" id="timer">65:00</div><div style="font-size:.75rem;color:var(--muted);">Time Remaining</div></div>
<button onclick="submitTest()">Submit Test</button></div>
<div style="height:6px;background:rgba(255,255,255,.1);border-radius:3px;overflow:hidden;margin-top:.5rem;"><div id="bar" style="height:100%;width:100%;background:linear-gradient(90deg,var(--accent),#00b87e);transition:width 1s linear;"></div></div></div>

<div class="card" id="qCard">
<div style="font-size:.8rem;color:var(--muted);margin-bottom:.4rem;">Question <span id="qNum">1</span> / <span id="qTotal">?</span></div>
<div class="question" id="qText">Loading...</div>
<div class="options" id="opts"></div>
<div style="margin-top:1rem;display:flex;gap:.5rem;flex-wrap:wrap;">
<button onclick="prev()">&#8592; Prev</button><button onclick="next()">Next &#8594;</button><button onclick="submitTest()">Submit</button></div>
</div>

<div class="card hidden" id="resCard" style="text-align:center;padding:2rem;">
<h2 style="color:var(--gold);font-size:2rem;">Test Completed!</h2>
<div id="score" style="font-size:3rem;font-weight:800;color:var(--accent);margin:1rem 0;"></div>
<div id="detail" style="color:var(--muted);font-size:.95rem;"></div>
<div style="margin-top:1.5rem;"><a href="index.html" style="color:var(--accent);font-weight:600;">&#8592; Back</a></div>
</div>
</div>

nsidered the \"best\" in the average case with a time complexity of O(n log n)?","options":["Bubble Sort","Selection Sort","Quick Sort","Insertion Sort"],"answer":"3"},{"id":"80560","q":"The \"Ramsar Convention\" is an international treaty for the conservation and sustainable use of:","options":["Forests","Oceans","Wetlands","Mountains"],"answer":"3"},{"id":"80561","q":"Which tributary of the Ganga is also known as the \"Kaligandaki\" in Nepal?","options":["Burhi Gandak","Gandak","Kosi","Kamala"],"answer":"2"},{"id":"80562","q":"The \"Powerhouse of the Cell\" is Mitochondria. Who discovered it?","options":["Robert Hooke","Richard Altmann (called them Bioblasts)","Camillo Golgi","Christian de Duve"],"answer":"2"},{"id":"80563","q":"Which Article of the Constitution deals with \"Equal Justice and Free Legal Aid\"?","options":["Article 38","Article 39A","Article 41","Article 43A"],"answer":"2"},{"id":"80564","q":"In computer security, \"AES\" stands for:","options":["Advanced Encryption Standard","Automated Email System","Advanced Electronic Software","Analog Encryption System"],"answer":"1"},{"id":"80565","q":"\"Anugrah Narayan Sinha\" was the first Deputy Chief Minister and Finance Minister of Bihar. He was popularly known as:","options":["Desh Ratna","Bihar Vibhuti","Lok Nayak","Sher-e-Bihar"],"answer":"2"},{"id":"80566","q":"\"Near Money\" refers to assets that:","options":["Are already in the form of cash","Can be easily converted into cash (like T-bills)","Are used in barter systems","Are counterfeit currency"],"answer":"2"},{"id":"80567","q":"What is the value of the \"Gravitational Constant\" (G)?","options":["6.67×10−11Nm2/kg2","9.8m/s2","6.022×1023","1.6×10−19C"],"answer":"1"},{"id":"80568","q":"Which Article provides for the \"Establishment and Constitution of High Courts\" for States?","options":["Article 124","Article 214","Article 226","Article 231"],"answer":"2"},{"id":"80569","q":"\"Project Elephant\" was launched in India in which year?","options":["1973","1980","1992","2000"],"answer":"3"},{"id":"80570","q":"In MS-PowerPoint, the shortcut to \"Insert a Hyperlink\" is:","options":["Ctrl + H","Ctrl + K","Ctrl + L","Ctrl + M"],"answer":"2"},{"id":"80571","q":"The \"Great Indian Desert\" is also known as:","options":["Sahara","Gobi","Thar","Atacama"],"answer":"3"},{"id":"80572","q":"\"Heavy Water\" (D2​O) is used in nuclear reactors primarily as a:","options":["Fuel","Coolant","Moderator","Shielding material"],"answer":"3"},{"id":"80573","q":"The \"Tripuri Session\" (1939) of the Congress is famous because:","options":["Subhas Chandra Bose resigned as President","The Quit India resolution was passed","Gandhi became the President","The National Planning Committee was set up"],"answer":"1"},{"id":"80574","q":"What is the full form of \"PNG\" in computer graphics?","options":["Portable Network Graphics","Personal Network Graphics","Printable Network Graphics","Private Network Graphics"],"answer":"1"},{"id":"80575","q":"The \"Kosi Project\" is a joint venture between India and:","options":["Bhutan","Bangladesh","Nepal","Myanmar"],"answer":"3"},{"id":"80576","q":"Which hormone is secreted by the \"Pineal Gland\" to regulate the sleep-wake cycle?","options":["Insulin","Melatonin","Adrenaline","Thyroxine"],"answer":"2"},{"id":"80577","q":"\"Disguised Unemployment\" is a common feature in which sector of the Indian economy?","options":["Industry","Services","Agriculture","Banking"],"answer":"3"},{"id":"80578","q":"In the \"Client-Server\" model, which port is standard for \"DNS\" (Domain Name System)?","options":["21","53","80","443"],"answer":"2"},{"id":"80579","q":"The \"Battle of Buxar\" (1764) led to the signing of the:","options":["Treaty of Madras","Treaty of Allahabad","Treaty of Paris","Treaty of Salbai"],"answer":"2"},{"id":"80580","q":"What is the SI unit of \"Magnetic Inductance\" (Self or Mutual)?","options":["Tesla","Weber","Henry","Weber/meter"],"answer":"3"},{"id":"80581","q":"Which era is the official \"National Calendar\" of India based on?","options":["Vikram Era","Saka Era","Gupta Era","Hijri Era"],"answer":"2"}];
let idx=0, answers={}, timerSec=3900, timerInt=null;

function render(){
  const q=DATA[idx];
  if(!q){document.getElementById('qText').textContent='No data.';return;}
  document.getElementById('qNum').textContent=idx+1;
  document.getElementById('qTotal').textContent=DATA.length;
  document.getElementById('qText').textContent=q.q;
  document.getElementById('opts').innerHTML=q.options.map((o,i)=>
    `<div class="option ${answers[idx]==(i+1)?'selected':''}" onclick="select(${i+1})">${String.fromCharCode(65+i)}. ${o}</div>`
  ).join('');
}
window.select=o=>{answers[idx]=o; render();};
window.prev=()=>{if(idx>0){idx--; render();}};
window.next=()=>{if(idx<DATA.length-1){idx++; render();}};

function submitTest(){
  clearInterval(timerInt);
  let c=0; for(let i=0;i<DATA.length;i++){if(answers[i]==DATA[i].answer)c++;}
  const pct=Math.round(c/DATA.length*100)||0;
  document.getElementById('qCard').classList.add('hidden');
  document.getElementById('resCard').classList.remove('hidden');
  document.getElementById('score').textContent=pct+'%';
  document.getElementById('detail').innerHTML='<b>'+c+'/'+DATA.length+'</b> correct';
}

function tick(){timerSec--; document.getElementById('timer').textContent=Math.floor(timerSec/60)+':'+String(timerSec%60).padStart(2,'0'); document.getElementById('bar').style.width=(timerSec/3900*100)+'%'; if(timerSec<=0){clearInterval(timerInt); submitTest();}}

render(); timerInt=setInterval(tick,1000);
</script>
