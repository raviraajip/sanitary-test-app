const DATA=[{"id":"80222","q":"Sample A (100 kg) has a moisture content of 20%, and Sample B (100 kg) has a moisture content of 60%. If mixed, what is the resultant moisture content of the mixture?","options":["30%","40%","50%","35%"],"answer":"2","solution":"To find the combined moisture content, we must look at the total mass of water versus the total mass of the mixture. Sample A: Total Mass = 100 kg. Moisture = 20%. Mass of Water = 100 0.20 = 20 kg. Sample B: Total Mass = 100 kg. Moisture = 60%. Mass of Water = 100 0.60 = 60 kg. Mixture: Total Mass of Mixture = 100 + 100 = 200 kg. Total Mass of Water = 20 + 60 = 80 kg. Resultant Moisture Content (%): MC = MC ="},{"id":"80223","q":"In the context of EPR (Extended Producer Responsibility), a \"PRO\" stands for:","options":["Public Relations Officer","Producer Responsibility Organization","Pollution Regulation Office","Product Recycling Order"],"answer":"2","solution":"PRO stands for Producer Responsibility Organization. Under the Plastic Waste Management and E-Waste Management Rules, producers (manufacturers/importers) are financially responsible for the end-of-life management of their products. A PRO is a professional organization authorized to take on this responsibility on behalf of producers. They facilitate the collection, recycling, and disposal of waste to meet the producers' EPR targets."},{"id":"80224","q":"Which zone in a sedimentation tank is designed to prevent the resuspension of settled particles?","options":["Inlet Zone","Outlet Zone","Sludge Zone","Settling Zone"],"answer":"3","solution":"A sedimentation tank is divided into four main zones: Inlet Zone: Dissipates energy and distributes flow. Settling Zone: Where particles settle undisturbed. Outlet Zone: Collects clarified effluent. Sludge Zone: The bottom zone where settled solids accumulate. It is designed (often with a slope or scraper mechanism) to store and compact sludge while preventing the resuspension of these settled particles back into the flowing water caused by turbulence or scour."},{"id":"80225","q":"If the noise level from one machine is 60 dB and from a second identical machine is also 60 dB, what is the combined noise level? (Logarithmic addition)","options":["120 dB","60 dB","63 dB","90 dB"],"answer":"3","solution":"Decibels (dB) are logarithmic units and cannot be added arithmetically (60 + 60 120). Rule of Thumb: Adding two equal sound sources increases the total level by 3 dB . Formula: Calculation:"},{"id":"80226","q":"Hazardous Waste Rules, 2016, categorizes wastes into how many schedules?","options":["4","6","8","3"],"answer":"3","solution":"The Hazardous and Other Wastes (Management and Transboundary Movement) Rules, 2016 contains 8 Schedules: Schedule I: Processes generating hazardous waste. Schedule II: Waste constituents with concentration limits (Class A, B, C). Schedule III: List of hazardous wastes applicable for import/export (Part A & B). Schedule IV: List of commonly recyclable hazardous wastes. Schedule V: List of wastes requiring specific permission for import/export. Schedule VI: Hazardous wastes prohibited for import. Schedule VII: List of authorities and corresponding duties. Schedule VIII: Documents for verification."},{"id":"80227","q":"Which gas is released by the anaerobic decomposition of organic matter in a Septic Tank?","options":["Oxygen","Hydrogen Sulfide ( ) and Methane","Chlorine gas","Nitrogen dioxide"],"answer":"2","solution":"A Septic Tank functions as an anaerobic digester (absence of oxygen). Anaerobic bacteria break down organic matter, producing Biogas . The primary components of this gas are Methane ( ) , Carbon Dioxide ( ), and trace amounts of odorous gases like Hydrogen Sulfide ( ) (rotten egg smell). Oxygen is consumed, not released."},{"id":"80228","q":"A waste sample has an energy content of 4000 kJ/kg. What is this value in kcal/kg? (Use 1 kcal = 4.184 kJ)","options":["850 kcal/kg","956 kcal/kg","1000 kcal/kg","16000 kcal/kg"],"answer":"2","solution":"Given: Energy = 4000 kJ/kg. Conversion Factor: 1 kcal = 4.184 kJ. To convert kJ to kcal, divide by 4.184."},{"id":"80229","q":"Biomedical Waste rules apply to:","options":["Hospitals & Nursing Homes","Veterinary Institutions","Blood Banks & Path Labs","All of the above"],"answer":"4","solution":"The Bio-Medical Waste Management Rules, 2016 apply to all persons who generate, collect, receive, store, transport, treat, dispose, or handle bio-medical waste in any form. This explicitly includes: Hospitals, nursing homes, clinics, dispensaries. Veterinary institutions , animal houses. Pathological laboratories, blood banks . Ayush hospitals, research or educational institutions, and health camps."},{"id":"80230","q":"What is the main purpose of \"Equalization Tank\" in an ETP?","options":["To remove oil and grease.","To dampen flow and concentration fluctuations.","To settle sludge.","To aerate the waste."],"answer":"2","solution":"An Equalization Tank is used to store wastewater temporarily to smooth out variations in flow rate and contaminant concentration (shock loads) over time. Homogenization: It mixes strong and weak wastes to produce a uniform effluent. Flow Control: It delivers a constant flow rate to the subsequent biological treatment units, protecting sensitive bacteria from shock loads or pH spikes."},{"id":"80231","q":"If a city has a population of 1 lakh and the per capita water supply is 135 LPCD. Assuming 80% becomes sewage, calculate the total sewage generation in MLD.","options":["13.5 MLD","10.8 MLD","108 MLD","8.0 MLD"],"answer":"2","solution":"Total Water Supply: Liters/person/day = 1,35,00,000 Liters/day = 13.5 MLD (Million Liters per Day) Sewage Generation: Standard assumption (CPHEEO Manual) is that 80% of water supply becomes sewage. Sewage = MLD Sewage = 10.8 MLD"},{"id":"80232","q":"Which method is best suited for the disposal of Petrochemical Industry oily sludge?","options":["Composting","Incineration / Co-processing in Cement Kiln","Open Dumping","River Discharge"],"answer":"2","solution":"Petrochemical oily sludge is a Hazardous Waste with high calorific value but toxic organic content. Incineration: Completely destroys the toxic organics at high temperatures. Co-processing: Using the sludge as an alternative fuel in cement kilns is highly preferred as it utilizes the energy content (calorific value) while destroying pollutants, aligning with the \"Waste to Energy\" principle. Composting is not suitable due to toxicity; dumping is illegal."},{"id":"80233","q":"The Stockholm Convention targets:","options":["Transboundary Hazardous Waste","Persistent Organic Pollutants (POPs)","Wetland Conservation","Mercury Pollution"],"answer":"2","solution":"Stockholm Convention (2001): An international treaty to eliminate or restrict the production and use of Persistent Organic Pollutants (POPs) like DDT, PCBs, and Dioxins. Basel Convention: Transboundary Hazardous Waste. Ramsar Convention: Wetlands. Minamata Convention: Mercury."},{"id":"80234","q":"Calculate the Volume of a circular sedimentation tank with Diameter = 20m and Depth = 3m.","options":["","","",""],"answer":"3","solution":"Formula for Volume of Cylinder: V = h or V = Calculation: Diameter (D) = 20 m Depth (h) = 3 m V = V = V ="},{"id":"80235","q":"HDPE (High-Density Polyethylene) geomembranes are widely used in landfills as:","options":["Daily cover","Bottom Liners","Gas vents","Leachate pipes"],"answer":"2","solution":"HDPE Geomembranes are the industry standard for Bottom Liners in sanitary landfills. Why? They have excellent chemical resistance to leachate, high tensile strength, and extremely low permeability (preventing leachate from contaminating groundwater). They act as the primary barrier in composite liner systems (along with compacted clay or GCL)."},{"id":"80236","q":"Which of the following is a Secondary Air Pollutant?","options":["","","Ozone ( )","CO"],"answer":"3","solution":"Primary Pollutants: Emitted directly from a source (e.g., from factories, CO from cars, ). Secondary Pollutants: Formed in the atmosphere through chemical reactions between primary pollutants and other atmospheric components (usually driven by sunlight). Ground-level Ozone ( ) is a classic secondary pollutant formed by the reaction of NOx and VOCs in the presence of sunlight (Photochemical Smog)."},{"id":"80237","q":"The National Air Quality Index (AQI) has how many categories?","options":["4","5","6","8"],"answer":"3","solution":"The National AQI in India classifies air quality into 6 categories, each with a specific color code and health advisory: Good (0-50) - Green Satisfactory (51-100) - Light Green Moderate (101-200) - Yellow Poor (201-300) - Orange Very Poor (301-400) - Red Severe (401-500) - Maroon"},{"id":"80238","q":"If the Carbon content is 40% and Nitrogen content is 1% in a waste sample, what is the C/N ratio?","options":["20","30","40","10"],"answer":"3","solution":"The C/N Ratio is simply the ratio of the mass of Carbon to the mass of Nitrogen. C/N = C/N = = 40 Note: A C/N ratio of 40 is slightly high for composting (ideal is 25-30), implying the process will be slow as microbes will be nitrogen-limited."},{"id":"80239","q":"Bhopal Gas Tragedy was caused by the leakage of:","options":["Ethyl Isocyanate","Methyl Isocyanate (MIC)","Potassium Cyanide","Sodium Isocyanate"],"answer":"2","solution":"The Bhopal Gas Tragedy (December 2-3, 1984) occurred at the Union Carbide India Limited (UCIL) pesticide plant. Water entered a tank containing Methyl Isocyanate (MIC) , triggering an exothermic reaction. This released a toxic cloud of MIC gas, killing thousands. It remains one of the world's worst industrial disasters."},{"id":"80240","q":"Under Construction & Demolition Waste Rules 2016, who is responsible for segregation of waste?","options":["The Municipality","The Waste Generator","The Recycler","The State Govt"],"answer":"2","solution":"Rule 4 (Duties of the waste generator): Every waste generator is responsible for segregating construction and demolition waste into four streams: (i) Concrete, (ii) Soil, (iii) Steel, wood & plastics, (iv) Bricks & mortar. They must deposit it at collection centres or hand it over to authorized processing facilities. The municipality processes it, but segregation is the generator's duty."},{"id":"80241","q":"Calculate the hydraulic loading rate ( day) of a trickling filter if Flow = 1000~ /day and Surface Area = 200~ .","options":["2","5","10","50"],"answer":"2","solution":"Formula: Hydraulic Loading Rate (HLR) = Calculation: HLR = HLR = This falls within the typical range for a Standard Rate Trickling Filter (1-4) or low range of High Rate."},{"id":"80242","q":"Eutrophication in water bodies is primarily caused by:","options":["Excess Carbon","Excess Nitrogen and Phosphorus","Heavy Metals","Oil Spills"],"answer":"2","solution":"Eutrophication is the enrichment of a water body with nutrients, leading to excessive growth of algae (algal blooms). The primary nutrients responsible are Nitrogen (from nitrates) and Phosphorus (from phosphates in detergents/fertilizers). This algal growth eventually dies and decomposes, consuming dissolved oxygen and killing fish (Hypoxia)."},{"id":"80243","q":"Which type of fire extinguisher is suitable for Class B (Flammable Liquids) fires?","options":["Water","Foam /","Dry Sand only","Wet Chemical"],"answer":"2","solution":"Class B Fires: Flammable liquids like petrol, diesel, oil, paints. Suitable Extinguishers: Foam (forms a blanket cutting off oxygen) or (displaces oxygen) or Dry Powder . Water should never be used on oil fires as oil floats on water, spreading the fire and potentially causing a steam explosion."},{"id":"80244","q":"If the concentration of a pollutant is 10 ppm in water, what is it in mg/L? (Assume density of water 1 kg/L)","options":["1 mg/L","10 mg/L","100 mg/L","0.1 mg/L"],"answer":"2","solution":"Concept: ppm = Parts Per Million = 1 part in parts. In water (density 1000 g/L or mg/L): 1 ppm = Therefore, for dilute aqueous solutions: 1 ppm = 1 mg/L . So, 10 ppm = 10 mg/L."},{"id":"80245","q":"Pyrolysis of tires produces:","options":["Compost","Char, Oil, and Gas","Glass","Ash only"],"answer":"2","solution":"Pyrolysis of waste tires (thermal decomposition without oxygen) yields three main value-added products: Pyrolysis Oil (Tire Oil): Liquid fuel (~40-50%). Carbon Black (Char): Solid residue (~30-35%). Syngas: Combustible gas used to power the reactor (~10-15%). (Steel wire is also recovered)."},{"id":"80246","q":"The Minamata Convention is related to:","options":["Lead","Mercury","Cadmium","Arsenic"],"answer":"2","solution":"The Minamata Convention on Mercury (adopted 2013, entered into force 2017) is a global treaty to protect human health and the environment from the adverse effects of Mercury (Hg). It is named after Minamata, Japan, the site of a devastating incident of mercury poisoning."},{"id":"80247","q":"Septage refers to:","options":["Solid waste from hospitals.","Liquid and solid material pumped from a septic tank.","Treated effluent from STP.","Stormwater runoff."],"answer":"2","solution":"Septage is the partially treated, semi-solid material (sludge, scum, and liquid) that is pumped out of a septic tank during cleaning. It has a much higher BOD and suspended solids content than raw sewage and requires specific treatment (Fecal Sludge Management)."},{"id":"80248","q":"Blue Baby Syndrome (Methemoglobinemia) is caused by excess of what in drinking water?","options":["Sulphates","Nitrates","Chlorides","Fluorides"],"answer":"2","solution":"Blue Baby Syndrome (Methemoglobinemia) occurs when infants consume water high in Nitrates ( ). Nitrates are converted to Nitrites ( ) in the body. Nitrites bind to hemoglobin to form Methemoglobin, which cannot carry oxygen effectively, turning the skin blue. Permissible limit (IS 10500): 45 mg/L."},{"id":"80249","q":"A sample of waste weighs 100 g. After drying in an oven at , it weighs 60 g. What is the Moisture Content (Wet Basis)?","options":["40%","60%","66%","20%"],"answer":"1","solution":"Formula (Wet Basis): Calculation: Initial Weight = 100 g Dry Weight = 60 g Water Loss = 40 g MC = MC = (Note: Dry basis moisture content would be 40/60 = 66.6\\%, but wet basis is standard for SWM)."},{"id":"80250","q":"Biopiles are used for the remediation of:","options":["Nuclear Waste","Petroleum Contaminated Soils","Medical Waste","E-Waste"],"answer":"2","solution":"Biopiles are an ex-situ bioremediation technology. Excavated soils contaminated with petroleum hydrocarbons (diesel, oil) are piled in heaps. Air is piped in (aeration), and nutrients/moisture are added to stimulate aerobic microbial activity, which degrades the hydrocarbons."},{"id":"80251","q":"Which act created the Central Pollution Control Board (CPCB)?","options":["Air Act, 1981","Water (Prevention and Control of Pollution) Act, 1974","Environment Protection Act, 1986","National Green Tribunal Act, 2010"],"answer":"2","solution":"The CPCB was constituted in September 1974 under the Water (Prevention and Control of Pollution) Act, 1974. Later, it was entrusted with powers and functions under the Air Act, 1981."},{"id":"80252","q":"Coagulation is the process of:","options":["Settling of large particles.","Destabilization of colloidal particles by adding chemicals (like Alum).","Filtering water through sand.","Disinfecting water."],"answer":"2","solution":"Coagulation is a chemical process used to remove colloidal particles (which are negatively charged and repel each other, preventing settling). Coagulants (like Alum/Ferric Chloride) provide positive charges that neutralize the negative charges ( Destabilization ). This allows the particles to come together and form flocs (Flocculation) which can then settle."},{"id":"80253","q":"The Self-Purification capacity of a stream depends on:","options":["Dilution and Oxygen Sag Curve.","Turbidity.","Hardness of water.","Conductivity."],"answer":"1","solution":"Self-purification involves natural recovery from pollution. Key mechanisms include: Dilution: Reduces concentration of pollutants. Oxygen Sag Curve: The balance between Deoxygenation (bacteria consuming DO to break down organics) and Reaeration (absorption of oxygen from the atmosphere/photosynthesis). If Reaeration rate > Deoxygenation rate, the stream recovers."},{"id":"80254","q":"If 50 kg of plastic waste is generated per household per year, and a city has 10,000 households, what is the annual plastic waste generation in tonnes?","options":["50 tonnes","500 tonnes","5000 tonnes","5 tonnes"],"answer":"2","solution":"Total Waste (kg): = 5,00,000 kg Convert to Tonnes: 1 Tonne = 1000 kg Total Tonnes = = 500 tonnes"},{"id":"80255","q":"Reverse Logistics is a key component of:","options":["Landfilling","Extended Producer Responsibility (EPR)","Incineration","Composting"],"answer":"2","solution":"Reverse Logistics refers to the supply chain process of moving goods from their typical final destination (the consumer) backward for the purpose of capturing value or proper disposal. It is the backbone of Extended Producer Responsibility (EPR), where producers must arrange for the collection (take-back) of E-waste, plastic packaging, or batteries from consumers to recycling centers."},{"id":"80256","q":"Which soil type is best suited for a Landfill Liner due to low permeability?","options":["Sand","Gravel","Clay","Loam"],"answer":"3","solution":"Clay is the preferred natural soil for landfill liners (Compact Clay Liner - CCL). It consists of very fine particles. When compacted, it achieves extremely low hydraulic conductivity (Permeability cm/sec). This prevents leachate from percolating through and contaminating groundwater. Sand and gravel are highly permeable."},{"id":"80257","q":"Baling of waste is done to:","options":["Increase moisture.","Reduce volume for transport/disposal (Densification).","Increase segregation.","Burn waste."],"answer":"2","solution":"Baling involves compressing waste (paper, plastic, cardboard, or even residual MSW) into dense blocks or \"bales\". Densification: It significantly reduces volume. Benefits: Reduces transportation costs (more weight per truck), saves landfill space, and makes handling recyclables easier."},{"id":"80258","q":"ISO 45001 deals with:","options":["Quality Management","Environment Management","Occupational Health and Safety","Energy Management"],"answer":"3","solution":"ISO 45001 is the international standard for Occupational Health and Safety (OH&S) management systems. It provides a framework for organizations to manage risks and improve OH&S performance. ISO 9001: Quality Management. ISO 14001: Environmental Management. ISO 50001: Energy Management."},{"id":"80259","q":"Aerosols are:","options":["Solid particles suspended in water.","Solid or liquid particles suspended in gas/air.","Gases dissolved in water.","Liquids dissolved in liquids."],"answer":"2","solution":"Aerosols are defined as a suspension of fine solid particles or liquid droplets in air or another gas. Examples include fog, mist, dust, fume, and smoke. They play a significant role in atmospheric chemistry, climate change (scattering light), and human health (respiratory issues)."},{"id":"80260","q":"The Global Warming Potential (GWP) of Methane over 100 years is approximately how many times that of ?","options":["1","10","25-28","100"],"answer":"3","solution":"Global Warming Potential (GWP) is a measure of how much heat a greenhouse gas traps in the atmosphere up to a specific time horizon, relative to Carbon Dioxide ( ). has a GWP of 1 (by definition). Methane ( ) has a GWP of approximately 25\u201328 over a 100-year period (IPCC values vary slightly between reports, typically cited as 25 or 28). Nitrous Oxide ( ) has a GWP of around 265\u2013298."},{"id":"80261","q":"Fecal Sludge Management (FSM) is critical for cities that rely on:","options":["Underground Sewerage Systems","On-site Sanitation Systems (Septic tanks/Pit latrines)","Open Defecation","Stormwater drains"],"answer":"2","solution":"Fecal Sludge Management (FSM) refers to the storage, collection, transport, treatment, and safe end-use or disposal of fecal sludge. It is specifically critical for areas relying on On-site Sanitation Systems (OSS) like septic tanks and pit latrines, which are not connected to a centralized sewerage network. The sludge accumulates and must be periodically emptied and treated (unlike sewers where waste flows continuously)."},{"id":"80262","q":"Which is the First \"Water Plus\" city of India?","options":["Indore","Surat","Pune","Chandigarh"],"answer":"1","solution":"Indore (Madhya Pradesh) was declared India's first \"Water Plus\" city under the Swachh Survekshan 2021. Water Plus criteria: A city must ensure that no untreated wastewater is discharged into the open environment/water bodies, and 30% of the treated wastewater is reused. Indore achieved this by tapping thousands of sewer outfalls that were draining into rivers."},{"id":"80263","q":"Electronic Waste (E-Waste) contains valuable metals like:","options":["Gold, Silver, Copper, Palladium","Uranium, Thorium","Calcium, Magnesium","Potassium, Sodium"],"answer":"1","solution":"E-Waste is often called an \"Urban Mine\" because it contains precious and special metals in concentrations higher than natural ores. Key Metals: Copper (Cu) , Gold (Au) , Silver (Ag) , Palladium (Pd) , and Platinum. It also contains hazardous metals like Lead, Mercury, and Cadmium, necessitating careful recycling."},{"id":"80264","q":"Bio-mining of legacy waste refers to:","options":["Mining for coal under waste.","Excavation and treatment of old dumpsites to recover land and fines.","Using bacteria to mine metals.","Creating new landfills."],"answer":"2","solution":"Bio-mining (or Biomining of Legacy Waste) is the process of excavating old, dumped waste (legacy waste) and processing it. Process: The waste is loosened (harrowed), sprayed with bioculture to stabilize it, and then segregated using trommels. Outcome: It separates the waste into RDF (combustible), soil enricher (bio-earth/fines), and inerts (stones). The primary goal is to reclaim valuable land occupied by dumpsites."},{"id":"80265","q":"Grit in wastewater consists of:","options":["Inorganic solids like sand, gravel, cinders.","Organic solids like food waste.","Dissolved salts.","Floating oil."],"answer":"1","solution":"Grit refers to heavy, inert, inorganic particulate matter such as sand, gravel, eggshells, metal fragments, and cinders. It has a higher specific gravity (approx. 2.65) than organic solids. It is removed in the Grit Chamber to prevent abrasion of mechanical equipment (pumps) and clogging of pipes."},{"id":"80266","q":"Which type of pump is commonly used for pumping sewage?","options":["Centrifugal Pump (Non-clogging)","Reciprocating Pump","Gear Pump","Peristaltic Pump"],"answer":"1","solution":"Sewage contains suspended solids, rags, and debris that can easily clog standard pumps. Centrifugal Pumps with non-clogging impellers (open or semi-open type) are the industry standard for sewage. They allow solids to pass through without getting stuck. Reciprocating and gear pumps have tight clearances and valves that would jam instantly with sewage."},{"id":"80267","q":"Crown Corrosion in concrete sewers is caused by:","options":["Sulfuric Acid ( ) formation from","Hydrochloric Acid","High velocity of flow","Heavy load of traffic"],"answer":"1","solution":"Crown Corrosion occurs at the top (crown) of concrete sewer pipes. Anaerobic bacteria in the sewage produce Hydrogen Sulfide ( ) gas. This gas rises to the crown (top air space) of the pipe. Aerobic bacteria ( Thiobacillus ) on the moist pipe surface oxidize into Sulfuric Acid ( ) . The acid eats away the concrete (calcium carbonate), causing the pipe to collapse."},{"id":"80268","q":"Public Hearing is a mandatory step in EIA for which category of projects?","options":["Category A and B1","Category B2","Only Building Construction","All projects"],"answer":"1","solution":"Under the EIA Notification 2006, Public Hearing is a mandatory step to ascertain the concerns of locally affected persons. It applies to Category A projects (Central clearance) and Category B1 projects (State clearance requiring EIA). Category B2 projects are generally exempt from Public Hearing and the full EIA study."},{"id":"80269","q":"What is the standard noise limit (Leq) for Residential Areas during the day?","options":["75 dB","65 dB","55 dB","50 dB"],"answer":"3","solution":"As per the Noise Pollution (Regulation and Control) Rules, 2000, the ambient air quality standards in respect of noise are: Industrial Area: Day 75 dB / Night 70 dB Commercial Area: Day 65 dB / Night 55 dB Residential Area: Day 55 dB / Night 45 dB Silence Zone: Day 50 dB / Night 40 dB"},{"id":"80270","q":"Ramsar Convention is related to the conservation of:","options":["Forests","Wetlands","Deserts","Coral Reefs"],"answer":"2","solution":"The Ramsar Convention (signed in Ramsar, Iran, in 1971) is an intergovernmental treaty that provides the framework for national action and international cooperation for the conservation and wise use of Wetlands and their resources."},{"id":"80271","q":"Which of the following is NOT a characteristic of Hazardous Waste?","options":["Ignitability","Corrosivity","Reactivity","Solubility (in water)"],"answer":"4","solution":"The EPA and Indian Hazardous Waste Rules typically classify waste as hazardous if it exhibits one or more of the following four characteristics (often remembered as TRIC or CRIT): I gnitability (Flammable) C orrosivity (Acids/Bases) R eactivity (Explosive/Unstable) Toxicity (Leaches toxic chemicals) Solubility itself is a physical property, not a defining characteristic of hazard (sugar is soluble but not hazardous)."},{"id":"80272","q":"Namami Gange Programme functions under which Ministry?","options":["Ministry of Jal Shakti","Ministry of Agriculture","Ministry of Power","Ministry of Tourism"],"answer":"1","solution":"The Namami Gange Programme, an integrated conservation mission to clean and rejuvenate the National River Ganga, is implemented by the National Mission for Clean Ganga (NMCG). This falls under the Ministry of Jal Shakti (Department of Water Resources, River Development and Ganga Rejuvenation)."},{"id":"80273","q":"Manning\u2019s Formula is used to calculate:","options":["Air pollution dispersion","Velocity of flow in open channels/sewers","Compaction of soil","Bacterial growth rate"],"answer":"2","solution":"Manning's Formula is an empirical equation used to calculate the uniform flow velocity in open channels and gravity conduits (like sewers flowing partially full). V = Where: V = Velocity, n = Roughness coefficient, R = Hydraulic Radius, S = Slope."},{"id":"80274","q":"Carbon Monoxide (CO) is dangerous because:","options":["It is carcinogenic.","It has a high affinity for Hemoglobin (forming Carboxyhemoglobin).","It causes skin irritation.","It depletes the Ozone layer."],"answer":"2","solution":"Carbon Monoxide (CO) is an asphyxiant. It has an affinity for Hemoglobin that is 200\u2013250 times higher than Oxygen. It binds with Hemoglobin to form Carboxyhemoglobin (COHb), effectively blocking the blood's capacity to transport oxygen to body tissues, leading to suffocation and death."},{"id":"80275","q":"World Environment Day is celebrated on:","options":["22nd April","5th June","16th September","2nd October"],"answer":"2","solution":"5th June: World Environment Day (Established by the UN in 1972 at the Stockholm Conference). 22nd April: Earth Day. 16th September: World Ozone Day. 2nd October: Swachh Bharat Diwas (Gandhi Jayanti)."},{"id":"80276","q":"Agenda 21 is a product of:","options":["Earth Summit (Rio 1992)","Kyoto Protocol 1997","Paris Agreement 2015","Stockholm 1972"],"answer":"1","solution":"Agenda 21 is a non-binding action plan of the United Nations with regard to sustainable development. It was a product of the Earth Summit (UNCED) held in Rio de Janeiro, Brazil, in 1992 . The \"21\" refers to the 21st Century."},{"id":"80277","q":"Vermiwash is:","options":["Water used to wash worms.","Liquid fertilizer collected after passage through a worm column.","Pesticide.","Detergent."],"answer":"2","solution":"Vermiwash is a liquid extract produced during vermicomposting. It is collected by allowing water to pass slowly through a column of worm action. It contains mucous secretions of earthworms, soluble nutrients, and beneficial microorganisms. It is used as a potent liquid bio-fertilizer and mild biopesticide spray."},{"id":"80278","q":"BOD/COD ratio > 0.6 indicates:","options":["Waste is biologically treatable (Biodegradable).","Waste is toxic.","Waste is non-biodegradable.","Waste needs chemical treatment."],"answer":"1","solution":"The BOD/COD ratio indicates the biodegradability of wastewater. > 0.6: Highly biodegradable (suitable for biological treatment like ASP). 0.3 - 0.6: Moderately biodegradable (may need acclimatized seed). < 0.3: Low biodegradability (contains toxic or non-biodegradable organics; requires chemical treatment)."},{"id":"80279","q":"Swachh Bharat Kosh was set up to:","options":["Facilitate channelization of philanthropic contributions/CSR funds for Swachh Bharat.","Collect fines.","Pay salaries.","Buy land."],"answer":"1","solution":"Swachh Bharat Kosh (SBK) was set up by the Government of India to attract Corporate Social Responsibility (CSR) funds and contributions from individuals and philanthropists. Objective: To achieve the objective of Clean India (Swachh Bharat) by improving sanitation levels in rural and urban areas (e.g., building toilets in schools)."},{"id":"80280","q":"Which Indian state has the highest number of Ramsar Sites (as of 2024)?","options":["Uttar Pradesh","Tamil Nadu","West Bengal","Punjab"],"answer":"2","solution":"As of early 2024 (following the addition of new sites), Tamil Nadu has the highest number of Ramsar sites in India (16 sites), followed by Uttar Pradesh (10 sites). [Note: Data is dynamic, but TN holds the top spot currently]."},{"id":"80281","q":"Deep Injection Wells are a method for:","options":["Groundwater recharge.","Disposal of hazardous liquid waste.","Extracting oil.","Monitoring water quality."],"answer":"2","solution":"Deep Well Injection is a liquid waste disposal technology. It places treated hazardous liquid waste deep underground into porous rock formations (injection zones), such as sandstone or limestone. These zones are located far below fresh groundwater aquifers and are separated by impermeable rock layers to prevent migration."},{"id":"80282","q":"Alum is chemically known as:","options":["Ferrous Sulphate","Hydrated Aluminum Sulphate","Calcium Carbonate","Sodium Aluminate"],"answer":"2","solution":"Alum (Filter Alum) is the most common coagulant used in water treatment. Chemically, it is Hydrated Aluminum Sulphate (Al_2(SO_4)_3 \\cdot 18H_2O). When added to water, it reacts with alkalinity to form sticky precipitates of Aluminum Hydroxide (Al(OH)_3), which entrap impurities."},{"id":"80283","q":"NITI Aayog replaced which body?","options":["Planning Commission","Finance Commission","National Development Council","CPCB"],"answer":"1","solution":"NITI Aayog (National Institution for Transforming India) was formed on January 1, 2015, replacing the Planning Commission of India. It serves as the apex public policy think tank of the Government of India."},{"id":"80284","q":"The Green Bench has been constituted in the Supreme Court to deal with:","options":["Financial corruption","Environmental cases","Cyber crime","Election disputes"],"answer":"2","solution":"The \"Green Bench\" refers to a specialized bench within the Supreme Court (or High Courts) constituted specifically to hear and adjudicate cases relating to the protection of the environment and pollution control (often Public Interest Litigations - PILs)."},{"id":"80285","q":"Montreal Protocol aims to protect:","options":["The Ozone Layer","Marine Biodiversity","Tropical Forests","Antarctica"],"answer":"1","solution":"The Montreal Protocol on Substances that Deplete the Ozone Layer (1987) is a landmark international treaty. Goal: To phase out the production and consumption of Ozone Depleting Substances (ODS) like CFCs (Chlorofluorocarbons) and Halons to protect the stratospheric Ozone Layer."},{"id":"80286","q":"Compost is rich in:","options":["Heavy Metals","Pathogens","Humus and Nutrients (NPK)","Plastic"],"answer":"3","solution":"Compost is the stable, sanitized end-product of composting. It is rich in Humus (organic matter) and plant nutrients like Nitrogen (N), Phosphorus (P), and Potassium (K) . It serves as an excellent soil conditioner. Proper composting kills pathogens and should not contain heavy metals or plastic."}];
let idx=0, answers={}, timerSec=65*60, timerInt=null;

function render(){
  const q=DATA[idx];
  if(!q){document.getElementById('qText').textContent='No data.';return;}
  document.getElementById('qNum').textContent=idx+1;
  document.getElementById('qTotal').textContent=DATA.length;
  document.getElementById('qText').textContent=q.q;
  document.getElementById('opts').innerHTML=q.options.map((o,i)=>
    `<div class="option ${answers[idx]==(i+1)?'selected':''}" onclick="select(${i+1})">${String.fromCharCode(65+i)}. ${o}</div>`
  ).join('');
}
window.select=o=>{answers[idx]=o; render();};
window.prev=()=>{if(idx>0){idx--; render();}};
window.next=()=>{if(idx<DATA.length-1){idx++; render();}};

function submitTest(){
  clearInterval(timerInt);
  let c=0; for(let i=0;i<DATA.length;i++){if(answers[i]==DATA[i].answer)c++;}
  const pct=Math.round(c/DATA.length*100)||0;
  document.getElementById('qCard').classList.add('hidden');
  document.getElementById('resCard').classList.remove('hidden');
  document.getElementById('score').textContent=pct+'%';
  document.getElementById('detail').innerHTML='<b>'+c+'/'+DATA.length+'</b> correct';
}

function tick(){timerSec--; document.getElementById('timer').textContent=Math.floor(timerSec/60)+':'+String(timerSec%60).padStart(2,'0'); document.getElementById('bar').style.width=(timerSec/(65*60)*100)+'%'; if(timerSec<=0){clearInterval(timerInt); submitTest();}}

render(); timerInt=setInterval(tick,1000);
</script>
