<!DOCTYPE html>
<html lang="hi">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>ASWMO — T21 Full Test-Tech</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
:root{--bg:#0b0c15;--surface:#12142a;--text:#e4e6f0;--accent:#00e8a0;--gold:#f0c040;--danger:#ff4d6d;--border:rgba(255,255,255,.08);--muted:#8a8fa8;}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:Inter,system-ui,sans-serif;background:radial-gradient(1000px 700px at 20% 0%,#00e8a011,transparent),var(--bg);color:var(--text);min-height:100vh;line-height:1.55;}
.container{max-width:900px;margin:2rem auto;padding:0 1.2rem;}
h1{font-size:1.6rem;font-weight:700;background:linear-gradient(135deg,#fff,var(--accent));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.card{background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:16px;padding:1.5rem;margin-bottom:1rem;}
.question{font-size:1.05rem;font-weight:500;margin-bottom:.8rem;line-height:1.35;}
.options{display:grid;gap:.5rem;}
.option{padding:.7rem 1rem;background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:10px;cursor:pointer;font-size:.92rem;transition:.2s;}
.option:hover,.option.selected{border-color:var(--accent);background:rgba(0,232,160,.12);font-weight:600;}
.timer{font-family:monospace;font-weight:700;font-size:2rem;color:var(--accent);}
button{background:linear-gradient(135deg,var(--accent),#00b87e);color:#0a0c12;border:none;padding:.7rem 1.4rem;border-radius:10px;font-weight:700;cursor:pointer;}
.hidden{display:none!important}</style>
</head>
<body>
<div class="container">
<header><h1 id="ptitle">ASWMO — T21 Full Test-Tech</h1></header>

<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;">
<div><div class="timer" id="timer">65:00</div><div style="font-size:.75rem;color:var(--muted);">Time Remaining</div></div>
<button onclick="submitTest()">Submit Test</button></div>
<div style="height:6px;background:rgba(255,255,255,.1);border-radius:3px;overflow:hidden;margin-top:.5rem;"><div id="bar" style="height:100%;width:100%;background:linear-gradient(90deg,var(--accent),#00b87e);transition:width 1s linear;"></div></div></div>

<div class="card" id="qCard">
<div style="font-size:.8rem;color:var(--muted);margin-bottom:.4rem;">Question <span id="qNum">1</span> / <span id="qTotal">?</span></div>
<div class="question" id="qText">Loading...</div>
<div class="options" id="opts"></div>
<div style="margin-top:1rem;display:flex;gap:.5rem;flex-wrap:wrap;">
<button onclick="prev()">&#8592; Prev</button><button onclick="next()">Next &#8594;</button><button onclick="submitTest()">Submit</button></div>
</div>

<div class="card hidden" id="resCard" style="text-align:center;padding:2rem;">
<h2 style="color:var(--gold);font-size:2rem;">Test Completed!</h2>
<div id="score" style="font-size:3rem;font-weight:800;color:var(--accent);margin:1rem 0;"></div>
<div id="detail" style="color:var(--muted);font-size:.95rem;"></div>
<div style="margin-top:1.5rem;"><a href="index.html" style="color:var(--accent);font-weight:600;">&#8592; Back</a></div>
</div>
</div>

<script>
const DATA=[{"id":"76156","q":"Which is the correct sequence of stages for Environmental Clearance process of a new project?","options":["Scoping-Screening- Public Consultation-Appraisal","Appraisal-Scoping- Screening-Public Consultation","Screening-Scoping-Public Consultation-Appraisal","Screening-Scoping-Appraisal-Public Consultation"],"answer":"3"},{"id":"76157","q":"In Environmental Impact Assessment, the full form of CEQ is","options":["Council on Educational Quality","Council on Environmental Quality","Centre for Educational Quality","Centre for Environmental Quality"],"answer":"2"},{"id":"76158","q":"Which of the following statement(s) is/are true regarding Convention on Wetlands? (i) The Convention on Wetlands was adopted in the Iranian city of Ramsar in 1971 and came into force in 1975. (ii) The Convention uses a broad definition of wetlands and includes lakes and rivers, however excludes underground aquifers. (iii) India has 89 Ramsar sites.","options":["(i) only","(ii) and (iii)","(i) and (iii)","(i), (ii) and (iii)"],"answer":"1"},{"id":"76159","q":"Polluter pays principle means","options":["payment to government for establishing industry","payment made before polluting","pay and pollute","restoring environment by penalizing clean up cost from polluter"],"answer":"4"},{"id":"76160","q":"Which one of the following statement is wrong about \"National Green Tribunal Act\"?","options":["It was enacted in Parliament in the 61st year i Republic of India","It contains total 5 chapters","It was the outcome of Stockholm conference Earth summit","It is related to Article 24 of the Constitution"],"answer":"4"},{"id":"76161","q":"What is the name of the web-based portal developed for online submission and monitoring of proposals seeking environmental clearances in India?","options":["Enviro Portal","Green Web","Eco Clear","PARIVESH"],"answer":"4"},{"id":"76162","q":"The Ministry of Environment, Forest and Climate Change constitutes a committee namely","options":["Central Monitoring Committee","Metropolitan Area Planning Committee","Metropolitan and District Planning Committee","Pollution Control Committee"],"answer":"1"},{"id":"76163","q":"Which among the following is the first major Environmental Protection act to be promulgated in India?","options":["Biological Diversity Act","Environmental Protection Act","Forest Conservation Act","Wildlife Protection Act"],"answer":"4"},{"id":"76164","q":"The provision for environmental protection in the constitution were made in the year","options":["1972","1976","1980","1995"],"answer":"2"},{"id":"76165","q":"A group of organisms that are extremely sensitive to air pollution is:","options":["Epiphytic lichens","Orchids","Ferns","Angiosperms"],"answer":"1"},{"id":"76166","q":"What does the Ramsar Convention address","options":["Protection of water bodies","Protection of rivers","Protection of wetlands","Protection o seas"],"answer":"3"},{"id":"76167","q":"In ecosystem consumers are also known as","options":["Heterotrophs","Phagotrophs","Photosynthetic autocross","Prdators"],"answer":"1"},{"id":"76168","q":"Which of the following components of ecosystem acts as intermediatory between biotic and abiotic components?","options":["Parasite","Decomposers","Producers","Consumers"],"answer":"2"},{"id":"76169","q":"Which of the following is an artificial ecosystem?","options":["Rice field","Forest","Grassland","Lake"],"answer":"1"},{"id":"76170","q":"Brundtland Report is concerned with","options":["Water conservation","Air pollution","Environmental protection","Sustainable development"],"answer":"4"},{"id":"76171","q":"The three basic pillars of sustainable development encompasses","options":["environmental, attributes economical and social","environmental, attributes Industrial and judicial","ecosystem, food security and governance attributes","Ecological governance, and accessibility attributes"],"answer":"1"},{"id":"76172","q":"The phrase 'Tragedy of commons' is in the context of","options":["T  growth"],"answer":"3"},{"id":"76182","q":"In which year Project Tiger was launched by the Government of India?","options":["1970","1973","1977","2000"],"answer":"2"},{"id":"76183","q":"The Indian Wild Ass Sanctuary is located in state of India","options":["Kerala","Gujarat","Andhra Pradesh","Rajasthan"],"answer":"2"},{"id":"76184","q":"Construction of a large number of dams in Columbia river basin has affected the livelihood of Native Americans in that area because","options":["There is a significant decrease in the population of anadromous fish","Many of them became sick because of malaria","The lands where they were growing crops were inundated","They were relocated to areas which were inhabitable"],"answer":"1"},{"id":"76185","q":"Identify the INCORRECT statement with respect to wetlands.","options":["Wetlands protect water quality by assimilating water pollutants and removing sediments containing heavy metals","Wetlands recharge groundwater supplies","Wetlands prevent potentially extensive and costly floods by temporarily storing flood waters","Wetlands lead to soil erosion"],"answer":"4"},{"id":"76186","q":"Arrange the following environmental Q.08. Arrange movements in chronological order. 1. Narmada Bachao Andolan 2. Silent Valley movement 3. Chipko movement 4. Appiko movement","options":["1, 2, 3, 4","3, 4, 2, 1","4, 3, 2, 1","3, 2, 4, 1"],"answer":"4"},{"id":"76187","q":"Why is mercaptan added to natural gas? (i) To detect leaks through odour (ii) To prevent pipeline corrosion (iii) To increase energy content","options":["Only (i)","(i) and (ii)","(ii) and (iii)","(i), (ii) and (iii)"],"answer":"1"},{"id":"76188","q":"What does the octane rating of petrol indicate?","options":["The energy content per litre of fuel","The fuel's resistance to premature combustion","The purity of petrol","The viscosity of petrol"],"answer":"2"},{"id":"76189","q":"Arrange the following non-renewable fossil fuel in the sequence of lower to higher heating values. 1. Coal 2. Hydrogen 3. Petroleum 4. Natural Gas","options":["1,3,4,2","3,4,2,1","2,3,1,4","3,2,4,1"],"answer":"1"},{"id":"76190","q":"As per the National Policy on Biofuels, 2018 the aim is to promote the production and utilization of Bio fuels as a viable option for transportation purposes. The target is to achieve.................blending with the petrol from the current dismal figure of 2% by 2030.","options":["10%","16%","15%","20%"],"answer":"4"},{"id":"76191","q":"Balance the following chemical oxidation reduction reaction: a e","options":["a=4, b=3, c=12, d=2, e=3, f=6","a=6, b=2, c=16, d=6, e=2, f=8","a=2, b=3, c=12, d=1, e=6, f=6","a=6, b=1, c=14, d=3, e=2, f=7"],"answer":"4"},{"id":"76192","q":"Permeability affects the transport of chemicals through soil Hence which of the following is required?","options":["soil texture and structure","concentration of chemicals","quality of water","both (b) and (c)"],"answer":"1"},{"id":"76193","q":"Which of the following is an example of organic pollutant?","options":["Detergents","Heavy metals","Nitrates","Phosphates"],"answer":"1"},{"id":"76194","q":"Cryogenic condensers can be used for abatement of:","options":["Dioxins","NOx","VOC","SO2"],"answer":"3"},{"id":"76195","q":"Dissolution of the gas in water is governed by Henry's law of partial pressure. With Henry's constant for oxygen being , the saturation concentration of dissolved oxygen in water (55.6 g- with no dissolved solids at Cand 1 atm pressure, will be","options":["[Image-based option 1 — see original]","[Image-based option 2 — see original]","16.5 mg","[Image-based option 4 — see original]"],"answer":"1"},{"id":"76196","q":"As per solid waste management rule 2016, the maximum concentration of Dissolved Solid (inorganic) in the treated leachate allowed for disposal should be","options":["[Image-based option 1 — see original]","[Image-based option 2 — see original]","[Image-based option 3 — see original]","[Image-based option 4 — see original]"],"answer":"3"},{"id":"76197","q":"The estimated solid waste generated in small, medium and large cities and towns per capita per day respectively as per CPCB are","options":["0.1 kg, 0.3-0.4 kg and 0.5 kg","0.5 kg, 0.6-0.7 kg and 0.8 kg","1 kg, 3-4 kg and 5 kg","0.3 kg, 0.6-0.8 kg and 0.9 kg"],"answer":"1"},{"id":"76198","q":"Density of municipal solid waste is in the range of","options":["10-200 kg/m³","400-700 kg/m³","1000-1200 kg/m³","200-300 kg/m³"],"answer":"2"},{"id":"76199","q":"Which one is not a method for source reduction","options":["Recycling","Recovery","Composting","Incineration"],"answer":"2"},{"id":"76200","q":"Pick out the correct statement from the following with respect to the principle of solid waste management.","options":["Helps in cleaning surrounding","Increase waste management cost","Makes good business opportunities","Dip in economic growth","(a) and (d)"],"answer":"3"},{"id":"76201","q":"Which of the following is the major gas produced from landfill and can be used as a renewable energy?","options":["Carbon monoxide","Methane","Oxygen","Hydrogen disulphide"],"answer":"2"},{"id":"76202","q":"Which of the following types of solid waste is most likely to be disposed of by incineration?","options":["E-waste","Domestic waste","Biomedical waste","Nuclear waste"],"answer":"3"},{"id":"76203","q":"The combustion of sludge in a reactor under high temperature, along with auxiliary fuels (if needed) is called","options":["polarisation","gasification","congestion","incineration"],"answer":"4"},{"id":"76204","q":"Direct benefits of recycling (For Environment) DOES NOT include which of the following?","options":["Reduced environmental impacts including climate change impacts","Livelihood opportunities for employees of certain sectors","Reduced land use for disposal sites","Sustainable use of resources"],"answer":"2"},{"id":"76205","q":"What should be the pH range of any material to be identified as Hazardous waste ?","options":["Less than 3 and more than 9","Less than 2 and more than 12.5","Less than 1 and more than 11","Less than 4 and more than 10"],"answer":"2"},{"id":"76206","q":"In Indian hospital the approximate generation of Biomedical waste per bed per day is","options":["1.45 kg","2kg","1.8kg","24kg"],"answer":"1"},{"id":"76207","q":"As per the Hazardous and Other Wastes (Management and Transboundary Movement) Rules, 2016; the occupiers of facilities may store the hazardous and other wastes for a period not exceeding:","options":["80 days","90 days","100 days","120 days"],"answer":"2"},{"id":"76208","q":"The best way to manage plastic wastes is to","options":["Burn it","Dispose off along with municipal waste","Use for composting","Recycle"],"answer":"4"},{"id":"76209","q":"Which of the following is nonbiodegradable","options":["Animal bones","Nylon","Tea leaves","Wool"],"answer":"2"},{"id":"76210","q":"Which one of the following is not a property of hazardous waste?","options":["carcinogenicity","Ignitability","Corrosiveness","Toxicity"],"answer":"1"},{"id":"76211","q":"Persistent free radicals are linked to:","options":["Neurological diseases","Cardio-pulmonary diseases","Gastro-enteric diseases","Hepato-pulmonary diseases"],"answer":"2"},{"id":"76212","q":"Which of the following has been implicated in the transmission of cholera:","options":["Drinking of contaminated water","Consumption of raw shellfish","Consumption of raw vegetables","All of the above"],"answer":"4"},{"id":"76213","q":"Pressure changes :","options":["More rapidly in the vertical direction than in the horizontal","More rapidly in the horizontal direction than in the vertical","At the same rate in the horizontal and vertical directions","More rapidly in the vertical direction over land than over the ocean"],"answer":"1"},{"id":"76214","q":"Which are the two main acids found in acid rain","options":["Sulphuric and Nitric acid","Hydrochloric and Nitric acid","Sulphuric and Hydrochloric acid","None of these"],"answer":"1"},{"id":"76215","q":"Which of the following emissions will increase if we increase the use of bio-diesel blends","options":["Total unburned hydrocarbons","Carbon monoxide","Particulate matter","Oxides of nitrogen"],"answer":"4"},{"id":"76216","q":"Which of the following statement(s) is/are true regarding Source Apportionment Study in Environmental Science? (i) It is done to evaluate the effectiveness of air pollution control technologies (ii) It uses receptor modeling, chemical fingerprinting and statistical methods","options":["Only (i)","Only (ii)","Both (i) and (ii)","Neither (i) nor (ii)"],"answer":"3"},{"id":"76217","q":"What is a major effect of increased population on the environment?","options":["Reduced carbon emissions","Increased resource demand","Stabilized ecosystems","Decreased waste production"],"answer":"2"},{"id":"76218","q":"Ringelmann's scale is used to","options":["Grade automobile exhaust gas","Measure SO 2","Measure CO","Grade density of smoke"],"answer":"4"},{"id":"76219","q":"The air pollutant which reduces oxygen delivering capacity to organs and tissues is","options":["Carbon monoxide","Sulphur dioxide","Nitrogen oxides","Ozone"],"answer":"1"},{"id":"76220","q":"The path taken by the continuous discharge of gaseous effluent emitted from chimney is commonly known as","options":["Inversion","Plume","ELR","ALR"],"answer":"2"}];
let idx=0, answers={}, timerSec=3900, timerInt=null;

function render(){
  const q=DATA[idx];
  if(!q){document.getElementById('qText').textContent='No data.';return;}
  document.getElementById('qNum').textContent=idx+1;
  document.getElementById('qTotal').textContent=DATA.length;
  document.getElementById('qText').textContent=q.q;
  document.getElementById('opts').innerHTML=q.options.map((o,i)=>
    `<div class="option ${answers[idx]==(i+1)?'selected':''}" onclick="select(${i+1})">${String.fromCharCode(65+i)}. ${o}</div>`
  ).join('');
}
window.select=o=>{answers[idx]=o; render();};
window.prev=()=>{if(idx>0){idx--; render();}};
window.next=()=>{if(idx<DATA.length-1){idx++; render();}};

function submitTest(){
  clearInterval(timerInt);
  let c=0; for(let i=0;i<DATA.length;i++){if(answers[i]==DATA[i].answer)c++;}
  const pct=Math.round(c/DATA.length*100)||0;
  document.getElementById('qCard').classList.add('hidden');
  document.getElementById('resCard').classList.remove('hidden');
  document.getElementById('score').textContent=pct+'%';
  document.getElementById('detail').innerHTML='<b>'+c+'/'+DATA.length+'</b> correct';
}

function tick(){timerSec--; document.getElementById('timer').textContent=Math.floor(timerSec/60)+':'+String(timerSec%60).padStart(2,'0'); document.getElementById('bar').style.width=(timerSec/3900*100)+'%'; if(timerSec<=0){clearInterval(timerInt); submitTest();}}

render(); timerInt=setInterval(tick,1000);
</script>
</body></html>
