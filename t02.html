<html lang="hi">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>ASWMO — T02 Liquid Waste</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
:root{--bg:#0b0c15;--surface:#12142a;--text:#e4e6f0;--accent:#00e8a0;--gold:#f0c040;--danger:#ff4d6d;--border:rgba(255,255,255,.08);--muted:#8a8fa8;}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:Inter,system-ui,sans-serif;background:radial-gradient(1000px 700px at 20% 0%,#00e8a011,transparent),var(--bg);color:var(--text);min-height:100vh;line-height:1.55;}
.container{max-width:900px;margin:2rem auto;padding:0 1.2rem;}
h1{font-size:1.6rem;font-weight:700;background:linear-gradient(135deg,#fff,var(--accent));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.card{background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:16px;padding:1.5rem;margin-bottom:1rem;}
.question{font-size:1.05rem;font-weight:500;margin-bottom:.8rem;line-height:1.35;}
.options{display:grid;gap:.5rem;}
.option{padding:.7rem 1rem;background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:10px;cursor:pointer;font-size:.92rem;transition:.2s;}
.option:hover,.option.selected{border-color:var(--accent);background:rgba(0,232,160,.12);font-weight:600;}
.timer{font-family:monospace;font-weight:700;font-size:2rem;color:var(--accent);}
button{background:linear-gradient(135deg,var(--accent),#00b87e);color:#0a0c12;border:none;padding:.7rem 1.4rem;border-radius:10px;font-weight:700;cursor:pointer;}
.hidden{display:none!important}</style>
</head>

<div class="container">
<header><h1 id="ptitle">ASWMO — T02 Liquid Waste</h1></header>

<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;">
<div><div class="timer" id="timer">65:00</div><div style="font-size:.75rem;color:var(--muted);">Time Remaining</div></div>
<button onclick="submitTest()">Submit Test</button></div>
<div style="height:6px;background:rgba(255,255,255,.1);border-radius:3px;overflow:hidden;margin-top:.5rem;"><div id="bar" style="height:100%;width:100%;background:linear-gradient(90deg,var(--accent),#00b87e);transition:width 1s linear;"></div></div></div>

<div class="card" id="qCard">

<div class="question" id="qText">Loading...</div>
<div class="options" id="opts"></div>
<div style="margin-top:1rem;display:flex;gap:.5rem;flex-wrap:wrap;">
<button onclick="prev()">&#8592; Prev</button><button onclick="next()">Next &#8594;</button><button onclick="submitTest()">Submit</button></div>
</div>

<div class="card hidden" id="resCard" style="text-align:center;padding:2rem;">
<h2 style="color:var(--gold);font-size:2rem;">Test Completed!</h2>
<div id="score" style="font-size:3rem;font-weight:800;color:var(--accent);margin:1rem 0;"></div>
<div id="detail" style="color:var(--muted);font-size:.95rem;"></div>
<div style="margin-top:1.5rem;"><a href="index.html" style="color:var(--accent);font-weight:600;">&#8592; Back</a></div>
</div>
</div>

ure that powerful residual hypochlorous acid (HOCI) is formed","To ensure a good water pH in the distribution system","To ensure only HCI is formed"],"answer":"2"},{"id":"68256","q":"In which of the following wastewater treatment units is organic matter destroyed and stabilised by anaerobic bacteria?","options":["Trickling filter","Oxidation pond","Sedimentation tank","Septic tank"],"answer":"4"},{"id":"68257","q":"Activated sludge process is an example of:","options":["Anaerobic suspended growth process","Anaerobic attached growth process","Aerobic attached growth process","Aerobic suspended growth process"],"answer":"4"},{"id":"68258","q":"Which of these produces dangerous photochemical smog?","options":["Lead","Benzene","Carbon Monoxide","Hydrocarbons"],"answer":"4"},{"id":"68259","q":"Detention time is the ratio of ________.","options":["Volume to flow rate","Flow rate to density","Volume to density","Density to flow rate"],"answer":"1"},{"id":"68260","q":"Which type of odor characteristic is NOT used for classifying odor of a given water sample as per IS 3025 (part-5) 1983?","options":["Degrees of turbidity","Degrees of sweetness","Degrees of pungency","Degrees of smokiness"],"answer":"1"},{"id":"68261","q":"Sewers must be checked for minimum velocities at their minimum hourly flows which is equal to:","options":["1/3 average daily flows","1/4 average daily flows","average daily flows","1/2 average daily flows"],"answer":"1"},{"id":"68262","q":"As per IS 10500: 2012 for drinking water in the absence of alternate source of water, the permissible. limits for chloride and sulphate in mg/L, respectively are","options":["250 and 200","1000 and 400","200 and 250","500 and 1000"],"answer":"2"},{"id":"68263","q":"Considering (i) Screening (ii) Sedimentation (iii) Disinfection (iv) Filtration... The correct sequence of treatments which are generally given to treat raw water supplies are","options":["(i) (ii) (iii) (iv)","(i) (ii) (iv) (iii)","(i) (iii) (iv) (ii)","(iv) resent in how many forms?","options":["2","3","4","5"],"answer":"3"},{"id":"68280","q":"Which of the following wastewater constituents are removed by chemical immobilization?","options":["Suspended Solids","Metal fragments","BOD","Phosphorus"],"answer":"4"},{"id":"68281","q":"Which type of poisoning happened in Japan from fishes?","options":["Bismuth","Arsenic","Lead","Mercury"],"answer":"4"},{"id":"68282","q":"The decomposition of organic matter necessarily produces","options":["Nitrogen Oxides and Water","Carbon Di-oxide and Water","Carbon Di-oxide and Oxygen","Nitrogen Oxides and Carbon Di-oxide"],"answer":"2"},{"id":"68283","q":"What is the TOD of 150mg/l Glucose?","options":["160 mg/l","180 mg/l","200 mg/l","220 mg/l"],"answer":"1"},{"id":"68284","q":"Which one of these diseases is not caused by a virus?","options":["Hepatitis A","Poliomyelitis","Giardiasis","SARS"],"answer":"3"},{"id":"68285","q":"Which of these technologies involve Hydroplume?","options":["ICSC","SAFF","BIOFOR","SIBT"],"answer":"1"},{"id":"68286","q":"In practice, what is the correct sequence of sludge handling?","options":["Concentration - Stabilization - Reduction - Dewatering","Dewatering - Stabilization - Concentration - Reduction","Concentration - Stabilization - Dewatering - Reduction","Stabilization - Concentration - Dewatering - Reduction"],"answer":"3"},{"id":"68287","q":"Which of the following is not considered in sullage?","options":["Water from kitchen sinks","Water from bathrooms","Water from water closets","Water from wash basins"],"answer":"3"},{"id":"81049","q":"In a waste stabilization pond (Oxidation Pond), the relationship between algae and bacteria is best described as:","options":["Parasitic","Symbiotic","Competitive","Antibiotic"],"answer":"2"},{"id":"81050","q":"\"Crown Corrosion\" in concrete sewers is primarily caused by the formation of which acid due to bacterial action?","options":["Hydrochloric Acid (HCL)","Nitric Acid (HNO 3 )","Sulphuric Acid (H 2 SO 4 )","Carbonic Acid (H 2 CO 3 )"],"answer":"3"},{"id":"81051","q":"A \"Drop Manhole\" is provided in a sewerage system when:","options":["There is a change in the alignment of the sewer","There is a change in the size of the sewer","The difference in elevation between the incoming and outgoing sewer is more than 0.6~m","The sewer line passes under a railway track"],"answer":"3"},{"id":"81052","q":"The device used in a grit chamber to maintain a constant horizontal flow velocity of 0.3~m/s despite fluctuations in discharge is called:","options":["Parshall Flume","Proportional Flow Weir (Sutro Weir)","V-Notch Weir","Venturi Flume"],"answer":"2"},{"id":"81053","q":"Which of the following traps is commonly provided at the junction of a house drain and a public sewer to prevent the entry of foul gases from the public sewer?","options":["P-Trap","Floor Trap (Nahni Trap)","Intercepting Trap","S-Trap"],"answer":"3"},{"id":"81054","q":"The phenomenon of \"Sewage Sickness\" refers to:","options":["The spread of waterborne diseases among sewage workers","The corrosion of sewer pipes due to acidic sewage","The clogging of soil pores due to continuous application of sewage on land, reducing aeration","The bulking of sludge in an aeration tank"],"answer":"3"},{"id":"81055","q":"If the 5-day BOD of a city's wastewater is 200~mg/L and the per capita water supply is 150~L/day (with 80% reaching the sewer), what is the \"Population Equivalent\" of an industry discharging waste with a total BOD load of 2400~kg/day?","options":["10,000","50,000","80,000","100,000"],"answer":"4"},{"id":"81056","q":"The \"Egg-shaped\" sewer section is preferred over a circular section for combined sewerage systems because:","options":["It is easier to construct","It provides better self-cleansing velocity during low flow (dry weather) conditions","It resists higher external earth pressure","It is cheaper to manufacture"],"answer":"2"},{"id":"81057","q":"In the \"Zone of Active Decomposition\" of a river polluted by let idx=0, answers={}, timerSec=3900, timerInt=null;

function render(){
  const q=DATA[idx];
  if(!q){document.getElementById('qText').textContent='No data.';return;}
  document.getElementById('qNum').textContent=idx+1;
  document.getElementById('qTotal').textContent=DATA.length;
  document.getElementById('qText').textContent=q.q;
  document.getElementById('opts').innerHTML=q.options.map((o,i)=>
    `<div class="option ${answers[idx]==(i+1)?'selected':''}" onclick="select(${i+1})">${String.fromCharCode(65+i)}. ${o}</div>`
  ).join('');
}
window.select=o=>{answers[idx]=o; render();};
window.prev=()=>{if(idx>0){idx--; render();}};
window.next=()=>{if(idx<DATA.length-1){idx++; render();}};

function submitTest(){
  clearInterval(timerInt);
  let c=0; for(let i=0;i<DATA.length;i++){if(answers[i]==DATA[i].answer)c++;}
  const pct=Math.round(c/DATA.length*100)||0;
  document.getElementById('qCard').classList.add('hidden');
  document.getElementById('resCard').classList.remove('hidden');
  document.getElementById('score').textContent=pct+'%';
  document.getElementById('detail').innerHTML='<b>'+c+'/'+DATA.length+'</b> correct';
}

function tick(){timerSec--; document.getElementById('timer').textContent=Math.floor(timerSec/60)+':'+String(timerSec%60).padStart(2,'0'); document.getElementById('bar').style.width=(timerSec/3900*100)+'%'; if(timerSec<=0){clearInterval(timerInt); submitTest();}}

render(); timerInt=setInterval(tick,1000);
</script>
