<!DOCTYPE html>
<html lang="hi">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>ASWMO — T37 Full Test-Tech</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
:root{--bg:#0b0c15;--surface:#12142a;--text:#e4e6f0;--accent:#00e8a0;--gold:#f0c040;--danger:#ff4d6d;--border:rgba(255,255,255,.08);--muted:#8a8fa8;}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:Inter,system-ui,sans-serif;background:radial-gradient(1000px 700px at 20% 0%,#00e8a011,transparent),var(--bg);color:var(--text);min-height:100vh;line-height:1.55;}
.container{max-width:900px;margin:2rem auto;padding:0 1.2rem;}
h1{font-size:1.6rem;font-weight:700;background:linear-gradient(135deg,#fff,var(--accent));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.card{background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:16px;padding:1.5rem;margin-bottom:1rem;}
.question{font-size:1.05rem;font-weight:500;margin-bottom:.8rem;line-height:1.35;}
.options{display:grid;gap:.5rem;}
.option{padding:.7rem 1rem;background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:10px;cursor:pointer;font-size:.92rem;transition:.2s;}
.option:hover,.option.selected{border-color:var(--accent);background:rgba(0,232,160,.12);font-weight:600;}
.timer{font-family:monospace;font-weight:700;font-size:2rem;color:var(--accent);}
button{background:linear-gradient(135deg,var(--accent),#00b87e);color:#0a0c12;border:none;padding:.7rem 1.4rem;border-radius:10px;font-weight:700;cursor:pointer;}
.hidden{display:none!important}</style>
</head>
<body>
<div class="container">
<header><h1 id="ptitle">ASWMO — T37 Full Test-Tech</h1></header>

<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;">
<div><div class="timer" id="timer">65:00</div><div style="font-size:.75rem;color:var(--muted);">Time Remaining</div></div>
<button onclick="submitTest()">Submit Test</button></div>
<div style="height:6px;background:rgba(255,255,255,.1);border-radius:3px;overflow:hidden;margin-top:.5rem;"><div id="bar" style="height:100%;width:100%;background:linear-gradient(90deg,var(--accent),#00b87e);transition:width 1s linear;"></div></div></div>

<div class="card" id="qCard">
<div style="font-size:.8rem;color:var(--muted);margin-bottom:.4rem;">Question <span id="qNum">1</span> / <span id="qTotal">?</span></div>
<div class="question" id="qText">Loading...</div>
<div class="options" id="opts"></div>
<div style="margin-top:1rem;display:flex;gap:.5rem;flex-wrap:wrap;">
<button onclick="prev()">&#8592; Prev</button><button onclick="next()">Next &#8594;</button><button onclick="submitTest()">Submit</button></div>
</div>

<div class="card hidden" id="resCard" style="text-align:center;padding:2rem;">
<h2 style="color:var(--gold);font-size:2rem;">Test Completed!</h2>
<div id="score" style="font-size:3rem;font-weight:800;color:var(--accent);margin:1rem 0;"></div>
<div id="detail" style="color:var(--muted);font-size:.95rem;"></div>
<div style="margin-top:1.5rem;"><a href="index.html" style="color:var(--accent);font-weight:600;">&#8592; Back</a></div>
</div>
</div>

<script>
const DATA=[{"id":"80909","q":"\"Green Muffler\" is a technique related to the control of:","options":["Air Pollution","Water Pollution","Noise Pollution (using vegetation belts)","Soil Erosion"],"answer":"3"},{"id":"80910","q":"Under the SWM Rules 2016, \"Street Sweepings\" should be:","options":["Burned locally","Washed into the drains","Collected separately and transported to landfill/processing","Left on the median"],"answer":"3"},{"id":"80911","q":"Calculate the \"Sludge Volume Index\" (SVI) if the settled sludge volume after 30 minutes in a 1-liter cylinder is 300 mL and the Mixed Liquor Suspended Solids (MLSS) concentration is 3000 mg/L.","options":["10 mL/g","100 mL/g","150 mL/g","300 mL/g"],"answer":"2"},{"id":"80912","q":"Which International Standard refers to \"Environmental Management Systems\" (EMS)?","options":["ISO 9001","ISO 14001","ISO 22000","ISO 45001"],"answer":"2"},{"id":"80913","q":"A landfill cell has dimensions 50m 50m. If the waste is compacted to a height of 2m with a density of 800 kg/m 3 , what is the total mass of waste in the cell?","options":["2,000 tonnes","4,000 tonnes","5,000 tonnes","8,000 tonnes"],"answer":"2"},{"id":"80914","q":"The \"National Air Quality Monitoring Programme\" (NAMP) is executed by:","options":["ISRO","CPCB","IMD","NITI Aayog"],"answer":"2"},{"id":"80915","q":"Which of the following is a \"Criteria Pollutant\" for calculation of the Air Quality Index (AQI) in India?","options":["Carbon Dioxide (CO 2 )","Methane (CH 4 )","Ammonia (NH 3 )","CFCs"],"answer":"3"},{"id":"80916","q":"\"Reverse Logistics\" is primarily associated with:","options":["Collection of raw material for manufacturing","Movement of goods from consumer back to producer (e.g., for recycling/EPR)","Transport of waste to landfill","Flow of leachate in a drain"],"answer":"2"},{"id":"80917","q":"Which metal is known as a \"Cumulative Poison\" in the human body?","options":["Sodium","Potassium","Lead","Calcium"],"answer":"3"},{"id":"80918","q":"A compost pile has 100 kg of waste with 60% moisture content (MC) mixed with 50 kg of dry sawdust (10% MC). What is the moisture content of the combined mixture?","options":["35.5%","43.3%","50.0%","55.5%"],"answer":"2"},{"id":"80919","q":"In the context of waste water, \"Sullage\" typically excludes:","options":["Bath water","Kitchen water","Laundry water","Human excreta"],"answer":"4"},{"id":"80920","q":"\"Pyrolysis\" of tires typically yields:","options":["Carbon Black, Pyrolysis Oil, and Steel","Only Ash","Compost","Methane gas only"],"answer":"1"},{"id":"80921","q":"The \"Water (Prevention and Control of Pollution) Cess Act\" was enacted to:","options":["Ban water use","Collect a cess (tax) on water consumption to augment the resources of Pollution Control Boards","Privatize water rivers","Stop rainfall"],"answer":"2"},{"id":"80922","q":"The term \"NIMBY\" syndrome in waste management stands for:","options":["Not In My Back Yard","New Integrated Management By Year","No Incineration Many Benefits Yielded","Never Include Municipal Bio-waste Yards"],"answer":"1"},{"id":"80923","q":"A city generates 50,000 kg of solid waste per day. If the density of the waste in the truck is 500 kg/m 3 and the truck capacity is 10 m³, how many trips per day are required to collect all the waste?","options":["5 trips","8 trips","10 trips","20 trips"],"answer":"3"},{"id":"80924","q":"The \"Activated Carbon Adsorption\" process is best suited for removing:","options":["Large suspended solids","Dissolved organics and colour","Nitrates","Hardness"],"answer":"2"},{"id":"80925","q":"Which microorganism is most effective in the \"Bio-leaching\" of copper and gold from electronic waste?","options":["E. coli","Thiobacillus ferrooxidans","Salmonella","Giardia"],"answer":"2"},{"id":"80926","q":"Under the Battery Waste Management Rules, 2022, the \"Producer\" must register with:","options":["State Pollution Control Board only","Central Pollution Control Board (via centralized portal)","Ministry of Power","Local Municipal Corporation"],"answer":"2"},{"id":"80927","q":"In an anaerobic digester, \"Acidogenesis\" is immediately followed by:","options":["Hydrolysis","Acetogenesis","Methanogenesis","Oxidation"],"answer":"2"},{"id":"80928","q":"Which Act governs the \"Public Liability Insurance\" for handling hazardous substances?","options":["The Environment Protection Act, 1986","The Public Liability Insurance Act, 1991","The Factories Act, 1948","The Disaster Management Act, 2005"],"answer":"2"},{"id":"80929","q":"\"Bio-medical waste\" generated from households (e.g., insulin syringes) should be:","options":["Mixed with wet waste","Handed over separately as Domestic Hazardous Waste","Flushed down the toilet","Burnt in the backyard"],"answer":"2"},{"id":"80930","q":"If the sound pressure levels from two independent sources are 70 dB and 70 dB, what is the combined sound pressure level?","options":["70 dB","73 dB","76 dB","140 dB"],"answer":"2"},{"id":"80931","q":"Which of the following is NOT an Advanced Oxidation Process (AOP)?","options":["Ozonation","Fenton's Reagent","UV/H 2 O 2","Plain Sedimentation"],"answer":"4"},{"id":"80932","q":"In a sanitary landfill, \"Methane\" is lighter than air, while \"Carbon Dioxide\" is:","options":["Lighter than air","Heavier than air (tends to sink)","Same density as air","Unstable"],"answer":"2"},{"id":"80933","q":"\"Cradle-to-Cradle\" (C2C) design concept emphasizes:","options":["Disposal at the end of life","Designing products so materials can be perpetually recycled/regenerated (c) Increasing the lifespan of landfills","Reducing transport costs"],"answer":"2"},{"id":"80934","q":"Which filter is most suitable for dewatering sludge in large STPs?","options":["Slow Sand Filter","Rapid Sand Filter","Filter Press (Belt or Plate)","Trickling Filter"],"answer":"3"},{"id":"80935","q":"A \"Combined Sewer System\" carries:","options":["Only industrial waste","Only domestic sewage","Both sanitary sewage and stormwater runoff in the same pipe","Sewage and drinking water"],"answer":"3"},{"id":"80936","q":"Under C&D Waste Rules, who is responsible for the transport of waste to the processing facility?","options":["The Municipality only","The Waste Generator (for large generators)","The State Government","NGOs"],"answer":"2"},{"id":"80937","q":"An aeration tank has a volume of 2000 m³. If the sewage flow rate is 10 MLD (10,000~m^{3}/day), what is the Hydraulic Retention Time (HRT)?","options":["2.4 hours","4.8 hours","6.5 hours","12.0 hours"],"answer":"2"},{"id":"80938","q":"The \"Minamata Convention\" prohibits the primary mining of:","options":["Gold","Lead","Mercury","Silver"],"answer":"3"},{"id":"80939","q":"\"Vermiwash\" is:","options":["The water used to wash worms","A liquid fertilizer collected after passing water through a column of worm action","A pesticide","The leachate from a hazardous landfill"],"answer":"2"},{"id":"80940","q":"The \"Biomedical Waste Management Rules\" do NOT apply to:","options":["Radioactive waste","Vaccination camps","Blood donation camps","First aid rooms of schools"],"answer":"1"},{"id":"80941","q":"In a trickling filter, the \"Hydraulic Loading Rate\" is expressed as:","options":["kg BOD/m 3 /day","m 3 /m 2 /day","hours","mg/L"],"answer":"2"},{"id":"80942","q":"\"Gasification\" differs from \"Incineration\" because Gasification:","options":["Occurs in excess oxygen","Occurs in limited oxygen (sub-stoichiometric)","Produces only ash and heat","Is an exothermic process only"],"answer":"2"},{"id":"80943","q":"Which of the following waste streams has the highest Carbon-to-Nitrogen (C/N) ratio?","options":["Food waste","Sewage sludge","Sawdust/Wood chips","Grass clippings"],"answer":"3"},{"id":"80944","q":"The \"Ring and Ball Apparatus\" is used to determine which property of bitumen or tar used in road works (often using plastic waste)?","options":["Ductility","Softening Point","Penetration Value","Viscosity"],"answer":"2"},{"id":"80945","q":"The \"Kyoto Protocol\" operationalized the:","options":["United Nations Framework Convention on Climate Change (UNFCCC)","Convention on Biological Diversity (CBD)","Vienna Convention","Ramsar Convention"],"answer":"1"},{"id":"80946","q":"Which zone of a lake is closest to the shore and supports rooted vegetation?","options":["Limnetic Zone","Profundal Zone","Littoral Zone","Benthic Zone"],"answer":"3"},{"id":"80947","q":"\"Fecal Sludge\" refers to:","options":["Fresh sewage in pipes","Sludge removed from on-site sanitation systems (like septic tanks/pit latrines)","Industrial sludge","Compost Form"],"answer":"2"},{"id":"80948","q":"A sedimentation tank has a surface area of 200m 2 . If the flow rate is 6000m 3 /day, what is the Surface Overflow Rate (SOR)?","options":["20m 3 /m 2 /day","30m 3 /m 2 /day","40m 3 /m 2 /day","60m 3 /m 2 /day"],"answer":"2"},{"id":"80949","q":"The \"Environment Compensation\" (EC) regime is based on the principle of:","options":["Profit Sharing","Polluter Pays","Corporate Social Responsibility","Subsidy"],"answer":"2"},{"id":"80950","q":"\"Yellow Haze\" or photochemical smog is primarily caused by:","options":["Sulphur Dioxide","Nitrogen Dioxide (NO 2 ) and Sunlight","Carbon Monoxide","Water vapour"],"answer":"2"},{"id":"80951","q":"Which of the following plastic resins is most difficult to recycle and is often phased out?","options":["PET (Code 1)","HDPE (Code 2)","PVC (Code 3)","PP (Code 5)"],"answer":"3"},{"id":"80952","q":"Determine the height of a chimney required to disperse sulphur dioxide (SO2) emissions of 100 kg/hr using the formula H= , where Q is in kg/hr.","options":["42.5 m","50.2 m","55.7 m","65.0 m"],"answer":"3"},{"id":"80953","q":"In the context of EIA, \"Accreditation\" of EIA consultant organizations in India is granted by:","options":["MoEF&CC directly","QCI/NABET (Quality Council of India)","NGT","IITs"],"answer":"2"},{"id":"80954","q":"\"Geotextiles\" are used in landfills primarily for:","options":["Waterproofing","Separation and filtration","Gas generation","aesthetics"],"answer":"2"},{"id":"80955","q":"The \"Dobson Unit\" (DU) is used to measure the thickness of:","options":["Landfill liner","Ozone layer","Sludge cake","Plastic film"],"answer":"2"},{"id":"80956","q":"The \"Cone of Depression\" is a term associated with:","options":["Air pollution dispersion","Groundwater drawdown due to pumping","Landfill settlement","Noise attenuation"],"answer":"2"},{"id":"80957","q":"What is the primary function of a \"Baffle Wall\" in a Septic Tank?","options":["To support the roof","To prevent short-circuiting and retain scum/sludge","To increase aeration","To measure flow"],"answer":"2"},{"id":"80958","q":"The \"Zero Waste\" philosophy targets:","options":["100% incineration","100% landfilling","Maximizing resource recovery and minimizing final disposal","Stopping all industrial production"],"answer":"3"},{"id":"80959","q":"The \"National Green Hydrogen Mission\" aims to decarbonize which sectors?","options":["Refining and Fertilizer","IT Sector","Education","Banking"],"answer":"1"},{"id":"80960","q":"Which of the following is a \"Non-Point Source\" of pollution?","options":["Factory chimney","Sewage pipe outlet","Agricultural runoff from a field","Landfill vent pipe"],"answer":"3"},{"id":"80961","q":"\"Carbon Sequestration\" refers to:","options":["Release of carbon into the atmosphere","Capture and long-term storage of atmospheric carbon dioxide","Burning of carbon fuels","Measuring carbon footprint"],"answer":"2"},{"id":"80962","q":"\"Poly-Aluminum Chloride\" (PAC) is a modern alternative to which traditional coagulant?","options":["Alum","Chlorine","Bleaching Powder","Lime"],"answer":"1"},{"id":"80963","q":"The \"Break-point Chlorination\" is the point where:","options":["Chlorine demand is zero","Combined residual chlorine is maximum","All combined chlorine is oxidized, and free residual chlorine begins to appear","Smell of chlorine vanishes"],"answer":"3"},{"id":"80964","q":"The \"Manifest\" for hazardous waste transport must be signed and dated by:","options":["Generator, Transporter, and Receiver (TSDF)","Only the Generator","Only the Transporter","The District Magistrate"],"answer":"1"},{"id":"80965","q":"A \"Grab Sample\" represents the characteristics of the water:","options":["Over a period of 24 hours","At the specific time and place of collection only","After mixing multiple samples","After treatment"],"answer":"2"},{"id":"80966","q":"A wastewater treatment plant receives a flow of 5 MLD (Million Liters per Day). If the influent BOD is 200mg/L and the effluent BOD is required to be 20~mg/L, what is the required BOD removal efficiency?","options":["80%","85%","90%","95%"],"answer":"3"},{"id":"80967","q":"\"Biomethanation\" is the process of:","options":["Burning biomass","Anaerobic digestion of organic waste to produce biogas","Composting with worms","Drying waste in the sun"],"answer":"2"},{"id":"80968","q":"The \"Hazardous Waste Management Rules\" were last significantly amended in:","options":["2000","2008","2016","2024"],"answer":"3"},{"id":"80969","q":"In the context of air pollution, \"PM 2.5\" refers to particulate matter with a diameter:","options":["Less than 2.5 millimeters","Less than or equal to 2.5 micrometers","Exactly 2.5 nanometers","Greater than 2.5 centimeters"],"answer":"2"},{"id":"80970","q":"The \"Swachh Survekshan\" is conducted by:","options":["Ministry of Rural Development","Ministry of Housing and Urban Affairs (MoHUA)","NITI Aayog","WHO"],"answer":"2"},{"id":"80971","q":"\"Bio-medical waste\" does NOT include:","options":["Animal anatomical waste","Microbiology waste","General municipal waste (kitchen waste) from hospitals","Discarded medicines"],"answer":"3"},{"id":"80972","q":"Which bacteria is used as a biological indicator for sterilization efficiency in autoclaves?","options":["Bacillus stearothermophilus","E. coli","Vibrio cholerae","Salmonella typhi"],"answer":"1"},{"id":"80973","q":"Using the \"Arithmetic Increase Method\", if the population of a town was 20,000 in 2000 and 24,000 in 2010, what is the forecasted population for 2020?","options":["26,000","28,000","30,000","32,000"],"answer":"2"}];
let idx=0, answers={}, timerSec=3900, timerInt=null;

function render(){
  const q=DATA[idx];
  if(!q){document.getElementById('qText').textContent='No data.';return;}
  document.getElementById('qNum').textContent=idx+1;
  document.getElementById('qTotal').textContent=DATA.length;
  document.getElementById('qText').textContent=q.q;
  document.getElementById('opts').innerHTML=q.options.map((o,i)=>
    `<div class="option ${answers[idx]==(i+1)?'selected':''}" onclick="select(${i+1})">${String.fromCharCode(65+i)}. ${o}</div>`
  ).join('');
}
window.select=o=>{answers[idx]=o; render();};
window.prev=()=>{if(idx>0){idx--; render();}};
window.next=()=>{if(idx<DATA.length-1){idx++; render();}};

function submitTest(){
  clearInterval(timerInt);
  let c=0; for(let i=0;i<DATA.length;i++){if(answers[i]==DATA[i].answer)c++;}
  const pct=Math.round(c/DATA.length*100)||0;
  document.getElementById('qCard').classList.add('hidden');
  document.getElementById('resCard').classList.remove('hidden');
  document.getElementById('score').textContent=pct+'%';
  document.getElementById('detail').innerHTML='<b>'+c+'/'+DATA.length+'</b> correct';
}

function tick(){timerSec--; document.getElementById('timer').textContent=Math.floor(timerSec/60)+':'+String(timerSec%60).padStart(2,'0'); document.getElementById('bar').style.width=(timerSec/3900*100)+'%'; if(timerSec<=0){clearInterval(timerInt); submitTest();}}

render(); timerInt=setInterval(tick,1000);
</script>
</body></html>
