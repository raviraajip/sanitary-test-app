const DATA=[{"id":"72214","q":"The power of the Supreme Court of India to decide disputes between the Centre and the States falls under its:","options":["Advisory Jurisdiction","Appellate Jurisdiction","Original Jurisdiction","Writ Jurisdiction"],"answer":"3"},{"id":"72215","q":"What is the primary reason for the formation of the 'ozone hole' over Antarctica?","options":["The trapping of pollutants by the strong polar vortex and the presence of polar stratospheric clouds.","High concentration of industrial pollutants directly emitted over Antarctica.","The natural thinning of the ozone layer during the polar summer.","Methane emissions from the melting permafrost."],"answer":"1"},{"id":"72216","q":"A wire with electrical resistance 'R' is stretched to three times its original length. Assuming the volume and resistivity of the material remain constant, what will be its new resistance?","options":["R/3","3R","R/9","9R"],"answer":"4"},{"id":"72217","q":"The 73 rd Constitutional Amendment Act, 1992, which added Part IX to the Constitution, deals with:","options":["The administration of Union Territories.","The provisions related to Panchayati Raj Institutions.","The establishment of Administrative Tribunals.","The functions of Urban Local Bodies or Municipalities."],"answer":"2"},{"id":"72218","q":"Why does a diamond sparkle more than a piece of glass of the same shape?","options":["Diamond has a higher refractive index and a lower critical angle, leading to more total internal reflection.","Diamond is harder than glass, which allows it to be cut more precisely.","Diamond absorbs all colors except one, while glass transmits all colors.","Diamond has a crystalline lattice structure, whereas glass is amorphous."],"answer":"1"},{"id":"72219","q":"The 'Doctrine of Basic Structure' of the Constitution was propounded by the Supreme Court in which landmark case?","options":["Golaknath v. State of Punjab","Kesavananda Bharati v. State of Kerala","Maneka Gandhi v. Union of India","A.K. Gopalan v. State of Madras"],"answer":"2"},{"id":"72220","q":"The climatic phenomenon known as 'El Niño' is characterized by:","options":["The unusual cooling of surface waters in the eastern tropical Pacific Ocean.","An intensification of the normal Walker Circulation over the Pacific.","The unusual warming of surface waters in the eastern tropical Pacific Ocean, affecting global weather patterns.","A seasonal reversal of winds in the Indian Ocean, causing heavy rainfall."],"answer":"3"},{"id":"72221","q":"In the context of fluid dynamics, why does a spinning cricket ball curve in the air (the Magnus effect)?","options":["Due to a pressure difference created on opposite sides of the ball, as per Bernoulli's principle.","Due to the conservation of angular momentum.","Due to the gravitational pull being altered by the spin.","Due to the increased friction with air molecules caused by the spinning surface."],"answer":"1"},{"id":"72222","q":"Arrange the following tributaries of the Indus River system from north to south: Chenab 2. Jhelum 3. Ravi 4. Satluj","options":["2, 1, 3, 4","1, 2, 4, 3","4, 3, 1, 2","3, 4, 2, 1"],"answer":"1"},{"id":"72223","q":"Which of the following is NOT a fundamental duty of a citizen of India under Article 51A of the Constitution?","options":["To safeguard public property and to abjure violence.","To develop the scientific temper, humanism, and the spirit of inquiry and reform.","To pay taxes regularly and punctually.","To protect and improve the natural environment including forests, lakes, rivers, and wild life."],"answer":"3"},{"id":"72224","q":"In human genetics, what is the key difference between mitosis and meiosis?","options":["Mitosis produces two diploid cells, while meiosis produces four haploid cells.","Mitosis occurs in reproductive cells, while meiosis occurs in somatic (body) cells.","DNA replication does not occur before meiosis.","Mitosis involves two rounds of cell division, while meiosis involves only one."],"answer":"1"},{"id":"72225","q":"In the context of Indian polity, the 'Prorogation' of a House of Parliament means:","options":["The termination of a sitting of the House for an indefinite period.","The end of a session of the House by an order of the President.","The dissolution of the Lok Sabha.","A temporary suspension of the proceedings of the House by the presiding officer."],"answer":"2"},{"id":"72226","q":"Consider the following statements regarding the Indian monsoon: The withdrawal of the monsoon is a more gradual process than its onset. The 'Burst of Monsoon' over the Kerala coast is associated with violent thunderstorms. The Tamil Nadu coast remains dry during the southwest monsoon season because it lies in a rain shadow area. Which of the statements given above are correct?","options":["1 and 2 only","2 and 3 only","1 and 3 only","1, 2, and 3"],"answer":"4"},{"id":"72227","q":"The process of reverse osmosis, used in water purification, involves:","options":["Movement of water from a region of lower solute concentration to higher solute concentration without external pressure.","Movement of solute particles across a semi-permeable membrane.","Applying external pressure to move water from a region of higher solute concentration to lower solute concentration.","Boiling the water to separate it from dissolved salts."],"answer":"3"},{"id":"72228","q":"Which Constitutional Amendment Act is known as the 'Anti-Defection Law'?","options":["42 nd Amendment Act","44 th Amendment Act","52 nd Amendment Act","61 st Amendment Act"],"answer":"3"},{"id":"72229","q":"The 'Strait of Hormuz', a strategically important waterway, connects which two bodies of water?","options":["The Red Sea and the Gulf of Aden.","The Persian Gulf and the Gulf of Oman.","The Mediterranean Sea and the Atlantic Ocean.","The Black Sea and the Sea of Marmara."],"answer":"2"},{"id":"72230","q":"Which law of thermodynamics explains that it is impossible to reach a state of absolute zero temperature?","options":["The Zeroth Law of Thermodynamics.","The First Law of Thermodynamics.","The Second Law of Thermodynamics.","The Third Law of Thermodynamics."],"answer":"4"},{"id":"72231","q":"What is the implication if a 'No-Confidence Motion' is passed against the Council of Ministers in the Lok Sabha?","options":["The Prime Minister alone has to resign.","The entire Council of Ministers has to resign.","The Lok Sabha is immediately dissolved by the President.","The motion is sent to the Rajya Sabha for approval."],"answer":"2"},{"id":"72232","q":"Which of the following National Parks is unique for being a 'floating' national park?","options":["Keoladeo National Park, Rajasthan","Namdapha National Park, Arunachal Pradesh","Keibul Lamjao National Park, Manipur","Balphakram National Park, Meghalaya"],"answer":"3"},{"id":"72233","q":"What is the scientific principle behind the functioning of a vaccine?","options":["It introduces potent antibiotics into the bloodstream to kill pathogens.","It stimulates the adaptive immune system to produce memory cells against a specific pathogen without causing the disease.","It provides passive immunity by injecting pre-made antibodies from another source.","It uses antiviral drugs to directly destroy the genetic material of viruses."],"answer":"2"},{"id":"72234","q":"Which of the following subjects is included in the 'Concurrent List' of the Seventh Schedule of the Indian Constitution?","options":["Public health and sanitation","Police and public order","Forests and protection of wild animals and birds","Banking and insurance"],"answer":"3"},{"id":"72235","q":"What type of climate, characterized by dry summers and mild, wet winters, is ideal for the cultivation of citrus fruits like oranges and grapes?","options":["Equatorial Climate","Monsoon Climate","Mediterranean Climate","Tundra Climate"],"answer":"3"},{"id":"72236","q":"In chemistry, \"buffer solutions\" are critical for maintaining stable conditions. What is their primary function?","options":["To neutralize a solution completely, bringing its pH to exactly 7.","To resist changes in pH upon the addition of a small amount of acid or base.","To act as a strong oxidizing agent in redox reactions.","To increase the solubility of non-polar substances in water."],"answer":"2"},{"id":"72237","q":"What does the 'Writ of Mandamus' literally mean?","options":["\"To have the body of\"","\"We command\"","\"By what authority or warrant\"","\"To be certified\""],"answer":"2"},{"id":"72238","q":"According to Einstein's theory of special relativity, which of the following is a consequence for an object as its speed approaches the speed of light?","options":["Its mass decreases, and time passes faster for it.","Its mass remains constant, but its length contracts.","Its mass increases, its length contracts in the direction of motion, and time slows down for it.","Its energy becomes zero."],"answer":"3"},{"id":"72239","q":"The 'Roaring Forties', 'Furious Fifties', and 'Shrieking Sixties' are terms used to describe:","options":["Strong westerly winds found in the Southern Hemisphere.","Ocean currents in the North Atlantic.","Latitudinal belts of high atmospheric pressure.","Zones of frequent volcanic activity in the Pacific."],"answer":"1"},{"id":"72240","q":"Which of the following cellular processes would be most immediately disrupted if the inner mitochondrial membrane, which is normally impermeable to protons (H+ ions), suddenly became permeable?","options":["Glycolysis in the cytoplasm.","The synthesis of ATP via chemiosmosis.","The Krebs cycle in the mitochondrial matrix.","The transport of pyruvate into the mitochondria."],"answer":"2"},{"id":"72241","q":"What is the key geographical feature that distinguishes a 'delta' from an 'estuary'?","options":["A delta is a depositional landform at the river mouth, while an estuary is a drowned river valley where fresh water meets sea water.","Deltas form only in tropical regions, while estuaries are common in temperate regions.","Estuaries are characterized by high sediment load, while deltas have clear water.","A delta is formed by glacial action, whereas an estuary is formed by wind action."],"answer":"1"},{"id":"72242","q":"Consider the following statements regarding the powers of the Rajya Sabha: It can authorize the Parliament to make a law on a subject enumerated in the State List. It participates in the election and impeachment of the President. A Money Bill can be introduced only in the Rajya Sabha. Which of the statements given above is/are correct?","options":["1 only","1 and 2 only","2 and 3 only","1, 2, and 3"],"answer":"2"},{"id":"72243","q":"If a person moves from the equator to the poles, how will the value of 'g' (acceleration due to gravity) be affected?","options":["It will decrease because the polar radius is greater than the equatorial radius.","It will remain exactly the same.","It will increase due to the flattening of the Earth at the poles and reduced centrifugal force.","It will fluctuate unpredictably."],"answer":"3"},{"id":"72244","q":"A mirage is an optical phenomenon caused by:","options":["The reflection of light from a water surface on a hot day.","The dispersion of light through atmospheric dust particles.","The refraction and total internal reflection of light rays through layers of air at different temperatures.","The scattering of light by air molecules, similar to why the sky is blue."],"answer":"3"},{"id":"72245","q":"The Finance Commission in India is constituted by the President under which Article of the Constitution to recommend the distribution of revenues between the Union and the States?","options":["Article 280","Article 324","Article 148","Article 315"],"answer":"1"},{"id":"72246","q":"Jet streams are high-altitude, fast-flowing air currents that have a significant influence on weather patterns. In which layer of the atmosphere are they typically found?","options":["The Mesosphere","The upper levels of the Troposphere","The Thermosphere","The lower levels of the Stratosphere"],"answer":"2"},{"id":"72247","q":"The 'Karewas' of the Kashmir valley are known for the cultivation of which specific crop?","options":["Saffron (Kesar)","Apples","Basmati Rice","Tea"],"answer":"1"},{"id":"72248","q":"Why does a pressure cooker cook food faster than an open pot?","options":["It reduces the specific heat capacity of water.","The increased pressure inside the cooker raises the boiling point of water, allowing for cooking at a higher temperature.","The metal of the pressure cooker has a higher thermal conductivity.","It prevents heat loss to the surroundings through radiation."],"answer":"2"},{"id":"72249","q":"A Joint Sitting of the two Houses of Parliament is presided over by:","options":["The President of India","The Chairman of the Rajya Sabha","The Speaker of the Lok Sabha","The Prime Minister of India"],"answer":"3"},{"id":"72250","q":"The concept of a 'Public Interest Litigation' (PIL) originated and was developed as a judicial innovation in India to:","options":["Allow any public-spirited citizen or social organization to seek judicial remedy for a public wrong.","Settle property disputes between two private parties.","Provide a faster trial for criminal cases.","Enable the government to seek the Supreme Court's opinion on legal matters."],"answer":"1"},{"id":"72251","q":"Which of the following is the key distinction between a prokaryotic cell (like bacteria) and a eukaryotic cell (like an animal or plant cell)?","options":["Eukaryotic cells have a cell wall, while prokaryotic cells do not.","Prokaryotic cells lack a true, membrane-bound nucleus and other membrane-bound organelles.","Prokaryotic cells are always larger than eukaryotic cells.","Eukaryotic cells use DNA as their genetic material, while prokaryotic cells use RNA."],"answer":"2"},{"id":"72252","q":"The term 'regur soil' is widely used in India to refer to:","options":["Alluvial soils found in the Gangetic plain.","Laterite soils found in areas with high temperature and rainfall.","Arid desert soils of Rajasthan.","Black cotton soils, known for their high moisture-retention capacity."],"answer":"4"},{"id":"72253","q":"What fundamental force is responsible for holding the protons and neutrons together in an atomic nucleus?","options":["The Gravitational Force","The Electromagnetic Force","The Strong Nuclear Force","The Weak Nuclear Force"],"answer":"3"},{"id":"72254","q":"Which of the following fundamental rights is available only to the citizens of India and not to foreigners?","options":["Equality before law (Article 14).","Protection of life and personal liberty (Article 21).","Right to freedom of speech and expression (Article 19).","Right to freedom of religion (Article 25)."],"answer":"3"},{"id":"72255","q":"What is the correct sequence of the layers of the Earth's atmosphere from the surface upwards?","options":["Troposphere, Mesosphere, Stratosphere, Thermosphere","Troposphere, Stratosphere, Mesosphere, Thermosphere","Stratosphere, Troposphere, Mesosphere, Thermosphere","Mesosphere, Troposphere, Stratosphere, Thermosphere"],"answer":"2"},{"id":"72256","q":"In modern physics, what does wave-particle duality refer to?","options":["The concept that waves can only be produced by particles.","The idea that all waves and particles are fundamentally the same thing.","The principle that quantum entities like electrons and photons exhibit both wave-like and particle-like properties.","The theory that particles can travel in wave-like patterns through a medium called ether."],"answer":"3"},{"id":"72257","q":"The power of 'Judicial Review' allows the judiciary to:","options":["Re-examine its own judgments.","Advise the President on matters of law.","Supervise the functioning of lower courts.","Examine the constitutionality of legislative enactments and executive orders."],"answer":"4"},{"id":"72258","q":"The half-life of a radioactive isotope is the time it takes for:","options":["The isotope to become completely non-radioactive.","Half of the radioactive atoms in a sample to undergo decay.","The radioactivity of a sample to double.","The isotope to lose half of its mass."],"answer":"2"},{"id":"72259","q":"Which mountain pass connects Srinagar with Leh?","options":["Nathu La","Shipki La","Zoji La","Bom Di La"],"answer":"3"},{"id":"72260","q":"The right to move the Supreme Court for the enforcement of Fundamental Rights is itself a Fundamental Right under:","options":["Article 14","Article 19","Article 21","Article 32"],"answer":"4"},{"id":"72261","q":"When a beam of white light passes through a prism, it splits into its constituent colors. This phenomenon is called dispersion, and it occurs because:","options":["The speed of light in the prism is the same for all colors.","The refractive index of the prism material is different for different wavelengths (colors) of light.","The prism absorbs certain colors and reflects others.","The angle of incidence is different for each color."],"answer":"2"},{"id":"72262","q":"The Directive Principles of State Policy (DPSP) in the Indian Constitution are inspired by the Constitution of which country?","options":["United States of America","United Kingdom","Ireland","Canada"],"answer":"3"},{"id":"72263","q":"The 'Chota Nagpur Plateau' in India is renowned as a storehouse of:","options":["Fertile alluvial soils","Forest resources","Mineral resources","Hydroelectric potential"],"answer":"3"},{"id":"72264","q":"In the context of sound waves, the 'Doppler Effect' explains which of the following phenomena?","options":["Why sound travels faster in solids than in gases.","The change in frequency or pitch of a sound perceived by an observer when the sound source is moving relative to the observer.","How echoes are formed by the reflection of sound.","The ability of sound waves to bend around obstacles (diffraction)."],"answer":"2"},{"id":"72265","q":"Which one of the following is NOT a feature of the Western Ghats?","options":["They are a UNESCO World Heritage site and one of the world's biodiversity hotspots.","They are an example of block mountains formed by the down-warping of a part of the land.","They are continuous and can be crossed through passes only.","Their average elevation is higher in the northern part compared to the southern part."],"answer":"4"},{"id":"72266","q":"Under which Article of the Constitution of India can the President declare a 'Financial Emergency'?","options":["Article 352","Article 356","Article 360","Article 368"],"answer":"3"},{"id":"72267","q":"The imaginary line on a map connecting points of equal atmospheric pressure, adjusted to sea level, is called an:","options":["Isotherm","Isohyet","Isobar","Isohaline"],"answer":"3"},{"id":"72268","q":"The concept of 'Zero Hour' in the Indian parliamentary procedure refers to:","options":["The first hour of every parliamentary sitting.","The time immediately following the Question Hour when members can raise matters without any prior notice.","The last hour of the day's sitting.","The time when a Money Bill is discussed."],"answer":"2"},{"id":"72269","q":"In geography, what is a 'fjord'?","options":["A large, flat, and treeless area of land.","A long, narrow, deep inlet of the sea between high cliffs, typically formed by submergence of a glaciated valley.","A ring-shaped coral reef enclosing a lagoon.","A small, seasonal river in an arid region."],"answer":"2"},{"id":"72270","q":"What is the concept of 'escape velocity'? It is the minimum speed an object needs to:","options":["Enter into a stable orbit around a celestial body.","Break free from the gravitational pull of a celestial body without further propulsion.","Travel at the speed of light.","Overcome atmospheric drag."],"answer":"2"},{"id":"72271","q":"Who has the final authority to decide whether a bill is a Money Bill or not?","options":["The President of India","The Finance Minister","The Chairman of the Rajya Sabha","The Speaker of the Lok Sabha"],"answer":"4"},{"id":"72272","q":"The term 'equinox' refers to the time when:","options":["The sun is directly overhead at the Tropic of Cancer.","The day is longest in the Northern Hemisphere.","The sun is directly overhead at the Equator, and day and night are of approximately equal length everywhere.","The Earth is farthest from the sun in its orbit."],"answer":"3"},{"id":"72273","q":"Why are soaps and detergents effective at cleaning?","options":["They are strongly acidic or alkaline, which chemically dissolves grease.","They act as abrasives that physically scrub away dirt.","They are emulsifying agents with molecules that have both a hydrophilic head and a hydrophobic tail.","They reduce the boiling point of water, making hot water cleaning more effective."],"answer":"3"},{"id":"72274","q":"The 'Suez Canal' provides a crucial shipping route between which two seas?","options":["The Caribbean Sea and the Pacific Ocean.","The North Sea and the Baltic Sea.","The Mediterranean Sea and the Red Sea.","The Black Sea and the Mediterranean Sea."],"answer":"3"},{"id":"72275","q":"The power of the President of India to grant pardons, reprieves, respites, or remissions of punishment is laid down in which Article?","options":["Article 72","Article 123","Article 143","Article 52"],"answer":"1"},{"id":"72276","q":"What type of rock is predominantly formed from the cooling and solidification of magma or lava?","options":["Sedimentary Rock","Metamorphic Rock","Igneous Rock","Fossiliferous Rock"],"answer":"3"},{"id":"72277","q":"A phenomenon where a warm air mass is forced to rise over a colder, denser air mass, often leading to prolonged, steady precipitation, is known as a:","options":["Convectional uplift","Orographic lift","Warm Front","Cold Front"],"answer":"3"},{"id":"72278","q":"Which of the following is a secondary pollutant, formed through reactions in the atmosphere, rather than being emitted directly from a source, in the context of photochemical smog?","options":["Carbon monoxide (CO)","Sulfur dioxide (SO 2 ​)","Ozone (O 3 ​)","Particulate Matter (PM10)"],"answer":"3"}];
let idx=0, answers={}, timerSec=3900, timerInt=null;

function render(){
  const q=DATA[idx];
  if(!q){document.getElementById('qText').textContent='No data.';return;}
  document.getElementById('qNum').textContent=idx+1;
  document.getElementById('qTotal').textContent=DATA.length;
  document.getElementById('qText').textContent=q.q;
  document.getElementById('opts').innerHTML=q.options.map((o,i)=>
    `<div class="option ${answers[idx]==(i+1)?'selected':''}" onclick="select(${i+1})">${String.fromCharCode(65+i)}. ${o}</div>`
  ).join('');
}
window.select=o=>{answers[idx]=o; render();};
window.prev=()=>{if(idx>0){idx--; render();}};
window.next=()=>{if(idx<DATA.length-1){idx++; render();}};

function submitTest(){
  clearInterval(timerInt);
  let c=0; for(let i=0;i<DATA.length;i++){if(answers[i]==DATA[i].answer)c++;}
  const pct=Math.round(c/DATA.length*100)||0;
  document.getElementById('qCard').classList.add('hidden');
  document.getElementById('resCard').classList.remove('hidden');
  document.getElementById('score').textContent=pct+'%';
  document.getElementById('detail').innerHTML='<b>'+c+'/'+DATA.length+'</b> correct';
}

function tick(){timerSec--; document.getElementById('timer').textContent=Math.floor(timerSec/60)+':'+String(timerSec%60).padStart(2,'0'); document.getElementById('bar').style.width=(timerSec/3900*100)+'%'; if(timerSec<=0){clearInterval(timerInt); submitTest();}}

render(); timerInt=setInterval(tick,1000);
</script>
