<style>

:root{--bg:#0b0c15;--surface:#12142a;--text:#e4e6f0;--accent:#00e8a0;--gold:#f0c040;--danger:#ff4d6d;--border:rgba(255,255,255,.08);--muted:#8a8fa8;}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:Inter,system-ui,sans-serif;background:radial-gradient(1000px 700px at 20% 0%,#00e8a011,transparent),var(--bg);color:var(--text);min-height:100vh;line-height:1.55;}

.option:hover,.option.selected{border-color:var(--accent);background:rgba(0,232,160,.12);font-weight:600;}
.timer{font-family:monospace;font-weight:700;font-size:2rem;color:var(--accent);}

rmine the correctness or otherwise of the following Assertion [A] and the Reason [R]. Assertion [A]: One of the best ways to reduce the amount of solid wastes is to reduce the consumption of raw materials. Reason [R]: Solid wastes are seldom generated when raw materials are converted to goods for consumption:","options":["Both A and R are false","Both A and R are true and R is the correct reason for A","Both A and R are true but R is not the correct reason for A","A is true but R is false"],"answer":"4"},{"id":"68837","q":"Assertion (A): Leachate collection and treatment systems are a mandatory component of modern sanitary landfills. Reason (R): Leachate is a liquid formed when water percolates through the waste, potentially carrying harmful pollutants into groundwater.","options":["Both A and R are true and R is the correct explanation of A","Both A and R are true but R is not the correct explanation of A","A is true but R is false","A is false but R is true"],"answer":"1"},{"id":"68838","q":"Assertion (A): Incineration is the disposal of waste by dumping it in a pit. Reason (R): Incineration is harmful as it releases fumes and harmful substances into the environment.","options":["Opt. A and R is true but but R is correct explanation of A","Opt. A and R is true but R is not correct explanation of A","Opt. A is true but but R is false","Opt. R is true but A is false"],"answer":"4"},{"id":"68839","q":"Assertion (A): Electronic wastes do not contain any harmful substances or valuable materials. Reason (R): Computers, mobile phones, batteries, etc., contain lead, cadmium, silver, and copper.","options":["Both A and R are true, and R is the correct explanation of A","Both A and R are true, but R is NOT the correct explanation of A","A is true but R is false","R is true but A is false"],"answer":"4"},{"id":"68840","q":"Assertion (A): Biomagnification is caused due to the accumulation of non-biodegradable toxicants in organisms at each successive trophic level. Reason (R): The maximum concentration of these chemicals gets accumulated in human bodies because humans occupy the topmost position in food chains.","options":["Both A and R are true, and R is the correct explanation of A","Both A and R are true, but R is NOT the correct explanation of A","A is true, but R is false","A is false, but R is true"],"answer":"1"},{"id":"68841","q":"Assertion (A): Polythene bags and plastic containers are non-biodegradable substances. Reason (R): They can be broken down by microorganisms into simpler, harmless substances.","options":["Both A and R are true, and R is the correct explanation of A","Both A and R are true, but R is NOT the correct explanation of A","A is true, but R is false","A is false, but R is true"],"answer":"3"},{"id":"68842","q":"Assertion (A): Biodegradable waste can be composted to reduce landfill use. Reason (R): Composting transforms organic waste into nutrient-rich soil amendment through microbial decomposition.","options":["Opt. A and R is true but but R is correct explanation of A","Opt. A and R is true but R is not correct explanation of A","Opt. A is true but but R is false","Opt. R is true but A is false"],"answer":"1"},{"id":"68843","q":"Assertion (A): Plastic pollution poses a significant threat to marine life. Reason (R): Marine animals can ingest plastic debris, leading to injury or death.","options":["Opt. A and R is true but but R is correct explanation of A","Opt. A and R is true but R is not correct explanation of A","Opt. A is true but but R is false","Opt. R is true but A is false"],"answer":"1"},{"id":"68844","q":"Assertion (A): Safe disposal of wastes is important during extraction of resources. Reason (R): Extraction of resources causes pollution due to production of waste.","options":["Opt. A and R is true but but R is correct explanation of A","Opt. A and R is true but R is not correct explanation of A","Opt. A is true but but R is false","Opt. R is true but A is false"],"answer":"1"},{"id":"68845","q":"Assertion (A): Solid waste management is a major environmental challenge. Reason (R): Poor waste management practices lead to land and water pollution, affecting both human and ecosystem health.","options":["Opt. A and R is true but but R is correct explanation of A","Opt. A and R is true but R is not correct explanation of A","Opt. A is true but but R is false","Opt. R is true but A is false"],"answer":"1"},{"id":"68846","q":"Assertion (A): Sanitary landfills are designed with liners and leachate collection systems. Reason (R): These systems prevent the contamination of surface water and groundwater by landfill leachate. Options:","options":["Both A and R are true, and R is the correct explanation of A.","Both A and R are true, but R is not the correct explanation of A.","A is true, but R is false.","A is false, but R is true."],"answer":"1"},{"id":"68847","q":"Assertion (A): Incineration of municipal solid waste significantly reduces its volume and weight. Reason (R): Incineration converts the combustible part of the waste into useful compost for agriculture.","options":["Both A and R are true, and R is the correct explanation of A.","Both A and R are true, but R is not the correct explanation of A.","A is true, but R is false.","A is false, but R is true."],"answer":"3"},{"id":"68848","q":"Assertion (A): Source segregation of waste improves recycling efficiency. Reason (R): Mixing biodegradable and non-biodegradable waste reduces the quality of recyclables.","options":["Both A and R are true, and R is the correct explanation of A.","Both A and R are true, but R is not the correct explanation of A.","A is true, but R is false.","A is false, but R is true."],"answer":"1"},{"id":"68849","q":"Assertion (A): Anaerobic digestion of solid waste produces biogas and a nutrient-rich slurry. Reason (R): This process requires continuous oxygen supply for microbial activity","options":["Both A and R are true, and R is the correct explanation of A.","Both A and R are true, but R is not the correct explanation of A.","A is true, but R is false.","A is false, but R is true."],"answer":"3"},{"id":"68850","q":"Assertion (A): The design of a landfill must include proper gas venting systems. Reason (R): Decomposition of organic matter in landfills releases methane, which is explosive if not managed properly.","options":["Both A and R are true, and R is the correct explanation of A.","Both A and R are true, but R is not the correct explanation of A.","A is true, but R is false.","A is false, but R is true."],"answer":"1"},{"id":"68851","q":"What is a Geo-net?","options":["A synthetic material used for drainage of liquids","A synthetic material used for drainage of Gases","A ceramic material used for drainage of liquids","A fibrous material used for drainage of liquids"],"answer":"1"},{"id":"68852","q":"The ratio of Biochemical Oxygen Demand (BOD) to Chemical Oxygen Demand (COD) determines the extent to which organic matter can be biologically degraded.","options":["Toxicity of wastewater","Biodegradability of wastewater","Salinity of water","pH of wastewater"],"answer":"2"}];
let idx=0, answers={}, timerSec=3900, timerInt=null;

function render(){
  const q=DATA[idx];
  if(!q){document.getElementById('qText').textContent='No data.';return;}
  document.getElementById('qNum').textContent=idx+1;
  document.getElementById('qTotal').textContent=DATA.length;
  document.getElementById('qText').textContent=q.q;
  document.getElementById('opts').innerHTML=q.options.map((o,i)=>
    `<div class="option ${answers[idx]==(i+1)?'selected':''}" onclick="select(${i+1})">${String.fromCharCode(65+i)}. ${o}</div>`
  ).join('');
}
window.select=o=>{answers[idx]=o; render();};
window.prev=()=>{if(idx>0){idx--; render();}};
window.next=()=>{if(idx<DATA.length-1){idx++; render();}};

function submitTest(){
  clearInterval(timerInt);
  let c=0; for(let i=0;i<DATA.length;i++){if(answers[i]==DATA[i].answer)c++;}
  const pct=Math.round(c/DATA.length*100)||0;
  document.getElementById('qCard').classList.add('hidden');
  document.getElementById('resCard').classList.remove('hidden');
  document.getElementById('score').textContent=pct+'%';
  document.getElementById('detail').innerHTML='<b>'+c+'/'+DATA.length+'</b> correct';
}

function tick(){timerSec--; document.getElementById('timer').textContent=Math.floor(timerSec/60)+':'+String(timerSec%60).padStart(2,'0'); document.getElementById('bar').style.width=(timerSec/3900*100)+'%'; if(timerSec<=0){clearInterval(timerInt); submitTest();}}

render(); timerInt=setInterval(tick,1000);
</script>
