<html lang="hi">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>ASWMO — T16 SWM + HWM</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
:root{--bg:#0b0c15;--surface:#12142a;--text:#e4e6f0;--accent:#00e8a0;--gold:#f0c040;--danger:#ff4d6d;--border:rgba(255,255,255,.08);--muted:#8a8fa8;}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:Inter,system-ui,sans-serif;background:radial-gradient(1000px 700px at 20% 0%,#00e8a011,transparent),var(--bg);color:var(--text);min-height:100vh;line-height:1.55;}
.container{max-width:900px;margin:2rem auto;padding:0 1.2rem;}
h1{font-size:1.6rem;font-weight:700;background:linear-gradient(135deg,#fff,var(--accent));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.card{background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:16px;padding:1.5rem;margin-bottom:1rem;}
.question{font-size:1.05rem;font-weight:500;margin-bottom:.8rem;line-height:1.35;}
.options{display:grid;gap:.5rem;}
.option{padding:.7rem 1rem;background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:10px;cursor:pointer;font-size:.92rem;transition:.2s;}
.option:hover,.option.selected{border-color:var(--accent);background:rgba(0,232,160,.12);font-weight:600;}
.timer{font-family:monospace;font-weight:700;font-size:2rem;color:var(--accent);}
button{background:linear-gradient(135deg,var(--accent),#00b87e);color:#0a0c12;border:none;padding:.7rem 1.4rem;border-radius:10px;font-weight:700;cursor:pointer;}
.hidden{display:none!important}</style>
</head>
<body>
<div class="container">
<header><h1 id="ptitle">ASWMO — T16 SWM + HWM</h1></header>

<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;">
<div><div class="timer" id="timer">65:00</div><div style="font-size:.75rem;color:var(--muted);">Time Remaining</div></div>
<button onclick="submitTest()">Submit Test</button></div>
<div style="height:6px;background:rgba(255,255,255,.1);border-radius:3px;overflow:hidden;margin-top:.5rem;"><div id="bar" style="height:100%;width:100%;background:linear-gradient(90deg,var(--accent),#00b87e);transition:width 1s linear;"></div></div></div>

<div class="card" id="qCard">
<div style="font-size:.8rem;color:var(--muted);margin-bottom:.4rem;">Question <span id="qNum">1</span> / <span id="qTotal">?</span></div>

<div class="options" id="opts"></div>
<div style="margin-top:1rem;display:flex;gap:.5rem;flex-wrap:wrap;">
<button onclick="prev()">&#8592; Prev</button><button onclick="next()">Next &#8594;</button><button onclick="submitTest()">Submit</button></div>
</div>

<h2 style="color:var(--gold);font-size:2rem;">Test Completed!</h2>
<div id="score" style="font-size:3rem;font-weight:800;color:var(--accent);margin:1rem 0;"></div>
<div id="detail" style="color:var(--muted);font-size:.95rem;"></div>
<div style="margin-top:1.5rem;"><a href="index.html" style="color:var(--accent);font-weight:600;">&#8592; Back</a></div>

<script>
const DATA=[{"id":"73959","q":"Which of the following conditions is not suitable for the disposal of excreta or sewage?","options":["The waste does not pollute the ground surface","It is not exposed to the atmosphere","It should be accessible for children","It does not give odour nuisance"],"answer":"3"},{"id":"73960","q":"Which of the following is an advantage of the conservancy system over water carriage system?","options":["Labour force","Water consumption","Compact house design","Spread of epidemic"],"answer":"2"},{"id":"73961","q":"What is an artificial channel for conveying water, typically in the form of a bridge across a valley or other gap called?","options":["Aquifer","Canals","Aqueduct","Tunnel"],"answer":"3"},{"id":"73962","q":"What is the wastewater flow in a sewer system during the periods of dry weather with minimum infiltration called?","options":["Wet weather flow","Dry weather flow","Wet flow","Dry flow"],"answer":"2"},{"id":"73963","q":"The quantity of sanitary sewage entering the sewers would be ______ the total quantity of water supplied.","options":["Less than","Equal to","More than","Greater than"],"answer":"1"},{"id":"73964","q":"What is the lowest wastewater flow in hospitals?","options":["50 lpcd","700 lpcd","900 lpcd","40 lpcd"],"answer":"4"},{"id":"73965","q":"Which of these equations is used to calculate the water velocity inside of a pipe ?","options":["A=Q/I","V=0.408Q/(D 2 )","L=C ∗ Q","Q=A ∗ V"],"answer":"2"},{"id":"73966","q":"What is the maximum allowable velocity in public water mains?","options":["3 ft/sec","8 ft/sec","10 ft/sec","12 ft/sec"],"answer":"2"},{"id":"73967","q":"Storm water is collected from streets into the ______ which in turn discharged into main drains of open type.","options":["Link drains","Lateral drains","Sub mains","Interseptal mains"],"answer":"2"},{"id":"73968","q":"Which of the following is considered if sewers are placed on the softer grounds?","options":["The trench is excavated to confirm the shape of the pipe","Sewers are laid embedded in the concrete","The width of the trench is kept to 15 cm","The desired slope is considered"],"answer":"2"},{"id":"73969","q":"What is the value of bazins constant (k) for very smooth surface?","options":["0.11","0.12","0.13","0.14"],"answer":"1"},{"id":"73970","q":"The abbreviation of SUE is?","options":["Subsurface utility engineering","Surface utility engineering","Storm usage engineering","Storm utility engineering"],"answer":"1"},{"id":"73971","q":"Which pump among the ones mentioned below can be located above the suction reservoir without an external priming system?","options":["Slurry pumps","Self-priming pumps","Submersible pumps","Trash pumps"],"answer":"2"},{"id":"73972","q":"A grit chamber is usually installed ______ primary sedimentation tanks.","options":["Before","After","In between","In"],"answer":"1"},{"id":"73973","q":"Stoke's law holds good for Reynolds's number ______.","options":["Less than 1","Equal to 1","Greater than 1","Nearer to 1"],"answer":"1"},{"id":"73974","q":"What is type IV settling also called as?","options":["Zone settling","Hindered settling","Compression settling","Expansion settling"],"answer":"3"},{"id":"73975","q":"In the sedimentation processes of a water treatment unit, zone settling refers to:","options":["sedimentation of discrete particles in a suspension of low solids concentration","flocculent suspension of high concentration","flocculent suspension of intermediate concentration","dilute suspension of particles that coalesce or flocculate during the sedimentation process"],"answer":"3"},{"id":"73976","q":"A Bioretention Facility (Rain Garden) is an example of a Best Management Practice (BMP) primarily used for:","options":["Removing pathogens through UV disinfection","Filtering and infiltrating stormwater runoff to reduce non-point source pollution","Aerating sludge prior to land application","Preventing industrial wastewater spills"],"answer":"2"},{"id":"73977","q":"Why is the Food-to-Microorganism (F/M) ratio a critical operational parameter in the Activated Sludge process?","options":["It ensures the wastewater has a high enough pH for pathogen destruction.","It balances the supply of organic food with the consuming microbial biomass.","It determines the required amount of chlorine for final disinfection.","It measures the total flow rate of the incoming raw sewage."],"answer":"2"},{"id":"73978","q":"A key regulatory driver for the separation of sanitary sewage from stormwater in new infrastructure is to prevent:","options":["Odour complaints from treatment plant neighbours.","Combined Sewer Overflows (CSOs) that discharge untreated waste into waterways.","Excessive sludge production in the clarifier.","Damage to bar screens and comminutors."],"answer":"2"},{"id":"73979","q":"What is the primary management difference between a Conditionally Exempt Small Quantity Generator (CESQG) and a Large Quantity Generator (LQG)?","options":["CESQGs are completely exempt from RCRA regulations, including the manifest system.","LQGs are regulated by state laws, while CESQGs are regulated by federal laws.","CESQGs must treat all of their waste on-site, whereas LQGs must ship it off-site.","LQGs can store waste indefinitely, while CESQGs have a strict 90-day limit."],"answer":"1"},{"id":"73980","q":"What is the main concern with the long-term disposal of hazardous waste via Deep Well Injection?","options":["Release of methane gas (CH4) into the atmosphere.","Potential contamination of underground sources of drinking water (USDW).","Inefficient removal of volatile organic compounds (VOCs).","High surface area requirements and visible site impact."],"answer":"2"},{"id":"73981","q":"The purpose of the Polymer Addition step in sludge dewatering is to:","options":["Bind fine solid particles into larger, more cohesive clumps (flocs).","Increase the flowability of the sludge for pumping.","Disinfect the sludge prior to final land application.","Reduce the concentration of heavy metals through chemical precipitation."],"answer":"1"},{"id":"73982","q":"A key benefit of a Sequencing Batch Reactor (SBR) over a conventional Activated Sludge system is that it:","options":["Continuously discharges effluent, requiring constant monitoring.","Is only suitable for very large, high-flow municipal treatment plants.","Requires a secondary clarifier and separate equalization basin.","Combines all stages (filling, aeration, settling, drawing) into a single tank, simplifying infrastructure."],"answer":"4"},{"id":"73983","q":"In the context of liquid waste management, a Constructed Wetland serves which primary function?","options":["Physical/biological polishing of effluent to remove residual BOD, TSS, and nutrients.","Pre-treatment of raw sewage by removing large solids.","On-site incineration of dewatered sludge.","Rapid disinfection using chemical oxidants."],"answer":"1"},{"id":"73984","q":"Which of the following scenarios would necessitate a Type C Corrective Action under RCRA?","options":["A Conditionally Exempt Small Quantity Generator (CESQG) incorrectly labelling a satellite accumulation area container.","A permitted Treatment, Storage, and Disposal (TSD) facility with a confirmed release of hazardous waste into the environment.","A transporter losing a hazardous waste manifest during shipment.","A generator exceeding their monthly hazardous waste generation limit."],"answer":"2"},{"id":"73985","q":"Which type of hazardous waste treatment process involves injecting air into contaminated groundwater to strip volatile organic compounds (VOCs)?","options":["Pump and treat followed by Activated Sludge.","In-situ Solidification/Stabilization.","Chemical Oxidation using Ozone.","Air Sparging or Air Stripping."],"answer":"4"},{"id":"73986","q":"A key challenge in the management of stormwater from industrial sites (regulated under NPDES Stormwater Permits) is the potential for Hotspot Contaminants which include:","options":["Biochemical Oxygen Demand (BOD) and total coliform bacteria.","High concentrations of dissolved salts and total suspended solids (TSS).","Large amounts of non-hazardous leaves and yard debris.","Heavy metals (Cu, Zn, Pb) and oil/grease from vehicle maintenance and storage areas."],"answer":"4"},{"id":"73987","q":"What specialized wastewater treatment method involves the use of granular media, often sand or activated carbon, to physically filter and/or adsorb contaminants from effluent after secondary treatment?","options":["Deep Bed Filtration","Primary Clarification","Anaerobic Sequencing Batch Reactor (ASBR)","Sludge Thickening."],"answer":"1"},{"id":"73988","q":"Why is the Gas Collection and Control System (GCCS) at a RCRA Subtitle D landfill operated under a negative pressure?","options":["To enhance the biological activity of the anaerobic microbes in the landfill cell.","To compress the gas for easier transportation via pipeline to a processing facility.","To increase the energy content of the methane (CH_4) captured for flaring or energy recovery.","To prevent fugitive gas emissions from migrating laterally into the surrounding environment and structures."],"answer":"4"},{"id":"73989","q":"The RCRA P-list code P071 is assigned to which acutely hazardous discarded commercial chemical product?","options":["Methyl parathion.","Nickel carbonyl.","Nicotine.","Mercury (elemental)."],"answer":"1"},{"id":"73990","q":"In a municipal wastewater treatment plant, which factor will cause the largest decrease in the Standard Oxygen Transfer Efficiency (SOTE) of an aeration system?","options":["Switching from fine-bubble diffusers to coarse-bubble diffusers.","Increasing the water depth of the aeration basin.","Reducing the air flow rate to the diffusers.","Decreasing the water temperature from 20°C to 10°C."],"answer":"1"},{"id":"73991","q":"Under the Comprehensive Environmental Response, Compensation, and Liability Act (CERCLA or Superfund), the liability standard for Potentially Responsible Parties (PRPs) is defined as:","options":["Joint and Several, but Limited to the amount of waste contributed by the PRP.","Fault-based, requiring the EPA to prove negligence in the waste disposal process.","Strict, Joint and Several, and Retroactive.","Limited liability, provided the PRP followed all applicable laws at the time of disposal."],"answer":"3"},{"id":"73992","q":"During the pre-treatment of feed water for Reverse Osmosis (RO) membranes, which chemical is typically dosed to prevent membrane biofouling without causing downstream membrane damage?","options":["Alum (Al 2 (SO 4 ) 3 )","Chlorine (Cl 2 )","Glutaraldehyde (C 5 H 8 O 2 )","Sodium Bisulfite (NaHSO 3 )"],"answer":"3"},{"id":"73993","q":"Thermal Desorption Units (TDUs) are used to treat hazardous wastes by:","options":["Chemically destroying organic contaminants by oxidation at temperatures above 1000°C.","Neutralizing corrosive waste by mixing it with inert high-pH lime.","Melting the waste into a glassy slag to solidify heavy metals.","Physically separating volatile and semi-volatile organic contaminants from the soil or sludge matrix."],"answer":"4"},{"id":"73994","q":"The necessity of adding Seed biomass to a BOD5 test sample is primarily to ensure that:","options":["Nitrification (nitrogenous demand) is completely suppressed.","The sample contains sufficient microorganisms to degrade the organic matter.","The test measures only COD and not BOD.","The DO (Dissolved Oxygen) concentration is 0 mg/L at the beginning of the test."],"answer":"2"},{"id":"73995","q":"A key challenge in implementing Ion Exchange (IX) technology for treating industrial wastewater is the potential for:","options":["Ineffective removal of heavy metal ions.","High residual BOD that poisons the resin.","High energy consumption due to the need for high pressures.","The generation of a concentrated, highly toxic regeneration brine requiring specialized hazardous waste treatment."],"answer":"4"},{"id":"73996","q":"A solid waste is characterized as hazardous by the Toxicity Characteristic (TCLP for lead (D008)). What is the primary mandated Land Disposal Restriction (LDR) treatment standard for this waste before it can be landfilled?","options":["Incineration to achieve 99.99% Destruction and Removal Efficiency (DRE).","Solidification/Stabilization (S/S) to meet a specific concentration limit for lead in the leachate.","Deep well injection into a Class I non-hazardous well.","Neutralization to a pH between 6.0 and 9.0."],"answer":"2"},{"id":"73997","q":"If a wastewater treatment plant operates its aeration basin with an MCRT of 3 days and an F/M ratio of 0.5 kg BOD/kg MLVSS-day, the system is most likely operating in the:","options":["Nitrification/Denitrification regime.","Extended Aeration regime.","High-Rate Aeration regime.","Contact Stabilization regime."],"answer":"3"},{"id":"73998","q":"The principle of CT Value (Concentration × Time) is used in disinfection design to account for the impact of:","options":["The combined effect of disinfectant strength and exposure duration on pathogen inactivation.","The flow rate of the wastewater and the total mass of microorganisms.","The total dissolved solids (TDS) content in the final effluent.","The pH and temperature on the disinfectant's chemical speciation."],"answer":"1"},{"id":"73999","q":"In the Anaerobic Digestion process, the conversion of Volatile Fatty Acids (VFAs) to methane (CH4) and carbon dioxide (CO_2 ) is performed by which group of microorganisms?","options":["Sulphate-Reducing Bacteria (SRB).","Acetogenic bacteria.","Methanogenic archaea.","Hydrolytic bacteria."],"answer":"3"},{"id":"74000","q":"In the BOD 5 test, the chemical Allyl Thiourea (ATU) is sometimes added to samples to selectively suppress the activity of:","options":["Heterotrophic bacteria, thereby measuring only the chemical oxygen demand.","Nitrifying bacteria, allowing for the measurement of only carbonaceous BOD (CBOD).","Sulphate-reducing bacteria, preventing the formation of H 2 S.","Methanogenic archaea, increasing volatile fatty acid production."],"answer":"2"},{"id":"74001","q":"The formation of trihalomethanes (THMs) and other disinfection by-products (DBPs) during chlorination is primarily a concern because these compounds are:","options":["Carcinogenic or mutagenic, posing a long-term public health risk.","Heavy metals that cannot be removed by subsequent filtration.","Highly volatile, requiring an elaborate air stripping mechanism for removal.","Highly corrosive to concrete sewer pipes."],"answer":"1"},{"id":"74002","q":"The efficiency of Biological Phosphorus Removal (BPR) is critically dependent on which ratio in the anaerobic zone?","options":["Sludge Volume Index (SVI) to Mean Cell Residence Time (MCRT).","Volatile Fatty Acids (VFAs) to Phosphate (PO).","Total BOD to Total Suspended Solids (TSS).","Dissolved Oxygen (DO) to Nitrate (NO 3 )."],"answer":"2"},{"id":"74003","q":"A key regulatory and operational advantage of using a Soil Vapor Extraction (SVE) system over 'dig and haul' for contaminated soil is that SVE:","options":["is highly effective for non-volatile contaminants like PCBs and heavy metals.","Treats the contamination in-situ (in place), eliminating the need for expensive hazardous waste transportation and disposal.","Requires no air emissions controls because the VOCs are naturally dispersed into the atmosphere.","Eliminates the need for a CERCLA Remedial Investigation/Feasibility Study (RI/FS)."],"answer":"2"},{"id":"74004","q":"A key advantage of the Anaerobic-Anoxic-Oxic (A_2 O) process for BNR is the inclusion of the anaerobic zone, which provides selection pressure for:","options":["Phosphate Accumulating Organisms (PAOs) and simultaneous NO 3 reduction in the anoxic zone.","Filamentous bacteria, which enhances sludge settling.","The fastest-growing heterotrophic bacteria.","Nitrifying bacteria (AOB), which require a long hydraulic residence time."],"answer":"1"},{"id":"74005","q":"In a wastewater treatment process, the addition of methanol or another readily biodegradable carbon source is often necessary in the anoxic zone to enhance:","options":["Biological phosphorus release by providing Volatile Fatty Acids (VFAs).","Nitrification efficiency by suppressing heterotrophic decay.","The settling characteristics (SVI) of the sludge.","The denitrification rate in low-carbon municipal or industrial wastewater."],"answer":"4"},{"id":"74006","q":"The Biological Oxygen Demand (BOD) to Nitrogen (N) to Phosphorus (P) ratio for optimal growth of microorganisms in an aerobic wastewater treatment process is typically cited as:","options":["50:1:5","100:10:1","100:5:1","1:100:10"],"answer":"3"},{"id":"74007","q":"A Waste Analysis Plan (WAP) is a mandatory RCRA document required for permitted TSD facilities and is used to determine:","options":["The appropriate generator status of the facility.","The proper storage, treatment method, and final disposal of all incoming hazardous waste streams.","The total volume of waste generated annually for fee calculations.","The required length of the manifest retention period."],"answer":"2"},{"id":"74008","q":"Which parameter would be the most critical operational control to prevent scale formation on the membranes of a Reverse Osmosis (RO) unit?","options":["The pH and the Lonelier Saturation Index (LSI) of the brine (reject) stream.","The SDI (Silt Density Index).","The DRE (Destruction and Removal Efficiency) of the pre-treatment unit.","The BOD5 concentration of the incoming feed water."],"answer":"1"},{"id":"74009","q":"In the BOD 5 test, if the initial DO is 8.0 mg/L and the DO after 5 days is 4.0 mg/L in a 300 mL bottle, and the sample dilution was 1% (i.e. 3 mL sample), the BOD 5 is:","options":["133 mg/L","800 mg/L","400 mg/L","1200 mg/L"],"answer":"3"},{"id":"74010","q":"When measuring the BOD of an industrial wastewater sample suspected of being toxic to the seed biomass, the most appropriate modification to the standard BOD 5 test procedure is to:","options":["Use a specialized ATU inhibitor to suppress the toxic component.","Increase the dilution factor to reduce the concentration of the inhibitory substance.","Use a chemical COD test instead, as it is immune to toxicity effects.","Increase the incubation temperature to 35°C to overcome inhibition."],"answer":"2"},{"id":"74011","q":"A core objective of a Primary Effluent Filtration system (e.g., cloth media filtration) used before biological treatment in a WWTP is to:","options":["Remove sufficient BOD and TSS to significantly reduce the size requirement of the downstream bioreactor.","Eliminate the need for all subsequent disinfection processes.","Increase the F/M ratio in the downstream aeration basin.","Reduce the total solids loading to an MBR unit to prevent fouling."],"answer":"1"},{"id":"74012","q":"In the aerobic zone of an Activated Sludge plant, the phenomenon where the DO concentration drops significantly due to high microbial activity immediately after the influent enters the basin is known as:","options":["The Oxygen Sink effect.","Endogenous Respiration.","Immediate Oxygen Demand (IOD).","The Initial DO Sag or Plug-Flow Demand Zone."],"answer":"4"},{"id":"74013","q":"The conversion of dissolved oxygen concentration from a Standard Temperature of 20°C to the actual operating temperature is necessary because:","options":["The BOD 5 test is only valid at 20°C.","The solubility of oxygen in water is inversely proportional to temperature.","The alpha (a) factor is undefined at temperatures other than 20°C.","The microbial decay rate (ka) increases exponentially with temperature."],"answer":"2"},{"id":"74014","q":"The final effluent from a Secondary Wastewater Treatment Plant has a BOD5 of 20 mg/L and TSS of 30 mg/L. This quality level indicates the plant is meeting the minimal requirements set by the:","options":["Federal CWA Secondary Treatment Standards (30/30 Rule).","Maximum LDR Concentration Based Standards.","Advanced Treatment Standards (e.g., 10/10 or 5/5 mg/L).","Drinking water Maximum Contaminant Level (MCL) standards."],"answer":"1"},{"id":"74015","q":"The critical flux concept in Membrane Bioreactors (MBRs) primarily helps the operator avoid the onset of:","options":["Membrane scaling by calcium carbonate (CaCO_3).","Membrane oxidation by free chlorine residual.","The High-Rate Aeration regime in the bioreactor.","Concentration polarization, where solutes build up near the membrane surface and drastically reduce filtration."],"answer":"4"},{"id":"74016","q":"Which of the following is an example of an 'end-of-pipe' pollution control measure in the context of a project's Environmental Management Plan (EMP)?","options":["Installing a wastewater treatment plant to treat effluents before they are discharged.","Changing the manufacturing process to use less hazardous raw materials.","Implementing a strict segregation policy for waste at the source.","Reusing waste materials as a feedstock for a different process."],"answer":"1"},{"id":"74017","q":"The EIA Notification, 2006, mandates a specific timeframe for the State Pollution Control Board to conduct a public hearing after receiving a request from the project proponent. What is this timeframe?","options":["30 days","15 days","60 days","45 days"],"answer":"4"},{"id":"74018","q":"When Environmental Lapse Rate (ELR) is greater than Adiabatic Lapse Rate (ALR), then which of the following occurs?","options":["Super adiabatic lapse rate","Neutral lapse rate","Adiabatic lapse rate","Sub adiabatic lapse rate"],"answer":"1"},{"id":"74019","q":"What is the primary difference in management between 'domestic hazardous waste' and 'bio-medical waste' as per the SWM Rules and BMW Rules, 2016?","options":["Domestic hazardous waste is managed by households, while bio-medical waste is managed by hospitals.","Domestic hazardous waste is disposed of in a landfill, while bio-medical waste is always incinerated.","Domestic hazardous waste can be recycled, while bio-medical waste cannot.","Bio-medical waste is disposed of in the wet waste stream, while domestic hazardous waste is in the dry waste stream."],"answer":"1"},{"id":"74020","q":"According to the Solid Waste Management Rules, 2016, a 'Spot Fine' may be levied on a person or entity for which of the following actions?","options":["Failing to pay the monthly user fee for waste collection.","Burning solid waste on streets or in open public spaces.","Failure to provide a waste collection service.","Building a waste management facility without proper land."],"answer":"2"},{"id":"74021","q":"According to the Solid Waste Management Rules, 2016, what is the key responsibility of an 'event organizer' for an event with more than 100 people?","options":["To pay a 'User Fee' for waste collection.","To ensure segregation of waste at the source and hand over segregated waste to a waste collector.","To transport all waste from the event to a nearby landfill.","To process all organic waste from the event on-site."],"answer":"2"},{"id":"74022","q":"Recognize the WRONG statement related to the characteristics of Rubbish in Indian conditions.","options":["Rubbish constitutes more than 50% of the total municipal solid waste.","Rubbish includes rags paper pieces, broken pieces of glass and furniture, card-boards, etc.","Rubbish includes all non-putrescible wastes except ashes.","Rubbish has a density varying between 50 to 400 kg/m 3 ."],"answer":"1"},{"id":"74023","q":"Which of the following toxic substances is normally found in E-waste 'cathode ray tubes (CRT)'?","options":["Cadmium","Boron","Magnesium","Chromium"],"answer":"1"}];
let idx=0, answers={}, timerSec=3900, timerInt=null;

function render(){
  const q=DATA[idx];
  if(!q){document.getElementById('qText').textContent='No data.';return;}
  document.getElementById('qNum').textContent=idx+1;
  document.getElementById('qTotal').textContent=DATA.length;
  document.getElementById('qText').textContent=q.q;
  document.getElementById('opts').innerHTML=q.options.map((o,i)=>
    `<div class="option ${answers[idx]==(i+1)?'selected':''}" onclick="select(${i+1})">${String.fromCharCode(65+i)}. ${o}</div>`
  ).join('');
}
window.select=o=>{answers[idx]=o; render();};
window.prev=()=>{if(idx>0){idx--; render();}};
window.next=()=>{if(idx<DATA.length-1){idx++; render();}};

function submitTest(){
  clearInterval(timerInt);
  let c=0; for(let i=0;i<DATA.length;i++){if(answers[i]==DATA[i].answer)c++;}
  const pct=Math.round(c/DATA.length*100)||0;
  document.getElementById('qCard').classList.add('hidden');
  document.getElementById('resCard').classList.remove('hidden');
  document.getElementById('score').textContent=pct+'%';
  document.getElementById('detail').innerHTML='<b>'+c+'/'+DATA.length+'</b> correct';
}

function tick(){timerSec--; document.getElementById('timer').textContent=Math.floor(timerSec/60)+':'+String(timerSec%60).padStart(2,'0'); document.getElementById('bar').style.width=(timerSec/3900*100)+'%'; if(timerSec<=0){clearInterval(timerInt); submitTest();}}

render(); timerInt=setInterval(tick,1000);
</script>
</body></html>
