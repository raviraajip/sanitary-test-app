<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>ASWMO — T07 HWM + Non-Tech</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
:root{--bg:#0b0c15;--surface:#12142a;--text:#e4e6f0;--accent:#00e8a0;--gold:#f0c040;--danger:#ff4d6d;--border:rgba(255,255,255,.08);--muted:#8a8fa8;}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:Inter,system-ui,sans-serif;background:radial-gradient(1000px 700px at 20% 0%,#00e8a011,transparent),var(--bg);color:var(--text);min-height:100vh;line-height:1.55;}
.container{max-width:900px;margin:2rem auto;padding:0 1.2rem;}
h1{font-size:1.6rem;font-weight:700;background:linear-gradient(135deg,#fff,var(--accent));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.card{background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:16px;padding:1.5rem;margin-bottom:1rem;}
.question{font-size:1.05rem;font-weight:500;margin-bottom:.8rem;line-height:1.35;}
.options{display:grid;gap:.5rem;}
.option{padding:.7rem 1rem;background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:10px;cursor:pointer;font-size:.92rem;transition:.2s;}
.option:hover,.option.selected{border-color:var(--accent);background:rgba(0,232,160,.12);font-weight:600;}
.timer{font-family:monospace;font-weight:700;font-size:2rem;color:var(--accent);}
button{background:linear-gradient(135deg,var(--accent),#00b87e);color:#0a0c12;border:none;padding:.7rem 1.4rem;border-radius:10px;font-weight:700;cursor:pointer;}
.hidden{display:none!important}</style>
</head>

<div class="container">
<header><h1 id="ptitle">ASWMO — T07 HWM + Non-Tech</h1></header>

<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;">

<div id="detail" style="color:var(--muted);font-size:.95rem;"></div>
<div style="margin-top:1.5rem;"><a href="index.html" style="color:var(--accent);font-weight:600;">&#8592; Back</a></div>
</div>

const DATA=[{"id":"69093","q":"Which of the following is an effective method for treating inorganic liquid waste to reduce its volume and mobility before disposal?","options":["Incineration","Landfilling","Solidification/stabilization","Composting"],"answer":"3"},{"id":"69094","q":"The primary purpose of a \"cradle-to-grave\" manifest system in hazardous waste management is to:","options":["Classify waste based on its origin.","Ensure proper tracking and accountability of hazardous waste from generation to final disposal.","Facilitate the import and export of hazardous materials.","Determine the financial liability of waste generators."],"answer":"2"},{"id":"69095","q":"A facility that accepts hazardous waste for treatment, storage, or disposal is commonly referred to as a:","options":["Transfer station","Material recovery facility","Treatment, Storage, and Disposal Facility (TSDF)","Municipal solid waste landfill"],"answer":"3"},{"id":"69096","q":"What is the main objective of chemical oxidation and reduction in hazardous waste treatment?","options":["To increase the volume of the waste for easier handling.","To convert hazardous substances into non-hazardous or less toxic compounds.","To separate solid and liquid components of the waste.","To recover valuable materials from the waste stream."],"answer":"2"},{"id":"69097","q":"Which of the following is considered a containment technique for site remediation of contaminated land?","options":["In-situ bioremediation","Phytoremediation","Slurry walls","Evaporation"],"answer":"3"},{"id":"69098","q":"What is the term for the process of using plants to absorb, concentrate, or degrade contaminants in soil and water?","options":["Biofiltration","Phytoremediation","Ozonation","Pervaporation"],"answer":"2"},{"id":"69099","q":"A waste generator wants to reduce the amount of hazardous waste they produce. Which of the following techniques is considered a primary waste minimization strategy?","options":["Treating the waste to make it less hazardous.","Storing the waste in a secured facility.","Implementing a chemical exchange program with another company.","Transporting the waste to a TSDF."],"answer":"3"},{"id":"69100","q":"Which of the following is a characteristic of hazardous waste that makes it a threat to human health and the environment?","options":["Low moisture content","High density","Toxicity","Biodegradability"],"answer":"3"},{"id":"69101","q":"The primary goal of physical and chemical treatment processes like filtration and separation is to:","options":["Change the chemical composition of the waste.","Reduce the toxicity of the waste.","Isolate and concentrate hazardous components from the waste stream.","Increase the volume of the waste."],"answer":"3"},{"id":"69102","q":"In the context of waste management, what is the 'Polluter Pays Principle'?","options":["The polluter is only responsible for the waste they generate.","The polluter should bear the costs of managing the pollution they cause.","The government is responsible for paying for waste cleanup.","The consumer of a product is responsible for its final disposal."],"answer":"2"},{"id":"69103","q":"Which of the following is NOT typically classified as a biomedical waste?","options":["Sharps and needles","Human anatomical waste","Expired household medicines","Microbiology and biotechnology waste"],"answer":"3"},{"id":"69104","q":"The process of using microorganisms to break down or detoxify hazardous substances is known as:","options":["Solidification","Biofiltration","Incineration","Bioremediation"],"answer":"4"},{"id":"69105","q":"Which of the following is a primary objective of the Solid Waste Management Rules, 2024, regarding waste segregation?","options":["To promote a two-stream segregation of wet and dry waste.","To enforce a three-stream segregation of biodegradable, dry, and domestic hazardous waste.","To mandate a four-stream segregation of organic, paper, plastic, and metal waste.","To encourage a two-stream segregation of biodegradable and non-biodegradable waste."],"answer":"2"},{"id":"69106","q":"What is the main purpose of the Toxic Substances Control Act (TSCA) inventory?","options":["To list all new chemical substances introduced in the U.S.","To regulate the import and export of hazardous waste.","To serve as a comprehensive list of all chemical substances manufactured, imported, or processed in the U.S.","To track the generation and disposal of hazardous waste."],"answer":"3"},{"id":"69107","q":"Under the E-Waste (Management) Amendment Rules, 2024, the Central Government has the authority to create a platform for trading:","options":["Waste collection permits.","EPR certificates.","Carbon credits.","Recycled materials."],"answer":"2"},{"id":"69108","q":"The Superfund program, administered by the EPA, is responsible for the cleanup of:","options":["Municipal solid waste landfills.","Closed or abandoned hazardous waste sites.","Biomedical waste treatment facilities.","E-waste recycling plants."],"answer":"2"},{"id":"69109","q":"What does the term 'in-situ' refer to in the context of site remediation?","options":["Treatment of contaminated soil or groundwater on-site without excavation.","Excavation of contaminated soil for off-site treatment.","Disposal of hazardous waste in a landfill.","Transportation of waste across international borders."],"answer":"1"},{"id":"69110","q":"The National Environmental Policy Act (NEPA) requires federal agencies to consider environmental impacts in their planning processes. When was this act signed into law?","options":["January 1, 1970","January 2, 1970","January 1, 1971","January 1, 1972"],"answer":"1"},{"id":"69111","q":"What is a key step in the development of a dose-response relationship curve, as shown in the provided graph?","options":["Establishing a clear toxicological end point.","Determining the specific chemical composition of the substance.","Analyzing the economic cost of exposure.","Identifying the source of the hazardous waste."],"answer":"1"},{"id":"69112","q":"The term \"manifest\" in hazardous waste management refers to a document used to:","options":["Track the financial transactions for waste disposal.","Document the journey of hazardous waste from its point of generation to its final disposal.","Classify the hazardous waste based on its chemical properties.","Obtain permits for waste transportation."],"answer":"2"},{"id":"69113","q":"Which of the following is an example of an inorganic liquid waste that requires specialized handling?","options":["Used cooking oil","Solvents","Acidic or alkaline solutions","Paint waste"],"answer":"3"},{"id":"69114","q":"The process of solidification and stabilization is primarily used to:","options":["Reduce the toxicity of hazardous waste.","Decrease the mobility of contaminants and reduce the volume of the waste.","Increase the flammability of the waste.","Recover valuable materials from the waste stream."],"answer":"2"},{"id":"69115","q":"What is the main purpose of \"pervaporation\" in hazardous waste treatment?","options":["To separate a mixture of liquids based on their volatility.","To solidify liquid waste.","To incinerate organic waste.","To filter solid particles from a liquid."],"answer":"1"},{"id":"69116","q":"In the context of hazardous waste management, \"phytoremediation\" is a technique that uses:","options":["Chemical reactions to neutralize waste.","Microorganisms to break down contaminants.","Plants to remove or degrade contaminants from soil or water.","High temperatures to destroy waste."],"answer":"3"},{"id":"69117","q":"The Basel Convention is an international treaty that regulates the:","options":["Transboundary movement of hazardous wastes and their disposal.","Management of municipal solid waste.","Production of toxic chemicals.","Use of pesticides."],"answer":"1"},{"id":"69118","q":"What is a \"leachate\" in the context of a hazardous waste landfill?","options":["The liner at the bottom of the landfill.","The gas produced by the decomposition of waste.","The liquid that has passed through the waste and has absorbed contaminants.","The soil used to cover the waste."],"answer":"3"},{"id":"69119","q":"What is the primary benefit of \"biofiltration\" in waste management?","options":["It is a high-cost treatment method.","It is effective for treating high-volume liquid waste.","It uses microorganisms to remove air pollutants and odors from gas streams.","It converts solid waste into liquid form."],"answer":"3"},{"id":"69120","q":"Which of the following is considered an \"in-situ\" remedial action technique?","options":["Excavating contaminated soil.","Transporting contaminated waste to a TSDF.","Bioventing (using microbes to break down contaminants in the soil).","Capping a landfill with concrete."],"answer":"3"},{"id":"69121","q":"What is the primary purpose of a \"slurry wall\" in a hazardous waste containment system?","options":["To prevent the escape of landfill gas.","To contain and prevent the migration of contaminated groundwater.","To provide structural support for the landfill.","To increase the rate of waste decomposition."],"answer":"2"},{"id":"69122","q":"The term CERCLA is often associated with the cleanup of contaminated sites. What does CERCLA stand for?","options":["Chemical Exchange and Remedial Cleanup Act","Comprehensive Environmental Response, Compensation, and Liability Act","Controlled Emission and Remedial Liability Act","Contaminated Environmental Recovery and Liability Act"],"answer":"2"},{"id":"69123","q":"What is the primary goal of the \"Precautionary Principle\" in environmental policy?","options":["To require that all environmental policies are based on scientific certainty.","To take preventive action in the face of uncertainty about environmental harm.","To prioritize economic development over environmental protection.","To clean up environmental damage after it has occurred."],"answer":"2"},{"id":"69124","q":"What is the function of an \"environmental site assessment\" (ESA) in real estate transactions?","options":["To determine the market value of the property.","To identify potential or existing environmental contamination on a property.","To obtain a construction permit.","To assess the structural integrity of a building."],"answer":"2"},{"id":"69125","q":"The \"Resource Conservation and Recovery Act\" (RCRA) in the United States primarily regulates:","options":["Air pollution from industrial sources.","Hazardous and non-hazardous solid waste.","Water quality in public waterways.","The disposal of radioactive waste."],"answer":"2"},{"id":"69126","q":"Which of the following is considered a key step in the management of biomedical waste?","options":["Mixing biomedical waste with municipal solid waste.","Segregating waste at the point of generation.","Incinerating all types of waste together.","Disposing of sharps in regular waste bins."],"answer":"2"},{"id":"69127","q":"The \"T\" in TSDF stands for:","options":["Transportation","Transboundary","Treatment","Toxicity"],"answer":"3"},{"id":"69128","q":"What is the process of chemical precipitation in hazardous waste treatment?","options":["Using a biological process to break down waste.","Converting a dissolved substance into an insoluble solid to separate it from a liquid solution.","Heating the waste to a high temperature.","Using plants to absorb contaminants."],"answer":"2"},{"id":"69129","q":"What is the primary objective of the \"Zero Waste Principle\" in waste management?","options":["To completely eliminate waste generation.","To minimize the amount of waste sent to landfills and incinerators by promoting reuse, recycling, and composting.","To ensure all waste is treated with incineration.","To bury all waste in a landfill."],"answer":"2"},{"id":"69130","q":"The term \"containment techniques\" in site remediation refers to methods that:","options":["Destroy hazardous waste on-site.","Physically isolate or immobilize contaminants to prevent their migration.","Use biological processes to break down waste.","Recover valuable materials from contaminated sites."],"answer":"2"},{"id":"69131","q":"In the context of waste management, what is a \"landfill gas\"?","options":["The liquid that has passed through the waste.","The gas produced by the anaerobic decomposition of organic matter in a landfill.","The gas used to incinerate waste.","The gas used to monitor the landfill."],"answer":"2"},{"id":"69132","q":"The \"National Environmental Policy Act (NEPA)\" is an environmental law of the:","options":["United States.","United Kingdom.","Indian.","Australian."],"answer":"1"},{"id":"69133","q":"The EPA announced updates to New Source Performance Standards (NSPS) to reduce emissions of landfill gas:","options":["Sulphur-rich.","TSDF & Monitoring in TSDF.","Methane-rich.","E-waste Regulation & Injection Well Disposal."],"answer":"3"},{"id":"69134","q":"What is the purpose of an \"emergency response plan\" at a hazardous waste facility?","options":["To detail procedures for handling and containing spills or releases.","To outline the daily operational procedures.","To schedule waste shipments.","To track waste inventory."],"answer":"1"},{"id":"69135","q":"Which of the following is an example of an inorganic pollutant in chemical waste?","options":["Pesticides","Heavy metals like lead and mercury","Solvents","Used oil"],"answer":"2"},{"id":"69136","q":"What is the significance of a \"toxicological end point\" in dose-response relationship curves?","options":["It is the point at which the dose is administered.","It is the specific harmful effect or biological response that is being measured.","It is the final step in the analysis.","It is the beginning of the experiment."],"answer":"2"},{"id":"69137","q":"The process of \"remediation\" for a hazardous waste site is:","options":["The legal process of closing a site.","The cleanup or mitigation of contaminated sites.","The process of waste segregation.","The transportation of waste to a new site."],"answer":"2"},{"id":"69138","q":"What does the term \"transboundary movement\" refer to in hazardous waste management?","options":["The movement of waste within a single country.","The movement of waste from one state to another.","The shipment of waste from one country to another.","The illegal dumping of waste."],"answer":"3"},{"id":"69139","q":"What is the role of the Extended Producer Responsibility (EPR) principle in the E-Waste (Management) Amendment Rules, 2024?","options":["It requires consumers to return their e-waste to the producers.","It makes producers responsible for the collection and recycling of their e-waste products.","It bans the use of certain materials in electronics.","It provides government subsidies for recycling e-waste."],"answer":"2"},{"id":"69140","q":"What is the primary purpose of a \"geological investigation\" for a landfill site?","options":["To determine the market value of the land.","To analyze the soil composition and rock formations to ensure the site is stable and won't leak.","To assess the site's proximity to roads.","To determine the amount of waste the site can hold."],"answer":"2"},{"id":"69141","q":"How many hazard classes should be taken into account while packing the waste?","options":["6","7","8","9"],"answer":"4"},{"id":"69142","q":"The highest dose that has no harmful effect on a population is known as:","options":["NOAEL","NOEL","NOAL","NOPA"],"answer":"1"},{"id":"69143","q":"Pangsau Pass, which was seen in the news, lies between which two countries?","options":["India and Bhutan","China and Nepal","India and Myanmar","India and Bangladesh"],"answer":"3"},{"id":"69144","q":"Karpoori Thakur will be honoured with Bharat Ratna (posthumously), he was the former Chief Minister of which state?","options":["Uttar Pradesh","Bihar","Madhya Pradesh","Jharkhand"],"answer":"2"},{"id":"69145","q":"Typhoon Missile System was developed by which country?","options":["Russia","France","United States","Japan"],"answer":"3"},{"id":"69146","q":"Who was named the ICC Men's T20I Cricketer of the Year in January 2025?","options":["Kuldeep Yadav","Rishabh Pant","Suryakumar Yadav","Arshdeep Singh"],"answer":"4"},{"id":"69147","q":"The Polavaram Multipurpose Project, which was seen in the news, is located in which state?","options":["Kerala","Karnataka","Andhra Pradesh","Maharashtra"],"answer":"3"},{"id":"69148","q":"Where was the UTT 86th Senior National and Inter-state Table Championship 2024 held?","options":["Bhopal","Surat","Mumbai","New Delhi"],"answer":"2"},{"id":"69149","q":"Which bank became the first Indian bank to implement Clari5's NCRP Integration Solution?","options":["Punjab National Bank","Bank of Baroda","Bank of India","Canara Bank"],"answer":"1"},{"id":"69150","q":"Who is the author of the recently launched book 'The World after Gaza'?","options":["Noam Chomsky","Pankaj Mishra","Haruki Murakami","Martin Indyk"],"answer":"2"},{"id":"69151","q":"Which country became a partner state of the BRICS group in 2025?","options":["Iran","United Arab Emirates (UAE)","Vietnam","Argentina"],"answer":"3"},{"id":"69152","q":"When was the Beti Bachao Beti Padhao (BBBP) Scheme launched?","options":["2014","2015","2016","2017"],"answer":"2"},{"id":"69153","q":"Which country conducted the 'Drone Prahar Exercise' to test drone technologies in combat zones?","options":["China","Russia","USA","India"],"answer":"4"},{"id":"69154","q":"With reference to the disposal of solid wastes, pulverization refers to:","options":["heating at 1,100°C","cutting and tearing","crushing and grinding","cutting only"],"answer":"3"},{"id":"69155","q":"Which is the most efficient method used for the disposal of hospital-generated waste?","options":["Open dumps","Sanitary landfills","Incinerator","Furnace"],"answer":"3"},{"id":"69156","q":"The sewerage system in which the society's waste is carried in buckets or carts is called:","options":["hygienic system","water carriage system","conservancy system","bucket system"],"answer":"3"},{"id":"69157","q":"What does the 3R principle in waste management stand for?","options":["Reduce, Replace, Reuse","Recover, Reclamation, Reproduce","Reduce, Reuse, Recycle","Reuse, Reproduce, Recycle"],"answer":"3"}];
let idx=0, answers={}, timerSec=3900, timerInt=null;

function render(){
  const q=DATA[idx];
  if(!q){document.getElementById('qText').textContent='No data.';return;}
  document.getElementById('qNum').textContent=idx+1;
  document.getElementById('qTotal').textContent=DATA.length;
  document.getElementById('qText').textContent=q.q;
  document.getElementById('opts').innerHTML=q.options.map((o,i)=>
    `<div class="option ${answers[idx]==(i+1)?'selected':''}" onclick="select(${i+1})">${String.fromCharCode(65+i)}. ${o}</div>`
  ).join('');
}
window.select=o=>{answers[idx]=o; render();};
window.prev=()=>{if(idx>0){idx--; render();}};
window.next=()=>{if(idx<DATA.length-1){idx++; render();}};

function submitTest(){
  clearInterval(timerInt);
  let c=0; for(let i=0;i<DATA.length;i++){if(answers[i]==DATA[i].answer)c++;}
  const pct=Math.round(c/DATA.length*100)||0;
  document.getElementById('qCard').classList.add('hidden');
  document.getElementById('resCard').classList.remove('hidden');
  document.getElementById('score').textContent=pct+'%';
  document.getElementById('detail').innerHTML='<b>'+c+'/'+DATA.length+'</b> correct';
}

function tick(){timerSec--; document.getElementById('timer').textContent=Math.floor(timerSec/60)+':'+String(timerSec%60).padStart(2,'0'); document.getElementById('bar').style.width=(timerSec/3900*100)+'%'; if(timerSec<=0){clearInterval(timerInt); submitTest();}}

render(); timerInt=setInterval(tick,1000);
</script>
