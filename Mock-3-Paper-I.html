 Negative Mark: 0"},{"id":"84403","q":"The \"Bodh Gaya\" temple complex, where Gautama Buddha attained enlightenment, became a UNESCO World Heritage Site in which year?","options":["1983","1999","2002","2010"],"answer":"3","solution":"The Mahabodhi Temple Complex at Bodh Gaya in Bihar, a profoundly sacred site in Buddhism marking the location of the Buddha's enlightenment, was officially inscribed as a UNESCO World Heritage Site in the year 2002. Additional Info (a) 1983 was the year the Taj Mahal and Ajanta/Ellora Caves were inscribed. (b) The Darjeeling Himalayan Railway was inscribed in 1999. (c) It is one of the earliest Buddhist temples built entirely in brick that is still standing in India. (d) Jantar Mantar in Jaipur was inscribed in 2010. Positive Mark: 0.8 Negative Mark: 0"},{"id":"84404","q":"Which gas is known as \"Tear Gas\" commonly used by law enforcement for riot control?","options":["Chloropicrin (CS gas)","Nitrous oxide","Carbon monoxide","Hydrogen sulfide"],"answer":"1","solution":"\"Tear gas\" is a non-lethal chemical weapon that stimulates the corneal nerves in the eyes, causing tearing, pain, and temporary blindness. CS gas (2-chlorobenzalmalononitrile) and related compounds like Chloropicrin are the most common active agents used by law enforcement globally. Additional Info (a) CS gas forces people to disperse due to the intense respiratory and ocular irritation. (b) Nitrous oxide is \"laughing gas,\" used as a mild anesthetic. (c) Carbon monoxide is a highly toxic, odorless gas. (d) Hydrogen sulfide has a foul odor (rotten eggs) and is naturally occurring, not used for riot control. Positive Mark: 0.8 Negative Mark: 0"},{"id":"84405","q":"A 'Bear Market' in economics signifies a period where:","options":["Stock prices are rising steadily","Stock prices are falling and investors are pessimistic","Inflation is at zero percent","Central banks are drastically lowering interest rates"],"answer":"2","solution":"A \"Bear Market\" is a financial term describing a condition in which securities prices fall and widespread pessimism causes the stock market's downward spiral to be self-sustaining. It is typically defined by a drop of 20% or more from recent highs. Additional Info (a) A market where prices are steadily rising is called a \"Bull Market.\" (b) The term supposedly originates from the way a bear attacks its prey\u2014swiping its paws downward. (c) Zero inflation is not directly tied to market sentiment. (d) Central banks may lower rates in response to a bear market, but this action does not define the bear market itself. Positive Mark: 0.8 Negative Mark: 0"},{"id":"84406","q":"The instrument used to measure atmospheric pressure is:","options":["Hygrometer","Lactometer","Barometer","Anemometer"],"answer":"3","solution":"A barometer is a scientific instrument used in meteorology to measure atmospheric pressure. Changes in atmospheric pressure are highly indicative of short-term changes in the weather. Additional Info (a) A hygrometer measures the humidity or amount of water vapor in the air. (b) A lactometer is used to check the purity and density of milk. (c) The invention of the mercury barometer is attributed to Evangelista Torricelli. (d) An anemometer measures wind speed and direction. Positive Mark: 0.8 Negative Mark: 0"},{"id":"84407","q":"Which of the following treaties established the European Union (EU)?","options":["Treaty of Versailles","Treaty of Rome","Maastricht Treaty","Treaty of Lisbon"],"answer":"3","solution":"The Maastricht Treaty, signed in 1992 and effective in 1993, formally established the European Union (EU). It created the three-pillar structure of the EU and laid the foundation for the single European currency, the Euro. Additional Info (a) The Treaty of Versailles (1919) formally ended World War I. (b) The Treaty of Rome (1957) established the European Economic Community (EEC). (c) Maastricht represented a major step toward European political and economic integration. (d) The Treaty of Lisbon (2007) amended the constitutional basis of the EU to streamline its institutions. Positive Mark: 0.8 Negative Mark: 0"},{"id":"84408","q":"'Extended Producer Responsibility' (EPR) mandates that the manufacturer is responsible for the product:","options":["Only up to the point of sale","Only during the warranty period","Throughout the product's life cycle, including post-consumer disposal","Only if the product causes injury"],"answer":"3","solution":"Extended Producer Responsibility (EPR) is an environmental policy approach in which a producer's physical and financial responsibility for a product is extended to the post-consumer stage of its life cycle, specifically focusing on its safe recycling and disposal. Additional Info (a) Traditional models absolved producers of responsibility once the sale was complete. (b) Warranties cover functional defects, not environmental end-of-life management. (c) EPR is a core component of India's E-Waste and Plastic Waste Management Rules. (d) Product liability laws cover injuries, which is separate from EPR waste mandates. Positive Mark: 0.8 Negative Mark: 0"},{"id":"84409","q":"The term 'Open Source Software' means:","options":["Software that is free to download but cannot be modified","Software whose source code is available for anyone to view, modify, and enhance","Software strictly developed by the government","Software that works without an operating system"],"answer":"2","solution":"Open Source Software (OSS) is software with source code that anyone can inspect, modify, and enhance. It is developed in a decentralized and collaborative way, relying on peer review and community production. Additional Info (a) Software that is free but closed-source is known as \"Freeware.\" (b) Examples of open-source software include the Linux operating system, Mozilla Firefox, and VLC Media Player. (c) Government software can be proprietary or open-source, but the origin doesn't define the term. (d) All application software requires an operating system or specific firmware to function. Positive Mark: 0.8 Negative Mark: 0"},{"id":"84410","q":"Which chemical element has the symbol 'Pb'?","options":["Phosphorus","Potassium","Lead","Palladium"],"answer":"3","solution":"The chemical symbol 'Pb' stands for Lead. The symbol is derived from its Latin name, \"Plumbum,\" which is also the root word for modern \"plumbing,\" as the ancient Romans used lead for their water pipes. Additional Info (a) Phosphorus has the chemical symbol 'P'. (b) Potassium has the chemical symbol 'K' (from Kalium). (c) Lead is a heavy, toxic metal post-transition metal. (d) Palladium has the chemical symbol 'Pd'. Positive Mark: 0.8 Negative Mark: 0"},{"id":"84411","q":"The state of Bihar celebrates 'Bihar Diwas' every year to commemorate its formation on which date?","options":["22 March","15 April","1 May","2 October"],"answer":"1","solution":"Bihar Diwas (Bihar Day) is observed every year on March 22nd. It commemorates the day in 1912 when the British officially carved out the state of Bihar from the Bengal Presidency. Additional Info (a) March 22nd is a public holiday in Bihar, celebrated with massive cultural events. (b) 15 April is celebrated as Himachal Day. (c) 1 May is celebrated as Maharashtra Day and Gujarat Day (as well as International Workers' Day). (d) 2 October is Gandhi Jayanti. Positive Mark: 0.8 Negative Mark: 0"},{"id":"84412","q":"What is the primary function of the 'Cerebellum' in the human brain?","options":["Memory storage","Regulation of heart rate","Balance, posture, and coordination of voluntary movements","Processing visual information"],"answer":"3","solution":"The cerebellum (Latin for \"little brain\") is located at the back of the brain. Its primary function is to receive information from the sensory systems, spinal cord, and other parts of the brain to regulate motor movements, ensuring smooth, balanced muscular activity and maintaining posture. Additional Info (a) Memory storage is primarily handled by the hippocampus and the cerebrum. (b) Heart rate is regulated by the medulla oblongata in the brainstem. (c) Damage to the cerebellum leads to clumsy, uncoordinated movements (ataxia). (d) Visual information is processed in the occipital lobe of the cerebrum. Positive Mark: 0.8 Negative Mark: 0"},{"id":"84413","q":"Under the PM KISAN scheme, eligible farmers receive a financial benefit of what amount per year?","options":["Rs. 4,000","Rs. 6,000","Rs. 8,000","Rs. 10,000"],"answer":"2","solution":"Under the Pradhan Mantri Kisan Samman Nidhi (PM-KISAN) scheme, all landholding farmers' families are provided with a financial benefit of Rs. 6,000 per year to supplement their financial needs. Additional Info (a) Incorrect amount. (b) The Rs. 6,000 is transferred directly into the bank accounts of the beneficiaries in three equal installments of Rs. 2,000 each. (c) Incorrect amount. (d) Incorrect amount. Positive Mark: 0.8 Negative Mark: 0"},{"id":"84414","q":"In optics, the splitting of white light into its constituent colors by a prism is called:","options":["Reflection","Refraction","Dispersion","Interference"],"answer":"3","solution":"Dispersion is the optical phenomenon where white light is separated into its constituent spectral colors (the visible spectrum or rainbow) because different wavelengths of light are refracted (bent) by different amounts when passing through a medium like a glass prism. Additional Info (a) Reflection is the bouncing back of light from a surface. (b) Refraction is the bending of light as it passes from one medium to another. Dispersion relies on refraction, but dispersion specifically describes the splitting effect. (c) Violet light bends the most, and red light bends the least during dispersion. (d) Interference is the superposing of two or more light waves to form a resultant wave. Positive Mark: 0.8 Negative Mark: 0"},{"id":"84415","q":"The 'Suez Canal' connects the Mediterranean Sea with the:","options":["Black Sea","Red Sea","Arabian Sea","Caspian Sea"],"answer":"2","solution":"The Suez Canal is an artificial sea-level waterway in Egypt that connects the Mediterranean Sea to the Red Sea through the Isthmus of Suez. It provides the shortest maritime route between Europe and the lands lying around the Indian and western Pacific oceans. Additional Info (a) The Bosporus and Dardanelles straits connect the Mediterranean (via the Aegean and Marmara seas) to the Black Sea. (b) The canal officially opened in 1869 and is a critical chokepoint for global trade. (c) The Red Sea eventually leads into the Arabian Sea via the Gulf of Aden. (d) The Caspian Sea is the world's largest inland body of water and is completely landlocked. Positive Mark: 0.8 Negative Mark: 0"},{"id":"84416","q":"The 'National Clean Air Programme' (NCAP) targets a significant reduction in which specific pollutants?","options":["Ozone and Carbon Monoxide","PM10 and PM2.5 (Particulate Matter)","Sulfur Dioxide and Nitrogen Dioxide","Lead and Ammonia"],"answer":"2","solution":"Launched by the Ministry of Environment, Forest and Climate Change (MoEFCC), the NCAP is a national-level strategy designed to tackle the increasing air pollution problem across Indian cities, specifically targeting a 20% to 30% reduction in Particulate Matter (PM10 and PM2.5) concentrations. Additional Info (a) While ozone and CO are monitored, they are not the primary, headline targets of NCAP. (b) PM2.5 and PM10 are highly dangerous as they can penetrate deep into the lungs and enter the bloodstream. (c) SO2 and NO2 are tracked under the National Air Quality Index (AQI), but the NCAP's quantitative reduction targets are anchored to particulate matter. (d) Lead and ammonia are trace pollutants monitored under the AQI. Positive Mark: 0.8 Negative Mark: 0"},{"id":"84417","q":"Who wrote the national song \"Vande Mataram\"?","options":["Rabindranath Tagore","Bankim Chandra Chatterjee","Sarojini Naidu","Subhas Chandra Bose"],"answer":"2","solution":"\"Vande Mataram\" was written by Bankim Chandra Chatterjee in the 1870s and was later included in his famous 1882 Bengali novel, Anandamath. The song played a vital historic role in the Indian independence movement. Additional Info (a) Rabindranath Tagore wrote India's National Anthem, \"Jana Gana Mana,\" and composed the music for Vande Mataram when it was first sung at a political meeting in 1896. (b) The song is an ode to the Motherland, personified as the goddess Durga. (c) Sarojini Naidu, the \"Nightingale of India,\" was a poet and independence activist. (d) Subhas Chandra Bose popularized the greeting \"Jai Hind.\" Positive Mark: 0.8 Negative Mark: 0"},{"id":"84418","q":"Which topology connects all computers in a network to a single central cable (backbone)?","options":["Star topology","Ring topology","Bus topology","Mesh topology"],"answer":"3","solution":"In a Bus topology, all devices (nodes) on the network are connected sequentially to a single, continuous central cable, known as the backbone or bus. Data sent by a node travels along the backbone until it reaches its intended destination. Additional Info (a) Star topology connects all devices to a central hub or switch. (b) Ring topology connects devices in a closed-loop circle. (c) Bus topologies are easy to set up but vulnerable; if the central cable breaks, the entire network goes down. (d) Mesh topology connects every device to every other device, offering high redundancy. Positive Mark: 0.8 Negative Mark: 0"},{"id":"84419","q":"If an object is moving in a circular path with uniform speed, its acceleration is:","options":["Zero","Directed towards the center of the circle","Directed tangentially to the circle","Directed outwards from the center"],"answer":"2","solution":"When an object moves in a circular path at a uniform (constant) speed, its direction of motion is constantly changing. Because velocity is a vector (speed + direction), a change in direction means the velocity is changing. This continuous change in velocity requires an acceleration directed toward the center of the circle, known as centripetal acceleration. Additional Info (a) Acceleration is only zero if both speed and direction are constant (straight-line motion). (b) The formula for centripetal acceleration is a = v 2 /r. (c) Tangential acceleration only exists if the object is speeding up or slowing down along the curve. (d) An \"outward\" force is the fictitious centrifugal force perceived from within the rotating reference frame. Positive Mark: 0.8 Negative Mark: 0"},{"id":"84420","q":"The 'Lokpal and Lokayuktas Act' aims primarily to:","options":["Regulate stock markets","Investigate corruption allegations against public functionaries","Resolve center-state boundary disputes","Manage foreign direct investments"],"answer":"2","solution":"The Lokpal and Lokayuktas Act, 2013, provides for the establishment of an anti-corruption ombudsman called Lokpal for the Union (Center) and Lokayukta for the States to inquire into allegations of corruption against certain public functionaries, including the Prime Minister, cabinet ministers, and members of parliament. Additional Info (a) Stock markets are regulated by the Securities and Exchange Board of India (SEBI). (b) The Act was passed following the massive anti-corruption movement led by Anna Hazare in 2011. (c) Boundary disputes are resolved by the Supreme Court under its original jurisdiction. (d) FDI is managed by the Ministry of Commerce and Industry and the RBI. Positive Mark: 0.8 Negative Mark: 0"},{"id":"84421","q":"Which hormone prepares the body for a 'fight or flight' response?","options":["Insulin","Adrenaline","Thyroxine","Estrogen"],"answer":"2","solution":"Adrenaline (also known as epinephrine) is secreted by the adrenal medulla in response to stress. It rapidly prepares the body for a \"fight or flight\" response by increasing the heart rate, elevating blood pressure, dilating air passages, and maximizing blood glucose levels for immediate energy. Additional Info (a) Insulin regulates and lowers blood glucose levels. (b) The surge of adrenaline diverts blood flow away from the digestive system and toward the major skeletal muscles. (c) Thyroxine regulates the body's baseline metabolic rate. (d) Estrogen is a primary female sex hormone. Positive Mark: 0.8 Negative Mark: 0"},{"id":"84422","q":"The oldest Veda among the four Vedas is:","options":["Samaveda","Yajurveda","Atharvaveda","Rigveda"],"answer":"4","solution":"The Rigveda is the oldest of the four sacred Vedas of Hinduism, and one of the oldest extant texts in any Indo-European language. It is a collection of 1,028 Vedic Sanskrit hymns dedicated to Rigvedic deities. Additional Info (a) The Samaveda is the Veda of melodies and chants. (b) The Yajurveda is the Veda of prose mantras and prose for worship rituals. (c) The Atharvaveda contains procedures for everyday life, magical formulas, and spells. (d) The Rigveda was composed roughly between 1500 and 1000 BCE in the northwestern region of the Indian subcontinent. Positive Mark: 0.8 Negative Mark: 0"},{"id":"84423","q":"In the context of e-waste, 'CRT' monitors are considered highly hazardous due to the presence of:","options":["Radioactive uranium","Large amounts of lead in the glass tube","Liquid mercury cooling systems","Asbestos insulation"],"answer":"2","solution":"CRT (Cathode Ray Tube) monitors and older televisions are considered extremely hazardous e-waste because the heavy glass funnel and neck of the tube contain large quantities of lead (often several pounds per monitor). This lead was necessary to shield users from the X-rays generated by the electron beam. Additional Info (a) CRTs do not contain radioactive uranium. (b) If improperly disposed of in a landfill, the lead glass can break and leach into groundwater. (c) Liquid mercury is not used for cooling, though small amounts of mercury vapor are found in CCFL backlights of older LCD monitors. (d) Asbestos is not typically found in CRT monitors. Positive Mark: 0.8 Negative Mark: 0"},{"id":"84424","q":"The concept of 'Five-Year Plans' in India was borrowed from:","options":["USA","UK","USSR (Soviet Union)","France"],"answer":"3","solution":"The concept of centralized economic planning via \"Five-Year Plans\" was heavily inspired by the model used in the USSR (Soviet Union), which India adopted post-independence to guide its economic development through the Planning Commission. Additional Info (a) The USA operates on a free-market capitalist model without centralized multi-year state economic plans. (b) The UK provided the model for parliamentary democracy, not planned economics. (c) The First Five-Year Plan in India was launched in 1951, focusing on agriculture. The Mahalanobis model (heavy industry) drove the Second Plan. (d) France uses \"indicative planning,\" but India's model was directly influenced by the Soviet system. Positive Mark: 0.8 Negative Mark: 0"},{"id":"84425","q":"The 'Brahmaputra' river is known by which name as it flows through Tibet?","options":["Dihang","Tsangpo","Jamuna","Meghna"],"answer":"2","solution":"The Brahmaputra river originates in the Chemayungdung glacier in the Kailash range in Tibet, where it is known as the Yarlung Tsangpo (or simply Tsangpo), meaning \"The Purifier.\" Additional Info (a) It is called the Dihang (or Siang) when it enters India through Arunachal Pradesh. (b) It is one of the world's highest-altitude major rivers in its Tibetan stretch. (c) After entering Bangladesh, it is known as the Jamuna. (d) It joins the Padma (Ganges) and eventually forms the Meghna before emptying into the Bay of Bengal. Positive Mark: 0.8 Negative Mark: 0"},{"id":"84426","q":"Which organelle is known as the \"suicide bag\" of the cell due to its digestive enzymes?","options":["Ribosome","Lysosome","Golgi apparatus","Vacuole"],"answer":"2","solution":"Lysosomes are membrane-bound cellular organelles containing powerful hydrolytic (digestive) enzymes. They are nicknamed \"suicide bags\" because if the cell is damaged beyond repair, the lysosome can burst, releasing enzymes that digest and destroy the entire cell (autolysis). Additional Info (a) Ribosomes are the sites of protein synthesis. (b) Under normal conditions, lysosomes digest obsolete cellular components and foreign materials. (c) The Golgi apparatus modifies, sorts, and packages proteins for transport. (d) Vacuoles are storage sacs for water, nutrients, or waste. Positive Mark: 0.8 Negative Mark: 0"},{"id":"84427","q":"The 'Nalanda University', a world-renowned ancient center of learning, was revived in modern times and is located near which Bihar town?","options":["Rajgir","Bodh Gaya","Pawapuri","Vaishali"],"answer":"1","solution":"The modern, revived Nalanda University, an international institution of excellence, is located in Rajgir, in the Nalanda district of Bihar. It is situated close to the ruins of the ancient Nalanda Mahavihara. Additional Info (a) The revival project was initiated by Dr. A.P.J. Abdul Kalam and supported by the East Asia Summit. (b) Bodh Gaya is famous for the Mahabodhi Temple. (c) Pawapuri is a holy site for Jains, marking the nirvana of Lord Mahavira. (d) Vaishali is an ancient city known for the Second Buddhist Council. Positive Mark: 0.8 Negative Mark: 0"},{"id":"84428","q":"What does \"GUI\" stand for in computing?","options":["Graphical User Interface","General Utility Interface","Global User Identification","Graphic Unit Instruction"],"answer":"1","solution":"GUI stands for Graphical User Interface. It is a type of user interface that allows users to interact with electronic devices through graphical icons, windows, and visual indicators, rather than text-based command-line interfaces (CLI). Additional Info (a) The GUI made personal computers accessible to the general public (popularized by Apple's Macintosh and Microsoft Windows). (b) General Utility Interface is a fabricated distractor. (c) Global User Identification is a fabricated distractor. (d) Graphic Unit Instruction is a fabricated distractor. Positive Mark: 0.8 Negative Mark: 0"},{"id":"84429","q":"The Reserve Bank of India (RBI) was nationalized in the year:","options":["1935","1947","1949","1955"],"answer":"3","solution":"The Reserve Bank of India (RBI) was originally established in 1935 as a privately owned bank. Following India's independence, it was fully nationalized on January 1, 1949, bringing it entirely under the ownership of the Government of India. Additional Info (a) 1935 is the year the RBI was established under the RBI Act, 1934. (b) 1947 is the year of India's independence. (c) Nationalization gave the government control over the central bank's monetary policy decisions. (d) 1955 is the year the Imperial Bank of India was nationalized and renamed the State Bank of India (SBI). Positive Mark: 0.8 Negative Mark: 0"},{"id":"84430","q":"The 2025 Asian Games are scheduled to be hosted in which country?","options":["China","Japan","South Korea","India"],"answer":"1","solution":"The 2025 Asian Winter Games are scheduled to be hosted in Harbin, China Kazakhstan hosted the games in 2011 across Astana and Almaty. Japan hosted the inaugural games in 1986 and frequently uses Sapporo as a venue. South Korea hosted the games in 1999 in Gangwon Province and hosted the 2018 Winter Olympics . Positive Mark: 0.8 Negative Mark: 0"}];
let idx=0, answers={}, timerSec=65*60, timerInt=null;

function render(){
  const q=DATA[idx];
  if(!q){document.getElementById('qText').textContent='No data.';return;}
  document.getElementById('qNum').textContent=idx+1;
  document.getElementById('qTotal').textContent=DATA.length;
  document.getElementById('qText').textContent=q.q;
  document.getElementById('opts').innerHTML=q.options.map((o,i)=>
    `<div class="option ${answers[idx]==(i+1)?'selected':''}" onclick="select(${i+1})">${String.fromCharCode(65+i)}. ${o}</div>`
  ).join('');
}
window.select=o=>{answers[idx]=o; render();};
window.prev=()=>{if(idx>0){idx--; render();}};
window.next=()=>{if(idx<DATA.length-1){idx++; render();}};

function submitTest(){
  clearInterval(timerInt);
  let c=0; for(let i=0;i<DATA.length;i++){if(answers[i]==DATA[i].answer)c++;}
  const pct=Math.round(c/DATA.length*100)||0;
  document.getElementById('qCard').classList.add('hidden');
  document.getElementById('resCard').classList.remove('hidden');
  document.getElementById('score').textContent=pct+'%';
  document.getElementById('detail').innerHTML='<b>'+c+'/'+DATA.length+'</b> correct';
}

function tick(){timerSec--; document.getElementById('timer').textContent=Math.floor(timerSec/60)+':'+String(timerSec%60).padStart(2,'0'); document.getElementById('bar').style.width=(timerSec/(65*60)*100)+'%'; if(timerSec<=0){clearInterval(timerInt); submitTest();}}

render(); timerInt=setInterval(tick,1000);
</script>
</body></html>
