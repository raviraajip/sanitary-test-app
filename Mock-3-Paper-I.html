<script>
const DATA=[{"id":"84306","q":"The G20 Summit for the year 2025 is scheduled to be hosted by which of the following countries?","options":["Brazil","South Africa","USA","Germany"],"answer":"2","solution":"South Africa is scheduled to host the G20 Summit in 2025. This marks a significant moment as it brings the premier forum for international economic cooperation to the African continent. Additional Info (a) Brazil hosted the G20 Summit in 2024. (b) South Africa's presidency focuses on advancing the interests of the Global South and sustainable development. (c) The USA has hosted previous summits (like the inaugural 2008 summit) and will host in 2026. (d) Germany hosted the G20 Summit in Hamburg in 2017. Positive Mark: 0.8 Negative Mark: 0"},{"id":"84307","q":"The medical instrument 'Endoscope', used to examine internal organs, works on the principle of:","options":["Refraction of light","Scattering of light","Total internal reflection","Diffraction of light"],"answer":"3","solution":"An endoscope utilizes optical fibers to transmit light and images. These fibers work on the principle of Total Internal Reflection (TIR), where light rays hitting the inner boundary of the fiber at an angle greater than the critical angle are completely reflected back into the core, allowing light to travel along curved paths. Additional Info (a) Refraction is the bending of light as it passes between mediums of different densities. (b) Scattering is the deviation of light rays in multiple directions by particles (e.g., why the sky is blue). (c) TIR ensures zero loss of light intensity as it travels through the flexible optical fibers. (d) Diffraction is the slight bending of light as it passes around the edge of an object. Positive Mark: 0.8 Negative Mark: 0"},{"id":"84308","q":"Which of the following is Bihar\u2019s first and only recognized Ramsar Site (wetland of international importance)?","options":["Kusheshwar Asthan","Kabartal (Kanwar Jheel)","Baraila Jheel","Nagi Dam"],"answer":"2","solution":"Kabartal (also known as Kanwar Jheel), located in the Begusarai district, was designated as Bihar's first Ramsar site in 2020. It is Asia's largest freshwater oxbow lake and a crucial wintering area for migratory birds. Additional Info (a) Kusheshwar Asthan (Darbhanga) is a significant bird sanctuary but not a Ramsar site. (b) Kabartal plays a vital role in flood buffering and supporting local biodiversity. (c) Baraila Jheel (Salim Ali Jubba Sahni Bird Sanctuary) is in Vaishali district. (d) Nagi Dam (Jamui) is an important bird area famous for the state bird festival 'Kalrav'. Positive Mark: 0.8 Negative Mark: 0"},{"id":"84309","q":"Which Article of the Indian Constitution empowers the President to constitute the Finance Commission every five years?","options":["Article 275","Article 265","Article 280","Article 324"],"answer":"3","solution":"Article 280 of the Indian Constitution mandates the President to constitute a Finance Commission at the expiration of every fifth year or earlier. Its primary role is to recommend the distribution of the net proceeds of taxes between the Union and the States. Additional Info (a) Article 275 deals with grants-in-aid from the Union to certain States. (b) Article 265 states that no tax shall be levied or collected except by authority of law. (c) The Finance Commission is a crucial quasi-judicial body for fiscal federalism. (d) Article 324 deals with the establishment of the Election Commission of India. Positive Mark: 0.8 Negative Mark: 0"},{"id":"84310","q":"In the context of waste management, 'Pyrolysis' is a thermal degradation process that occurs:","options":["In the complete absence of oxygen","In the presence of excess oxygen","Using highly pressurized water","Using aerobic bacteria"],"answer":"1","solution":"Pyrolysis is the thermochemical decomposition of organic material at elevated temperatures strictly in the complete absence of oxygen. This prevents combustion and instead breaks the material down into syngas, bio-oil, and bio-char. Additional Info (a) The absence of oxygen ensures the waste decomposes rather than burns. (b) Thermal degradation in the presence of oxygen is called incineration. (c) Degradation using highly pressurized water at high temperatures is called hydrothermal carbonization. (d) Degradation using aerobic bacteria is called composting. Positive Mark: 0.8 Negative Mark: 0"},{"id":"84311","q":"Which function key is universally used as a shortcut for the \"Save As\" dialog box in Microsoft Windows applications?","options":["F2","F5","F7","F12"],"answer":"4","solution":"In Microsoft Office applications (like Word, Excel, and PowerPoint) and many other Windows programs, pressing the F12 function key instantly opens the \"Save As\" dialog box. Additional Info (a) F2 is typically used to edit the active cell in Excel or rename a selected file in Windows Explorer. (b) F5 is used to refresh a web page or start a slideshow in PowerPoint. (c) F7 is used to open the Spelling and Grammar check tool. (d) F12 is the dedicated, universal \"Save As\" shortcut. Positive Mark: 0.8 Negative Mark: 0"},{"id":"84312","q":"Which blood group is considered the \"Universal Recipient\"?","options":["AB Positive","O Negative","A Positive","B Negative"],"answer":"1","solution":"Individuals with the AB Positive blood type are considered universal recipients because their red blood cells have both A and B antigens, and their plasma lacks both anti-A and anti-B antibodies, as well as Rh antibodies. Therefore, they can receive blood from any ABO or Rh blood type. Additional Info (a) AB Positive patients are safely transfused with any blood type in emergencies. (b) O Negative is the \"Universal Donor\" because it lacks A, B, and Rh antigens. (c) A Positive can receive from A+, A-, O+, and O-. (d) B Negative can receive from B- and O-. Positive Mark: 0.8 Negative Mark: 0"},{"id":"84313","q":"The primary constituent of 'Landfill Gas' generated from the anaerobic decomposition of municipal solid waste is:","options":["Carbon monoxide","Methane","Hydrogen sulfide","Ammonia"],"answer":"2","solution":"Landfill gas is created by the action of microorganisms within a landfill breaking down organic waste anaerobically (without oxygen). It is primarily composed of Methane (roughly 50-60%) and Carbon dioxide (roughly 40-50%). Additional Info (a) Carbon monoxide is a byproduct of incomplete combustion, not biological decomposition. (b) Methane is a highly potent greenhouse gas, but it can be captured and burned for energy. (c) Hydrogen sulfide is present in trace amounts, causing a rotten egg smell. (d) Ammonia is also a trace gas in landfills. Positive Mark: 0.8 Negative Mark: 0"},{"id":"84314","q":"The grand tomb of Sher Shah Suri, a masterpiece of Indo-Islamic architecture, is located in which district of Bihar?","options":["Patna","Munger","Sasaram (Rohtas)","Gaya"],"answer":"3","solution":"The magnificent tomb of Emperor Sher Shah Suri, who defeated the Mughal Empire and founded the Suri Empire, is situated in Sasaram, which is the headquarters of the Rohtas district in Bihar. It is built in the middle of an artificial lake. Additional Info (a) Patna is the capital and historical center of the Magadha empire. (b) Munger is known for its historic fort and gun-manufacturing history. (c) The tomb, designed by Mir Muhammad Aliwal Khan, is known as the second Taj Mahal of India. (d) Gaya is a major pilgrimage center for Hindus and Buddhists. Positive Mark: 0.8 Negative Mark: 0"},{"id":"84315","q":"The SI unit of electrical capacitance is:","options":["Henry","Tesla","Coulomb","Farad"],"answer":"4","solution":"The Farad (F) is the SI derived unit of electrical capacitance, representing the ability of a body to store an electrical charge. It is named after the English physicist Michael Faraday. Additional Info (a) Henry is the SI unit of electrical inductance. (b) Tesla is the SI unit of magnetic flux density. (c) Coulomb is the SI unit of electric charge. (d) One Farad is defined as one coulomb of charge per volt of potential difference. Positive Mark: 0.8 Negative Mark: 0"},{"id":"84316","q":"ISRO's 'Shukrayaan-1' mission, highly anticipated for launch around 2025, is intended to explore which celestial body?","options":["Mars","The Sun","Venus","Jupiter"],"answer":"3","solution":"Shukrayaan-1 is a planned orbiter mission by the Indian Space Research Organisation (ISRO) designed to study the surface and atmosphere of Venus (\"Shukra\" in Sanskrit). Additional Info (a) ISRO's Mars orbiter mission is known as Mangalyaan. (b) ISRO's solar observatory mission is Aditya-L1. (c) Shukrayaan-1 aims to study Venus's toxic, acidic atmosphere and volcanic activity. (d) ISRO currently has no dedicated Jupiter mission planned for the immediate 2025 timeline. Positive Mark: 0.8 Negative Mark: 0"},{"id":"84317","q":"'Giffen Goods' in economics refers to goods for which:","options":["Demand increases as price increases","Demand decreases as price increases","Demand remains constant regardless of price","Demand is directly proportional to consumer income"],"answer":"1","solution":"A Giffen good is a rare economic paradox involving non-luxury, inferior goods. For these specific goods, an increase in price actually causes an increase in demand, contradicting the fundamental law of demand. This happens because the income effect outweighs the substitution effect (e.g., if the price of a staple food like bread rises, poor consumers have no money left for meat, so they buy even more bread). Additional Info (a) Giffen goods represent an upward-sloping demand curve. (b) This describes normal goods and the standard Law of Demand. (c) This describes perfectly inelastic demand (like life-saving insulin). (d) This describes normal and luxury goods, not inferior/Giffen goods. Positive Mark: 0.8 Negative Mark: 0"},{"id":"84318","q":"Under the biomedical waste management guidelines, expired or discarded medicines should be disposed of in which colored bin?","options":["Red","Yellow","Blue","White (translucent)"],"answer":"2","solution":"According to the Bio-Medical Waste Management Rules, expired or discarded medicines, pharmaceutical waste, and cytotoxic drugs must be disposed of in Yellow colored non-chlorinated plastic bags or containers for incineration or deep burial. Additional Info (a) Red bins are for contaminated recyclable plastics (IV tubes, syringes without needles). (b) Yellow bins handle highly toxic, infectious, and pharmaceutical wastes. (c) Blue bins are for broken glassware and metallic body implants. (d) White translucent containers are strictly for sharps (needles, scalpels). Positive Mark: 0.8 Negative Mark: 0"},{"id":"84319","q":"Who was the founder of the 'Haryanka Dynasty' of the Magadha Empire?","options":["Ajatashatru","Udayin","Bimbisara","Shishunaga"],"answer":"3","solution":"Bimbisara is credited as the founder of the Haryanka dynasty (c. 544 BCE). He was a contemporary of Gautama Buddha and Lord Mahavira and laid the foundations for the expansion of the Magadha Empire. Additional Info (a) Ajatashatru was the son of Bimbisara, who imprisoned and killed his father to take the throne. (b) Udayin was Ajatashatru's son, known for shifting the capital to Pataliputra. (c) Bimbisara expanded Magadha through military conquests (like Anga) and matrimonial alliances. (d) Shishunaga overthrew the last Haryanka ruler to found the Shishunaga dynasty. Positive Mark: 0.8 Negative Mark: 0"},{"id":"84320","q":"The protocol 'SMTP' in computer networking is primarily used for:","options":["Transferring files","Browsing web pages","Sending emails","Resolving domain names"],"answer":"3","solution":"SMTP stands for Simple Mail Transfer Protocol. It is the standard internet protocol used for the transmission (sending) of electronic mail across IP networks. Additional Info (a) File transfer relies on FTP (File Transfer Protocol). (b) Browsing web pages relies on HTTP or HTTPS. (c) While SMTP is used to send emails, IMAP or POP3 are used to receive them. (d) Resolving domain names to IP addresses is handled by DNS (Domain Name System). Positive Mark: 0.8 Negative Mark: 0"},{"id":"84321","q":"Which of the following states does NOT share its border with Bihar?","options":["Uttar Pradesh","Jharkhand","West Bengal","Chhattisgarh"],"answer":"4","solution":"Bihar is landlocked and shares its borders with three Indian states and one international country. It is bordered by Uttar Pradesh to the west, West Bengal to the east, and Jharkhand to the south. It does not share a border with Chhattisgarh. Additional Info (a) UP borders districts like Saran, Buxar, and Kaimur. (b) Jharkhand was carved out of southern Bihar in the year 2000. (c) West Bengal borders districts like Kishanganj and Katihar. (d) Chhattisgarh borders Jharkhand, UP, and MP, but not Bihar. Positive Mark: 0.8 Negative Mark: 0"},{"id":"84322","q":"The chemical name of 'Baking Soda' is:","options":["Sodium carbonate","Sodium bicarbonate","Sodium hydroxide","Calcium carbonate"],"answer":"2","solution":"Baking soda is the common name for Sodium bicarbonate (NaHCO3). It is a mild base widely used in baking as a leavening agent because it releases carbon dioxide gas when reacting with an acid. Additional Info (a) Sodium carbonate (Na2CO3) is known as washing soda. (b) Sodium bicarbonate is also used in antacids to neutralize stomach acid. (c) Sodium hydroxide (NaOH) is a strong base known as caustic soda or lye. (d) Calcium carbonate (CaCO3) is the primary component of limestone, chalk, and marble. Positive Mark: 0.8 Negative Mark: 0"},{"id":"84323","q":"The 97th Academy Awards (Oscars) held in early 2025 continued the tradition of honoring global cinema. Which entity organizes the Oscars?","options":["Hollywood Foreign Press Association","Screen Actors Guild","Academy of Motion Picture Arts and Sciences","British Academy of Film and Television Arts"],"answer":"3","solution":"The Academy Awards, universally known as the Oscars, are organized and overseen annually by the Academy of Motion Picture Arts and Sciences (AMPAS) to recognize artistic and technical merit in the film industry. Additional Info (a) The Hollywood Foreign Press Association (HFPA) historically organized the Golden Globe Awards. (b) The Screen Actors Guild organizes the SAG Awards. (c) AMPAS consists of over 10,000 motion picture professionals. (d) BAFTA organizes the premier British film awards. Positive Mark: 0.8 Negative Mark: 0"},{"id":"84324","q":"The fundamental right against \"Untouchability\" is guaranteed under which Article of the Indian Constitution?","options":["Article 14","Article 15","Article 16","Article 17"],"answer":"4","solution":"Article 17 of the Indian Constitution explicitly abolishes \"untouchability\" and forbids its practice in any form. The enforcement of any disability arising out of untouchability is a punishable offense in accordance with the law. Additional Info (a) Article 14 guarantees equality before the law. (b) Article 15 prohibits discrimination on grounds of religion, race, caste, sex, or place of birth. (c) Article 16 provides for equality of opportunity in matters of public employment. (d) The Protection of Civil Rights Act, 1955 was enacted to enforce Article 17. Positive Mark: 0.8 Negative Mark: 0"},{"id":"84325","q":"Which layer of the Earth's atmosphere reflects radio waves back to the Earth, enabling long-distance communication?","options":["Troposphere","Stratosphere","Ionosphere (Thermosphere)","Exosphere"],"answer":"3","solution":"The Ionosphere, a highly active region of the atmosphere that overlaps with the thermosphere, contains a high concentration of ions and free electrons. These charged particles reflect High Frequency (HF) radio waves back to Earth, facilitating \"skip\" or over-the-horizon communication. Additional Info (a) The Troposphere is the lowest layer where all weather occurs. (b) The Stratosphere contains the protective ozone layer. (c) The Ionosphere's reflectivity changes with solar radiation (day/night cycles). (d) The Exosphere is the outermost boundary fading into space. Positive Mark: 0.8 Negative Mark: 0"},{"id":"84326","q":"Which is the highest mountain peak situated entirely within India?","options":["K2 (Godwin Austen)","Kangchenjunga","Nanda Devi","Kamet"],"answer":"3","solution":"Nanda Devi (7,816 meters) is the highest mountain peak situated entirely within the undisputed borders of India (in Uttarakhand). Additional Info (a) K2 is higher but is located in Pakistan-Occupied Kashmir (POK). (b) Kangchenjunga is the highest peak in India, but it sits on the border shared with Nepal. (c) Nanda Devi is a UNESCO World Heritage site and entirely within Indian territory. (d) Kamet is the second highest peak in the Garhwal region of Uttarakhand, after Nanda Devi. Positive Mark: 0.8 Negative Mark: 0"},{"id":"84327","q":"In a computer, the term 'ALU' stands for:","options":["Automatic Logic Unit","Arithmetic Logic Unit","Array Logic Unit","Application Logic Unit"],"answer":"2","solution":"ALU stands for Arithmetic Logic Unit. It is a critical component of the central processing unit (CPU) responsible for carrying out all arithmetic operations (addition, subtraction) and logical operations (AND, OR, NOT). Additional Info (a) Automatic Logic Unit is a fabricated distractor. (b) The ALU receives instructions and data from the CPU's registers. (c) Array Logic Unit is incorrect. (d) Application Logic Unit is incorrect. Positive Mark: 0.8 Negative Mark: 0"},{"id":"84328","q":"What is the minimum age prescribed by the Constitution to become the Governor of an Indian State?","options":["25 years","30 years","35 years","40 years"],"answer":"3","solution":"According to Article 157 of the Indian Constitution, no person shall be eligible for appointment as Governor unless they are a citizen of India and have completed the age of 35 years. Additional Info (a) 25 years is the minimum age for a Member of Legislative Assembly (MLA) or Lok Sabha. (b) 30 years is the minimum age for a Member of Legislative Council (MLC) or Rajya Sabha. (c) 35 years is also the minimum age required to become the President of India. (d) 40 years is not a constitutional age requirement. Positive Mark: 0.8 Negative Mark: 0"},{"id":"84329","q":"The 'Tenth Schedule' of the Constitution, which deals with the anti-defection law, was added by which amendment?","options":["42nd Amendment","44th Amendment","52nd Amendment","73rd Amendment"],"answer":"3","solution":"The 52nd Constitutional Amendment Act of 1985 added the Tenth Schedule to the Constitution. It lays down the process by which legislators may be disqualified on grounds of defection, aiming to curb political instability. Additional Info (a) 42nd Amendment (1976) made sweeping changes during the Emergency. (b) 44th Amendment (1978) restored civil liberties post-Emergency. (c) The anti-defection law was later strengthened by the 91st Amendment in 2003. (d) 73rd Amendment (1992) granted constitutional status to Panchayati Raj institutions. Positive Mark: 0.8 Negative Mark: 0"},{"id":"84330","q":"Which of the following is a water-soluble vitamin?","options":["Vitamin A","Vitamin D","Vitamin E","Vitamin C"],"answer":"4","solution":"Vitamins are classified into two groups: fat-soluble and water-soluble. Vitamin C (ascorbic acid) and all B-complex vitamins are water-soluble, meaning they dissolve in water, are not stored in the body, and must be replenished daily. Additional Info (a) Vitamin A is fat-soluble and stored in the liver. (b) Vitamin D is fat-soluble. (c) Vitamin E is fat-soluble. (d) Because Vitamin C is water-soluble, excess amounts are simply excreted in urine, making toxicity rare. Positive Mark: 0.8 Negative Mark: 0"},{"id":"84331","q":"The disease 'Goitre' is caused by the deficiency of:","options":["Iron","Calcium","Iodine","Potassium"],"answer":"3","solution":"Goitre is an abnormal enlargement of the thyroid gland, most commonly caused by a lack of dietary iodine. The thyroid needs iodine to produce its hormones (thyroxine), and without it, the gland swells in an attempt to capture more iodine from the blood. Additional Info (a) Iron deficiency primarily causes anemia (reduced healthy red blood cells). (b) Calcium deficiency can lead to osteoporosis and bone weakening. (c) Iodine deficiency is easily prevented by consuming iodized salt. (d) Potassium deficiency (hypokalemia) causes muscle cramps and irregular heartbeats. Positive Mark: 0.8 Negative Mark: 0"},{"id":"84332","q":"Which sector contributes the most to the Gross Domestic Product (GDP) of India?","options":["Primary Sector (Agriculture)","Secondary Sector (Manufacturing)","Tertiary Sector (Services)","Quaternary Sector"],"answer":"3","solution":"The Tertiary (Services) sector is the largest contributor to India's GDP, accounting for over 50% of the total Gross Value Added (GVA). This includes IT, telecommunications, finance, tourism, and retail. Additional Info (a) The Primary sector employs the largest percentage of the workforce but contributes the least to GDP (around 18%). (b) The Secondary sector contributes roughly 28% to the GDP. (c) The Tertiary sector has been the primary engine of India's economic growth since the 1990s. (d) The Quaternary sector (knowledge, research, and development) is technically a specialized sub-category of the services sector. Positive Mark: 0.8 Negative Mark: 0"},{"id":"84333","q":"The 'Swachh Bharat Mission (Urban) 2.0' places a heavy emphasis on achieving which specific status for all statutory towns?","options":["Zero Carbon status","Garbage Free status","Plastic Free status","Slum Free status"],"answer":"2","solution":"SBM-U 2.0, launched with a vision to make cities sustainable, places a primary emphasis on making all statutory towns \"Garbage Free\" and ensuring water security in all Urban Local Bodies. Additional Info (a) Zero Carbon is a broader climate goal under the UNFCCC framework. (b) Garbage Free status involves complete source segregation and scientific processing of municipal solid waste. (c) Reducing single-use plastics is a component, but \"Garbage Free\" is the overarching title goal. (d) Slum Free status was the target of the Rajiv Awas Yojana and PM Awas Yojana. Positive Mark: 0.8 Negative Mark: 0"},{"id":"84334","q":"The 'Brahmos' is a supersonic cruise missile jointly developed by India and:","options":["France","USA","Israel","Russia"],"answer":"4","solution":"The BrahMos is a medium-range ramjet supersonic cruise missile that can be launched from submarines, ships, airplanes, or land. It is a joint venture between the Russian Federation's NPO Mashinostroyeniya and India's Defence Research and Development Organisation (DRDO). Additional Info (a) France is a major defense partner (e.g., Rafale jets, Scorpene submarines) but not for BrahMos. (b) USA provides platforms like Apache and Chinook helicopters. (c) Israel co-developed the Barak-8 surface-to-air missile with India. (d) The name BrahMos is a portmanteau of India's Brahmaputra River and Russia's Moskva River. Positive Mark: 0.8 Negative Mark: 0"},{"id":"84335","q":"Veer Kunwar Singh, a prominent leader of the 1857 revolt, belonged to which region of Bihar?","options":["Patna","Jagdishpur (Bhojpur)","Darbhanga","Muzaffarpur"],"answer":"2","solution":"Babu Veer Kunwar Singh belonged to the royal Rajput house of Jagdishpur, currently a part of the Bhojpur district in Bihar. At the age of 80, he led a brilliant and fierce armed rebellion against the British East India Company forces during the 1857 uprising. Additional Info (a) Patna was a major center where leaders like Pir Ali led the revolt. (b) Kunwar Singh's guerrilla warfare tactics severely frustrated British commanders. (c) Darbhanga was a separate royal estate during the period. (d) Muzaffarpur was an administrative center but Jagdishpur was Kunwar Singh's stronghold. Positive Mark: 0.8 Negative Mark: 0"},{"id":"84336","q":"The process of converting atmospheric nitrogen into ammonia or related nitrogenous compounds in soil is called:","options":["Denitrification","Nitrogen fixation","Ammonification","Eutrophication"],"answer":"2","solution":"Nitrogen fixation is the essential biological or chemical process where relatively inert atmospheric nitrogen gas (N 2 ) is converted into biologically useful forms, like ammonia (NH 3 ), primarily by symbiotic bacteria (like Rhizobium) in the root nodules of leguminous plants. Additional Info (a) Denitrification is the opposite process, where nitrates are reduced back to nitrogen gas by soil bacteria. (b) This process is crucial because plants cannot utilize nitrogen directly from the air. (c) Ammonification is the conversion of organic nitrogen (from dead organisms) into ammonia. (d) Eutrophication is the over-enrichment of water bodies with nutrients. Positive Mark: 0.8 Negative Mark: 0"},{"id":"84337","q":"In Microsoft Excel, the intersection of a row and a column is called a:","options":["Box","Block","Cell","Grid"],"answer":"3","solution":"In spreadsheet applications like Microsoft Excel, the intersection of a vertical column and a horizontal row creates an individual, rectangular container for data known as a cell (e.g., Cell A1). Additional Info (a) \"Box\" is a generic term, not the technical software terminology. (b) A \"Block\" usually refers to a selected group of data, though \"range\" is the proper Excel term. (c) Each cell has a unique address indicating its row and column coordinates. (d) The \"Grid\" refers to the entire layout of lines dividing the worksheet. Positive Mark: 0.8 Negative Mark: 0"},{"id":"84338","q":"Which classical dance form is indigenous to the state of Kerala?","options":["Bharatanatyam","Kathakali","Kuchipudi","Odissi"],"answer":"2","solution":"Kathakali is a major form of classical Indian dance native to Kerala. It is a \"story play\" genre of art, renowned for its elaborately colorful make-up, costumes, and face masks worn by traditionally male actor-dancers. Additional Info (a) Bharatanatyam is the classical dance form of Tamil Nadu. (b) Mohiniyattam is another classical dance form that also originates from Kerala. (c) Kuchipudi is the classical dance form of Andhra Pradesh. (d) Odissi is the classical dance form of Odisha. Positive Mark: 0.8 Negative Mark: 0"},{"id":"84339","q":"The \"Kisan Credit Card\" (KCC) scheme was introduced on the recommendations of which committee?","options":["R.V. Gupta Committee","Narasimham Committee","Kelkar Committee","Shivaraman Committee"],"answer":"1","solution":"The Kisan Credit Card (KCC) scheme was introduced in 1998 by the Government of India based on the recommendations of the R.V. Gupta Committee to provide adequate and timely credit to farmers for their agricultural operations. Additional Info (a) The scheme was prepared by NABARD (National Bank for Agriculture and Rural Development). (b) The Narasimham Committee is famous for its recommendations on Banking Sector Reforms. (c) The Kelkar Committee is known for Tax Reforms (and later PPP models). (d) The B. Shivaraman Committee recommended the establishment of NABARD itself. Positive Mark: 0.8 Negative Mark: 0"},{"id":"84340","q":"The concept of 'Carbon Footprint' measures the total emissions of which primary gas caused by an individual, event, or organization?","options":["Sulfur dioxide","Carbon monoxide","Carbon dioxide","Chlorofluorocarbons"],"answer":"3","solution":"A carbon footprint is the total amount of greenhouse gases (including methane and nitrous oxide, but primarily calculated and expressed as carbon dioxide equivalent) that are generated by human actions. Additional Info (a) Sulfur dioxide is the primary cause of acid rain, not global warming. (b) Carbon monoxide is a toxic local air pollutant. (c) Carbon dioxide is the most significant long-lived greenhouse gas in Earth's atmosphere. (d) CFCs deplete the ozone layer and are potent greenhouse gases, but standard footprints emphasize CO 2 . Positive Mark: 0.8 Negative Mark: 0"},{"id":"84341","q":"Who presides over the Lok Sabha in the absence of both the Speaker and the Deputy Speaker?","options":["The Prime Minister","The Vice-President","A member of the panel of Chairpersons of the Lok Sabha","The senior-most member of the Lok Sabha"],"answer":"3","solution":"According to the Rules of Procedure and Conduct of Business in the Lok Sabha, the Speaker nominates a Panel of Chairpersons. In the absence of both the Speaker and Deputy Speaker, any member from this panel can preside over the House. Additional Info (a) The Prime Minister is the leader of the ruling party and the executive, not a presiding officer. (b) The Vice-President is the ex-officio Chairman of the Rajya Sabha, not the Lok Sabha. (c) If no member of the panel is present, the House decides who will preside. (d) The senior-most member is usually appointed as the Pro-tem Speaker to administer oaths to new members, not to routinely preside in the Speaker's absence. Positive Mark: 0.8 Negative Mark: 0"},{"id":"84342","q":"The headquarters of the International Solar Alliance (ISA) is located in:","options":["Geneva","Paris","Gurugram","New Delhi"],"answer":"3","solution":"The International Solar Alliance (ISA) is a treaty-based intergovernmental organization launched jointly by India and France. Its headquarters and Interim Secretariat are located at the National Institute of Solar Energy (NISE) campus in Gurugram, Haryana, India. Additional Info (a) Geneva hosts the UN, WHO, and WTO headquarters. (b) The ISA was officially launched in Paris during COP21 in 2015. (c) The ISA aims to mobilize investments for massive deployment of solar energy. (d) New Delhi is the political capital, but the specific ISA campus is in neighboring Gurugram. Positive Mark: 0.8 Negative Mark: 0"},{"id":"84343","q":"Which acid is known as the \"King of Chemicals\" due to its extensive use in industries?","options":["Hydrochloric acid","Nitric acid","Sulfuric acid","Acetic acid"],"answer":"3","solution":"Sulfuric acid (H2SO4) is called the \"King of Chemicals\" because it is manufactured in the largest quantities globally and is fundamental to producing a vast array of goods, particularly fertilizers (like superphosphate), batteries, and in oil refining. Additional Info (a) Hydrochloric acid is used for cleaning steel and in the PVC industry. (b) Nitric acid is used in the manufacture of explosives and fertilizers. (c) The industrial consumption of sulfuric acid is often used as an indicator of a country's industrial strength. (d) Acetic acid is the main component of vinegar. Positive Mark: 0.8 Negative Mark: 0"},{"id":"84344","q":"The \"Roaring Forties\" refer to:","options":["High-speed trains in Europe","Strong westerly winds found in the Southern Hemisphere","Ocean currents in the North Atlantic","Active volcanoes in the Pacific Ring of Fire"],"answer":"2","solution":"The \"Roaring Forties\" are strong, persistent westerly winds found in the Southern Hemisphere, generally between the latitudes of 40 and 50 degrees. They are powerful because there are very few landmasses in the Southern Ocean to act as windbreaks. Additional Info (a) Completely unrelated to meteorology or geography. (b) Sailors coined the term during the Age of Sail; similar winds further south are the Furious Fifties and Shrieking Sixties. (c) North Atlantic currents include the Gulf Stream. (d) Pacific volcanoes are related to tectonic subduction zones. Positive Mark: 0.8 Negative Mark: 0"},{"id":"84345","q":"The Indian Standard Time (IST) is ahead of Greenwich Mean Time (GMT) by:","options":["4 hours 30 minutes","5 hours","5 hours 30 minutes","6 hours"],"answer":"3","solution":"Indian Standard Time (IST) is calculated based on the 82.5\u00b0 E longitude, which passes through Mirzapur, Uttar Pradesh. Since the Earth rotates 15 degrees every hour, 82.5 degrees equates to exactly 5 hours and 30 minutes ahead of the Prime Meridian (GMT/UTC). Additional Info (a) Afghanistan is GMT +4:30. (b) Pakistan Standard Time is GMT +5:00. (c) India maintains a single time zone despite its wide geographical span. (d) Bangladesh Standard Time is GMT +6:00. Positive Mark: 0.8 Negative Mark: 0"},{"id":"84346","q":"Which of the following is NOT an operating system?","options":["Linux","macOS","Windows","Oracle"],"answer":"4","solution":"Oracle is a multinational computer technology corporation primarily known for its flagship product, the Oracle Database, which is a Relational Database Management System (RDBMS), not an operating system. Additional Info (a) Linux is an open-source operating system kernel. (b) macOS is the proprietary operating system for Apple's Mac computers. (c) Windows is the dominant operating system for personal computers worldwide. (d) While Oracle owns Solaris (an OS), \"Oracle\" itself refers to the company and its database software. Positive Mark: 0.8 Negative Mark: 0"},{"id":"84347","q":"The 2025 Quad Leaders' Summit is planned to be hosted by which member nation?","options":["India","USA","Japan","Australia"],"answer":"1","solution":"India is scheduled to host the Quad Leaders' Summit in 2025. Originally slated to host in 2024, India and the United States agreed to swap hosting years, allowing the US to host in 2024 (in Delaware) and India to host in 2025. Additional Info (a) The Quad is a strategic security dialogue between Australia, India, Japan, and the US. (b) The USA hosted the summit in 2024. (c) Japan hosted the Quad summit in 2023 in Hiroshima. (d) Australia hosted the Quad summit virtually and later aligned with other meetings. Positive Mark: 0.8 Negative Mark: 0"},{"id":"84348","q":"The phenomenon of 'Eutrophication' in lakes is primarily driven by the excessive runoff of:","options":["Heavy metals","Nitrates and Phosphates","Chlorinated pesticides","Plastics"],"answer":"2","solution":"Eutrophication occurs when a body of water becomes overly enriched with minerals and nutrients, primarily nitrates and phosphates from agricultural fertilizer runoff and sewage. This induces excessive growth of algae (algal blooms) that depletes oxygen in the water. Additional Info (a) Heavy metals cause toxic accumulation and poisoning, not algal blooms. (b) When the algae die, decomposing bacteria consume the remaining dissolved oxygen, killing fish. (c) Pesticides cause biomagnification in the food chain. (d) Plastics cause physical blockages and microplastic pollution. Positive Mark: 0.8 Negative Mark: 0"},{"id":"84349","q":"Which of the following was the capital of the Vajji Mahajanapada in ancient India?","options":["Rajgir","Vaishali","Champa","Pataliputra"],"answer":"2","solution":"Vaishali was the capital of the Vajji (or Vriji) Mahajanapada, which was a confederacy of several clans, the most prominent being the Licchavis. It is historically renowned as one of the world's earliest republics. Additional Info (a) Rajgir (Rajagriha) was the early capital of the Magadha Mahajanapada. (b) Vaishali holds immense importance in both Buddhism and Jainism (birthplace of Lord Mahavira). (c) Champa was the capital of the Anga Mahajanapada. (d) Pataliputra became the later, grand capital of the Magadha Empire. Positive Mark: 0.8 Negative Mark: 0"},{"id":"84350","q":"A 'Panchayat Samiti' at the block level in the Panchayati Raj system is a:","options":["Judicial body","Legislative body","Administrative authority","Advisory body"],"answer":"3","solution":"The Panchayat Samiti acts as an administrative authority (executive body) at the block or tehsil level. It serves as the crucial middle tier of the Panchayati Raj Institutions, linking the Gram Panchayat (village level) with the Zila Parishad (district level). Additional Info (a) The Nyaya Panchayat handles minor judicial and dispute resolution matters at the village level. (b) State Assemblies are legislative bodies; Panchayats execute state-directed development plans. (c) It implements community development programs and manages block-level agricultural and health schemes. (d) The Zila Parishad functions mostly as an advisory, supervisory, and coordinating body for the Panchayat Samitis. Positive Mark: 0.8 Negative Mark: 0"},{"id":"84351","q":"The chemical formula of Plaster of Paris is:","options":["CaSO 4 \u00b7 2H 2 O","CaSO 4 \u00b7 \u00bdH 2 O","CaCO 3","CaO"],"answer":"2","solution":"Plaster of Paris is chemically known as Calcium sulfate hemihydrate, represented by the formula CaSO 4 \u00b7 \u00bdH2O. It is prepared by heating gypsum to about 150\u00b0C, causing it to lose water molecules. Additional Info (a) CaSO 4 \u00b7 2H 2 O is the chemical formula for Gypsum. (b) Plaster of Paris gets its name because it was first made from gypsum mined near Paris. It is used for casts and sculptures. (c) CaCO 3 is Calcium carbonate (limestone/chalk). (d) CaO is Calcium oxide (quicklime). Positive Mark: 0.8 Negative Mark: 0"},{"id":"84352","q":"Which type of mirror is used in the headlights of vehicles to get a powerful parallel beam of light?","options":["Plane mirror","Convex mirror","Concave mirror","Cylindrical mirror"],"answer":"3","solution":"Concave mirrors are used as reflectors in vehicle headlights. When the light bulb is placed at the principal focus of the concave mirror, the light rays, after reflection, travel as a highly directed, powerful parallel beam, allowing the driver to see far down the road. Additional Info (a) Plane mirrors reflect a virtual image of the same size and are used in dressing tables. (b) Convex mirrors are used as rear-view mirrors because they provide a wider field of view and always form an erect image. (c) Concave mirrors converge light. (d) Cylindrical mirrors are used in solar power concentrators. Positive Mark: 0.8 Negative Mark: 0"},{"id":"84353","q":"What is 'Phishing' in the context of computer security?","options":["Searching the dark web for sensitive data","Attempting to acquire sensitive information by masquerading as a trustworthy entity","Sending bulk unsolicited emails","Infecting a computer via a USB drive"],"answer":"2","solution":"Phishing is a form of social engineering cyberattack where the attacker sends fraudulent communications (usually emails or text messages) that appear to come from a reputable source (like a bank or IT department) to trick victims into revealing sensitive data, such as passwords or credit card numbers. Additional Info (a) Dark web searches are post-breach intelligence gathering, not the attack itself. (b) Spear-phishing is a highly targeted version of this attack. (c) Sending bulk unsolicited emails is simply called \"Spam.\" (d) Infecting via USB is a hardware-based malware delivery method. Positive Mark: 0.8 Negative Mark: 0"},{"id":"84354","q":"\"Repo Rate\" is defined as the rate at which:","options":["Banks lend to the public","RBI lends short-term money to commercial banks","Banks keep their surplus funds with the RBI","Government borrows from the RBI"],"answer":"2","solution":"The Repo (Repurchase Option) Rate is the key policy interest rate at which the Reserve Bank of India (RBI) lends short-term money to commercial banks against government securities, providing them with liquidity to meet shortfalls. Additional Info (a) The rate at which banks lend to the public is determined by their MCLR or external benchmarks. (b) Lowering the repo rate makes borrowing cheaper, stimulating economic growth. (c) The rate at which banks park surplus funds with the RBI is the Reverse Repo Rate. (d) Government borrowing is managed through the issuance of Treasury Bills and G-Secs. Positive Mark: 0.8 Negative Mark: 0"},{"id":"84355","q":"The 'Sone River', a major southern tributary of the Ganga in Bihar, originates from:","options":["The Himalayas","The Amarkantak Plateau","The Chota Nagpur Plateau","The Aravalli Hills"],"answer":"2","solution":"The Sone River originates near Amarkantak in the Anuppur district of Madhya Pradesh (the same plateau where the Narmada River originates). It flows north-eastwards through Uttar Pradesh and Jharkhand before merging with the Ganga near Patna, Bihar. Additional Info (a) Northern tributaries like the Kosi and Gandak originate in the Himalayas. (b) The Sone is famous for its vast sandy beds and the historic Koilwar Bridge. (c) The Damodar River originates in the Chota Nagpur Plateau. (d) The Luni River originates in the Aravalli range in Rajasthan. Positive Mark: 0.8 Negative Mark: 0"},{"id":"84356","q":"What does the ozone layer in the stratosphere protect the Earth from?","options":["Infrared radiation","Ultraviolet (UV) radiation","X-rays","Gamma rays"],"answer":"2","solution":"The ozone layer acts as a vital invisible shield in the stratosphere, absorbing the majority of the Sun's harmful Ultraviolet (UV) radiation, particularly UV-B and UV-C rays, which can cause skin cancer and ecological damage. Additional Info (a) Infrared radiation is felt as heat and is primarily trapped by greenhouse gases, not the ozone layer. (b) UV radiation causes sunburns and DNA damage; ozone absorbs about 98% of it. (c) X-rays from the sun are absorbed much higher up in the thermosphere and ionosphere. (d) Gamma rays are the highest energy waves, also absorbed in the uppermost layers of the atmosphere. Positive Mark: 0.8 Negative Mark: 0"},{"id":"84357","q":"Which part of the human brain controls body temperature and the urge for eating and drinking?","options":["Cerebrum","Cerebellum","Hypothalamus","Medulla oblongata"],"answer":"3","solution":"The hypothalamus is a small but crucial region at the base of the brain. It plays a major role in maintaining homeostasis by regulating autonomic functions like body temperature, hunger, thirst, and sleep-wake cycles. Additional Info (a) The cerebrum is responsible for voluntary actions, thought, memory, and conscious perception. (b) The cerebellum controls motor coordination, balance, and posture. (c) The hypothalamus acts as the body's internal thermostat and biological clock. (d) The medulla oblongata controls involuntary vital functions like heartbeat and breathing. Positive Mark: 0.8 Negative Mark: 0"},{"id":"84358","q":"In India, the concept of 'Single Citizenship' is adopted from the Constitution of:","options":["USA","UK (Britain)","Canada","Australia"],"answer":"2","solution":"The framers of the Indian Constitution adopted the principle of 'Single Citizenship' from the British Constitution (UK) to promote unity and integration among the diverse populations of the country. Additional Info (a) The USA operates on a system of dual citizenship (national citizenship and state citizenship). (b) Single citizenship ensures that all Indians, irrespective of the state they reside in, enjoy the same political and civil rights. (c) Canada features a strong federal center, which inspired India's federal structure, but not single citizenship. (d) Australia's constitution inspired the Concurrent List and joint sittings. Positive Mark: 0.8 Negative Mark: 0"},{"id":"84359","q":"Which Indian state launched the 'Kanya Utthan Yojana' to empower girls through education and financial assistance?","options":["Uttar Pradesh","Madhya Pradesh","Bihar","Rajasthan"],"answer":"3","solution":"The Mukhyamantri Kanya Utthan Yojana was launched by the Government of Bihar. It is a flagship scheme designed to empower girls, prevent female infanticide, encourage female education, and provide financial assistance from birth until graduation. Additional Info (a) Uttar Pradesh has schemes like the Kanya Sumangala Yojana. (b) Madhya Pradesh is known for the Ladli Laxmi Yojana. (c) Bihar's Kanya Utthan Yojana provides phased financial payouts conditional on vaccination and educational milestones. (d) Rajasthan has the Rajshree Yojana. Positive Mark: 0.8 Negative Mark: 0"},{"id":"84360","q":"Which is the largest gland in the human body?","options":["Pancreas","Liver","Thyroid","Pituitary"],"answer":"2","solution":"The liver is the largest internal solid organ and the largest gland in the human body. It secretes bile and performs hundreds of vital metabolic functions, including detoxification and protein synthesis. Additional Info (a) The pancreas is an important mixed gland (both endocrine and exocrine), but much smaller than the liver. (b) An adult human liver weighs approximately 1.2 to 1.5 kilograms. (c) The thyroid is the largest purely endocrine gland, located in the neck. (d) The pituitary is a pea-sized master gland located at the base of the brain. Positive Mark: 0.8 Negative Mark: 0"},{"id":"84361","q":"The standard port used for HTTP (Hypertext Transfer Protocol) traffic is:","options":["Port 21","Port 25","Port 80","Port 443"],"answer":"3","solution":"Port 80 is the default network port used for sending and receiving unencrypted web pages via Hypertext Transfer Protocol (HTTP) across the World Wide Web. Additional Info (a) Port 21 is typically used for FTP (File Transfer Protocol). (b) Port 25 is used for SMTP (Simple Mail Transfer Protocol) to send emails. (c) When you type http:// in a browser, it defaults to Port 80. (d) Port 443 is used for HTTPS (Hypertext Transfer Protocol Secure), which provides encrypted communication. Positive Mark: 0.8 Negative Mark: 0"},{"id":"84362","q":"In 2025, the 'Pravasi Bharatiya Divas' (PBD) is celebrated to commemorate the return of Mahatma Gandhi from South Africa in which year?","options":["1915","1917","1920","1922"],"answer":"1","solution":"Pravasi Bharatiya Divas is celebrated every year on January 9th to mark the contribution of the overseas Indian community. This specific date was chosen because it commemorates the day Mahatma Gandhi returned to India from South Africa in 1915. Additional Info (a) Gandhi returned to Bombay on January 9, 1915, and began his journey leading India's freedom struggle. (b) 1917 marks the year of the Champaran Satyagraha. (c) 1920 marks the beginning of the Non-Cooperation Movement. (d) 1922 marks the Chauri Chaura incident. Positive Mark: 0.8 Negative Mark: 0"},{"id":"84363","q":"The fundamental unit of heredity is:","options":["Chromosome","DNA","Gene","Nucleus"],"answer":"3","solution":"A gene is the basic physical and functional unit of heredity. Genes, which are made up of specific sequences of DNA, contain the instructions needed to make proteins and pass traits from parents to offspring. Additional Info (a) A chromosome is a larger, thread-like structure that contains tightly packed DNA molecules. (b) DNA (Deoxyribonucleic acid) is the molecule that carries the genetic instructions, but the specific coding section is the gene. (c) Genes act as instructions to make molecules called proteins. (d) The nucleus is the cellular organelle that houses the chromosomes. Positive Mark: 0.8 Negative Mark: 0"},{"id":"84364","q":"Which of the following gases is primarily used in electric bulbs to retard the evaporation of the filament?","options":["Oxygen","Argon","Hydrogen","Carbon dioxide"],"answer":"2","solution":"Argon, often mixed with a small amount of nitrogen, is used inside traditional incandescent light bulbs. It is an inert, noble gas that does not react with the glowing tungsten filament, thereby retarding its evaporation and extending the life of the bulb. Additional Info (a) Oxygen would cause the hot tungsten filament to oxidize and burn out instantly. (b) Argon's inert nature prevents combustion inside the glass envelope. (c) Hydrogen is highly flammable and unsuitable for incandescent bulbs. (d) Carbon dioxide is not used because the extreme heat could cause it to break down and interact with the filament. Positive Mark: 0.8 Negative Mark: 0"},{"id":"84365","q":"In the context of the Indian economy, 'Stagflation' refers to a situation characterized by:","options":["High inflation and high growth","Low inflation and low unemployment","High inflation and high unemployment","Deflation and rapid industrialization"],"answer":"3","solution":"Stagflation is a portmanteau of \"stagnation\" and \"inflation.\" It is a challenging economic condition where high inflation rates occur simultaneously with a stagnant economy (low growth) and high unemployment. Additional Info (a) High inflation and high growth is typical of a standard economic boom. (b) Low inflation and low unemployment is considered a \"Goldilocks economy.\" (c) Stagflation is notoriously difficult for central banks to manage, as fixing one issue often worsens the other. (d) Deflation is a general decline in prices, which often accompanies a recession, not rapid industrialization. Positive Mark: 0.8 Negative Mark: 0"},{"id":"84366","q":"The World Environment Day is celebrated annually on:","options":["March 22","April 22","June 5","September 16"],"answer":"3","solution":"World Environment Day is celebrated globally on June 5th every year. It is the United Nations' principal vehicle for encouraging awareness and action for the protection of our environment. Additional Info (a) March 22 is World Water Day. (b) April 22 is Earth Day. (c) June 5 was established by the UN General Assembly in 1972 on the first day of the Stockholm Conference. (d) September 16 is the International Day for the Preservation of the Ozone Layer. Positive Mark: 0.8 Negative Mark: 0"},{"id":"84367","q":"The famous 'Golghar' in Patna was originally constructed for what purpose?","options":["As a tomb for a British general","As an armory for the British army","As a granary to prevent famines","As a celestial observatory"],"answer":"3","solution":"The Golghar is a massive, beehive-shaped structure in Patna built by Captain John Garstin in 1786. It was commissioned by Warren Hastings as a massive granary to store food reserves for the British army following the devastating famine of 1770. Additional Info (a) It is not a tomb. (b) While the British built it, it was strictly for food storage, not weaponry. (c) Interestingly, the doors open inwards, making it impossible to open them if the structure were actually filled to the top with grain. (d) Jantar Mantar structures (like in Jaipur) are celestial observatories. Positive Mark: 0.8 Negative Mark: 0"},{"id":"84368","q":"Which device converts digital signals from a computer into analog signals that can travel over telephone lines?","options":["Router","Switch","Modem","Hub"],"answer":"3","solution":"A Modem (Modulator-Demodulator) is a hardware device that converts digital data from a computer into an analog wave format so it can be transmitted over traditional telephone or cable lines. It also demodulates incoming analog signals back into digital data. Additional Info (a) A router connects multiple networks and routes data packets between them. (b) A switch connects devices within a single Local Area Network (LAN). (c) The word Modem is a portmanteau of Modulate and Demodulate. (d) A hub is a basic network device that broadcasts data to all connected ports indiscriminately. Positive Mark: 0.8 Negative Mark: 0"},{"id":"84369","q":"The 'NITI' in NITI Aayog stands for:","options":["National Institute for Technical Innovation","National Institution for Transforming India","National Initiative for Technological India","New Institution for Transforming India"],"answer":"2","solution":"NITI stands for the National Institution for Transforming India. It serves as the apex public policy think tank of the Government of India, formed in 2015 to replace the Planning Commission. Additional Info (a) Fabricated distractor. (b) It emphasizes a \"bottom-up\" approach to foster cooperative federalism. (c) Fabricated distractor. (d) Fabricated distractor. Positive Mark: 0.8 Negative Mark: 0"},{"id":"84370","q":"The 'Great Victoria Desert' is located in:","options":["Africa","North America","Australia","South America"],"answer":"3","solution":"The Great Victoria Desert is the largest desert in Australia, stretching across Western Australia and South Australia. It is characterized by vast areas of sand dunes, grasslands, and salt lakes. Additional Info (a) Africa is famous for the Sahara and Kalahari deserts. (b) North America is famous for the Mojave and Sonoran deserts. (c) It was named by the British explorer Ernest Giles after Queen Victoria. (d) South America is famous for the Atacama and Patagonian deserts. Positive Mark: 0.8 Negative Mark: 0"},{"id":"84371","q":"Which amendment to the Constitution made the Right to Education a fundamental right under Article 21A?","options":["86 th Amendment","44 th Amendment","73 rd Amendment","92 nd Amendment"],"answer":"1","solution":"The 86 th Constitutional Amendment Act of 2002 added Article 21A, which made free and compulsory education a fundamental right for all children in the age group of 6 to 14 years. Additional Info (a) This amendment led to the passing of the Right of Children to Free and Compulsory Education (RTE) Act in 2009. (b) The 44 th Amendment relates to the removal of the right to property. (c) The 73 rd Amendment institutionalized Panchayati Raj. (d) The 92 nd Amendment added Bodo, Dogri, Maithili, and Santhali to the Eighth Schedule. Positive Mark: 0.8 Negative Mark: 0"},{"id":"84372","q":"Which of the following metals is kept submerged in kerosene oil to prevent spontaneous combustion?","options":["Magnesium","Calcium","Sodium","Aluminum"],"answer":"3","solution":"Sodium is an extremely reactive alkali metal. If left exposed to air, it reacts violently with atmospheric moisture and oxygen, posing a severe fire hazard. Therefore, it is stored submerged in an inert hydrocarbon liquid like kerosene. Additional Info (a) Magnesium burns with a bright white flame but does not generally spontaneously ignite at room temperature. (b) Calcium is reactive but can be stored in tightly sealed containers. (c) Potassium and Lithium are other highly reactive metals that must be stored under oil. (d) Aluminum forms a protective oxide layer that prevents it from reacting further. Positive Mark: 0.8 Negative Mark: 0"},{"id":"84373","q":"In early 2025, which Indian badminton player won the prestigious All England Open Championship? (Assume current standard prospects)","options":["Lakshya Sen","Kidambi Srikanth","HS Prannoy","Satwiksairaj Rankireddy"],"answer":"1","solution":"Lakshya Sen is widely recognized as one of India's brightest young prospects on the BWF circuit, consistently making deep runs in major tournaments like the All England Open (where he was a runner-up in 2022). In the context of standard current affairs predictions for the singles circuit, he is the most prominent Indian men's singles contender. Additional Info (a) Lakshya Sen has established himself as a dominant force in world badminton. (b) Kidambi Srikanth is a veteran player and former World No. 1. (c) HS Prannoy is another veteran who won bronze at the World Championships. (d) Satwiksairaj Rankireddy is a top-tier doubles player, not a singles contender. Positive Mark: 0.8 Negative Mark: 0"},{"id":"84374","q":"The 'Biomedical Waste Management Rules, 2016' categorize waste into how many color-coded bins for segregation?","options":["2","3","4","5"],"answer":"3","solution":"The Bio-Medical Waste Management Rules, 2016 streamline the segregation of medical waste into exactly 4 distinct color-coded categories at the point of generation to ensure safe disposal and recycling. Additional Info (a) 2 bins (green/blue) is standard for municipal household waste. (b) Incorrect number. (c) The four designated colors are Yellow, Red, White (translucent), and Blue. (d) Incorrect number. Positive Mark: 0.8 Negative Mark: 0"},{"id":"84375","q":"Who was the first President of the Indian National Congress?","options":["A.O. Hume","Womesh Chandra Bonnerjee","Dadabhai Naoroji","Badruddin Tyabji"],"answer":"2","solution":"Womesh Chandra Bonnerjee (W.C. Bonnerjee), a prominent Indian barrister, was elected as the very first President of the Indian National Congress at its inaugural session held in Bombay in 1885. Additional Info (a) A.O. Hume was a retired British civil servant who founded the INC but served as its General Secretary, not President. (b) Bonnerjee presided over the first session attended by 72 delegates. (c) Dadabhai Naoroji was the second President (1886 in Calcutta). (d) Badruddin Tyabji was the third President and the first Muslim President of the INC (1887 in Madras). Positive Mark: 0.8 Negative Mark: 0"},{"id":"84376","q":"'URL' stands for:","options":["Universal Resource Locator","Uniform Resource Locator","Unified Resource Link","Uniform Routing Language"],"answer":"2","solution":"URL stands for Uniform Resource Locator. It is essentially a web address that specifies the absolute location of a resource (like a web page or an image) on a computer network and the protocol used to retrieve it (like HTTP or HTTPS). Additional Info (a) Universal Resource Locator is a common, but incorrect, misnomer. (b) The syntax of a URL was defined in 1994 by Tim Berners-Lee. (c) Unified Resource Link is a fabricated distractor. (d) Uniform Routing Language is a fabricated distractor. Positive Mark: 0.8 Negative Mark: 0"},{"id":"84377","q":"In physics, 'Work' is mathematically defined as the dot product of:","options":["Force and Velocity","Force and Displacement","Mass and Acceleration","Power and Time"],"answer":"2","solution":"In mechanics, the work done on an object by a constant force is defined as the dot product of the force vector and the displacement vector. Mathematically, it is Additional Info (a) The dot product of Force and Velocity gives Mechanical Power . (b) Work is a scalar quantity measured in Joules. (c) Mass multiplied by Acceleration equals Force (Newton's Second Law). (d) Power multiplied by Time equals Energy/Work, but it is not a dot product of vectors. Positive Mark: 0.8 Negative Mark: 0"},{"id":"84378","q":"The concept of 'Judicial Review' in India is derived from the Constitution of:","options":["United Kingdom","United States of America","France","Canada"],"answer":"2","solution":"The concept of Judicial Review, which allows the Supreme Court to examine the constitutionality of legislative acts and executive orders, was adopted from the Constitution of the United States of America. Additional Info (a) The UK operates on the principle of Parliamentary Sovereignty, where courts cannot generally strike down primary legislation. (b) The US established this power famously in the 1803 case of Marbury v. Madison . (c) France inspired the ideals of Liberty, Equality, and Fraternity. (d) Canada inspired the federal system with a strong center. Positive Mark: 0.8 Negative Mark: 0"},{"id":"84379","q":"Which of the following states is the largest producer of Mica in India?","options":["Andhra Pradesh","Rajasthan","Jharkhand","Bihar"],"answer":"1","solution":"Andhra Pradesh is the largest producer of mica in India, commanding a significant majority of the country's total production. The Nellore district in Andhra Pradesh is particularly famous for its extensive mica belt. Additional Info (a) Mica is heavily used in the electrical and electronics industries as an insulator. (b) Rajasthan is the second-largest producer (Bhilwara district). (c) Jharkhand has historically rich mica deposits in the Koderma district, but overall production volume trails AP. (d) Bihar has deposits in regions bordering Jharkhand (like Nawada) but is not the top producer. Positive Mark: 0.8 Negative Mark: 0"},{"id":"84380","q":"An 'Isotope' of an element has:","options":["Same number of protons but different number of neutrons","Same number of neutrons but different number of protons","Same atomic mass but different atomic number","Different numbers of both protons and electrons"],"answer":"1","solution":"Isotopes are variants of a particular chemical element that share the same number of protons (same atomic number) and electrons, but have a different number of neutrons in their nucleus, resulting in a different atomic mass. Additional Info (a) For example, Carbon-12 and Carbon-14 both have 6 protons, but Carbon-14 has 8 neutrons instead of 6. (b) Atoms with the same number of neutrons but different protons are called Isotones. (c) Atoms with the same atomic mass but different atomic numbers are called Isobars. (d) Changing the number of electrons creates an ion, not an isotope. Positive Mark: 0.8 Negative Mark: 0"},{"id":"84381","q":"The 2025 World Athletics Championships are scheduled to be held in which city?","options":["Eugene","Budapest","Tokyo","London"],"answer":"3","solution":"The 2025 World Athletics Championships are scheduled to be held in Tokyo, Japan, at the Japan National Stadium (the same venue used for the 2020 Summer Olympics). Additional Info (a) Eugene, Oregon (USA) hosted the 2022 World Athletics Championships. (b) Budapest, Hungary hosted the 2023 World Athletics Championships. (c) Tokyo won the bid to host the 2025 event, bringing the championships back to Japan. (d) London hosted the event in 2017. Positive Mark: 0.8 Negative Mark: 0"},{"id":"84382","q":"In a terrestrial ecosystem, which group of organisms typically has the largest biomass?","options":["Primary consumers","Apex predators","Producers","Secondary consumers"],"answer":"3","solution":"In a standard terrestrial ecosystem, producers (autotrophs like plants and trees) form the base of the ecological pyramid and possess the largest total biomass. Energy and biomass decrease as you move up the trophic levels. Additional Info (a) Primary consumers (herbivores) rely on producers for energy, meaning their total biomass must be smaller. (b) Apex predators occupy the highest trophic level and have the smallest total biomass. (c) The 10% rule dictates that only a fraction of energy/biomass transfers up to the next level. (d) Secondary consumers (carnivores) eat primary consumers and have less biomass than them. Positive Mark: 0.8 Negative Mark: 0"},{"id":"84383","q":"The famous 'Battle of Chausa' (1539) was fought between:","options":["Babur and Ibrahim Lodi","Sher Shah Suri and Humayun","Akbar and Hemu","Aurangzeb and Dara Shikoh"],"answer":"2","solution":"The Battle of Chausa was a pivotal military engagement fought on June 26, 1539, between the Mughal Emperor Humayun and the Afghan warlord Sher Shah Suri. Sher Shah decisively defeated Humayun, forcing him to flee. Additional Info (a) Babur and Ibrahim Lodi fought the First Battle of Panipat in 1526. (b) The victory at Chausa allowed Sher Shah to assume the royal title of \"Farid al-Din Sher Shah.\" (c) Akbar and Hemu fought the Second Battle of Panipat in 1556. (d) Aurangzeb and Dara Shikoh fought the Battle of Samugarh for the Mughal succession. Positive Mark: 0.8 Negative Mark: 0"},{"id":"84384","q":"The term 'Gilt-edged market' refers to the market for:","options":["Corporate bonds","Bullion (Gold and Silver)","Government securities","Agricultural commodities"],"answer":"3","solution":"The gilt-edged market is the market for buying and selling government securities (G-Secs) and bonds. These are considered highly secure and risk-free investments because they are backed by the government. Additional Info (a) Corporate bonds carry a higher risk of default compared to government bonds. (b) Bullion markets handle the trading of precious metals. (c) The term originated in Britain, where government debt certificates literally had gilt (gold) edges. (d) Agricultural commodities are traded on commodity exchanges. Positive Mark: 0.8 Negative Mark: 0"},{"id":"84385","q":"What does \"RAM\" stand for in a computer?","options":["Read Access Memory","Random Access Memory","Run Access Memory","Rapid Action Memory"],"answer":"2","solution":"RAM stands for Random Access Memory. It is the primary, volatile memory in a computer that is used to store data and machine code currently being used and processed by the CPU. Additional Info (a) ROM stands for Read-Only Memory. (b) It is termed \"Random Access\" because any byte of memory can be accessed without touching the preceding bytes. (c) Fabricated distractor term. (d) Fabricated distractor term. Positive Mark: 0.8 Negative Mark: 0"},{"id":"84386","q":"The specific heat capacity of water is:","options":["1 J/g\u00b0C","2.1 J/g\u00b0C","4.18 J/g\u00b0C","8.31 J/g\u00b0C"],"answer":"3","solution":"The specific heat capacity of liquid water is approximately 4.18 Joules per gram per degree Celsius (4.18 J/g\u00b0C). This unusually high value is primarily due to the extensive hydrogen bonding between water molecules. Additional Info (a) 1 refers to the specific heat of water measured in calories (1 cal/g\u00b0C). (b) 2.1 J/g\u00b0C is the approximate specific heat capacity of ice. (c) This high specific heat makes water an excellent temperature buffer for the planet. (d) 8.31 J/(mol\u00b0K) is the universal gas constant (R). Positive Mark: 0.8 Negative Mark: 0"},{"id":"84387","q":"Which Constitutional schedule distributes powers between the Union and the States into three lists?","options":["Fifth Schedule","Sixth Schedule","Seventh Schedule","Eighth Schedule"],"answer":"3","solution":"The Seventh Schedule of the Indian Constitution defines and specifies the allocation of powers and functions between the Union and the States. It contains three lists: the Union List, the State List, and the Concurrent List. Additional Info (a) The Fifth Schedule deals with the administration of Scheduled Areas. (b) The Sixth Schedule deals with the administration of tribal areas in Assam, Meghalaya, Tripura, and Mizoram. (c) Article 246 governs this distribution of legislative powers. (d) The Eighth Schedule lists the officially recognized languages of India. Positive Mark: 0.8 Negative Mark: 0"},{"id":"84388","q":"E-waste recycling often focuses heavily on the recovery of which precious metal found in circuit boards?","options":["Zinc","Gold","Aluminum","Iron"],"answer":"2","solution":"Electronic waste (e-waste), particularly printed circuit boards, contains significant quantities of precious metals. Gold is heavily targeted for recovery because of its high economic value and its extensive use as a highly conductive, corrosion-resistant plating on connectors and contacts. Additional Info (a) Zinc is present but has low economic value for specialized recovery. (b) Recovering gold from e-waste is often called \"urban mining.\" (c) Aluminum is recovered in bulk from casings but is not considered a precious metal. (d) Iron is recovered easily using magnets but is a base, low-value metal. Positive Mark: 0.8 Negative Mark: 0"},{"id":"84389","q":"Which of the following is NOT an endocrine gland?","options":["Thyroid","Pituitary","Salivary gland","Adrenal gland"],"answer":"3","solution":"Salivary glands are exocrine glands, not endocrine glands. Exocrine glands secrete their products (like saliva, sweat, or digestive enzymes) through ducts directly to a specific site, rather than directly into the bloodstream. Additional Info (a) The thyroid is an endocrine gland that secretes hormones regulating metabolism. (b) The pituitary is a major endocrine gland controlling other glands. (c) Endocrine glands are ductless and release hormones directly into the blood. (d) The adrenal glands are endocrine glands that secrete cortisol and adrenaline. Positive Mark: 0.8 Negative Mark: 0"},{"id":"84390","q":"'Operation Flood' was a program associated with:","options":["Flood control in river basins","Increasing wheat production","Increasing milk production","Disaster management during cyclones"],"answer":"3","solution":"Operation Flood, launched in 1970, was the world's largest dairy development program. It transformed India from a milk-deficient nation into the world's largest milk producer. It is also synonymous with the \"White Revolution.\" Additional Info (a) The name \"Operation Flood\" is a metaphor for flooding the nation with milk, not water management. (b) Increasing wheat and rice production was the goal of the \"Green Revolution.\" (c) The program was spearheaded by Dr. Verghese Kurien, the founder of Amul. (d) Unrelated to disaster management. Positive Mark: 0.8 Negative Mark: 0"},{"id":"84391","q":"The 'Standard Meridian of India' passes through which of the following cities?","options":["Bhopal","Mirzapur","Lucknow","Patna"],"answer":"2","solution":"The Standard Meridian of India is 82\u00b030 E longitude. It passes through Mirzapur (near Prayagraj/Allahabad) in Uttar Pradesh and is used as the reference point to calculate Indian Standard Time (IST). Additional Info (a) Bhopal lies much further west. (b) IST is calculated as exactly 5 hours and 30 minutes ahead of GMT. (c) Lucknow is situated west of the standard meridian. (d) Patna is situated east of the standard meridian. Positive Mark: 0.8 Negative Mark: 0"},{"id":"84392","q":"In the binary number system, the decimal number 10 is represented as:","options":["1010","1001","1100","1111"],"answer":"1","solution":"To convert the decimal number 10 to binary, you break it down into powers of 2. 10 = 8 + 2. In binary place values ( , , , or 8, 4, 2, 1), this translates to 1 8, 0 4, 1 2, and 0 1, which is written as 1010. Additional Info (a) 1010 equals decimal 10. (b) 1001 equals decimal 9 (8+1). (c) 1100 equals decimal 12 (8+4). (d) 1111 equals decimal 15 (8+4+2+1). Positive Mark: 0.8 Negative Mark: 0"},{"id":"84393","q":"The term 'Blue Economy' predominantly refers to:","options":["The IT sector","The sustainable use of ocean resources for economic growth","The aviation industry","The manufacturing of solar panels"],"answer":"2","solution":"According to the World Bank, the \"Blue Economy\" is defined as the sustainable use of ocean resources for economic growth, improved livelihoods, and jobs while preserving the health of the ocean ecosystem. Additional Info (a) The IT sector is generally part of the knowledge or tertiary/quaternary economy. (b) It includes activities like sustainable fisheries, maritime transport, coastal tourism, and renewable marine energy. (c) The aviation sector is unrelated to the \"blue\" designation. (d) Solar panels belong to the \"Green Economy\" sector. Positive Mark: 0.8 Negative Mark: 0"},{"id":"84394","q":"In July 2025, which Indian city launched a first-of-its-kind 'hedging desk' under the SMART Project to protect farmers from market price fluctuations for crops like cotton and turmeric?","options":["Kozhikode","Jaipur","Varanasi","Pune"],"answer":"4","solution":"Correct . In July 2025, Maharashtra launched a specialized hedging desk in Pune This initiative, part of the Balasaheb Thackeray Agribusiness and Rural Transformation (SMART) Project, helps farmers lock in prices and reduce financial risks with support from the National Commodity and Derivatives Exchange (NCDEX). (a) Kozhikode : Incorrect. Kozhikode made headlines in 2024\u20132025 for being India\u2019s first UNESCO City of Literature , officially celebrating its designation on June 23. (b) Jaipur : Incorrect. While Jaipur hosted the Yoga Mahotsav in previous years, Nashik was the host for 2025. Jaipur remains notable in 2025 for its long-standing status as a UNESCO World Heritage City. (c) Varanasi: Incorrect. Varanasi was prominently featured in 2022\u20132023 as the SCO Cultural and Tourism Capital , but it was not the site for this specific 2025 agricultural hedging initiative."},{"id":"84395","q":"Which of the following forces is responsible for holding the nucleus of an atom together?","options":["Gravitational force","Electromagnetic force","Strong nuclear force","Weak nuclear force"],"answer":"3","solution":"The Strong Nuclear Force is the fundamental interaction responsible for binding protons and neutrons together within the nucleus of an atom. It must be incredibly strong to overcome the immense electromagnetic repulsion between the positively charged protons. Additional Info (a) Gravitational force is extremely weak at the subatomic level. (b) The electromagnetic force actually tries to push the positively charged protons apart. (c) It operates over a very short range (on the scale of femtometers). (d) The weak nuclear force is responsible for radioactive decay (like beta decay). Positive Mark: 0.8 Negative Mark: 0"},{"id":"84396","q":"The 'Mandal Commission' was constituted to identify:","options":["Electoral reforms","Socially and educationally backward classes","Center-State relations","Reorganization of states on linguistic lines"],"answer":"2","solution":"The Mandal Commission (the Socially and Educationally Backward Classes Commission) was established in 1979 by the Morarji Desai government to identify the socially or educationally backward classes in India and recommend measures for their advancement, famously leading to the 27% OBC reservation. Additional Info (a) The Dinesh Goswami Committee dealt with electoral reforms. (b) It was headed by B.P. Mandal and its report was implemented in 1990 by the V.P. Singh government. (c) The Sarkaria Commission dealt with Center-State relations. (d) The Fazl Ali Commission (States Reorganisation Commission) dealt with linguistic states. Positive Mark: 0.8 Negative Mark: 0"},{"id":"84397","q":"Solid waste that is highly combustible and has high calorific value, such as dry paper and plastic, is best suited for disposal via:","options":["Composting","Sanitary landfill","Incineration","Deep-well injection"],"answer":"3","solution":"Incineration is a thermal waste treatment process involving the combustion of organic substances. Waste with a high calorific value (like dry plastics, paper, and rubber) is ideal for incineration, particularly in Waste-to-Energy (WtE) plants where the heat is used to generate electricity. Additional Info (a) Composting is strictly for wet, biodegradable organic waste. (b) Landfilling wastes high-calorific materials and takes up valuable space. (c) Modern incinerators reduce the volume of the waste by 95% and recover energy. (d) Deep-well injection is a method for disposing of liquid hazardous waste deep underground. Positive Mark: 0.8 Negative Mark: 0"},{"id":"84398","q":"The highest waterfall in India is:","options":["Jog Falls","Kunchikal Falls","Dudhsagar Falls","Shivanasamudra Falls"],"answer":"2","solution":"Kunchikal Falls, located in the Shimoga district of Karnataka on the Varahi River, is considered the highest waterfall in India, featuring a massive cascade drop of 455 meters. Additional Info (a) Jog Falls is one of the highest plunge (untiered) waterfalls in India, but its total height (253m) is less than Kunchikal. (b) Kunchikal forms a tiered cascade down the rocky boulders of the Western Ghats. (c) Dudhsagar Falls is located on the Mandovi River in Goa. (d) Shivanasamudra Falls is situated on the Kaveri River in Karnataka. Positive Mark: 0.8 Negative Mark: 0"},{"id":"84399","q":"The minimum velocity required by an object to overcome Earth's gravitational pull is:","options":["9.8 km/s","11.2 km/s","15.0 km/s","21.4 km/s"],"answer":"2","solution":"Escape velocity is the minimum speed needed for an object to escape from the gravitational influence of a massive body without any further propulsion. For Earth, this velocity is approximately 11.2 kilometers per second (11.2 km/s). Additional Info (a) 9.8 m/s 2 is the acceleration due to gravity, not a velocity. (b) It is calculated using the formula , where R is the radius of the Earth. (c) Jupiter's escape velocity is much higher (nearly 60 km/s). (d) The Moon's escape velocity is much lower (about 2.4 km/s). Positive Mark: 0.8 Negative Mark: 0"},{"id":"84400","q":"A 'Trojans' or 'Trojan Horse' in computer security is:","options":["A self-replicating virus","Malicious code disguised as legitimate software","A firewall security protocol","An encryption algorithm"],"answer":"2","solution":"A Trojan Horse is a type of malware that misleads users into downloading and executing it by disguising itself as a legitimate, benign, or desirable program. Once installed, it can steal data or grant attackers backdoor access to the system. Additional Info (a) Unlike viruses and worms, standard Trojans do not self-replicate or infect other files independently. (b) The name is derived from the ancient Greek story of the wooden horse used to infiltrate Troy. (c) Firewalls block Trojans from communicating with their command servers. (d) Encryption algorithms protect data; Trojans often try to steal the decryption keys. Positive Mark: 0.8 Negative Mark: 0"},{"id":"84401","q":"Under the Constitution of India, who is the guardian of the Fundamental Rights?","options":["The President","The Parliament","The Judiciary (Supreme Court and High Courts)","The Prime Minister"],"answer":"3","solution":"The Judiciary, specifically the Supreme Court of India (under Article 32) and the High Courts (under Article 226), acts as the ultimate guarantor and guardian of the Fundamental Rights of citizens, possessing the power to issue writs for their enforcement. Additional Info (a) The President is the formal head of state but not the adjudicator of constitutional rights. (b) The Parliament can amend rights, but the Judiciary ensures those amendments do not violate the basic structure. (c) Dr. B.R. Ambedkar called Article 32 the \"heart and soul\" of the Constitution for this very reason. (d) The Prime Minister is the head of the executive branch. Positive Mark: 0.8 Negative Mark: 0"},{"id":"84402","q":"In human digestion, the enzyme 'Lipase' primarily helps in the digestion of:","options":["Proteins","Carbohydrates","Fats (Lipids)","Nucleic acids"],"answer":"3","solution":"Lipase is a digestive enzyme primarily produced in the pancreas (pancreatic lipase) that is essential for the chemical digestion of fats (lipids). It breaks down triglycerides into free fatty acids and glycerol, which can be absorbed by the intestines. Additional Info (a) Proteases (like pepsin and trypsin) digest proteins. (b) Amylase digests carbohydrates and starches. (c) Bile salts from the liver first emulsify the fats so lipase can work effectively. (d) Nucleases digest nucleic acids. Positive Mark: 0.8
