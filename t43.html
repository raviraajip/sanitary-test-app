<!DOCTYPE html>
<html lang="hi">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>ASWMO — T43 Full Test-Tech</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
:root{--bg:#0b0c15;--surface:#12142a;--text:#e4e6f0;--accent:#00e8a0;--gold:#f0c040;--danger:#ff4d6d;--border:rgba(255,255,255,.08);--muted:#8a8fa8;}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:Inter,system-ui,sans-serif;background:radial-gradient(1000px 700px at 20% 0%,#00e8a011,transparent),var(--bg);color:var(--text);min-height:100vh;line-height:1.55;}
.container{max-width:900px;margin:2rem auto;padding:0 1.2rem;}
h1{font-size:1.6rem;font-weight:700;background:linear-gradient(135deg,#fff,var(--accent));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.card{background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:16px;padding:1.5rem;margin-bottom:1rem;}
.question{font-size:1.05rem;font-weight:500;margin-bottom:.8rem;line-height:1.35;}
.options{display:grid;gap:.5rem;}
.option{padding:.7rem 1rem;background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:10px;cursor:pointer;font-size:.92rem;transition:.2s;}
.option:hover,.option.selected{border-color:var(--accent);background:rgba(0,232,160,.12);font-weight:600;}
.timer{font-family:monospace;font-weight:700;font-size:2rem;color:var(--accent);}
button{background:linear-gradient(135deg,var(--accent),#00b87e);color:#0a0c12;border:none;padding:.7rem 1.4rem;border-radius:10px;font-weight:700;cursor:pointer;}
.hidden{display:none!important}</style>
</head>
<body>
<div class="container">
<header><h1 id="ptitle">ASWMO — T43 Full Test-Tech</h1></header>

<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;">
<div><div class="timer" id="timer">65:00</div><div style="font-size:.75rem;color:var(--muted);">Time Remaining</div></div>
<button onclick="submitTest()">Submit Test</button></div>
<div style="height:6px;background:rgba(255,255,255,.1);border-radius:3px;overflow:hidden;margin-top:.5rem;"><div id="bar" style="height:100%;width:100%;background:linear-gradient(90deg,var(--accent),#00b87e);transition:width 1s linear;"></div></div></div>

<div class="card" id="qCard">
<div style="font-size:.8rem;color:var(--muted);margin-bottom:.4rem;">Question <span id="qNum">1</span> / <span id="qTotal">?</span></div>
<div class="question" id="qText">Loading...</div>
<div class="options" id="opts"></div>
<div style="margin-top:1rem;display:flex;gap:.5rem;flex-wrap:wrap;">
<button onclick="prev()">&#8592; Prev</button><button onclick="next()">Next &#8594;</button><button onclick="submitTest()">Submit</button></div>
</div>

<div class="card hidden" id="resCard" style="text-align:center;padding:2rem;">
<h2 style="color:var(--gold);font-size:2rem;">Test Completed!</h2>
<div id="score" style="font-size:3rem;font-weight:800;color:var(--accent);margin:1rem 0;"></div>
<div id="detail" style="color:var(--muted);font-size:.95rem;"></div>
<div style="margin-top:1.5rem;"><a href="index.html" style="color:var(--accent);font-weight:600;">&#8592; Back</a></div>
</div>
</div>

","q":"The \"National Air Quality Index\" (AQI) of India transforms complex air quality data into a single number. An AQI value between 201 and 300 falls into which category?","options":["Good","Moderate","Poor","Severe"],"answer":"3"},{"id":"82944","q":"In the hierarchy of waste management, which is the most preferred strategy?","options":["Energy Recovery (Waste-to-Energy)","Recycling and Composting","Waste Prevention and Source Reduction","Safe Disposal in a Landfill"],"answer":"3"},{"id":"82945","q":"The biological process that converts Nitrates ( ) to Nitrogen Gas ( ) under anoxic conditions is called:","options":["Nitrification","Denitrification","Ammonification","Nitrogen Fixation"],"answer":"2"},{"id":"82946","q":"According to the Biomedical Waste Management Rules, 2016, discarded metallic implants and contaminated glassware should be disposed of in which colored container?","options":["Red","Yellow","Blue","White (Translucent)"],"answer":"3"},{"id":"82947","q":"\"Polychlorinated Biphenyls\" (PCBs) are hazardous organic compounds historically used in:","options":["Agricultural fertilizers","Electrical transformers and capacitors as dielectric fluids","Food preservatives","Municipal water disinfection"],"answer":"2"},{"id":"82948","q":"In an aerobic oxidation pond, what is the primary source of dissolved oxygen for the bacteria?","options":["Mechanical surface aerators","Photosynthesis by algae","Chemical oxygen generators","Incoming influent oxygen"],"answer":"2"},{"id":"82949","q":"The \"Rotterdam Convention\" is an international treaty designed to promote shared responsibilities in relation to the importation of:","options":["Endangered wild fauna","Hazardous chemicals and pesticides","Municipal solid waste","Ozone-depleting substances"],"answer":"2"},{"id":"82950","q":"In an Electrostatic Precipitator (ESP), the \"Corona Discharge\" is generated by:","options":["The collection plates","The high-voltage discharge electrodes (wires)","The rapping mechanism","The exhaust fan"],"answer":"2"},{"id":"82951","q":"A \"Trickling Filter\" is an example of which type of biological treatment process?","options":["Suspended Growth Process","Attached Growth (Film) Process","Anaerobic Digestion","Physical-Chemical Process"],"answer":"2"},{"id":"82952","q":"The term \"E-waste\" under the E-Waste (Management) Rules, 2016, includes:","options":["Only computers and mobile phones","All electrical and electronic equipment, whole or in part, discarded as waste by the consumer or bulk consumer","Only industrial heavy machinery","Only lead-acid automotive batteries"],"answer":"2"},{"id":"82953","q":"Which parameter measures the strength of sewage based on the amount of potassium dichromate ( ) required to chemically oxidize its organic matter?","options":["BOD","COD","TOC","DO"],"answer":"2"},{"id":"82954","q":"\"Sloughing\" is an operational phenomenon strictly associated with:","options":["Activated Sludge Process","Sedimentation Tanks","Trickling Filters and RBCs","Sludge Drying Beds"],"answer":"3"},{"id":"82955","q":"What is the primary advantage of a \"Sanitary Landfill\" over an \"Open Dump\"?","options":["It generates zero greenhouse gases","It involves engineered environmental controls like liners, leachate collection, and daily soil cover","It requires much less land area","It allows for uncontrolled scavenging"],"answer":"2"},{"id":"82956","q":"In the context of the Environmental Protection Act, 1986, an \"Eco-Sensitive Zone\" (ESZ) is primarily declared around:","options":["Major metropolitan cities","National Parks, Wildlife Sanctuaries, and Protected Areas","Heavy industrial corridors","Coastal ports"],"answer":"2"},{"id":"82957","q":"Which method is used to determine the \"Volatile Suspended Solids\" (VSS) of a wastewater sludge sample?","options":["Drying the sample at","Igniting the dried solids in a muffle furnace at","Titrating with Sulfuric Acid","Passing the sample through a 0.45-micron filter"],"answer":"2"},{"id":"82958","q":"The \"Central Ground Water Authority\" (CGWA) was constituted under the provisions of which Act?","options":["The Water (Prevention and Control of Pollution) Act, 1974","The Environment (Protection) Act, 1986","The Public Liability Insurance Act, 1991","The National Green Tribunal Act, 2010"],"answer":"2"},{"id":"82959","q":"\"Hardness\" in water is primarily caused by the presence of multivalent metallic cations, most notably:","options":["Sodium and Potassium","Calcium and Magnesium","Iron and Manganese","Aluminum and Zinc"],"answer":"2"},{"id":"82960","q":"Which of the following is a non-destructive technology used for sorting different types of plastics (like PET vs. HDPE) in a Material Recovery Facility?","options":["Hammer Milling","Near-Infrared (NIR) Spectroscopy","Plasma Gasification","Trommel Screening"],"answer":"2"},{"id":"82961","q":"According to the Hazardous Waste Management Rules, an occupier must maintain records of hazardous waste handled in Form 3 and submit annual returns to the SPCB by which date every year?","options":["31st March","30th June","30th September","31st December"],"answer":"2"},{"id":"82962","q":"In a \"Cyclone Separator\", the collection efficiency for a given particle size will generally increase if:","options":["The inlet gas velocity decreases","The diameter of the cyclone body decreases","The gas temperature increases significantly","The particle density decreases"],"answer":"2"},{"id":"82963","q":"\"Sullage\" refers to wastewater from:","options":["Toilets and urinals containing fecal matter","Industrial manufacturing processes","Kitchen sinks, bathrooms, and laundries (excluding fecal matter)","Rainwater street runoff"],"answer":"3"},{"id":"82964","q":"The \"Crown\" of a sewer pipe refers to:","options":["The lowest interior point of the pipe","The highest interior point of the pipe","The exterior foundation bed","The joint connecting two pipes"],"answer":"2"},{"id":"82965","q":"Which of the following is an \"End-of-Pipe\" pollution control strategy?","options":["Using lead-free raw materials","Modifying the internal manufacturing process to produce less waste","Installing a scrubber on an exhaust stack","Designing products that last longer"],"answer":"3"},{"id":"82966","q":"\"Vermicomposting\" utilizes specific species of earthworms. Which species is most commonly used in India for this purpose due to its high efficiency?","options":["Pheretima posthuma","Lumbricus terrestris","Eisenia fetida","Ascaris lumbricoides"],"answer":"3"},{"id":"82967","q":"Under the Plastic Waste Management Rules, what is the meaning of the term \"Carry Bags\"?","options":["Bags made solely from jute or cloth","Bags made from plastic material, used for the purpose of carrying or dispensing commodities","Industrial heavy-duty sacks","Biodegradable garbage bin liners"],"answer":"2"},{"id":"82968","q":"A \"Bar Screen\" in a sewage treatment plant is installed at an angle of to to the horizontal primarily to:","options":["Increase the velocity of the flow","Facilitate easier manual or mechanical raking and cleaning of the accumulated debris","Measure the influent flow rate","Prevent the entry of dissolved chemicals"],"answer":"2"},{"id":"82969","q":"What is the main objective of the \"Scoping\" phase in an Environmental Impact Assessment (EIA)?","options":["To write the final executive summary","To determine the spatial, temporal, and thematic boundaries of the EIA study and establish the Terms of Reference (ToR)","To grant the final environmental clearance","To calculate the financial return on investment"],"answer":"2"},{"id":"82970","q":"In the context of sound waves, \"Pitch\" is directly related to the wave's:","options":["Amplitude","Frequency","Speed","Intensity"],"answer":"2"},{"id":"82971","q":"The \"National Water Policy\" of India explicitly states that in the planning and operation of water resource systems, the highest priority should be given to:","options":["Irrigation for agriculture","Hydro-electric power generation","Drinking water","Industrial uses"],"answer":"3"},{"id":"82972","q":"The \"A-Scale\" weighting in noise measurement, denoted as dB(A), is used because:","options":["It measures only low-frequency industrial vibrations","It filters out high frequencies entirely","It mimics the non-linear response of the human ear, which is less sensitive to very low and very high frequencies","It calculates the average noise over 24 hours"],"answer":"3"},{"id":"82973","q":"Which method of composting is characterized as an \"Anaerobic\" process?","options":["Indore Method","Windrow Method","Bangalore Method","Aerated Static Pile"],"answer":"3"},{"id":"82974","q":"The legal principle \"Res Ipsa Loquitur\" in environmental tort cases translates to:","options":["The polluter must pay","The thing speaks for itself","Buyer beware","Beyond reasonable doubt"],"answer":"2"},{"id":"82975","q":"\"Alkalinity\" of water is its capacity to:","options":["Neutralize acids","Neutralize bases","Conduct electricity","Dissolve heavy metals"],"answer":"1"},{"id":"82976","q":"According to the Construction & Demolition Waste Management Rules, 2016, large construction projects must submit a waste management plan to the local authority. What is the minimum lead time required for this submission before the start of construction?","options":["15 days","1 month","3 months","6 months"],"answer":"2"},{"id":"82977","q":"In an oxidation pond, what happens to the Dissolved Oxygen (DO) levels during a 24-hour diurnal cycle?","options":["DO remains constant day and night","DO is highest in the late afternoon and lowest just before sunrise","DO is highest at midnight and lowest at noon","DO only fluctuates during the winter"],"answer":"2"},{"id":"82978","q":"The \"Appiko Movement\", an environmental conservation movement inspired by the Chipko Movement, originated in which Indian state?","options":["Uttarakhand","Kerala","Karnataka","Madhya Pradesh"],"answer":"3"},{"id":"82979","q":"Which of the following best defines \"Specific Yield\" of an aquifer?","options":["The total volume of water stored in the aquifer","The volume of water that will drain from the aquifer by gravity alone","The volume of water retained by capillary forces against gravity","The rate at which water is pumped from a well"],"answer":"2"},{"id":"82980","q":"Under the Environment (Protection) Act, 1986, which of the following authorities was constituted to regulate Coastal Regulation Zones (CRZ)?","options":["National Green Tribunal","Central Pollution Control Board","Coastal Zone Management Authority (NCZMA/SCZMA)","Inland Waterways Authority of India"],"answer":"3"}];
let idx=0, answers={}, timerSec=3900, timerInt=null;

function render(){
  const q=DATA[idx];
  if(!q){document.getElementById('qText').textContent='No data.';return;}
  document.getElementById('qNum').textContent=idx+1;
  document.getElementById('qTotal').textContent=DATA.length;
  document.getElementById('qText').textContent=q.q;
  document.getElementById('opts').innerHTML=q.options.map((o,i)=>
    `<div class="option ${answers[idx]==(i+1)?'selected':''}" onclick="select(${i+1})">${String.fromCharCode(65+i)}. ${o}</div>`
  ).join('');
}
window.select=o=>{answers[idx]=o; render();};
window.prev=()=>{if(idx>0){idx--; render();}};
window.next=()=>{if(idx<DATA.length-1){idx++; render();}};

function submitTest(){
  clearInterval(timerInt);
  let c=0; for(let i=0;i<DATA.length;i++){if(answers[i]==DATA[i].answer)c++;}
  const pct=Math.round(c/DATA.length*100)||0;
  document.getElementById('qCard').classList.add('hidden');
  document.getElementById('resCard').classList.remove('hidden');
  document.getElementById('score').textContent=pct+'%';
  document.getElementById('detail').innerHTML='<b>'+c+'/'+DATA.length+'</b> correct';
}

function tick(){timerSec--; document.getElementById('timer').textContent=Math.floor(timerSec/60)+':'+String(timerSec%60).padStart(2,'0'); document.getElementById('bar').style.width=(timerSec/3900*100)+'%'; if(timerSec<=0){clearInterval(timerInt); submitTest();}}

render(); timerInt=setInterval(tick,1000);
</script>
