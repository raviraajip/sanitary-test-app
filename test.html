<!DOCTYPE html>
<html lang="hi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>ASWMO Test</title>
<style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
:root{--bg:#0b0c15;--text:#e4e6f0;--accent:#00e8a0;--gold:#f0c040;--border:rgba(255,255,255,.08);}
body{font-family:Inter,system-ui,sans-serif;background:radial-gradient(1000px 700px at 20% 0%,#00e8a011,transparent),var(--bg);color:var(--text);min-height:100vh;line-height:1.55;}
.container{max-width:900px;margin:2rem auto;padding:0 1.2rem;}
h1{font-size:1.6rem;font-weight:700;background:linear-gradient(135deg,#fff,var(--accent));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.card{background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:16px;padding:1.5rem;margin-bottom:1rem;}
.question{font-size:1.05rem;font-weight:500;margin-bottom:.8rem;line-height:1.35;}
.options{display:grid;gap:.5rem;}
.option{padding:.7rem 1rem;background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:10px;cursor:pointer;font-size:.92rem;transition:.2s;}
.option:hover,.option.selected{border-color:var(--accent);background:rgba(0,232,160,.12);font-weight:600;}
.timer{font-family:monospace;font-weight:700;font-size:2rem;color:var(--accent);}
button{background:linear-gradient(135deg,var(--accent),#00b87e);color:#0a0c12;border:none;padding:.7rem 1.4rem;border-radius:10px;font-weight:700;cursor:pointer;}
</style></head><body>
<div class="container">
<header><h1 id="ptitle">ASWMO Test</h1><span id="ptype" style="display:inline-block;padding:.15rem .55rem;border-radius:999px;font-size:.7rem;background:linear-gradient(135deg,#7b5cff,#9f7bff);color:#fff;margin-left:.5rem;"></span></header>

<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;">
<div><div class="timer" id="timer">65:00</div><div style="font-size:.75rem;color:var(--muted);">Time Remaining</div></div>
<button onclick="submitTest()">Submit Test</button></div>
<div style="height:6px;background:rgba(255,255,255,.1);border-radius:3px;overflow:hidden;margin-top:.5rem;"><div id="bar" style="height:100%;width:100%;background:linear-gradient(90deg,var(--accent),#00b87e);transition:width 1s linear;"></div></div></div>

<div class="card" id="qCard">
<div style="font-size:.8rem;color:var(--muted);margin-bottom:.4rem;">Question <span id="qNum">1</span> / <span id="qTotal">?</span></div>
<div class="question" id="qText">Loading...</div>
<div class="options" id="opts"></div>
<div style="margin-top:1rem;display:flex;gap:.5rem;flex-wrap:wrap;">
<button onclick="prev()">&#8592; Prev</button><button onclick="next()">Next &#8594;</button><button onclick="submitTest()">Submit</button></div>
</div>

<div class="card hidden" id="resCard" style="text-align:center;padding:2rem;">
<h2 style="color:var(--gold);font-size:2rem;">Test Completed!</h2>
<div id="score" style="font-size:3rem;font-weight:800;color:var(--accent);margin:1rem 0;"></div>
<div id="detail" style="color:var(--muted);font-size:.95rem;"></div>
<div style="margin-top:1.5rem;"><a href="index.html" style="color:var(--accent);font-weight:600;">&#8592; Back to Dashboard</a></div>
</div>
</div>
<script>
let questions=[], idx=0, answers={}, timerSec=65*60, timerInt=null;
const params=new URLSearchParams(location.search);
const testId=params.get('id')||'t01';
const testName=params.get('name')||'Test';

// ID -> file mapping (THIS WAS MISSING!)
const ID_MAP = {
  'mock-1':'Mock-1 Paper-I.html','mock-2':'Mock-2 Paper-I.html','mock-3':'Mock-3 Paper-I.html',
  'mock-4':'Mock-4 Paper-I.html','mock-5':'Mock-5 Paper-I.html',
  't01':'T01 Solid waste Management.html','t02':'T02 Liquid waste Management.html',
  't03':'T03 Hazardous Waste Management.html',
  't17':'T17 Full Length Test-Series Technical.html',
  't44':'T44 Full Length Test-Series NonTech.html',
};
const paperFile=ID_MAP[testId]||'T01 Solid waste Management.html';
const paperName=testName;

document.getElementById('ptitle').textContent='ASWMO — '+paperName;
document.getElementById('ptype').textContent=paperName;

function render(){
  const q=questions[idx];
  if(!q){document.getElementById('qText').textContent='No data. Check: '+paperFile;return;}
  document.getElementById('qNum').textContent=idx+1;
  document.getElementById('qTotal').textContent=questions.length;
  document.getElementById('qText').textContent=q.q;
  document.getElementById('opts').innerHTML=q.options.map((o,i)=>
    `<div class="option ${answers[idx]==(i+1)?'selected':''}" onclick="select(${i+1})">${String.fromCharCode(65+i)}. ${o}</div>`
  ).join('');
}
window.select=o=>{answers[idx]=o; render();};
window.prev=()=>{if(idx>0){idx--; render();}};
window.next=()=>{if(idx<questions.length-1){idx++; render();}};

function submitTest(){clearInterval(timerInt); let c=0; for(let i=0;i<questions.length;i++){if(answers[i]==questions[i].answer)c++;} const pct=Math.round(c/questions.length*100)||0; document.getElementById('qCard').classList.add('hidden'); document.getElementById('resCard').classList.remove('hidden'); document.getElementById('score').textContent=pct+'%'; document.getElementById('detail').innerHTML='<b>'+c+'/'+questions.length+'</b> correct • '+Math.round(timerSec/60)+' min taken';}

function tick(){timerSec--; document.getElementById('timer').textContent=Math.floor(timerSec/60)+':'+String(timerSec%60).padStart(2,'0'); document.getElementById('bar').style.width=(timerSec/(65*60)*100)+'%'; if(timerSec<=0){clearInterval(timerInt); submitTest();}}

window.onload=()=>{
  const safe=paperFile.replace('.html','').replace(' ','-').replace('&','and').replace("'","");
  const url='papers/'+safe+'.json';
  document.getElementById('qText').textContent='Loading... ('+url+')';
  fetch(url).then(r=>{if(!r.ok)throw new Error('HTTP '+r.status+' for '+url); return r.json();})
    .then(d=>{questions=Array.isArray(d)?d:[]; document.getElementById('qTotal').textContent=questions.length; render(); timerInt=setInterval(tick,1000);})
    .catch(e=>{document.getElementById('qText').textContent='Error: '+e.message+' | URL: '+url;});
};
</script>
</body></html>
