<script>
const DATA=[{"id":"85007","q":"Which of the following is NOT a component of Integrated Solid Waste Management (ISWM)?","options":["Waste collection and transportation","Waste processing and treatment","Waste disposal","Waste import and export"],"answer":"4","solution":"ISWM includes generation, storage, collection, transport, processing, and disposal. Waste import/export is a transboundary issue, not a component of ISWM. So (d) is correct. Positive Mark: 0.8 Negative Mark: 0"},{"id":"85008","q":"A city generates 450 tonnes of municipal solid waste per day. If the per capita generation rate is 0.65 kg/day, what is the population of the city?","options":["292,308","492,308","692,308","892,308"],"answer":"3","solution":"Total waste = 450 tonnes/day = 4,50,000 kg/day. Per capita = 0.65 kg/day. So population = 450000 \u00f7 0.65 = 692307.69 \u2248 692,308 persons. Positive Mark: 0.8 Negative Mark: 0"},{"id":"85009","q":"As per SWM Rules 2016, the maximum distance for establishing a transfer station from the disposal site in large cities to save transportation time is:","options":["5 km","10 km","15 km","20 km"],"answer":"3","solution":"According to SWM Rules 2016, if disposal site is >15 km away, a transfer station becomes economical. So answer is 15 km. Positive Mark: 0.8 Negative Mark: 0"},{"id":"85010","q":"The first stage of anaerobic digestion in landfills is:","options":["Methanogenesis","Acidogenesis","Hydrolysis","Acetogenesis"],"answer":"3","solution":"The sequence is: Hydrolysis \u2192 Acidogenesis \u2192 Acetogenesis \u2192 Methanogenesis. So first stage is Hydrolysis. Positive Mark: 0.8 Negative Mark: 0"},{"id":"85011","q":"The C/N ratio for optimal composting of municipal solid waste is:","options":["10:1 to 15:1","20:1 to 25:1","30:1 to 50:1","60:1 to 80:1"],"answer":"3","solution":"Optimal C/N is 30:1 to 50:1. Too high \u2192 slow decomposition, too low \u2192 ammonia loss & odor. Positive Mark: 0.8 Negative Mark: 0"},{"id":"85012","q":"In the context of hazardous waste management, what does \"encapsulation\" refer to?","options":["Breaking down toxic substances using microorganisms","Complete coating of toxic particles with a new substance","Burning waste at high temperatures","Separating waste based on density"],"answer":"2","solution":"Encapsulation = coating toxic particles with cement, polymers, or glass to prevent leaching. Positive Mark: 0.8 Negative Mark: 0"},{"id":"85013","q":"A trickling filter has an influent BOD of 280 mg/L and effluent BOD of 28 mg/L. Calculate the BOD removal efficiency.","options":["70%","80%","90%","95%"],"answer":"3","solution":"Efficiency = [(280-28)/280] \u00d7 100 = (252/280)\u00d7100 = 90%. Positive Mark: 0.8 Negative Mark: 0"},{"id":"85014","q":"Under the Biomedical Waste Management Rules 2016, any person aggrieved by an order of the prescribed authority may appeal to:","options":["Central Pollution Control Board","Secretary (Environment) of the State Government","National Green Tribunal","Supreme Court"],"answer":"2","solution":"Rule 14 says appeal lies to Secretary (Environment) of State Govt or UT within 30 days. Positive Mark: 0.8 Negative Mark: 0"},{"id":"85015","q":"The process of \"shredding\" in solid waste management refers to:","options":["Biological decomposition of organic waste","Burning waste at high temperatures","Cutting and tearing of waste to reduce size","Separating waste based on particle size"],"answer":"3","solution":"Shredding is mechanical size reduction by cutting & tearing. Helps in handling & treatment. Positive Mark: 0.8 Negative Mark: 0"},{"id":"85016","q":"A population of 75,000 generates wastewater at 150 Lpcd. What is the average daily flow in m\u00b3/day?","options":["11,250 m\u00b3/day","10,250 m\u00b3/day","9,250 m\u00b3/day","8,250 m\u00b3/day"],"answer":"1","solution":"Flow = 75000 \u00d7 150 L/day = 11,250,000 L/day = 11,250 m\u00b3/day (since 1 m\u00b3 = 1000 L). Positive Mark: 0.8 Negative Mark: 0"},{"id":"85017","q":"Which of the following is NOT a type of sanitary landfill method?","options":["Area method","Trench method","Depression method","Combustion method"],"answer":"4","solution":"Landfill methods are area, trench, depression/valley fill. Combustion is thermal treatment. Positive Mark: 0.8 Negative Mark: 0"},{"id":"85018","q":"The Sludge Volume Index (SVI) is defined as:","options":["Volume occupied by 1 g of sludge solids after 30 minutes settling (mL/g)","Volume occupied by 1 kg of sludge solids after 1 hour settling (mL/kg)","Mass of sludge per unit volume (kg/m\u00b3)","Ratio of sludge volume to wastewater volume"],"answer":"1","solution":"SVI = (settled sludge volume in mL/L \u00d7 1000) / (MLSS in mg/L). Unit is mL/g. Positive Mark: 0.8 Negative Mark: 0"},{"id":"85019","q":"As per Solid Waste Management Rules 2016, source segregation of waste is mandatory into how many streams?","options":["2 streams","3 streams","4 streams","5 streams"],"answer":"2","solution":"Three streams: Wet (biodegradable), Dry (recyclable), Domestic hazardous waste. Positive Mark: 0.8 Negative Mark: 0"},{"id":"85020","q":"Which of the following correctly represents the waste management hierarchy from most preferred to least preferred?","options":["Landfill \u2192 Incineration \u2192 Recycling \u2192 Reuse \u2192 Prevention","Prevention \u2192 Reuse \u2192 Recycling \u2192 Recovery \u2192 Disposal","Disposal \u2192 Recovery \u2192 Recycling \u2192 Reuse \u2192 Prevention","Recycling \u2192 Prevention \u2192 Reuse \u2192 Disposal \u2192 Recovery"],"answer":"2","solution":"Hierarchy: Prevention > Reuse > Recycling > Recovery > Disposal. (b) is correct. Positive Mark: 0.8 Negative Mark: 0"},{"id":"85021","q":"The characteristic of waste that determines the amount of moisture retained against gravitational pull is called:","options":["Moisture content","Field capacity","Permeability","Porosity"],"answer":"2","solution":"Field capacity = moisture retained against gravity. Exceeds this \u2192 leachate forms. Positive Mark: 0.8 Negative Mark: 0"},{"id":"85022","q":"A chemical industry discharges wastewater containing 500 mg/L of phenol. After treatment, the concentration reduces to 25 mg/L. What is the percentage removal of phenol?","options":["85%","90%","95%","98%"],"answer":"3","solution":"Removal Positive Mark: 0.8 Negative Mark: 0"},{"id":"85023","q":"Which type of earthworm is most suitable for vermicomposting?","options":["Deep-burrowing anecic worms","Surface-dwelling epigeic worms","Soil-dwelling endogeic worms","Aquatic worms"],"answer":"2","solution":"Epigeic worms like Eisenia fetida live in surface litter, high reproduction, good for composting. Positive Mark: 0.8 Negative Mark: 0"},{"id":"85024","q":"Under the Plastic Waste Management Rules 2016, the registration certificate for manufacturing plastic carry bags is obtained from:","options":["Central Pollution Control Board","State Pollution Control Board","Ministry of Environment","Municipal Corporation"],"answer":"2","solution":"Rule 13 says registration from SPCB or PCC of respective state/UT. Positive Mark: 0.8 Negative Mark: 0"},{"id":"85025","q":"The gas produced in landfills that has the highest calorific value is:","options":["Carbon dioxide","Methane","Hydrogen sulfide","Nitrogen"],"answer":"2","solution":"Methane has calorific value ~8600-9000 kcal/m\u00b3. CO\u2082, H\u2082S, N\u2082 have negligible CV. Positive Mark: 0.8 Negative Mark: 0"},{"id":"85026","q":"A rectangular sedimentation tank treats 4 MLD of wastewater. If the detention time is 2 hours, what is the tank volume?","options":["222.3 m\u00b3","333.3 m\u00b3","444.4 m\u00b3","555.5 m\u00b3"],"answer":"2","solution":"Flow = 4 MLD = 4000 m\u00b3/day. DT = 2 hrs = 2/24 = 0.0833 days. Volume = 4000 \u00d7 0.0833 = 333.3 m\u00b3. Positive Mark: 0.8 Negative Mark: 0"},{"id":"85027","q":"Which of the following is NOT a physical characteristic of municipal solid waste?","options":["Density","Moisture content","Chemical Oxygen Demand","Particle size"],"answer":"3","solution":"COD is a chemical characteristic, not physical. Density, moisture, particle size are physical. Positive Mark: 0.8 Negative Mark: 0"},{"id":"85028","q":"In the activated sludge process, the Food to Microorganism (F/M) ratio for conventional systems typically ranges from:","options":["0.05 to 0.1 d\u207b\u00b9","0.2 to 0.4 d\u207b\u00b9","0.5 to 0.8 d\u207b\u00b9","1.0 to 1.5 d\u207b\u00b9"],"answer":"2","solution":"Conventional ASP: F/M = 0.2-0.4 d\u207b\u00b9. Extended aeration: 0.05-0.15. High-rate: 0.4-1.0. Positive Mark: 0.8 Negative Mark: 0"},{"id":"85029","q":"Which of the following statements about Refuse Derived Fuel (RDF) is INCORRECT?","options":["RDF is produced from non-recyclable waste","RDF has higher calorific value than raw MSW","RDF can be used in cement kilns","RDF production requires no processing"],"answer":"4","solution":"RDF production needs shredding, screening, drying, pelletizing. So \"no processing\" is false. Positive Mark: 0.8 Negative Mark: 0"},{"id":"85030","q":"The safe limit of dissolved solids (inorganic) in treated leachate for land disposal as per SWM Rules 2016 is:","options":["1,000 mg/L","1,500 mg/L","2,100 mg/L","2,500 mg/L"],"answer":"3","solution":"Schedule II of SWM Rules 2016 says dissolved solids (inorganic) max = 2100 mg/L. Positive Mark: 0.8 Negative Mark: 0"},{"id":"85031","q":"The permissible limit of arsenic in compost as per FCO 2009 is:","options":["5 mg/kg","10 mg/kg","15 mg/kg","20 mg/kg"],"answer":"2","solution":"According to the Fertiliser (Control) Order (FCO) 2009 , the permissible limit for Arsenic (As) in organic compost is established to ensure environmental safety and prevent toxic metals from entering the food chain. Arsenic Limit: The specification for organic compost explicitly states a maximum limit of 10.00 mg/kg . Applicability: This standard applies to organic compost produced from sources like municipal solid waste to ensure it does not pose a hazard when used for agricultural purposes."},{"id":"85032","q":"The formula for critical scouring velocity in grit chamber design is given by:","options":["Vc = \u221a(gd)","Vc = \u221a(2gd)","Vc = 3.5\u221a(gd(G-1))","Vc = 3.5\u221a(gd)"],"answer":"3","solution":"Modified Shields formula: Vc = 3.5\u221a[gd(G-1)]. G = specific gravity of particle. Positive Mark: 0.8 Negative Mark: 0"},{"id":"85033","q":"Which color bin is designated for collection of dry (non-biodegradable) waste as per SWM Rules 2026?","options":["Green","Blue","Red","Yellow"],"answer":"2","solution":"As per the Solid Waste Management (SWM) Rules 2026, which went into effect on April 1, 2026, the blue bin is designated for the collection of dry (non-biodegradable) waste, including plastics, paper, glass, metal, wood, and rubber. This is part of a mandatory four-stream segregation system. 4-Bin System Breakdown (SWM Rules 2026): Blue Bin: Dry/Recyclable waste (plastics, paper, glass, metal, wood). Green Bin: Wet/Biodegradable waste (food waste, kitchen waste, fruit/vegetable peels). Red Bin: Sanitary waste (diapers, pads, condoms). Black Bin: Domestic Hazardous waste (batteries, bulb, medicines, paints). The 2026 rules (as discussed on) enhance the 2016 framework by enforcing strict, 4-way source segregation to improve recycling and reduce landfill usage."},{"id":"85034","q":"The BOD\u2085 of a wastewater sample is 200 mg/L. If the deoxygenation constant k (base 10) is 0.15 d\u207b\u00b9 at 20\u00b0C, calculate the ultimate BOD (L\u2080).","options":["250 mg/L","300 mg/L","350 mg/L","400 mg/L"],"answer":"1","solution":"\u2248 243 mg/L \u2248 250 mg/L. Positive Mark: 0.8 Negative Mark: 0"},{"id":"85035","q":"Which of the following is NOT a method of hazardous waste treatment?","options":["Neutralization","Chemical precipitation","Aerobic composting","Stabilization and solidification"],"answer":"3","solution":"Aerobic composting is for non-hazardous organic waste, not for hazardous waste. Positive Mark: 0.8 Negative Mark: 0"},{"id":"85036","q":"A landfill receives 500 tonnes/day of waste. If the compacted density is 750 kg/m\u00b3 and the cell height is 3 m, what area is required per day?","options":["111 m\u00b2","222 m\u00b2","333 m\u00b2","444 m\u00b2"],"answer":"2","solution":"Volume/day = 500,000 kg \u00f7 750 kg/m\u00b3 = 666.67 m\u00b3. Area = Volume/Height = 666.67/3 = 222.22 m\u00b2. Positive Mark: 0.8 Negative Mark: 0"},{"id":"85037","q":"The principle of \"Polluter Pays\" in environmental law means:","options":["Polluters can pollute by paying fines","Polluters are responsible for remediation costs","Only industries must pay for pollution","Government pays for pollution control"],"answer":"2","solution":"Polluter Pays Principle means polluter bears cost of damage & remediation. Positive Mark: 0.8 Negative Mark: 0"},{"id":"85038","q":"The optimum temperature range for thermophilic anaerobic digestion is:","options":["20-30\u00b0C","30-40\u00b0C","40-55\u00b0C","55-65\u00b0C"],"answer":"4","solution":"Thermophilic range = 55-65\u00b0C (optimal 55-60\u00b0C). Mesophilic = 30-40\u00b0C. Positive Mark: 0.8 Negative Mark: 0"},{"id":"85039","q":"Under the E-Waste (Management) Rules 2016, Extended Producer Responsibility (EPR) authorization is valid for:","options":["2 years","3 years","4 years","5 years"],"answer":"4","solution":"Rule 12 says EPR authorization valid for 5 years, renewable for 5 years. Positive Mark: 0.8 Negative Mark: 0"},{"id":"85040","q":"The process of converting organic waste into nutrient-rich soil conditioner using earthworms is called:","options":["Aerobic composting","Anaerobic composting","Vermicomposting","Windrow composting"],"answer":"3","solution":"Vermicomposting uses earthworms (Eisenia fetida, Eudrilus eugeniae). Positive Mark: 0.8 Negative Mark: 0"},{"id":"85041","q":"A wastewater sample has DO of 6 mg/L at 20\u00b0C. If saturated DO at 20\u00b0C is 9.17 mg/L, calculate the DO deficit.","options":["1.17 mg/L","2.17 mg/L","3.17 mg/L","4.17 mg/L"],"answer":"3","solution":"DO deficit = Saturated DO - Actual DO = 9.17 - 6 = 3.17 mg/L. Positive Mark: 0.8 Negative Mark: 0"},{"id":"85042","q":"Which of the following is NOT correctly matched?","options":["Pyrolysis - Endothermic process","Incineration - Exothermic process","Gasification - Partial oxidation","Composting - Thermal treatment"],"answer":"4","solution":"Composting is biological, not thermal treatment. Others are correctly matched. Positive Mark: 0.8 Negative Mark: 0"},{"id":"85043","q":"As per SWM Rules 2016, the minimum distance of a landfill site from a highway is:","options":["50 m","100 m","200 m","500 m"],"answer":"3","solution":"Schedule III: From highway = 200 m, from river = 100 m, from airport = 20 km. Positive Mark: 0.8 Negative Mark: 0"},{"id":"85044","q":"The retention time in a grit chamber for design is typically:","options":["10-20 seconds","30-60 seconds","2-3 minutes","5-10 minutes"],"answer":"2","solution":"Grit chamber detention time = 30-60 seconds to allow sand/grit to settle but keep organics suspended. Positive Mark: 0.8 Negative Mark: 0"},{"id":"85045","q":"Which of the following is NOT a source of hazardous waste?","options":["Petroleum refining","Electroplating industries","Vegetable market waste","Pharmaceutical manufacturing"],"answer":"3","solution":"Vegetable market waste is biodegradable MSW, not hazardous. Positive Mark: 0.8 Negative Mark: 0"},{"id":"85046","q":"The formula for calculating the number of trips per day for a hauled container system is:","options":["N = (Vd \u00d7 f) / (Vc \u00d7 r)","N = (Vd \u00d7 r) / (Vc \u00d7 f)","N = (Vc \u00d7 r) / (Vd \u00d7 f)","N = (Vc \u00d7 f) / (Vd \u00d7 r)"],"answer":"1","solution":"N = (Vd \u00d7 f) / (Vc \u00d7 r). Vd = waste vol/day, f = container utilization, Vc = container vol, r = compaction ratio. Positive Mark: 0.8 Negative Mark: 0"},{"id":"85047","q":"The Bangalore method of composting is:","options":["Aerobic method","Anaerobic method","Facultative method","Mechanical method"],"answer":"2","solution":"Bangalore method = anaerobic composting in pits, no turning, takes 4-6 months. Positive Mark: 0.8 Negative Mark: 0"},{"id":"85048","q":"The permissible limit of chloride in drinking water as per IS 10500 is:","options":["150 mg/L","200 mg/L","250 mg/L","500 mg/L"],"answer":"3","solution":"IS 10500:2012: Acceptable chloride = 250 mg/L, cause for rejection = 1000 mg/L. Positive Mark: 0.8 Negative Mark: 0"},{"id":"85049","q":"A composting plant processes 20 tonnes/day of organic waste. If the composting period is 30 days and the waste density is 600 kg/m\u00b3, what volume of composting area is required?","options":["500 m\u00b3","1,000 m\u00b3","1,500 m\u00b3","2,000 m\u00b3"],"answer":"2","solution":"Total waste = 20\u00d730 = 600 tonnes = 600,000 kg. Volume = Mass/Density = 600,000/600 = 1000 m\u00b3. Positive Mark: 0.8 Negative Mark: 0"},{"id":"85050","q":"Which of the following statements about leachate is CORRECT?","options":["Leachate is formed only in dry climates","Leachate is pure water from landfills","Leachate is contaminated liquid from landfills","Leachate is beneficial for groundwater"],"answer":"3","solution":"Leachate is contaminated liquid formed when water percolates through waste. Contains BOD, COD, heavy metals, pathogens. Positive Mark: 0.8 Negative Mark: 0"},{"id":"85051","q":"Under the Environmental Protection Act 1986, the term \"environment\" includes:","options":["Water, air, and land only","Water, air, land, and the interrelationship between them","Only air and water","Only land and water"],"answer":"2","solution":"Section 2(a): Environment includes water, air, land, and interrelationship among them, and with living beings & property. Positive Mark: 0.8 Negative Mark: 0"},{"id":"85052","q":"The purpose of a flow equalization tank in wastewater treatment is to:","options":["Increase BOD removal","Dampen flow variations","Remove suspended solids","Kill pathogens"],"answer":"2","solution":"Flow equalization dampens peak flows & low flows, provides constant flow to downstream units. Positive Mark: 0.8 Negative Mark: 0"},{"id":"85053","q":"The minimum thickness of daily cover material in a sanitary landfill as per CPHEEO manual is:","options":["10 cm","15 cm","20 cm","30 cm"],"answer":"3","solution":"Daily cover = minimum 20 cm compacted soil. Final cover = minimum 60 cm. Positive Mark: 0.8 Negative Mark: 0"},{"id":"85054","q":"The COD/BOD ratio for a wastewater sample is 2.5. If BOD is 120 mg/L, what is the COD?","options":["200 mg/L","250 mg/L","300 mg/L","350 mg/L"],"answer":"3","solution":"COD = Ratio \u00d7 BOD = 2.5 \u00d7 120 = 300 mg/L. Positive Mark: 0.8 Negative Mark: 0"},{"id":"85055","q":"Which of the following is NOT a principle of the 3R concept in waste management?","options":["Reduce","Reuse","Recycle","Recover"],"answer":"4","solution":"Traditional 3R = Reduce, Reuse, Recycle. Recovery is sometimes added as 4th R. Positive Mark: 0.8 Negative Mark: 0"},{"id":"85056","q":"The design parameter \"Organic Loading Rate\" (OLR) for a trickling filter is expressed as:","options":["kg BOD/m\u00b3/day","kg SS/m\u00b3/day","m\u00b3/m\u00b3/day","kg/m\u00b3/day"],"answer":"1","solution":"OLR = kg of BOD applied per m\u00b3 of filter media per day. Positive Mark: 0.8 Negative Mark: 0"},{"id":"85057","q":"As per SWM Rules 2016, the maximum time allowed for bioremediation or capping of old and abandoned dumpsites is:","options":["2 years","3 years","5 years","7 years"],"answer":"3","solution":"Time limit = 5 years from notification date (April 8, 2016). Positive Mark: 0.8 Negative Mark: 0"},{"id":"85058","q":"Which of the following is an attached growth biological treatment process?","options":["Activated Sludge Process","Oxidation ditch","Trickling filter","Sequential Batch Reactor"],"answer":"3","solution":"Attached growth = microorganisms attached to media (trickling filter, RBC). Suspended growth = ASP, oxidation ditch, SBR. Positive Mark: 0.8 Negative Mark: 0"},{"id":"85059","q":"The calorific value of methane gas is approximately:","options":["3,600 kJ/m\u00b3","8,600 kcal/m\u00b3","15,000 kJ/m\u00b3","25,000 kcal/m\u00b3"],"answer":"2","solution":"Methane CV \u2248 8600 kcal/m\u00b3 or 35,800-37,500 kJ/m\u00b3. Positive Mark: 0.8 Negative Mark: 0"},{"id":"85060","q":"A septic tank is designed as a combination of:","options":["Screening and aeration","Sedimentation and digestion","Filtration and disinfection","Flocculation and sedimentation"],"answer":"2","solution":"Septic tank = sedimentation (settling) + anaerobic digestion (sludge decomposition). Positive Mark: 0.8 Negative Mark: 0"},{"id":"85061","q":"The permissible limit of lead in compost as per FCO 2009 is:","options":["50 mg/kg","100 mg/kg","150 mg/kg","200 mg/kg"],"answer":"2","solution":"FCO 2009: Lead = 100 mg/kg. Cadmium = 5, Chromium = 50, Copper = 300, Nickel = 50, Arsenic = 10, Zinc = 1000. Positive Mark: 0.8 Negative Mark: 0"},{"id":"85062","q":"The formula for theoretical oxygen demand (ThOD) of a compound C\u2086H\u2081\u2082O\u2086 is:","options":["C\u2086H\u2081\u2082O\u2086 + 6O\u2082 \u2192 6CO\u2082 + 6H\u2082O","C\u2086H\u2081\u2082O\u2086 + 3O\u2082 \u2192 6CO\u2082 + 6H\u2082O","C\u2086H\u2081\u2082O\u2086 + 12O\u2082 \u2192 6CO\u2082 + 6H\u2082O","C\u2086H\u2081\u2082O\u2086 + 9O\u2082 \u2192 6CO\u2082 + 6H\u2082O"],"answer":"1","solution":"Balanced equation for glucose: C\u2086H\u2081\u2082O\u2086 + 6O\u2082 \u2192 6CO\u2082 + 6H\u2082O. Positive Mark: 0.8 Negative Mark: 0"},{"id":"85063","q":"Which of the following is NOT a type of solid waste collection system?","options":["Curb service","Alley service","Setout-setback service","Vacuum service"],"answer":"4","solution":"Standard systems: curb, alley, setout-setback, backyard, door-to-door. Vacuum service is not a main type. Positive Mark: 0.8 Negative Mark: 0"},{"id":"85064","q":"The mean cell residence time (\u03b8c) for extended aeration activated sludge process is typically:","options":["1-3 days","3-5 days","5-10 days","20-30 days"],"answer":"4","solution":"Extended aeration MCRT = 20-30 days. Conventional = 5-10 days. High-rate = 1-3 days. Positive Mark: 0.8 Negative Mark: 0"},{"id":"85065","q":"The amount of biomedical waste generated in India annually is approximately:","options":["100 TPD","250 TPD","500 TPD","1,000 TPD"],"answer":"3","solution":"CPCB data: ~500 tonnes per day of biomedical waste in India. Positive Mark: 0.8 Negative Mark: 0"},{"id":"85066","q":"A landfill has an area of 5 hectares and average depth of 15 m. If the compacted density is 800 kg/m\u00b3, what is the total waste capacity?","options":["600,000 tonnes","800,000 tonnes","1,000,000 tonnes","1,200,000 tonnes"],"answer":"1","solution":"Area = 5 ha = 50,000 m\u00b2. Volume = 50,000 \u00d7 15 = 750,000 m\u00b3. Capacity = 750,000 \u00d7 0.8 tonnes/m\u00b3 = 600,000 tonnes. Positive Mark: 0.8 Negative Mark: 0"},{"id":"85067","q":"Which of the following is a primary treatment unit in wastewater treatment?","options":["Activated sludge tank","Trickling filter","Grit chamber","Anaerobic digester"],"answer":"3","solution":"Primary treatment = screens, grit chamber, primary sedimentation tank. Others are secondary or sludge treatment. Positive Mark: 0.8 Negative Mark: 0"},{"id":"85068","q":"The \"Kabadi system\" in India is associated with:","options":["Waste collection","Waste recycling","Waste transportation","Waste disposal"],"answer":"2","solution":"Kabadiwalas (scrap dealers) purchase recyclables from households \u2192 informal recycling sector. Positive Mark: 0.8 Negative Mark: 0"},{"id":"85069","q":"The minimum dissolved oxygen level required to maintain aerobic conditions in a water body is:","options":["1 mg/L","2 mg/L","4 mg/L","6 mg/L"],"answer":"3","solution":"Minimum DO for fish survival = 4 mg/L. Below 2 mg/L causes fish kills. Positive Mark: 0.8 Negative Mark: 0"},{"id":"85070","q":"As per Hazardous Waste Management Rules 2016, the storage period of hazardous waste at the facility shall not exceed:","options":["30 days","45 days","60 days","90 days"],"answer":"4","solution":"Max storage = 90 days. For small generators (<5 tonnes/year) = 180 days. Positive Mark: 0.8 Negative Mark: 0"},{"id":"85071","q":"The function of a trommel screen in MSW processing is:","options":["Magnetic separation of metals","Size separation of waste","Air classification of light materials","Compaction of waste"],"answer":"2","solution":"Trommel screen = rotating cylindrical screen for size separation. Positive Mark: 0.8 Negative Mark: 0"},{"id":"85072","q":"The nitrogen cycle process that converts ammonia to nitrate is called:","options":["Ammonification","Nitrification","Denitrification","Nitrogen fixation"],"answer":"2","solution":"Nitrification: Ammonia (NH\u2083) \u2192 Nitrite (NO\u2082\u207b) \u2192 Nitrate (NO\u2083\u207b). Positive Mark: 0.8 Negative Mark: 0"},{"id":"85073","q":"The maximum concentration of methane allowed in landfill gas before it reaches Lower Explosive Limit (LEL) is:","options":["5% of LEL","10% of LEL","25% of LEL","50% of LEL"],"answer":"3","solution":"Methane should not exceed 25% of LEL. LEL for methane = 5%, so 25% of LEL = 1.25% methane. Positive Mark: 0.8 Negative Mark: 0"},{"id":"85074","q":"The correct relationship between Theoretical Oxygen Demand (ThOD), Chemical Oxygen Demand (COD), and Biochemical Oxygen Demand (BOD) is:","options":["ThOD > COD > BOD","COD > ThOD > BOD","BOD > COD > ThOD","ThOD = COD = BOD"],"answer":"1","solution":"ThOD (complete theoretical) > COD (chemical, may not oxidize everything) > BOD (biological, partial). Positive Mark: 0.8 Negative Mark: 0"},{"id":"85075","q":"Which of the following is NOT a requirement for a good composting process?","options":["Proper C/N ratio","Adequate moisture","Complete absence of oxygen","Proper temperature"],"answer":"3","solution":"Composting requires oxygen (aerobic). Absence of oxygen = anaerobic composting (slower, odorous). Positive Mark: 0.8 Negative Mark: 0"},{"id":"85076","q":"A wastewater treatment plant receives 10 MLD flow with BOD 250 mg/L. Calculate the BOD load in kg/day.","options":["1,500 kg/day","2,000 kg/day","2,500 kg/day","3,000 kg/day"],"answer":"3","solution":"Flow = 10 MLD = 10,000 m\u00b3/day. BOD = 250 mg/L = 0.25 kg/m\u00b3. Load = 10,000 \u00d7 0.25 = 2500 kg/day. Positive Mark: 0.8 Negative Mark: 0"},{"id":"85077","q":"The \"Indore method\" of composting is characterized by:","options":["Anaerobic decomposition in pits","Aerobic decomposition with regular turning","Use of earthworms","Mechanical processing"],"answer":"2","solution":"Indore method = aerobic, regular turning (every 2-3 weeks), takes 2-3 months. Positive Mark: 0.8 Negative Mark: 0"},{"id":"85078","q":"Which of the following is NOT a criterion for hazardous waste as per HW Rules?","options":["Toxicity","Corrosivity","Reactivity","Biodegradability"],"answer":"4","solution":"Hazardous characteristics: toxicity, corrosivity, reactivity, ignitability, infectivity. Biodegradability is not a criterion. Positive Mark: 0.8 Negative Mark: 0"},{"id":"85079","q":"The efficiency of a trickling filter for BOD removal can be calculated using:","options":["Monod equation","NRC formula","Hazen formula","Stoke's law"],"answer":"2","solution":"National Research Council (NRC) formula is used for trickling filter efficiency. Positive Mark: 0.8 Negative Mark: 0"},{"id":"85080","q":"The minimum thickness of final cover in a sanitary landfill is:","options":["20 cm","40 cm","60 cm","100 cm"],"answer":"4","solution":"The minimum total thickness of the final cover in a sanitary landfill, designed to ensure proper closure and environmental protection, is typically 1 meter (or approximately 3 feet). Key Components of the Final Cover (Total 1 meter): Barrier Soil Layer: A lower layer of compacted clay or amended soil, usually 60 cm (2 feet) thick, designed to minimize water infiltration (permeability \\(< 1 \\times 10^{-7} cm/sec\\) Drainage Layer: A middle layer, often around 15 cm thick. Vegetative/Erosion Layer: A top layer, usually 45 cm (1.5 feet) thick, capable of supporting plant growth to prevent erosion."},{"id":"85081","q":"The correct sequence of stages in sludge digestion is:","options":["Acid fermentation \u2192 Acid regression \u2192 Alkaline fermentation","Alkaline fermentation \u2192 Acid fermentation \u2192 Acid regression","Acid regression \u2192 Alkaline fermentation \u2192 Acid fermentation","Acid fermentation \u2192 Alkaline fermentation \u2192 Acid regression"],"answer":"1","solution":"Sequence: Acid fermentation (pH drops) \u2192 Acid regression (pH rises) \u2192 Alkaline fermentation (methane production). Positive Mark: 0.8 Negative Mark: 0"},{"id":"85082","q":"Which of the following is NOT a recyclable material from e-waste?","options":["Copper","Gold","Palladium","Asbestos"],"answer":"4","solution":"E-waste recyclables: gold, silver, copper, palladium, platinum, aluminum, plastics. Asbestos is hazardous, not recycled. Positive Mark: 0.8 Negative Mark: 0"},{"id":"85083","q":"The detention time for primary sedimentation tank in municipal wastewater treatment is typically:","options":["0.5-1.0 hours","1.5-2.5 hours","3.0-4.0 hours","4.5-6.0 hours"],"answer":"2","solution":"PST detention time = 1.5-2.5 hours (typically 2 hours). Positive Mark: 0.8 Negative Mark: 0"},{"id":"85084","q":"As per CPCB guidelines, the per capita solid waste generation in large cities is approximately:","options":["0.2-0.3 kg/day","0.3-0.4 kg/day","0.5 kg/day","0.6-0.8 kg/day"],"answer":"3","solution":"Large cities (>0.5 million population): ~0.5 kg/day. Metro cities: 0.5-0.6 kg/day. Positive Mark: 0.8 Negative Mark: 0"},{"id":"85085","q":"Which of the following is an advanced thermal treatment technology for waste?","options":["Open burning","Mass burning incineration","Plasma gasification","Open dumping"],"answer":"3","solution":"Plasma gasification (>5000\u00b0C) is advanced. Mass burning is conventional. Open burning/dumping not acceptable. Positive Mark: 0.8 Negative Mark: 0"},{"id":"85086","q":"The specific gravity of particles considered for grit chamber design is:","options":["1.5-2.0","2.0-2.4","2.4-2.65","2.65-3.0"],"answer":"3","solution":"SG of sand/grit = 2.4-2.65. Particle size considered \u22650.2 mm. Positive Mark: 0.8 Negative Mark: 0"},{"id":"85087","q":"Under the E-Waste Rules 2016, the minimum area required for a recycler of 1 TPD capacity is:","options":["250 m\u00b2","500 m\u00b2","750 m\u00b2","1000 m\u00b2"],"answer":"2","solution":"Up to 1 TPD \u2192 500 m\u00b2. 1-5 TPD \u2192 1000 m\u00b2. >5 TPD \u2192 2000 m\u00b2. Positive Mark: 0.8 Negative Mark: 0"},{"id":"85088","q":"The process of \"bio-methanation\" involves:","options":["Aerobic decomposition of organic waste","Anaerobic production of methane from organic waste","Thermal treatment of waste","Mechanical separation of waste"],"answer":"2","solution":"Bio-methanation = anaerobic digestion to produce biogas (methane + CO\u2082). Positive Mark: 0.8 Negative Mark: 0"},{"id":"85089","q":"The maximum concentration of dissolved solids in drinking water as per IS 10500 (cause for rejection) is:","options":["500 mg/L","1000 mg/L","2000 mg/L","2500 mg/L"],"answer":"3","solution":"Acceptable TDS = 500 mg/L. Cause for rejection = 2000 mg/L (in absence of alternate source). Positive Mark: 0.8 Negative Mark: 0"},{"id":"85090","q":"A community of 50,000 persons generates solid waste at 0.6 kg/capita/day. If waste density is 400 kg/m\u00b3 and collection vehicle capacity is 8 m\u00b3, how many trips are required per day?","options":["7 trips","8 trips","9 trips","10 trips"],"answer":"4","solution":"Total waste = 50,000 \u00d7 0.6 = 30,000 kg/day. Volume = 30,000/400 = 75 m\u00b3/day. Trips = 75/8 = 9.375 \u2248 10 trips. Positive Mark: 0.8 Negative Mark: 0"},{"id":"85091","q":"Which of the following is NOT a component of Environmental Impact Assessment (EIA)?","options":["Screening","Scoping","Public hearing","Product marketing"],"answer":"4","solution":"EIA components: screening, scoping, impact analysis, mitigation, reporting, public hearing, decision making, post-monitoring. Positive Mark: 0.8 Negative Mark: 0"},{"id":"85092","q":"The optimum pH range for aerobic composting is:","options":["4.5-5.5","5.5-6.5","6.5-8.5","8.5-9.5"],"answer":"3","solution":"Optimum pH = 6.5-8.5 (near neutral). Below 6.5 inhibits microbes, above 8.5 causes ammonia loss. Positive Mark: 0.8 Negative Mark: 0"},{"id":"85093","q":"The SPCB's role in solid waste management includes:","options":["Formulating national policies","Issuing authorization for waste processing","Collecting waste from households","Operating landfills"],"answer":"2","solution":"SPCB issues authorizations, monitors standards. Collection & operation = ULBs. Policy = CPCB/MoEFCC. Positive Mark: 0.8 Negative Mark: 0"},{"id":"85094","q":"The gas produced in anaerobic digestion that causes rotten egg smell is:","options":["Methane","Carbon dioxide","Hydrogen sulfide","Ammonia"],"answer":"3","solution":"H\u2082S (hydrogen sulfide) = rotten egg smell. Methane & CO\u2082 are odorless. Positive Mark: 0.8 Negative Mark: 0"},{"id":"85095","q":"The term \"secure landfill\" is used for disposal of:","options":["Municipal solid waste","Hazardous waste","Biomedical waste","Electronic waste"],"answer":"2","solution":"Secure landfills = for hazardous waste (double liners, leachate collection, monitoring wells). Positive Mark: 0.8 Negative Mark: 0"},{"id":"85096","q":"Calculate the recirculation ratio for an activated sludge plant if return activated sludge flow is 2,500 m\u00b3/day and influent flow is 10,000 m\u00b3/day.","options":["0.20","0.25","0.30","0.35"],"answer":"2","solution":"Recirculation ratio = RAS flow / Influent flow = 2500/10000 = 0.25. Positive Mark: 0.8 Negative Mark: 0"},{"id":"85097","q":"Which of the following is NOT a type of composting method?","options":["Windrow composting","In-vessel composting","Vermicomposting","Hydrolysis composting"],"answer":"4","solution":"Hydrolysis is a stage in anaerobic digestion, not a composting method. Positive Mark: 0.8 Negative Mark: 0"},{"id":"85098","q":"The standard BOD test is conducted at 20\u00b0C for:","options":["3 days","5 days","7 days","10 days"],"answer":"2","solution":"Standard BOD test = 5 days at 20\u00b0C (BOD\u2085). Positive Mark: 0.8 Negative Mark: 0"},{"id":"85099","q":"As per SWM Rules 2016, which of the following is a duty of the waste generator?","options":["Establish processing facilities","Pay user fee to waste collector","Operate landfills","Frame bye-laws"],"answer":"2","solution":"Waste generator duties: segregate waste, pay user fee, pay spot fines, store hazardous waste separately. Positive Mark: 0.8 Negative Mark: 0"},{"id":"85100","q":"The purpose of a grit chamber is to remove:","options":["Organic suspended solids","Inorganic particles (sand, grit)","Dissolved organic matter","Pathogenic microorganisms"],"answer":"2","solution":"Grit chamber removes inorganic particles (sand, grit, glass, metals) with SG 2.4-2.65. Positive Mark: 0.8 Negative Mark: 0"},{"id":"85101","q":"The calorific value of RDF (Refuse Derived Fuel) typically ranges from:","options":["500-1,000 kcal/kg","1,000-2,000 kcal/kg","3,000-4,500 kcal/kg","5,000-7,000 kcal/kg"],"answer":"3","solution":"RDF = 3000-4500 kcal/kg. Raw MSW = 800-1500, Coal = 4000-7000, Plastics = 8000-11000. Positive Mark: 0.8 Negative Mark: 0"},{"id":"85102","q":"The minimum distance of a landfill from an airport as per SWM Rules 2016 is:","options":["5 km","10 km","20 km","30 km"],"answer":"3","solution":"Minimum distance from airport/airbase = 20 km (to prevent bird strikes). Positive Mark: 0.8 Negative Mark: 0"},{"id":"85103","q":"The recirculation factor for a high-rate trickling filter with recirculation ratio of 1.0 is:","options":["0.5","1.0","1.5","2.0"],"answer":"4","solution":"F = (1+R)/(1+0.1R)\u00b2 = (2)/(1.1)\u00b2 = 2/1.21 = 1.65 \u2248 1.5-2.0. Closest option is 2.0. Positive Mark: 0.8 Negative Mark: 0"},{"id":"85104","q":"Which of the following statements about composting is INCORRECT?","options":["Composting reduces waste volume","Composting produces greenhouse gases","Composting can only treat inorganic waste","Composting produces nutrient-rich soil conditioner"],"answer":"3","solution":"Composting treats organic waste, not inorganic. So (c) is incorrect. Positive Mark: 0.8 Negative Mark: 0"},{"id":"85105","q":"The formula for Sludge Volume Index (SVI) is:","options":["SVI = (Settled volume \u00d7 1000) / MLSS","SVI = (MLSS \u00d7 1000) / Settled volume","SVI = Settled volume \u00d7 MLSS \u00d7 1000","SVI = Settled volume / (MLSS \u00d7 1000)"],"answer":"1","solution":"SVI = (Settled sludge volume in mL/L \u00d7 1000) / (MLSS in mg/L). Unit = mL/g. Positive Mark: 0.8 Negative Mark: 0"},{"id":"85106","q":"A waste with pH 2.5 would be classified as:","options":["Toxic","Corrosive","Reactive","Ignitable"],"answer":"2","solution":"Corrosive = pH \u22642 or \u226512.5, or corrodes steel >6.35 mm/year. pH 2.5 is strongly acidic \u2192 corrosive. Positive Mark: 0.8 Negative Mark: 0"},{"id":"85107","q":"The efficiency of a single-stage trickling filter as per NRC formula with organic loading of 0.2 kg BOD/m\u00b3/day is approximately:","options":["70%","80%","90%","95%"],"answer":"3","solution":"E = 100/(1+0.44\u221a(W/VF)) = 100/(1+0.44\u221a0.2) = 100/(1+0.44\u00d70.447) = 100/(1+0.197) = 100/1.197 = 83.5% \u2248 90% (from options). Positive Mark: 0.8 Negative Mark: 0"},{"id":"85108","q":"Which of the following is NOT a component of the \"pollution prevention\" approach?","options":["Source reduction","Resource conservation","End-of-pipe treatment","Cleaner production"],"answer":"3","solution":"Pollution prevention = source reduction, resource conservation, cleaner production. End-of-pipe = pollution control, not prevention. Positive Mark: 0.8 Negative Mark: 0"},{"id":"85109","q":"The \"Methane number\" of biogas indicates:","options":["Methane concentration","Calorific value","Anti-knock property","Sulfur content"],"answer":"3","solution":"Methane number = anti-knock property (like octane number for gasoline). Biogas MN >130. Positive Mark: 0.8 Negative Mark: 0"},{"id":"85110","q":"A population equivalent (PE) of 1 represents BOD contribution of:","options":["20 g/day","40 g/day","60 g/day","80 g/day"],"answer":"2","solution":"1 PE = 40 g BOD\u2085/day (based on 150 Lpcd @ 200-250 mg/L BOD). Positive Mark: 0.8 Negative Mark: 0"},{"id":"85111","q":"The \"Biosorption\" process in activated sludge refers to:","options":["Settling of sludge","Adsorption of organics by microbial flocs","Aeration of mixed liquor","Disinfection of effluent"],"answer":"2","solution":"Biosorption = rapid adsorption/absorption of organics by microbial flocs (zoogreal mass). Positive Mark: 0.8 Negative Mark: 0"},{"id":"85112","q":"As per Hazardous Waste Rules 2016, \"co-processing\" refers to:","options":["Recycling of hazardous waste","Using waste as alternative fuel in cement kilns","Landfilling of hazardous waste","Incineration of hazardous waste"],"answer":"2","solution":"Co-processing = using hazardous waste as alternative fuel & raw material in cement kilns. Positive Mark: 0.8 Negative Mark: 0"},{"id":"85113","q":"The minimum daily cover thickness for MSW landfill as per SWM Rules 2016 is:","options":["10 cm","15 cm","20 cm","30 cm"],"answer":"1","solution":"As per the Solid Waste Management Rules 2016 (referenced in 2019/2020 guidelines), the minimum daily cover thickness for MSW landfill is 10 cm (or 100 mm) of soil, inert debris, or construction material, applied to the working face at the end of each operating day. Daily Cover: Minimum 10 cm (100 mm). Intermediate/Monsoon Cover: 40-65 cm."},{"id":"85114","q":"The BOD exertion rate constant (k) at 20\u00b0C for domestic sewage typically ranges from:","options":["0.05-0.10 d\u207b\u00b9","0.10-0.20 d\u207b\u00b9","0.20-0.30 d\u207b\u00b9","0.30-0.40 d\u207b\u00b9"],"answer":"2","solution":"k (base 10) at 20\u00b0C for domestic sewage = 0.10-0.20 d\u207b\u00b9. Positive Mark: 0.8 Negative Mark: 0"},{"id":"85115","q":"Which of the following is NOT a type of screening used in wastewater treatment?","options":["Bar screen","Fine screen","Micro screen","Magnetic screen"],"answer":"4","solution":"Magnetic separation is for solid waste (ferrous metals), not for wastewater screening. Positive Mark: 0.8 Negative Mark: 0"},{"id":"85116","q":"The concept of \"Cradle to Cradle\" in waste management means:","options":["Waste goes from production to disposal","Waste is designed to be completely recyclable","Waste is burned for energy","Waste is landfilled after use"],"answer":"2","solution":"Cradle to Cradle = products designed so all materials can be recycled or composted. \"Waste = food\". Positive Mark: 0.8 Negative Mark: 0"},{"id":"85117","q":"The minimum organic content required for composting is approximately:","options":["30%","40%","50%","60%"],"answer":"3","solution":"Minimum organic content = 50%. Higher organic content (>60%) gives better compost. Positive Mark: 0.8 Negative Mark: 0"},{"id":"85118","q":"A wastewater sample has BOD\u2085 of 180 mg/L and ultimate BOD of 300 mg/L. Calculate the BOD rate constant (k) base 10.","options":["0.10 d\u207b\u00b9","0.15 d\u207b\u00b9","0.20 d\u207b\u00b9","0.25 d\u207b\u00b9"],"answer":"2","solution":"BOD\u2085 From options, 0.15 is closest standard value. Positive Mark: 0.8 Negative Mark: 0"},{"id":"85119","q":"The main product of pyrolysis that has the highest calorific value is:","options":["Char","Pyrolysis oil","Syngas","Tar"],"answer":"2","solution":"Pyrolysis oil = 35-40 MJ/kg (highest). Syngas = 10-20 MJ/m\u00b3. Char = 20-30 MJ/kg. Positive Mark: 0.8 Negative Mark: 0"},{"id":"85120","q":"Which of the following is NOT a duty of CPCB under SWM Rules 2016?","options":["Coordinate with SPCBs for implementation","Provide technical guidelines","Collect waste from households","Formulate standards for groundwater, air, and soil"],"answer":"3","solution":"Waste collection from households = duty of ULBs, not CPCB. Positive Mark: 0.8 Negative Mark: 0"},{"id":"85121","q":"The specific gravity of municipal solid waste after compaction in a landfill is typically:","options":["0.2-0.4","0.4-0.6","0.6-0.8","0.8-1.0"],"answer":"3","solution":"Compacted MSW density = 600-800 kg/m\u00b3 \u2192 SG = 0.6-0.8 (water = 1000 kg/m\u00b3). Positive Mark: 0.8 Negative Mark: 0"},{"id":"85122","q":"The process of \"denitrification\" in wastewater treatment converts:","options":["Ammonia to nitrite","Nitrite to nitrate","Nitrate to nitrogen gas","Organic nitrogen to ammonia"],"answer":"3","solution":"Denitrification = Nitrate (NO\u2083\u207b) \u2192 Nitrogen gas (N\u2082) under anoxic conditions. Positive Mark: 0.8 Negative Mark: 0"},{"id":"85123","q":"The maximum distance from a landfill to a water supply well as per CPHEEO manual is:","options":["100 m","200 m","500 m","1000 m"],"answer":"2","solution":"Minimum distance from water supply well = 200 m (to prevent groundwater contamination). Positive Mark: 0.8 Negative Mark: 0"},{"id":"85124","q":"The removal efficiency of suspended solids in a primary sedimentation tank is typically:","options":["20-30%","30-40%","50-70%","80-90%"],"answer":"3","solution":"PST removal: SS = 50-70%, BOD = 25-35%, Scum = 90-95%. Positive Mark: 0.8 Negative Mark: 0"},{"id":"85125","q":"Which of the following statements about \"fly ash\" is CORRECT?","options":["Fly ash is generated from composting plants","Fly ash is a hazardous waste from incinerators","Fly ash is a beneficial material for construction","Fly ash is generated from anaerobic digesters"],"answer":"3","solution":"Fly ash from coal combustion is used in cement, concrete, bricks. From incinerators may be hazardous. Positive Mark: 0.8 Negative Mark: 0"},{"id":"85126","q":"The total solid waste generation in India per year is approximately:","options":["20 million tonnes","40 million tonnes","60 million tonnes","80 million tonnes"],"answer":"3","solution":"CPCB data: ~60 million tonnes MSW annually. Growing at 4-5% per year. Positive Mark: 0.8 Negative Mark: 0"},{"id":"85127","q":"The \"Odor threshold number\" for drinking water should ideally be:","options":["0","1","2","3"],"answer":"2","solution":"TON = (A+B)/A. TON = 1 means no dilution needed (no odor). Acceptable up to 3. Positive Mark: 0.8 Negative Mark: 0"},{"id":"85128","q":"The primary objective of \"waste characterization\" is to:","options":["Determine waste quantity","Determine waste composition and properties","Calculate collection costs","Design vehicles"],"answer":"2","solution":"Waste characterization = determining physical & chemical composition & properties for treatment design. Positive Mark: 0.8 Negative Mark: 0"},{"id":"85129","q":"The minimum dissolved oxygen level for supporting game fish (trout, salmon) is:","options":["2 mg/L","3 mg/L","5 mg/L","7 mg/L"],"answer":"3","solution":"Game fish = 5-6 mg/L minimum. Coarse fish = 4-5 mg/L. Survival only = 2-3 mg/L. Positive Mark: 0.8 Negative Mark: 0"},{"id":"85130","q":"The process of \"stabilization\" of hazardous waste refers to:","options":["Changing chemical properties to reduce toxicity","Physical encapsulation of waste","Burning waste at high temperature","Diluting waste with water"],"answer":"1","solution":"Stabilization = converting hazardous waste into less soluble/less toxic form by chemical change. Positive Mark: 0.8 Negative Mark: 0"},{"id":"85131","q":"The recirculation ratio in a high-rate trickling filter is defined as:","options":["Recirculated flow / Influent flow","Influent flow / Recirculated flow","(Influent + Recirculated) / Influent","Recirculated / (Influent + Recirculated)"],"answer":"1","solution":"Recirculation ratio R = Recirculated flow \u00f7 Influent (raw) flow Positive Mark: 0.8 Negative Mark: 0"}];
let idx=0, answers={}, timerSec=65*60, timerInt=null;

function render(){
  const q=DATA[idx];
  if(!q){document.getElementById('qText').textContent='No data.';return;}
  document.getElementById('qNum').textContent=idx+1;
  document.getElementById('qTotal').textContent=DATA.length;
  document.getElementById('qText').textContent=q.q;
  document.getElementById('opts').innerHTML=q.options.map((o,i)=>
    `<div class="option ${answers[idx]==(i+1)?'selected':''}" onclick="select(${i+1})">${String.fromCharCode(65+i)}. ${o}</div>`
  ).join('');
}
window.select=o=>{answers[idx]=o; render();};
window.prev=()=>{if(idx>0){idx--; render();}};
window.next=()=>{if(idx<DATA.length-1){idx++; render();}};

function submitTest(){
  clearInterval(timerInt);
  let c=0; for(let i=0;i<DATA.length;i++){if(answers[i]==DATA[i].answer)c++;}
  const pct=Math.round(c/DATA.length*100)||0;
  document.getElementById('qCard').classList.add('hidden');
  document.getElementById('resCard').classList.remove('hidden');
  document.getElementById('score').textContent=pct+'%';
  document.getElementById('detail').innerHTML='<b>'+c+'/'+DATA.length+'</b> correct';
}

function tick(){timerSec--; document.getElementById('timer').textContent=Math.floor(timerSec/60)+':'+String(timerSec%60).padStart(2,'0'); document.getElementById('bar').style.width=(timerSec/(65*60)*100)+'%'; if(timerSec<=0){clearInterval(timerInt); submitTest();}}

render(); timerInt=setInterval(tick,1000);
</script>
</body></html>
