const DATA=[{"id":"76857","q":"The waste water from bathrooms, kitchens, washing places and wash basin, etc is called....","options":["Garbage","Sanitary sewage","Rubbish","Sullage"],"answer":"4","solution":"The waste water from bathrooms, kitchens washing places and wash basin, etc. is called sullage."},{"id":"76858","q":"Bangalore method of composting solid waste involves:","options":["Facultative process","Cumulative process","Anaerobic process","Aerobic process"],"answer":"3","solution":"Bangalore method of composting is an anaerobic method conventionally carried out in pits. The material is allowed to decompose for 4 to 6 months after which the stabilized material is taken out and used as compost"},{"id":"76859","q":"The term 'Refuse' generally does not include","options":["Putrescible solid waste","Excreta","Non-putrescible solid waste","Ashes"],"answer":"2","solution":"Garbage rubbish or refuse is waste material that is discarded by humans usually due to a perceived lack of utility. The term generally does not comes waste Procducts."},{"id":"76860","q":"A coastal city produces Municipal Solid Waste (MSW) with high moisture content, high organic materials, low calorific value and low inorganic materials. The most effective and sustainable option for MSW management in that city is","options":["Composting","Incineration","Landfill","Dumping in sea"],"answer":"1","solution":"Composting is most better when municipal solid waste (MSW) is having low calorific value, high moisture & degradable too.."},{"id":"76861","q":"The maximum C/N ratio in a Municipal Solid Waste Compost is","options":["10 : 1","20 : 1","30 : 1","40 : 1"],"answer":"3","solution":"MSW compost is maximum of C/N is i.e.. carbon/Nitrogen is [(25 to 30 ) : 1] & maximum is (30:1)"},{"id":"76862","q":"Consider the following statements regarding pyrolysis: 1. It is an irreversible chemical change brought about by the action of heat in oxygen free atmosphere. 2. Range of temperature is 500\u00b0C and 1000\u00b0C. 3. Internal heating causes organic matter to decompose physically and chemically rather than burn. 4. It is a highly exothermic process. Which of the above statements are correct?","options":["1, 2, 3 and 4","1, 3 and 4 only","2 and 4 only","1, 2 and 3 only"],"answer":"4","solution":"Pyrolysis is burning in the absence of air is O 2 free condition of elevated temperature to bring physical and chemical changes of plastic and rubber waste It is an endothermic process in the temperature range of 500\u00b0C to 1000\u00b0C. ."},{"id":"76863","q":"How is municipal solid waste classified on the basis of its source?","options":["Residential waste and industrial waste","House refuse, street refuse and trade refuse","Residential refuse and non-residential refuse","Industrial waste and non-industrial waste"],"answer":"2","solution":"Classification of Municipal Solid Waste Based on Its Source: Municipal solid waste (MSW) can be classified based on its source to better understand and manage the different types of waste generated within a municipality. Proper classification helps in devising appropriate collection, recycling, and disposal strategies."},{"id":"76864","q":"The 3R principle is a concept for ----.","options":["Sanitation","Water treatment","Waste management","Plastic waste treatment"],"answer":"3","solution":"The 3R Principle: The 3R Principle stands for Reduce, Reuse, and Recycle. It is a widely adopted concept aimed at promoting sustainable waste management practices to minimize the impact of waste on the environment. The principle encourages individuals and organizations to take active steps to manage waste more effectively. Explanation of the Correct Option: Option 1: Waste Management The 3R Principle is primarily a concept for waste management. It aims to reduce the amount of waste generated, promote the reuse of materials, and encourage. recycling to convert waste into useful products. This helps in conserving natural resources, reducing pollution, and minimizing the amount of waste sent to landfills. Reduce: The first step is to minimize the amount of waste produced by using fewer resources and generating less waste. This can be achieved through efficient production processes, mindful consumption, and avoiding single-use items. Reuse: The second step is to extend the life of products by reusing them. This involves finding new ways to use items instead of discarding them, which reduces the need for new products and conserves resources. Recycle: The third step is to convert waste materials into new products. Recycling involves collecting and processing materials that would otherwise be thrown away as trash, turning them into new products to reduce the consumption of fresh raw materials and reduce energy usage"},{"id":"76865","q":"Which of the following municipal solid wastes CANNOT be recycled?","options":["Plastics","Papers","Fruit peelings","Glasses"],"answer":"3","solution":"Recycling is the process of collecting and processing materials that would otherwise be thrown away as trash and turning them into new products. Products should only be recycled if they cannot be reduced or reused Materials that can be recycled Materials that cannot be recycled Plastic, Paper, Aluminium, Glass, Steel, Metal, Wood etc. Fruit peelings, Food waste, Ceramics, Diapers etc."},{"id":"76866","q":"Match the following. Bin colour Type of biomedical waste I. Yellow A. To be incinerated II. Red B. To be autoclaved III. Black C. For burial","options":["I-B, II-C, III-A","I-A, I1-C, III-B","I-A, II-B, III-C","I-B, II-A, III-C"],"answer":"3","solution":"Yellow Bin: Used for the disposal of biomedical waste that is incinerated, such as human and animal anatomical waste, soiled waste, and microbiological waste. Red Bin: Used for the disposal of biomedical waste that is to be autoclaved, like contaminated plastic waste such as IV tubes, catheters, and other disposable items. Black Bin: Used for general non-hazardous waste that is destined for burial or landfill."},{"id":"76867","q":"The waste from printers, scanners, refrigerators, etc. is called","options":["industrial waste","municipal waste","e-waste","electrical waste"],"answer":"3","solution":"e-waste : Waste generated from printers, scanners, refrigerators etc. Industrial wastes Industrial wastes are generated from the industrial activities or manufacturing processes. All the three types of wastes, solid, liquid and gaseous are generated.."},{"id":"76868","q":"Which of the given options is NOT recommended as a desirable property of the transporting truck used for collection of municipal solid waste?","options":["Sharp corners and edges","Strength and durability","Water-tightness","Made of stainless steel"],"answer":"1","solution":"The characteritics to be considered while selecting a container are as following: (i) Low cost: The containers chosen for waste collection should be cheap and economical so as to minimize the cost of collection. (ii) Size and weight: Any collection containers should be of appropriate size to avoid occupational health hazard. A container should not weigh more than 20 kg. The containers that weigh more than 20 kg require more collection members as it would be difficult to handle manually. (iii) Containers should not be rough (iv) Containers should not have sharp edges: Sharp edges may cause injury to the waste collector crew . (v) Containers should be inert (vi) Containers should be covered (vii) Strength and durability (vili) The containers should not absorb moisture: Retention of moisture in the container will lead to bacterial and fungal growth, thereby accelerating the decomposition rate of wastes. (ix) The container material should be light, smooth. corrosion resistant, inert and recyclable."},{"id":"76869","q":"Some steps related to collection of municipal solid waste have been mentioned below. A. Collection by sweepers in small hand driven carts. B. Dumping into masonry chambers constructed along roadsides. C. Collection in small containers in individual houses. D. Collection into municipal trucks What is the correct sequence of the conventional system of collection of municipal solid waste, as per Indian scenario from start to end?","options":["C \u2013 B \u2013 A - D","A \u2013 C \u2013 D - B","C \u2013 A \u2013 B - D","A \u2013 D \u2013 B - C"],"answer":"3","solution":"The sequence of the conventional system of collection of municipal solid waste, as per the Indian scenario from start to end 1) On-site storage - Collection in small containers in individual houses 2) Primary storage - Collection by sweepers in small hand-driven carts. 3) Secondary storage - Collection by sweepers in semi-automated carts. 4) Primary Collection -Dumping into masonry chambers constructed along roadsides. 5) Secondary Collection - Collection into municipal trucks."},{"id":"76870","q":"Which of the following options is NOT considered as a component of the 3R principles of municipal solid waste management?","options":["Reduce","Recycle","Reuse","Recover"],"answer":"4","solution":"The Meaning of the three R's: Reduce, Reuse, and Recycle. Individuals' collective actions can make a tremendous impact on waste issues and give us the sense to be eco-friendly. These are the three essential components of environmentally-responsible consumer behavior. The goal of the 3 R's is to educate people on how to prevent excessive and unnecessary waste and to limit the consumption of non-renewable resources.."},{"id":"76871","q":"Which of the following sources of solid waste has the highest chance of causing infections like Hepatitis B and C through skin route if not handled property?","options":["Biomedical","Industrial","Electronic","Municipal"],"answer":"1","solution":""},{"id":"76872","q":"To prevent groundwater contamination, a modern sanitary landfill liner system typically consists of:","options":["A single layer of compacted soil","A Composite Liner (Geomembrane + Compacted Clay Liner","A layer of gravel only","A concrete slab"],"answer":"2","solution":"A Composite Liner (Geomembrane + Compacted Clay Liner) Explanation: A composite liner uses both a synthetic Geomembrane (like HDPE) and a Compacted Clay Liner (CCL) . This redundancy ensures that if the synthetic liner is punctured, the low-permeability clay still retards the flow of leachate."},{"id":"76873","q":"Which of the given options is the best suited condition for energy recovery from municipal solid waste?","options":["More moisture content","Presence of inorganic matter such as metal","Presence of more non-renewable resources like glass","High calorific value of solid waste"],"answer":"4","solution":"High calorific value of solid waste The calorific value of a substance is the amount of heat released during the combustion of a specified amount of it. Municipal solid waste with a high calorific value contains more energy, making it a better candidate for energy recovery methods such as incineration or waste-to-energy processes. High calorific value indicates that the waste has a significant potential for producing energy when burned or processed in a controlled manner. Additional Information Presence of inorganic matter such as metal This condition may not be ideal for energy recovery as metals can interfere with certain processes. Metal contamination can lead to issues during combustion or gasification processes, and it might require additional steps to separate and handle the metal content. Presence of more non-renewable resources like glass Non-renewable materials like glass do not contribute significantly to the energy recovery process. Glass is inert and does not combust, so its presence in municipal solid waste is not advantageous for energy generation. More moisture content High moisture content in solid waste can be a challenge for energy recovery. Wet waste tends to require more energy for drying and may reduce the efficiency of combustion processes Additionally, excessive moisture content can result in lower calorific value, impacting the overall energy recovery potential"},{"id":"76874","q":"The major segregation of biomedical solid waste for safe and economic disposal is done on the basis of :","options":["color of the waste","biodegradable and non-biodegradable categories","organic and inorganic categories","hazardous and nonhazardous categories"],"answer":"4","solution":"Biomedical Solid Waste: Biomedical waste is defined as any waste generated during or in research activities related to the diagnosis, treatment, or immunization of humans or animals, or during the production or testing of biologicals. If this waste is present in the solid form then it is known as biomedical solid waste. It is broadly classified into two categories for economical and safe disposal: 1. Hazardous 2. Non-hazardous Hazardous Biomedical Solid Waste: A hazardous substance (a solid substance) can be defined as anything which because of its quantity concentration or characteristics may contribute to increased mortality, illness, or hazard to human health and environment if not properly stored and transported or disposed off. Non-hazardous Biomedical Solid Waste: Non-hazardous biomedical solid waste is defined as solid waste generated from biomedical activities that is non-risky or non-harmful, or does not contribute to the spread of any type of diseases in humans or animals, and is not harmful to the environment."},{"id":"76875","q":"Municipal solid waste is also known as:","options":["Municipal rubbish","leachate","street sweepings","refuse"],"answer":"4","solution":"Municipal solid waste (MSW), also known as refuse, trash or garbage in the United States and rubbish in the United King type of waste made up of everyday items discarded by the public. The term \"garbage\" can also refer to food waste, as in a garbage disposal; the two are sometimes collected separately. Municipal solid waste (MSW) composition varies greatly from municipality to municipality and changes significantly over time. In municipalities with a well-developed waste recycling system, the waste stream consists primarily of difficult-to-recycle wastes such as plastic film and non-recyclable product packaging materials. At the turn of the century, most domestic waste in the United Kingdom (53 per cent) was coal ash from open fires. Food wastes, market wastes, garden waste, containers, product packaging material, and other miscellaneous solid wastes from residential, commercial, institutional, and industrial sources predominate in developed areas with little recycling activity. Additional Information Type of Municipal Solid Waste Municipal solid waste (MSW) is typically classified into six categories: food waste, wood waste, paper, textiles, plastics, and rubber. Food waste - Food residue predominates in MSW categories and is typically classified into five subgroups: vegetables, fruit peel, bones, starch food, and nutshells. The final analysis results were combined into a dry ash-free basis to eliminate the impact of moisture and ash. Wood waste- Wood waste is divided into four categories in MSW: wood, bamboo, leaves, and weeds. Weeds and leaves have less volatile matter but more ash than wood and bamboo. The N, S, and Cl content of wood waste ranged from 0% to 5%. Paper- MSW paper is classified into three types: printing paper (including newspapers, books, and magazines), cardboard, and toilet paper. Toilet paper has got the highest V and the lowest A. The paper samples' N + S +Cl content was less than 0.25 per cent. Textile-MSW textiles are classified into three subgroups: cotton, chemical fibres, and wool. Cotton had a low A and a range of V and FC. Chemical fibre ash content varied greatly. Plastic - Plastic MSW components are typically pure in contrast to other MSW components. PE (including high-density and low-density polyethene), PP (polypropylene), PS, PVC, and PET are the five most commonly used plastics. Rubber- Rubber in MSW was not subdivided for this paper because it was primarily derived from waste tires."},{"id":"76876","q":"Which of the following statements is true for trickling filter sludge?","options":["It is more difficult to dewater than activated sludge","It is bulky","It has a comparatively low concentration of sludge solids","It has a comparatively low sludge volume index"],"answer":"4","solution":"Trickling Filter : A trickling filter is a type of wastewater treatment system. It consists of a fixed bed of rocks, gravel, slag, ceramic, or plastic media over which sewage or other wastewater flows downward and causes a layer of microbial slime to grow, covering the bed of media. Aerobic conditions are maintained by splashing, diffusion, and either by forced-air flowing through the bed or natural convection of air if the filter medium is porous. Advantages Disadvantages Simple, reliable, biological process Effective in treating high concentrations of organics depending on the type of medium used. Efficient nitrification units. Appropriate for small- to medium-sized communities Have comparatively low sludge volume index Requires regular operator attention Possible accumulation of excess biomass that cannot retain an aerobic condition and can impair Trickling Filter performanc e Additional treatment may be needed to meet more stringent discharge standards Odor problems Important-Points Sludge volume index (SVI): It is a process control parameter to determine the recycling rate of sludge. It was introduced by Mohlman in 1934. SVI (mL/g) = \u00d7 1000"},{"id":"76877","q":"Environmental Impact Assessment (EIA) is carried out before which stage of a project?","options":["Operation","Planning","Decommissioning","Marketing"],"answer":"2","solution":""},{"id":"76878","q":"In India, EIA is legally mandated under which act?","options":["Wildlife Protection Act, 1972","Environmental Protection Act, 1986","Forest Conservation Act, 1980","Water Act, 1974"],"answer":"2","solution":"EIA Notification 2006 is issued under Environment (Protection) Act, 1986 ."},{"id":"76879","q":"Public Hearing (PH) is mandatory under which schedule of EIA Notification 2006?","options":["For all projects","Only for Category A projects","Only for Category B1 projects","Except for projects exempted in the notification"],"answer":"4","solution":"Certain projects like defence, national security, some highway expansions are PH-exempt"},{"id":"76880","q":"Category A projects require clearance from:","options":["State Level Environment Impact Assessment Authority (SEIAA)","Ministry of Environment, Forest and Climate Change (MoEFCC)","Central Pollution Control Board (CPCB)","State Pollution Control Board (SPCB)"],"answer":"2","solution":"Category A \u2192 Appraised at Central (MoEFCC) level."},{"id":"76881","q":"Sludge volume index is used to indicate","options":["Physical state of the sludge produced","BOD concentration","Sludge to volume ratio","Desired sludge rate"],"answer":"1","solution":"Sludge volume index (SVI) is used to describe the settling characteristics of sludge produced in the aeration tank in activated sludge process. It process control parameter to determine the recycle rate of sludge."},{"id":"76882","q":"Self cleaning velocity desired to be provided for septic tanks is","options":["0.5 m/sec","0.75 m/sec","0.9 m/sec","1.05 m/sec"],"answer":"1","solution":"Self cleansing velocity desired in septic tanks is 0.5 m/sec"},{"id":"76883","q":"Soak pit is connected to","options":["manhole","septic tank","gulley trap","nahani trap"],"answer":"2","solution":"In septic tank the soil absorption system is of two types (1) Seepage pit or soak pit (2) dispersion trench Soak pit- A soak pit is a circular covered pit. through which the effluent is allowed to be soa\u0432 into the surrounding soil."},{"id":"76884","q":"Grit chamber has a detention period of","options":["20 min to 30 min","2 hrs to 4 hrs","45 sec to 90 sec","2 min to 5 min"],"answer":"3","solution":"Grit removal basins are the sedimentation bedims placed in front of the fine screen to remove the organic particles having specific gravity of2.65 such sand, gravel, grit etc. Horizontal flow grit chamber velocity close to 0.3 m/sec is maintained. Detention period may were from 45 to go seconds. Generally it is liken as 60 sec"},{"id":"76885","q":"Activated sludge process is an example of \u2026\u2026.. growth process.","options":["anaerobic suspended","aerobic suspended","aerobic attached","facultative attached"],"answer":"2","solution":"Activated sludge process is an example of aerobic suspended growth process."},{"id":"76886","q":"In activated sludge plants, Rising sludge occurs due to:","options":["Industrial waste","Low pH","De-nitrification in the settling tank","Sudden discharge of septic solids"],"answer":"3","solution":"The reason for the increase of sludge in activated sludge plants is de-nitrification in the settling tank."},{"id":"76887","q":"Which of the following solid waste disposal methods is ecologically most acceptable?","options":["Sanitary landfill","incineration","composing","pyrolysis"],"answer":"3","solution":"Composing solid waste disposal method is ecologically most acceptable method"},{"id":"76888","q":"Bulking of sludge can be controlled by","options":["Denitrification","Aeration","Coagulation","Chlorination"],"answer":"4","solution":"Sludge bulking is the most common solids settling problem in wastewater treatment plants, which is caused by the excessive growth of filamentous bacteria extending outside the flocs, resulting in decreasing the wastewater treatment efficiency and deteriorating the water quality in the effluent. Sludge bulking can be removed by Reducing the sludge age. \u2022 Chlorination Addition of returned activated sludge of nutrient 1002. if it is less."},{"id":"76889","q":"Lower Food to Micro-organic (F/M) ratio in a conventional activated treatment plant will mean:","options":["Lower BOD removal","Higher BOD removal","No effect on BOD removal","Medium BOD removal"],"answer":"2","solution":"F/M ratio is directly proportional to waste rate flow ratio indicates the microbes are starving (mineralization) high sludge prediction resulted from high F/M ratio"},{"id":"76890","q":"Leachate is a colored liquid that comes out of","options":["Septic tanks","Sanitary land fills","Aerated lagoons","Compost plants"],"answer":"2","solution":"Leachate is liquid that comes out of compost in environmental context it is a liquid material which drains from stockpiled or landfills and contains elevated concentration of unwanted material"},{"id":"76891","q":"BOD of secondary effluent from an activated sludge plant normally will be in the range of","options":["less than 30 mg/Litre","35 to 50 mg/Litre","75 to 100 mg/Litre","100 to 125 mg/Litre"],"answer":"1","solution":"BOD of secondary effluent from an activated sludge plant normally will be in the range of less than 30 mg/Litre."},{"id":"76892","q":"The proportion of solids in sewage is about:","options":["2.5% or more","1% or more","0.1% or less","zero"],"answer":"3","solution":"Sewage normally contain very small amount of solids in relation to the large quanity of water (99.9%). It only contain about 0.05 of 0.17% of total solid.f"},{"id":"76893","q":"The pH value to be maintained in the digestion zone of a sludge digester is","options":["5.5 - 6.5","7 - 8","8.5 - 9.5","above 10.0"],"answer":"1","solution":"Ecosystem: The pH value to be maintained in the digestion zone of a sludge digester chamber is 5.5 to 6.5"},{"id":"76894","q":"The phenomenon by virtue of which soil pores gets clogged with sewage matter is called","options":["Sewage farming","Sewage bulking","Sewage sickness","Sewage irrigation"],"answer":"3","solution":"When sewage is applied continuously on a piece of land the soil pores or voids may get filled up and clogged with sewage matter retained in then known as sewage sickness"},{"id":"76895","q":"In which one of the following tests is the organic matter in the waste water used as food by micro-organisms?","options":["BOD","Most probable number","COD","Chlorine demand"],"answer":"1","solution":"More BOD present, the greater the amount of oxygen that micro organism will consume in oxidizing the wastes convert to CO 2 and H\u2082\u041e ."},{"id":"76896","q":"The MLSS concentration in an aeration tank is 2000 mg/ l and the sludge volume after 30 minutes of settling in a 1000 m l graduated cylinder is 176 m l . The value of sludge density index (SDI) will be nearly","options":["3.34 g/ml","2.22 g/ml","1.14 g/ml","0.26 g/ml"],"answer":"3","solution":"Sludge density index is given by, SDI = 100/SVI Where SVI is Sludge Volume Index. Sludge Volume Index (SVI) is the volume occupied in 'ml' by one gram of solids in mixed liquor when allowed to settle for 30 minutes. It is expressed in ml/gram. Calculation: It is given that 176 ml volume is occupied when 2000 mg solids in mixed liquor are allowed to settle for 30 minutes. The volume occupied when 1 gram solids in mixed liquor are allowed to settle for 30 minutes = SVI = 88 ml/gm Now, SDI = SDI = SDI = 1.14 g/m l"},{"id":"76897","q":"The spacing between bars of a coarse screen during the sewage treatment process is about:","options":["20 mm or more","30 mm or more","50 mm or more","60 mm or more"],"answer":"3","solution":"Screening devices are used to remove coarse solids from wastewater. Screens are classified as coarse screen, medium screen and fine screen (as per NPTEL) Coarse Screen > 50 mm opening. Medium Screen: 20 - 50 mm opening Fine Screen : < 20 mm opening"},{"id":"76898","q":"What would be the liquid capacity of a septic tank designed for 25 users? [ Take per user volume requirement as 0.1 m\u00b3]","options":["3.50 m 3","3.50 m\u00b3","2.50 m\u00b3","1.80 m\u00b3"],"answer":"3","solution":"Capacity of tank = No. of Person \u00d7 Volume requirement = 25 \u00d7 0.1 = 2.50 m 3 ."},{"id":"76899","q":"A sedimentation tank removes 210 kg of suspended solid per day. What will be the volume of sludge produced per day if the moisture content of sludge is 95% (by weight) and specific gravity of wet sludge is 1.05?","options":["5 m\u00b3","10 m\u00b3","4 m\u00b3","20 m\u00b3"],"answer":"3","solution":"'X' % of Moisture content is a sludge means that 'X; kg of water + (100-x) kg of solids leads to formation of 100 Kg wet sludge. Calculation : Total solids = 210 kg/day (Given) Moisture Content of sludge = 95% (Given) 95 kg of water + 5 kg of solids = 100 kg of wet sludge 5 kg of solids \u2192 100 kg of wet sludge 1 kg of solids of wet sludge \u2192 100/5 = 20kg of wet sludge 210 kg of solids \u2192 (20 210) = 4200kg / day of wet sludge Weight of wet sludge in one day = 4200 kg/day Density of wet sludge = pws = 1.05 1000 = 1050 kg/m\u00b3 The volume of wet sludge, Vws = = = 4 m\u00b3 V = 4 m\u00b3"},{"id":"76900","q":"What is the full form of CETP?","options":["Common environment treatment plant","Common effluent treatment plant","Concave environmental treatment plant","Combined effluent treatment plant"],"answer":"2","solution":"Common Effluent Treatment Plant (CETP): The concept of effluent treatment, by means, of a collective effort, has assumed reasonable gravity by being especially purposeful for a cluster of small-scale industrial units. A common effluent treatment plant (CETP) not only helps the industries in easier control of pollution but also acts as a step towards a cleaner environment and service to the society at large ."},{"id":"76901","q":"Among the following treatment units, anaerobic decomposition takes place in?","options":["oxidation pond","activated sludge process","Imhoff tank","trickling filter"],"answer":"3","solution":""},{"id":"76902","q":"The detention period for oxidation ponds is usually kept as:","options":["4-8 hrs","24 hrs","10 to 15 days","3 months"],"answer":"3","solution":""},{"id":"76903","q":"A stream has flow of 20 cumec and BOD concentration of 10 mg/L receives the industrial waste water having flow of 1.5 cumecs and BOD concentration of 250 mg/L. What is the BOD concentration (mg/L) of stream at downstream point of meeting of stream with industrial waste ?","options":["2.67","12.09","13","26.74"],"answer":"4","solution":"Q 0 = 20 cumecs, (BOD) 0 = 10 mg/- l Qi nd = 1.5 cumecs (BOD) Ind =250 mh/- 1 (BOD)eff. = . = = 26.74 mg/l"},{"id":"76904","q":"The minimum dissolved oxygen which should always be present in water in order to save the aquatic life is:","options":["1 ppm","4 ppm","10 ppm","40 ppm"],"answer":"2","solution":"Fish and other forms of aquatic life in natural surface water usually need a minimum dissolved oxygen (DO) of about 4 mg/L, as otherwise die due to shortage of oxygen. Note: Much higher value of D.O are also not good, since water containing high D.O may cause corrosion of the pipes. Dissolve oxygen at 20\u00b0C is 9.2 mg/L at 1 atm pressure."},{"id":"76905","q":"The ratio of 5 day BOD to ultimate BOD is about","options":["1/3","2/3","3/4","1.0"],"answer":"2","solution":"The BOD can be determined by directing a known volume of a sample of waste water with a known volume of aerated pure water and then calculating the D0 of this diluted sample. The diluted sample is then incubated for 5-days at 20\u00b0C. At 20\u00b0C, k D (deoxygenation constant on base 10) = 0.1 day -1 (BOD) 5 = (BOD) u (1\u201310 ko 5 ) (BOD 5 ) = (BOD) u {1\u201310 -0.1x 5 = (BOD) u (0.68) = 2/3(BOD) u"},{"id":"76906","q":"Sewage treatment units are normally designed for:","options":["for 5 \u2013 10 years","for 15 \u2013 20 years","for 30 \u2013 40 years","for 40 \u2013 50 years"],"answer":"2","solution":"Concept: Design period: It may be defined as the time period for which the component remains functional . As per Manual on Sewerage and Sewage Treatment Systems - 2013, the following table shows the design period of sewerage components: Component Design period (years) from base year Land Acquisition \u2265 30 Conventional Sewers 30 Non conventional Sewers 15 Pumping mains 30 Pumping stations 30 Pumping machinery 15 Sewage treatment plants 15 Effluent Disposal 30 Effluent Utilisation 15"},{"id":"76907","q":"Scoping refers to:","options":["Identifying baseline conditions","Predicting impacts","Listing key issues & preparing Terms of Reference (ToR)","Monitoring impacts"],"answer":"3","solution":"Scoping = ToR preparation for what the EIA must study."},{"id":"76908","q":"Which phase of EIA includes collection of baseline environmental data?","options":["Screening","Scoping","Impact Prediction","Assessment"],"answer":"3","solution":"Baseline data is collected during/after scoping but primarily used for impact prediction"},{"id":"76909","q":"Screening in EIA is:","options":["( a) Check to decide if project needs EIA","Checking health impacts","Preparing monitoring plan","Reviewing EIA document"],"answer":"1","solution":""},{"id":"76910","q":"Rapid EIA is conducted over a period of:","options":["1 week","One season except monsoon","Full year (all seasons)","Five years"],"answer":"2","solution":"Rapid EIA uses single-season data; Comprehensive EIA uses 3-season/1-year data."},{"id":"76911","q":"EIA is fundamentally based on the principle of:","options":["Precautionary principle","Equity principle","Polluter pays principle","Intergenerational equity"],"answer":"1","solution":"EIA = \"prevent harm before it occurs\", i.e., precautionary principle."},{"id":"76912","q":"Which method is widely used for impact identification in EIA?","options":["Scatter diagram","Leopold Matrix","Pareto chart","Gantt chart"],"answer":"2","solution":"The Leopold Matrix is a widely used and well-known method for impact identification in Environmental Impact Assessment (EIA). It is a two-dimensional matrix that provides a systematic framework to identify and evaluate the potential interactions between proposed project activities (listed along one axis) and various environmental characteristics and conditions (listed along the other axis). The intersections of the matrix are used to record the magnitude and importance of potential impacts, allowing for a structured and visual assessment"},{"id":"76913","q":"EMP in EIA refers to:","options":["Environmental Manpower Plan","Environmental Monitoring Program me","Environmental Management Plan","Environmental Material Procurement"],"answer":"3","solution":"EMP outlines mitigation measures, cost, and monitoring schedules"},{"id":"76914","q":"Which organization prepares EIA guidelines in India?","options":["NITI Aayog","CPCB","MoEFCC","WHO"],"answer":"3","solution":"MoEFCC publishes guidelines, notifications, amendments Presently it is the finest and most prominent building and art museum of Calcutta, India, under the Department of Culture, Government of India."},{"id":"76915","q":"In India, the validity of Environmental Clearance (EC) for mining projects is:","options":["5 years","10 years","20 years","30 years"],"answer":"4","solution":"In India, the validity of Environmental Clearance (EC) for mining projects is typically 30 years , based on the project life estimated by the Expert Appraisal Committee (EAC) or State Level Expert Appraisal Committee (SEAC). This period is often co-terminus with the life of the mine, subject to a maximum of thirty years"},{"id":"76916","q":"Social Impact Assessment (SIA) is mandatory for:","options":["Hydropower projects only","Land acquisition under RFCTLARR Act, 2013","Category B2 projects","All infrastructure projects"],"answer":"2","solution":"SIA is required for land acquisition under the Land Acquisition Act 2013"},{"id":"76917","q":"Which is not a component of baseline environmental study?","options":["Air quality","Water quality","Flora & fauna","Project financial cost"],"answer":"4","solution":"Financial cost is not part of environmental baseline studies."},{"id":"76918","q":"In the EIA process, cumulative impact assessment primarily evaluates:","options":["Direct impacts only","Indirect impacts only","Impacts from multiple projects in a region over time","Impacts that occur only after project commissioning"],"answer":"3","solution":"Cumulative impact assessment (CIA) is a systematic procedure within the Environmental Impact Assessment (EIA) process that is specifically designed to evaluate the collective effects of a given project when combined with the impacts of past, present, and reasonably foreseeable future activities in the same region over time. These impacts can be incremental, compounding, or synergistic, and they often extend beyond the direct, immediate project site or timeframe"},{"id":"76919","q":"The significance of an environmental impact in EIA is determined by:","options":["Magnitude \u00d7 Duration only","Magnitude \u00d7 Frequency only","Magnitude \u00d7 Sensitivity of receptor","Magnitude \u00d7 Cost of mitigation"],"answer":"3","solution":"The sensitivity (ecological vulnerability) of the receiving environment largely decides significance."},{"id":"76920","q":"Strategic Environmental Assessment (SEA) differs from EIA mainly because SEA:","options":["Is conducted after project approval","Addresses policies, plans & programmers\u2019 rather than individual projects","Deals only with ecological components","Has no public participation"],"answer":"2","solution":"SEA is upstream , influencing policies and plans before projects are proposed."},{"id":"76921","q":"Which of the following is most appropriate for identifying secondary or indirect impacts?","options":["Checklists","Overlays","Network diagrams","Leopold Matrix"],"answer":"3","solution":"Network diagrams capture cause\u2013effect chains , useful for indirect/secondary impacts"}];
let idx=0, answers={}, timerSec=65*60, timerInt=null;

function render(){
  const q=DATA[idx];
  if(!q){document.getElementById('qText').textContent='No data.';return;}
  document.getElementById('qNum').textContent=idx+1;
  document.getElementById('qTotal').textContent=DATA.length;
  document.getElementById('qText').textContent=q.q;
  document.getElementById('opts').innerHTML=q.options.map((o,i)=>
    `<div class="option ${answers[idx]==(i+1)?'selected':''}" onclick="select(${i+1})">${String.fromCharCode(65+i)}. ${o}</div>`
  ).join('');
}
window.select=o=>{answers[idx]=o; render();};
window.prev=()=>{if(idx>0){idx--; render();}};
window.next=()=>{if(idx<DATA.length-1){idx++; render();}};

function submitTest(){
  clearInterval(timerInt);
  let c=0; for(let i=0;i<DATA.length;i++){if(answers[i]==DATA[i].answer)c++;}
  const pct=Math.round(c/DATA.length*100)||0;
  document.getElementById('qCard').classList.add('hidden');
  document.getElementById('resCard').classList.remove('hidden');
  document.getElementById('score').textContent=pct+'%';
  document.getElementById('detail').innerHTML='<b>'+c+'/'+DATA.length+'</b> correct';
}

function tick(){timerSec--; document.getElementById('timer').textContent=Math.floor(timerSec/60)+':'+String(timerSec%60).padStart(2,'0'); document.getElementById('bar').style.width=(timerSec/(65*60)*100)+'%'; if(timerSec<=0){clearInterval(timerInt); submitTest();}}

render(); timerInt=setInterval(tick,1000);
</script>
