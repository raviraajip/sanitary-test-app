E?","options":["EIA is only required for government-funded projects.","Public consultation is a mandatory component of the EIA process for most large projects.","EIA is a one-time process and does not involve post-project monitoring.","EIA primarily focuses on the financial impacts of a project."],"answer":"2"},{"id":"72162","q":"In the context of water resource management, what does the term 'aquifer' refer to?","options":["A man-made canal used for irrigation.","A large, natural body of saltwater.","A body of permeable rock that can contain or transmit groundwater.","A system for filtering rainwater."],"answer":"3"},{"id":"72163","q":"A major challenge for water resource management in many parts of the world is saltwater intrusion. This occurs when:","options":["Excessive pumping of groundwater from a coastal aquifer allows saltwater to contaminate the freshwater supply.","Pollution from a factory increases the salinity of a river.","The natural evaporation of a lake leaves behind a higher concentration of salt.","Rainfall becomes increasingly acidic, leading to a rise in salt content in the soil."],"answer":"1"},{"id":"72164","q":"The 'polluter pays' principle holds that a party responsible for pollution should bear the costs of managing it to prevent environmental damage. Which of the following waste management concepts is a direct application of this principle?","options":["Bioremediation","Incineration","Sanitary landfill","Extended Producer Responsibility (EPR)"],"answer":"4"},{"id":"72165","q":"What is the main difference between primary and secondary waste collection ?","options":["Primary collection is for hazardous waste, while secondary is for non-hazardous.","Primary collection is from the source, while secondary collection is from a common storage point to a processing facility.","Primary collection uses large trucks, while secondary uses smaller vehicles.","Primary collection is done by the government, while secondary is done by private entities."],"answer":"2"},{"id":"72166","q":"Which of the following projects is most likely to be classified as a Category 'A' project under the EIA Notification 2006, requiring a full-scale EIA and clearance from the central government?","options":["A school in a rural area.","A small-scale residential building project.","A major river valley project.","A new hospital in a metropolitan city."],"answer":"3"},{"id":"72167","q":"What is composting, and what is its main benefit?","options":["The controlled biological decomposition of organic material; produces a nutrient-rich soil amendment.","Burying waste in the ground to prevent air pollution; prevents the release of greenhouse gases.","A process of separating plastic waste from other materials; helps in recycling.","Burning waste at high temperatures to reduce volume and kill pathogens; reduces landfill space."],"answer":"1"},{"id":"72168","q":"In the context of environmental clearance, what does 'Appraisal' refer to?","options":["public hearing process to gather community feedback.","The initial submission of the project proposal by the proponent.","The collection of baseline environmental data.","The final evaluation and scrutiny of the EIA report and project documents by an expert committee."],"answer":"4"},{"id":"72169","q":"What is a major advantage of using plastic waste in road construction ?","options":["makes the road surface smoother for vehicles.","It makes the road biodegradable.","It significantly increases the cost of road construction.","It strengthens the bituminous layer and helps in the proper disposal of plastic waste."],"answer":"4"},{"id":"72170","q":"Which of the following best describes the 'precautionary principle' as applied to environmental clearance?","options":["Lack of full scientific certainty shall not be a reason for postponing cost-effective measures to prevent environmental degradation.","Projects should be approved only if they have zero environmental impact.","Scientific certainty is a prerequisite for taking action to prevent environmental damage.","Environmental protection is given priority over economic development in all circumstances."],"answer":"1"},{"id":"72171","q":"Which of the following statements define environmental chemistry ?","options":["study of chemical reactions that occur in water, air, land, biological habitats, and human activities","study of chemical reactions that occur in water, air, land, and biological habitats only","study of chemical reactions that occur in water, air, and land only","None of the above"],"answer":"1"},{"id":"72172","q":"What does a 'Coastal Regulation Zone' (CRZ) clearance signify in the context of a project located in a coastal area?","options":["It signifies that the project complies with regulations governing activities in coastal ecosystems.","It implies that the project will have no impact on the local marine life.","is a legal document that allows the project to reclaim land from the sea for construction?","It means the project is exempt from environmental clearance."],"answer":"1"},{"id":"72173","q":"Under the EIA Notification, 2006, which authority is responsible for appraising and granting environmental clearance for a Category 'A' project?","options":["The Expert Appraisal Committee (EAC) and the Ministry of Environment, Forest and Climate Change (MoEF&CC).","The Central Pollution Control Board (CPCB).","The State Expert Appraisal Committee (SEAC).","The State Environment Impact Assessment Authority (SEIAA)."],"answer":"1"},{"id":"72174","q":"What is the key difference between a 'Pre-feasibility Report' and a 'Feasibility Report' in the context of EIA?","options":["The pre-feasibility report is only for Category 'B' projects, while the feasibility report is for Category 'A' projects","The pre-feasibility report is a detailed financial analysis, while the feasibility report is a brief overview.","The pre-feasibility report is submitted at the screening stage, and the feasibility report is submitted after the public hearing","pre-feasibility report is prepared by the government, while the feasibility report is prepared by the project proponent."],"answer":"3"},{"id":"72175","q":"What is the key role of a 'District Level Committee' under the Solid Waste Management Rules, 2016?","options":["To review the performance of local bodies and ensure compliance with the rules, reporting its findings to the State-Level Advisory Body.","To prepare the national policy on solid waste management.","To provide financial grants to local bodies for waste management infrastructure.","To issue environmental clearances for all waste management projects in the district."],"answer":"1"},{"id":"72176","q":"Which of the following statements means water vapor?","options":["Water vapor is the gaseous phase of water","Water vapor is the liquid phase of water","Water vapor is the solid phase of water","All of the mentioned"],"answer":"1"},{"id":"72177","q":"What is the primary objective of a 'Producer Responsibility Organisation' (PRO) under the E-Waste Management Rules, 2016?","options":["To manage the collection, dismantling, and recycling of e-waste on behalf of multiple producers.","set the national e-waste collection targets for all producers.","provide financial incentives to consumers for returning their e-waste.","To manufacture electronic goods that are easy to recycle."],"answer":"1"},{"id":"72178","q":"A process for extracting minerals or other solid natural resources from waste materials that previously have been disposed of by burying them in the ground is generally known as","options":["Landfill leachates","Unearthing","Excavation","Landfill mining"],"answer":"4"},{"id":"72179","q":"A project requires an environmental clearance fee. The fee is 0.5% of the total project cost. If the total project cost is $500 million, what is the clearance fee (in million dollars)?","options":["2.5","5",".5","25"],"answer":"1"},{"id":"72180","q":"A river's flow rate is measured at 500 m³/s. An upstream project diverts 15% of this flow. What is the remaining flow rate (in m³/s) downstream ?","options":["425","75","500","575"],"answer":"1"},{"id":"72181","q":"An environmental assessment report states that a project will increase the local air pollution by 1.25% annually. If the initial pollution index is 100, what will the index be after 2 years?","options":["102.51","101.25","105.00","102.50"],"answer":"1"},{"id":"72182","q":"A proposed industrial project is located 5 km from a protected wildlife sanctuary. The environmental clearance rules require a buffer zo Multiple-choice ne of 2 km. What is the minimum distance (in km) the project needs to be shifted to comply?","options":["0","3","2","5"],"answer":"1"},{"id":"72183","q":"A city's reservoir has a capacity of 10 9 Litre. If the daily water consumption is 5 10 6 Litre, how many days can the reservoir supply water if it is completely full?","options":["200 days","500 days","20 days","50 days"],"answer":"1"},{"id":"72184","q":"If the groundwater table drops by 1.5 meters per year and is currently at a depth of 20 meters, what will its depth be in 5 years, assuming a constant rate of decline?","options":["27.5 m","21.5 m","26.5 m","12.5 m"],"answer":"1"},{"id":"72185","q":"A factory's water consumption is 10,000 m³/day. If a new water recycling system is installed that reduces consumption by 30%, what is the new daily water consumption (in m³)?","options":["7,000","3,000","10,000","13,000"],"answer":"1"},{"id":"72186","q":"A dam's maximum storage capacity is 250 million cubic meters. If the current water level is at 60% of its capacity, how much additional water (in million cubic meters) can be stored?","options":["100","150","60","250"],"answer":"1"},{"id":"72187","q":"An EIA report costs $150,000. This is 1.5% of the total project cost . What is the total project cost (in dollars)","options":["10,000,000","15,000,000","2,250,000","150,000"],"answer":"1"},{"id":"72188","q":"A factory's air pollution level  in a modern landfill used for?","options":["To convert leachate into a liquid fuel","To accelerate the decomposition of waste and increase landfill gas production.","To drain all leachate out of the landfill for off-site treatment","To prevent the build-up of explosive gases within the landfill"],"answer":"2"},{"id":"72196","q":"What is a key difference between a project-level EIA and a Strategic Environmental Assessment (SEA )?","options":["A project-level EIA is conducted by the government, while an SEA is conducted by the private sector.","A project-level EIA is mandatory, while an SEA is voluntary.","An SEA is only for developed countries, while a project-level EIA is for developing countries.","A project-level EIA focuses on a specific project, while an SEA focuses on policies, plans, and programs."],"answer":"4"},{"id":"72197","q":"What is 'Environmental Due Diligence in the context of business and environmental law ?","options":["The process of getting approval for a new project.","An audit conducted to evaluate a site's environmental liabilities before a business transaction.","A plan for reducing a company's carbon footprint.","A legal process for suing a company for environmental damage."],"answer":"2"},{"id":"72198","q":"Which of the following describes the concept of Environmental Justice?","options":["The legal right of a country to sue another for environmental damage.","The fair treatment and meaningful involvement of all people regardless of race, colour, national origin, or income, with respect to the development, implementation, and enforcement of environmental laws.","The requirement that all projects must have a positive environmental impact.","A legal principle stating that the polluter must pay for environmental clean-up."],"answer":"2"},{"id":"72199","q":"In Indore method the decomposition method takes place?","options":["1- 2 months","6- 8 months","9 – 12 months","2- 3 months"],"answer":"4"},{"id":"72200","q":"The Expert Appraisal Committee st place.","It can be done at a centralized facility and does not require public participation.","It is the easiest method for waste management."],"answer":"2"},{"id":"72204","q":"What is the primary risk of not having an impermeable liner (e.g., geomembrane) at the base of a sanitary landfill?","options":["The waste will decompose at a faster-than-normal rate.","The landfill will attract more birds and pests.","The landfill will not be able to produce methane gas.","The highly toxic leachate will contaminate the underlying soil and groundwater."],"answer":"4"},{"id":"72205","q":"What is the key role of the 'Accredited Environmental Consultant Organization' (ACO) in the EIA process?","options":["To prepare the EIA report on behalf of the project proponent.","monitor and inspect the project site after the project is complete.","To represent the interests of the affected public during the public hearing.","To grant final Environmental Clearance for the project."],"answer":"1"},{"id":"72206","q":"Which of the following is an example of an 'end-of-pipe' pollution control measure in the context of a project's Environmental Management Plan (EMP)?","options":["Installing a wastewater treatment plant to treat effluents before they are discharged.","Changing the manufacturing process to use less hazardous raw materials.","Implementing a strict segregation policy for waste at the source.","Reusing waste materials as a feedstock for a different process."],"answer":"1"},{"id":"72207","q":"The EIA Notification, 2006, mandates a specific timeframe for the State Pollution Control Board to conduct a public hearing after receiving a request from the project proponent. What is this timeframe?","options":["30 days","15 days","60 days","45 days"],"answer":"4"},{"id":"72208","q":"When Environmental Lapse Rate (ELR) is greater than Adiabatic Lapse Rate (ALR), then which of the following occurs?","options":["Super adiabatic lapse rate","Neutral lapse rate","Adiabatic lapse rate","Sub adiabatic lapse rate"],"answer":"1"},{"id":"72209","q":"What is the primary difference in management between 'domestic hazardous waste' and 'bio-medical waste' as per the SWM Rules and BMW Rules, 2016?","options":["Domestic hazardous waste is managed by households, while bio-medical waste is managed by hospitals.","Domestic hazardous waste is disposed of in a landfill, while bio-medical waste is always incinerated.","Domestic hazardous waste can be recycled, while bio-medical waste cannot.","Bio-medical waste is disposed of in the wet waste stream, while domestic hazardous waste is in the dry waste stream."],"answer":"1"},{"id":"72210","q":"According to the Solid Waste Management Rules, 2016, a 'Spot Fine' may be levied on a person or entity for which of the following actions ?","options":["Failing to pay the monthly user fee for waste collection.","Burning solid waste on streets or in open public spaces.","Failure to provide a waste collection service.","Building a waste management facility without proper land."],"answer":"2"},{"id":"72211","q":"According to the Solid Waste Management Rules, 2016, what is the key responsibility of an 'event organizer' for an event with more than 100 people?","options":["To pay a 'User Fee' for waste collection.","ensure segregation of waste at the source and hand over segregated waste to a waste collector.","transport all waste from the event to a nearby landfill.","To process all organic waste from the event on-site."],"answer":"2"},{"id":"72212","q":"Recognize the WRONG statement related to the characteristics of Rubbish in Indian conditions.","options":["Rubbish constitutes more than 50% of the total municipal solid waste.","Rubbish includes rags paper pieces, broken pieces of glass and furniture, card- boards, etc.","Rubbish includes all non-putrescible wastes except ashes.","Rubbish has a density varying between 50 to 400 kg/m³"],"answer":"1"},{"id":"72213","q":"Which of the following toxic substances is normally found in E-waste let idx=0, answers={}, timerSec=3900, timerInt=null;

function render(){
  const q=DATA[idx];
  if(!q){document.getElementById('qText').textContent='No data.';return;}
  document.getElementById('qNum').textContent=idx+1;
  document.getElementById('qTotal').textContent=DATA.length;
  document.getElementById('qText').textContent=q.q;
  document.getElementById('opts').innerHTML=q.options.map((o,i)=>
    `<div class="option ${answers[idx]==(i+1)?'selected':''}" onclick="select(${i+1})">${String.fromCharCode(65+i)}. ${o}</div>`
  ).join('');
}
window.select=o=>{answers[idx]=o; render();};
window.prev=()=>{if(idx>0){idx--; render();}};
window.next=()=>{if(idx<DATA.length-1){idx++; render();}};

function submitTest(){
  clearInterval(timerInt);
  let c=0; for(let i=0;i<DATA.length;i++){if(answers[i]==DATA[i].answer)c++;}
  const pct=Math.round(c/DATA.length*100)||0;
  document.getElementById('qCard').classList.add('hidden');
  document.getElementById('resCard').classList.remove('hidden');
  document.getElementById('score').textContent=pct+'%';
  document.getElementById('detail').innerHTML='<b>'+c+'/'+DATA.length+'</b> correct';
}

function tick(){timerSec--; document.getElementById('timer').textContent=Math.floor(timerSec/60)+':'+String(timerSec%60).padStart(2,'0'); document.getElementById('bar').style.width=(timerSec/3900*100)+'%'; if(timerSec<=0){clearInterval(timerInt); submitTest();}}

render(); timerInt=setInterval(tick,1000);
</script>
