"answer":"3","solution":"Decade 1 growth = Decade 2 growth = The constant geometric growth rate is 20%."},{"id":"82922","q":"Two noise sources produce 65 dB and 65 dB. What is their combined noise level?","options":["65 dB","68 dB","71 dB","130 dB"],"answer":"2","solution":"When combining two equal noise levels, the total level increases by 3 dB. 65 + 3 = 68 ( dB)."},{"id":"82923","q":"A primary settling tank is 20m long, 5m wide, and 3m deep. If the flow rate is 2000 (/day), what is the detention time?","options":["1.5 hours","3.6 hours","4.8 hours","6.0 hours"],"answer":"2","solution":"Tank Volume = Detention Time = In hours:"},{"id":"82924","q":"A mixture for composting consists of 200 kg of Material A (C/N ratio = 40, Nitrogen = 1%) and 100 kg of Material B (C/N ratio = 10, Nitrogen = 2%). What is the approximate C/N ratio of the mixture? (Assume dry weights).","options":["15","20","25","30"],"answer":"3","solution":"N in A = 2 kg. C in A = 40 2 = 80 kg. N in B = 2 kg. C in B = 10 2 = 20 kg. Total N = 4 kg. Total C = 100 kg. Mixed C/N = 100 / 4 = 25."},{"id":"82925","q":"A sanitary landfill requires a daily cover of soil. If the compacted waste volume is 400 (/day) and the solid waste-to-soil volume ratio is 4:1, what volume of soil is required daily?","options":["100","50","400","20"],"answer":"1","solution":"Solid Waste : Soil = 4 : 1. If waste volume = 400 , soil volume = = 100 ."},{"id":"82926","q":"Which method of bioremediation involves the excavation of contaminated soil and its treatment in above-ground enclosed biological reactors?","options":["Landfarming","Bioventing","Biosparging","Ex-situ Bioreactors"],"answer":"4","solution":"Ex-situ bioreactors involve excavating the contaminated soil and placing it into enclosed tanks or vessels (reactors) where conditions can be strictly controlled to optimize microbial degradation."},{"id":"82927","q":"Under the EIA Notification 2006, the \"Appraisal\" stage is defined as:","options":["The preliminary review to determine if EIA is required","Detailed scrutiny of the EIA report and outcomes of the public consultations by the Expert Appraisal Committee","The collection of baseline environmental data","The post-project monitoring phase"],"answer":"2","solution":"Appraisal is the final stage where the Expert Appraisal Committee (EAC) or SEAC conducts a detailed scrutiny of the final EIA report, the EMP, and the public hearing proceedings before recommending clearance or rejection."},{"id":"82928","q":"Which gas is typically produced during the endogenous respiration phase of an aerobic biological wastewater treatment system?","options":["Methane ( )","Hydrogen Sulfide ( )","Carbon Dioxide ( )","Ammonia ( )"],"answer":"3","solution":"In aerobic processes, during endogenous respiration, microorganisms oxidize their own cellular mass to generate energy, producing Carbon Dioxide, Water, and inert cellular residue."},{"id":"82929","q":"\"Extended Producer Responsibility\" (EPR) under the Plastic Waste Management Rules strictly requires Producers, Importers, and Brand Owners (PIBOs) to:","options":["Ensure 100% replacement of plastics with paper","Establish a system for collecting back the plastic waste generated due to their products","Stop manufacturing plastic items immediately","Only pay a tax to the municipal corporation and do nothing else"],"answer":"2","solution":"EPR mandates that PIBOs are responsible for establishing a reverse logistics system to collect, process, and sustainably manage the end-of-life plastic packaging they introduce to the market."},{"id":"82930","q":"Under the Biomedical Waste Management Rules, 2016, which pre-treatment must be done for microbiology laboratory cultures and highly infectious waste before disposal?","options":["Washing with cold water","Autoclaving or Microwaving on-site","Immediate burial in a general landfill","Drying in the sun"],"answer":"2","solution":"Microbiology, biotechnology, and other highly infectious lab wastes must be pre-treated through non-burn technologies like autoclaving or microwaving on-site to destroy pathogens before being handed over to a CBWTF."},{"id":"82931","q":"The \"Air-to-Cloth Ratio\" is an operational parameter used in the design of:","options":["Wet Scrubbers","Cyclone Separators","Baghouse Filters (Fabric Filters)","Electrostatic Precipitators"],"answer":"3","solution":"The air-to-cloth ratio represents the volumetric flow rate of gas passing through a unit area of filter fabric. It dictates the size and filtration velocity of a Baghouse Filter."},{"id":"82932","q":"Which type of plastics are designated by the Resin Identification Code (RIC) \"3\"?","options":["High-Density Polyethylene (HDPE)","Polyethylene Terephthalate (PET)","Polyvinyl Chloride (PVC)","Polypropylene (PP)"],"answer":"3","solution":"The RIC system uses \"3\" or \"V\" to identify Polyvinyl Chloride (PVC), which is often problematic in recycling due to its chlorine content."},{"id":"82933","q":"\"Biomining\" of legacy solid waste in old dumpsites primarily aims to:","options":["Extract precious metals like gold","Burn all the accumulated waste","Excavate, stabilize, and separate decomposed organic matter (bio-earth) from recyclables and combustibles (RDF) to reclaim land","Turn the dumpsite into a lake"],"answer":"3","solution":"Biomining (or bioremediation of dumpsites) involves loosening the legacy waste, spraying biological cultures to stabilize it, and then using trommels to segregate it into fine earth, RDF, and heavy inert fractions, thereby freeing up valuable land."},{"id":"82934","q":"A \"Venturi Scrubber\" is highly effective for:","options":["Removing large grit from wastewater","Treating high-BOD industrial effluents","Removing fine particulate matter and absorbing toxic gases from industrial air emissions","Separating recyclable plastics by density"],"answer":"3","solution":"A Venturi Scrubber uses a converging-diverging section to accelerate gas flow and atomize scrubbing liquid into tiny droplets. It is extremely efficient at capturing sub-micron particulate matter and neutralizing acid gases."},{"id":"82935","q":"The standard biochemical oxygen demand ( ) is typically measured at what temperature?","options":["","","",""],"answer":"2","solution":"The standard BOD test measures the oxygen consumed by microorganisms over a 5-day period while incubated in the dark at exactly ."},{"id":"82936","q":"Which section of the Environment (Protection) Act, 1986 deals with the penalties for contravention of the provisions of the Act?","options":["Section 3","Section 5","Section 15","Section 25"],"answer":"3","solution":"Section 15 of the EPA, 1986 lays down the penalty for contravention of any provision of the Act, which includes imprisonment up to 5 years or a fine up to one lakh rupees, or both."},{"id":"82937","q":"What is \"Syngas\" (Synthesis Gas)?","options":["A byproduct of aerobic composting","A combustible gas mixture primarily consisting of carbon monoxide (CO) and hydrogen ( ) produced during Gasification","The highly toxic exhaust from a diesel engine","The synthetic lining used in secure landfills"],"answer":"2","solution":"Gasification is a thermal process that converts organic or fossil-based carbonaceous materials into carbon monoxide, hydrogen, and carbon dioxide. This fuel gas mixture is called syngas."},{"id":"82938","q":"\"Plume Inversion\" occurs when:","options":["An unstable atmospheric layer traps pollutants near the ground","A warm air layer lies above a cooler air layer near the ground, preventing the upward dispersion of pollutants","Pollutants are carried upwards rapidly by thermal convection","Smoke flows downwards into a water body"],"answer":"2","solution":"A temperature inversion (or thermal inversion) occurs when a layer of warm air settles over a layer of cooler air close to the ground, acting as a lid and trapping smog and air pollutants below it."},{"id":"82939","q":"In an Upflow Anaerobic Sludge Blanket (UASB) reactor, the dense granular sludge formed at the bottom is maintained in suspension by:","options":["Mechanical surface aerators","The upward flow of incoming wastewater and the rising bubbles of biogas","High-speed centrifugal pumps","Continuous manual stirring"],"answer":"2","solution":"In a UASB reactor, the biological mass forms dense granules. The upward velocity of the influent wastewater combined with the buoyant effect of the generated biogas keeps this sludge bed suspended and thoroughly mixed."},{"id":"82940","q":"The \"Toxicity Characteristic Leaching Procedure\" (TCLP) uses which of the following extraction fluids to simulate landfill leachate?","options":["Pure distilled water","Concentrated Sulfuric Acid","Mild Acetic Acid solutions","Sodium Hydroxide"],"answer":"3","solution":"TCLP simulates the mildly acidic conditions of a municipal solid waste landfill (which contains decomposing organics producing organic acids) by using dilute Acetic Acid extraction fluids to test if heavy metals or organics will leach out."},{"id":"82941","q":"Under the Construction and Demolition (C&D) Waste Management Rules, 2016, who is responsible for providing appropriate sites for the setting up of C&D waste processing facilities?","options":["The State Pollution Control Board","The Ministry of Environment, Forest and Climate Change","The Local Authority (Municipal Corporation)","The Waste Generator"],"answer":"3","solution":"The rules mandate that the local authority (such as municipal corporations or councils) is responsible for identifying and allocating suitable land for the establishment of C&D waste processing and disposal facilities."},{"id":"82942","q":"\"Comminutors\" in a wastewater treatment plant are used for:","options":["Measuring the flow of sewage","Shredding and grinding large coarse solids into smaller pieces without removing them from the wastewater flow","Adding chemical coagulants","Pumping sludge"],"answer":"2","solution":"Comminutors (or macerators) are devices installed in the influent channel to cut and shred large solid materials (like rags and plastics) into smaller pieces, allowing them to pass through downstream equipment without clogging."},{"id":"82943","q":"The \"National Air Quality Index\" (AQI) of India transforms complex air quality data into a single number. An AQI value between 201 and 300 falls into which category?","options":["Good","Moderate","Poor","Severe"],"answer":"3","solution":"In the Indian AQI scale: 0-50 is Good, 51-100 is Satisfactory, 101-200 is Moderate, 201-300 is Poor, 301-400 is Very Poor, and 401-500 is Severe."},{"id":"82944","q":"In the hierarchy of waste management, which is the most preferred strategy?","options":["Energy Recovery (Waste-to-Energy)","Recycling and Composting","Waste Prevention and Source Reduction","Safe Disposal in a Landfill"],"answer":"3","solution":"The Waste Management Hierarchy prioritizes the prevention and reduction of waste at the source as the most effective environmental strategy, followed by reuse, recycling, recovery, and lastly, disposal."},{"id":"82945","q":"The biological process that converts Nitrates ( ) to Nitrogen Gas ( ) under anoxic conditions is called:","options":["Nitrification","Denitrification","Ammonification","Nitrogen Fixation"],"answer":"2","solution":"Denitrification is an anoxic biological process where heterotrophic bacteria use nitrate as an electron acceptor instead of oxygen, converting it into inert nitrogen gas which escapes into the atmosphere."},{"id":"82946","q":"According to the Biomedical Waste Management Rules, 2016, discarded metallic implants and contaminated glassware should be disposed of in which colored container?","options":["Red","Yellow","Blue","White (Translucent)"],"answer":"3","solution":"The Blue colored box/container is specifically designated for broken or discarded and contaminated glass (including medicine vials) and metallic body implants."},{"id":"82947","q":"\"Polychlorinated Biphenyls\" (PCBs) are hazardous organic compounds historically used in:","options":["Agricultural fertilizers","Electrical transformers and capacitors as dielectric fluids","Food preservatives","Municipal water disinfection"],"answer":"2","solution":"PCBs are highly toxic, persistent organic pollutants (POPs) that were widely used as coolants and dielectric fluids in electrical transformers and capacitors due to their chemical stability and high boiling point."},{"id":"82948","q":"In an aerobic oxidation pond, what is the primary source of dissolved oxygen for the bacteria?","options":["Mechanical surface aerators","Photosynthesis by algae","Chemical oxygen generators","Incoming influent oxygen"],"answer":"2","solution":"Oxidation ponds rely on a symbiotic relationship where algae produce oxygen through photosynthesis (using sunlight and ), which is then utilized by aerobic bacteria to break down organic waste."},{"id":"82949","q":"The \"Rotterdam Convention\" is an international treaty designed to promote shared responsibilities in relation to the importation of:","options":["Endangered wild fauna","Hazardous chemicals and pesticides","Municipal solid waste","Ozone-depleting substances"],"answer":"2","solution":"The Rotterdam Convention facilitates the Prior Informed Consent (PIC) procedure for certain hazardous chemicals and pesticides in international trade."},{"id":"82950","q":"In an Electrostatic Precipitator (ESP), the \"Corona Discharge\" is generated by:","options":["The collection plates","The high-voltage discharge electrodes (wires)","The rapping mechanism","The exhaust fan"],"answer":"2","solution":"A high negative direct current (DC) voltage is applied to the discharge electrodes (thin wires), creating a corona discharge that ionizes the surrounding gas and gives a negative charge to passing dust particles."},{"id":"82951","q":"A \"Trickling Filter\" is an example of which type of biological treatment process?","options":["Suspended Growth Process","Attached Growth (Film) Process","Anaerobic Digestion","Physical-Chemical Process"],"answer":"2","solution":"In a trickling filter, microorganisms form a biological slime layer (biofilm) attached to a solid medium (rocks or plastic). As wastewater trickles over it, the attached microbes degrade the organics."},{"id":"82952","q":"The term \"E-waste\" under the E-Waste (Management) Rules, 2016, includes:","options":["Only computers and mobile phones","All electrical and electronic equipment, whole or in part, discarded as waste by the consumer or bulk consumer","Only industrial heavy machinery","Only lead-acid automotive batteries"],"answer":"2","solution":"The legal definition of E-waste is comprehensive, covering all electrical and electronic equipment (EEE), their components, consumables, and spares that have been discarded."},{"id":"82953","q":"Which parameter measures the strength of sewage based on the amount of potassium dichromate ( ) required to chemically oxidize its organic matter?","options":["BOD","COD","TOC","DO"],"answer":"2","solution":"Chemical Oxygen Demand (COD) uses a strong chemical oxidant (potassium dichromate) in an acidic medium to oxidize both biodegradable and non-biodegradable organic matter."},{"id":"82954","q":"\"Sloughing\" is an operational phenomenon strictly associated with:","options":["Activated Sludge Process","Sedimentation Tanks","Trickling Filters and RBCs","Sludge Drying Beds"],"answer":"3","solution":"Sloughing refers to the periodic detachment and washing away of the thickened, overgrown biological slime layer from the media of attached growth reactors like Trickling Filters and Rotating Biological Contactors."},{"id":"82955","q":"What is the primary advantage of a \"Sanitary Landfill\" over an \"Open Dump\"?","options":["It generates zero greenhouse gases","It involves engineered environmental controls like liners, leachate collection, and daily soil cover","It requires much less land area","It allows for uncontrolled scavenging"],"answer":"2","solution":"A sanitary landfill is a highly engineered facility designed to isolate waste from the environment using bottom liners, leachate collection systems, gas venting, and the application of daily soil cover to prevent public health hazards."},{"id":"82956","q":"In the context of the Environmental Protection Act, 1986, an \"Eco-Sensitive Zone\" (ESZ) is primarily declared around:","options":["Major metropolitan cities","National Parks, Wildlife Sanctuaries, and Protected Areas","Heavy industrial corridors","Coastal ports"],"answer":"2","solution":"ESZs are notified by the MoEF&CC around Protected Areas to act as a \"shock absorber\" or transition zone, regulating specific highly polluting activities near fragile ecosystems."},{"id":"82957","q":"Which method is used to determine the \"Volatile Suspended Solids\" (VSS) of a wastewater sludge sample?","options":["Drying the sample at","Igniting the dried solids in a muffle furnace at","Titrating with Sulfuric Acid","Passing the sample through a 0.45-micron filter"],"answer":"2","solution":"To find VSS (which represents the organic/biological fraction), the total suspended solids previously dried at are ignited at C. The mass lost during ignition represents the volatile solids."},{"id":"82958","q":"The \"Central Ground Water Authority\" (CGWA) was constituted under the provisions of which Act?","options":["The Water (Prevention and Control of Pollution) Act, 1974","The Environment (Protection) Act, 1986","The Public Liability Insurance Act, 1991","The National Green Tribunal Act, 2010"],"answer":"2","solution":"The CGWA was constituted under sub-section (3) of Section 3 of the Environment (Protection) Act, 1986, to regulate and control groundwater development and management."},{"id":"82959","q":"\"Hardness\" in water is primarily caused by the presence of multivalent metallic cations, most notably:","options":["Sodium and Potassium","Calcium and Magnesium","Iron and Manganese","Aluminum and Zinc"],"answer":"2","solution":"While other multivalent cations can contribute, total water hardness is predominantly caused by the dissolved salts (bicarbonates, chlorides, sulfates) of Calcium ( ) and Magnesium ( )."},{"id":"82960","q":"Which of the following is a non-destructive technology used for sorting different types of plastics (like PET vs. HDPE) in a Material Recovery Facility?","options":["Hammer Milling","Near-Infrared (NIR) Spectroscopy","Plasma Gasification","Trommel Screening"],"answer":"2","solution":"NIR spectroscopy sensors rapidly analyze the way different polymers reflect near-infrared light, automatically identifying and allowing air jets to sort distinct plastic resin types on a fast-moving conveyor belt."},{"id":"82961","q":"According to the Hazardous Waste Management Rules, an occupier must maintain records of hazardous waste handled in Form 3 and submit annual returns to the SPCB by which date every year?","options":["31st March","30th June","30th September","31st December"],"answer":"2","solution":"The rules mandate that the annual return detailing the management of hazardous waste during the previous financial year must be submitted to the State Pollution Control Board on or before the 30th day of June."},{"id":"82962","q":"In a \"Cyclone Separator\", the collection efficiency for a given particle size will generally increase if:","options":["The inlet gas velocity decreases","The diameter of the cyclone body decreases","The gas temperature increases significantly","The particle density decreases"],"answer":"2","solution":"Decreasing the cyclone diameter tightens the turning radius of the vortex, significantly increasing the centrifugal force acting on the particles, which improves collection efficiency for smaller particles."},{"id":"82963","q":"\"Sullage\" refers to wastewater from:","options":["Toilets and urinals containing fecal matter","Industrial manufacturing processes","Kitchen sinks, bathrooms, and laundries (excluding fecal matter)","Rainwater street runoff"],"answer":"3","solution":"Sullage (also known as greywater) is the wastewater originating from domestic activities such as bathing, washing dishes, and laundry, which does not contain significant amounts of human excreta."},{"id":"82964","q":"The \"Crown\" of a sewer pipe refers to:","options":["The lowest interior point of the pipe","The highest interior point of the pipe","The exterior foundation bed","The joint connecting two pipes"],"answer":"2","solution":"The highest interior point of the cross-section of a sewer pipe is called the crown, while the lowest interior point is called the invert."},{"id":"82965","q":"Which of the following is an \"End-of-Pipe\" pollution control strategy?","options":["Using lead-free raw materials","Modifying the internal manufacturing process to produce less waste","Installing a scrubber on an exhaust stack","Designing products that last longer"],"answer":"3","solution":"End-of-pipe technologies treat or capture pollution just before it is released into the environment (like scrubbers or wastewater clarifiers), rather than preventing it at the source during production."},{"id":"82966","q":"\"Vermicomposting\" utilizes specific species of earthworms. Which species is most commonly used in India for this purpose due to its high efficiency?","options":["Pheretima posthuma","Lumbricus terrestris","Eisenia fetida","Ascaris lumbricoides"],"answer":"3","solution":"Eisenia fetida (commonly known as red wigglers or brandling worms) is an epigeic earthworm species globally and domestically favored for vermicomposting because it thrives in rotting organic matter and reproduces rapidly."},{"id":"82967","q":"Under the Plastic Waste Management Rules, what is the meaning of the term \"Carry Bags\"?","options":["Bags made solely from jute or cloth","Bags made from plastic material, used for the purpose of carrying or dispensing commodities","Industrial heavy-duty sacks","Biodegradable garbage bin liners"],"answer":"2","solution":"The rules define \"carry bags\" as bags made from plastic material or compostable plastic material, used for the purpose of carrying or dispensing commodities which are provided by vendors."},{"id":"82968","q":"A \"Bar Screen\" in a sewage treatment plant is installed at an angle of to to the horizontal primarily to:","options":["Increase the velocity of the flow","Facilitate easier manual or mechanical raking and cleaning of the accumulated debris","Measure the influent flow rate","Prevent the entry of dissolved chemicals"],"answer":"2","solution":"Inclining the bar screens allows rakes (either mechanical or manual) to smoothly slide up the bars to pull away and remove the accumulated coarse solids (rags, plastics, branches)."},{"id":"82969","q":"What is the main objective of the \"Scoping\" phase in an Environmental Impact Assessment (EIA)?","options":["To write the final executive summary","To determine the spatial, temporal, and thematic boundaries of the EIA study and establish the Terms of Reference (ToR)","To grant the final environmental clearance","To calculate the financial return on investment"],"answer":"2","solution":"Scoping identifies the key environmental issues and impacts that require detailed investigation. Based on this, the Expert Appraisal Committee formulates the comprehensive Terms of Reference (ToR) for the EIA study."},{"id":"82970","q":"In the context of sound waves, \"Pitch\" is directly related to the wave's:","options":["Amplitude","Frequency","Speed","Intensity"],"answer":"2","solution":"The pitch of a sound is how high or low it sounds to the human ear, and it is determined by the frequency of the sound wave (measured in Hertz). Higher frequencies produce higher pitches."},{"id":"82971","q":"The \"National Water Policy\" of India explicitly states that in the planning and operation of water resource systems, the highest priority should be given to:","options":["Irrigation for agriculture","Hydro-electric power generation","Drinking water","Industrial uses"],"answer":"3","solution":"The National Water Policy dictates water allocation priorities. Drinking water (for human and animal consumption) invariably holds the supreme first priority over all other uses."},{"id":"82972","q":"The \"A-Scale\" weighting in noise measurement, denoted as dB(A), is used because:","options":["It measures only low-frequency industrial vibrations","It filters out high frequencies entirely","It mimics the non-linear response of the human ear, which is less sensitive to very low and very high frequencies","It calculates the average noise over 24 hours"],"answer":"3","solution":"The A-weighting curve adjusts the measured sound pressure levels across the frequency spectrum to correspond closely to the way the human ear perceives loudness."},{"id":"82973","q":"Which method of composting is characterized as an \"Anaerobic\" process?","options":["Indore Method","Windrow Method","Bangalore Method","Aerated Static Pile"],"answer":"3","solution":"The Bangalore method involves placing organic waste and night soil in alternating layers inside a trench, which is then sealed completely with mud to undergo slow anaerobic decomposition over several months."},{"id":"82974","q":"The legal principle \"Res Ipsa Loquitur\" in environmental tort cases translates to:","options":["The polluter must pay","The thing speaks for itself","Buyer beware","Beyond reasonable doubt"],"answer":"2","solution":"This doctrine infers negligence from the very nature of an accident or injury in the absence of direct evidence. It is sometimes invoked in strict liability environmental disaster cases (e.g., a massive toxic gas leak)."},{"id":"82975","q":"\"Alkalinity\" of water is its capacity to:","options":["Neutralize acids","Neutralize bases","Conduct electricity","Dissolve heavy metals"],"answer":"1","solution":"Alkalinity is a measure of the buffering capacity of water, or its ability to neutralize strong acids without undergoing a significant drop in pH. It is primarily due to bicarbonates, carbonates, and hydroxides."},{"id":"82976","q":"According to the Construction & Demolition Waste Management Rules, 2016, large construction projects must submit a waste management plan to the local authority. What is the minimum lead time required for this submission before the start of construction?","options":["15 days","1 month","3 months","6 months"],"answer":"2","solution":"Large generators of C&D waste are legally required to prepare and submit a comprehensive waste management plan to the local municipal authority at least one month prior to the commencement of the construction work."},{"id":"82977","q":"In an oxidation pond, what happens to the Dissolved Oxygen (DO) levels during a 24-hour diurnal cycle?","options":["DO remains constant day and night","DO is highest in the late afternoon and lowest just before sunrise","DO is highest at midnight and lowest at noon","DO only fluctuates during the winter"],"answer":"2","solution":"Due to algal photosynthesis requiring sunlight, oxygen production peaks in the late afternoon. At night, photosynthesis stops, but bacterial respiration continues, depleting DO to its lowest point just before dawn."},{"id":"82978","q":"The \"Appiko Movement\", an environmental conservation movement inspired by the Chipko Movement, originated in which Indian state?","options":["Uttarakhand","Kerala","Karnataka","Madhya Pradesh"],"answer":"3","solution":"The Appiko movement (Appiko means \"to embrace\" in Kannada) was a prominent forest conservation movement that started in the Uttara Kannada district of Karnataka in 1983."},{"id":"82979","q":"Which of the following best defines \"Specific Yield\" of an aquifer?","options":["The total volume of water stored in the aquifer","The volume of water that will drain from the aquifer by gravity alone","The volume of water retained by capillary forces against gravity","The rate at which water is pumped from a well"],"answer":"2","solution":"Specific yield is the ratio of the volume of water that an unconfined aquifer yields to gravity drainage relative to the total volume of the aquifer material. The water retained against gravity is the \"specific retention\"."},{"id":"82980","q":"Under the Environment (Protection) Act, 1986, which of the following authorities was constituted to regulate Coastal Regulation Zones (CRZ)?","options":["National Green Tribunal","Central Pollution Control Board","Coastal Zone Management Authority (NCZMA/SCZMA)","Inland Waterways Authority of India"],"answer":"3","solution":"The National and State Coastal Zone Management Authorities were specifically constituted under the provisions of the Environment (Protection) Act, 1986 to enforce and monitor the CRZ Notifications."}];
let idx=0, answers={}, timerSec=65*60, timerInt=null;

function render(){
  const q=DATA[idx];
  if(!q){document.getElementById('qText').textContent='No data.';return;}
  document.getElementById('qNum').textContent=idx+1;
  document.getElementById('qTotal').textContent=DATA.length;
  document.getElementById('qText').textContent=q.q;
  document.getElementById('opts').innerHTML=q.options.map((o,i)=>
    `<div class="option ${answers[idx]==(i+1)?'selected':''}" onclick="select(${i+1})">${String.fromCharCode(65+i)}. ${o}</div>`
  ).join('');
}
window.select=o=>{answers[idx]=o; render();};
window.prev=()=>{if(idx>0){idx--; render();}};
window.next=()=>{if(idx<DATA.length-1){idx++; render();}};

function submitTest(){
  clearInterval(timerInt);
  let c=0; for(let i=0;i<DATA.length;i++){if(answers[i]==DATA[i].answer)c++;}
  const pct=Math.round(c/DATA.length*100)||0;
  document.getElementById('qCard').classList.add('hidden');
  document.getElementById('resCard').classList.remove('hidden');
  document.getElementById('score').textContent=pct+'%';
  document.getElementById('detail').innerHTML='<b>'+c+'/'+DATA.length+'</b> correct';
}

function tick(){timerSec--; document.getElementById('timer').textContent=Math.floor(timerSec/60)+':'+String(timerSec%60).padStart(2,'0'); document.getElementById('bar').style.width=(timerSec/(65*60)*100)+'%'; if(timerSec<=0){clearInterval(timerInt); submitTest();}}

render(); timerInt=setInterval(tick,1000);
</script>
</body></html>
