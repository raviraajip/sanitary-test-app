<!DOCTYPE html>
<html lang="hi">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>ASWMO — T17 Full Test-Tech</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
:root{--bg:#0b0c15;--surface:#12142a;--text:#e4e6f0;--accent:#00e8a0;--gold:#f0c040;--danger:#ff4d6d;--border:rgba(255,255,255,.08);--muted:#8a8fa8;}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:Inter,system-ui,sans-serif;background:radial-gradient(1000px 700px at 20% 0%,#00e8a011,transparent),var(--bg);color:var(--text);min-height:100vh;line-height:1.55;}
.container{max-width:900px;margin:2rem auto;padding:0 1.2rem;}
h1{font-size:1.6rem;font-weight:700;background:linear-gradient(135deg,#fff,var(--accent));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.card{background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:16px;padding:1.5rem;margin-bottom:1rem;}
.question{font-size:1.05rem;font-weight:500;margin-bottom:.8rem;line-height:1.35;}
.options{display:grid;gap:.5rem;}
.option{padding:.7rem 1rem;background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:10px;cursor:pointer;font-size:.92rem;transition:.2s;}
.option:hover,.option.selected{border-color:var(--accent);background:rgba(0,232,160,.12);font-weight:600;}
.timer{font-family:monospace;font-weight:700;font-size:2rem;color:var(--accent);}
button{background:linear-gradient(135deg,var(--accent),#00b87e);color:#0a0c12;border:none;padding:.7rem 1.4rem;border-radius:10px;font-weight:700;cursor:pointer;}
.hidden{display:none!important}</style>
</head>
<body>
<div class="container">
<header><h1 id="ptitle">ASWMO — T17 Full Test-Tech</h1></header>

<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;">
<div><div class="timer" id="timer">65:00</div><div style="font-size:.75rem;color:var(--muted);">Time Remaining</div></div>
<button onclick="submitTest()">Submit Test</button></div>
<div style="height:6px;background:rgba(255,255,255,.1);border-radius:3px;overflow:hidden;margin-top:.5rem;"><div id="bar" style="height:100%;width:100%;background:linear-gradient(90deg,var(--accent),#00b87e);transition:width 1s linear;"></div></div></div>

<div class="card" id="qCard">
<div style="font-size:.8rem;color:var(--muted);margin-bottom:.4rem;">Question <span id="qNum">1</span> / <span id="qTotal">?</span></div>
<div class="question" id="qText">Loading...</div>
<div class="options" id="opts"></div>
<div style="margin-top:1rem;display:flex;gap:.5rem;flex-wrap:wrap;">
<button onclick="prev()">&#8592; Prev</button><button onclick="next()">Next &#8594;</button><button onclick="submitTest()">Submit</button></div>
</div>

<div class="card hidden" id="resCard" style="text-align:center;padding:2rem;">
<h2 style="color:var(--gold);font-size:2rem;">Test Completed!</h2>
<div id="score" style="font-size:3rem;font-weight:800;color:var(--accent);margin:1rem 0;"></div>
<div id="detail" style="color:var(--muted);font-size:.95rem;"></div>
<div style="margin-top:1.5rem;"><a href="index.html" style="color:var(--accent);font-weight:600;">&#8592; Back</a></div>
</div>
</div>

<script>
const DATA=[{"id":"75544","q":"Which of the following wastes is likely to contain cyanide compounds?","options":["Tannery waste","Electroplating waste","Textile dyeing waste","Paper mill waste"],"answer":"2"},{"id":"75545","q":"Hazardous wastes are generally stored in containers made of:","options":["Cardboard","Plastic bags","Corrosion-resistant materials","Paper drums"],"answer":"3"},{"id":"75546","q":"Incineration of hazardous waste reduces:","options":["Waste volume only","Toxicity only","Both volume and toxicity","Nothing"],"answer":"3"},{"id":"75547","q":"Which Indian standard provides guidelines for hazardous waste incinerators?","options":["IS 302","IS 4989","CPCB Guidelines 2005","IS 15516"],"answer":"4"},{"id":"75548","q":"The import of hazardous waste is allowed only for:","options":["Dumping purposes","Landfilling","Recycling, recovery, or reuse","Incineration"],"answer":"3"},{"id":"75549","q":"The correct order of water treatment is","options":["Coagulation, Disinfection, Filtration, Aeration","Aeration, Coagulation, Filtration, Disinfection","Disinfection, Filtration, Coagulation, Aeration","Filtration, Coagulation, Disinfection, Aeration"],"answer":"2"},{"id":"75550","q":"For conventional activated sludge process, the F/M ratio should range between","options":["0.1-0.2","0.5-1.0","0.3-0.4","0.05-0.10"],"answer":"3"},{"id":"75551","q":"Sludge volume index is used to indicate","options":["Physical state of the sludge produced","BOD concentration","Sludge to volume ratio","Desired sludge rate"],"answer":"1"},{"id":"75552","q":"If a sewer carrying a discharge of 3 cumec outfalls into a river having a discharge of 10 cumec and DO equal to 9.1 mg/L, the resultant DO of the mix is","options":["7 mg/L","5 mg/L","6 mg/L","8 mg/L"],"answer":"1"},{"id":"75553","q":"Lower Food to Micro-organic (F/M) ratio in a conventional activated treatment plant will mean:","options":["Lower BOD removal","Higher BOD removal","No effect on BOD removal","Medium BOD removal"],"an  of fresh and septic sewage respectively are","options":["acidic and alkaline","alkaline and acidic","both acidic","both alkaline"],"answer":"2"},{"id":"75564","q":"A trickling filter is primarily a","options":["straining process to remove suspended solids from sewage","biological oxidation process to remove BOD from sewage","straining process to remove turbidity from water","straining process to remove bacteria from water"],"answer":"2"},{"id":"75565","q":"Which of the following is NOT a type of Environmental Impact Assessment?","options":["Risk Assessment","Public Consultation","Project Evaluation","Policy Assessment"],"answer":"4"},{"id":"75566","q":"The National Environmental Policy Act (NEPA) of 1969 (Pub. L. 91-190) of USA became effective on","options":["January 1, 1969","January 1, 1970","December 31, 1970","December 31, 1969"],"answer":"2"},{"id":"75567","q":"Under the current EIA notification, which is the 4th stage in the process of granting environmental clearance for new projects?","options":["Appraisal","Scoping","Prediction","Screening"],"answer":"1"},{"id":"75568","q":"What is 'Hard-data' used for EIA?","options":["Perspective driven information with high variability and uncertainties","Reliable but temporary information that can be altered with time","Water quality data, where hard water is reported","Reliable, permanent information not subjected to change with time"],"answer":"4"},{"id":"75569","q":"Every developmental project has positive and negative impacts. Measures taken to maximize positive impacts and minimize negative impacts is termed as","options":["Environment Management Plan","Baseline measurement","Socio-economic study","Scoping"],"answer":"1"},{"id":"75570","q":"As a part of Environmental audit process, \"feedback from the industries\" needs to be done. This is coming under which steps in Environmental auditing process.","options":["Pre audit activities","On-site activities","Post audit activities","Report preparation activities"],"an levant documentary proofs such as:","options":["Terms of reference","Monitoring Plan","Feasibility study","Risk statement"],"answer":"1"},{"id":"75576","q":"Negative impacts on the environment identified during the EIA can be mitigated. The mitigation hierarchy is:","options":["Remedy - Minimise - Avoid","Avoid - Minimise - Remedy","Reduce - Remedy - Avoid","Remedy - Avoid - Minimise"],"answer":"2"},{"id":"75577","q":"If in the screening stage of EIA, the environmental impacts are not clarified, then what step should be adopted?","options":["Scoping should be performed","Rapid EIA should be conducted","Rescreening should be done","Project should be abandoned"],"answer":"2"},{"id":"75578","q":"EMS stands for:","options":["Environment Management System","Environment Man System","Ecosystem Management System","None of these"],"answer":"1"},{"id":"75579","q":"Principle 17 of the Rio declaration deals with","options":["Environmental Pollution","Environmental Conservation","Environmental Degradation","Environmental Impact Assessment"],"answer":"4"},{"id":"75580","q":"When was the National Green Tribunal (NGT) established?","options":["2010","1987","1973","2000"],"answer":"1"},{"id":"75581","q":"ISO 9000:2015 deals with","options":["Quality Management Systems Requirements","Quality Management Systems Fundamentals and Vocabulary","Quality Management - Quality of an Organization Guidance to Achieve Sustained Success","Guidelines for Auditing Management Systems"],"answer":"2"},{"id":"75582","q":"Section 2 (j) of Water (Prevention and Control of Pollution) Act, 1974 defines 'stream'. Which of the following element/s is/are included in the definition of 'stream'? 1. River 2. Subterranean waters 3. Inland water 4. Sea","options":["Only (4)","Only (1), (2) & (3)","Only (2) & (3)","All of the above"],"answer":"4"},{"id":"75583","q":"In the Water Act, prohibition on use of stream or well for disposal of poisonous, noxious or polluting matter, comes under :","options":["Section 29","Section 24","Section 40","Section 32"],"answer":"2"},{"id":"75584","q":"Generally for how many years can a member of a Board, constituted under The Water (Prevention and Control of Pollution) Act, 1974, hold office from the date of his nomination?","options":["3 years","2 years","4 years","5 years"],"answer":"1"},{"id":"75585","q":"Under the Air (Prevention and Control of Pollution) Act, 1981, who is responsible for the enforcement of air quality standards?","options":["National Green Tribunal (NGT)Environmental Protection Agency (EPA)","Ministry of Environment, Forests and Climate Change","Central Pollution Control Board (CPCB)","The Air Prevention and Control of Pollution Act 1981"],"answer":"4"},{"id":"75586","q":"Which of the following statements about the National Green Tribunal (NGT) of India is NOT true?","options":["The NGT was established under the National Green Tribunal Act, 2010, with the objective of providing a specialized forum for the effective and expeditious disposal of environmental cases.","The NGT has the authority to hear cases related to the enforcement of environmental laws and the protection of the environment, but it does not have the power to award compensation for environmental damage.","The NGT has a total of five places of sitting namely: Bhopal, Pune, New Delhi, Kolkata, and Chennai, amongst which, New Delhi is the Principal place of sitting","NGT Act 2010 draws inspiration from the India's constitutional provision of Article 21 - Protection of life and personal liberty, which assures the citizens of India the right to a healthy environment"],"answer":"2"},{"id":"75587","q":"Consider the following pairs: a. NGT 1. Ferroin indicator b. Blue baby disease 2. Nitric acid c. CO 2 3. National Green Tribunal d. HNO 3 4. Nation Green Test Which of the above pairs are correctly matched?","options":["a-3, d-2","a-4, b-3","a-4, b-1","c-4, d-2"],"answer":"1"},{"id":"75588","q":"Match the term with its appropriate description. Activity Description a. Environmental management program 1. A method to predict environmental consequences of proposed decisions b. Environmental impact assessment 2. Management of environmental impacts including uncertainties c. Environmental risk assessment 3. An approach to evaluate potential negative impacts and their probabilities d. Environmental enhancement 4. Positive interventions to improve the environment Choose the correct option from the following:","options":["a-2, b-1, c-3, d-4","a-2, b-3, c-4, d-1","a-2, b-3, c-1, d-4","a-4, b-3, c-1, d-2"],"answer":"1"},{"id":"75589","q":"NGT Tribunal has banned the use of non-biodegradable plastic bags less than ______ microns in the entire capital city of Delhi.","options":["50","60","70","80"],"answer":"1"},{"id":"75590","q":"Which of the following protocols aims to phase out hydrofluorocarbons?","options":["Montreal Protocol","Nagoya Protocol","Kyoto Protocol","Cartagena Protocol"],"answer":"1"},{"id":"75591","q":"A short-term environmental impact assessment (EIA) has a time period of:","options":["2-5 years","10-15 years","5-10 years","5-7 years"],"answer":"3"},{"id":"75592","q":"The average per capita solid waste generation in Indian cities is about:","options":["100–200 g/day","200–600 g/day","1–2 kg/day","5–10 kg/day"],"answer":"2"},{"id":"75593","q":"The moisture content in municipal solid waste usually ranges from:","options":["5–10%","10–20%","20–40%","40–60%"],"answer":"4"},{"id":"75594","q":"Vermicomposting uses:","options":["Bacteria","Earthworms","Fungi","Algae"],"answer":"2"},{"id":"75595","q":"The term “Refuse-Derived Fuel (RDF)” refers to:","options":["Fuel from fossil sources","Dried and processed solid waste for energy","Pure biomass fuel","Biogas"],"answer":"2"},{"id":"75596","q":"Pyrolysis is carried out:","options":["In the presence of air","In absence of air","Under sunlight","Under pressure only"],"answer":"2"},{"id":"75597","q":"The National Green Tribunal (NGT) was established in:","options":["1995","2000","2010","2015"],"answer":"3"},{"id":"75598","q":"Biodegradable waste should be collected:","options":["Once a week","Daily","Monthly","Quarterly"],"answer":"2"},{"id":"75599","q":"Composting is an example of:","options":["Chemical process","Physical process","Biological process","Mechanical process"],"answer":"3"},{"id":"75600","q":"Fly ash generated in incineration is classified as:","options":["Non-hazardous waste","Hazardous waste","Organic waste","Recyclable waste"],"answer":"2"},{"id":"75601","q":"The “Swachh Bharat Mission” was launched in:","options":["2012","2014","2015","2016"],"answer":"2"},{"id":"75602","q":"Biomedical waste should be treated within:","options":["12 hours","24 hours","48 hours","72 hours"],"answer":"3"},{"id":"75603","q":"Life cycle assessment (LCA) in waste management evaluates:","options":["Financial returns","Environmental impact from generation to disposal","Transportation logistics","Workforce efficiency"],"answer":"2"},{"id":"75604","q":"The minimum height of landfill final cover should be:","options":["0.3 m","0.5 m","1.0 m","1.5 m"],"answer":"3"},{"id":"75605","q":"The “zero waste” concept aims for:","options":["Maximum landfill","Complete elimination of waste through reuse/recycling","Waste export to other cities","Chemical treatment only"],"answer":"2"},{"id":"75606","q":"Leachate treatment methods include:","options":["Reverse osmosis","Aeration","Biological treatment","All of the above"],"answer":"4"},{"id":"75607","q":"The life of a landfill depends mainly on:","options":["Rainfall","Waste volume and compaction","Soil color","Wind speed"],"answer":"2"},{"id":"75608","q":"The ultimate goal of solid waste management is:","options":["Collection and transport","Disposal only","Resource recovery and pollution prevention","Burning waste"],"answer":"3"}];
let idx=0, answers={}, timerSec=3900, timerInt=null;

function render(){
  const q=DATA[idx];
  if(!q){document.getElementById('qText').textContent='No data.';return;}
  document.getElementById('qNum').textContent=idx+1;
  document.getElementById('qTotal').textContent=DATA.length;
  document.getElementById('qText').textContent=q.q;
  document.getElementById('opts').innerHTML=q.options.map((o,i)=>
    `<div class="option ${answers[idx]==(i+1)?'selected':''}" onclick="select(${i+1})">${String.fromCharCode(65+i)}. ${o}</div>`
  ).join('');
}
window.select=o=>{answers[idx]=o; render();};
window.prev=()=>{if(idx>0){idx--; render();}};
window.next=()=>{if(idx<DATA.length-1){idx++; render();}};

function submitTest(){
  clearInterval(timerInt);
  let c=0; for(let i=0;i<DATA.length;i++){if(answers[i]==DATA[i].answer)c++;}
  const pct=Math.round(c/DATA.length*100)||0;
  document.getElementById('qCard').classList.add('hidden');
  document.getElementById('resCard').classList.remove('hidden');
  document.getElementById('score').textContent=pct+'%';
  document.getElementById('detail').innerHTML='<b>'+c+'/'+DATA.length+'</b> correct';
}

function tick(){timerSec--; document.getElementById('timer').textContent=Math.floor(timerSec/60)+':'+String(timerSec%60).padStart(2,'0'); document.getElementById('bar').style.width=(timerSec/3900*100)+'%'; if(timerSec<=0){clearInterval(timerInt); submitTest();}}

render(); timerInt=setInterval(tick,1000);
</script>
