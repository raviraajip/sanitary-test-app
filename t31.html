<!DOCTYPE html>
<html lang="hi">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>ASWMO — T31 Full Test-Tech</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
:root{--bg:#0b0c15;--surface:#12142a;--text:#e4e6f0;--accent:#00e8a0;--gold:#f0c040;--danger:#ff4d6d;--border:rgba(255,255,255,.08);--muted:#8a8fa8;}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:Inter,system-ui,sans-serif;background:radial-gradient(1000px 700px at 20% 0%,#00e8a011,transparent),var(--bg);color:var(--text);min-height:100vh;line-height:1.55;}
.container{max-width:900px;margin:2rem auto;padding:0 1.2rem;}
h1{font-size:1.6rem;font-weight:700;background:linear-gradient(135deg,#fff,var(--accent));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.card{background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:16px;padding:1.5rem;margin-bottom:1rem;}
.question{font-size:1.05rem;font-weight:500;margin-bottom:.8rem;line-height:1.35;}
.options{display:grid;gap:.5rem;}
.option{padding:.7rem 1rem;background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:10px;cursor:pointer;font-size:.92rem;transition:.2s;}
.option:hover,.option.selected{border-color:var(--accent);background:rgba(0,232,160,.12);font-weight:600;}
.timer{font-family:monospace;font-weight:700;font-size:2rem;color:var(--accent);}
button{background:linear-gradient(135deg,var(--accent),#00b87e);color:#0a0c12;border:none;padding:.7rem 1.4rem;border-radius:10px;font-weight:700;cursor:pointer;}
.hidden{display:none!important}</style>
</head>
<body>
<div class="container">
<header><h1 id="ptitle">ASWMO — T31 Full Test-Tech</h1></header>

<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;">
<div><div class="timer" id="timer">65:00</div><div style="font-size:.75rem;color:var(--muted);">Time Remaining</div></div>
<button onclick="submitTest()">Submit Test</button></div>
<div style="height:6px;background:rgba(255,255,255,.1);border-radius:3px;overflow:hidden;margin-top:.5rem;"><div id="bar" style="height:100%;width:100%;background:linear-gradient(90deg,var(--accent),#00b87e);transition:width 1s linear;"></div></div></div>

<div class="card" id="qCard">
<div style="font-size:.8rem;color:var(--muted);margin-bottom:.4rem;">Question <span id="qNum">1</span> / <span id="qTotal">?</span></div>
<div class="question" id="qText">Loading...</div>
<div class="options" id="opts"></div>
<div style="margin-top:1rem;display:flex;gap:.5rem;flex-wrap:wrap;">
<button onclick="prev()">&#8592; Prev</button><button onclick="next()">Next &#8594;</button><button onclick="submitTest()">Submit</button></div>
</div>

<div class="card hidden" id="resCard" style="text-align:center;padding:2rem;">
<h2 style="color:var(--gold);font-size:2rem;">Test Completed!</h2>
<div id="score" style="font-size:3rem;font-weight:800;color:var(--accent);margin:1rem 0;"></div>
<div id="detail" style="color:var(--muted);font-size:.95rem;"></div>
<div style="margin-top:1.5rem;"><a href="index.html" style="color:var(--accent);font-weight:600;">&#8592; Back</a></div>
</div>
</div>

<script>
const DATA=[{"id":"79332","q":"A city generates 100 tonnes of municipal solid waste (MSW) per day with a moisture content of 45%. If the waste is dried completely, what is the mass of the dry solids?","options":["45 tonnes","50 tonnes","55 tonnes","65 tonnes"],"answer":"3"},{"id":"79333","q":"Under the Solid Waste Management Rules, 2016, who is responsible for providing a system for the collection of sanitary waste from households?","options":["The Manufacturer of sanitary products","The Waste Generator","The Local Body (Urban Local Body)","The State Pollution Control Board"],"answer":"3"},{"id":"79334","q":"Which bacteria is primarily responsible for converting Ammonia ( ) to Nitrite ( ) in the first stage of nitrification?","options":["Nitrobacter","Nitrosomonas","Pseudomonas","E. coli"],"answer":"2"},{"id":"79335","q":"If the of a wastewater sample is 200 mg/L and the reaction rate constant (k) is 0.23 (base e), what is the Ultimate BOD ( )? (Given 0.31)","options":["250 mg/L","290 mg/L","310 mg/L","150 mg/L"],"answer":"2"},{"id":"79336","q":"The \"Cradle-to-Grave\" approach in Hazardous Waste Management specifically refers to:","options":["Recycling of plastic waste into new products.","Managing waste from generation point to final disposal.","The lifecycle assessment of electronic goods.","Converting waste to energy."],"answer":"2"},{"id":"79337","q":"In an Environmental Impact Assessment (EIA), which category of projects requires mandatory environmental clearance from the Central Government (MoEF&CC)?","options":["Category B2","Category B1","Category A","Category C"],"answer":"3"},{"id":"79338","q":"Calculate the Sludge Volume Index (SVI) if the 30-minute settled sludge volume is 300 mL/L and the Mixed Liquor Suspended Solids (MLSS) concentration is 3000 mg/L.","options":["10 mL/g","50 mL/g","100 mL/g","150 mL/g"],"answer":"3"},{"id":"79339","q":"Which pigment is prohibited in plastic carry bags used for storing food items as per IS 9833?","options":["Cadmium- sludge production.","Remove inorganic solids."],"answer":"2"},{"id":"79358","q":"Which Ministry is the nodal agency for the Swachh Bharat Mission (Urban)?","options":["Ministry of Rural Development","Ministry of Housing and Urban Affairs (MoHUA)","Ministry of Environment, Forest and Climate Change","Ministry of Jal Shakti"],"answer":"2"},{"id":"79359","q":"Calculate the daily solid waste generation of a town with a population of 50,000 if the per capita waste generation rate is 0.4 kg/day.","options":["2,000 kg","20,000 kg","200 tonnes","5,000 kg"],"answer":"2"},{"id":"79360","q":"The term \"Brownfield\" refers to:","options":["Land used for agriculture.","Abandoned or underused industrial land with potential environmental contamination.","A new sanitary landfill site.","A composting ground."],"answer":"2"},{"id":"79361","q":"Which heavy metal causes Minamata Disease?","options":["Lead (Pb)","Cadmium (Cd)","Mercury (Hg)","Arsenic (As)"],"answer":"3"},{"id":"79362","q":"As per SWM Rules 2016, sanitary landfills are permissible for:","options":["All mixed waste.","Bio-degradable waste.","Non-usable, non-recyclable, non-biodegradable, non-combustible inert waste.","E-waste."],"answer":"3"},{"id":"79363","q":"Struvite precipitation in wastewater treatment plants is a method to recover:","options":["Calcium","Phosphorus and Nitrogen","Heavy Metals","Methane"],"answer":"2"},{"id":"79364","q":"Calculate the Hydraulic Retention Time (HRT) of a sedimentation tank with Volume V = 1000~ and Flow Rate Q = 500~ /hr.","options":["0.5 hours","2.0 hours","5.0 hours","12 hours"],"answer":"2"},{"id":"79365","q":"Which of the following is a \"Criteria Pollutant\" for calculating Air Quality Index (AQI)?","options":["[Image-based option 1 — see original]","[Image-based option 2 — see original]","[Image-based option 3 — see original]","CFCs"],"answer":"2"},{"id":"79366","q":"The process of Vitrification in hazardous waste treatment involves:","options":["Burning waste at low temperatures.","Mixing waste with cement.","Melting waste into a glass-like solid at high temperatures.","Using bacteria to degrade waste."],"answer":"3"},{"id":"79367","q":"Bio-magnification refers to:","options":["Increase in population of bacteria in ASP.","Increase in concentration of toxicants at successive trophic levels.","Expansion of landfill area.","Growth of algae in oxidation ponds."],"answer":"2"},{"id":"79368","q":"The Kyoto Protocol operationalizes which convention?","options":["UNCCD","UNFCCC","CBD","Vienna Convention"],"answer":"2"},{"id":"79369","q":"Which type of settling occurs in a Grit Chamber?","options":["Type I (Discrete Settling)","Type II (Flocculent Settling)","Type III (Zone Settling)","Type IV (Compression Settling)"],"answer":"1"},{"id":"79370","q":"Pyrolysis is an endothermic process that occurs in the:","options":["Presence of excess Oxygen","Presence of limited Oxygen","Complete absence of Oxygen","Presence of Chlorine"],"answer":"3"},{"id":"79371","q":"In the context of Swachh Survekshan, what does \"ODF+\" status signify?","options":["Not a single person defecates in the open.","ODF status + proper maintenance of community/public toilets.","ODF status + Sewage Treatment Plants.","ODF status + Safe containment and transport of fecal sludge (ODF++)."],"answer":"2"},{"id":"79372","q":"Which Indian city was ranked the cleanest in Swachh Survekshan 2024?","options":["Surat & Indore (Jointly)","Navi Mumbai","Patna","Mysore"],"answer":"1"},{"id":"79373","q":"The National Green Tribunal (NGT) was established in:","options":["2008","2010","2012","2014"],"answer":"2"},{"id":"79374","q":"Extended Aeration process is a modification of ASP with:","options":["High F/M ratio and Low Sludge Age.","Low F/M ratio and High Sludge Age.","High F/M ratio and High Sludge Age.","Low F/M ratio and Low Sludge Age."],"answer":"2"},{"id":"79375","q":"Which component of MSW has the highest Calorific Value?","options":["Food Waste","Paper","Plastics","Yard trimmings"],"answer":"3"},{"id":"79376","q":"The Public Liability Insurance Act, 1991 was enacted to provide immediate relief to persons affected by accidents occurring while handling:","options":["Plastic Waste","Hazardous Substances","Bio-medical Waste","E-Waste"],"answer":"2"},{"id":"79377","q":"Imhoff Cone is used to measure:","options":["Turbidity","Dissolved Oxygen","Settleable Solids","Total Solids"],"answer":"3"},{"id":"79378","q":"Under C&D Waste Management Rules 2016, large generators are those who generate more than:","options":["10 tonnes per day or 300 tonnes per month.","20 tonnes per day or 500 tonnes per month.","5 tonnes per day.","50 tonnes per day."],"answer":"2"},{"id":"79379","q":"The presence of E. coli in water indicates:","options":["Industrial pollution.","Heavy metal contamination.","Fecal contamination.","High hardness."],"answer":"3"},{"id":"79380","q":"Fly Ash is primarily a byproduct of:","options":["Nuclear Power Plants","Thermal Power Plants","Hydro Power Plants","Solar Power Plants"],"answer":"2"},{"id":"79381","q":"Which of the following is an example of In-situ Bioremediation?","options":["Landfarming","Biopiles","Bioventing","Composting"],"answer":"3"},{"id":"79382","q":"The permissible limit of Arsenic in drinking water as per IS 10500:2012 is:","options":["0.05 mg/L","0.01 mg/L","0.001 mg/L","0.5 mg/L"],"answer":"2"},{"id":"79383","q":"Leachate recirculation in landfills helps in:","options":["Slowing down decomposition.","Enhancing gas production and waste stabilization.","Increasing the toxicity of leachate.","Preventing methanogenesis."],"answer":"2"},{"id":"79384","q":"Which year is the \"target year\" for Net Zero emissions for India?","options":["2030","2047","2050","2070"],"answer":"4"},{"id":"79385","q":"Refuse Derived Fuel (RDF) is produced from:","options":["Wet organic waste.","Combustible fraction of MSW.","Inert construction waste.","Hazardous chemical waste."],"answer":"2"},{"id":"79386","q":"Sloughing is a phenomenon associated with:","options":["Activated Sludge Process","Trickling Filters","Oxidation Ditch","Septic Tanks"],"answer":"2"},{"id":"79387","q":"What is the purpose of a Scrubber in an incineration plant?","options":["To increase the temperature.","To remove acidic gases and particulates from flue gas.","To feed waste into the furnace.","To collect bottom ash."],"answer":"2"},{"id":"79388","q":"Who is the current Chairman of the CPCB (Central Pollution Control Board)? (Note: As of latest data)","options":["Vir Vikram Yadav","Bhupender Yadav","Naresh Pal Gangwar","S.P. Singh Parihar"],"answer":"1"},{"id":"79389","q":"Vermicomposting utilizes which species of earthworm most commonly in India?","options":["Eisenia fetida","Lumbricus terrestris","Pheretima posthuma","Megascolex mauritii"],"answer":"1"},{"id":"79390","q":"The Environment (Protection) Act was enacted in the aftermath of:","options":["The Chernobyl Disaster","The Bhopal Gas Tragedy","The Tsunami of 2004","The Oleum Gas Leak"],"answer":"2"},{"id":"79391","q":"Reverse Osmosis (RO) works on the principle of:","options":["Applying pressure greater than osmotic pressure.","Applying heat.","Using gravity.","Biological action."],"answer":"1"},{"id":"79392","q":"What is the full form of STP in waste management?","options":["Sewage Treatment Plant","Solid Treatment Protocol","Sludge Transfer Pipe","Standard Temperature Pressure"],"answer":"1"},{"id":"79393","q":"Carbon Credits are traded under which mechanism?","options":["Clean Development Mechanism (CDM)","Green Energy Corridor","Solar Alliance","Blue Economy"],"answer":"1"},{"id":"79394","q":"The Swachh Bharat Mission (Gramin) is executed by:","options":["Ministry of Jal Shakti","MoHUA","MoEF&CC","NITI Aayog"],"answer":"1"},{"id":"79395","q":"Activated Carbon is used in water treatment for the removal of:","options":["Hardness","Odor and Organic compounds (Adsorption)","Pathogens","Suspended solids"],"answer":"2"},{"id":"79396","q":"Biogas generated from anaerobic digestion primarily contains:","options":["and","and","and","and"],"answer":"1"}];
let idx=0, answers={}, timerSec=3900, timerInt=null;

function render(){
  const q=DATA[idx];
  if(!q){document.getElementById('qText').textContent='No data.';return;}
  document.getElementById('qNum').textContent=idx+1;
  document.getElementById('qTotal').textContent=DATA.length;
  document.getElementById('qText').textContent=q.q;
  document.getElementById('opts').innerHTML=q.options.map((o,i)=>
    `<div class="option ${answers[idx]==(i+1)?'selected':''}" onclick="select(${i+1})">${String.fromCharCode(65+i)}. ${o}</div>`
  ).join('');
}
window.select=o=>{answers[idx]=o; render();};
window.prev=()=>{if(idx>0){idx--; render();}};
window.next=()=>{if(idx<DATA.length-1){idx++; render();}};

function submitTest(){
  clearInterval(timerInt);
  let c=0; for(let i=0;i<DATA.length;i++){if(answers[i]==DATA[i].answer)c++;}
  const pct=Math.round(c/DATA.length*100)||0;
  document.getElementById('qCard').classList.add('hidden');
  document.getElementById('resCard').classList.remove('hidden');
  document.getElementById('score').textContent=pct+'%';
  document.getElementById('detail').innerHTML='<b>'+c+'/'+DATA.length+'</b> correct';
}

function tick(){timerSec--; document.getElementById('timer').textContent=Math.floor(timerSec/60)+':'+String(timerSec%60).padStart(2,'0'); document.getElementById('bar').style.width=(timerSec/3900*100)+'%'; if(timerSec<=0){clearInterval(timerInt); submitTest();}}

render(); timerInt=setInterval(tick,1000);
</script>
</body></html>
