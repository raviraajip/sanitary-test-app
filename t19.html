<!DOCTYPE html>
<html lang="hi">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>ASWMO — T19 Full Test-Tech</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
:root{--bg:#0b0c15;--surface:#12142a;--text:#e4e6f0;--accent:#00e8a0;--gold:#f0c040;--danger:#ff4d6d;--border:rgba(255,255,255,.08);--muted:#8a8fa8;}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:Inter,system-ui,sans-serif;background:radial-gradient(1000px 700px at 20% 0%,#00e8a011,transparent),var(--bg);color:var(--text);min-height:100vh;line-height:1.55;}
.container{max-width:900px;margin:2rem auto;padding:0 1.2rem;}
h1{font-size:1.6rem;font-weight:700;background:linear-gradient(135deg,#fff,var(--accent));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.card{background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:16px;padding:1.5rem;margin-bottom:1rem;}
.question{font-size:1.05rem;font-weight:500;margin-bottom:.8rem;line-height:1.35;}
.options{display:grid;gap:.5rem;}
.option{padding:.7rem 1rem;background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:10px;cursor:pointer;font-size:.92rem;transition:.2s;}
.option:hover,.option.selected{border-color:var(--accent);background:rgba(0,232,160,.12);font-weight:600;}
.timer{font-family:monospace;font-weight:700;font-size:2rem;color:var(--accent);}
button{background:linear-gradient(135deg,var(--accent),#00b87e);color:#0a0c12;border:none;padding:.7rem 1.4rem;border-radius:10px;font-weight:700;cursor:pointer;}
.hidden{display:none!important}</style>
</head>
<body>
<div class="container">
<header><h1 id="ptitle">ASWMO — T19 Full Test-Tech</h1></header>

<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;">
<div><div class="timer" id="timer">65:00</div><div style="font-size:.75rem;color:var(--muted);">Time Remaining</div></div>
<button onclick="submitTest()">Submit Test</button></div>
<div style="height:6px;background:rgba(255,255,255,.1);border-radius:3px;overflow:hidden;margin-top:.5rem;"><div id="bar" style="height:100%;width:100%;background:linear-gradient(90deg,var(--accent),#00b87e);transition:width 1s linear;"></div></div></div>

<div class="card" id="qCard">
<div style="font-size:.8rem;color:var(--muted);margin-bottom:.4rem;">Question <span id="qNum">1</span> / <span id="qTotal">?</span></div>
<div class="question" id="qText">Loading...</div>
<div class="options" id="opts"></div>
<div style="margin-top:1rem;display:flex;gap:.5rem;flex-wrap:wrap;">
<button onclick="prev()">&#8592; Prev</button><button onclick="next()">Next &#8594;</button><button onclick="submitTest()">Submit</button></div>
</div>

<div class="card hidden" id="resCard" style="text-align:center;padding:2rem;">
<h2 style="color:var(--gold);font-size:2rem;">Test Completed!</h2>
<div id="score" style="font-size:3rem;font-weight:800;color:var(--accent);margin:1rem 0;"></div>
<div id="detail" style="color:var(--muted);font-size:.95rem;"></div>
<div style="margin-top:1.5rem;"><a href="index.html" style="color:var(--accent);font-weight:600;">&#8592; Back</a></div>
</div>
</div>

<script>
const DATA=[{"id":"75414","q":"During the EIA process under India's EIA Notification 2006, public consultation is a must for","options":["All 'A' category projects","All 'B1' category projects","All 'A' category projects except for a few exceptional ones","All 'A' and 'B1' category projects except for a few exceptional ones"],"answer":"4"},{"id":"75415","q":"First notification of EIA with EMP in India was initiated on","options":["5 June 20000","1 August 1985","27 January 1994","1 January 1970"],"answer":"3"},{"id":"75416","q":"Noise was recognized specifically as a pollutant under the section","options":["Section 2(b) Air Pollution Act 1987","1981 under section 2(b)","Air Pollution Act 1987","1987 under section 7(c)"],"answer":"3"},{"id":"75417","q":"Which of the following steps is typically performed first in the Environmental Impact Assessment (EIA) process?","options":["Screening","Scoping","Public consultation","Mitigation measures"],"answer":"1"},{"id":"75418","q":"All decisions of the State Level Environment Impact Assessment Authority shall ordinarily be taken","options":["By three-fourths majority","By simple majority","Unanimously","By two thirds majority"],"answer":"3"},{"id":"75419","q":"The Environmental Relief fund was created under","options":["Environmental Protection Act","Forest Conservation Act","Public Liability Insurance Act","Wildlife Protection Act"],"answer":"3"},{"id":"75420","q":"Need of EPA was felt, in India, after","options":["Tsunami in Tamil Nadu","Bhopal Tragedy","Earthquake in Gujarat","Gas leakage in Delhi"],"answer":"2"},{"id":"75421","q":"Which one of the following types of ecology is dealt with autecology?","options":["Community ecology","Peripheral ecology","Ecosystem ecology","Individual species ecology"],"answer":"4"},{"id":"75422","q":"In a batch culture growth pattern of bacteria, the phase which represents the time required for organisms to acclimatize to the new environment is:","options":["Stationary phase","Death phase","Lag phase","Log phase"],"answer":"3"},{"id":"75423","q":"What is MRR technique?","options":["Mark, Release, Recapture","Mark, Rescue, Restore","Mark, Revive, Rescue","Mark, Recapture, Release"],"answer":"1"},{"id":"75424","q":"Which one of the following is the largest ecosystem of the world?","options":["Ocean","Grassland","Forest","Mountains"],"answer":"1"},{"id":"75425","q":"The primary source of energy in Eco-body is-","options":["Energy emitted by fermentation","Preserved vegetable sugar","Solar energy","None of the above"],"answer":"3"},{"id":"75426","q":"Among the Sustainable Development Goals (SDG) which of the goal prescribe Affordable and clear energy.","options":["SDG-7","SDG-8","SDG-9","SDG-10"],"answer":"1"},{"id":"75427","q":"Which of the following is an approach to design for sustainability?","options":["Selection of resources with low environmental impact","Design for safety and reliability","Design for manufacturability","Design for supply chain"],"answer":"1"},{"id":"75428","q":"Which type of economy is best in terms of sustainability","options":["circular","linear","non-linear","All of the above"],"answer":"1"},{"id":"75429","q":"Ozone is formed in the upper atmosphere by a photochemical reaction with","options":["Infra-red radiation","Visible light","Ultra violet solar radiation","All of the above"],"answer":"3"},{"id":"75430","q":"Which of the following statements are correct about Ozone? (i) It is comprising of 3 oxygen atoms. (ii) It is light blue in colour (iii) Its thickness is measured in Rem (iv) It is present in both troposphere and stratosphere Select the correct answer using the codes given below:","options":["(i) and (ii)","(i), (ii) and (iii)","(i), (ii) and (iv)","(i), (ii), (iii) and (iv)"],"answer":"3"},{"id":"75431","q":"The international treaty which aims at reducing global warming is","options":["CITES","Ramsar convention","Kyoto Protocol","Montreal Protocol"],"answer":"3"},{"id":"75432","q":"Abnormal, surface temperature on Venus is explain by","options":["Normal green house effect","Runoff green house effect","Stefan Bolzmann law","Wiens law"],"answer":"2"},{"id":"75433","q":"Which among the following is the world's single largest contributor of greenhouse gases and is one of the most important causes of global warming?","options":["Wood","Oil","Coal","Biogas"],"answer":"3"},{"id":"75434","q":"What was the theme of World Environment Day 2020","options":["Beat Air Pollution","Beat Plastic Pollution","Go Wild for Life","Time for Nature"],"answer":"4"},{"id":"75435","q":"Bacillus is a","options":["Virus","Bacteria","Protozoa","Medicinal drug"],"answer":"2"},{"id":"75436","q":"Who drafts or develops the Red List of Species","options":["Government of India","The United Programme National Environment","The International Union for the Conservation of Nature","Biodiversity"],"answer":"3"},{"id":"75437","q":"Biodiversity act of India was passed by the Parliament in the year?","options":["1999","2000","2014","2002"],"answer":"4"},{"id":"75438","q":"The objectives of the Wild Life Protection, Act 1972 is","options":["To preserve the biodiversity","Protection and conservation of wild life","To maintain essential ecological and life supporting, systems","All the above"],"answer":"4"},{"id":"75439","q":"A partially enclosed coastal body with one or more rivers pouring into it which has a connection with the sea is known as","options":["Estuary","Stream","Bay","Lake"],"answer":"1"},{"id":"75440","q":"Ground water mining in coastal areas can result into:","options":["Increase in the salinity of ground water","Decrease in the toxicity of ground water","Decrease in salinity","Increase in water table"],"answer":"1"},{"id":"75441","q":"Which of the following statement(s) is/are true regarding UN-REDD Programme ? (i) It was launched in 2008 as a collaborative initiative of FAO, UNDP and UNEP. (ii) It covers four regions: Africa, Asia-Pacific, Latin America and Caribbean (iii) It supports stakeholder engagement, including indigenous people and forest-dependent communities. (iv) Its primary focus is to provide financial incentives exclusively for afforestation in developed countries.","options":["(i) and (ii)","(ii) and (iii)","(i), (ii) and (iii)","(i), (ii), (iii) and (iv)"],"answer":"3"},{"id":"75442","q":"Which of the following statement(s) is/are true for In Joint Forest Management (JFM):","options":["Government and communities work together local","NGO and private sector work together","Government and private sector work together","Government and NGO work together"],"answer":"1"},{"id":"75443","q":"Which one of the following is not a fossil fuel ?","options":["Natural gas","Petrol","Coal","Uranium"],"answer":"4"},{"id":"75444","q":"Derived from a wide variety of material of plant or animal origin is called","options":["passive energy","active energy","bioenergy","living energy"],"answer":"3"},{"id":"75445","q":"Which alternative fuel can be produced through the process of electrolysis using renewable energy sources","options":["Biodiesel","Compressed natural gas","Ethanol","Hydrogen"],"answer":"4"},{"id":"75446","q":"Which of following is known as Fenton's reagent","options":["Hydrogen peroxide with an iron catalyst","Sodium Hypochlorite","Calcium Hypochlorite","UV with ozone"],"answer":"1"},{"id":"75447","q":"Which among the following is the green solvent?","options":["Ether","Acetone","Benzene","N-Alkylpyridinium salt"],"answer":"4"},{"id":"75448","q":"Fick's law is related to:","options":["Mass transfer","Energy conservation","Heat transfer","Momentum"],"answer":"1"},{"id":"75449","q":"Which of the following scattering phenomena is responsible for the blue colour of the sky?","options":["Non-selective scattering","Mie scattering","Diffraction","Rayleigh scattering"],"answer":"4"},{"id":"75450","q":"Which of the following methods is generally NOT adopted for safe disposal of biomedical wastes?","options":["Incineration","Microwaving","Shredding after disinfection","Landfilling"],"answer":"4"},{"id":"75451","q":"High calorific value of solid waste is needed for:","options":["Composting","Anaerobic digestion","Landfilling","Incineration"],"answer":"4"},{"id":"75452","q":"Which of the following wastes does not fall in Hazardous waste category","options":["Waste from Hospitals","Municipal solid waste","Sludge from industrial","Discarded computers and electronic"],"answer":"2"},{"id":"75453","q":"Household wastes are governed by","options":["Hazardous Waste Rules, 1989","Municipal Solid Waste Rules, 2000","Biomedical Waste Rules, 1998","Water (P & C) Act, 1974"],"answer":"2"},{"id":"75454","q":"As per CPHEEO-2016, the minimum siting distance of land for sanitary landfill sites shall be ______ away from the centre line of a highway or railway line and water supply wells.","options":["100 m","500 m","1000 m","1500 m"],"answer":"2"},{"id":"75455","q":"The size dependent collection efficiency of particles is the following","options":["Grade efficiency","Overall collection efficiency","Murphree efficiency","Structure efficiency"],"answer":"1"},{"id":"75456","q":"Which of the following can be the most beneficial method of solid waste disposal?","options":["Landfilling","Disposing directly into rivers","Composting","Burning"],"answer":"3"},{"id":"75457","q":"A collection system in which people dump their household waste in the bins present on road sides is called:","options":["door to door collection system","open dump system","kerbside collection system","drop-off system"],"answer":"3"},{"id":"75458","q":"The liquid from a landfill containing contaminants which ultimately pollute ground water is called:","options":["filtrate","percolate","leachate","run off"],"answer":"3"},{"id":"75459","q":"According to the Biomedical Waste Management (BMWM) Rules 2016, within how much time the anatomical waste, soiled waste and biotechnology waste if generated should be treated and disposed?","options":["36 hours","24 hours","72 hours","48 hours"],"answer":"4"},{"id":"75460","q":"What is the minimum distance that is kept from a river for the construction of a hazardous waste landfill?","options":["100 m","300 m","200 m","400 m"],"answer":"1"},{"id":"75461","q":"As per the biomedical waste (Management and Handling Rules, 2016), the human and animal anatomical waste should be treated and disposed using which method?","options":["Autoclaving","Microwaving","Incineration/deep burial","Chemical treatment"],"answer":"3"},{"id":"75462","q":"The most serious environmental effect posed by hazardous waste is","options":["Air pollution","Contamination of ground water","Destruction of habitats","Increased use of land for land fills"],"answer":"2"},{"id":"75463","q":"Autoclaving is used for","options":["Municipal waste","Industrial Waste","Biomedical waste","Agriculture waste"],"answer":"3"},{"id":"75464","q":"For the application of recycled plastics in fence post, park benches, docks, etc. ________ is used.","options":["PE","Plastic lumber","PP","PS"],"answer":"2"},{"id":"75465","q":"The commonly used unit of absorbed radiation is defined as that dose of ionizing radiation that imparts 1 Joule of energy to 1 kg of absorbing material. This unit is known as","options":["Rem","Sievert","Rad","Gray (Gr)"],"answer":"3"},{"id":"75466","q":"Peritoneal Mesothelioma is a rare form of cancer and is associated with:","options":["Asbestos","Randon gas","Pesticides","Lead"],"answer":"1"},{"id":"75467","q":"Which metal couple, poisons the water:","options":["Silver - Gold","Brass - Nickel","Mercury - Lead","Copper - Tin"],"answer":"3"},{"id":"75468","q":"Which of the following can be considered as an \"End of Pipeline\" treatment process?","options":["Green Chemistry approach to reduce pollution","Catalytic converters in automobiles to reduce emissions","Soil excavation to remove historical contamination","Usage of personal respiratory protection masks"],"answer":"2"},{"id":"75469","q":"Process by which mined land is returned to its original state or better is known as","options":["Refurbishing","Regeneration","Revolution","Reclamation"],"answer":"4"},{"id":"75470","q":"The process of land degradation in arid, semi-arid and sub-humid areas due to various factor including climatic variations and human activities is called as","options":["Land degradation","Soil erosion","Desertification","Landslide"],"answer":"3"},{"id":"75471","q":"Thermal stratification leads to:","options":["Algal bloom","Layered temperature zones","Increased turbidity","High DO"],"answer":"2"},{"id":"75472","q":"Which human activity is a major contributor to deforestation?","options":["Fishing","Urbanization","Wind farming","Solar panel installation"],"answer":"2"},{"id":"75473","q":"How the water-flow rate is useful in conventional models?","options":["For predicting velocity","To estimate the amount of contaminant that will be transported along with solids","To estimate the amount of pollutant which was carried along with the water","To find Reynolds number"],"answer":"3"},{"id":"75474","q":"Two primary air pollutants are","options":["Ozone and Peroxyacetyl nitrate","Sulphur dioxide and hydrocarbon","Nitrogen oxide and Peroxyacetyl nitrate","Ozone and Oxides of Oxygen"],"answer":"2"},{"id":"75475","q":"Green muffler is related to pollution of __________","options":["Soil","Noise","Water","Air"],"answer":"2"},{"id":"75476","q":"Which of the following units is used to measure noise pollution ?","options":["Candela","Kelvin","Decibel","Ampere"],"answer":"3"},{"id":"75477","q":"The primary air pollutant which is formed due to incomplete combustion of organic matter is ____","options":["Methane","Carbon monoxide","Ozone","Sulphur dioxide"],"answer":"2"},{"id":"75478","q":"The composition of biogas is an follows","options":["Methane, Carbon dioxide, H 2 S, and N 2","Methane, Carbon dioxide, H 2 O, and SO 2","Methane, Carbon monoxide, and SO 2","Methane, Carbon monoxide, SO 2 and hydrocarbons"],"answer":"1"}];
let idx=0, answers={}, timerSec=3900, timerInt=null;

function render(){
  const q=DATA[idx];
  if(!q){document.getElementById('qText').textContent='No data.';return;}
  document.getElementById('qNum').textContent=idx+1;
  document.getElementById('qTotal').textContent=DATA.length;
  document.getElementById('qText').textContent=q.q;
  document.getElementById('opts').innerHTML=q.options.map((o,i)=>
    `<div class="option ${answers[idx]==(i+1)?'selected':''}" onclick="select(${i+1})">${String.fromCharCode(65+i)}. ${o}</div>`
  ).join('');
}
window.select=o=>{answers[idx]=o; render();};
window.prev=()=>{if(idx>0){idx--; render();}};
window.next=()=>{if(idx<DATA.length-1){idx++; render();}};

function submitTest(){
  clearInterval(timerInt);
  let c=0; for(let i=0;i<DATA.length;i++){if(answers[i]==DATA[i].answer)c++;}
  const pct=Math.round(c/DATA.length*100)||0;
  document.getElementById('qCard').classList.add('hidden');
  document.getElementById('resCard').classList.remove('hidden');
  document.getElementById('score').textContent=pct+'%';
  document.getElementById('detail').innerHTML='<b>'+c+'/'+DATA.length+'</b> correct';
}

function tick(){timerSec--; document.getElementById('timer').textContent=Math.floor(timerSec/60)+':'+String(timerSec%60).padStart(2,'0'); document.getElementById('bar').style.width=(timerSec/3900*100)+'%'; if(timerSec<=0){clearInterval(timerInt); submitTest();}}

render(); timerInt=setInterval(tick,1000);
</script>
</body></html>
