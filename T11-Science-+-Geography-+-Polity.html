const DATA=[{"id":"72214","q":"The power of the Supreme Court of India to decide disputes between the Centre and the States falls under its:","options":["Advisory Jurisdiction","Appellate Jurisdiction","Original Jurisdiction","Writ Jurisdiction"],"answer":"3","solution":"The Supreme Court's Original Jurisdiction (under Article 131 of the Constitution) covers disputes between the Government of India and one or more States, or between two or more States. This means the Supreme Court is the first and only court to hear such cases. Advisory jurisdiction involves the President seeking the court's opinion, while appellate jurisdiction involves hearing appeals from lower courts."},{"id":"72215","q":"What is the primary reason for the formation of the 'ozone hole' over Antarctica?","options":["The trapping of pollutants by the strong polar vortex and the presence of polar stratospheric clouds.","High concentration of industrial pollutants directly emitted over Antarctica.","The natural thinning of the ozone layer during the polar summer.","Methane emissions from the melting permafrost."],"answer":"1","solution":"The ozone hole over Antarctica is primarily caused by a combination of factors unique to the polar region. During the winter, a strong polar vortex isolates the air, allowing temperatures to drop significantly. This leads to the formation of polar stratospheric clouds (PSCs). Chemical reactions on the surface of these clouds convert chlorine and bromine compounds (from CFCs) into highly reactive forms. When sunlight returns in the spring, it triggers these reactive chemicals to catalytically destroy ozone molecules at a rapid rate."},{"id":"72216","q":"A wire with electrical resistance 'R' is stretched to three times its original length. Assuming the volume and resistivity of the material remain constant, what will be its new resistance?","options":["R/3","3R","R/9","9R"],"answer":"4","solution":"The resistance of a wire is given by the formula \u200b, where \u03c1 is resistivity, L is length, and A is the cross-sectional area. The volume of the wire, V=L\u00d7A, remains constant. When the wire is stretched to three times its length (L\u2032=3L), its area must decrease to one-third to keep the volume constant (A\u2032=A/3). The new resistance R\u2032 will be: Therefore, the new resistance is 9 times the original resistance."},{"id":"72217","q":"The 73 rd Constitutional Amendment Act, 1992, which added Part IX to the Constitution, deals with:","options":["The administration of Union Territories.","The provisions related to Panchayati Raj Institutions.","The establishment of Administrative Tribunals.","The functions of Urban Local Bodies or Municipalities."],"answer":"2","solution":"The 73rd Constitutional Amendment Act of 1992 granted constitutional status and protection to the Panchayati Raj Institutions (PRIs). It added a new Part IX to the Constitution titled \"The Panchayats\" and a new Eleventh Schedule containing 29 functional items of the panchayats. Urban Local Bodies (Municipalities) are dealt with by the 74th Amendment Act."},{"id":"72218","q":"Why does a diamond sparkle more than a piece of glass of the same shape?","options":["Diamond has a higher refractive index and a lower critical angle, leading to more total internal reflection.","Diamond is harder than glass, which allows it to be cut more precisely.","Diamond absorbs all colors except one, while glass transmits all colors.","Diamond has a crystalline lattice structure, whereas glass is amorphous."],"answer":"1","solution":"A diamond's sparkle is due to total internal reflection (TIR). Diamond has a very high refractive index (about 2.42) compared to glass (about 1.5). This high refractive index results in a very low critical angle. When light enters a properly cut diamond, it strikes the internal facets at an angle greater than the critical angle, causing it to be totally reflected internally multiple times before exiting through the top, creating the characteristic sparkle."},{"id":"72219","q":"The 'Doctrine of Basic Structure' of the Constitution was propounded by the Supreme Court in which landmark case?","options":["Golaknath v. State of Punjab","Kesavananda Bharati v. State of Kerala","Maneka Gandhi v. Union of India","A.K. Gopalan v. State of Madras"],"answer":"2","solution":"The 'Doctrine of Basic Structure' was laid down by the Supreme Court in the landmark Kesavananda Bharati v. State of Kerala case in 1973. The court held that while the Parliament has the power to amend any part of the Constitution, it cannot alter the \"basic structure\" or fundamental features of the Constitution."},{"id":"72220","q":"The climatic phenomenon known as 'El Ni\u00f1o' is characterized by:","options":["The unusual cooling of surface waters in the eastern tropical Pacific Ocean.","An intensification of the normal Walker Circulation over the Pacific.","The unusual warming of surface waters in the eastern tropical Pacific Ocean, affecting global weather patterns.","A seasonal reversal of winds in the Indian Ocean, causing heavy rainfall."],"answer":"3","solution":"El Ni\u00f1o is a climatic pattern characterized by the unusual warming of surface waters in the eastern tropical Pacific Ocean. This warming disrupts the normal atmospheric circulation (Walker Circulation), leading to significant changes in weather patterns across the globe, such as droughts in some regions and heavy rainfall in others. Its opposite phase, characterized by cooling, is called La Ni\u00f1a."},{"id":"72221","q":"In the context of fluid dynamics, why does a spinning cricket ball curve in the air (the Magnus effect)?","options":["Due to a pressure difference created on opposite sides of the ball, as per Bernoulli's principle.","Due to the conservation of angular momentum.","Due to the gravitational pull being altered by the spin.","Due to the increased friction with air molecules caused by the spinning surface."],"answer":"1","solution":"The curving of a spinning cricket ball is explained by the Magnus effect, which is an application of Bernoulli's principle. As the ball spins, it drags a layer of air with it. On one side of the ball, this dragged air moves in the same direction as the airflow, increasing its velocity. On the opposite side, it moves against the airflow, decreasing its velocity. According to Bernoulli's principle, higher velocity corresponds to lower pressure. This pressure difference creates a net force that pushes the ball sideways, causing it to curve."},{"id":"72222","q":"Arrange the following tributaries of the Indus River system from north to south: Chenab 2. Jhelum 3. Ravi 4. Satluj","options":["2, 1, 3, 4","1, 2, 4, 3","4, 3, 1, 2","3, 4, 2, 1"],"answer":"1","solution":"The correct geographical arrangement of the major tributaries of the Indus River from north to south is: Jhelum, Chenab, Ravi, Beas, and Satluj. Based on the options provided, the sequence is: Jhelum Chenab Ravi Satluj Therefore, the correct order is 2, 1, 3, 4."},{"id":"72223","q":"Which of the following is NOT a fundamental duty of a citizen of India under Article 51A of the Constitution?","options":["To safeguard public property and to abjure violence.","To develop the scientific temper, humanism, and the spirit of inquiry and reform.","To pay taxes regularly and punctually.","To protect and improve the natural environment including forests, lakes, rivers, and wild life."],"answer":"3","solution":"While paying taxes is a legal duty for every citizen, it is not listed as a Fundamental Duty under Article 51A of the Constitution. The other options\u2014safeguarding public property , developing scientific temper , and protecting the natural environment \u2014are all explicitly mentioned as Fundamental Duties."},{"id":"72224","q":"In human genetics, what is the key difference between mitosis and meiosis?","options":["Mitosis produces two diploid cells, while meiosis produces four haploid cells.","Mitosis occurs in reproductive cells, while meiosis occurs in somatic (body) cells.","DNA replication does not occur before meiosis.","Mitosis involves two rounds of cell division, while meiosis involves only one."],"answer":"1","solution":"Mitosis and meiosis are two types of cell division. Mitosis results in two daughter cells, each having the same number and kind of chromosomes as the parent nucleus (two diploid cells), typical of ordinary tissue growth. Meiosis is a process where a single cell divides twice to produce four cells containing half the original amount of genetic information (four haploid cells). These cells are the sex cells \u2013 sperm and eggs."},{"id":"72225","q":"In the context of Indian polity, the 'Prorogation' of a House of Parliament means:","options":["The termination of a sitting of the House for an indefinite period.","The end of a session of the House by an order of the President.","The dissolution of the Lok Sabha.","A temporary suspension of the proceedings of the House by the presiding officer."],"answer":"2","solution":"Prorogation refers to the termination of a session of a House of Parliament by an order made by the President. This is different from adjournment, which is a temporary suspension of proceedings done by the presiding officer , and dissolution, which ends the very life of the Lok Sabha."},{"id":"72226","q":"Consider the following statements regarding the Indian monsoon: The withdrawal of the monsoon is a more gradual process than its onset. The 'Burst of Monsoon' over the Kerala coast is associated with violent thunderstorms. The Tamil Nadu coast remains dry during the southwest monsoon season because it lies in a rain shadow area. Which of the statements given above are correct?","options":["1 and 2 only","2 and 3 only","1 and 3 only","1, 2, and 3"],"answer":"4","solution":"All three statements regarding the Indian monsoon are correct. The withdrawal of the monsoon is a gradual process that takes about three months. The onset is a sudden event known as the 'Burst of Monsoon', often associated with thunderstorms. The Tamil Nadu coast receives little rain from the southwest monsoon as it lies in the rain shadow of the Western Ghats for the Arabian Sea branch and is parallel to the Bay of Bengal branch."},{"id":"72227","q":"The process of reverse osmosis, used in water purification, involves:","options":["Movement of water from a region of lower solute concentration to higher solute concentration without external pressure.","Movement of solute particles across a semi-permeable membrane.","Applying external pressure to move water from a region of higher solute concentration to lower solute concentration.","Boiling the water to separate it from dissolved salts."],"answer":"3","solution":"Reverse osmosis works by applying external pressure to a solution with a high concentration of solutes (like salty water). This pressure forces the solvent (water) to move through a semi-permeable membrane to a region of lower solute concentration (pure water), leaving the dissolved salts and other impurities behind. This is the reverse of the natural osmotic process."},{"id":"72228","q":"Which Constitutional Amendment Act is known as the 'Anti-Defection Law'?","options":["42 nd Amendment Act","44 th Amendment Act","52 nd Amendment Act","61 st Amendment Act"],"answer":"3","solution":"The 52nd Constitutional Amendment Act of 1985 is known as the 'Anti-Defection Law'. It was enacted to curb political defections by legislators. It added the Tenth Schedule to the Constitution, laying down the provisions for the disqualification of members of Parliament and State Legislatures on grounds of defection."},{"id":"72229","q":"The 'Strait of Hormuz', a strategically important waterway, connects which two bodies of water?","options":["The Red Sea and the Gulf of Aden.","The Persian Gulf and the Gulf of Oman.","The Mediterranean Sea and the Atlantic Ocean.","The Black Sea and the Sea of Marmara."],"answer":"2","solution":"The Strait of Hormuz is a strategically vital chokepoint that connects the Persian Gulf with the Gulf of Oman and the open Arabian Sea. A significant portion of the world's oil supply passes through this waterway."},{"id":"72230","q":"Which law of thermodynamics explains that it is impossible to reach a state of absolute zero temperature?","options":["The Zeroth Law of Thermodynamics.","The First Law of Thermodynamics.","The Second Law of Thermodynamics.","The Third Law of Thermodynamics."],"answer":"4","solution":"The Third Law of Thermodynamics states that the entropy of a perfect crystal at absolute zero (0 Kelvin) is zero. A consequence of this law is the principle of the unattainability of absolute zero, which implies that it is impossible to cool a system to absolute zero temperature in a finite number of steps."},{"id":"72231","q":"What is the implication if a 'No-Confidence Motion' is passed against the Council of Ministers in the Lok Sabha?","options":["The Prime Minister alone has to resign.","The entire Council of Ministers has to resign.","The Lok Sabha is immediately dissolved by the President.","The motion is sent to the Rajya Sabha for approval."],"answer":"2","solution":"The Council of Ministers is collectively responsible to the Lok Sabha (Article 75(3)). A 'No-Confidence Motion' is the ultimate test of this responsibility. If the motion is passed, it signifies that the government has lost its majority support. Consequently, the entire Council of Ministers, including the Prime Minister, must resign."},{"id":"72232","q":"Which of the following National Parks is unique for being a 'floating' national park?","options":["Keoladeo National Park, Rajasthan","Namdapha National Park, Arunachal Pradesh","Keibul Lamjao National Park, Manipur","Balphakram National Park, Meghalaya"],"answer":"3","solution":"The Keibul Lamjao National Park in Manipur is the only floating national park in the world. It is an integral part of Loktak Lake and is characterized by its large, floating masses of vegetation, soil, and organic matter called 'phumdis'. It is the last natural habitat of the endangered Sangai deer."},{"id":"72233","q":"What is the scientific principle behind the functioning of a vaccine?","options":["It introduces potent antibiotics into the bloodstream to kill pathogens.","It stimulates the adaptive immune system to produce memory cells against a specific pathogen without causing the disease.","It provides passive immunity by injecting pre-made antibodies from another source.","It uses antiviral drugs to directly destroy the genetic material of viruses."],"answer":"2","solution":"A vaccine works by introducing a harmless version or a component of a pathogen (like a weakened virus or a protein from its surface) into the body. This stimulates the adaptive immune system to produce a primary immune response and create memory cells. If the body is later exposed to the actual pathogen, these memory cells facilitate a rapid and strong secondary immune response, preventing the disease from developing."},{"id":"72234","q":"Which of the following subjects is included in the 'Concurrent List' of the Seventh Schedule of the Indian Constitution?","options":["Public health and sanitation","Police and public order","Forests and protection of wild animals and birds","Banking and insurance"],"answer":"3","solution":"The Seventh Schedule of the Constitution divides subjects for legislation between the Union and the States into three lists. 'Forests' and 'Protection of wild animals and birds' are on the Concurrent List, meaning both the Union and State governments can make laws on them. 'Public health' and 'Police' are on the State List, while 'Banking' is on the Union List."},{"id":"72235","q":"What type of climate, characterized by dry summers and mild, wet winters, is ideal for the cultivation of citrus fruits like oranges and grapes?","options":["Equatorial Climate","Monsoon Climate","Mediterranean Climate","Tundra Climate"],"answer":"3","solution":"The Mediterranean Climate is characterized by warm to hot, dry summers and mild, wet winters. This specific climatic pattern is exceptionally well-suited for the cultivation of citrus fruits (like oranges and lemons), olives, and grapes (for wine)."},{"id":"72236","q":"In chemistry, \"buffer solutions\" are critical for maintaining stable conditions. What is their primary function?","options":["To neutralize a solution completely, bringing its pH to exactly 7.","To resist changes in pH upon the addition of a small amount of acid or base.","To act as a strong oxidizing agent in redox reactions.","To increase the solubility of non-polar substances in water."],"answer":"2","solution":"A buffer solution is an aqueous solution consisting of a mixture of a weak acid and its conjugate base, or a weak base and its conjugate acid. Its primary function is to resist a change in pH when a small amount of a strong acid or strong base is added to it. This is crucial for many chemical and biological processes that require a stable pH environment."},{"id":"72237","q":"What does the 'Writ of Mandamus' literally mean?","options":["\"To have the body of\"","\"We command\"","\"By what authority or warrant\"","\"To be certified\""],"answer":"2","solution":"'Mandamus' is a Latin term that literally translates to \"We command\". It is a writ issued by a higher court to a lower court, government official, or public authority to compel them to perform a public or statutory duty that they have refused to perform. \"To have the body of\" is Habeas Corpus . \"By what authority or warrant\" is Quo Warranto . \"To be certified\" is Certiorari ."},{"id":"72238","q":"According to Einstein's theory of special relativity, which of the following is a consequence for an object as its speed approaches the speed of light?","options":["Its mass decreases, and time passes faster for it.","Its mass remains constant, but its length contracts.","Its mass increases, its length contracts in the direction of motion, and time slows down for it.","Its energy becomes zero."],"answer":"3","solution":"According to Einstein's theory of special relativity, as an object's speed approaches the speed of light (c), several relativistic effects become significant: Mass increase (relativistic mass): Its mass increases towards infinity. Length contraction: Its length in the direction of motion contracts towards zero. Time dilation: Time slows down for the moving object relative to a stationary observer. Option (c) correctly summarizes these consequences."},{"id":"72239","q":"The 'Roaring Forties', 'Furious Fifties', and 'Shrieking Sixties' are terms used to describe:","options":["Strong westerly winds found in the Southern Hemisphere.","Ocean currents in the North Atlantic.","Latitudinal belts of high atmospheric pressure.","Zones of frequent volcanic activity in the Pacific."],"answer":"1","solution":"The 'Roaring Forties', 'Furious Fifties', and 'Shrieking Sixties' are sailors' terms for the strong, persistent westerly winds found in the Southern Hemisphere at latitudes between 40\u00b0S and 70\u00b0S. The absence of large landmasses to slow them down makes these winds particularly powerful."},{"id":"72240","q":"Which of the following cellular processes would be most immediately disrupted if the inner mitochondrial membrane, which is normally impermeable to protons (H+ ions), suddenly became permeable?","options":["Glycolysis in the cytoplasm.","The synthesis of ATP via chemiosmosis.","The Krebs cycle in the mitochondrial matrix.","The transport of pyruvate into the mitochondria."],"answer":"2","solution":"The synthesis of ATP in mitochondria occurs through chemiosmosis, which relies on a proton (H+ ion) gradient across the inner mitochondrial membrane. The electron transport chain pumps protons out, and they flow back in through ATP synthase to produce ATP. If the inner membrane became permeable to protons, this gradient would dissipate, immediately halting ATP synthesis via chemiosmosis."},{"id":"72241","q":"What is the key geographical feature that distinguishes a 'delta' from an 'estuary'?","options":["A delta is a depositional landform at the river mouth, while an estuary is a drowned river valley where fresh water meets sea water.","Deltas form only in tropical regions, while estuaries are common in temperate regions.","Estuaries are characterized by high sediment load, while deltas have clear water.","A delta is formed by glacial action, whereas an estuary is formed by wind action."],"answer":"1","solution":"The key distinction is based on their formation and interaction with the sea. A delta is a landform created by the deposition of sediment at the mouth of a river where it enters a body of water like an ocean or lake. An estuary is a partially enclosed coastal body of brackish water where freshwater from rivers mixes with saltwater from the sea, often formed by the drowning of a river valley due to rising sea levels."},{"id":"72242","q":"Consider the following statements regarding the powers of the Rajya Sabha: It can authorize the Parliament to make a law on a subject enumerated in the State List. It participates in the election and impeachment of the President. A Money Bill can be introduced only in the Rajya Sabha. Which of the statements given above is/are correct?","options":["1 only","1 and 2 only","2 and 3 only","1, 2, and 3"],"answer":"2","solution":"Analyzing the statements: Correct: Under Article 249, the Rajya Sabha can authorize Parliament to legislate on a State List subject in the national interest. Correct: Members of the Rajya Sabha participate in the election (elected members only) and impeachment (all members) of the President. Incorrect: A Money Bill can be introduced only in the Lok Sabha, not the Rajya Sabha. Thus, only statements 1 and 2 are correct."},{"id":"72243","q":"If a person moves from the equator to the poles, how will the value of 'g' (acceleration due to gravity) be affected?","options":["It will decrease because the polar radius is greater than the equatorial radius.","It will remain exactly the same.","It will increase due to the flattening of the Earth at the poles and reduced centrifugal force.","It will fluctuate unpredictably."],"answer":"3","solution":"The value of acceleration due to gravity ('g') increases as one moves from the equator to the poles. This is due to two main reasons: Earth's Shape: The Earth is flattened at the poles, so the polar radius is less than the equatorial radius. Being closer to the Earth's center at the poles results in a stronger gravitational pull. Centrifugal Force: The Earth's rotation creates an outward centrifugal force which is maximum at the equator and zero at the poles. This force counteracts gravity, making the effective 'g' lower at the equator."},{"id":"72244","q":"A mirage is an optical phenomenon caused by:","options":["The reflection of light from a water surface on a hot day.","The dispersion of light through atmospheric dust particles.","The refraction and total internal reflection of light rays through layers of air at different temperatures.","The scattering of light by air molecules, similar to why the sky is blue."],"answer":"3","solution":"A mirage is an optical illusion caused by the bending of light rays. On a hot day, the air near the ground is hotter and less dense than the air above it. Light rays from a distant object traveling towards the ground are bent (refracted) upwards as they enter the less dense air. At a certain point, the light undergoes total internal reflection, appearing to the observer as if it's coming from a reflection on a water surface."},{"id":"72245","q":"The Finance Commission in India is constituted by the President under which Article of the Constitution to recommend the distribution of revenues between the Union and the States?","options":["Article 280","Article 324","Article 148","Article 315"],"answer":"1","solution":"Article 280 of the Indian Constitution mandates the President to constitute a Finance Commission every five years, or earlier if necessary. The primary role of the commission is to make recommendations regarding the distribution of net tax proceeds between the Union and the States and the principles that should govern the grants-in-aid to the States."},{"id":"72246","q":"Jet streams are high-altitude, fast-flowing air currents that have a significant influence on weather patterns. In which layer of the atmosphere are they typically found?","options":["The Mesosphere","The upper levels of the Troposphere","The Thermosphere","The lower levels of the Stratosphere"],"answer":"2","solution":"Jet streams are narrow bands of strong, predominantly westerly air currents that flow several kilometers above the Earth. They are typically found at the boundary between the troposphere and the stratosphere, an area known as the tropopause. Therefore, they exist in the upper levels of the Troposphere."},{"id":"72247","q":"The 'Karewas' of the Kashmir valley are known for the cultivation of which specific crop?","options":["Saffron (Kesar)","Apples","Basmati Rice","Tea"],"answer":"1","solution":"'Karewas' are thick deposits of glacial clay and other materials found in the Kashmir valley. These lacustrine deposits are renowned for the cultivation of Saffron (known locally as Kesar or Zaffran). They are also used for cultivating almonds, walnuts, and apples."},{"id":"72248","q":"Why does a pressure cooker cook food faster than an open pot?","options":["It reduces the specific heat capacity of water.","The increased pressure inside the cooker raises the boiling point of water, allowing for cooking at a higher temperature.","The metal of the pressure cooker has a higher thermal conductivity.","It prevents heat loss to the surroundings through radiation."],"answer":"2","solution":"A pressure cooker cooks food faster by increasing the pressure inside the sealed pot. According to the pressure-temperature relationship, as the pressure increases, the boiling point of the liquid inside (water) also increases. Cooking food at a temperature higher than the normal boiling point of 100\u00b0C significantly accelerates the chemical reactions of cooking."},{"id":"72249","q":"A Joint Sitting of the two Houses of Parliament is presided over by:","options":["The President of India","The Chairman of the Rajya Sabha","The Speaker of the Lok Sabha","The Prime Minister of India"],"answer":"3","solution":"A joint sitting of the two Houses of Parliament is called by the President to resolve a deadlock over a bill. According to Article 118 of the Constitution, this joint sitting is presided over by the Speaker of the Lok Sabha. In the Speaker's absence, the Deputy Speaker of the Lok Sabha presides, and if both are absent, the Deputy Chairman of the Rajya Sabha presides."},{"id":"72250","q":"The concept of a 'Public Interest Litigation' (PIL) originated and was developed as a judicial innovation in India to:","options":["Allow any public-spirited citizen or social organization to seek judicial remedy for a public wrong.","Settle property disputes between two private parties.","Provide a faster trial for criminal cases.","Enable the government to seek the Supreme Court's opinion on legal matters."],"answer":"1","solution":"Public Interest Litigation (PIL) is a significant judicial innovation in India. It relaxed the traditional rule of locus standi (the right to bring a case to court). PIL allows any public-spirited citizen or social organization to file a petition in court on behalf of victims or the public at large to seek a judicial remedy for a public wrong or injury."},{"id":"72251","q":"Which of the following is the key distinction between a prokaryotic cell (like bacteria) and a eukaryotic cell (like an animal or plant cell)?","options":["Eukaryotic cells have a cell wall, while prokaryotic cells do not.","Prokaryotic cells lack a true, membrane-bound nucleus and other membrane-bound organelles.","Prokaryotic cells are always larger than eukaryotic cells.","Eukaryotic cells use DNA as their genetic material, while prokaryotic cells use RNA."],"answer":"2","solution":"The most fundamental difference between prokaryotic and eukaryotic cells is their internal organization. Prokaryotic cells (like bacteria) lack a true, membrane-bound nucleus; their genetic material is located in a region called the nucleoid. They also lack other membrane-bound organelles such as mitochondria, endoplasmic reticulum, and Golgi apparatus, which are characteristic features of eukaryotic cells."},{"id":"72252","q":"The term 'regur soil' is widely used in India to refer to:","options":["Alluvial soils found in the Gangetic plain.","Laterite soils found in areas with high temperature and rainfall.","Arid desert soils of Rajasthan.","Black cotton soils, known for their high moisture-retention capacity."],"answer":"4","solution":"'Regur soil' is the local name for black soils, which are also known as black cotton soils because they are ideally suited for growing cotton. These soils are rich in clay, have high moisture-retention capacity, and are characteristically found in the Deccan Trap region of India."},{"id":"72253","q":"What fundamental force is responsible for holding the protons and neutrons together in an atomic nucleus?","options":["The Gravitational Force","The Electromagnetic Force","The Strong Nuclear Force","The Weak Nuclear Force"],"answer":"3","solution":"The Strong Nuclear Force is the fundamental force that binds protons and neutrons (collectively known as nucleons) together within the atomic nucleus. It is the strongest of the four fundamental forces but acts only over extremely short distances, effectively overcoming the powerful electromagnetic repulsion between the positively charged protons."},{"id":"72254","q":"Which of the following fundamental rights is available only to the citizens of India and not to foreigners?","options":["Equality before law (Article 14).","Protection of life and personal liberty (Article 21).","Right to freedom of speech and expression (Article 19).","Right to freedom of religion (Article 25)."],"answer":"3","solution":"Certain fundamental rights are available only to citizens of India. These include rights under Articles 15, 16, 19, 29, and 30. The Right to freedom of speech and expression, guaranteed under Article 19, is one such right. Rights such as equality before law (Article 14) , protection of life and personal liberty (Article 21) , and freedom of religion (Article 25) are available to all persons on Indian territory, including foreigners."},{"id":"72255","q":"What is the correct sequence of the layers of the Earth's atmosphere from the surface upwards?","options":["Troposphere, Mesosphere, Stratosphere, Thermosphere","Troposphere, Stratosphere, Mesosphere, Thermosphere","Stratosphere, Troposphere, Mesosphere, Thermosphere","Mesosphere, Troposphere, Stratosphere, Thermosphere"],"answer":"2","solution":"The correct sequence of the Earth's atmospheric layers from the ground level upwards is: Troposphere (where weather occurs) Stratosphere (contains the ozone layer) Mesosphere (where meteors burn up) Thermosphere (where auroras occur) Exosphere (the outermost layer) The correct sequence among the given options is Troposphere, Stratosphere, Mesosphere, Thermosphere."},{"id":"72256","q":"In modern physics, what does wave-particle duality refer to?","options":["The concept that waves can only be produced by particles.","The idea that all waves and particles are fundamentally the same thing.","The principle that quantum entities like electrons and photons exhibit both wave-like and particle-like properties.","The theory that particles can travel in wave-like patterns through a medium called ether."],"answer":"3","solution":"Wave-particle duality is a fundamental concept in quantum mechanics. It states that quantum-scale objects like photons and electrons exhibit properties of both particles and waves. For example, an electron can be diffracted like a wave but can also be detected at a single point like a particle. Which property is observed depends on the nature of the experiment being conducted."},{"id":"72257","q":"The power of 'Judicial Review' allows the judiciary to:","options":["Re-examine its own judgments.","Advise the President on matters of law.","Supervise the functioning of lower courts.","Examine the constitutionality of legislative enactments and executive orders."],"answer":"4","solution":"Judicial Review is the power of the judiciary (the Supreme Court and High Courts) to assess the validity of laws and executive actions. It allows the courts to examine the constitutionality of legislative enactments and executive orders of both the Central and State governments. If a law or action is found to be in violation of the Constitution, it can be declared null and void."},{"id":"72258","q":"The half-life of a radioactive isotope is the time it takes for:","options":["The isotope to become completely non-radioactive.","Half of the radioactive atoms in a sample to undergo decay.","The radioactivity of a sample to double.","The isotope to lose half of its mass."],"answer":"2","solution":"The half-life of a radioactive substance is a measure of its decay rate. It is defined as the time required for half of the radioactive (unstable) atoms in a given sample to undergo radioactive decay. It is a constant value for each specific isotope."},{"id":"72259","q":"Which mountain pass connects Srinagar with Leh?","options":["Nathu La","Shipki La","Zoji La","Bom Di La"],"answer":"3","solution":"Zoji La is a high mountain pass in the Himalayas of Ladakh that provides a vital link between the Kashmir Valley to its west and the Dras and Suru valleys to its northeast. It effectively connects Srinagar with Leh. Nathu La connects Sikkim and Tibet. Shipki La connects Himachal Pradesh and Tibet. Bom Di La is in Arunachal Pradesh."},{"id":"72260","q":"The right to move the Supreme Court for the enforcement of Fundamental Rights is itself a Fundamental Right under:","options":["Article 14","Article 19","Article 21","Article 32"],"answer":"4","solution":"Article 32 of the Constitution contains the 'Right to Constitutional Remedies'. It guarantees the right for citizens to move the Supreme Court for the enforcement of their Fundamental Rights. Dr. B.R. Ambedkar described this article as the \"heart and soul\" of the Constitution because it makes the other fundamental rights effective and enforceable."},{"id":"72261","q":"When a beam of white light passes through a prism, it splits into its constituent colors. This phenomenon is called dispersion, and it occurs because:","options":["The speed of light in the prism is the same for all colors.","The refractive index of the prism material is different for different wavelengths (colors) of light.","The prism absorbs certain colors and reflects others.","The angle of incidence is different for each color."],"answer":"2","solution":"The phenomenon of a prism splitting white light into its constituent colors (a spectrum) is called dispersion. This occurs because the refractive index of the prism material (like glass) is not constant for all wavelengths of light. It is slightly different for each color. Specifically, the refractive index is greater for shorter wavelengths (violet light) than for longer wavelengths (red light). Due to this, violet light bends the most and red light bends the least, separating the colors."},{"id":"72262","q":"The Directive Principles of State Policy (DPSP) in the Indian Constitution are inspired by the Constitution of which country?","options":["United States of America","United Kingdom","Ireland","Canada"],"answer":"3","solution":"The Directive Principles of State Policy (DPSP), contained in Part IV of the Indian Constitution, are a set of guidelines for the state to follow in governance. The concept and framework for the DPSP were borrowed from the Constitution of Ireland (1937)."},{"id":"72263","q":"The 'Chota Nagpur Plateau' in India is renowned as a storehouse of:","options":["Fertile alluvial soils","Forest resources","Mineral resources","Hydroelectric potential"],"answer":"3","solution":"The Chota Nagpur Plateau, located in eastern India, is often referred to as the \"Ruhr of India\" due to its vast and rich deposits of mineral resources. It holds a significant portion of India's reserves of coal, iron ore, mica, bauxite, copper, limestone, and other minerals."},{"id":"72264","q":"In the context of sound waves, the 'Doppler Effect' explains which of the following phenomena?","options":["Why sound travels faster in solids than in gases.","The change in frequency or pitch of a sound perceived by an observer when the sound source is moving relative to the observer.","How echoes are formed by the reflection of sound.","The ability of sound waves to bend around obstacles (diffraction)."],"answer":"2","solution":"The Doppler Effect describes the apparent change in the frequency (and therefore pitch) of a wave in relation to an observer who is moving relative to the wave source. A classic example is the sound of an ambulance siren: its pitch sounds higher as it approaches the observer and lower as it moves away."},{"id":"72265","q":"Which one of the following is NOT a feature of the Western Ghats?","options":["They are a UNESCO World Heritage site and one of the world's biodiversity hotspots.","They are an example of block mountains formed by the down-warping of a part of the land.","They are continuous and can be crossed through passes only.","Their average elevation is higher in the northern part compared to the southern part."],"answer":"4","solution":"Analyzing the features of the Western Ghats: (a) Correct. They are a UNESCO World Heritage site and a global biodiversity hotspot. (b) Correct. They are considered to be the faulted edge of the Deccan Plateau, an example of block mountains. (c) Correct. They are a continuous range that can only be crossed through passes. (d) Incorrect. The average elevation of the Western Ghats generally increases from north to south. The highest peaks, such as Anai Mudi and Doddabetta, are located in the southern part."},{"id":"72266","q":"Under which Article of the Constitution of India can the President declare a 'Financial Emergency'?","options":["Article 352","Article 356","Article 360","Article 368"],"answer":"3","solution":"The Constitution of India provides for three types of emergencies: Article 352: National Emergency Article 356: State Emergency (President's Rule) Article 360: Financial Emergency The President can declare a Financial Emergency if a situation has arisen whereby the financial stability or credit of India or any part of its territory is threatened."},{"id":"72267","q":"The imaginary line on a map connecting points of equal atmospheric pressure, adjusted to sea level, is called an:","options":["Isotherm","Isohyet","Isobar","Isohaline"],"answer":"3","solution":"An isobar is a line drawn on a weather map connecting points of equal atmospheric pressure. An isotherm connects points of equal temperature. An isohyet connects points of equal rainfall. An isohaline connects points of equal salinity."},{"id":"72268","q":"The concept of 'Zero Hour' in the Indian parliamentary procedure refers to:","options":["The first hour of every parliamentary sitting.","The time immediately following the Question Hour when members can raise matters without any prior notice.","The last hour of the day's sitting.","The time when a Money Bill is discussed."],"answer":"2","solution":"The 'Zero Hour' is an Indian parliamentary innovation. It is the period of time that immediately follows the Question Hour (which is the first hour of a sitting) and continues until the regular business of the House is taken up. During this time, Members of Parliament (MPs) can raise matters they consider to be of urgent public importance without any prior notice."},{"id":"72269","q":"In geography, what is a 'fjord'?","options":["A large, flat, and treeless area of land.","A long, narrow, deep inlet of the sea between high cliffs, typically formed by submergence of a glaciated valley.","A ring-shaped coral reef enclosing a lagoon.","A small, seasonal river in an arid region."],"answer":"2","solution":"A fjord is a geographic feature created by glacial erosion. It is a long, narrow, deep inlet of the sea that is situated between high, steep cliffs. Fjords are formed when a glacier carves a U-shaped valley, which is then flooded by the sea as the glacier retreats and sea levels rise. They are common in countries like Norway, Chile, and New Zealand."},{"id":"72270","q":"What is the concept of 'escape velocity'? It is the minimum speed an object needs to:","options":["Enter into a stable orbit around a celestial body.","Break free from the gravitational pull of a celestial body without further propulsion.","Travel at the speed of light.","Overcome atmospheric drag."],"answer":"2","solution":"Escape velocity is the minimum initial speed an object, without further propulsion, must have to break free from the gravitational pull of a celestial body like a planet or moon and move into space indefinitely. For Earth, the escape velocity is approximately 11.2 kilometers per second (about 40,270 km/h)."},{"id":"72271","q":"Who has the final authority to decide whether a bill is a Money Bill or not?","options":["The President of India","The Finance Minister","The Chairman of the Rajya Sabha","The Speaker of the Lok Sabha"],"answer":"4","solution":"According to Article 110(3) of the Constitution of India, if any question arises whether a Bill is a Money Bill or not, the decision of the Speaker of the Lok Sabha on the matter shall be final. This decision cannot be challenged in any court of law or in either House of Parliament."},{"id":"72272","q":"The term 'equinox' refers to the time when:","options":["The sun is directly overhead at the Tropic of Cancer.","The day is longest in the Northern Hemisphere.","The sun is directly overhead at the Equator, and day and night are of approximately equal length everywhere.","The Earth is farthest from the sun in its orbit."],"answer":"3","solution":"An equinox occurs twice a year (around March 20/21 and September 22/23) when the Earth's axis is tilted neither toward nor away from the Sun. At this time, the Sun is directly overhead at the Equator, and the duration of day and night are approximately equal all over the planet."},{"id":"72273","q":"Why are soaps and detergents effective at cleaning?","options":["They are strongly acidic or alkaline, which chemically dissolves grease.","They act as abrasives that physically scrub away dirt.","They are emulsifying agents with molecules that have both a hydrophilic head and a hydrophobic tail.","They reduce the boiling point of water, making hot water cleaning more effective."],"answer":"3","solution":"Soaps and detergents are effective cleaning agents because their molecules are surfactants or emulsifying agents. Each molecule has two distinct parts: a hydrophilic (water-attracting) head and a hydrophobic (water-repelling, oil-attracting) tail. The hydrophobic tails surround grease and dirt particles, while the hydrophilic heads face the water. This forms a structure called a micelle, which allows the oily dirt to be suspended in water and washed away."},{"id":"72274","q":"The 'Suez Canal' provides a crucial shipping route between which two seas?","options":["The Caribbean Sea and the Pacific Ocean.","The North Sea and the Baltic Sea.","The Mediterranean Sea and the Red Sea.","The Black Sea and the Mediterranean Sea."],"answer":"3","solution":"The Suez Canal is a man-made, sea-level waterway in Egypt. It provides the most direct shipping route between Europe and Asia by connecting the Mediterranean Sea to the Red Sea, eliminating the need for ships to navigate around Africa."},{"id":"72275","q":"The power of the President of India to grant pardons, reprieves, respites, or remissions of punishment is laid down in which Article?","options":["Article 72","Article 123","Article 143","Article 52"],"answer":"1","solution":"Article 72 of the Constitution of India grants the President the power to grant pardons, reprieves, respites, or remissions of punishment or to suspend, remit, or commute the sentence of any person convicted of any offense. This is known as the pardoning power of the President."},{"id":"72276","q":"What type of rock is predominantly formed from the cooling and solidification of magma or lava?","options":["Sedimentary Rock","Metamorphic Rock","Igneous Rock","Fossiliferous Rock"],"answer":"3","solution":"Igneous rocks are formed from the cooling and solidification of molten rock material. When this molten rock is beneath the Earth's surface, it is called magma, and when it erupts onto the surface, it is called lava. Examples include granite and basalt. Sedimentary rocks are formed from sediment deposition , and metamorphic rocks are formed by altering existing rocks with heat and pressure."},{"id":"72277","q":"A phenomenon where a warm air mass is forced to rise over a colder, denser air mass, often leading to prolonged, steady precipitation, is known as a:","options":["Convectional uplift","Orographic lift","Warm Front","Cold Front"],"answer":"3","solution":"A warm front is the boundary zone where an advancing warm air mass replaces a colder air mass. Because warm air is less dense, it gently slides up and over the colder air. This slow, gradual lifting process causes the formation of widespread stratiform clouds and often results in prolonged, steady, and light-to-moderate precipitation."},{"id":"72278","q":"Which of the following is a secondary pollutant, formed through reactions in the atmosphere, rather than being emitted directly from a source, in the context of photochemical smog?","options":["Carbon monoxide (CO)","Sulfur dioxide (SO 2 \u200b)","Ozone (O 3 \u200b)","Particulate Matter (PM10)"],"answer":"3","solution":"Pollutants can be primary or secondary. Primary pollutants (like CO, SO\u2082, NOx) are emitted directly from a source. Secondary pollutants are not emitted directly but are formed in the atmosphere through chemical reactions. In photochemical smog, ground-level Ozone (O 3 \u200b) is a major secondary pollutant, formed when primary pollutants like nitrogen oxides (NOx) and volatile organic compounds (VOCs) react in the presence of sunlight."}];
let idx=0, answers={}, timerSec=65*60, timerInt=null;

function render(){
  const q=DATA[idx];
  if(!q){document.getElementById('qText').textContent='No data.';return;}
  document.getElementById('qNum').textContent=idx+1;
  document.getElementById('qTotal').textContent=DATA.length;
  document.getElementById('qText').textContent=q.q;
  document.getElementById('opts').innerHTML=q.options.map((o,i)=>
    `<div class="option ${answers[idx]==(i+1)?'selected':''}" onclick="select(${i+1})">${String.fromCharCode(65+i)}. ${o}</div>`
  ).join('');
}
window.select=o=>{answers[idx]=o; render();};
window.prev=()=>{if(idx>0){idx--; render();}};
window.next=()=>{if(idx<DATA.length-1){idx++; render();}};

function submitTest(){
  clearInterval(timerInt);
  let c=0; for(let i=0;i<DATA.length;i++){if(answers[i]==DATA[i].answer)c++;}
  const pct=Math.round(c/DATA.length*100)||0;
  document.getElementById('qCard').classList.add('hidden');
  document.getElementById('resCard').classList.remove('hidden');
  document.getElementById('score').textContent=pct+'%';
  document.getElementById('detail').innerHTML='<b>'+c+'/'+DATA.length+'</b> correct';
}

function tick(){timerSec--; document.getElementById('timer').textContent=Math.floor(timerSec/60)+':'+String(timerSec%60).padStart(2,'0'); document.getElementById('bar').style.width=(timerSec/(65*60)*100)+'%'; if(timerSec<=0){clearInterval(timerInt); submitTest();}}

render(); timerInt=setInterval(tick,1000);
</script>
</body></html>
