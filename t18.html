<!DOCTYPE html>
<html lang="hi">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>ASWMO — T18 Non-Tech</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
:root{--bg:#0b0c15;--surface:#12142a;--text:#e4e6f0;--accent:#00e8a0;--gold:#f0c040;--danger:#ff4d6d;--border:rgba(255,255,255,.08);--muted:#8a8fa8;}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:Inter,system-ui,sans-serif;background:radial-gradient(1000px 700px at 20% 0%,#00e8a011,transparent),var(--bg);color:var(--text);min-height:100vh;line-height:1.55;}
.container{max-width:900px;margin:2rem auto;padding:0 1.2rem;}
h1{font-size:1.6rem;font-weight:700;background:linear-gradient(135deg,#fff,var(--accent));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.card{background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:16px;padding:1.5rem;margin-bottom:1rem;}
.question{font-size:1.05rem;font-weight:500;margin-bottom:.8rem;line-height:1.35;}
.options{display:grid;gap:.5rem;}
.option{padding:.7rem 1rem;background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:10px;cursor:pointer;font-size:.92rem;transition:.2s;}
.option:hover,.option.selected{border-color:var(--accent);background:rgba(0,232,160,.12);font-weight:600;}
.timer{font-family:monospace;font-weight:700;font-size:2rem;color:var(--accent);}
button{background:linear-gradient(135deg,var(--accent),#00b87e);color:#0a0c12;border:none;padding:.7rem 1.4rem;border-radius:10px;font-weight:700;cursor:pointer;}
.hidden{display:none!important}</style>
</head>
<body>
<div class="container">
<header><h1 id="ptitle">ASWMO — T18 Non-Tech</h1></header>

<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;">
<div><div class="timer" id="timer">65:00</div><div style="font-size:.75rem;color:var(--muted);">Time Remaining</div></div>
<button onclick="submitTest()">Submit Test</button></div>
<div style="height:6px;background:rgba(255,255,255,.1);border-radius:3px;overflow:hidden;margin-top:.5rem;"><div id="bar" style="height:100%;width:100%;background:linear-gradient(90deg,var(--accent),#00b87e);transition:width 1s linear;"></div></div></div>

<div class="card" id="qCard">
<div style="font-size:.8rem;color:var(--muted);margin-bottom:.4rem;">Question <span id="qNum">1</span> / <span id="qTotal">?</span></div>
<div class="question" id="qText">Loading...</div>
<div class="options" id="opts"></div>
<div style="margin-top:1rem;display:flex;gap:.5rem;flex-wrap:wrap;">
<button onclick="prev()">&#8592; Prev</button><button onclick="next()">Next &#8594;</button><button onclick="submitTest()">Submit</button></div>
</div>

<div class="card hidden" id="resCard" style="text-align:center;padding:2rem;">
<h2 style="color:var(--gold);font-size:2rem;">Test Completed!</h2>
<div id="score" style="font-size:3rem;font-weight:800;color:var(--accent);margin:1rem 0;"></div>
<div id="detail" style="color:var(--muted);font-size:.95rem;"></div>
<div style="margin-top:1.5rem;"><a href="index.html" style="color:var(--accent);font-weight:600;">&#8592; Back</a></div>
</div>
</div>

silver is?","options":["1%","5%","0%","None of the above"],"answer":"3"},{"id":"76122","q":"Allminium surface is often ‘Anodized’. This means the deposition of a layer of?","options":["Chromium Oxide","Aluminium Oxide","Nickel Oxide","Zinc Oxide"],"answer":"2"},{"id":"76123","q":"The sensation of fatigue in the muscles after prolonged strenuous physical work is caused by?","options":["A decrease in the supply of oxygen","minor wear and tear of muscle fibres","The depletion of glucose","The accumulation of lactic acid"],"answer":"4"},{"id":"76124","q":"To avoid ‘knocking’ if the engine of a car, which one of the following is used as an anti-knocking agent?","options":["Ethyl alcohol","Butane","Lead tetra ethyl","White petrol"],"answer":"3"},{"id":"76125","q":"Which of the following chemical is used in the artificial rain?","options":["Silver Iodide","Potassium chlorate","Calcium Carbonate","zinc Iodide"],"answer":"1"},{"id":"76126","q":"Starch is a?","options":["Monosaccharide","Disaccharide","Polysaccharide","None of the above"],"answer":"3"},{"id":"76127","q":"Which one of the following creatures have no blood but respires?","options":["Hydra","Cockroach","Earthworm","Fish"],"answer":"1"},{"id":"76128","q":"Diseases of inner parts of the human body are diagnosed through?","options":["Cardiograph","Endoscope","Gyroscope","Crestograph"],"answer":"2"},{"id":"76129","q":"During the metamorphosis of frog?","options":["Hind leg disappear","Ingestion of food is slowed down","Skin becomes rough","Intestine is shortened"],"answer":"4"},{"id":"76130","q":"Lichen are the complex creature, made from?","options":["Fungus and Bacteria","Fungus and Algae","Fungus and Bryophyta","Algae and Bacteria"],"answer":"2"},{"id":"76131","q":"Keeping pigs away from human settlement helps in the eradication of?","options":["Malaria","Elephantiasis","Japanese encephalitis","Polio"],"answer":"3"},{"id":"76132","q":"In AIDS virus , there is?","options":["DNA +Protein","RNA +DNA","RNA + Protein","DNA only"],"answer":"3"},{"id":"76133","q":"Rearing of silk is known as?","options":["Sericulture","Horticulture","Floriculture","Apiculture"],"answer":"1"},{"id":"76134","q":"What is the botanical name of opium?","options":["Emblica officinalis","Papaver somniferum","Rauwolfia Serpentina","Cinchona species"],"answer":"2"},{"id":"76135","q":"Pungency in chillies is due to the presence of?","options":["Lycopene","Carotene","Anthocyanin","Capsaicin"],"answer":"4"},{"id":"76136","q":"Blood grouping was discovered by?","options":["Louis pasture","William Harvey","Landsteiner","Robert Koch"],"answer":"3"},{"id":"76137","q":"Normally the pitch of females are?","options":["More than that of males","Slightly low than that of males","Very low than that of males","Exactly same as that of males"],"answer":"1"},{"id":"76138","q":"During the dehydration the substance that is usually lost by the body is?","options":["Sugar","Calcium Phosphate","Sodium chloride","Potassium chloride"],"answer":"3"},{"id":"76139","q":"A man feels unpleasant due to humidity and heat. The reason for this is?","options":["More sweating","Less sweating","Sweat does not evaporate due to humidity","Sweat is not formed due to humidity"],"answer":"3"},{"id":"76140","q":"Which of the following gas mixture is used in welding gas?","options":["Acetylene and Hydrogen","Oxygen and Acetylene","Hydrogen and Oxygen","Hydrogen and helium"],"answer":"2"},{"id":"76141","q":"Tear gas is?","options":["Ammonia","Chlorine","Hydrogen Carbide","Hydrogen Sulphide"],"answer":"2"},{"id":"76142","q":"Which of the following devices is used to cool the engine of the vehicles?","options":["Polygraph","Quadrant","Turbine","Radiator"],"answer":"4"},{"id":"76143","q":"In the case of rusting, the weight of iron?","options":["Decrease","Increase","Remain the same","Uncertain"],"answer":"2"},{"id":"76144","q":"The full form of SIM is?","options":["Subscriber’s identity Module","Subscriber’s identity Machine","Self Identity Machine","Self Identity Module"],"answer":"1"},{"id":"76145","q":"who delivered the principle of ‘jumping gene’?","options":["Watson and crick","Barbara Mc Clintock","Tomas Hunt Morgan","Gregor Johan Mendal"],"answer":"2"},{"id":"76146","q":"Which of the following is a biofertilizer?","options":["Urea","2,4 –D","Streptrocycline","Azolla"],"answer":"4"},{"id":"76147","q":"The most abundant element of human body is ?","options":["Sodium","Oxygen","Iodine","Iron"],"answer":"2"},{"id":"76148","q":"Which of the following are required for the formation of bones and teeth ?","options":["sodium and potassium","Iron and calcium","sodium and calcium","Calcium and phosphorus"],"answer":"4"},{"id":"76149","q":"‘Phloem’ in plants is mainly responsible for –","options":["Transportation of food","Transportation of oxygen","Transportation of amino acid","Transportation of water"],"answer":"1"},{"id":"76150","q":"Coastal length of India is","options":["7,516 km","6100 km","7515 km","6516 km"],"answer":"1"},{"id":"76151","q":"Which of these articles was implemented on 26 November?","options":["392","394","256","257"],"answer":"2"},{"id":"76152","q":"How many Schedules and Parts are there in the constitution?","options":["12 Schedule 25 Parts","08 Schedule 22 Parts","08 Schedule 24 Parts","12 Schedule 22 Parts"],"answer":"1"},{"id":"76153","q":"Tick the correct statements i At present there is 245 members in Rajya Sabha ii Vice-President is elected by Secret Ballot System iii There is No Reservation of Seat for ST in Rajya Sabha iv Lok Sabha is the Upper House & Interim Political","options":["Only i & ii","i, ii, iv","i, ii, iii","ii and iv"],"answer":"3"},{"id":"76154","q":"Who among the following was not a member of Drafting Committee.","options":["K N Munsi","N Madhav Rao","JL Nehru","NG Ayenger"],"answer":"3"},{"id":"76155","q":"Gadar Party was established in the year","options":["1907","1913","1917","1920"],"answer":"2"}];
let idx=0, answers={}, timerSec=3900, timerInt=null;

function render(){
  const q=DATA[idx];
  if(!q){document.getElementById('qText').textContent='No data.';return;}
  document.getElementById('qNum').textContent=idx+1;
  document.getElementById('qTotal').textContent=DATA.length;
  document.getElementById('qText').textContent=q.q;
  document.getElementById('opts').innerHTML=q.options.map((o,i)=>
    `<div class="option ${answers[idx]==(i+1)?'selected':''}" onclick="select(${i+1})">${String.fromCharCode(65+i)}. ${o}</div>`
  ).join('');
}
window.select=o=>{answers[idx]=o; render();};
window.prev=()=>{if(idx>0){idx--; render();}};
window.next=()=>{if(idx<DATA.length-1){idx++; render();}};

function submitTest(){
  clearInterval(timerInt);
  let c=0; for(let i=0;i<DATA.length;i++){if(answers[i]==DATA[i].answer)c++;}
  const pct=Math.round(c/DATA.length*100)||0;
  document.getElementById('qCard').classList.add('hidden');
  document.getElementById('resCard').classList.remove('hidden');
  document.getElementById('score').textContent=pct+'%';
  document.getElementById('detail').innerHTML='<b>'+c+'/'+DATA.length+'</b> correct';
}

function tick(){timerSec--; document.getElementById('timer').textContent=Math.floor(timerSec/60)+':'+String(timerSec%60).padStart(2,'0'); document.getElementById('bar').style.width=(timerSec/3900*100)+'%'; if(timerSec<=0){clearInterval(timerInt); submitTest();}}

render(); timerInt=setInterval(tick,1000);
</script>
</body></html>
