<script>
const DATA=[{"id":"83256","q":"A company plans to build a chemical manufacturing plant. Due to tight deadlines, they begin land leveling and boundary wall construction before getting Environmental Clearance (EC). What is the violation here?","options":["No violation","Violation of Consent to Operate","Violation of Environmental Clearance requirement","Violation of Site Authorization"],"answer":"3","solution":"Environmental Clearance must be obtained before any construction activity . Even land preparation is considered part of project initiation. Interview Insight: This is called \u201cviolation category project\u201d , and later the company may need ex-post facto clearance (penal route) ."},{"id":"83257","q":"An industry has: \u25cf Installed machinery \u25cf Set up pollution control systems \u25cf Completed construction But starts production without obtaining Consent to Operate (CTO). What is the consequence?","options":["No issue if pollution control is installed","Only a warning","Illegal operation; subject to closure and penalty","Needs only EC"],"answer":"3","solution":"Even if everything is installed, operation without CTO is illegal . CTO ensures: \u25cf Systems are functional \u25cf Compliance is verified Interview Insight: Regulators can issue closure notice under Air/Water Act ."},{"id":"83258","q":"A startup follows this sequence: 1. Applies for CTE 2. Starts construction 3. Applies for EC later What is wrong?","options":["Nothing","EC should come before CTE","CTO should be first","Site authorization is missing"],"answer":"2","solution":"Correct sequence is: EC \u2192 CTE \u2192 Construction \u2192 CTO Without EC, even applying for CTE is conceptually flawed for major projects."},{"id":"83259","q":"A pharma company generates hazardous chemical sludge and stores it on-site without any special approval. Which approval is missing?","options":["CTO","Environmental Clearance","Site Authorization","CTE"],"answer":"3","solution":"Handling hazardous waste requires authorization under Hazardous Waste Rules, 2016 . Covers: \u25cf Storage \u25cf Treatment \u25cf Disposal"},{"id":"83260","q":"A mining project goes through EIA but local villagers were not consulted. Which step is missing?","options":["Screening","Scoping","Public Hearing","Monitoring"],"answer":"3","solution":"Public consultation is a mandatory stage in EIA for many projects. Without it: \u25cf EC can be challenged in court \u25cf Project may be delayed or cancelled"},{"id":"83261","q":"An existing factory doubles its production capacity but: \u25cf Does not apply for new EC \u25cf Continues operating under old CTO What is the issue?","options":["No issue if pollution is same","Only CTO renewal needed","Fresh EC (and likely CTE/CTO) required","Only site authorization needed"],"answer":"3","solution":"Expansion = new environmental impact Requires: \u25cf Fresh EC (if thresholds crossed) \u25cf Updated CTE & CTO"},{"id":"83262","q":"Residents complain about air pollution from a running plant. On inspection: \u25cf The plant has CTO \u25cf But pollution control equipment is not working What action can authority take?","options":["No action (CTO exists)","Immediate shutdown or penalty","Only warning","Cancel EC only"],"answer":"2","solution":"CTO is conditional , not permanent immunity. If conditions are violated: \u25cf SPCB can revoke CTO \u25cf Issue closure orders"},{"id":"83263","q":"A small workshop (non-polluting) asks whether it needs EC. What is correct?","options":["All industries need EC","Only large/impactful projects need EC","Only CTO is enough","Only site authorization needed"],"answer":"2","solution":"EC is required only for listed projects under EIA Notification . Small, low-impact units: \u25cf Usually need only CTE & CTO"},{"id":"83264","q":"A municipal wastewater treatment plant receives an average flow of 10,000 m\u00b3/day with a BOD5 concentration of 250 mg/L. The aeration tank of the activated sludge process has a volume of 2,500 m\u00b3, and the Mixed Liquor Suspended Solids (MLSS) concentration is maintained at 3,000 mg/L. Calculate the Food to Microorganism (F/M) ratio for the plant.","options":["0.12 kg BOD/kg MLSS/day","0.25 kg BOD/kg MLSS/day","0.33 kg BOD/kg MLSS/day","0.45 kg BOD/kg MLSS/day"],"answer":"3","solution":"Step 1: Calculate the BOD load (Food) entering the aeration tank. Where: day Step 2: Calculate the Microorganism mass in the aeration tank. Where: Step 3: Calculate the F/M ratio."},{"id":"83265","q":"A factory: \u25cf Started construction without EC \u25cf Began operation without CTO \u25cf Stores hazardous waste without authorization What type of compliance status is this?","options":["Minor violation","Fully compliant","Major environmental violation","Only documentation issue"],"answer":"3","solution":"This is a serious multi-layer violation : \u25cf EC missing \u2192 illegal project start \u25cf CTO missing \u2192 illegal operation \u25cf Authorization missing \u2192 unsafe waste handling Can lead to: \u25cf Heavy fines \u25cf Closure \u25cf Legal prosecution"},{"id":"83266","q":"What is the primary objective of Environmental Impact Assessment (EIA)?","options":["To generate revenue for the government","To predict environmental consequences of a project before approval","To punish industries for pollution","To issue pollution control certificates"],"answer":"2","solution":"EIA is a preventive tool , not corrective. It evaluates environmental impacts before a project starts , helping decision-makers avoid damage rather than fixing it later."},{"id":"83267","q":"Which authority grants Environmental Clearance (EC) in India?","options":["Central Pollution Control Board (CPCB)","State Pollution Control Board (SPCB)","Ministry of Environment, Forest and Climate Change (MoEFCC)","Municipal Corporation"],"answer":"3","solution":"MoEFCC grants EC for major projects (Category A). \u25cf State-level bodies (SEIAA) handle smaller projects. \u25cf SPCB does NOT give EC\u2014it gives CTE & CTO ."},{"id":"83268","q":"At which stage is Environmental Clearance required?","options":["After construction","Before starting construction","After production begins","During plant shutdow"],"answer":"2","solution":"Environmental Clearance must be obtained before any construction or land development begins . Starting work without EC is a serious violation."},{"id":"83269","q":"Which document is prepared as part of EIA study?","options":["Balance Sheet","Environmental Management Plan (EMP)","Tax Report","Audit Statement"],"answer":"2","solution":"EMP outlines: \u25cf Pollution control measures \u25cf Waste handling \u25cf Monitoring plans It is a core outcome of EI(a)"},{"id":"83270","q":"What is \u201cConsent to Establish (CTE)\u201d?","options":["Permission to start production","Permission to expand workforce","Permission to set up industry at a site","Permission to export goods"],"answer":"3","solution":"CTE = pre-construction approval from SPCB It ensures: \u25cf Proper site selection \u25cf Pollution control design before setup."},{"id":"83271","q":"What is \u201cConsent to Operate (CTO)\u201d?","options":["Approval to purchase machinery","Approval to start industrial operations","Approval for land acquisition","Approval for environmental audit"],"answer":"2","solution":"CTO is granted after installation , confirming: \u25cf Pollution control systems are in place \u25cf Industry is ready for safe operation"},{"id":"83272","q":"Which sequence is correct for approvals?","options":["CTO \u2192 CTE \u2192 EC","EC \u2192 CTO \u2192 CTE","EC \u2192 CTE \u2192 CTO","CTE \u2192 CTO \u2192 EC"],"answer":"3","solution":"Correct order: 1. Environmental Clearance (EC) 2. Consent to Establish (CTE) 3. Consent to Operate (CTO) First environmental approval, then setup, then operation."},{"id":"83273","q":"Site Authorization is mainly related to which type of waste?","options":["Municipal waste","Hazardous waste","Agricultural waste","Plastic waste"],"answer":"2","solution":"Site Authorization is required under Hazardous Waste Management Rules for: \u25cf Storage \u25cf Treatment \u25cf Disposal facilities"},{"id":"83274","q":"Which rule governs Site Authorization in India?","options":["Air Act, 1981","Water Act, 1974","Hazardous and Other Wastes Rules, 2016","Forest Act, 1927"],"answer":"3","solution":"Industries handling hazardous waste must get authorization under these rules to ensure safe handling."},{"id":"83275","q":"Which body issues Consent to Establish (CTE) and Consent to Operate (CTO)?","options":["MoEFCC","CPCB","State Pollution Control Board (SPCB)","NITI Aayog"],"answer":"3","solution":"SPCB is the key regulatory authority at state level for: \u25cf Air pollution control \u25cf Water pollution control \u25cf Industry permissions"},{"id":"83276","q":"Public hearing is part of which process?","options":["CTO","CTE","EIA","Site Authorization"],"answer":"3","solution":"Public consultation is a mandatory step in EIA , ensuring: \u25cf Community participation \u25cf Transparency"},{"id":"83277","q":"Consider the following data: Concentration of influent BOD, Influent flow rate, day Concentration of reactor solids i.e. MLSS, Reactor volume, . Calculate the F/M ratio will be .","options":["0.192 per day","0.125 per day","0.282 per day","0.352 per day"],"answer":"1","solution":""},{"id":"83278","q":"CTO is usually valid for:","options":["Lifetime","1\u20135 years (renewable)","Only 6 months","20 years"],"answer":"2","solution":"CTO must be periodically renewed , ensuring continuous compliance."},{"id":"83279","q":"Starting operations without CTO leads to:","options":["Tax penalty only","No issue","Legal action and closure","Warning notice only"],"answer":"3","solution":"Operating without CTO is illegal and can result in: \u25cf Closure notice \u25cf Heavy penalties \u25cf Legal prosecution"},{"id":"83280","q":"Which approval ensures pollution control measures are installed before operation?","options":["EC","CTE","CTO","Site Authorization"],"answer":"3","solution":"CTO is granted only after verification that: \u25cf Effluent treatment plants \u25cf Emission controls are properly installed."},{"id":"83281","q":"Waste segregation requirement changed from 2016 to 2026 as:","options":["2 \u2192 3 categories","3 \u2192 4 categories","4 \u2192 5 categories","No change"],"answer":"2","solution":"\u25cf 2016: Wet, Dry, Domestic hazardous (3 broad categories) \u25cf 2026: Adds sanitary + special waste clarity \u2192 effectively 4 categories Makes segregation more precise and enforceable."},{"id":"83282","q":"Under 2026 rules, segregation at source is:","options":["Optional","Advisory","Mandatory with penalties","Only for cities"],"answer":"3","solution":"\u25cf 2016: Enforcement was weak \u25cf 2026: Strict penalties introduced \u2192 real enforcement begins"},{"id":"83283","q":"Which principle is explicitly emphasized more strongly in 2026?","options":["Centralized disposal","Polluter Pays Principle","Subsidy Principle","Free waste collection"],"answer":"2","solution":"\u25cf 2026 rules legally enforce penalties for non-compliance \u25cf 2016 mentioned responsibility but enforcement was softer"},{"id":"83284","q":"Bulk Waste Generators (BWGs) in 2016 vs 2026:","options":["No change","Responsibilities reduced","Responsibilities increased significantly","BWGs removed"],"answer":"3","solution":"\u25cf 2016: Encouraged on-site processing \u25cf 2026: Makes it compulsory + monitored"},{"id":"83285","q":"Digital waste tracking system is:","options":["Present in both 2016 and 2026","Only in 2016","Only in 2026","Not in either"],"answer":"3","solution":"\u25cf 2026 introduces centralized digital tracking \u25cf 2016 had no such system \u2192 big governance shift"},{"id":"83286","q":"Landfill usage in 2016 vs 2026:","options":["Same approach","Increased in 2026","Restricted further in 2026","Banned completely"],"answer":"3","solution":"\u25cf 2016: Landfills still widely used \u25cf 2026: Only inert/non-recyclable waste allowed"},{"id":"83287","q":"Legacy landfill remediation is:","options":["Ignored in both","Mentioned in 2016, strengthened in 2026","Only in 2016","Removed in 2026"],"answer":"2","solution":"\u25cf 2016 introduced idea \u25cf 2026 makes it time-bound and stricter"},{"id":"83288","q":"Waste hierarchy concept:","options":["Introduced in 2026 only","Present in 2016 but weak, formalized in 2026","Removed in 2026","Not relevant"],"answer":"2","solution":"\u25cf 2016 had concept indirectly \u25cf 2026 clearly defines priority order"},{"id":"83289","q":"Coverage of rules (2016 vs 2026):","options":["Only urban in both","Only rural in both","Expanded more strongly to rural in 2026","Reduced scope"],"answer":"3","solution":"\u25cf 2026 ensures strong rural implementation"},{"id":"83290","q":"Registration and reporting requirements:","options":["Removed in 2026","Same in both","Stronger and mandatory in 2026","Only for government"],"answer":"3","solution":"\u25cf 2026 introduces formal compliance + digital reporting"},{"id":"83291","q":"Approach to waste in 2016 vs 2026:","options":["Disposal-focused \u2192 Resource-focused","Resource-focused \u2192 Disposal-focused","Same approach","No policy"],"answer":"1","solution":"\u25cf 2016: Manage waste \u25cf 2026: Treat waste as resource (circular economy)"},{"id":"83292","q":"Penalty system:","options":["Strong in 2016, removed in 2026","Weak in 2016, strengthened in 2026","Same","No penalties"],"answer":"2","solution":"\u25cf 2026 introduces clear fines + environmental compensation"},{"id":"83293","q":"Decentralized waste processing:","options":["Discouraged in 2026","Same in both","Strongly promoted in 2026","Removed"],"answer":"3","solution":"\u25cf Composting, local processing \u2192 key focus in 2026"},{"id":"83294","q":"Responsibility shift (2016 vs 2026):","options":["Government \u2192 Citizens & generators","Citizens \u2192 Government","Private \u2192 Public","No shift"],"answer":"1","solution":"\u25cf 2026 clearly says: \u201cYou generate \u2192 you manage\u201d"},{"id":"83295","q":"Overall nature of 2026 rules compared to 2016:","options":["Relaxed","Same","Stricter and technology-driven","Removed"],"answer":"3","solution":"\u25cf 2026 = strict + digital + accountable + circular economy focused"},{"id":"83296","q":"Which method can be employed for plastic waste disposal?","options":["Composting","Sanitary landfill","Pyrolysis","Incineration"],"answer":"3","solution":"Plastics are non-biodegradable. Pyrolysis decomposes them in absence of oxygen and is most suitable."},{"id":"83297","q":"Which statement regarding C/N ratio is NOT correct?","options":["High C/N leads to cell destruction","High C/N reduces nitrogen conservation","C/N \u2248 30 is optimal","Low C/N slows decomposition"],"answer":"4","solution":"Low C/N accelerates decomposition due to excess nitrogen"},{"id":"83298","q":"Which material can be recycled multiple times?","options":["Wood","Organic waste","Plastic","Aluminium"],"answer":"4","solution":"Aluminium can be recycled repeatedly without loss of properties."},{"id":"83299","q":"Pulverization refers to:","options":["Cutting of waste","Crushing and grinding","Composting","Burning"],"answer":"2","solution":"Pulverization is size reduction by crushing/grinding."},{"id":"83300","q":"Heating waste in absence of oxygen is called:","options":["Incineration","Gasification","Pyrolysis","Pulverization"],"answer":"3","solution":"Pyrolysis = thermal decomposition without oxygen."},{"id":"83301","q":"Standard BOD is measured at:","options":["25\u00b0C, 3 days","20\u00b0C, 5 days","30\u00b0C, 5 days","20\u00b0C, 1 day"],"answer":"2","solution":"BOD5 at 20\u00b0C is standard."},{"id":"83302","q":"Correct relation among TOD, COD, BOD:","options":["TOD > COD > BOD","BOD > COD > TOD","COD > BOD > TOD","TOD > BOD > COD"],"answer":"1","solution":"Total oxygen demand is highest followed by COD and BOD."},{"id":"83303","q":"Incineration is best suited for:","options":["Wet waste","Low calorific waste","High calorific waste","Inert waste"],"answer":"3","solution":"High calorific value waste is ideal."},{"id":"83304","q":"Landfill gas mainly consists of:","options":["Oxygen and Nitrogen","Methane and CO2","Hydrogen and Oxygen","Nitrogen and CO2"],"answer":"2","solution":"Mainly methane and carbon dioxide."},{"id":"83305","q":"Transfer stations are used to:","options":["Treat waste","Reduce transport cost","Increase recycling","Store waste"],"answer":"2","solution":"They reduce transportation cost."},{"id":"83306","q":"Most expensive component of SWM:","options":["Collection","Treatment","Separation","Storage"],"answer":"1","solution":"Collection takes ~60\u201380% cost."},{"id":"83307","q":"As per SWM Rules 2026, waste must be segregated into how many categories?","options":["2","3","4","5"],"answer":"3","solution":"As per the Solid Waste Management (SWM) Rules 2026, which come into effect on April 1, 2026, waste must be segregated at source into four categories. These four streams are: wet waste, dry waste, sanitary waste, and special care waste (or domestic hazardous waste). Correct Answer: (c) 4 \uf0b7 Wet Waste: Kitchen, food, and vegetable waste (Green bin). \uf0b7 Dry Waste: Paper, plastic, metal, and glass (Blue bin). \uf0b7 Sanitary Waste: Diapers, napkins, and sanitary pads (Red bin). \uf0b7 Special Care Waste: Hazardous items like household chemicals, batteries, and bulbs (Black bin)"},{"id":"83308","q":"Which of the following is NOT a category under mandatory segregation?","options":["Wet waste","Dry waste","Electronic waste","Sanitary waste"],"answer":"3","solution":"Electronic waste is typically not included in the mandatory 3-way household segregation at source"},{"id":"83309","q":"Which principle is strongly enforced in SWM Rules 2026?","options":["User Pays Principle","Polluter Pays Principle","Producer Subsidy Principle","Equal Waste Distribution"],"answer":"2","solution":"The SWM Rules 2026 strongly enforce the Polluter Pays Principle , using it as the financial backbone to levy environmental compensation for non-compliance, such as improper waste management, operating without registration, and false reporting."},{"id":"83310","q":"A shopping mall generating 150 kg waste/day is classified as:","options":["Household generator","Bulk Waste Generator","Industrial waste unit","Hazardous waste unit"],"answer":"2","solution":"A shopping mall generating 150 kg waste per day is classified as a Bulk Waste Generator . According to Solid Waste Management Rules (generally 100 kg/day or more), commercial complexes, hotels, and malls producing waste above this threshold are required to manage their own waste or facilitate its collection."},{"id":"83311","q":"What is mandatory for Bulk Waste Generators (BWGs)?","options":["Send all waste to landfill","Burn waste onsite","Process wet waste onsite","Export waste"],"answer":"3","solution":"Based on Solid Waste Management (SWM) Rules, Bulk Waste Generators (BWGs)\u2014such as hotels, residential societies, and institutions\u2014are mandated to segregate waste at source and process all biodegradable (wet) waste on-site , typically via composting or bio-methanation."},{"id":"83312","q":"If a housing society fails to segregate waste, what can happen?","options":["Warning only","No action","Environmental compensation (fine)","Free waste collection"],"answer":"3","solution":"If a housing society fails to segregate waste, they can face Environmental compensation (fine) . Under the Solid Waste Management Rules 2016, municipalities can impose penalties for not separating wet and dry waste, often enforcing fines and refusing to collect mixed garbage, forcing societies to pay for mismanagement"},{"id":"83313","q":"Which is the correct order of waste hierarchy?","options":["Dispose \u2192 Recycle \u2192 Reduce","Reduce \u2192 Reuse \u2192 Recycle \u2192 Recover \u2192 Dispose","Recycle \u2192 Dispose \u2192 Reduce","Recover \u2192 Reduce \u2192 Dispose"],"answer":"2","solution":"The correct order of the waste hierarchy is Reduce \u2192 Reuse \u2192 Recycle \u2192 Recover \u2192 Dispose . This framework, often visualized as an inverted pyramid, prioritizes preventing waste generation at the source, followed by reusing, recycling, recovering energy, and finally, safe disposal as the last resor."},{"id":"83314","q":"Under SWM Rules 2026, landfills should be used for:","options":["All types of waste","Only biodegradable waste","Only non-recyclable inert waste","Only plastic waste"],"answer":"3","solution":"Under the Solid Waste Management (SWM) Rules, 2026 , landfills are strictly restricted to the disposal of waste that cannot be processed further, specifically non-recyclable , non-energy recoverable , and inert material"},{"id":"83315","q":"What is the purpose of digital waste tracking introduced in 2026 rules?","options":["Entertainment","Reduce manpower","Ensure transparency and accountability","Increase taxes"],"answer":"3","solution":"The digital waste tracking system introduced in the 2026 Solid Waste Management Rules (India) aims to create a centralized system for tracking waste, designed to ensure transparency and accountability across the value chain, improving monitoring, and reducing data gaps. This system mandates registration and reporting to curb illegal dumping and enhance compliance."},{"id":"83316","q":"SWM Rules 2026 apply to:","options":["Only urban areas","Only rural areas","Both urban and rural areas","Only metro cities"],"answer":"3","solution":"The Solid Waste Management Rules, 2026, which come into effect on April 1, 2026, apply to (c) Both urban and rural areas . These rules cover all local bodies, including municipalities and rural, to ensure comprehensive waste segregation, processing, and management across India."},{"id":"83317","q":"Which of the following best represents \u201ccircular economy\u201d in waste management?","options":["Burning all waste","Dumping waste in landfill","Reusing and recycling waste into resources","Exporting waste"],"answer":"3","solution":"A circular economy is a sustainable economic model designed to minimize waste and keep resources in use for as long as possible. Unlike the traditional linear \"take-make-dispose\" model, it focuses on a regenerative cycle where materials are reused, repaired, and recycled to create new value. This approach reduces the need for extracting new raw materials, lowers environmental impact, and promotes long-term sustainability."},{"id":"83318","q":"Which entity is responsible for managing waste at the source?","options":["Government only","Waste collectors only","Waste generator","NGOs"],"answer":"3","solution":"The entity responsible for managing waste at the source\u2014meaning the initial segregation and handling\u2014is the Waste generator . According to waste management rules, residents, households, and institutions must segregate waste at the point of generation before it is collected, rather than relying solely on collectors."},{"id":"83319","q":"Legacy landfills under the 2026 rules must be:","options":["Ignored","Expanded","Remediated","Privatized"],"answer":"3","solution":"Under the 2026 Solid Waste Management Rules and Swachh Bharat Mission (Urban) 2.0, legacy landfills must be Remediated . The rules mandate time-bound bio-mining and bio-remediation to eliminate city dumpsites, converting them into cleaner land by 2026, aimed at improving environmental quality and reducing waste"},{"id":"83320","q":"A restaurant dumps mixed waste without segregation. Which rule is violated?","options":["Waste hierarchy","Source segregation rule","Digital tracking rule","Rural waste rule"],"answer":"2","solution":"A restaurant dumping mixed waste violates the Source segregation rule . According to Solid Waste Management Rules, all waste generators\u2014including commercial entities like restaurants\u2014must segregate waste into biodegradable, dry, and domestic hazardous waste streams at the source before handing it over to collectors"},{"id":"83321","q":"The following zones are formed in a polluted river 1. Zone of clear water 2. Zone of active decomposition 3. Zone of recovery 4. Zone of pollution The correct sequence in which these zones occur progressively downstream in a polluted river is","options":["4, 2, 1, 3","4, 2, 3, 1","2, 4, 3, 1","2, 4, 1, 3"],"answer":"2","solution":""},{"id":"83322","q":"In which type of lakes, does a perfect ecological equilibrium among the producers, decomposers and consumer groups of organisms exist?","options":["Senescent lakes","Mesotrophic lakes","Oligotrophic lakes","Eutrophic lakes"],"answer":"3","solution":""},{"id":"83323","q":"In the facultative pond systems, the aerobic zone may get extended downwards due to","options":["calm waters along with weak sunlight","mixing by wind action along with weak sunlight","mixing by wind action along with penetration by sunlight","calmwaters along with penetration by sunlight"],"answer":"3","solution":""},{"id":"83324","q":"Deep ponds, in which oxygen is absent except, perhaps, across a relatively thin surface layer, are called","options":["aerobic ponds","anaerobic ponds","facultative ponds","polishing ponds"],"answer":"2","solution":"Deep ponds, in which oxygen is absent except, perhaps, across a relatively thin surface layer, are called anaerobic ponds . These ponds are typically 2.5 t0 4 m deep, designed to treat high-strength wastewater through anaerobic digestion, often releasing gases like methane and carbon dioxide from the bottom layers"},{"id":"83325","q":"Match List-I (Parameter) with List-II [General standard for discharge into the inland surface water in mg/L (max)] and select the correct answer using the codes given below the lists: List-I List-II A. BOD (5 day 20\u00b0C) 1. 250 B. COD 2. 100 C. Oil and grease 3. 20 D. Suspended solids 4. 10 5. 30","options":["Codes : A B C D","2 1 4 5","5 4 3 2","2 4 3 5","5 1 4 2"],"answer":"1","solution":""},{"id":"83326","q":"A municipal sewage has BOD 5 of 200 mg/L. It is proposed to treat it and dispose off into a marine environment. For what minimum efficiency should the sewage treatment plant be designed?","options":["85%","60%","50%","33.67%"],"answer":"3","solution":"The sewage treatment plant should be designed for a minimum BOD removal efficiency of 50% . This standard is based on reducing the municipal sewage influent from to an acceptable level of roughly before disposal into a marine (sea) environment."},{"id":"83327","q":"Sewage sickness occurs when","options":["sewage contains pathogenic organisms","sewage enters the water supply system","sewers get clogged due to accumulation of solids","voids of soil clogged due to continuous application of sewage on a piece of land"],"answer":"4","solution":""},{"id":"83328","q":"For a colony of 10,000 persons having sewage flow rate of 200 L/capita/day, BOD of applied sewage of 300 mg/L and organic loading of 300 kg/day/hectare, the area of an oxidation pond required for treating the sewage of the colony is","options":["0.2 hectares","1 hectare","2 hectares","6 hectares"],"answer":"3","solution":""},{"id":"83329","q":"Critical factors for the activated sludge treatment process are","options":["maximum hourly flow rate","maximum and minimum flow rate","maximum hourly flow rate and maximum daily organic load","minimum hourly flow rate and minimum daily organic load"],"answer":"3","solution":""},{"id":"83330","q":"Sewage may be disposed of without treatment into a water body if the available dilution is","options":["less than 150","more than 150","more than 300","more than 500"],"answer":"4","solution":""},{"id":"83331","q":"Which one of the following terms, correctly describes 'Biomagnification'?","options":["Reproduction of micro-organisms","Observation of micro-organisms microscope","Ability of micro-organisms to form zoological film","Concentration of toxic materials in the food chain"],"answer":"4","solution":""},{"id":"83332","q":"Which one of the following methods of solid waste management conserves energy most efficiently in the form of gas or oil?","options":["Incineration with heat recovery","Combusting","Fluidized-bed incineration","Pyrolysis"],"answer":"4","solution":""},{"id":"83333","q":"Consider the following statements: Activated sludge process can be said to comprise: 1. Conversion of dissolved organic matter into biological flocs 2. Removal of dissolved BOD of the waste water 3. Digestion of the sludge Which of these statements are correct?","options":["1, 2 and 3","1 and 2 only","2 and 3 only","1 and 3 only"],"answer":"2","solution":""},{"id":"83334","q":"Sludge with poor setting characteristics termed as","options":["high purity activated sludge","floating sludge","sludge bulking","all of above"],"answer":"3","solution":"A bulking sludge is a condition defined be solids with poor settling characteristic (which are either slow or unable to settle at all and will just float on top) and this can be observed by the high SV test result. As a general guide, the SV test will indicate the volume of settle solids after 30 minutes times period."},{"id":"83335","q":"The relative stability of a sewage sample whose dissolved oxygen is same as the total oxygen required to satisfy BOD is","options":["zero","1%","100%","infinity"],"answer":"3","solution":"The Relative stability of a sewage sample whose dissolved oxygen is same as the total oxygen required satisfy BOD is 100%"},{"id":"83336","q":"If a sewer carrying a discharge of 3 cumec outfalls into a river having a discharge of 10 cumec and DO equal to 9.1 mg/L, the resultant DO of the mix is","options":["7 mg/L","5 mg/L","6 mg/L","8 mg/L"],"answer":"1","solution":""},{"id":"83337","q":"Which of the following units works in anaerobic conditions?","options":["Sludge digestion tank","Sedimentation tank","Activated sludge treatment","Trickling filters"],"answer":"1","solution":"Activated sludge treatment, sedimentation tank activated sludge treatment units works in aerobic conditions. Where as sludge digestion tank unit works in anaerobic conditions."},{"id":"83338","q":"Which of the following Anaerobic Reactor does not require any special media to keep sludge in suspension during treatment?","options":["Up flow anaerobic filters","Down flow anaerobic filters","Fluidized bed units","UASB type units"],"answer":"4","solution":"Anaerobic Reactor does not require any special media to keep sludge in suspension during treatment is UASB type units."},{"id":"83339","q":"Septic tank is a","options":["Settling tank B. Digestion tank C. Aeration tank Which of the above is/are correct ? Select the code for the correct answer from the options given below :","A only","A and B only","A and C only","C only"],"answer":"3","solution":"Septic tank is designed as ordinary settling tank except that detention time is 12-36 hours, with extra provision for digestion of sludge by anaerobic bacteria."},{"id":"83340","q":"What is the specific gravity of sewage?","options":["Zero","Slightly less than 1","equal to 1","slightly greater than 1"],"answer":"4","solution":"Generally, the specific gravity of municipal sewage lies between 1.2 to 1.4 which is slightly greater than 1. The pH of fresh sewage is more than 7 and fresh sewage is alkaline in nature. The pH of septic sewage is less than 7 and septic sewage is acidic in nature."},{"id":"83341","q":"For the same solid content, if the quantity of sludge with a moisture content of 98% is X, then the quantity of sludge with moisture content of 96% will be","options":["2X","X","X/2","X/4"],"answer":"3","solution":"Given, Volume, Moisture content, and"},{"id":"83342","q":"In the activated sludge process, the combination of liquid and microorganism undergoing aeration is known as :","options":["mixed liquor suspended solids","chemical oxygen demand","mixed liquor","sludge"],"answer":"1","solution":"In the activated sludge process, the combination of liquid and microorganism undergoing aeration is known as mixed liquor and the suspended solid in the aeration tank are mixed liquor suspended solid."},{"id":"83343","q":"Reverse Osmosis is a type of","options":["Dead end filtration system","Ion exchange method","Cross flow filtration system","Micro filtration"],"answer":"3","solution":"Reverse osmosis which is also commonly referred to as RO is a type of filtration method used for the removal of molecules and ions from a certain solution."},{"id":"83344","q":"In transition of sewers from smaller diameter sewers to largerdiameters sewers, the continuity of sewers is maintained at the:","options":["bottom of the concrete bed of sewers","inverts of the sewers","crowns of the sewers","hydraulic gradients of the sewers."],"answer":"3","solution":"All changes in size, shape, alignment, flow volume, free and submerged discharge at the end of sewer lines, passing of flow through measuring or diversion devices and sewer junctions, etc. are known as sewer transitions. Manholes must be located at all such transitions. The transition from larger dia sewer to smaller dia sewer should not be made. However, in other transitions, such as change from small dia sewer to large dia sewer or change of slope, etc., the crowns of sewers are always kept continuous. In no case, the hydraulic flow line (grade line) in the larger sewer should be higher than the incoming one."},{"id":"83345","q":"Match List I with List II and select the correct answer using thecodes given below the lists : List I (Process) List II (Biological agent) A. Oxidation ditch 1. Facultative bacteria B. Waste stabilisation pond 2. Anaerobic bacteria C. Imhoff tank 3. Aerobic bacteria (suspended culture) D. Rotating Biological Contractor (RBC) 4. Aerobic bacteria (attached culture)","options":["A-3, B-1, C-, D-2","A-3, B-1, C-2, D-4","A-1, B-3, C-2, D-4","A-3, B-2, C-1, D-4","3 4 1 2"],"answer":"2","solution":"The oxidation ditch, as described in the text, works under aerobic bacteria (suspended culture of course). Other units which work on similar aerobic (suspended culture) include: activated sludge process, oxidation pond, and sludge digestion tanks. A waste stabilisation pond works under facultative bacteria, and an Imhoff tank works under anaerobic bacteria, as discussed in the text. The RBC's (Rotating Biological Contractors), as described in text, infact work on the aerobic bacteria (attached culture) like that of a trickling filter as discussed. Based on this knowledge and without even knowing about RBC's, the correct choice can be marked, which indicate A-3, B-1, and C-2; i.e. the choice given at (b)."},{"id":"83346","q":"One litre of sewage, when allowed to settle for 30 minutes gives sludge of 27 cm\u00b3.If the dry weight of sludge is 3.0 gm, then its sludge volume index will be:","options":["9","24","30","81."],"answer":"1","solution":"3 gm of sludge occupies 27 cm\u00b3 (27 ml) of volume in 1 litre of sewage settled for 30 min. Hence, 1 gm of such sludge will contain 9 cm\u00b3 (i.e. 9 ml) of volume, which infact is nothing but SVI, as defined in article 9.36. Therefore, SVI is 9 ml/gm; and hence the choice at (a) is a correct choice."},{"id":"83347","q":"A grit chamber of dimensions 12.0 m \u00d7 1.50 m \u00d7 0.80 m liquid depth has a flow of 720 m\u00b3/hr. Its surface loading rate and detention time are, respectively :","options":["40,000 m\u00b3/hr/m\u00b2 and 1.2 minute","40,000 lph/m\u00b2 and 40 minutes","40 m\u00b3/hr/m\u00b2 and 12 minutes","40,000 lph/m\u00b2 and 1.2 minutes."],"answer":"4","solution":"Surface area Surface loading The detention time for Grit chambers is usually 40 to 60 secs or so. In the given choices, the nearest available is 1.2 minutes . Other choices are 12 minutes and 40 minutes, which are ignored. Hence, the choice (d), which indicates correct surface loading of 40,000 1ph/m\u00b2 and 1.2 minute of detention time is correct."},{"id":"83348","q":"The sound pressure level for a jet plane on the ground with sound pressure of 2000 m bar should be :","options":["60 decibel","100 decibel","140 decibel","180 decibel."],"answer":"3","solution":"The sound pressure level in dB (decibel) is given by equation as"},{"id":"83349","q":"The MLSS concentration in the aeration tank of extended aeration activated sludge process is 4000 mg/l. If one litre of sample settled in 30 minutes and the measuring cylinder showed a sludge volume of 200 ml, then the sludge volume index would be nearly:","options":["200","150","100","50."],"answer":"4","solution":"X t = 4000 mg/ l 1 litre of sewage will contain solids = 4000 mg = 4 g Sludge volume = 200 ml SVI = = 50 ml/g"},{"id":"83350","q":"If the moisture content of a sludge is reduced from 98% to 96%, the volume of sludge will decrease by:","options":["2%","20%","25%","50%."],"answer":"4","solution":". Hence choice (d) is the correct answer."},{"id":"83351","q":"The following is a well known formula for estimating the plume rise : where the letters have their usual meaning. The estimated plume rise (by the above formula) with a stack gas having heat emission rate , the wind speed , stack gas speed inside a stack diameter of 1 m at the top is","options":["7.8 m","8.7 m","3.15 m","."],"answer":"1","solution":"Here V S = stack gas velocity = 8 m/s d = inside exit dia. of stack = 1 m u = wind speed = 4 m/s Q h = heat emission rate in kJ/s = 2000 kJ/s. Substituting values in the given formula, we get h = = 7.8. Hence choice (a) is correct."},{"id":"83352","q":"Which type of light energy is effectively absorbed by CO \u2082 in the lower boundary of the troposphere?","options":["X-rays","UV-rays","Visible light","Infra-red rays."],"answer":"4","solution":"Infra-red rays. CO\u2082 is a potent greenhouse gas that absorbs and re-emits infrared radiation. It is largely transparent to visible light"},{"id":"83353","q":"Which one of the following is the range of ozonosphere in atmosphere?","options":["Troposphere to Stratosphere","Tropopause to Stratopause","Tropopause to Mesosphere","Stratosphere to Mesosphere."],"answer":"3","solution":"Tropopause to Mesosphere. While the ozone layer (ozonosphere) is primarily in the stratosphere, its range is from the tropopause (the boundary between troposphere and stratosphere) up to the mesosphere, not just to the stratopause."},{"id":"83354","q":"Which one of the following pairs is not correctly matched?","options":["Coriolis effect : The effect of Earth's rotation on wind direction and velocity","PAN : Found during photochemical smog","Cyclone : Employed for particulate matter removal","Wind rose Employed in forecast of pollutant dispersion in ambient air."],"answer":"4","solution":""},{"id":"83355","q":"Which one of the following is considered as the thermophilic range of sludge digestion?","options":["60\u00b0C to 70\u00b0C","50\u00b0C to 57\u00b0C","29\u00b0C to 40\u00b0C","20\u00b0C to 30\u00b0C."],"answer":"2","solution":""},{"id":"83356","q":"Which one of the following can fix atmospheric nitrogen?","options":["Green algae","Blue green algae","Red algae","Brown algae."],"answer":"2","solution":""},{"id":"83357","q":"Pneumoconiosis is caused due to inhalation of which one of the following?","options":["Silica","NO x","Lead","Cadmium"],"answer":"1","solution":"Pneumoconiosis is a general term for lung diseases caused by dust inhalation. While Silicosis is caused by silica, the term \"Pneumoconiosis\" also encompasses Coalworker's pneumoconiosis (black lung) from coal dust and Asbestosis from asbestos fibers."},{"id":"83358","q":"Which among the following Protocols/Convention is dedicated for protecting biodiversity from the potential risks caused by living modified Organisms (LMO) from Modern technology?","options":["Cartagena Protocol","Nagoya Protocol","Bonna Convention","Vienna Convention"],"answer":"1","solution":"The Protocol dedicated to safeguarding biodiversity from potential risks posed by living modified organisms (LMOs) through modern technology is (a) the Cartagena Protocol on Biosafety."},{"id":"83359","q":"'BioCarbon Fund Initiative for Sustalnable Forest Landscapes' is managed by the","options":["Asian Development Bank","International Monetary Fund","United Nations Environment Program","World Bank"],"answer":"4","solution":"The BioCarbon Fund Initiative for Sustainable Forest Landscapes (ISFL) is a multilateral fund, supported by donor Governments and managed by the World Bank. It promotes reducing greenhouse gas emissions from the land sector, including efforts to reduce deforestation and forest degradation in developing countries (REDD+) sustainable agriculture as well as smarter land-use planning, policies and practices. The Biocarbon Fund Initiative for Sustainable Forest Landscapes supports programs."},{"id":"83360","q":"Who has propounded the concept of \u2018Limit to Growth\u2019?","options":["Club of Rome","UNESCO","Brundtland Commission","Agenda 21"],"answer":"1","solution":"The 'Limit to Growth' was a research by four MIT scientists led by Donald Meadows and was published by the 'Club of Rome' as the 'Limit to Growth in 1972. The club of Rome was founded in 1968. It believed that possibilities of continuous growth have been exhausted and timely action is essential in order to avert a planetary collapse."},{"id":"83361","q":"India's first Dolphin Observatory is being built An-","options":["Delhi","Mumbai","Bihar","Odisha"],"answer":"3","solution":"Government of Bihar is setting up India's first observatory for the mammals in Bhagalpur district. Construction at the Vikramshila Gangetic Dolphin Sanctuary (VGDS) in the Bhagalpur district of Bihar is going on."},{"id":"83362","q":"Who is the \"Forest Man of India\"?","options":["Ravishankar","Anna Hazare","Rajendra Singh","Jadav Payeng"],"answer":"4","solution":"Jadav Payeng, who is also popularly known as Molai Payeng, earned his name as 'The Forest Man of India' by spending 30 years of his life planting around 40 million trees to create a real man made forget by changing a barren sandbar of Brahmaputra, Covering an area of 550 hectares of land which is known as Molai Kathoni."},{"id":"83363","q":"What is the animal symbol of WWF (World Wildlife Fund)?","options":["Dolphin","Kangaroo","Tiger","Giant panda"],"answer":"4","solution":"World Wildlife Fund was conceived in April, 1961 and set up shop in September, 1961 at International Union for Conservation of Nature (IUCN) headquarters in Morges, Switzerland. Prince Bernhard of the Netherlands became the organization's first president. The Giant panda becomes the logo for World Wildlife Fund."},{"id":"83364","q":"A coalition of 50+ companies worldwide seeking to send a powerful market signal to commercialize zero-carbon technologies is named as:","options":["First Movers Coalition","Global Initiative of Companies for Zero Carbon","World Environmental forum","Global Environmental forum"],"answer":"1","solution":"A coalition of 50 + companies worldwide seeking to send a powerful market signal to commercialize zero-carbon technologies is named as \"First Movers coalition\". It is led by the World Economic Forum and US. Government"},{"id":"83365","q":"The \"Montreaux Record\" is a register of:","options":["Invasive alien species and their ecological hazard outside their native environment","Wetland sites under the threats of anthropogenic activities","Endangered species of tropical and sub-tropical fauna","Coastal cities under direct threat of consequences of global warming"],"answer":"2","solution":"The \"Montreux Record\" is a register of wetland sites on the List of Wetlands of International Importance, where changes in ecological character have occurred, are occurring, or are likely to occur as a result of technological developments, pollution or other human interference. It is maintained as part of the Ramsar List. Currently, two wetlands of India are in Montreux record namely Keoladeo National Park (Rajasthan) and Loktak Lake (Manipur)."},{"id":"83366","q":"What does the red colour indicate as per the colour code?","options":["Fire prevention","Radiant hazards","First aid","General caution"],"answer":"1","solution":"A Colour code is a system for displaying information by using different colours. The United Kingdom adopted a colour code scheme for such communication wherein red signified danger and white signified safety, with other colours having similar assignments of meaning. \u2022 The colour code identifies the type of hazard, which helps the employee identify the level of severity. It is meant to reduce the possibility of injuries. \u2022 The colour of safety Red: Fire protection equipment, Danger, high risk of injury or death, Emergency stops and alarms. Orange: Moderate risk of injury, Guarding devices. Yellow: Caution statements, Minor risk of injury, Materials handling equipment. Green: Safety equipment or information, First aid equipment or location. Blue: No immediate hazard"},{"id":"83367","q":"Anabolism refers to:","options":["Breakdown of molecules","Energy relcase","Biosynthesis of molecules","No energy change"],"answer":"3","solution":"Anabolism refers to the set of metabolic pathways that build larger molecules from smaller ones. It is a constructive process that involves the synthesis of complex molecules such as proteins, nucleic acids, and carbohydrates from simpler molecules like amino acids, nucleotides, and monosaccharides. Energy is stored during anabolism because these processes require energy input, usually in the form of ATP. For example, during protein synthesis, amino acids are assembled into polypeptide chains, and energy is consumed to form peptide bonds. Anabolism is crucial for growth, repair, and maintenance of cells and tissues. It enables organisms to store energy in the form of macromolecules, which can later be used for various cellular functions."},{"id":"83368","q":"Consider the following pairs: 1. Physical Hazard a. Explosive 2. Chemical Hazard b. No safety device 3. Psychological Hazard c. Noise 4. Mechanical Hazard d. Smoking Which of the pairs given above is/are correctlymatched?","options":["1-c, 2-a, 3-d, 4-b","1-a, 2-c, 3-d, 4-b","1-a, 2-c, 3-b, 4-d","1-c, 2-a, 3-b, 4-d"],"answer":"1","solution":"Physical Hazard Noise Chemical Hazard Explosive Psychological Hazard Smoking Mechanical Hazard No safety device"},{"id":"83369","q":"What is the ISO code for Occupational Safety","options":["ISO 9001","ISO 14001","ISO 45001","ISO 27001"],"answer":"3","solution":"ISO 45001 is the International Standard for Occupational Health and Safety Management Systems (OHSMS). \u2022 It provides a framework to improve employee safety, working reduce workplace risks, and create better, safer conditions. ISO 9001 - Quality Management System ISO 14001 \u2013 Environmental Management System ISO 27001 - Information Security Management System"},{"id":"83370","q":"National Ganga River Basin Authority (NGRBA) is responsible for ____ duties.","options":["Developmental","Developmental and regulatory","Regulatory","Protection"],"answer":"2","solution":"National Ganga River Basin Authority (NGRBA) is an empowered planning, financing, monitoring, and coordinating authority established by the Government of India for comprehensive management and conservation of the Ganga River Basin. Its responsibilities include: Developing a Ganga River Basin Management Plan. Regulating activities aimed at pollution prevention, control, and abatement. Ensuring water quality maintenance. Taking measures relevant to river ecology in the states through which the Ganga flows. Promoting sustainable development and ensuring minimum ecological flows. Overseeing sewerage infrastructure, catchment area treatment, floodplain protection, and public awareness. Monitoring and executing pollution abatement and conservation programs."},{"id":"83371","q":"99% of the sun's radiation is obtained up to a wavelength of","options":["0.2 \u00b5m","0.48 \u00b5m","2.5 \u00b5m","4 \u00b5m"],"answer":"4","solution":"About 96% of the Sun's energy falls within the range of 0.27 \u00b5m to 2.6 \u00b5m. To capture 99% of the energy, we extend the range up to 4.0 \u00b5m."},{"id":"83372","q":"National Space Day would be celebrated on?","options":["21 August","22 August","23 August","24 August"],"answer":"3","solution":"National Space Day in India is celebrated on August 23 each year. This date commemorates the successful landing of the Chandrayaan-3 mission's Vikram Lander and Pragyan Rover on the Moon on August 23, 2023. The landing made India the fourth country to land on the Moon and the first to reach its southern polar region. To honor this landmark achievement, Prime Minister Narendra Modi officially declared August 23 as National Space Day. The inaugural National Space Day celebration took place on August 23, 2024, with the theme \"Touching Lives while Touching the Moon: India's Space Saga.\" The day is marked by various events highlighting India's space accomplishments, educational initiatives, and outreach programs aimed at inspiring future generations in science and technology."},{"id":"83373","q":"Sun and Earth both behave as a black body with black body temperatures given as 6000K for Sun and correspondingly for Earth as 298K. The ratio of the wavelengths corresponding to the maximum amount of radiations emitted by the Sun to that of the Earth comes out to be","options":["405.387","0.049","2.4\u00d710 \u20133","20.134"],"answer":"2","solution":"Wavelength constant Absolute temperature For the Sun: For Earth: Ratio of wavelengths for Sun and Earth :"},{"id":"83374","q":"The 'Sendai Framework\" is related to:","options":["Global warming","Disaster management","Ozone depletion","Biodiversity conservation"],"answer":"2","solution":"The Sendai Framework for Disaster Risk Reduction 2015-2030 (Sendai Framework) was the first major agreement of the post-2015 development agenda and provides Member States with concrete actions to protect development gains from the risk of disaster."},{"id":"83375","q":"Consider the following statements: 1. Oxidation pond can effect removal of nitrogen compound from waste water. 2. Stabilization ponds are considered to be a major hydrogen removal process. 3. Nitrogen and phosphorus are used by algae within the pond, and nutrient removal from the pond effluent is accomplished by periodic removal of algae from the pond. Which of the above statement(s) is/are incorrect?","options":["1 and 2","2 only","1 and 3","3 only"],"answer":"2","solution":"Stabilization ponds are not primarily designed for nitrogen removal. They are more effective for organic matter degradation and pathogen removal. Nitrogen removal in stabilization ponds is limited and is not considered as a major process."},{"id":"83376","q":"For a waste water the ultimate BOD at 25\u00b0C was found to be 250 mg/lt. For the same waste water ultimate BOD at 30\u00b0C would be","options":["More than 250 mg/lt","Less than 250 mg/lt","250 mg/lt","Zero"],"answer":"3","solution":"Ultimate BOD represents the total amount of oxygen required by micro-organisms to completely decompose the biodegradable organic matter in waste water under aerobic conditions. It does not depend on temperature and it is a function of the organic matter content in the waste water Note: Temperature affects the rate of BOD exertion, but not the ultimate BOD."},{"id":"83377","q":"Consider the following statements regarding sludge digestion process: 1. Aerobic digestion gives more purified supernatant than anaerobic digestion. 2. Anaerobic digestion can result in pathogen free sludge (with thermophilic process). 3. It is difficult to dewater sludge in aerobic digestion. Which of the above statement(s) is/are correct?","options":["2 only","1 and 3","2 and 3","1, 2 and 3"],"answer":"3","solution":""},{"id":"83378","q":"Consider the following statements: 1. Sewage treatment units are generally designed for peak flow. 2. In the first stage of decomposition of organic matter in sewage, nitrates are formed. 3. As a result of stabilization of sewage effluent, the most appropriate end product produced is plant nutrients. 4. The gas coming out from a sludge digestion tank is 30% methane and 70% carbon dioxide. Select the CORRECT answer using the codes given below.","options":["1 and 2","2 and 3","3 and 4","3"],"answer":"4","solution":"Sewage treatment units are generally designed for peak flow. - INCORRECT . Sewage treatment units are generally designed for average flow (or average daily flow) for economic reasons, not peak flow. In the first stage of decomposition of organic matter in sewage, nitrates are formed. - INCORRECT . The first stage of decomposition primarily produces ammonia , while nitrates indicate fully oxidized, stabilized conditions. As a result of stabilization of sewage effluent, the most appropriate end product produced is plant nutrients. - CORRECT . The final stabilization of effluent results in the formation of stable end products, including nutrients like nitrates, which can be utilized by plants. The gas coming out from a sludge digestion tank is 30% methane and 70% carbon dioxide. - INCORRECT . Sludge digestion gas (biogas) typically contains about 65-70% methane and 30-35% carbon dioxide, not the other way around"},{"id":"83379","q":"The following data pertains to a sewage sample: Initial volume = 55 ml (Volume of sewage) Final volume = 200 ml (Volume of sewage plus fresh water) DO of sewage water = 0 mg/l DO of fresh water = 15 mg/l DO of mix after 5 days = 3 mg/l The BOD of given sewage sample is","options":["55 mg/l","45 mg/l","32 mg/l","29 mg/l"],"answer":"4","solution":"Dissolved oxygen of mixture:"},{"id":"83380","q":"The term Municipal Solid Waste is used to describe which kind of solid waste?","options":["Hazardous","Toxic","Nonhazardous","Nontoxic"],"answer":"3","solution":"Definition: Municipal Solid Waste (MSW) , commonly referred to as \"trash\" or \"garbage,\" is the term used to describe the nonhazardous solid waste generated by households, commercial establishments (like offices and stores), and institutions (like schools). What it includes: It typically consists of everyday items such as food scraps, paper products, plastics, glass, metals, and textiles. Exclusions: It specifically excludes hazardous wastes, industrial process wastes, agricultural wastes, and construction debris, which are managed under different regulatory frameworks because they pose more significant threats to human health or the environment."}];
let idx=0, answers={}, timerSec=65*60, timerInt=null;

function render(){
  const q=DATA[idx];
  if(!q){document.getElementById('qText').textContent='No data.';return;}
  document.getElementById('qNum').textContent=idx+1;
  document.getElementById('qTotal').textContent=DATA.length;
  document.getElementById('qText').textContent=q.q;
  document.getElementById('opts').innerHTML=q.options.map((o,i)=>
    `<div class="option ${answers[idx]==(i+1)?'selected':''}" onclick="select(${i+1})">${String.fromCharCode(65+i)}. ${o}</div>`
  ).join('');
}
window.select=o=>{answers[idx]=o; render();};
window.prev=()=>{if(idx>0){idx--; render();}};
window.next=()=>{if(idx<DATA.length-1){idx++; render();}};

function submitTest(){
  clearInterval(timerInt);
  let c=0; for(let i=0;i<DATA.length;i++){if(answers[i]==DATA[i].answer)c++;}
  const pct=Math.round(c/DATA.length*100)||0;
  document.getElementById('qCard').classList.add('hidden');
  document.getElementById('resCard').classList.remove('hidden');
  document.getElementById('score').textContent=pct+'%';
  document.getElementById('detail').innerHTML='<b>'+c+'/'+DATA.length+'</b> correct';
}

function tick(){timerSec--; document.getElementById('timer').textContent=Math.floor(timerSec/60)+':'+String(timerSec%60).padStart(2,'0'); document.getElementById('bar').style.width=(timerSec/(65*60)*100)+'%'; if(timerSec<=0){clearInterval(timerInt); submitTest();}}

render(); timerInt=setInterval(tick,1000);
</script>
