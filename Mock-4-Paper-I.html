anet. (d) This is an incorrect mathematical variation of the orbital mechanics formula. Positive Mark: 0.8 Negative Mark: 0"},{"id":"84961","q":"80. The 'Consumer Price Index' (CPI) in India is primarily utilized by policymakers to measure: \u092d\u093e\u0930\u0924 \u092e\u0947\u0902 ' \u0909\u092a\u092d\u094b\u0915\u094d\u0924\u093e \u092e\u0942\u0932\u094d\u092f \u0938\u0942\u091a\u0915\u093e\u0902\u0915 ' (CPI) \u0915\u093e \u092e\u0941\u0916\u094d\u092f \u0930\u0942\u092a \u0938\u0947 \u0928\u0940\u0924\u093f \u0928\u093f\u0930\u094d\u092e\u093e\u0924\u093e\u0913\u0902 \u0926\u094d\u0935\u093e\u0930\u093e \u0915\u094d\u092f\u093e \u092e\u093e\u092a\u0928\u0947 \u0915\u0947 \u0932\u093f\u090f \u0909\u092a\u092f\u094b\u0917 \u0915\u093f\u092f\u093e \u091c\u093e\u0924\u093e \u0939\u0948 ?","options":["Overall stock market volatility ( \u0938\u092e\u0917\u094d\u0930 \u0936\u0947\u092f\u0930 \u092c\u093e\u091c\u093e\u0930 \u0905\u0938\u094d\u0925\u093f\u0930\u0924\u093e )","Wholesale price inflation of industrial raw materials ( \u0914\u0926\u094d\u092f\u094b\u0917\u093f\u0915 \u0915\u091a\u094d\u091a\u0947 \u092e\u093e\u0932 \u0915\u0940 \u0925\u094b\u0915 \u092e\u0942\u0932\u094d\u092f \u092e\u0941\u0926\u094d\u0930\u093e\u0938\u094d\u092b\u0940\u0924\u093f )","Retail inflation experienced by ordinary consumers ( \u0906\u092e \u0909\u092a\u092d\u094b\u0915\u094d\u0924\u093e\u0913\u0902 \u0926\u094d\u0935\u093e\u0930\u093e \u0905\u0928\u0941\u092d\u0935 \u0915\u0940 \u091c\u093e\u0928\u0947 \u0935\u093e\u0932\u0940 \u0916\u0941\u0926\u0930\u093e \u092e\u0941\u0926\u094d\u0930\u093e\u0938\u094d\u092b\u0940\u0924\u093f )","The country's total balance of trade ( \u0926\u0947\u0936 \u0915\u093e \u0915\u0941\u0932 \u0935\u094d\u092f\u093e\u092a\u093e\u0930 \u0938\u0902\u0924\u0941\u0932\u0928 )"],"answer":"3","solution":"The Consumer Price Index (CPI) measures changes over time in the general level of prices of a specific basket of goods and services that households acquire for the purpose of consumption. It is the primary macroeconomic metric used by the RBI to target and track retail inflation. Additional Info (a) Stock market volatility is tracked by financial indices like the India VIX. (b) Wholesale price changes at the producer level are measured by the Wholesale Price Index (WPI). (c) The RBI's monetary policy framework legally aims to maintain CPI inflation at a target of 4%, with a tolerance band of +/- 2%. (d) The balance of trade is measured by tracking the net difference between import and export values. Positive Mark: 0.8 Negative Mark: 0"},{"id":"84962","q":"81. Which Article of the Indian Constitution grants independent, constitutional status to the Election Commission of India? \u092d\u093e\u0930\u0924\u0940\u092f \u0938\u0902\u0935\u093f\u0927\u093e\u0928 \u0915\u093e \u0915\u094c\u0928 \u0938\u093e \u0905\u0928\u0941\u091a\u094d\u091b\u0947\u0926 \u092d\u093e\u0930\u0924 \u0915\u0947 \u091a\u0941\u0928\u093e\u0935 \u0906\u092f\u094b\u0917 \u0915\u094b \u0938\u094d\u0935\u0924\u0902\u0924\u094d\u0930 , \u0938\u0902\u0935\u0948\u0927\u093e\u0928\u093f\u0915 \u0926\u0930\u094d\u091c\u093e \u092a\u094d\u0930\u0926\u093e\u0928 \u0915\u0930\u0924\u093e \u0939\u0948 ?","options":["Article 280 ( \u0905\u0928\u0941\u091a\u094d\u091b\u0947\u0926 280)","Article 315 ( \u0905\u0928\u0941\u091a\u094d\u091b\u0947\u0926 315)","Article 324 ( \u0905\u0928\u0941\u091a\u094d\u091b\u0947\u0926 324)","Article 352 ( \u0905\u0928\u0941\u091a\u094d\u091b\u0947\u0926 352)"],"answer":"3","solution":"Article 324 of the Indian Constitution provides for the establishment of an independent Election Commission to superintend, direct, and strictly control the preparation of electoral rolls and the conduct of elections to Parliament and State Legislatures. Additional Info (a) Article 280 establishes the Finance Commission to allocate tax revenues. (b) Article 315 establishes the Public Service Commissions for the Union (UPSC) and the States (SPSC). (c) The constitutional independence of the Election Commission is vital for ensuring free, fair, and unbiased democratic elections. (d) Article 352 deals with the constitutional provisions for the proclamation of a National Emergency. Positive Mark: 0.8 Negative Mark: 0"},{"id":"84963","q":"82. Under solid and e-waste management regulations, 'Extended Producer Responsibility' (EPR) legally mandates that manufacturers: \u0920\u094b\u0938 \u0914\u0930 \u0908 - \u0915\u091a\u0930\u093e \u092a\u094d\u0930\u092c\u0902\u0927\u0928 \u0928\u093f\u092f\u092e\u094b\u0902 \u0915\u0947 \u0924\u0939\u0924 , ' \u0935\u093f\u0938\u094d\u0924\u093e\u0930\u093f\u0924 \u0909\u0924\u094d\u092a\u093e\u0926\u0915 \u0909\u0924\u094d\u0924\u0930\u0926\u093e\u092f\u093f\u0924\u094d\u0935 ' (EPR) \u0915\u093e\u0928\u0942\u0928\u0940 \u0930\u0942\u092a \u0938\u0947 \u0928\u093f\u0930\u094d\u092e\u093e\u0924\u093e\u0913\u0902 \u0915\u094b \u0905\u0928\u093f\u0935\u093e\u0930\u094d\u092f \u0915\u0930\u0924\u093e \u0939\u0948 \u0915\u093f \u0935\u0947 :","options":["Ensure fair labor wages throughout their supply chain ( \u0905\u092a\u0928\u0940 \u0938\u0902\u092a\u0942\u0930\u094d\u0923 \u0906\u092a\u0942\u0930\u094d\u0924\u093f \u0936\u094d\u0930\u0943\u0902\u0916\u0932\u093e \u092e\u0947\u0902 \u0909\u091a\u093f\u0924 \u0936\u094d\u0930\u092e \u092e\u091c\u0926\u0942\u0930\u0940 \u0938\u0941\u0928\u093f\u0936\u094d\u091a\u093f\u0924 \u0915\u0930\u0947\u0902 )","Take back, recycle, and safely dispose of their products at the end of their useful life ( \u0905\u092a\u0928\u0947 \u0909\u0924\u094d\u092a\u093e\u0926\u094b\u0902 \u0915\u0947 \u0909\u092a\u092f\u094b\u0917\u0940 \u091c\u0940\u0935\u0928 \u0915\u0947 \u0905\u0902\u0924 \u092e\u0947\u0902 \u0909\u0928\u094d\u0939\u0947\u0902 \u0935\u093e\u092a\u0938 \u0932\u0947\u0902 , \u0930\u0940\u0938\u093e\u092f\u0915\u0932 \u0915\u0930\u0947\u0902 \u0914\u0930 \u0938\u0941\u0930\u0915\u094d\u0937\u093f\u0924 \u0930\u0942\u092a \u0938\u0947 \u0928\u093f\u092a\u091f\u093e\u0928 \u0915\u0930\u0947\u0902 )","Provide a lifetime warranty for consumer electronics ( \u0909\u092a\u092d\u094b\u0915\u094d\u0924\u093e \u0907\u0932\u0947\u0915\u094d\u091f\u094d\u0930\u0949\u0928\u093f\u0915\u094d\u0938 \u0915\u0947 \u0932\u093f\u090f \u0906\u091c\u0940\u0935\u0928 \u0935\u093e\u0930\u0902\u091f\u0940 \u092a\u094d\u0930\u0926\u093e\u0928 \u0915\u0930\u0947\u0902 )","Export all hazardous electronic waste to developing nations ( \u0938\u092d\u0940 \u0916\u0924\u0930\u0928\u093e\u0915 \u0907\u0932\u0947\u0915\u094d\u091f\u094d\u0930\u0949\u0928\u093f\u0915 \u0915\u091a\u0930\u0947 \u0915\u094b \u0935\u093f\u0915\u093e\u0938\u0936\u0940\u0932 \u0926\u0947\u0936\u094b\u0902 \u092e\u0947\u0902 \u0928\u093f\u0930\u094d\u092f\u093e\u0924 \u0915\u0930\u0947\u0902 )"],"answer":"2","solution":"Extended Producer Responsibility (EPR) is an environmental policy approach wherein a producer's physical and financial responsibility for a product is extended completely to the post-consumer stage, legally mandating them to take back, manage, and safely recycle their end-of-life goods. Additional Info (a) Fair wages and labor conditions fall under occupational labor laws, not environmental EPR mandates. (b) EPR forces electronics and plastic companies to internalize the environmental costs of their products, heavily encouraging greener designs. (c) Warranties cover functional manufacturing defects during a specified period, not final end-of-life disposal. (d) Exporting hazardous e-waste to developing nations is actively restricted by international treaties like the Basel Convention. Positive Mark: 0.8 Negative Mark: 0"},{"id":"84964","q":"83. Unlike steroid hormones, peptide hormones (like Glucagon or Epinephrine) cannot cross the cell membrane. Instead, they bind to surface receptors and exert their effects inside the cell via \"secondary messengers\". The most common secondary messenger in human physiology is: \u0938\u094d\u091f\u0947\u0930\u0949\u092f\u0921 \u0939\u093e\u0930\u094d\u092e\u094b\u0928 \u0915\u0947 \u0935\u093f\u092a\u0930\u0940\u0924 , \u092a\u0947\u092a\u094d\u091f\u093e\u0907\u0921 \u0939\u093e\u0930\u094d\u092e\u094b\u0928 ( \u091c\u0948\u0938\u0947 \u0917\u094d\u0932\u0942\u0915\u093e\u0917\u0928 \u092f\u093e \u090f\u092a\u093f\u0928\u0947\u092b\u094d\u0930\u093f\u0928 ) \u0915\u094b\u0936\u093f\u0915\u093e \u091d\u093f\u0932\u094d\u0932\u0940 \u0915\u094b \u092a\u093e\u0930 \u0928\u0939\u0940\u0902 \u0915\u0930 \u0938\u0915\u0924\u0947 \u0939\u0948\u0902\u0964 \u0907\u0938\u0915\u0947 \u092c\u091c\u093e\u092f , \u0935\u0947 \u0938\u0924\u0939 \u0930\u093f\u0938\u0947\u092a\u094d\u091f\u0930\u094d\u0938 \u0938\u0947 \u091c\u0941\u0921\u093c\u0924\u0947 \u0939\u0948\u0902 \u0914\u0930 \" \u0926\u094d\u0935\u093f\u0924\u0940\u092f\u0915 \u0926\u0942\u0924\u094b\u0902 \" (secondary messengers) \u0915\u0947 \u092e\u093e\u0927\u094d\u092f\u092e \u0938\u0947 \u0915\u094b\u0936\u093f\u0915\u093e \u0915\u0947 \u0905\u0902\u0926\u0930 \u0905\u092a\u0928\u093e \u092a\u094d\u0930\u092d\u093e\u0935 \u0921\u093e\u0932\u0924\u0947 \u0939\u0948\u0902\u0964 \u092e\u093e\u0928\u0935 \u0936\u0930\u0940\u0930 \u0915\u094d\u0930\u093f\u092f\u093e \u0935\u093f\u091c\u094d\u091e\u093e\u0928 \u092e\u0947\u0902 \u0938\u092c\u0938\u0947 \u0906\u092e \u0926\u094d\u0935\u093f\u0924\u0940\u092f\u0915 \u0926\u0942\u0924 \u0915\u094c\u0928 \u0938\u093e \u0939\u0948 ?","options":["Cyclic AMP (cAMP)","ATP","Messenger RNA (mRNA)","Acetylcholine ( \u090f\u0938\u093f\u091f\u093e\u0907\u0932\u0915\u094b\u0932\u093e\u0907\u0928 )"],"answer":"1","solution":"Cyclic adenosine monophosphate (cAMP) is one of the most widely used secondary messengers in human cellular physiology. When a water-soluble peptide hormone binds to a cell-surface G-protein coupled receptor, it triggers the activation of an enzyme (adenylyl cyclase) that converts ATP into cAMP, which then activates specific intracellular pathways. Additional Info (a) cAMP rapidly activates protein kinases that alter cellular activity (like breaking down glycogen). (b) ATP is the primary energy currency of the cell and the biochemical precursor to cAMP, but it is not the messenger itself. (c) mRNA carries genetic transcription instructions from DNA to ribosomes for protein synthesis. (d) Acetylcholine is a primary neurotransmitter operating in the synaptic cleft, not an intracellular secondary messenger. Positive Mark: 0.8 Negative Mark: 0"},{"id":"84965","q":"84. Which of the following planets in our solar system is widely known as the \"Red Planet\" due to the iron oxide prevalent on its surface? \u0939\u092e\u093e\u0930\u0947 \u0938\u094c\u0930\u092e\u0902\u0921\u0932 \u0915\u0947 \u0928\u093f\u092e\u094d\u0928\u0932\u093f\u0916\u093f\u0924 \u092e\u0947\u0902 \u0938\u0947 \u0915\u093f\u0938 \u0917\u094d\u0930\u0939 \u0915\u094b \u0907\u0938\u0915\u0940 \u0938\u0924\u0939 \u092a\u0930 \u092e\u094c\u091c\u0942\u0926 \u0932\u094c\u0939 \u0911\u0915\u094d\u0938\u093e\u0907\u0921 \u0915\u0947 \u0915\u093e\u0930\u0923 \u0935\u094d\u092f\u093e\u092a\u0915 \u0930\u0942\u092a \u0938\u0947 \" \u0932\u093e\u0932 \u0917\u094d\u0930\u0939 \" (Red Planet) \u0915\u0947 \u0930\u0942\u092a \u092e\u0947\u0902 \u091c\u093e\u0928\u093e \u091c\u093e\u0924\u093e \u0939\u0948 ?","options":["Venus ( \u0936\u0941\u0915\u094d\u0930 )","Mars ( \u092e\u0902\u0917\u0932 )","Jupiter ( \u092c\u0943\u0939\u0938\u094d\u092a\u0924\u093f )","Saturn ( \u0936\u0928\u093f )"],"answer":"2","solution":"Mars is universally known as the \"Red Planet.\" The highly distinctive reddish-brown appearance of its surface is caused by the widespread presence of iron(III) oxide (commonly known as rust) in its regolith and atmospheric dust. Additional Info (a) Venus is shrouded in extremely thick, highly reflective clouds of sulfuric acid, making it the brightest planet in the night sky. (b) Mars features the largest volcano in the solar system, Olympus Mons, and a massive canyon system, Valles Marineris. (c) Jupiter is a colossal gas giant primarily known for its Great Red Spot, a massive persistent storm. (d) Saturn is a gas giant famous for its extensive and complex ring system made of ice and rock. Positive Mark: 0.8 Negative Mark: 0"},{"id":"84966","q":"85. The 2025 World Athletics Championships are scheduled to take place in: 2025 \u0935\u093f\u0936\u094d\u0935 \u090f\u0925\u0932\u0947\u091f\u093f\u0915\u094d\u0938 \u091a\u0948\u0902\u092a\u093f\u092f\u0928\u0936\u093f\u092a \u0915\u0939\u093e\u0901 \u0939\u094b\u0928\u0947 \u0935\u093e\u0932\u0940 \u0939\u0948 ?","options":["Tokyo, Japan ( \u091f\u094b\u0915\u094d\u092f\u094b , \u091c\u093e\u092a\u093e\u0928 )","Paris, France ( \u092a\u0947\u0930\u093f\u0938 , \u092b\u094d\u0930\u093e\u0902\u0938 )","Eugene, USA ( \u092f\u0942\u091c\u0940\u0928 , \u092f\u0942\u090f\u0938\u090f )","Budapest, Hungary ( \u092c\u0941\u0921\u093e\u092a\u0947\u0938\u094d\u091f , \u0939\u0902\u0917\u0930\u0940 )"],"answer":"1","solution":"The 2025 World Athletics Championships are scheduled to be held in Tokyo, Japan. The premier track and field events will take place at the Japan National Stadium, bringing the global championships back to the Asian continent. Additional Info (a) Tokyo previously hosted the delayed 2020 Summer Olympics at this exact same state-of-the-art venue. (b) Paris successfully hosted the 2024 Summer Olympic Games. (c) Eugene (Oregon) hosted the 2022 World Athletics Championships at Hayward Field. (d) Budapest, Hungary, hosted the 2023 World Athletics Championships. Positive Mark: 0.8 Negative Mark: 0"},{"id":"84967","q":"86. In IPv4 networking, a standard IP address is 32 bits long. This limits the theoretical maximum number of unique, public IPv4 addresses to approximately: IPv4 \u0928\u0947\u091f\u0935\u0930\u094d\u0915\u093f\u0902\u0917 \u092e\u0947\u0902 , \u090f\u0915 \u092e\u093e\u0928\u0915 IP \u092a\u0924\u093e 32 \u092c\u093f\u091f \u0932\u0902\u092c\u093e \u0939\u094b\u0924\u093e \u0939\u0948\u0964 \u092f\u0939 \u0905\u0926\u094d\u0935\u093f\u0924\u0940\u092f , \u0938\u093e\u0930\u094d\u0935\u091c\u0928\u093f\u0915 IPv4 \u092a\u0924\u094b\u0902 \u0915\u0940 \u0938\u0948\u0926\u094d\u0927\u093e\u0902\u0924\u093f\u0915 \u0905\u0927\u093f\u0915\u0924\u092e \u0938\u0902\u0916\u094d\u092f\u093e \u0915\u094b \u0932\u0917\u092d\u0917 \u0915\u093f\u0938 \u0924\u0915 \u0938\u0940\u092e\u093f\u0924 \u0915\u0930\u0924\u093e \u0939\u0948 ?","options":["4.3 Million","4.3 Billion","256 Million","128 Billion"],"answer":"2","solution":"A standard IPv4 address consists of 32 bits. The theoretical maximum number of mathematically unique addresses in a 32-bit space is , which calculates to exactly 4,294,967,296 (or approximately 4.3 billion addresses). Additional Info (a) 4.3 Million is mathematically far too low for a 32-bit address space. (b) The global exhaustion of this 4.3 billion address pool directly necessitated the development and ongoing deployment of IPv6 (which uses a massive 128-bit address space). (c) 256 is the number of possible values in just a single 8-bit octet of an IP address. (d) 128 Billion is an arbitrary distractor number. Positive Mark: 0.8 Negative Mark: 0"},{"id":"84968","q":"87. The 'Munger' division of Bihar holds immense historical significance and is specifically known for: \u092c\u093f\u0939\u093e\u0930 \u0915\u093e ' \u092e\u0941\u0902\u0917\u0947\u0930 ' \u092a\u094d\u0930\u092e\u0902\u0921\u0932 \u0905\u0924\u094d\u092f\u0927\u093f\u0915 \u0910\u0924\u093f\u0939\u093e\u0938\u093f\u0915 \u092e\u0939\u0924\u094d\u0935 \u0930\u0916\u0924\u093e \u0939\u0948 \u0914\u0930 \u0935\u093f\u0936\u0947\u0937 \u0930\u0942\u092a \u0938\u0947 \u0915\u093f\u0938\u0915\u0947 \u0932\u093f\u090f \u091c\u093e\u0928\u093e \u091c\u093e\u0924\u093e \u0939\u0948 ?","options":["Madhubani paintings and textile mills ( \u092e\u0927\u0941\u092c\u0928\u0940 \u092a\u0947\u0902\u091f\u093f\u0902\u0917 \u0914\u0930 \u0915\u092a\u0921\u093c\u093e \u092e\u093f\u0932\u0947\u0902 )","Ancient gun manufacturing facilities and global yoga centers ( \u092a\u094d\u0930\u093e\u091a\u0940\u0928 \u092c\u0902\u0926\u0942\u0915 \u0928\u093f\u0930\u094d\u092e\u093e\u0923 \u0938\u0941\u0935\u093f\u0927\u093e\u090f\u0902 \u0914\u0930 \u0935\u0948\u0936\u094d\u0935\u093f\u0915 \u092f\u094b\u0917 \u0915\u0947\u0902\u0926\u094d\u0930 )","Being the largest producer of Litchi in the state ( \u0930\u093e\u091c\u094d\u092f \u092e\u0947\u0902 \u0932\u0940\u091a\u0940 \u0915\u093e \u0938\u092c\u0938\u0947 \u092c\u0921\u093c\u093e \u0909\u0924\u094d\u092a\u093e\u0926\u0915 \u0939\u094b\u0928\u093e )","Extensive silk weaving and jute mills ( \u0935\u094d\u092f\u093e\u092a\u0915 \u0930\u0947\u0936\u092e \u092c\u0941\u0928\u093e\u0908 \u0914\u0930 \u091c\u0942\u091f \u092e\u093f\u0932\u0947\u0902 )"],"answer":"2","solution":"Munger district is historically famous for its firearms manufacturing, dating back to when Nawab Mir Qasim established a massive arsenal there in the 18th century to fight the British. In modern times, it is also globally renowned for the Bihar School of Yoga, an internationally recognized center for yogic studies. Additional Info (a) Madhubani paintings are deeply associated with the Mithila region (Madhubani and Darbhanga). (b) Munger perfectly blends this unique historical dichotomy of warfare (illegal and legal gunsmiths) and peace (yoga). (c) Muzaffarpur is the undisputed hub for Shahi Litchi cultivation. (d) Bhagalpur is known as the \"Silk City,\" while Purnia is the primary hub for jute. Positive Mark: 0.8 Negative Mark: 0"},{"id":"84969","q":"88. The most abundant gas in the Earth's atmosphere by volume is: \u0906\u092f\u0924\u0928 \u0915\u0947 \u0939\u093f\u0938\u093e\u092c \u0938\u0947 \u092a\u0943\u0925\u094d\u0935\u0940 \u0915\u0947 \u0935\u093e\u092f\u0941\u092e\u0902\u0921\u0932 \u092e\u0947\u0902 \u0938\u092c\u0938\u0947 \u092a\u094d\u0930\u091a\u0941\u0930 \u0917\u0948\u0938 \u0915\u094c\u0928 \u0938\u0940 \u0939\u0948 ?","options":["Oxygen ( \u0911\u0915\u094d\u0938\u0940\u091c\u0928 )","Carbon dioxide ( \u0915\u093e\u0930\u094d\u092c\u0928 \u0921\u093e\u0907\u0911\u0915\u094d\u0938\u093e\u0907\u0921 )","Nitrogen ( \u0928\u093e\u0907\u091f\u094d\u0930\u094b\u091c\u0928 )","Argon ( \u0906\u0930\u094d\u0917\u0928 )"],"answer":"3","solution":"Nitrogen ( ) is the most abundant gas in the Earth's atmosphere, constituting approximately 78.08% of its total volume. It is a relatively inert, stable gas that essentially acts as a diluent for the highly reactive oxygen. Additional Info (a) Oxygen ( ) is the second most abundant atmospheric gas, making up about 20.95%. (b) Carbon dioxide ( ) is a critical trace greenhouse gas, currently making up about 0.04%. (c) While Nitrogen is essential for all life (DNA and proteins), it must be \"fixed\" by specific bacteria or lightning before plants and animals can utilize it. (d) Argon is a noble gas and the third most abundant gas at roughly 0.93%. Positive Mark: 0.8 Negative Mark: 0"},{"id":"84970","q":"89. The 'NITI Aayog' replaced the Planning Commission as the apex public policy think tank in India. Who serves as the ex-officio Chairperson of NITI Aayog? ' \u0928\u0940\u0924\u093f \u0906\u092f\u094b\u0917 ' \u0928\u0947 \u092d\u093e\u0930\u0924 \u092e\u0947\u0902 \u0936\u0940\u0930\u094d\u0937 \u0938\u093e\u0930\u094d\u0935\u091c\u0928\u093f\u0915 \u0928\u0940\u0924\u093f \u0925\u093f\u0902\u0915 \u091f\u0948\u0902\u0915 \u0915\u0947 \u0930\u0942\u092a \u092e\u0947\u0902 \u092f\u094b\u091c\u0928\u093e \u0906\u092f\u094b\u0917 \u0915\u093e \u0938\u094d\u0925\u093e\u0928 \u0932\u093f\u092f\u093e\u0964 \u0928\u0940\u0924\u093f \u0906\u092f\u094b\u0917 \u0915\u0947 \u092a\u0926\u0947\u0928 \u0905\u0927\u094d\u092f\u0915\u094d\u0937 \u0915\u0947 \u0930\u0942\u092a \u092e\u0947\u0902 \u0915\u094c\u0928 \u0915\u093e\u0930\u094d\u092f \u0915\u0930\u0924\u093e \u0939\u0948 ?","options":["President of India ( \u092d\u093e\u0930\u0924 \u0915\u0947 \u0930\u093e\u0937\u094d\u091f\u094d\u0930\u092a\u0924\u093f )","Finance Minister ( \u0935\u093f\u0924\u094d\u0924 \u092e\u0902\u0924\u094d\u0930\u0940 )","Prime Minister of India ( \u092d\u093e\u0930\u0924 \u0915\u0947 \u092a\u094d\u0930\u0927\u093e\u0928 \u092e\u0902\u0924\u094d\u0930\u0940 )","Governor of the RBI (RBI \u0915\u0947 \u0917\u0935\u0930\u094d\u0928\u0930 )"],"answer":"3","solution":"The Prime Minister of India serves as the ex-officio Chairperson of the NITI Aayog (National Institution for Transforming India). This ensures that the apex policy think tank has direct alignment with the highest level of the executive government. Additional Info (a) The President is the ceremonial head of state and does not chair executive policy think tanks. (b) The Finance Minister is a key ex-officio member of the governing council, but not the Chairperson. (c) NITI Aayog was established on January 1, 2015, replacing the Soviet-style Planning Commission to foster cooperative federalism. (d) The RBI Governor manages the country's monetary policy independently of NITI Aayog. Positive Mark: 0.8 Negative Mark: 0"},{"id":"84971","q":"90. The \"Great Barrier Reef\", the world's largest and most biologically diverse coral reef system, is located off the coast of: \" \u0917\u094d\u0930\u0947\u091f \u092c\u0948\u0930\u093f\u092f\u0930 \u0930\u0940\u092b \", \u091c\u094b \u0926\u0941\u0928\u093f\u092f\u093e \u0915\u0940 \u0938\u092c\u0938\u0947 \u092c\u0921\u093c\u0940 \u0914\u0930 \u0938\u092c\u0938\u0947 \u0905\u0927\u093f\u0915 \u091c\u0948\u0935\u093f\u0915 \u0930\u0942\u092a \u0938\u0947 \u0935\u093f\u0935\u093f\u0927 \u092a\u094d\u0930\u0935\u093e\u0932 \u092d\u093f\u0924\u094d\u0924\u093f \u092a\u094d\u0930\u0923\u093e\u0932\u0940 \u0939\u0948 , \u0915\u093f\u0938\u0915\u0947 \u0924\u091f \u092a\u0930 \u0938\u094d\u0925\u093f\u0924 \u0939\u0948 ?","options":["Brazil ( \u092c\u094d\u0930\u093e\u091c\u093c\u0940\u0932 )","Indonesia ( \u0907\u0902\u0921\u094b\u0928\u0947\u0936\u093f\u092f\u093e )","Australia ( \u0911\u0938\u094d\u091f\u094d\u0930\u0947\u0932\u093f\u092f\u093e )","South Africa ( \u0926\u0915\u094d\u0937\u093f\u0923 \u0905\u092b\u094d\u0930\u0940\u0915\u093e )"],"answer":"3","solution":"The Great Barrier Reef is the world's most extensive and spectacular coral reef system, comprising over 2,900 individual reefs and 900 islands. It is located in the Coral Sea, off the coast of Queensland, Australia. Additional Info (a) Brazil contains the Amazon Reef, a deep sponge and rhodolith system, but not a massive shallow-water coral barrier. (b) Indonesia sits at the heart of the highly diverse Coral Triangle, but the single largest continuous reef system is in Australia. (c) The Great Barrier Reef is so massive that its entire structure can be seen from outer space and is a designated UNESCO World Heritage site. (d) South Africa has extensive coastal ecosystems and rich kelp forests, but no massive tropical barrier reefs. Positive Mark: 0.8 Negative Mark: 0"},{"id":"84972","q":"91. The ecological phenomenon 'Biomagnification' refers to the: ( \u092a\u093e\u0930\u093f\u0938\u094d\u0925\u093f\u0924\u093f\u0915 \u0918\u091f\u0928\u093e ' \u092c\u093e\u092f\u094b\u092e\u0948\u0917\u094d\u0928\u093f\u092b\u093f\u0915\u0947\u0936\u0928 ' (Biomagnification) \u0915\u093e \u0924\u093e\u0924\u094d\u092a\u0930\u094d\u092f \u0939\u0948 :)","options":["Rapid, localized growth of algae in a stagnant lake ( \u090f\u0915 \u0938\u094d\u0925\u093f\u0930 \u091d\u0940\u0932 \u092e\u0947\u0902 \u0936\u0948\u0935\u093e\u0932 \u0915\u0940 \u0924\u0940\u0935\u094d\u0930 , \u0938\u094d\u0925\u093e\u0928\u0940\u092f \u0935\u0943\u0926\u094d\u0927\u093f )","Accumulation and increasing concentration of toxic, non-biodegradable substances at successive trophic levels in a food chain ( \u0916\u093e\u0926\u094d\u092f \u0936\u094d\u0930\u0943\u0902\u0916\u0932\u093e \u092e\u0947\u0902 \u0915\u094d\u0930\u092e\u093f\u0915 \u092a\u094b\u0937\u0940 \u0938\u094d\u0924\u0930\u094b\u0902 \u092a\u0930 \u0935\u093f\u0937\u093e\u0915\u094d\u0924 , \u0917\u0948\u0930 - \u092c\u093e\u092f\u094b\u0921\u093f\u0917\u094d\u0930\u0947\u0921\u0947\u092c\u0932 \u092a\u0926\u093e\u0930\u094d\u0925\u094b\u0902 \u0915\u093e \u0938\u0902\u091a\u092f \u0914\u0930 \u092c\u0922\u093c\u0924\u0940 \u0938\u093e\u0902\u0926\u094d\u0930\u0924\u093e )","Natural breakdown of organic waste by soil bacteria ( \u092e\u093f\u091f\u094d\u091f\u0940 \u0915\u0947 \u091c\u0940\u0935\u093e\u0923\u0941\u0913\u0902 \u0926\u094d\u0935\u093e\u0930\u093e \u091c\u0948\u0935\u093f\u0915 \u0915\u091a\u0930\u0947 \u0915\u093e \u092a\u094d\u0930\u093e\u0915\u0943\u0924\u093f\u0915 \u091f\u0942\u091f\u0928\u093e )","Process of purifying heavy metals using aquatic plants ( \u091c\u0932\u0940\u092f \u092a\u094c\u0927\u094b\u0902 \u0915\u093e \u0909\u092a\u092f\u094b\u0917 \u0915\u0930\u0915\u0947 \u092d\u093e\u0930\u0940 \u0927\u093e\u0924\u0941\u0913\u0902 \u0915\u094b \u0936\u0941\u0926\u094d\u0927 \u0915\u0930\u0928\u0947 \u0915\u0940 \u092a\u094d\u0930\u0915\u094d\u0930\u093f\u092f\u093e )"],"answer":"2","solution":"Biomagnification (or bioamplification) is the biological process by which the concentration of toxic substances (such as heavy metals like mercury, or persistent organic pollutants like DDT) increases sequentially as they move up the ecological food chain, affecting apex predators the most severely. Additional Info (a) The rapid, nutrient-driven growth of algae is known as eutrophication. (b) Because these specific toxins are fat-soluble and cannot be easily broken down or excreted, they accumulate in the tissues of predators that consume many contaminated prey items. (c) The natural biological breakdown of organic waste is called decomposition. (d) Purifying water or soil using plants is known as phytoremediation. Positive Mark: 0.8 Negative Mark: 0"},{"id":"84973","q":"92. The 'Right to Education' was enshrined as a fundamental right in the Indian Constitution by which amendment? \u092d\u093e\u0930\u0924\u0940\u092f \u0938\u0902\u0935\u093f\u0927\u093e\u0928 \u092e\u0947\u0902 \u0915\u093f\u0938 \u0938\u0902\u0936\u094b\u0927\u0928 \u0926\u094d\u0935\u093e\u0930\u093e ' \u0936\u093f\u0915\u094d\u0937\u093e \u0915\u093e \u0905\u0927\u093f\u0915\u093e\u0930 ' (Right to Education) \u0915\u094b \u092e\u094c\u0932\u093f\u0915 \u0905\u0927\u093f\u0915\u093e\u0930 \u0915\u0947 \u0930\u0942\u092a \u092e\u0947\u0902 \u0936\u093e\u092e\u093f\u0932 \u0915\u093f\u092f\u093e \u0917\u092f\u093e \u0925\u093e ?","options":["44th Amendment (44 \u0935\u093e\u0902 \u0938\u0902\u0936\u094b\u0927\u0928 )","73rd Amendment (73 \u0935\u093e\u0902 \u0938\u0902\u0936\u094b\u0927\u0928 )","86th Amendment (86 \u0935\u093e\u0902 \u0938\u0902\u0936\u094b\u0927\u0928 )","92nd Amendment (92 \u0935\u093e\u0902 \u0938\u0902\u0936\u094b\u0927\u0928 )"],"answer":"3","solution":"The 86th Constitutional Amendment Act of 2002 inserted Article 21A into the Constitution. It definitively made free and compulsory education a fundamental right for all children in the age group of 6 to 14 years across the nation. Additional Info (a) The 44th Amendment (1978) removed the right to property as a fundamental right. (b) The 73rd Amendment (1992) provided constitutional status to Panchayati Raj Institutions. (c) This landmark amendment laid the constitutional groundwork for the eventual passing of the Right of Children to Free and Compulsory Education (RTE) Act of 2009. (d) The 92nd Amendment (2003) added the Bodo, Dogri, Maithili, and Santhali languages to the Eighth Schedule. Positive Mark: 0.8 Negative Mark: 0"},{"id":"84974","q":"93. In coordination chemistry, EDTA (Ethylenediaminetetraacetic acid) is widely used in complexometric titrations. It is classified as what type of ligand? \u0938\u092e\u0928\u094d\u0935\u092f \u0930\u0938\u093e\u092f\u0928 \u0935\u093f\u091c\u094d\u091e\u093e\u0928 (coordination chemistry) \u092e\u0947\u0902 , \u0915\u0949\u092e\u094d\u092a\u094d\u0932\u0947\u0915\u094d\u0938\u094b\u092e\u0947\u091f\u094d\u0930\u093f\u0915 \u0905\u0928\u0941\u092e\u093e\u092a\u0928 \u092e\u0947\u0902 EDTA \u0915\u093e \u0935\u094d\u092f\u093e\u092a\u0915 \u0930\u0942\u092a \u0938\u0947 \u0909\u092a\u092f\u094b\u0917 \u0915\u093f\u092f\u093e \u091c\u093e\u0924\u093e \u0939\u0948\u0964 \u0907\u0938\u0947 \u0915\u093f\u0938 \u092a\u094d\u0930\u0915\u093e\u0930 \u0915\u0947 \u0932\u093f\u0917\u0948\u0902\u0921 \u0915\u0947 \u0930\u0942\u092a \u092e\u0947\u0902 \u0935\u0930\u094d\u0917\u0940\u0915\u0943\u0924 \u0915\u093f\u092f\u093e \u0917\u092f\u093e \u0939\u0948 ?","options":["Monodentate ( \u090f\u0915\u0926\u0902\u0924\u0941\u0930 )","Bidentate ( \u0926\u094d\u0935\u093f\u0926\u0902\u0924\u0941\u0930 )","Tetradentate ( \u091a\u0924\u0941\u0930\u094d\u0926\u0902\u0924\u0941\u0930 )","Hexadentate ( \u0937\u091f\u0926\u0902\u0924\u0941\u0930 )"],"answer":"4","solution":"EDTA is a classic hexadentate ligand. It has exactly six potential binding sites (two nitrogen atoms and four oxygen atoms from its carboxylate groups) that can simultaneously donate electron pairs to a central metal ion, forming a highly stable, cage-like chelate complex. Additional Info (a) A monodentate ligand (like water or ammonia) binds through only one single donor atom. (b) A bidentate ligand (like ethylenediamine) binds through two donor atoms. (c) A tetradentate ligand binds through four atoms (like certain porphyrins). (d) EDTA's hexadentate nature makes it an excellent chemical agent for treating heavy metal poisoning (chelation therapy) and water softening. Positive Mark: 0.8 Negative Mark: 0"},{"id":"84975","q":"94. In cellular respiration, the Krebs cycle (Citric Acid cycle) takes place specifically in the: \u0915\u094b\u0936\u093f\u0915\u0940\u092f \u0936\u094d\u0935\u0938\u0928 \u092e\u0947\u0902 , \u0915\u094d\u0930\u0947\u092c\u094d\u0938 \u091a\u0915\u094d\u0930 ( \u0938\u093e\u0907\u091f\u094d\u0930\u093f\u0915 \u090f\u0938\u093f\u0921 \u091a\u0915\u094d\u0930 ) \u0935\u093f\u0936\u0947\u0937 \u0930\u0942\u092a \u0938\u0947 \u0915\u0939\u093e\u0901 \u0939\u094b\u0924\u093e \u0939\u0948 ?","options":["Cytoplasm ( \u0915\u094b\u0936\u093f\u0915\u093e \u0926\u094d\u0930\u0935\u094d\u092f )","Mitochondrial matrix ( \u092e\u093e\u0907\u091f\u094b\u0915\u0949\u0928\u094d\u0921\u094d\u0930\u093f\u092f\u0932 \u092e\u0948\u091f\u094d\u0930\u093f\u0915\u094d\u0938 )","Inner mitochondrial membrane ( \u0906\u0902\u0924\u0930\u093f\u0915 \u092e\u093e\u0907\u091f\u094b\u0915\u0949\u0928\u094d\u0921\u094d\u0930\u093f\u092f\u0932 \u091d\u093f\u0932\u094d\u0932\u0940 )","Endoplasmic reticulum ( \u090f\u0902\u0921\u094b\u092a\u094d\u0932\u093e\u091c\u094d\u092e\u093f\u0915 \u0930\u0947\u091f\u093f\u0915\u0941\u0932\u092e )"],"answer":"2","solution":"In eukaryotic cells, the Krebs cycle (also known as the Citric Acid Cycle or TCA cycle) occurs exclusively within the mitochondrial matrix. It is a critical series of chemical reactions that generate energy intermediates through the oxidation of acetyl-CoA derived from carbohydrates, fats, and proteins. Additional Info (a) Glycolysis (the initial, anaerobic step of cellular respiration) takes place in the cytoplasm. (b) The fluid-filled mitochondrial matrix contains all the specific soluble enzymes required for the Krebs cycle reactions. (c) The Electron Transport Chain (ETC), which generates the bulk of ATP, is located on the folded inner mitochondrial membrane. (d) The Endoplasmic reticulum is involved in protein folding and lipid synthesis. Positive Mark: 0.8 Negative Mark: 0"},{"id":"84976","q":"95. In early 2025, which Indian classical dance form was globally recognized after achieving a Guinness World Record for the largest synchronized performance at the Khajuraho Dance Festival? (Based on 2024/2025 records) 2025 \u0915\u0940 \u0936\u0941\u0930\u0941\u0906\u0924 \u092e\u0947\u0902 , \u0916\u091c\u0941\u0930\u093e\u0939\u094b \u0928\u0943\u0924\u094d\u092f \u092e\u0939\u094b\u0924\u094d\u0938\u0935 \u092e\u0947\u0902 \u0938\u092c\u0938\u0947 \u092c\u0921\u093c\u0947 \u0938\u093f\u0902\u0915\u094d\u0930\u094b\u0928\u093e\u0907\u091c\u093c\u094d\u0921 \u092a\u094d\u0930\u0926\u0930\u094d\u0936\u0928 \u0915\u0947 \u0932\u093f\u090f \u0917\u093f\u0928\u0940\u091c \u0935\u0930\u094d\u0932\u094d\u0921 \u0930\u093f\u0915\u0949\u0930\u094d\u0921 \u0939\u093e\u0938\u093f\u0932 \u0915\u0930\u0928\u0947 \u0915\u0947 \u092c\u093e\u0926 \u0915\u093f\u0938 \u092d\u093e\u0930\u0924\u0940\u092f \u0936\u093e\u0938\u094d\u0924\u094d\u0930\u0940\u092f \u0928\u0943\u0924\u094d\u092f \u0936\u0948\u0932\u0940 \u0915\u094b \u0935\u093f\u0936\u094d\u0935 \u0938\u094d\u0924\u0930 \u092a\u0930 \u092e\u093e\u0928\u094d\u092f\u0924\u093e \u092e\u093f\u0932\u0940 ?","options":["Kathak ( \u0915\u0925\u0915 )","Odissi ( \u0913\u0921\u093f\u0938\u0940 )","Bharatanatyam ( \u092d\u0930\u0924\u0928\u093e\u091f\u094d\u092f\u092e )","Manipuri ( \u092e\u0923\u093f\u092a\u0941\u0930\u0940 )"],"answer":"1","solution":"During the milestone 50th Khajuraho Dance Festival in Madhya Pradesh, Kathak achieved a Guinness World Record when 1,484 dancers performed the \"Kumbh of Kathak\" in a massive synchronized rhythm against the stunning backdrop of the ancient UNESCO-listed temples. Additional Info (a) Kathak is a major classical dance form from Northern India, distinguished by its incredibly fast footwork (tatkar) and rapid spins (chakkars). (b) Odissi originates from the eastern coastal state of Odisha. (c) Bharatanatyam originates from the southern state of Tamil Nadu. (d) Manipuri originates from the northeastern state of Manipur. Positive Mark: 0.8 Negative Mark: 0"},{"id":"84977","q":"96. In Operating Systems, the concept of \"Virtual Memory\" allows a computer to: \u0911\u092a\u0930\u0947\u091f\u093f\u0902\u0917 \u0938\u093f\u0938\u094d\u091f\u092e \u092e\u0947\u0902 , \" \u0935\u0930\u094d\u091a\u0941\u0905\u0932 \u092e\u0947\u092e\u094b\u0930\u0940 \" \u0915\u0940 \u0905\u0935\u0927\u093e\u0930\u0923\u093e \u0915\u0902\u092a\u094d\u092f\u0942\u091f\u0930 \u0915\u094b \u0905\u0928\u0941\u092e\u0924\u093f \u0926\u0947\u0924\u0940 \u0939\u0948 :","options":["Run an operating system within another operating system ( \u090f\u0915 \u0911\u092a\u0930\u0947\u091f\u093f\u0902\u0917 \u0938\u093f\u0938\u094d\u091f\u092e \u0915\u0947 \u092d\u0940\u0924\u0930 \u0926\u0942\u0938\u0930\u093e \u0911\u092a\u0930\u0947\u091f\u093f\u0902\u0917 \u0938\u093f\u0938\u094d\u091f\u092e \u091a\u0932\u093e\u0928\u0947 \u0915\u0940 )","Use a portion of the hard drive (disk space) to simulate additional RAM, allowing larger programs to execute ( \u0905\u0924\u093f\u0930\u093f\u0915\u094d\u0924 \u0930\u0948\u092e \u0915\u093e \u0905\u0928\u0941\u0915\u0930\u0923 \u0915\u0930\u0928\u0947 \u0915\u0947 \u0932\u093f\u090f \u0939\u093e\u0930\u094d\u0921 \u0921\u094d\u0930\u093e\u0907\u0935 ( \u0921\u093f\u0938\u094d\u0915 \u0938\u094d\u092a\u0947\u0938 ) \u0915\u0947 \u090f\u0915 \u0939\u093f\u0938\u094d\u0938\u0947 \u0915\u093e \u0909\u092a\u092f\u094b\u0917 \u0915\u0930\u0928\u0947 \u0915\u0940 , \u091c\u093f\u0938\u0938\u0947 \u092c\u0921\u093c\u0947 \u092a\u094d\u0930\u094b\u0917\u094d\u0930\u093e\u092e \u0928\u093f\u0937\u094d\u092a\u093e\u0926\u093f\u0924 \u0939\u094b \u0938\u0915\u0947\u0902 )","Compress files to save space on the physical disk ( \u092d\u094c\u0924\u093f\u0915 \u0921\u093f\u0938\u094d\u0915 \u092a\u0930 \u0938\u094d\u0925\u093e\u0928 \u092c\u091a\u093e\u0928\u0947 \u0915\u0947 \u0932\u093f\u090f \u092b\u093c\u093e\u0907\u0932\u094b\u0902 \u0915\u094b \u0938\u0902\u092a\u0940\u0921\u093c\u093f\u0924 \u0915\u0930\u0928\u0947 \u0915\u0940 )","Store data securely on remote cloud servers ( \u0921\u0947\u091f\u093e \u0915\u094b \u0938\u0941\u0930\u0915\u094d\u0937\u093f\u0924 \u0930\u0942\u092a \u0938\u0947 \u0930\u093f\u092e\u094b\u091f \u0915\u094d\u0932\u093e\u0909\u0921 \u0938\u0930\u094d\u0935\u0930 \u092a\u0930 \u0938\u0902\u0917\u094d\u0930\u0939\u0940\u0924 \u0915\u0930\u0928\u0947 \u0915\u0940 )"],"answer":"2","solution":"Virtual memory is a sophisticated memory management capability of an operating system that uses hardware and software to allow a computer to compensate for physical memory shortages. It does this by temporarily transferring inactive data from Random Access Memory (RAM) to disk storage. Additional Info (a) Running an OS inside another OS is handled by Virtual Machines (VMs) or hypervisors. (b) This process creates a \"page file\" or \"swap space\" on the hard drive, keeping the system running when RAM is full, albeit at slower disk-read speeds. (c) Compressing files is a storage utility function, not a memory management feature. (d) Storing data on remote servers is the definition of Cloud Computing. Positive Mark: 0.8 Negative Mark: 0"},{"id":"84978","q":"97. The 'Sonpur Cattle Fair', considered one of Asia's largest animal fairs, is traditionally held at the confluence of the Ganga and which river? \u090f\u0936\u093f\u092f\u093e \u0915\u0947 \u0938\u092c\u0938\u0947 \u092c\u0921\u093c\u0947 \u092a\u0936\u0941 \u092e\u0947\u0932\u094b\u0902 \u092e\u0947\u0902 \u0938\u0947 \u090f\u0915 \u092e\u093e\u0928\u093e \u091c\u093e\u0928\u0947 \u0935\u093e\u0932\u093e ' \u0938\u094b\u0928\u092a\u0941\u0930 \u092a\u0936\u0941 \u092e\u0947\u0932\u093e ' \u092a\u093e\u0930\u0902\u092a\u0930\u093f\u0915 \u0930\u0942\u092a \u0938\u0947 \u0917\u0902\u0917\u093e \u0914\u0930 \u0915\u093f\u0938 \u0928\u0926\u0940 \u0915\u0947 \u0938\u0902\u0917\u092e \u092a\u0930 \u0906\u092f\u094b\u091c\u093f\u0924 \u0915\u093f\u092f\u093e \u091c\u093e\u0924\u093e \u0939\u0948 ?","options":["Kosi ( \u0915\u094b\u0938\u0940 )","Gandak ( \u0917\u0902\u0921\u0915 )","Bagmati ( \u092c\u093e\u0917\u092e\u0924\u0940 )","Punpun ( \u092a\u0941\u0928\u092a\u0941\u0928 )"],"answer":"2","solution":"The historic Sonpur Cattle Fair (also known as Harihar Kshetra Mela) is held annually in Sonpur, Bihar, at the sacred confluence of the river Ganga and the river Gandak. The fair traditionally commences on the auspicious day of Kartik Poornima. Additional Info (a) The Kosi river meets the Ganga much further east, near Katihar. (b) Historically, the fair attracted prominent traders from all over Central Asia to buy and sell elephants, horses, and cattle. (c) The Bagmati flows into the Kosi river. (d) The Punpun is a right-bank tributary that joins the Ganga near Patna. Positive Mark: 0.8 Negative Mark: 0"},{"id":"84979","q":"98. The highest peak in the Western Ghats mountain range is: ( \u092a\u0936\u094d\u091a\u093f\u092e\u0940 \u0918\u093e\u091f \u092a\u0930\u094d\u0935\u0924 \u0936\u094d\u0930\u0943\u0902\u0916\u0932\u093e \u0915\u0940 \u0938\u092c\u0938\u0947 \u090a\u0901\u091a\u0940 \u091a\u094b\u091f\u0940 \u0915\u094c\u0928 \u0938\u0940 \u0939\u0948 ?)","options":["Anamudi ( \u0905\u0928\u093e\u092e\u0941\u0921\u0940 )","Doda Betta ( \u0921\u094b\u0921\u094d\u0921\u093e\u092c\u0947\u091f\u094d\u091f\u093e )","Guru Shikhar ( \u0917\u0941\u0930\u0941 \u0936\u093f\u0916\u0930 )","Mahendragiri ( \u092e\u0939\u0947\u0902\u0926\u094d\u0930\u0917\u093f\u0930\u093f )"],"answer":"1","solution":"Anamudi, located within the Eravikulam National Park in the state of Kerala, is the highest peak in the Western Ghats and the highest point in all of South India, standing at an impressive elevation of 2,695 meters (8,842 ft). Additional Info (a) Because of its height and topographic prominence, it is often affectionately called the \"Everest of South India.\" (b) Doda Betta is the highest peak in the Nilgiri Mountains of Tamil Nadu. (c) Guru Shikhar is the highest peak in the Aravalli Range of Rajasthan. (d) Mahendragiri is a prominent peak in the Eastern Ghats located in Odisha. Positive Mark: 0.8 Negative Mark: 0"},{"id":"84980","q":"99. The 'Basel Convention' is an international treaty strictly designed to: ' \u092c\u0947\u0938\u0932 \u0915\u0928\u094d\u0935\u0947\u0902\u0936\u0928 ' \u090f\u0915 \u0905\u0902\u0924\u0930\u0930\u093e\u0937\u094d\u091f\u094d\u0930\u0940\u092f \u0938\u0902\u0927\u093f \u0939\u0948 \u091c\u093f\u0938\u0947 \u0915\u0921\u093c\u093e\u0908 \u0938\u0947 \u0915\u093f\u0938\u0932\u093f\u090f \u0921\u093f\u091c\u093c\u093e\u0907\u0928 \u0915\u093f\u092f\u093e \u0917\u092f\u093e \u0939\u0948 :","options":["Protect endangered marine species in international waters ( \u0905\u0902\u0924\u0930\u0930\u093e\u0937\u094d\u091f\u094d\u0930\u0940\u092f \u091c\u0932 \u092e\u0947\u0902 \u0932\u0941\u092a\u094d\u0924\u092a\u094d\u0930\u093e\u092f \u0938\u092e\u0941\u0926\u094d\u0930\u0940 \u092a\u094d\u0930\u091c\u093e\u0924\u093f\u092f\u094b\u0902 \u0915\u0940 \u0930\u0915\u094d\u0937\u093e \u0915\u0947 \u0932\u093f\u090f )","Control the transboundary movement of hazardous wastes and their disposal, particularly from developed to developing countries ( \u0916\u0924\u0930\u0928\u093e\u0915 \u0915\u091a\u0930\u0947 \u0915\u0947 \u0938\u0940\u092e\u093e \u092a\u093e\u0930 \u0938\u0902\u091a\u0932\u0928 \u0914\u0930 \u0909\u0928\u0915\u0947 \u0928\u093f\u092a\u091f\u093e\u0928 \u0915\u094b \u0928\u093f\u092f\u0902\u0924\u094d\u0930\u093f\u0924 \u0915\u0930\u0928\u0947 \u0915\u0947 \u0932\u093f\u090f , \u0935\u093f\u0936\u0947\u0937 \u0930\u0942\u092a \u0938\u0947 \u0935\u093f\u0915\u0938\u093f\u0924 \u0938\u0947 \u0935\u093f\u0915\u093e\u0938\u0936\u0940\u0932 \u0926\u0947\u0936\u094b\u0902 \u092e\u0947\u0902 )","Regulate international intellectual property rights regarding green technology ( \u0939\u0930\u093f\u0924 \u092a\u094d\u0930\u094c\u0926\u094d\u092f\u094b\u0917\u093f\u0915\u0940 \u0915\u0947 \u0938\u0902\u092c\u0902\u0927 \u092e\u0947\u0902 \u0905\u0902\u0924\u0930\u094d\u0930\u093e\u0937\u094d\u091f\u094d\u0930\u0940\u092f \u092c\u094c\u0926\u094d\u0927\u093f\u0915 \u0938\u0902\u092a\u0926\u093e \u0905\u0927\u093f\u0915\u093e\u0930\u094b\u0902 \u0915\u094b \u0935\u093f\u0928\u093f\u092f\u092e\u093f\u0924 \u0915\u0930\u0928\u0947 \u0915\u0947 \u0932\u093f\u090f )","Promote global free trade in recyclable materials ( \u092a\u0941\u0928\u0930\u094d\u091a\u0915\u094d\u0930\u0923 \u092f\u094b\u0917\u094d\u092f \u0938\u093e\u092e\u0917\u094d\u0930\u0940 \u092e\u0947\u0902 \u0935\u0948\u0936\u094d\u0935\u093f\u0915 \u092e\u0941\u0915\u094d\u0924 \u0935\u094d\u092f\u093e\u092a\u093e\u0930 \u0915\u094b \u092c\u0922\u093c\u093e\u0935\u093e \u0926\u0947\u0928\u0947 \u0915\u0947 \u0932\u093f\u090f )"],"answer":"2","solution":"The Basel Convention on the Control of Transboundary Movements of Hazardous Wastes and Their Disposal was specifically designed to reduce the international movement of hazardous waste between nations, primarily to prevent the predatory transfer of toxic e-waste and chemicals from developed nations to less developed countries (LDCs). Additional Info (a) Marine species protection is handled under distinct treaties like UNCLOS. (b) The treaty was rapidly adopted in 1989 following several high-profile scandals involving illegal toxic waste dumping in Africa. (c) Intellectual property is globally regulated by WIPO. (d) The convention restricts and controls the trade in toxic materials rather than promoting general free trade. Positive Mark: 0.8 Negative Mark: 0"},{"id":"84981","q":"100. In organic chemistry, the (Bimolecular Nucleophilic Substitution) reaction mechanism proceeds via a single transition state. A key stereochemical outcome of an reaction at a chiral center is: \u0915\u093e\u0930\u094d\u092c\u0928\u093f\u0915 \u0930\u0938\u093e\u092f\u0928 \u0935\u093f\u091c\u094d\u091e\u093e\u0928 \u092e\u0947\u0902 , SN2 \u092a\u094d\u0930\u0924\u093f\u0915\u094d\u0930\u093f\u092f\u093e \u0924\u0902\u0924\u094d\u0930 \u090f\u0915 \u090f\u0915\u0932 \u0938\u0902\u0915\u094d\u0930\u092e\u0923 \u0905\u0935\u0938\u094d\u0925\u093e \u0915\u0947 \u092e\u093e\u0927\u094d\u092f\u092e \u0938\u0947 \u0906\u0917\u0947 \u092c\u0922\u093c\u0924\u093e \u0939\u0948\u0964 \u090f\u0915 \u091a\u093f\u0930\u093e\u0932 \u0915\u0947\u0902\u0926\u094d\u0930 \u092a\u0930 SN2 \u092a\u094d\u0930\u0924\u093f\u0915\u094d\u0930\u093f\u092f\u093e \u0915\u093e \u090f\u0915 \u092a\u094d\u0930\u092e\u0941\u0916 \u0938\u094d\u091f\u0940\u0930\u093f\u092f\u094b\u0915\u0947\u092e\u093f\u0915\u0932 \u092a\u0930\u093f\u0923\u093e\u092e \u0915\u094d\u092f\u093e \u0939\u0948 ?","options":["Retention of configuration ( \u0935\u093f\u0928\u094d\u092f\u093e\u0938 \u0915\u093e \u092a\u094d\u0930\u0924\u093f\u0927\u093e\u0930\u0923 )","Complete racemization ( \u092a\u0942\u0930\u094d\u0923 \u0930\u0947\u0938\u092e\u093e\u0907\u091c\u0947\u0936\u0928 )","Inversion of configuration (Walden inversion) ( \u0935\u093f\u0928\u094d\u092f\u093e\u0938 \u0915\u093e \u0909\u0932\u091f\u093e\u0935 )","Formation of a carbocation intermediate ( \u0915\u093e\u0930\u094d\u092c\u094b\u0915\u0947\u0936\u0928 \u092e\u0927\u094d\u092f\u0935\u0930\u094d\u0924\u0940 \u0915\u093e \u0928\u093f\u0930\u094d\u092e\u093e\u0923 )"],"answer":"3","solution":"An reaction is a concerted, one-step mechanism where the incoming nucleophile attacks the electrophilic carbon from the side exactly opposite to the leaving group. If the target carbon is a chiral center, this \"backside attack\" forces the other bonds to flip, resulting in a complete inversion of stereochemical configuration, known as a Walden inversion. Additional Info (a) Retention of configuration occurs in specific internal substitution ( ) reactions. (b) Complete racemization is the typical stereochemical outcome of an reaction where the nucleophile can attack from either side. (c) The classic visual analogy for a Walden inversion is an umbrella blowing completely inside out in a strong gust of wind. (d) The formation of a carbocation intermediate is the hallmark of the two-step mechanism. Positive Mark: 0.8 Negative Mark: 0"},{"id":"84982","q":"101. In the Indian Parliamentary system, the \"Zero Hour\" refers to the specific time: ( \u092d\u093e\u0930\u0924\u0940\u092f \u0938\u0902\u0938\u0926\u0940\u092f \u092a\u094d\u0930\u0923\u093e\u0932\u0940 \u092e\u0947\u0902 , \" \u0936\u0942\u0928\u094d\u092f \u0915\u093e\u0932 \" (Zero Hour) \u0915\u093f\u0938 \u0935\u093f\u0936\u093f\u0937\u094d\u091f \u0938\u092e\u092f \u0915\u094b \u0938\u0902\u0926\u0930\u094d\u092d\u093f\u0924 \u0915\u0930\u0924\u093e \u0939\u0948 :)","options":["When no legislative business can be legally conducted ( \u091c\u092c \u0915\u094b\u0908 \u0935\u093f\u0927\u093e\u092f\u0940 \u0915\u093e\u0930\u094d\u092f \u0915\u093e\u0928\u0942\u0928\u0940 \u0930\u0942\u092a \u0938\u0947 \u0928\u0939\u0940\u0902 \u0915\u093f\u092f\u093e \u091c\u093e \u0938\u0915\u0924\u093e \u0939\u0948 )","Strictly reserved for voting on the union budget ( \u0915\u0947\u0902\u0926\u094d\u0930\u0940\u092f \u092c\u091c\u091f \u092a\u0930 \u092e\u0924\u0926\u093e\u0928 \u0915\u0947 \u0932\u093f\u090f \u0915\u0921\u093c\u093e\u0908 \u0938\u0947 \u0906\u0930\u0915\u094d\u0937\u093f\u0924 )","Immediately following the Question Hour when members can raise matters of urgent public importance without prior notice ( \u092a\u094d\u0930\u0936\u094d\u0928\u0915\u093e\u0932 \u0915\u0947 \u0920\u0940\u0915 \u092c\u093e\u0926 \u091c\u092c \u0938\u0926\u0938\u094d\u092f \u092c\u093f\u0928\u093e \u092a\u0942\u0930\u094d\u0935 \u0938\u0942\u091a\u0928\u093e \u0915\u0947 \u0924\u0924\u094d\u0915\u093e\u0932 \u0938\u093e\u0930\u094d\u0935\u091c\u0928\u093f\u0915 \u092e\u0939\u0924\u094d\u0935 \u0915\u0947 \u092e\u093e\u092e\u0932\u0947 \u0909\u0920\u093e \u0938\u0915\u0924\u0947 \u0939\u0948\u0902 )","When the Prime Minister officially addresses the nation ( \u091c\u092c \u092a\u094d\u0930\u0927\u093e\u0928 \u092e\u0902\u0924\u094d\u0930\u0940 \u0906\u0927\u093f\u0915\u093e\u0930\u093f\u0915 \u0924\u094c\u0930 \u092a\u0930 \u0930\u093e\u0937\u094d\u091f\u094d\u0930 \u0915\u094b \u0938\u0902\u092c\u094b\u0927\u093f\u0924 \u0915\u0930\u0924\u0947 \u0939\u0948\u0902 )"],"answer":"3","solution":"Zero Hour is an Indian parliamentary innovation that starts immediately after the Question Hour (usually around 12:00 noon). During this time, Members of Parliament can raise matters of urgent public importance without giving the standard 10 days' prior notice. Additional Info (a) It is highly active and can be chaotic as many unscheduled issues are raised. (b) Voting on the budget follows a strict, pre-scheduled timetable."},{"id":"84983","q":"102. A government's 'Fiscal Deficit' is accurately represented by the: \u0915\u093f\u0938\u0940 \u0938\u0930\u0915\u093e\u0930 \u0915\u0947 ' \u0930\u093e\u091c\u0915\u094b\u0937\u0940\u092f \u0918\u093e\u091f\u0947 ' (Fiscal Deficit) \u0915\u093e \u0938\u091f\u0940\u0915 \u092a\u094d\u0930\u0924\u093f\u0928\u093f\u0927\u093f\u0924\u094d\u0935 \u0915\u093f\u0938\u0915\u0947 \u0926\u094d\u0935\u093e\u0930\u093e \u0915\u093f\u092f\u093e \u091c\u093e\u0924\u093e \u0939\u0948 ?","options":["Total tax revenue collected minus welfare expenditures ( \u090f\u0915\u0924\u094d\u0930\u093f\u0924 \u0915\u0941\u0932 \u0915\u0930 \u0930\u093e\u091c\u0938\u094d\u0935 \u092e\u0947\u0902 \u0938\u0947 \u0915\u0932\u094d\u092f\u093e\u0923\u0915\u093e\u0930\u0940 \u0935\u094d\u092f\u092f \u0918\u091f\u093e\u0928\u093e )","Difference between the government's total expenditure and its total receipts (excluding borrowings) ( \u0938\u0930\u0915\u093e\u0930 \u0915\u0947 \u0915\u0941\u0932 \u0935\u094d\u092f\u092f \u0914\u0930 \u0909\u0938\u0915\u0940 \u0915\u0941\u0932 \u092a\u094d\u0930\u093e\u092a\u094d\u0924\u093f\u092f\u094b\u0902 ( \u0909\u0927\u093e\u0930 \u0915\u094b \u091b\u094b\u0921\u093c\u0915\u0930 ) \u0915\u0947 \u092c\u0940\u091a \u0915\u093e \u0905\u0902\u0924\u0930 )","Total debt of the country owed to foreign multilateral institutions ( \u0935\u093f\u0926\u0947\u0936\u0940 \u092c\u0939\u0941\u092a\u0915\u094d\u0937\u0940\u092f \u0938\u0902\u0938\u094d\u0925\u093e\u0928\u094b\u0902 \u092a\u0930 \u0926\u0947\u0936 \u0915\u093e \u0915\u0941\u0932 \u0915\u0930\u094d\u091c )","Difference between physical exports and imports over a fiscal year ( \u090f\u0915 \u0935\u093f\u0924\u094d\u0924\u0940\u092f \u0935\u0930\u094d\u0937 \u092e\u0947\u0902 \u092d\u094c\u0924\u093f\u0915 \u0928\u093f\u0930\u094d\u092f\u093e\u0924 \u0914\u0930 \u0906\u092f\u093e\u0924 \u0915\u0947 \u092c\u0940\u091a \u0915\u093e \u0905\u0902\u0924\u0930 )"],"answer":"2","solution":"A Fiscal Deficit occurs when a government's total expenditures exceed the revenue that it generates, excluding money from borrowings. It essentially indicates the total borrowing requirements of the government to bridge the gap. Additional Info (a) Tax revenue minus expenditures is a simplified budget deficit but ignores non-tax revenues. (b) A high fiscal deficit can lead to inflation and push up interest rates (crowding out private investment). (c) Total debt owed to foreign entities is the external debt. (d) The difference between physical exports and imports is the Trade Deficit. Positive Mark: 0.8 Negative Mark: 0"},{"id":"84984","q":"103. According to Faraday's First Law of Electrolysis, the mass of a substance deposited or liberated at an electrode is directly proportional to the: \u092b\u0948\u0930\u093e\u0921\u0947 \u0915\u0947 \u0907\u0932\u0947\u0915\u094d\u091f\u094d\u0930\u094b\u0932\u093f\u0938\u093f\u0938 \u0915\u0947 \u092a\u0939\u0932\u0947 \u0928\u093f\u092f\u092e \u0915\u0947 \u0905\u0928\u0941\u0938\u093e\u0930 , \u0907\u0932\u0947\u0915\u094d\u091f\u094d\u0930\u094b\u0921 \u092a\u0930 \u091c\u092e\u093e \u092f\u093e \u092e\u0941\u0915\u094d\u0924 \u0939\u094b\u0928\u0947 \u0935\u093e\u0932\u0947 \u092a\u0926\u093e\u0930\u094d\u0925 \u0915\u093e \u0926\u094d\u0930\u0935\u094d\u092f\u092e\u093e\u0928 \u0915\u093f\u0938\u0915\u0947 \u0938\u0940\u0927\u0947 \u0906\u0928\u0941\u092a\u093e\u0924\u093f\u0915 \u0939\u094b\u0924\u093e \u0939\u0948 ?","options":["Concentration of the electrolyte solution ( \u0907\u0932\u0947\u0915\u094d\u091f\u094d\u0930\u094b\u0932\u093e\u0907\u091f \u0938\u092e\u093e\u0927\u093e\u0928 \u0915\u0940 \u0938\u093e\u0902\u0926\u094d\u0930\u0924\u093e )","Temperature of the electrolytic bath ( \u0907\u0932\u0947\u0915\u094d\u091f\u094d\u0930\u094b\u0932\u093e\u0907\u091f\u093f\u0915 \u0938\u094d\u0928\u093e\u0928 \u0915\u093e \u0924\u093e\u092a\u092e\u093e\u0928 )","Quantity of electricity (charge) passed through the electrolyte ( \u0907\u0932\u0947\u0915\u094d\u091f\u094d\u0930\u094b\u0932\u093e\u0907\u091f \u0938\u0947 \u0917\u0941\u091c\u0930\u0928\u0947 \u0935\u093e\u0932\u0940 \u092c\u093f\u091c\u0932\u0940 ( \u091a\u093e\u0930\u094d\u091c ) \u0915\u0940 \u092e\u093e\u0924\u094d\u0930\u093e )","Surface area of the electrode ( \u0907\u0932\u0947\u0915\u094d\u091f\u094d\u0930\u094b\u0921 \u0915\u093e \u0938\u0924\u0939 \u0915\u094d\u0937\u0947\u0924\u094d\u0930 )"],"answer":"3","solution":"Faraday's First Law of Electrolysis states that the mass of any substance deposited or liberated at an electrode during electrolysis is directly proportional to the quantity of electricity (total electrical charge, measured in coulombs) passed through the electrolyte ( ). Additional Info (a) Concentration affects reaction kinetics but not the strict Faraday mass-charge relationship. (b) Temperature affects conductivity but not the mass-to-charge ratio. (c) Mathematically, it is expressed as , where Z is the electrochemical equivalent. (d) Surface area affects current density but not the total mass deposited per unit of total charge. Positive Mark: 0.8 Negative Mark: 0"},{"id":"84985","q":"104. Which international organization is responsible for compiling and publishing the 'Human Development Index' (HDI)? \u0915\u094c\u0928 \u0938\u093e \u0905\u0902\u0924\u0930\u094d\u0930\u093e\u0937\u094d\u091f\u094d\u0930\u0940\u092f \u0938\u0902\u0917\u0920\u0928 ' \u092e\u093e\u0928\u0935 \u0935\u093f\u0915\u093e\u0938 \u0938\u0942\u091a\u0915\u093e\u0902\u0915 ' (HDI) \u0915\u094b \u0938\u0902\u0915\u0932\u093f\u0924 \u0914\u0930 \u092a\u094d\u0930\u0915\u093e\u0936\u093f\u0924 \u0915\u0930\u0928\u0947 \u0915\u0947 \u0932\u093f\u090f \u091c\u093f\u092e\u094d\u092e\u0947\u0926\u093e\u0930 \u0939\u0948 ?","options":["World Bank ( \u0935\u093f\u0936\u094d\u0935 \u092c\u0948\u0902\u0915 )","International Monetary Fund (IMF) ( \u0905\u0902\u0924\u0930\u094d\u0930\u093e\u0937\u094d\u091f\u094d\u0930\u0940\u092f \u092e\u0941\u0926\u094d\u0930\u093e \u0915\u094b\u0937 )","United Nations Development Programme (UNDP) ( \u0938\u0902\u092f\u0941\u0915\u094d\u0924 \u0930\u093e\u0937\u094d\u091f\u094d\u0930 \u0935\u093f\u0915\u093e\u0938 \u0915\u093e\u0930\u094d\u092f\u0915\u094d\u0930\u092e (UNDP))","World Economic Forum (WEF) ( \u0935\u093f\u0936\u094d\u0935 \u0906\u0930\u094d\u0925\u093f\u0915 \u092e\u0902\u091a )"],"answer":"3","solution":"The Human Development Index (HDI) is a statistical composite index combining life expectancy, education (mean and expected years of schooling), and per capita income indicators. It is published annually by the United Nations Development Programme (UNDP) in its Human Development Report. Additional Info (a) The World Bank tracks GNI and World Development Indicators. (b) The IMF tracks global GDP and financial stability. (c) The HDI was developed by Pakistani economist Mahbub ul Haq and Indian economist Amartya Sen. (d) The WEF publishes the Global Competitiveness Report. Positive Mark: 0.8 Negative Mark: 0"},{"id":"84986","q":"105. The 2025 'Pritzker Architecture Prize', often regarded as the Nobel Prize of architecture, highlights sustainable urban design. Which entity sponsors this prestigious award? 2025 \u0915\u093e ' \u092a\u094d\u0930\u093f\u0924\u094d\u091c\u093c\u0915\u0930 \u0906\u0930\u094d\u0915\u093f\u091f\u0947\u0915\u094d\u091a\u0930 \u092a\u0941\u0930\u0938\u094d\u0915\u093e\u0930 ', \u091c\u093f\u0938\u0947 \u0905\u0915\u094d\u0938\u0930 \u0935\u093e\u0938\u094d\u0924\u0941\u0915\u0932\u093e \u0915\u093e \u0928\u094b\u092c\u0947\u0932 \u092a\u0941\u0930\u0938\u094d\u0915\u093e\u0930 \u092e\u093e\u0928\u093e \u091c\u093e\u0924\u093e \u0939\u0948 , \u091f\u093f\u0915\u093e\u090a \u0936\u0939\u0930\u0940 \u0921\u093f\u091c\u093e\u0907\u0928 \u092a\u0930 \u092a\u094d\u0930\u0915\u093e\u0936 \u0921\u093e\u0932\u0924\u093e \u0939\u0948\u0964 \u0915\u094c\u0928 \u0938\u0940 \u0907\u0915\u093e\u0908 \u0907\u0938 \u092a\u094d\u0930\u0924\u093f\u0937\u094d\u0920\u093f\u0924 \u092a\u0941\u0930\u0938\u094d\u0915\u093e\u0930 \u0915\u094b \u092a\u094d\u0930\u093e\u092f\u094b\u091c\u093f\u0924 \u0915\u0930\u0924\u0940 \u0939\u0948 ?","options":["The Hyatt Foundation ( \u0939\u092f\u093e\u0924 \u092b\u093e\u0909\u0902\u0921\u0947\u0936\u0928 )","The Royal Institute of British Architects ( \u0930\u0949\u092f\u0932 \u0907\u0902\u0938\u094d\u091f\u0940\u091f\u094d\u092f\u0942\u091f \u0911\u092b \u092c\u094d\u0930\u093f\u091f\u093f\u0936 \u0906\u0930\u094d\u0915\u093f\u091f\u0947\u0915\u094d\u091f\u094d\u0938 )","The United Nations Environmental Assembly ( \u0938\u0902\u092f\u0941\u0915\u094d\u0924 \u0930\u093e\u0937\u094d\u091f\u094d\u0930 \u092a\u0930\u094d\u092f\u093e\u0935\u0930\u0923 \u0938\u092d\u093e )","The Guggenheim Foundation ( \u0917\u0941\u0917\u0947\u0928\u0939\u093e\u0907\u092e \u092b\u093e\u0909\u0902\u0921\u0947\u0936\u0928 )"],"answer":"1","solution":"The Pritzker Architecture Prize is the premier global award for architecture. It is sponsored and funded entirely by the Hyatt Foundation, which was established by the Pritzker family (owners of the Hyatt hotel chain) in 1979. Additional Info (a) It is awarded to honor a living architect whose built work demonstrates talent, vision, and commitment. (b) The Royal Institute of British Architects (RIBA) awards the Royal Gold Medal. (c) The UN awards environmental prizes like the Champions of the Earth. (d) The Guggenheim Foundation is renowned for art museums. Positive Mark: 0.8 Negative Mark: 0"},{"id":"84987","q":"106. Standard ASCII (American Standard Code for Information Interchange) uses 7 bits to represent characters, allowing for 128 unique symbols. In contrast, modern systems use Unicode (like UTF-8) primarily because Unicode: \u092e\u093e\u0928\u0915 ASCII \u0935\u0930\u094d\u0923\u094b\u0902 \u0915\u093e \u092a\u094d\u0930\u0924\u093f\u0928\u093f\u0927\u093f\u0924\u094d\u0935 \u0915\u0930\u0928\u0947 \u0915\u0947 \u0932\u093f\u090f 7 \u092c\u093f\u091f\u094d\u0938 \u0915\u093e \u0909\u092a\u092f\u094b\u0917 \u0915\u0930\u0924\u093e \u0939\u0948 , \u091c\u093f\u0938\u0938\u0947 128 \u0905\u0926\u094d\u0935\u093f\u0924\u0940\u092f \u092a\u094d\u0930\u0924\u0940\u0915\u094b\u0902 \u0915\u0940 \u0905\u0928\u0941\u092e\u0924\u093f \u092e\u093f\u0932\u0924\u0940 \u0939\u0948\u0964 \u0907\u0938\u0915\u0947 \u0935\u093f\u092a\u0930\u0940\u0924 , \u0906\u0927\u0941\u0928\u093f\u0915 \u0938\u093f\u0938\u094d\u091f\u092e \u092f\u0942\u0928\u093f\u0915\u094b\u0921 ( \u091c\u0948\u0938\u0947 UTF-8) \u0915\u093e \u0909\u092a\u092f\u094b\u0917 \u092e\u0941\u0916\u094d\u092f \u0930\u0942\u092a \u0938\u0947 \u0907\u0938\u0932\u093f\u090f \u0915\u0930\u0924\u0947 \u0939\u0948\u0902 \u0915\u094d\u092f\u094b\u0902\u0915\u093f \u092f\u0942\u0928\u093f\u0915\u094b\u0921 :","options":["Processes data faster than ASCII (ASCII \u0915\u0940 \u0924\u0941\u0932\u0928\u093e \u092e\u0947\u0902 \u0921\u0947\u091f\u093e \u0915\u094b \u0924\u0947\u091c\u0940 \u0938\u0947 \u092a\u094d\u0930\u094b\u0938\u0947\u0938 \u0915\u0930\u0924\u093e \u0939\u0948 )","Consumes less memory than ASCII (ASCII \u0915\u0940 \u0924\u0941\u0932\u0928\u093e \u092e\u0947\u0902 \u0915\u092e \u092e\u0947\u092e\u094b\u0930\u0940 \u0915\u0940 \u0916\u092a\u0924 \u0915\u0930\u0924\u093e \u0939\u0948 )","Can represent characters and symbols from virtually all written languages in the world ( \u0926\u0941\u0928\u093f\u092f\u093e \u0915\u0940 \u0932\u0917\u092d\u0917 \u0938\u092d\u0940 \u0932\u093f\u0916\u093f\u0924 \u092d\u093e\u0937\u093e\u0913\u0902 \u0915\u0947 \u0935\u0930\u094d\u0923\u094b\u0902 \u0914\u0930 \u092a\u094d\u0930\u0924\u0940\u0915\u094b\u0902 \u0915\u093e \u092a\u094d\u0930\u0924\u093f\u0928\u093f\u0927\u093f\u0924\u094d\u0935 \u0915\u0930 \u0938\u0915\u0924\u093e \u0939\u0948 )","Automatically encrypts the text data ( \u091f\u0947\u0915\u094d\u0938\u094d\u091f \u0921\u0947\u091f\u093e \u0915\u094b \u0938\u094d\u0935\u091a\u093e\u0932\u093f\u0924 \u0930\u0942\u092a \u0938\u0947 \u090f\u0928\u094d\u0915\u094d\u0930\u093f\u092a\u094d\u091f \u0915\u0930\u0924\u093e \u0939\u0948 )"],"answer":"3","solution":"Unicode is a universal character encoding standard. While ASCII is limited to basic English characters and symbols (128 total), Unicode aims to provide a unique number for every character, regardless of platform, program, or language, allowing computers to seamlessly display Chinese, Arabic, Hindi, emojis, and more. Additional Info (a) Encoding large Unicode characters can actually take more processing power than simple ASCII. (b) Unicode (like UTF-16 or UTF-32) generally consumes more memory than 7-bit ASCII. (c) UTF-8 is backward compatible with ASCII. (d) Encoding is not encryption; Unicode data is completely readable. Positive Mark: 0.8 Negative Mark: 0"},{"id":"84988","q":"107. According to Abbe's criterion, the resolving power of an optical microscope (its ability to distinguish two close points) can be mathematically increased by: \u090f\u092c\u094d\u092c\u0947 (Abbe) \u0915\u0947 \u092e\u093e\u0928\u0926\u0902\u0921 \u0915\u0947 \u0905\u0928\u0941\u0938\u093e\u0930 , \u090f\u0915 \u0911\u092a\u094d\u091f\u093f\u0915\u0932 \u092e\u093e\u0907\u0915\u094d\u0930\u094b\u0938\u094d\u0915\u094b\u092a \u0915\u0940 \u0938\u0902\u0915\u0932\u094d\u092a \u0936\u0915\u094d\u0924\u093f (resolving power) \u0915\u094b \u0917\u0923\u093f\u0924\u0940\u092f \u0930\u0942\u092a \u0938\u0947 \u0915\u093f\u0938\u0915\u0947 \u0926\u094d\u0935\u093e\u0930\u093e \u092c\u0922\u093c\u093e\u092f\u093e \u091c\u093e \u0938\u0915\u0924\u093e \u0939\u0948 ?","options":["Increasing the wavelength of the light used ( \u0909\u092a\u092f\u094b\u0917 \u0915\u093f\u090f \u0917\u090f \u092a\u094d\u0930\u0915\u093e\u0936 \u0915\u0940 \u0924\u0930\u0902\u0917 \u0926\u0948\u0930\u094d\u0927\u094d\u092f \u0915\u094b \u092c\u0922\u093c\u093e\u0915\u0930 )","Decreasing the refractive index of the medium between the object and the objective lens ( \u0935\u0938\u094d\u0924\u0941 \u0914\u0930 \u0905\u092d\u093f\u0926\u0943\u0936\u094d\u092f\u0915 \u0932\u0947\u0902\u0938 (objective lens) \u0915\u0947 \u092c\u0940\u091a \u092e\u093e\u0927\u094d\u092f\u092e \u0915\u0947 \u0905\u092a\u0935\u0930\u094d\u0924\u0928\u093e\u0902\u0915 \u0915\u094b \u0915\u092e \u0915\u0930\u0915\u0947 )","Increasing the numerical aperture of the objective lens ( \u0905\u092d\u093f\u0926\u0943\u0936\u094d\u092f\u0915 \u0932\u0947\u0902\u0938 \u0915\u0947 \u0928\u094d\u092f\u0942\u092e\u0947\u0930\u093f\u0915\u0932 \u0905\u092a\u0930\u094d\u091a\u0930 \u0915\u094b \u092c\u0922\u093c\u093e\u0915\u0930 )","Decreasing the diameter of the objective lens ( \u0905\u092d\u093f\u0926\u0943\u0936\u094d\u092f\u0915 \u0932\u0947\u0902\u0938 \u0915\u0947 \u0935\u094d\u092f\u093e\u0938 \u0915\u094b \u0915\u092e \u0915\u0930\u0915\u0947 )"],"answer":"3","solution":"The resolving power of a microscope is given by , where NA is the numerical aperture and is the wavelength of light. Therefore, increasing the Numerical Aperture (NA) directly increases the resolving power. Additional Info (a) Increasing the wavelength decreases resolving power (which is why electron microscopes, with very short wavelengths, have much higher resolution). (b) Decreasing the refractive index lowers the NA, worsening resolution. Immersion oil is used to increase the refractive index. (c) A higher numerical aperture captures more diffracted light from the specimen. (d) Decreasing the diameter limits light gathering, reducing resolution. Positive Mark: 0.8 Negative Mark: 0"},{"id":"84989","q":"108. 'Eutrophication' is an environmental issue caused by the excessive presence of which specific nutrients in water bodies? (' \u092f\u0942\u091f\u094d\u0930\u094b\u092b\u093f\u0915\u0947\u0936\u0928 ' (Eutrophication) \u091c\u0932 \u0928\u093f\u0915\u093e\u092f\u094b\u0902 \u092e\u0947\u0902 \u0915\u093f\u0928 \u0935\u093f\u0936\u093f\u0937\u094d\u091f \u092a\u094b\u0937\u0915 \u0924\u0924\u094d\u0935\u094b\u0902 \u0915\u0940 \u0905\u0924\u094d\u092f\u0927\u093f\u0915 \u0909\u092a\u0938\u094d\u0925\u093f\u0924\u093f \u0915\u0947 \u0915\u093e\u0930\u0923 \u0939\u094b\u0928\u0947 \u0935\u093e\u0932\u093e \u090f\u0915 \u092a\u0930\u094d\u092f\u093e\u0935\u0930\u0923\u0940\u092f \u092e\u0941\u0926\u094d\u0926\u093e \u0939\u0948 ?)","options":["Sodium and Potassium ( \u0938\u094b\u0921\u093f\u092f\u092e \u0914\u0930 \u092a\u094b\u091f\u0947\u0936\u093f\u092f\u092e )","Calcium and Magnesium ( \u0915\u0948\u0932\u094d\u0936\u093f\u092f\u092e \u0914\u0930 \u092e\u0948\u0917\u094d\u0928\u0940\u0936\u093f\u092f\u092e )","Nitrogen and Phosphorus ( \u0928\u093e\u0907\u091f\u094d\u0930\u094b\u091c\u0928 \u0914\u0930 \u092b\u093e\u0938\u094d\u092b\u094b\u0930\u0938 )","Iron and Zinc ( \u0932\u094b\u0939\u093e \u0914\u0930 \u091c\u0938\u094d\u0924\u093e )"],"answer":"3","solution":"Eutrophication is the over-enrichment of water bodies with essential plant nutrients, specifically nitrogen and phosphorus. This usually occurs due to agricultural fertilizer runoff, triggering massive and ecologically harmful algal blooms. Additional Info (a) Sodium and Potassium are common electrolytes but do not drive major algal blooms. (b) Calcium and Magnesium contribute to water \"hardness.\" (c) As algal blooms die, their bacterial decomposition depletes dissolved oxygen, killing fish and creating \"dead zones.\" (d) Iron and Zinc are trace heavy metals. Positive Mark: 0.8 Negative Mark: 0"},{"id":"84990","q":"109. Who served as the first Chief Minister of the state of Bihar post-independence? \u0938\u094d\u0935\u0924\u0902\u0924\u094d\u0930\u0924\u093e \u0915\u0947 \u092c\u093e\u0926 \u092c\u093f\u0939\u093e\u0930 \u0930\u093e\u091c\u094d\u092f \u0915\u0947 \u092a\u094d\u0930\u0925\u092e \u092e\u0941\u0916\u094d\u092f\u092e\u0902\u0924\u094d\u0930\u0940 \u0915\u0947 \u0930\u0942\u092a \u092e\u0947\u0902 \u0915\u093f\u0938\u0928\u0947 \u0915\u093e\u0930\u094d\u092f \u0915\u093f\u092f\u093e ?","options":["Sri Krishna Sinha ( \u0936\u094d\u0930\u0940 \u0915\u0943\u0937\u094d\u0923 \u0938\u093f\u0928\u094d\u0939\u093e )","Anugrah Narayan Sinha ( \u0905\u0928\u0941\u0917\u094d\u0930\u0939 \u0928\u093e\u0930\u093e\u092f\u0923 \u0938\u093f\u0928\u094d\u0939\u093e )","Karpoori Thakur ( \u0915\u0930\u094d\u092a\u0942\u0930\u0940 \u0920\u093e\u0915\u0941\u0930 )","Nitish Kumar ( \u0928\u0940\u0924\u0940\u0936 \u0915\u0941\u092e\u093e\u0930 )"],"answer":"1","solution":"Dr. Sri Krishna Sinha, widely known as \"Bihar Kesari,\" served as the first Chief Minister of Bihar from 1946 until his death in 1961. Additional Info (a) He was a prominent freedom fighter and abolished the zamindari system in the state. (b) Dr. Anugrah Narayan Sinha was the first Deputy Chief Minister and Finance Minister. (c) Karpoori Thakur was a highly influential Chief Minister in the 1970s, recognized for social justice reforms. (d) Nitish Kumar is a prominent contemporary Chief Minister of the state. Positive Mark: 0.8 Negative Mark: 0"},{"id":"84991","q":"110. Which constitutional body is mandated to conduct and supervise the elections to the local Panchayats and Municipalities within a state? \u0915\u093f\u0938 \u0938\u0902\u0935\u0948\u0927\u093e\u0928\u093f\u0915 \u0928\u093f\u0915\u093e\u092f \u0915\u094b \u0915\u093f\u0938\u0940 \u0930\u093e\u091c\u094d\u092f \u0915\u0947 \u092d\u0940\u0924\u0930 \u0938\u094d\u0925\u093e\u0928\u0940\u092f \u092a\u0902\u091a\u093e\u092f\u0924\u094b\u0902 \u0914\u0930 \u0928\u0917\u0930 \u092a\u093e\u0932\u093f\u0915\u093e\u0913\u0902 \u0915\u0947 \u091a\u0941\u0928\u093e\u0935 \u0915\u0930\u093e\u0928\u0947 \u0914\u0930 \u0909\u0928\u0915\u0940 \u0928\u093f\u0917\u0930\u093e\u0928\u0940 \u0915\u0930\u0928\u0947 \u0915\u093e \u0905\u0927\u093f\u0915\u093e\u0930 \u0939\u0948 ?","options":["Election Commission of India ( \u092d\u093e\u0930\u0924 \u0915\u093e \u091a\u0941\u0928\u093e\u0935 \u0906\u092f\u094b\u0917 )","State Election Commission ( \u0930\u093e\u091c\u094d\u092f \u091a\u0941\u0928\u093e\u0935 \u0906\u092f\u094b\u0917 )","State Public Service Commission ( \u0930\u093e\u091c\u094d\u092f \u0932\u094b\u0915 \u0938\u0947\u0935\u093e \u0906\u092f\u094b\u0917 )","Delimitation Commission ( \u092a\u0930\u093f\u0938\u0940\u092e\u0928 \u0906\u092f\u094b\u0917 )"],"answer":"2","solution":"The 73rd and 74th Constitutional Amendment Acts established the State Election Commission. It is an independent constitutional body responsible exclusively for the superintendence, direction, and control of electoral rolls and the conduct of all elections to Panchayats and Municipalities. Additional Info (a) The Election Commission of India conducts elections for the Parliament, State Legislatures, President, and Vice-President. (b) The State Election Commissioner is appointed by the Governor. (c) SPSC conducts exams for state administrative services. (d) The Delimitation Commission redraws territorial constituency boundaries based on census data. Positive Mark: 0.8 Negative Mark: 0"},{"id":"84992","q":"111. The longest and heaviest bone in the human skeletal system is the: \u092e\u093e\u0928\u0935 \u0915\u0902\u0915\u093e\u0932 \u0924\u0902\u0924\u094d\u0930 \u0915\u0940 \u0938\u092c\u0938\u0947 \u0932\u0902\u092c\u0940 \u0914\u0930 \u092d\u093e\u0930\u0940 \u0939\u0921\u094d\u0921\u0940 \u0915\u094c\u0928 \u0938\u0940 \u0939\u0948 ?","options":["Humerus ( \u0939\u094d\u092f\u0942\u092e\u0930\u0938 )","Tibia ( \u091f\u093f\u092c\u093f\u092f\u093e )","Femur ( \u092b\u0940\u092e\u0930 / \u091c\u093e\u0902\u0918 \u0915\u0940 \u0939\u0921\u094d\u0921\u0940 )","Fibula ( \u092b\u093e\u0907\u092c\u0941\u0932\u093e )"],"answer":"3","solution":"The femur, or thigh bone, is the longest, heaviest, and strongest bone in the human body. It extends from the hip joint to the knee joint. Additional Info (a) The humerus is the long bone in the upper arm. (b) The tibia is the shinbone, the larger of the two bones in the lower leg. (c) Because of its strength, the femur is crucial for supporting the body's weight during standing, walking, and running. (d) The fibula is the smaller calf bone located parallel to the tibia. Positive Mark: 0.8 Negative Mark: 0"},{"id":"84993","q":"112. A 'Bull Market' in the financial stock exchange refers to a sustained period when: \u0935\u093f\u0924\u094d\u0924\u0940\u092f \u0938\u094d\u091f\u0949\u0915 \u090f\u0915\u094d\u0938\u091a\u0947\u0902\u091c \u092e\u0947\u0902 ' \u092c\u0941\u0932 \u092e\u093e\u0930\u094d\u0915\u0947\u091f ' (Bull Market) \u090f\u0915 \u0928\u093f\u0930\u0902\u0924\u0930 \u0905\u0935\u0927\u093f \u0915\u094b \u0938\u0902\u0926\u0930\u094d\u092d\u093f\u0924 \u0915\u0930\u0924\u093e \u0939\u0948 \u091c\u092c :","options":["Share prices are falling rapidly due to panic selling ( \u0918\u092c\u0930\u093e\u0939\u091f \u092e\u0947\u0902 \u092c\u093f\u0915\u0935\u093e\u0932\u0940 \u0915\u0947 \u0915\u093e\u0930\u0923 \u0936\u0947\u092f\u0930 \u0915\u0940 \u0915\u0940\u092e\u0924\u0947\u0902 \u0924\u0947\u091c\u0940 \u0938\u0947 \u0917\u093f\u0930 \u0930\u0939\u0940 \u0939\u0948\u0902 )","Share prices are rising or are broadly expected to rise ( \u0936\u0947\u092f\u0930\u094b\u0902 \u0915\u0940 \u0915\u0940\u092e\u0924\u0947\u0902 \u092c\u0922\u093c \u0930\u0939\u0940 \u0939\u0948\u0902 \u092f\u093e \u0909\u0928\u0915\u0947 \u092c\u0922\u093c\u0928\u0947 \u0915\u0940 \u0935\u094d\u092f\u093e\u092a\u0915 \u0909\u092e\u094d\u092e\u0940\u0926 \u0939\u0948 )","Trading volume is extremely low due to high interest rates ( \u0909\u091a\u094d\u091a \u092c\u094d\u092f\u093e\u091c \u0926\u0930\u094b\u0902 \u0915\u0947 \u0915\u093e\u0930\u0923 \u091f\u094d\u0930\u0947\u0921\u093f\u0902\u0917 \u0935\u0949\u0932\u094d\u092f\u0942\u092e \u092c\u0947\u0939\u0926 \u0915\u092e \u0939\u0948 )","The market is closed by regulators to prevent a crash ( \u0915\u094d\u0930\u0948\u0936 \u0915\u094b \u0930\u094b\u0915\u0928\u0947 \u0915\u0947 \u0932\u093f\u090f \u0928\u093f\u092f\u093e\u092e\u0915\u094b\u0902 \u0926\u094d\u0935\u093e\u0930\u093e \u092c\u093e\u091c\u093c\u093e\u0930 \u092c\u0902\u0926 \u0915\u0930 \u0926\u093f\u092f\u093e \u091c\u093e\u0924\u093e \u0939\u0948 )"],"answer":"2","solution":"A \"Bull Market\" characterizes a financial market where investor confidence is high, and the prices of corporate shares and other securities are steadily rising or expected to rise significantly over time. Additional Info (a) A market characterized by falling prices and widespread pessimism is called a \"Bear Market.\" (b) The term supposedly originates from the way a bull attacks\u2014by thrusting its horns upward into the air. (c) Low trading volume implies market stagnation. (d) A market closure to prevent a crash is known as a \"circuit breaker\" or trading halt. Positive Mark: 0.8 Negative Mark: 0"},{"id":"84994","q":"113. Which highly reactive chemical radical is primarily responsible for the catalytic destruction of ozone molecules in the stratosphere, following the breakdown of CFCs? CFCs \u0915\u0947 \u091f\u0942\u091f\u0928\u0947 \u0915\u0947 \u092c\u093e\u0926 , \u0938\u092e\u0924\u093e\u092a \u092e\u0902\u0921\u0932 \u092e\u0947\u0902 \u0913\u091c\u094b\u0928 \u0905\u0923\u0941\u0913\u0902 \u0915\u0947 \u0909\u0924\u094d\u092a\u094d\u0930\u0947\u0930\u0915 \u0935\u093f\u0928\u093e\u0936 \u0915\u0947 \u0932\u093f\u090f \u092e\u0941\u0916\u094d\u092f \u0930\u0942\u092a \u0938\u0947 \u0915\u094c\u0928 \u0938\u093e \u0905\u0924\u094d\u092f\u0927\u093f\u0915 \u092a\u094d\u0930\u0924\u093f\u0915\u094d\u0930\u093f\u092f\u093e\u0936\u0940\u0932 \u0930\u093e\u0938\u093e\u092f\u0928\u093f\u0915 \u092e\u0942\u0932\u0915 (radical) \u091c\u093f\u092e\u094d\u092e\u0947\u0926\u093e\u0930 \u0939\u0948 ?","options":["Hydroxyl radical ( ) ( \u0939\u093e\u0907\u0921\u094d\u0930\u0949\u0915\u094d\u0938\u093f\u0932 \u0930\u0947\u0921\u093f\u0915\u0932 )","Chlorine radical ( ) ( \u0915\u094d\u0932\u094b\u0930\u0940\u0928 \u0930\u0947\u0921\u093f\u0915\u0932 )","Methyl radical ( ) ( \u092e\u093f\u0925\u093e\u0907\u0932 \u0930\u0947\u0921\u093f\u0915\u0932 )","Nitrate radical ( ) ( \u0928\u093e\u0907\u091f\u094d\u0930\u0947\u091f \u0930\u0947\u0921\u093f\u0915\u0932 )"],"answer":"2","solution":"When Chlorofluorocarbons (CFCs) reach the stratosphere, intense UV radiation breaks the carbon-chlorine bonds, releasing highly reactive Chlorine radicals ( ). A single chlorine radical can catalytically destroy tens of thousands of ozone ( ) molecules before being removed from the stratosphere. Additional Info (a) Hydroxyl radicals are \"detergents\" of the troposphere, breaking down greenhouse gases like methane. (b) The reaction cycle involves , followed by (c) Methyl radicals are organic intermediates not heavily involved in ozone depletion. (d) Nitrate radicals are active in nighttime atmospheric chemistry. Positive Mark: 0.8 Negative Mark: 0"},{"id":"84995","q":"114. The ancient, UNESCO-recognized site of 'Nalanda' in Bihar was historically a globally renowned center of: \u092c\u093f\u0939\u093e\u0930 \u092e\u0947\u0902 ' \u0928\u093e\u0932\u0902\u0926\u093e ' \u0915\u093e \u092a\u094d\u0930\u093e\u091a\u0940\u0928 , \u092f\u0942\u0928\u0947\u0938\u094d\u0915\u094b \u0926\u094d\u0935\u093e\u0930\u093e \u092e\u093e\u0928\u094d\u092f\u0924\u093e \u092a\u094d\u0930\u093e\u092a\u094d\u0924 \u0938\u094d\u0925\u0932 \u0910\u0924\u093f\u0939\u093e\u0938\u093f\u0915 \u0930\u0942\u092a \u0938\u0947 \u0935\u093f\u0936\u094d\u0935 \u0938\u094d\u0924\u0930 \u092a\u0930 \u0915\u093f\u0938\u0915\u093e \u092a\u094d\u0930\u0938\u093f\u0926\u094d\u0927 \u0915\u0947\u0902\u0926\u094d\u0930 \u0925\u093e ?","options":["Jain philosophy ( \u091c\u0948\u0928 \u0926\u0930\u094d\u0936\u0928 )","Buddhist learning and monasticism ( \u092c\u094c\u0926\u094d\u0927 \u0936\u093f\u0915\u094d\u0937\u093e \u0914\u0930 \u092e\u0920\u0935\u093e\u0926 )","Vedic rituals ( \u0935\u0948\u0926\u093f\u0915 \u0905\u0928\u0941\u0937\u094d\u0920\u093e\u0928 )","Islamic theology ( \u0907\u0938\u094d\u0932\u093e\u092e\u0940 \u0927\u0930\u094d\u092e\u0936\u093e\u0938\u094d\u0924\u094d\u0930 )"],"answer":"2","solution":"Nalanda Mahavihara was one of the greatest ancient centers of learning in the world, operating from the 5th century CE to 1200 CE. It was primarily a highly prestigious monastic university focusing on profound Buddhist learning, attracting scholars from across Asia. Additional Info (a) While Jainism flourished in nearby areas like Pawapuri, Nalanda's curriculum was distinctly Buddhist. (b) Scholars like Xuanzang (Hiuen Tsang) studied and taught Mahayana Buddhism there. (c) Vedic rituals were taught elsewhere in ancient India (like Takshashila). (d) The university was destroyed around 1200 CE by the invader Bakhtiyar Khilji. Positive Mark: 0.8 Negative Mark: 0"},{"id":"84996","q":"115. The 2025 'World Economic Forum' (WEF) annual meeting of global leaders and billionaires was hosted in its traditional location of: ( \u0935\u0948\u0936\u094d\u0935\u093f\u0915 \u0928\u0947\u0924\u093e\u0913\u0902 \u0914\u0930 \u0905\u0930\u092c\u092a\u0924\u093f\u092f\u094b\u0902 \u0915\u0940 2025 ' \u0935\u093f\u0936\u094d\u0935 \u0906\u0930\u094d\u0925\u093f\u0915 \u092e\u0902\u091a ' (WEF) \u0915\u0940 \u0935\u093e\u0930\u094d\u0937\u093f\u0915 \u092c\u0948\u0920\u0915 \u0915\u0940 \u092e\u0947\u091c\u092c\u093e\u0928\u0940 \u0909\u0938\u0915\u0947 \u092a\u093e\u0930\u0902\u092a\u0930\u093f\u0915 \u0938\u094d\u0925\u093e\u0928 \u092a\u0930 \u0915\u0940 \u0917\u0908 \u0925\u0940 :)","options":["Geneva ( \u091c\u093f\u0928\u0947\u0935\u093e )","Zurich ( \u091c\u094d\u092f\u0942\u0930\u093f\u0916 )","Davos ( \u0926\u093e\u0935\u094b\u0938 )","Basel ( \u092c\u0947\u0938\u0932 )"],"answer":"3","solution":"The World Economic Forum (WEF) holds its prestigious annual meeting in the alpine resort town of Davos, Switzerland. The 2025 gathering continued this tradition, bringing together political leaders and corporate executives to shape global agendas. Additional Info (a) Geneva is the city where the WEF is permanently headquartered. (b) Zurich is a major global financial hub in Switzerland. (c) Due to its location, the event is often colloquially referred to simply as \"Davos.\" (d) Basel hosts the Bank for International Settlements (BIS). Positive Mark: 0.8 Negative Mark: 0"},{"id":"84997","q":"116. In Object-Oriented Programming (OOP), the ability of different classes to be treated as instances of the same class through a common interface, allowing a single function name to behave differently based on the object calling it, is known as: \u0911\u092c\u094d\u091c\u0947\u0915\u094d\u091f - \u0913\u0930\u093f\u090f\u0902\u091f\u0947\u0921 \u092a\u094d\u0930\u094b\u0917\u094d\u0930\u093e\u092e\u093f\u0902\u0917 (OOP) \u092e\u0947\u0902 , \u090f\u0915 \u0938\u093e\u092e\u093e\u0928\u094d\u092f \u0907\u0902\u091f\u0930\u092b\u093c\u0947\u0938 \u0915\u0947 \u092e\u093e\u0927\u094d\u092f\u092e \u0938\u0947 \u0935\u093f\u092d\u093f\u0928\u094d\u0928 \u0935\u0930\u094d\u0917\u094b\u0902 \u0915\u094b \u090f\u0915 \u0939\u0940 \u0935\u0930\u094d\u0917 \u0915\u0947 \u0909\u0926\u093e\u0939\u0930\u0923 \u0915\u0947 \u0930\u0942\u092a \u092e\u0947\u0902 \u0935\u094d\u092f\u0935\u0939\u093e\u0930 \u0915\u0930\u0928\u0947 \u0915\u0940 \u0915\u094d\u0937\u092e\u0924\u093e , \u091c\u093f\u0938\u0938\u0947 \u090f\u0915\u0932 \u092b\u093c\u0902\u0915\u094d\u0936\u0928 \u0928\u093e\u092e \u0915\u094b \u0915\u0949\u0932\u093f\u0902\u0917 \u0911\u092c\u094d\u091c\u0947\
