u0915\u094d\u091f \u0915\u0947 \u0906\u0927\u093e\u0930 \u092a\u0930 \u0905\u0932\u0917 - \u0905\u0932\u0917 \u0935\u094d\u092f\u0935\u0939\u093e\u0930 \u0915\u0930\u0928\u0947 \u0915\u0940 \u0905\u0928\u0941\u092e\u0924\u093f \u092e\u093f\u0932\u0924\u0940 \u0939\u0948 , \u0907\u0938\u0947 \u0915\u093f\u0938 \u0930\u0942\u092a \u092e\u0947\u0902 \u091c\u093e\u0928\u093e \u091c\u093e\u0924\u093e \u0939\u0948 ?","options":["Encapsulation ( \u090f\u0928\u0915\u0948\u092a\u094d\u0938\u0941\u0932\u0947\u0936\u0928 )","Inheritance ( \u0907\u0928\u0939\u0947\u0930\u093f\u091f\u0947\u0902\u0938 )","Polymorphism ( \u092a\u0949\u0932\u0940\u092e\u0949\u0930\u092b\u093f\u091c\u093c\u094d\u092e )","Abstraction ( \u090f\u092c\u094d\u0938\u094d\u091f\u094d\u0930\u0947\u0915\u094d\u0936\u0928 )"],"answer":"3","solution":"Polymorphism (meaning \"many forms\") allows objects of different classes to be treated as objects of a common superclass. It enables a single function or method to operate in different ways depending on the specific object that is invoking it (e.g., method overriding). Additional Info (a) Encapsulation bundles data and methods into a single unit to hide internal states. (b) Inheritance allows a child class to acquire the properties of a parent class. (c) A common example is a draw() method that works differently whether the object is a Circle or a Square . (d) Abstraction hides complex implementation details, showing only essential features. Positive Mark: 0.8 Negative Mark: 0"},{"id":"84998","q":"117. In human physiology, oxygen is transported from the lungs to the body's tissues primarily by binding to which specific metalloprotein? ( \u092e\u093e\u0928\u0935 \u0936\u0930\u0940\u0930 \u0915\u094d\u0930\u093f\u092f\u093e \u0935\u093f\u091c\u094d\u091e\u093e\u0928 \u092e\u0947\u0902 , \u092b\u0947\u092b\u0921\u093c\u094b\u0902 \u0938\u0947 \u0936\u0930\u0940\u0930 \u0915\u0947 \u090a\u0924\u0915\u094b\u0902 \u0924\u0915 \u0911\u0915\u094d\u0938\u0940\u091c\u0928 \u092e\u0941\u0916\u094d\u092f \u0930\u0942\u092a \u0938\u0947 \u0915\u093f\u0938 \u0935\u093f\u0936\u093f\u0937\u094d\u091f \u0927\u093e\u0924\u0941\u092a\u094d\u0930\u094b\u091f\u0940\u0928 \u0938\u0947 \u092c\u0902\u0927 \u0915\u0930 \u0932\u0947 \u091c\u093e\u0908 \u091c\u093e\u0924\u0940 \u0939\u0948 ?)","options":["Myoglobin ( \u092e\u093e\u092f\u094b\u0917\u094d\u0932\u094b\u092c\u093f\u0928 )","Hemoglobin ( \u0939\u0940\u092e\u094b\u0917\u094d\u0932\u094b\u092c\u093f\u0928 )","Albumin ( \u090f\u0932\u094d\u092c\u094d\u092f\u0942\u092e\u093f\u0928 )","Fibrinogen ( \u092b\u093e\u0907\u092c\u094d\u0930\u093f\u0928\u094b\u091c\u0947\u0928 )"],"answer":"2","solution":"Hemoglobin is an iron-rich metalloprotein found in red blood cells. It binds reversibly with oxygen in the lungs to form oxyhemoglobin, transporting it through the bloodstream to release it into the body's tissues. Additional Info (a) Myoglobin is a related oxygen-binding protein, but it is located in muscle tissue and stores oxygen rather than transporting it through the blood. (b) Each hemoglobin molecule can carry up to four molecules of oxygen. (c) Albumin is the most abundant protein in blood plasma, regulating osmotic pressure. (d) Fibrinogen is a plasma protein essential for blood clotting. Positive Mark: 0.8 Negative Mark: 0"},{"id":"84999","q":"118. Under the Solid Waste Management Rules, the term 'Wet Waste' typically refers specifically to: ( \u0920\u094b\u0938 \u0905\u092a\u0936\u093f\u0937\u094d\u091f \u092a\u094d\u0930\u092c\u0902\u0927\u0928 \u0928\u093f\u092f\u092e\u094b\u0902 \u0915\u0947 \u0924\u0939\u0924 , ' \u0917\u0940\u0932\u093e \u0915\u091a\u0930\u093e ' (Wet Waste) \u0936\u092c\u094d\u0926 \u0906\u092e \u0924\u094c\u0930 \u092a\u0930 \u0935\u093f\u0936\u0947\u0937 \u0930\u0942\u092a \u0938\u0947 \u0915\u093f\u0938\u0915\u094b \u0938\u0902\u0926\u0930\u094d\u092d\u093f\u0924 \u0915\u0930\u0924\u093e \u0939\u0948 ?)","options":["Plastics and metals that have been washed ( \u0927\u094b\u090f \u0917\u090f \u092a\u094d\u0932\u093e\u0938\u094d\u091f\u093f\u0915 \u0914\u0930 \u0927\u093e\u0924\u0941 )","Biodegradable organic waste (e.g., food scraps) ( \u092c\u093e\u092f\u094b\u0921\u093f\u0917\u094d\u0930\u0947\u0921\u0947\u092c\u0932 \u091c\u0948\u0935\u093f\u0915 \u0905\u092a\u0936\u093f\u0937\u094d\u091f ( \u091c\u0948\u0938\u0947 , \u092d\u094b\u091c\u0928 \u0915\u0947 \u091f\u0941\u0915\u0921\u093c\u0947 ))","Liquid biomedical waste ( \u0924\u0930\u0932 \u092c\u093e\u092f\u094b\u092e\u0947\u0921\u093f\u0915\u0932 \u0915\u091a\u0930\u093e )","E-waste exposed to the elements ( \u0924\u0924\u094d\u0935\u094b\u0902 \u0915\u0947 \u0938\u0902\u092a\u0930\u094d\u0915 \u092e\u0947\u0902 \u0906\u0928\u0947 \u0935\u093e\u0932\u093e \u0908 - \u0915\u091a\u0930\u093e )"],"answer":"2","solution":"Under India's municipal Solid Waste Management Rules, \"Wet Waste\" strictly refers to biodegradable organic matter. This includes kitchen waste like vegetable peels, leftover food, fruit scraps, and garden waste, which can be broken down naturally through composting or biomethanation. Additional Info (a) Washed plastics and metals remain non-biodegradable and are categorized as \"Dry Waste\" (recyclable). (b) Wet waste is usually collected in green-colored municipal bins. (c) Liquid biomedical waste is managed under separate, strict medical regulations. (d) E-waste requires specialized dismantling and recycling regardless of its condition. Positive Mark: 0.8 Negative Mark: 0"},{"id":"85000","q":"119. The structural foundation of the 'Panchayati Raj' system in India is based on the democratic principle of: \u092d\u093e\u0930\u0924 \u092e\u0947\u0902 ' \u092a\u0902\u091a\u093e\u092f\u0924\u0940 \u0930\u093e\u091c ' \u092a\u094d\u0930\u0923\u093e\u0932\u0940 \u0915\u0940 \u0938\u0902\u0930\u091a\u0928\u093e\u0924\u094d\u092e\u0915 \u0928\u0940\u0902\u0935 \u0915\u093f\u0938 \u0932\u094b\u0915\u0924\u093e\u0902\u0924\u094d\u0930\u093f\u0915 \u0938\u093f\u0926\u094d\u0927\u093e\u0902\u0924 \u092a\u0930 \u0906\u0927\u093e\u0930\u093f\u0924 \u0939\u0948 ?","options":["Centralization of power ( \u0938\u0924\u094d\u0924\u093e \u0915\u093e \u0915\u0947\u0902\u0926\u094d\u0930\u0940\u0915\u0930\u0923 )","Democratic decentralization ( \u0932\u094b\u0915\u0924\u093e\u0902\u0924\u094d\u0930\u093f\u0915 \u0935\u093f\u0915\u0947\u0902\u0926\u094d\u0930\u0940\u0915\u0930\u0923 )","Single-party rule ( \u090f\u0915 \u0926\u0932\u0940\u092f \u0936\u093e\u0938\u0928 )","Authoritarianism ( \u0905\u0927\u093f\u0928\u093e\u092f\u0915\u0935\u093e\u0926 )"],"answer":"2","solution":"The Panchayati Raj system is the cornerstone of local self-government in rural India. It is founded entirely on the principle of \"Democratic Decentralization,\" delegating administrative and financial powers from the central and state governments directly to the village level to ensure grassroots participation. Additional Info (a) Centralization concentrates power at the top, the exact opposite of the Panchayati Raj philosophy. (b) The system was formalized by the 73rd Constitutional Amendment Act in 1992 following the Balwant Rai Mehta Committee's recommendations. (c) Local body elections are independent of single-party state mechanics. (d) Authoritarianism relies on strict, unaccountable top-down control. Positive Mark: 0.8 Negative Mark: 0"},{"id":"85001","q":"120. Which is the largest continent by physical land area on Earth? \u092a\u0943\u0925\u094d\u0935\u0940 \u092a\u0930 \u092d\u094c\u0924\u093f\u0915 \u092d\u0942\u092e\u093f \u0915\u094d\u0937\u0947\u0924\u094d\u0930 \u0915\u0947 \u0939\u093f\u0938\u093e\u092c \u0938\u0947 \u0938\u092c\u0938\u0947 \u092c\u0921\u093c\u093e \u092e\u0939\u093e\u0926\u094d\u0935\u0940\u092a \u0915\u094c\u0928 \u0938\u093e \u0939\u0948 ?","options":["Africa ( \u0905\u092b\u094d\u0930\u0940\u0915\u093e )","North America ( \u0909\u0924\u094d\u0924\u0930\u0940 \u0905\u092e\u0947\u0930\u093f\u0915\u093e )","Europe ( \u092f\u0942\u0930\u094b\u092a )","Asia ( \u090f\u0936\u093f\u092f\u093e )"],"answer":"4","solution":"Asia is the largest continent on Earth by a significant margin, encompassing approximately 30% of Earth's total land area. It is also the most populous continent, hosting roughly 60% of the global population. Additional Info (a) Africa is the second-largest continent by both land area and population. (b) North America is the third-largest continent by area. (c) Europe is the second-smallest continent by physical area, larger only than Australia/Oceania. (d) Asia spans from the Eastern Mediterranean Sea to the western Pacific Ocean. Positive Mark: 0.8 Negative Mark: 0"},{"id":"85002","q":"121. Heisenberg\u2019s Uncertainty Principle in quantum mechanics states that it is impossible to simultaneously measure, with perfect precision, both the position and the ____________ of a microscopic particle. \u0915\u094d\u0935\u093e\u0902\u091f\u092e \u092f\u093e\u0902\u0924\u094d\u0930\u093f\u0915\u0940 \u092e\u0947\u0902 \u0939\u093e\u0907\u091c\u0947\u0928\u092c\u0930\u094d\u0917 \u0915\u093e \u0905\u0928\u093f\u0936\u094d\u091a\u093f\u0924\u0924\u093e \u0938\u093f\u0926\u094d\u0927\u093e\u0902\u0924 \u092c\u0924\u093e\u0924\u093e \u0939\u0948 \u0915\u093f \u090f\u0915 \u0938\u093e\u0925 \u092a\u0942\u0930\u094d\u0923 \u0938\u091f\u0940\u0915\u0924\u093e \u0915\u0947 \u0938\u093e\u0925 \u0915\u093f\u0938\u0940 \u0938\u0942\u0915\u094d\u0937\u094d\u092e \u0915\u0923 \u0915\u0940 \u0938\u094d\u0925\u093f\u0924\u093f \u0914\u0930 ____________ \u0926\u094b\u0928\u094b\u0902 \u0915\u094b \u092e\u093e\u092a\u0928\u093e \u0905\u0938\u0902\u092d\u0935 \u0939\u0948\u0964","options":["Mass ( \u0926\u094d\u0930\u0935\u094d\u092f\u092e\u093e\u0928 )","Spin ( \u0938\u094d\u092a\u093f\u0928 )","Momentum ( \u0938\u0902\u0935\u0947\u0917 )","Charge ( \u0906\u0935\u0947\u0936 )"],"answer":"3","solution":"Formulated by Werner Heisenberg, the Uncertainty Principle states that there is a fundamental limit to the precision with which certain pairs of physical properties, such as position (x) and momentum (p), can be known simultaneously ). Additional Info (a) Mass is a scalar quantity and an intrinsic property of the particle. (b) Spin is another quantum property, but position and momentum form the classic conjugate pair in this principle. (c) The more precisely you measure a particle's position, the less precisely you can know its momentum (velocity multiplied by mass). (d) Charge is quantized and measurable independently of position. Positive Mark: 0.8 Negative Mark: 0"},{"id":"85003","q":"122. The 'Beti Bachao, Beti Padhao' scheme was launched by the Government of India primarily to address the critical social issue of: \u092d\u093e\u0930\u0924 \u0938\u0930\u0915\u093e\u0930 \u0926\u094d\u0935\u093e\u0930\u093e ' \u092c\u0947\u091f\u0940 \u092c\u091a\u093e\u0913 , \u092c\u0947\u091f\u0940 \u092a\u0922\u093c\u093e\u0913 ' \u092f\u094b\u091c\u0928\u093e \u092e\u0941\u0916\u094d\u092f \u0930\u0942\u092a \u0938\u0947 \u0915\u093f\u0938 \u092e\u0939\u0924\u094d\u0935\u092a\u0942\u0930\u094d\u0923 \u0938\u093e\u092e\u093e\u091c\u093f\u0915 \u092e\u0941\u0926\u094d\u0926\u0947 \u0915\u094b \u0938\u0902\u092c\u094b\u0927\u093f\u0924 \u0915\u0930\u0928\u0947 \u0915\u0947 \u0932\u093f\u090f \u0936\u0941\u0930\u0942 \u0915\u0940 \u0917\u0908 \u0925\u0940 ?","options":["Female infanticide and the declining child sex ratio ( \u0915\u0928\u094d\u092f\u093e \u092d\u094d\u0930\u0942\u0923 \u0939\u0924\u094d\u092f\u093e \u0914\u0930 \u0918\u091f\u0924\u093e \u092c\u093e\u0932 \u0932\u093f\u0902\u0917\u093e\u0928\u0941\u092a\u093e\u0924 )","Severe malnutrition among adolescent girls ( \u0915\u093f\u0936\u094b\u0930\u093f\u092f\u094b\u0902 \u092e\u0947\u0902 \u0917\u0902\u092d\u0940\u0930 \u0915\u0941\u092a\u094b\u0937\u0923 )","Providing free laptops to college-going women ( \u0915\u0949\u0932\u0947\u091c \u091c\u093e\u0928\u0947 \u0935\u093e\u0932\u0940 \u092e\u0939\u093f\u0932\u093e\u0913\u0902 \u0915\u094b \u092e\u0941\u092b\u094d\u0924 \u0932\u0948\u092a\u091f\u0949\u092a \u0909\u092a\u0932\u092c\u094d\u0927 \u0915\u0930\u093e\u0928\u093e )","Subsidizing housing for single working women ( \u0905\u0915\u0947\u0932\u0940 \u0915\u093e\u092e\u0915\u093e\u091c\u0940 \u092e\u0939\u093f\u0932\u093e\u0913\u0902 \u0915\u0947 \u0932\u093f\u090f \u0906\u0935\u093e\u0938 \u092a\u0930 \u0938\u092c\u094d\u0938\u093f\u0921\u0940 \u0926\u0947\u0928\u093e )"],"answer":"1","solution":"The 'Beti Bachao, Beti Padhao' (Save the Girl Child, Educate the Girl Child) campaign was launched in 2015. Its primary objective is to arrest and reverse the alarming decline in the Child Sex Ratio (CSR) caused by female feticide/infanticide, and to promote the education and active empowerment of girls. Additional Info (a) The scheme represents a joint, tri-ministerial initiative (Women and Child Development, Health and Family Welfare, and Education). (b) Malnutrition is primarily addressed by the Poshan Abhiyaan. (c) State-level schemes often provide laptops or bicycles, but this is not BBBP's primary goal. (d) Housing is addressed by the overarching PM Awas Yojana. Positive Mark: 0.8 Negative Mark: 0"},{"id":"85004","q":"123. In the context of waste management, which of the following is strictly classified and regulated as 'Hazardous Waste'? \u0905\u092a\u0936\u093f\u0937\u094d\u091f \u092a\u094d\u0930\u092c\u0902\u0927\u0928 \u0915\u0947 \u0938\u0902\u0926\u0930\u094d\u092d \u092e\u0947\u0902 , \u0928\u093f\u092e\u094d\u0928\u0932\u093f\u0916\u093f\u0924 \u092e\u0947\u0902 \u0938\u0947 \u0915\u093f\u0938\u0947 ' \u0916\u0924\u0930\u0928\u093e\u0915 \u0905\u092a\u0936\u093f\u0937\u094d\u091f ' (Hazardous Waste) \u0915\u0947 \u0930\u0942\u092a \u092e\u0947\u0902 \u0938\u0916\u094d\u0924\u0940 \u0938\u0947 \u0935\u0930\u094d\u0917\u0940\u0915\u0943\u0924 \u0914\u0930 \u0935\u093f\u0928\u093f\u092f\u092e\u093f\u0924 \u0915\u093f\u092f\u093e \u091c\u093e\u0924\u093e \u0939\u0948 ?","options":["Vegetable peels ( \u0938\u092c\u094d\u091c\u0940 \u0915\u0947 \u091b\u093f\u0932\u0915\u0947 )","Paper coffee cups ( \u0915\u093e\u0917\u091c \u0915\u0947 \u0915\u0949\u092b\u0940 \u0915\u092a )","Used automotive batteries containing lead and sulfuric acid ( \u092a\u094d\u0930\u092f\u0941\u0915\u094d\u0924 \u0911\u091f\u094b\u092e\u094b\u091f\u093f\u0935 \u092c\u0948\u091f\u0930\u093f\u092f\u093e\u0902 \u091c\u093f\u0928\u092e\u0947\u0902 \u0938\u0940\u0938\u093e \u0914\u0930 \u0938\u0932\u094d\u092b\u094d\u092f\u0942\u0930\u093f\u0915 \u090f\u0938\u093f\u0921 \u0939\u094b\u0924\u093e \u0939\u0948 )","Discarded cotton clothes ( \u092b\u0947\u0902\u0915\u0947 \u0917\u090f \u0938\u0942\u0924\u0940 \u0915\u092a\u0921\u093c\u0947 )"],"answer":"3","solution":"Used lead-acid automotive batteries are highly toxic and corrosive. Under the Hazardous Waste Management Rules, they are explicitly classified as hazardous waste because they contain heavy metals (lead) and strong acids (sulfuric acid) that pose severe threats to human health and can contaminate groundwater if improperly discarded. Additional Info (a) Vegetable peels are harmless, biodegradable wet waste. (b) Paper cups are standard municipal dry waste. (c) Lead-acid batteries require highly specialized, regulated recycling facilities to safely extract the lead and neutralize the acid. (d) Cotton clothes are non-hazardous, biodegradable municipal waste. Positive Mark: 0.8 Negative Mark: 0"},{"id":"85005","q":"124. The historical monument 'Sher Shah Suri Tomb', situated in Sasaram, Bihar, is a prime architectural example of which style? ( \u0938\u093e\u0938\u093e\u0930\u093e\u092e , \u092c\u093f\u0939\u093e\u0930 \u092e\u0947\u0902 \u0938\u094d\u0925\u093f\u0924 \u0910\u0924\u093f\u0939\u093e\u0938\u093f\u0915 \u0938\u094d\u092e\u093e\u0930\u0915 ' \u0936\u0947\u0930 \u0936\u093e\u0939 \u0938\u0942\u0930\u0940 \u0915\u093e \u092e\u0915\u092c\u0930\u093e ', \u0915\u093f\u0938 \u0936\u0948\u0932\u0940 \u0915\u093e \u092a\u094d\u0930\u092e\u0941\u0916 \u0938\u094d\u0925\u093e\u092a\u0924\u094d\u092f \u0909\u0926\u093e\u0939\u0930\u0923 \u0939\u0948 ?)","options":["Mughal architecture ( \u092e\u0941\u0917\u0932 \u0935\u093e\u0938\u094d\u0924\u0941\u0915\u0932\u093e )","Dravidian architecture ( \u0926\u094d\u0930\u0935\u093f\u0921\u093c \u0935\u093e\u0938\u094d\u0924\u0941\u0915\u0932\u093e )","Indo-Islamic (specifically Afghan) architecture ( \u0907\u0902\u0921\u094b - \u0907\u0938\u094d\u0932\u093e\u092e\u093f\u0915 ( \u0935\u093f\u0936\u0947\u0937 \u0930\u0942\u092a \u0938\u0947 \u0905\u092b\u0917\u093e\u0928 ) \u0935\u093e\u0938\u094d\u0924\u0941\u0915\u0932\u093e )","Gothic architecture ( \u0917\u0949\u0925\u093f\u0915 \u0935\u093e\u0938\u094d\u0924\u0941\u0915\u0932\u093e )"],"answer":"3","solution":"The magnificent tomb of Sher Shah Suri is one of the finest and most imposing examples of the Afghan style of Indo-Islamic architecture. It perfectly blends indigenous Indian structural elements with Islamic geometric designs and massive domes. Additional Info (a) While it heavily influenced later Mughal tombs (like the Taj Mahal), it predates the mature Mughal architectural style of Akbar or Shah Jahan. (b) Dravidian architecture is the temple-building style of South India. (c) The octagonal shape and placement in the center of an artificial lake are hallmarks of this specific Afghan-Suri architectural evolution. (d) Gothic architecture is a European style characterized by pointed arches and ribbed vaults. Positive Mark: 0.8 Negative Mark: 0"},{"id":"85006","q":"125. Which country officially holds the presidency of the G20 summit for the year 2025? \u0935\u0930\u094d\u0937 2025 \u0915\u0947 \u0932\u093f\u090f G20 \u0936\u093f\u0916\u0930 \u0938\u092e\u094d\u092e\u0947\u0932\u0928 \u0915\u0940 \u0905\u0927\u094d\u092f\u0915\u094d\u0937\u0924\u093e \u0906\u0927\u093f\u0915\u093e\u0930\u093f\u0915 \u0924\u094c\u0930 \u092a\u0930 \u0915\u093f\u0938 \u0926\u0947\u0936 \u0915\u0947 \u092a\u093e\u0938 \u0939\u0948 ?","options":["India ( \u092d\u093e\u0930\u0924 )","Brazil ( \u092c\u094d\u0930\u093e\u091c\u093c\u0940\u0932 )","South Africa ( \u0926\u0915\u094d\u0937\u093f\u0923 \u0905\u092b\u094d\u0930\u0940\u0915\u093e )","USA ( \u092f\u0942\u090f\u0938\u090f )"],"answer":"3","solution":"South Africa officially holds the rotating presidency of the G20 for the year 2025. This marks a historic occasion as it brings the premier international economic forum to the African continent, focusing heavily on the development and representation of the Global South. Additional Info (a) India successfully hosted the G20 presidency in 2023. (b) Brazil held the G20 presidency in 2024. (c) South Africa follows the \"Troika\" system, working closely with previous and subsequent hosts to ensure policy continuity. (d) The USA is scheduled to hold the G20 presidency in 2026. Positive Mark: 0.8 Negative Mark: 0"}];
let idx=0, answers={}, timerSec=65*60, timerInt=null;

function render(){
  const q=DATA[idx];
  if(!q){document.getElementById('qText').textContent='No data.';return;}
  document.getElementById('qNum').textContent=idx+1;
  document.getElementById('qTotal').textContent=DATA.length;
  document.getElementById('qText').textContent=q.q;
  document.getElementById('opts').innerHTML=q.options.map((o,i)=>
    `<div class="option ${answers[idx]==(i+1)?'selected':''}" onclick="select(${i+1})">${String.fromCharCode(65+i)}. ${o}</div>`
  ).join('');
}
window.select=o=>{answers[idx]=o; render();};
window.prev=()=>{if(idx>0){idx--; render();}};
window.next=()=>{if(idx<DATA.length-1){idx++; render();}};

function submitTest(){
  clearInterval(timerInt);
  let c=0; for(let i=0;i<DATA.length;i++){if(answers[i]==DATA[i].answer)c++;}
  const pct=Math.round(c/DATA.length*100)||0;
  document.getElementById('qCard').classList.add('hidden');
  document.getElementById('resCard').classList.remove('hidden');
  document.getElementById('score').textContent=pct+'%';
  document.getElementById('detail').innerHTML='<b>'+c+'/'+DATA.length+'</b> correct';
}

function tick(){timerSec--; document.getElementById('timer').textContent=Math.floor(timerSec/60)+':'+String(timerSec%60).padStart(2,'0'); document.getElementById('bar').style.width=(timerSec/(65*60)*100)+'%'; if(timerSec<=0){clearInterval(timerInt); submitTest();}}

render(); timerInt=setInterval(tick,1000);
</script>
</body></html>
