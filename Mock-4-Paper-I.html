<script>
const DATA=[{"id":"84882","q":"1. The joint Earth-observing mission 'NISAR', heavily monitored ahead of its 2025 launch to measure changes in Earth's ecosystems, is a collaboration between ISRO and: \u092a\u0943\u0925\u094d\u0935\u0940 \u0915\u0947 \u092a\u093e\u0930\u093f\u0938\u094d\u0925\u093f\u0924\u093f\u0915 \u0924\u0902\u0924\u094d\u0930 \u092e\u0947\u0902 \u092a\u0930\u093f\u0935\u0930\u094d\u0924\u0928\u094b\u0902 \u0915\u094b \u092e\u093e\u092a\u0928\u0947 \u0915\u0947 \u0932\u093f\u090f \u0905\u092a\u0928\u0947 2025 \u0915\u0947 \u092a\u094d\u0930\u0915\u094d\u0937\u0947\u092a\u0923 \u0938\u0947 \u092a\u0939\u0932\u0947 \u092d\u093e\u0930\u0940 \u0928\u093f\u0917\u0930\u093e\u0928\u0940 \u0935\u093e\u0932\u093e \u0938\u0902\u092f\u0941\u0915\u094d\u0924 \u092a\u0943\u0925\u094d\u0935\u0940 - \u0905\u0935\u0932\u094b\u0915\u0928 \u092e\u093f\u0936\u0928 'NISAR', ISRO \u0914\u0930 \u0915\u093f\u0938\u0915\u0947 \u092c\u0940\u091a \u090f\u0915 \u0938\u0939\u092f\u094b\u0917 \u0939\u0948 ?","options":["ESA (European Space Agency)","NASA","JAXA","Roscosmos"],"answer":"2","solution":"NISAR (NASA-ISRO Synthetic Aperture Radar) is a joint Earth-observing mission between NASA and the Indian Space Research Organisation (ISRO). It aims to measure Earth's changing ecosystems, dynamic surfaces, and ice masses with unprecedented precision. Additional Info (a) ESA collaborates with ISRO on other missions like Trishna, but not NISAR. (b) NASA provides the L-band synthetic aperture radar, while ISRO provides the S-band radar. (c) JAXA is collaborating with ISRO on the LUPEX (Lunar Polar Exploration) mission. (d) Roscosmos collaborated historically on missions like Aryabhata and Gaganyaan training. Positive Mark: 0.8 Negative Mark: 0"},{"id":"84883","q":"2. In Operating Systems, a \"Page Fault\" occurs when: \u0911\u092a\u0930\u0947\u091f\u093f\u0902\u0917 \u0938\u093f\u0938\u094d\u091f\u092e \u092e\u0947\u0902 , \" \u092a\u0947\u091c \u092b\u0949\u0932\u094d\u091f \" (Page Fault) \u0924\u092c \u0939\u094b\u0924\u093e \u0939\u0948 \u091c\u092c :","options":["The CPU tries to divide a number by zero (CPU \u0915\u093f\u0938\u0940 \u0938\u0902\u0916\u094d\u092f\u093e \u0915\u094b \u0936\u0942\u0928\u094d\u092f \u0938\u0947 \u0935\u093f\u092d\u093e\u091c\u093f\u0924 \u0915\u0930\u0928\u0947 \u0915\u093e \u092a\u094d\u0930\u092f\u093e\u0938 \u0915\u0930\u0924\u093e \u0939\u0948 )","A process attempts to access a memory page that is not currently mapped in the physical RAM ( \u0915\u094b\u0908 \u092a\u094d\u0930\u0915\u094d\u0930\u093f\u092f\u093e \u0909\u0938 \u092e\u0947\u092e\u094b\u0930\u0940 \u092a\u0947\u091c \u0924\u0915 \u092a\u0939\u0941\u0902\u091a\u0928\u0947 \u0915\u093e \u092a\u094d\u0930\u092f\u093e\u0938 \u0915\u0930\u0924\u0940 \u0939\u0948 \u091c\u094b \u0935\u0930\u094d\u0924\u092e\u093e\u0928 \u092e\u0947\u0902 \u092d\u094c\u0924\u093f\u0915 RAM \u092e\u0947\u0902 \u092e\u0948\u092a \u0928\u0939\u0940\u0902 \u0939\u0948 )","Two processes are deadlocked waiting for the same resource ( \u0926\u094b \u092a\u094d\u0930\u0915\u094d\u0930\u093f\u092f\u093e\u090f\u0902 \u090f\u0915 \u0939\u0940 \u0938\u0902\u0938\u093e\u0927\u0928 \u0915\u0940 \u092a\u094d\u0930\u0924\u0940\u0915\u094d\u0937\u093e \u092e\u0947\u0902 \u0921\u0947\u0921\u0932\u0949\u0915 \u0939\u094b \u091c\u093e\u0924\u0940 \u0939\u0948\u0902 )","The hard drive experiences a mechanical read error ( \u0939\u093e\u0930\u094d\u0921 \u0921\u094d\u0930\u093e\u0907\u0935 \u092e\u0947\u0902 \u092f\u093e\u0902\u0924\u094d\u0930\u093f\u0915 \u0930\u0940\u0921 \u0924\u094d\u0930\u0941\u091f\u093f \u0939\u094b\u0924\u0940 \u0939\u0948 )"],"answer":"2","solution":"A page fault occurs when a running program attempts to access a memory page that is mapped into its virtual address space but is not currently loaded in the physical memory (RAM). The OS must then pause the process and fetch the page from the disk (swap/page file). Additional Info (a) Division by zero causes a divide-by-zero exception or hardware trap. (b) Page faults are a completely normal mechanism in modern virtual memory management. (c) Deadlock is a resource allocation issue, not a memory paging issue. (d) A mechanical read error is a hardware failure (like a bad sector). Positive Mark: 0.8 Negative Mark: 0"},{"id":"84884","q":"3. In molecular biology, \"Okazaki fragments\" are short sequences of DNA nucleotides. They are synthesized during DNA replication on which strand? \u0906\u0923\u0935\u093f\u0915 \u091c\u0940\u0935 \u0935\u093f\u091c\u094d\u091e\u093e\u0928 \u092e\u0947\u0902 , \" \u0913\u0915\u093e\u091c\u093e\u0915\u0940 \u0916\u0902\u0921 \" (Okazaki fragments) \u0921\u0940\u090f\u0928\u090f \u0928\u094d\u092f\u0942\u0915\u094d\u0932\u093f\u092f\u094b\u091f\u093e\u0907\u0921 \u0915\u0947 \u091b\u094b\u091f\u0947 \u0905\u0928\u0941\u0915\u094d\u0930\u092e \u0939\u0948\u0902\u0964 \u0921\u0940\u090f\u0928\u090f \u092a\u094d\u0930\u0924\u093f\u0915\u0943\u0924\u093f (replication) \u0915\u0947 \u0926\u094c\u0930\u093e\u0928 \u0907\u0928\u094d\u0939\u0947\u0902 \u0915\u093f\u0938 \u0938\u094d\u091f\u094d\u0930\u0948\u0902\u0921 \u092a\u0930 \u0938\u0902\u0936\u094d\u0932\u0947\u0937\u093f\u0924 \u0915\u093f\u092f\u093e \u091c\u093e\u0924\u093e \u0939\u0948 ?","options":["The leading strand ( \u0932\u0940\u0921\u093f\u0902\u0917 \u0938\u094d\u091f\u094d\u0930\u0948\u0902\u0921 )","The lagging strand ( \u0932\u0948\u0917\u093f\u0902\u0917 \u0938\u094d\u091f\u094d\u0930\u0948\u0902\u0921 )","The template RNA strand ( \u091f\u0947\u092e\u094d\u092a\u0932\u0947\u091f \u0906\u0930\u090f\u0928\u090f \u0938\u094d\u091f\u094d\u0930\u0948\u0902\u0921 )","The promoter region ( \u092a\u094d\u0930\u092e\u094b\u091f\u0930 \u0915\u094d\u0937\u0947\u0924\u094d\u0930 )"],"answer":"2","solution":"During DNA replication, DNA polymerase can only synthesize in the 5' to 3' direction. Because the two strands are antiparallel, the \"lagging strand\" must be synthesized discontinuously in short segments called Okazaki fragments, which are later joined together by DNA ligase. Additional Info (a) The leading strand is synthesized continuously in the same direction as the replication fork. (b) Okazaki fragments allow for the overall 3' to 5' growth of the lagging strand. (c) DNA replication uses a DNA template, not an RNA template. (d) The promoter is a DNA sequence where RNA polymerase binds to initiate transcription. Positive Mark: 0.8 Negative Mark: 0"},{"id":"84885","q":"4. According to the 2011 Census, which district of Bihar boasts the highest literacy rate? 2011 \u0915\u0940 \u091c\u0928\u0917\u0923\u0928\u093e \u0915\u0947 \u0905\u0928\u0941\u0938\u093e\u0930 , \u092c\u093f\u0939\u093e\u0930 \u0915\u0947 \u0915\u093f\u0938 \u091c\u093f\u0932\u0947 \u0915\u0940 \u0938\u093e\u0915\u094d\u0937\u0930\u0924\u093e \u0926\u0930 \u0938\u092c\u0938\u0947 \u0905\u0927\u093f\u0915 \u0939\u0948 ?","options":["Patna ( \u092a\u091f\u0928\u093e )","Rohtas ( \u0930\u094b\u0939\u0924\u093e\u0938 )","Munger ( \u092e\u0941\u0902\u0917\u0947\u0930 )","Bhojpur ( \u092d\u094b\u091c\u092a\u0941\u0930 )"],"answer":"2","solution":"According to the 2011 Census, Rohtas district boasts the highest overall literacy rate in Bihar at 73.37%. Impressively, it also holds the highest male and female literacy rates individually in the state. Additional Info (a) Patna has the second-highest literacy rate in Bihar (70.68%). (b) Rohtas consistently leads the state in educational metrics as per the 2011 data. (c) Munger has a high literacy rate but falls below Rohtas and Patna. (d) Bhojpur has a literacy rate of around 70.47%. Positive Mark: 0.8 Negative Mark: 0"},{"id":"84886","q":"5. In the context of the Indian Constitution, the writ of 'Quo Warranto' is primarily issued to: \u092d\u093e\u0930\u0924\u0940\u092f \u0938\u0902\u0935\u093f\u0927\u093e\u0928 \u0915\u0947 \u0938\u0902\u0926\u0930\u094d\u092d \u092e\u0947\u0902 , ' \u0905\u0927\u093f\u0915\u093e\u0930 \u092a\u0943\u091a\u094d\u091b\u093e ' (Quo Warranto) \u0915\u0940 \u0930\u093f\u091f \u092e\u0941\u0916\u094d\u092f \u0930\u0942\u092a \u0938\u0947 \u0915\u093f\u0938\u0915\u0947 \u0932\u093f\u090f \u091c\u093e\u0930\u0940 \u0915\u0940 \u091c\u093e\u0924\u0940 \u0939\u0948 ?","options":["Compel a public authority to perform its mandatory duty ( \u0915\u093f\u0938\u0940 \u0938\u093e\u0930\u094d\u0935\u091c\u0928\u093f\u0915 \u092a\u094d\u0930\u093e\u0927\u093f\u0915\u0930\u0923 \u0915\u094b \u0905\u092a\u0928\u093e \u0905\u0928\u093f\u0935\u093e\u0930\u094d\u092f \u0915\u0930\u094d\u0924\u0935\u094d\u092f \u0928\u093f\u092d\u093e\u0928\u0947 \u0915\u0947 \u0932\u093f\u090f \u092c\u093e\u0927\u094d\u092f \u0915\u0930\u0928\u093e )","Transfer a case from a lower court to a higher court ( \u0928\u093f\u091a\u0932\u0940 \u0905\u0926\u093e\u0932\u0924 \u0938\u0947 \u0909\u091a\u094d\u091a \u0928\u094d\u092f\u093e\u092f\u093e\u0932\u092f \u092e\u0947\u0902 \u092e\u093e\u092e\u0932\u093e \u0938\u094d\u0925\u093e\u0928\u093e\u0902\u0924\u0930\u093f\u0924 \u0915\u0930\u0928\u093e )","Inquire into the legality of a person's claim to a public office ( \u0938\u093e\u0930\u094d\u0935\u091c\u0928\u093f\u0915 \u0915\u093e\u0930\u094d\u092f\u093e\u0932\u092f \u092e\u0947\u0902 \u0915\u093f\u0938\u0940 \u0935\u094d\u092f\u0915\u094d\u0924\u093f \u0915\u0947 \u0926\u093e\u0935\u0947 \u0915\u0940 \u0935\u0948\u0927\u0924\u093e \u0915\u0940 \u091c\u093e\u0902\u091a \u0915\u0930\u0928\u093e )","Protect a citizen against unlawful arrest and detention ( \u0917\u0948\u0930\u0915\u093e\u0928\u0942\u0928\u0940 \u0917\u093f\u0930\u092b\u094d\u0924\u093e\u0930\u0940 \u0914\u0930 \u0939\u093f\u0930\u093e\u0938\u0924 \u0915\u0947 \u0916\u093f\u0932\u093e\u092b \u090f\u0915 \u0928\u093e\u0917\u0930\u093f\u0915 \u0915\u0940 \u0930\u0915\u094d\u0937\u093e \u0915\u0930\u0928\u093e )"],"answer":"3","solution":"The writ of 'Quo Warranto' literally translates to \"by what authority or warrant.\" It is issued by the courts to inquire into the legality of a person's claim to a public office, thereby preventing the illegal usurpation of such offices. Additional Info (a) This describes the writ of Mandamus. (b) This describes the writ of Certiorari. (c) Quo Warranto can only be sought for substantive, permanent public offices created by statute or the Constitution. (d) This describes the writ of Habeas Corpus. Positive Mark: 0.8 Negative Mark: 0"},{"id":"84887","q":"6. For a first-order chemical reaction, if the rate constant is k, the half-life ( ) of the reaction is given by the expression: \u092a\u094d\u0930\u0925\u092e \u0915\u094b\u091f\u093f (first-order) \u0915\u0940 \u0930\u093e\u0938\u093e\u092f\u0928\u093f\u0915 \u0905\u092d\u093f\u0915\u094d\u0930\u093f\u092f\u093e \u0915\u0947 \u0932\u093f\u090f , \u092f\u0926\u093f \u0926\u0930 \u0938\u094d\u0925\u093f\u0930\u093e\u0902\u0915 k \u0939\u0948 , \u0924\u094b \u0905\u092d\u093f\u0915\u094d\u0930\u093f\u092f\u093e \u0915\u0940 \u0905\u0930\u094d\u0927 - \u0906\u092f\u0941 (t1/2) \u0915\u093f\u0938 \u0935\u094d\u092f\u0902\u091c\u0915 \u0926\u094d\u0935\u093e\u0930\u093e \u0926\u0940 \u091c\u093e\u0924\u0940 \u0939\u0948 ?","options":["0.693 / k","k / 0.693","1 / k",""],"answer":"1","solution":"For a first-order reaction, the half-life ( ) is entirely independent of the initial concentration of the reactant. It is calculated using the formula = ln(2) / k, which mathematically approximates to 0.693 / k. Additional Info (a) This is the standard derived formula for first-order radioactive decay and chemical kinetics. (b) This is an inverted, incorrect formula. (c) 1 / k relates to the time constant or mean lifetime ( ) of the reaction. (d) This is an incorrect multiplication formula. Positive Mark: 0.8 Negative Mark: 0"},{"id":"84888","q":"7. Under the Biomedical Waste Management Rules, 2016, discarded and broken glass ampoules and medicine vials must be disposed of in which specific container? \u092c\u093e\u092f\u094b\u092e\u0947\u0921\u093f\u0915\u0932 \u0905\u092a\u0936\u093f\u0937\u094d\u091f \u092a\u094d\u0930\u092c\u0902\u0927\u0928 \u0928\u093f\u092f\u092e , 2016 \u0915\u0947 \u0924\u0939\u0924 , \u092b\u0947\u0902\u0915\u0947 \u0917\u090f \u0914\u0930 \u091f\u0942\u091f\u0947 \u0939\u0941\u090f \u0915\u093e\u0902\u091a \u0915\u0947 \u090f\u092e\u094d\u092a\u094d\u092f\u0942\u0932\u094d\u0938 \u0914\u0930 \u0926\u0935\u093e \u0915\u0940 \u0936\u0940\u0936\u093f\u092f\u094b\u0902 \u0915\u094b \u0915\u093f\u0938 \u0935\u093f\u0936\u093f\u0937\u094d\u091f \u0915\u0902\u091f\u0947\u0928\u0930 \u092e\u0947\u0902 \u0928\u093f\u092a\u091f\u093e\u092f\u093e \u091c\u093e\u0928\u093e \u091a\u093e\u0939\u093f\u090f ?","options":["Red plastic bag ( \u0932\u093e\u0932 \u092a\u094d\u0932\u093e\u0938\u094d\u091f\u093f\u0915 \u092c\u0948\u0917 )","Yellow plastic bag ( \u092a\u0940\u0932\u093e \u092a\u094d\u0932\u093e\u0938\u094d\u091f\u093f\u0915 \u092c\u0948\u0917 )","Blue cardboard box / puncture-proof container ( \u0928\u0940\u0932\u093e \u0915\u093e\u0930\u094d\u0921\u092c\u094b\u0930\u094d\u0921 \u092c\u0949\u0915\u094d\u0938 / \u092a\u0902\u091a\u0930 - \u092a\u094d\u0930\u0942\u092b \u0915\u0902\u091f\u0947\u0928\u0930 )","White translucent container ( \u0938\u092b\u0947\u0926 \u092a\u093e\u0930\u092d\u093e\u0938\u0940 \u0915\u0902\u091f\u0947\u0928\u0930 )"],"answer":"3","solution":"According to the Bio-Medical Waste Management Rules of 2016, broken or discarded and contaminated glass articles, including medicine vials and ampoules, must be segregated into Blue colored, puncture-proof boxes or containers to prevent laceration injuries to sanitation workers. Additional Info (a) Red bags are used for contaminated recyclable plastics (syringes without needles, IV sets). (b) Yellow bags are for human anatomical, highly infectious, and pharmaceutical waste. (c) Blue bins ensure glass shards do not pierce standard garbage bags. (d) White translucent containers are strictly reserved for sharp metal waste like needles and scalpel blades. Positive Mark: 0.8 Negative Mark: 0"},{"id":"84889","q":"8. The term 'Open Market Operations' (OMO) used by the Reserve Bank of India strictly refers to the: \u092d\u093e\u0930\u0924\u0940\u092f \u0930\u093f\u091c\u093c\u0930\u094d\u0935 \u092c\u0948\u0902\u0915 \u0926\u094d\u0935\u093e\u0930\u093e \u0909\u092a\u092f\u094b\u0917 \u0915\u093f\u090f \u091c\u093e\u0928\u0947 \u0935\u093e\u0932\u0947 ' \u0913\u092a\u0928 \u092e\u093e\u0930\u094d\u0915\u0947\u091f \u0911\u092a\u0930\u0947\u0936\u0902\u0938 ' (OMO) \u0936\u092c\u094d\u0926 \u0915\u093e \u0915\u0921\u093c\u093e\u0908 \u0938\u0947 \u0924\u093e\u0924\u094d\u092a\u0930\u094d\u092f \u0939\u0948 :","options":["Buying and selling of foreign exchange in the international market ( \u0905\u0902\u0924\u0930\u0930\u093e\u0937\u094d\u091f\u094d\u0930\u0940\u092f \u092c\u093e\u091c\u093e\u0930 \u092e\u0947\u0902 \u0935\u093f\u0926\u0947\u0936\u0940 \u092e\u0941\u0926\u094d\u0930\u093e \u0915\u0940 \u0916\u0930\u0940\u0926 \u0914\u0930 \u092c\u093f\u0915\u094d\u0930\u0940 )","Auctioning of non-performing assets of commercial banks ( \u0935\u093e\u0923\u093f\u091c\u094d\u092f\u093f\u0915 \u092c\u0948\u0902\u0915\u094b\u0902 \u0915\u0940 \u0917\u0948\u0930 - \u0928\u093f\u0937\u094d\u092a\u093e\u0926\u093f\u0924 \u0938\u0902\u092a\u0924\u094d\u0924\u093f\u092f\u094b\u0902 \u0915\u0940 \u0928\u0940\u0932\u093e\u092e\u0940 )","Buying and selling of government securities to regulate systemic liquidity ( \u092a\u094d\u0930\u0923\u093e\u0932\u0940\u0917\u0924 \u0924\u0930\u0932\u0924\u093e \u0915\u094b \u0928\u093f\u092f\u0902\u0924\u094d\u0930\u093f\u0924 \u0915\u0930\u0928\u0947 \u0915\u0947 \u0932\u093f\u090f \u0938\u0930\u0915\u093e\u0930\u0940 \u092a\u094d\u0930\u0924\u093f\u092d\u0942\u0924\u093f\u092f\u094b\u0902 \u0915\u0940 \u0916\u0930\u0940\u0926 \u0914\u0930 \u092c\u093f\u0915\u094d\u0930\u0940 )","Issuance of sovereign gold bonds to the public ( \u091c\u0928\u0924\u093e \u0915\u094b \u0938\u0949\u0935\u0930\u0947\u0928 \u0917\u094b\u0932\u094d\u0921 \u092c\u0949\u0928\u094d\u0921 \u091c\u093e\u0930\u0940 \u0915\u0930\u0928\u093e )"],"answer":"3","solution":"Open Market Operations (OMO) refers to the continuous buying and selling of government securities (G-Secs) by the central bank (RBI) in the open market to manage the overall money supply, control inflation, and regulate systemic liquidity conditions. Additional Info (a) Forex interventions are conducted to manage exchange rate volatility, not as standard OMOs. (b) NPA auctioning is done by banks or Asset Reconstruction Companies (ARCs). (c) Selling securities absorbs liquidity (contracts money supply); buying securities injects liquidity. (d) Sovereign Gold Bonds are government debt instruments, but their direct issuance is not an OMO. Positive Mark: 0.8 Negative Mark: 0"},{"id":"84890","q":"9. In the photoelectric effect, the minimum energy required to eject an electron from the surface of a metal is called the: ( \u092a\u094d\u0930\u0915\u093e\u0936 \u0935\u0948\u0926\u094d\u092f\u0941\u0924 \u092a\u094d\u0930\u092d\u093e\u0935 (photoelectric effect) \u092e\u0947\u0902 , \u0915\u093f\u0938\u0940 \u0927\u093e\u0924\u0941 \u0915\u0940 \u0938\u0924\u0939 \u0938\u0947 \u0907\u0932\u0947\u0915\u094d\u091f\u094d\u0930\u0949\u0928 \u0915\u094b \u092c\u093e\u0939\u0930 \u0928\u093f\u0915\u093e\u0932\u0928\u0947 \u0915\u0947 \u0932\u093f\u090f \u0906\u0935\u0936\u094d\u092f\u0915 \u0928\u094d\u092f\u0942\u0928\u0924\u092e \u090a\u0930\u094d\u091c\u093e \u0915\u094b \u0915\u094d\u092f\u093e \u0915\u0939\u093e \u091c\u093e\u0924\u093e \u0939\u0948 ?)","options":["Stopping potential ( \u0938\u094d\u091f\u0949\u092a\u093f\u0902\u0917 \u092a\u094b\u091f\u0947\u0902\u0936\u093f\u092f\u0932 )","Kinetic energy maximum ( \u0905\u0927\u093f\u0915\u0924\u092e \u0917\u0924\u093f\u091c \u090a\u0930\u094d\u091c\u093e )","Work function ( \u0915\u093e\u0930\u094d\u092f \u092b\u0932\u0928 )","Threshold frequency ( \u0926\u0947\u0939\u0932\u0940 \u0906\u0935\u0943\u0924\u094d\u0924\u093f )"],"answer":"3","solution":"The work function ( or W) of a metal is the minimum amount of thermodynamic energy (typically measured in electron-volts) required to remove an electron from the surface of a solid material into a vacuum during the photoelectric effect. Additional Info (a) Stopping potential is the negative voltage required to stop the most energetic photoelectrons from reaching the anode. (b) Maximum kinetic energy is the energy of the ejected electron minus the work function. (c) Work function is an intrinsic property unique to each specific metal. (d) Threshold frequency is the minimum frequency of incident light required to eject an electron, directly related to the work function Positive Mark: 0.8 Negative Mark: 0"},{"id":"84891","q":"10. The World Expo 2025, operating under the highly anticipated theme \"Designing Future Society for Our Lives\", is hosted by which global city? \" \u0939\u092e\u093e\u0930\u0947 \u091c\u0940\u0935\u0928 \u0915\u0947 \u0932\u093f\u090f \u092d\u0935\u093f\u0937\u094d\u092f \u0915\u0947 \u0938\u092e\u093e\u091c \u0915\u094b \u0921\u093f\u091c\u093e\u0907\u0928 \u0915\u0930\u0928\u093e \" \u0915\u0947 \u092c\u0939\u0941\u092a\u094d\u0930\u0924\u0940\u0915\u094d\u0937\u093f\u0924 \u0935\u093f\u0937\u092f \u0915\u0947 \u0924\u0939\u0924 \u0938\u0902\u091a\u093e\u0932\u093f\u0924 \u0935\u0930\u094d\u0932\u094d\u0921 \u090f\u0915\u094d\u0938\u092a\u094b 2025 \u0915\u0940 \u092e\u0947\u091c\u092c\u093e\u0928\u0940 \u0915\u093f\u0938 \u0935\u0948\u0936\u094d\u0935\u093f\u0915 \u0936\u0939\u0930 \u0926\u094d\u0935\u093e\u0930\u093e \u0915\u0940 \u091c\u093e \u0930\u0939\u0940 \u0939\u0948 ?","options":["Dubai, UAE","Osaka, Japan","Milan, Italy","Paris, France"],"answer":"2","solution":"The World Expo 2025 is scheduled to be held in Osaka, Japan. The overarching theme, \"Designing Future Society for Our Lives,\" focuses heavily on sustainable development goals, future health technologies, and interconnected global societies. Additional Info (a) Dubai hosted the previous World Expo 2020 (held in 2021/2022). (b) Osaka previously hosted the highly successful and historic Expo '70. (c) Milan hosted the World Expo in 2015. (d) Paris hosted several historic expos (including 1889, for which the Eiffel Tower was built), but is not the 2025 host. Positive Mark: 0.8 Negative Mark: 0"},{"id":"84892","q":"11. In computer networking, the primary operational difference between TCP (Transmission Control Protocol) and UDP (User Datagram Protocol) is that: \u0915\u0902\u092a\u094d\u092f\u0942\u091f\u0930 \u0928\u0947\u091f\u0935\u0930\u094d\u0915\u093f\u0902\u0917 \u092e\u0947\u0902 , TCP \u0914\u0930 UDP \u0915\u0947 \u092c\u0940\u091a \u092a\u094d\u0930\u093e\u0925\u092e\u093f\u0915 \u092a\u0930\u093f\u091a\u093e\u0932\u0928 \u0905\u0902\u0924\u0930 \u092f\u0939 \u0939\u0948 \u0915\u093f :","options":["TCP operates at the Application layer; UDP operates at the Network layer (TCP \u090f\u092a\u094d\u0932\u0940\u0915\u0947\u0936\u0928 \u0932\u0947\u092f\u0930 \u092a\u0930 \u0915\u093e\u0930\u094d\u092f \u0915\u0930\u0924\u093e \u0939\u0948 ; UDP \u0928\u0947\u091f\u0935\u0930\u094d\u0915 \u0932\u0947\u092f\u0930 \u092a\u0930 \u0915\u093e\u0930\u094d\u092f \u0915\u0930\u0924\u093e \u0939\u0948 )","TCP is connectionless and fast; UDP is connection-oriented and reliable (TCP \u0915\u0928\u0947\u0915\u094d\u0936\u0928 \u0930\u0939\u093f\u0924 \u0914\u0930 \u0924\u0947\u091c \u0939\u0948 ; UDP \u0915\u0928\u0947\u0915\u094d\u0936\u0928 - \u0909\u0928\u094d\u092e\u0941\u0916 \u0914\u0930 \u0935\u093f\u0936\u094d\u0935\u0938\u0928\u0940\u092f \u0939\u0948 )","TCP is connection-oriented and guarantees delivery; UDP is connectionless and does not guarantee delivery (TCP \u0915\u0928\u0947\u0915\u094d\u0936\u0928 - \u0909\u0928\u094d\u092e\u0941\u0916 \u0939\u0948 \u0914\u0930 \u0921\u093f\u0932\u0940\u0935\u0930\u0940 \u0915\u0940 \u0917\u093e\u0930\u0902\u091f\u0940 \u0926\u0947\u0924\u093e \u0939\u0948 ; UDP \u0915\u0928\u0947\u0915\u094d\u0936\u0928 \u0930\u0939\u093f\u0924 \u0939\u0948 \u0914\u0930 \u0921\u093f\u0932\u0940\u0935\u0930\u0940 \u0915\u0940 \u0917\u093e\u0930\u0902\u091f\u0940 \u0928\u0939\u0940\u0902 \u0926\u0947\u0924\u093e \u0939\u0948 )","TCP is used exclusively for wireless networks; UDP is used for wired networks (TCP \u0915\u093e \u0909\u092a\u092f\u094b\u0917 \u0935\u093f\u0936\u0947\u0937 \u0930\u0942\u092a \u0938\u0947 \u0935\u093e\u092f\u0930\u0932\u0947\u0938 \u0928\u0947\u091f\u0935\u0930\u094d\u0915 \u0915\u0947 \u0932\u093f\u090f \u0915\u093f\u092f\u093e \u091c\u093e\u0924\u093e \u0939\u0948 ; UDP \u0915\u093e \u0909\u092a\u092f\u094b\u0917 \u0935\u093e\u092f\u0930\u094d\u0921 \u0928\u0947\u091f\u0935\u0930\u094d\u0915 \u0915\u0947 \u0932\u093f\u090f \u0915\u093f\u092f\u093e \u091c\u093e\u0924\u093e \u0939\u0948 )"],"answer":"3","solution":"TCP is a connection-oriented protocol that establishes a reliable, error-checked data stream (via a three-way handshake) and guarantees packet delivery. UDP is a connectionless protocol that sends data packets (datagrams) without establishing a connection or guaranteeing delivery, making it faster but less reliable. Additional Info (a) Both TCP and UDP operate at the Transport layer (Layer 4) of the OSI model. (b) The definitions here are inverted. (c) TCP is used for web browsing and emails; UDP is used for live video streaming and gaming where speed is preferred over perfect accuracy. (d) Both protocols are used across wired and wireless networks. Positive Mark: 0.8 Negative Mark: 0"},{"id":"84893","q":"12. The Tropic of Cancer passes through the middle of India. Which of the following Indian rivers is crossed twice by the Tropic of Cancer? ( \u0915\u0930\u094d\u0915 \u0930\u0947\u0916\u093e \u092d\u093e\u0930\u0924 \u0915\u0947 \u092e\u0927\u094d\u092f \u0938\u0947 \u0939\u094b\u0915\u0930 \u0917\u0941\u091c\u0930\u0924\u0940 \u0939\u0948\u0964 \u0928\u093f\u092e\u094d\u0928\u0932\u093f\u0916\u093f\u0924 \u092e\u0947\u0902 \u0938\u0947 \u0915\u093f\u0938 \u092d\u093e\u0930\u0924\u0940\u092f \u0928\u0926\u0940 \u0915\u094b \u0915\u0930\u094d\u0915 \u0930\u0947\u0916\u093e \u0926\u094b \u092c\u093e\u0930 \u092a\u093e\u0930 \u0915\u0930\u0924\u0940 \u0939\u0948 ?)","options":["Narmada ( \u0928\u0930\u094d\u092e\u0926\u093e )","Tapi ( \u0924\u093e\u092a\u094d\u0924\u0940 )","Mahi ( \u092e\u093e\u0939\u0940 )","Sabarmati ( \u0938\u093e\u092c\u0930\u092e\u0924\u0940 )"],"answer":"3","solution":"The Mahi River is the only river in India that cuts across the Tropic of Cancer twice. It originates in Madhya Pradesh, flows northwards crossing the Tropic, then turns southwest into Gujarat, crossing it a second time before draining into the Arabian Sea. Additional Info (a) The Narmada flows generally parallel to and strictly south of the Tropic of Cancer. (b) The Tapi flows further south of the Narmada river. (c) The Mahi basin spans Madhya Pradesh, Rajasthan, and Gujarat. (d) The Sabarmati originates in the Aravallis and flows steadily southwards. Positive Mark: 0.8 Negative Mark: 0"},{"id":"84894","q":"13. Which ancient Indian text is a foundational treatise on statecraft, economic policy, and military strategy? ( \u0915\u094c\u0928 \u0938\u093e \u092a\u094d\u0930\u093e\u091a\u0940\u0928 \u092d\u093e\u0930\u0924\u0940\u092f \u0917\u094d\u0930\u0902\u0925 \u0936\u093e\u0938\u0928 \u0915\u0932\u093e , \u0906\u0930\u094d\u0925\u093f\u0915 \u0928\u0940\u0924\u093f \u0914\u0930 \u0938\u0948\u0928\u094d\u092f \u0930\u0923\u0928\u0940\u0924\u093f \u092a\u0930 \u090f\u0915 \u0906\u0927\u093e\u0930\u092d\u0942\u0924 \u0917\u094d\u0930\u0902\u0925 \u0939\u0948 ?)","options":["Manusmriti ( \u092e\u0928\u0941\u0938\u094d\u092e\u0943\u0924\u093f )","Arthashastra ( \u0905\u0930\u094d\u0925\u0936\u093e\u0938\u094d\u0924\u094d\u0930 )","Upanishads ( \u0909\u092a\u0928\u093f\u0937\u0926 )","Rigveda ( \u090b\u0917\u094d\u0935\u0947\u0926 )"],"answer":"2","solution":"The Arthashastra is a comprehensive ancient Indian Sanskrit treatise on statecraft, economic policy, and military strategy. It is traditionally attributed to Kautilya (also known as Chanakya or Vishnugupta), the prime minister of Emperor Chandragupta Maurya. Additional Info (a) Manusmriti is a prominent legal text and constitution among the Hindu Dharmashastras. (b) The Arthashastra details the duties of a king, diplomacy, war, taxation, and espionage. (c) The Upanishads are philosophical texts exploring the concepts of Brahman and Atman. (d) The Rigveda is an ancient collection of sacred Vedic Sanskrit hymns. Positive Mark: 0.8 Negative Mark: 0"},{"id":"84895","q":"14. To minimize water loss while maximizing photosynthesis, C4 plants (like maize and sugarcane) exhibit a specialized leaf anatomy characterized by prominent bundle sheath cells. This is known as: \u092a\u094d\u0930\u0915\u093e\u0936 \u0938\u0902\u0936\u094d\u0932\u0947\u0937\u0923 \u0915\u094b \u0905\u0927\u093f\u0915\u0924\u092e \u0915\u0930\u0924\u0947 \u0939\u0941\u090f \u092a\u093e\u0928\u0940 \u0915\u0947 \u0928\u0941\u0915\u0938\u093e\u0928 \u0915\u094b \u0915\u092e \u0915\u0930\u0928\u0947 \u0915\u0947 \u0932\u093f\u090f , C4 \u092a\u094c\u0927\u0947 ( \u091c\u0948\u0938\u0947 \u092e\u0915\u094d\u0915\u093e \u0914\u0930 \u0917\u0928\u094d\u0928\u093e ) \u090f\u0915 \u0935\u093f\u0936\u0947\u0937 \u092a\u0924\u094d\u0924\u0940 \u0936\u0930\u0940\u0930 \u0930\u091a\u0928\u093e \u092a\u094d\u0930\u0926\u0930\u094d\u0936\u093f\u0924 \u0915\u0930\u0924\u0947 \u0939\u0948\u0902 \u091c\u094b \u092a\u094d\u0930\u092e\u0941\u0916 \u092c\u0902\u0921\u0932 \u0906\u0935\u0930\u0923 \u0915\u094b\u0936\u093f\u0915\u093e\u0913\u0902 \u0926\u094d\u0935\u093e\u0930\u093e \u0935\u093f\u0936\u0947\u0937\u0924\u093e \u0939\u0948\u0964 \u0907\u0938\u0947 \u0915\u093f\u0938 \u0930\u0942\u092a \u092e\u0947\u0902 \u091c\u093e\u0928\u093e \u091c\u093e\u0924\u093e \u0939\u0948 ?","options":["Reticulate anatomy ( \u091c\u093e\u0932\u093f\u0915\u093e\u0935\u0924 \u0936\u0930\u0940\u0930 \u0930\u091a\u0928\u093e )","Krantz anatomy ( \u0915\u094d\u0930\u0948\u0928\u094d\u091c\u093c \u090f\u0928\u093e\u091f\u0949\u092e\u0940 )","Xerophytic anatomy ( \u091c\u093c\u0947\u0930\u094b\u092b\u093e\u0907\u091f\u093f\u0915 \u090f\u0928\u093e\u091f\u0949\u092e\u0940 )","Spongy mesophyll anatomy ( \u0938\u094d\u092a\u0902\u091c\u0940 \u092e\u0947\u0938\u094b\u092b\u093f\u0932 \u090f\u0928\u093e\u091f\u0949\u092e\u0940 )"],"answer":"2","solution":"C4 plants possess a unique leaf structure called \"Kranz anatomy\" (Kranz means \"wreath\" in German). In this structure, the vascular bundles are surrounded by two distinct rings of cells: an inner ring of bundle sheath cells and an outer ring of mesophyll cells, optimizing the concentration of and minimizing photorespiration. Additional Info (a) Reticulate refers to the net-like vein pattern found in dicot leaves. (b) Kranz anatomy enables C4 plants to be highly efficient in hot, dry climates. (c) Xerophytic anatomy includes adaptations like sunken stomata and thick cuticles, but not necessarily the C4 Kranz mechanism. (d) Spongy mesophyll is standard leaf tissue allowing gas exchange, lacking this specific wreath-like organization. Positive Mark: 0.8 Negative Mark: 0"},{"id":"84896","q":"15. The historic 'Sampoorna Kranti' (Total Revolution) movement in 1974, which had a profound impact on Indian national politics, was launched in Bihar by: 1974 \u092e\u0947\u0902 \u0910\u0924\u093f\u0939\u093e\u0938\u093f\u0915 ' \u0938\u0902\u092a\u0942\u0930\u094d\u0923 \u0915\u094d\u0930\u093e\u0902\u0924\u093f ' \u0906\u0902\u0926\u094b\u0932\u0928 , \u091c\u093f\u0938\u0915\u093e \u092d\u093e\u0930\u0924\u0940\u092f \u0930\u093e\u0937\u094d\u091f\u094d\u0930\u0940\u092f \u0930\u093e\u091c\u0928\u0940\u0924\u093f \u092a\u0930 \u0917\u0939\u0930\u093e \u092a\u094d\u0930\u092d\u093e\u0935 \u092a\u0921\u093c\u093e , \u092c\u093f\u0939\u093e\u0930 \u092e\u0947\u0902 \u0915\u093f\u0938\u0915\u0947 \u0926\u094d\u0935\u093e\u0930\u093e \u0936\u0941\u0930\u0942 \u0915\u093f\u092f\u093e \u0917\u092f\u093e \u0925\u093e ?","options":["Karpoori Thakur ( \u0915\u0930\u094d\u092a\u0942\u0930\u0940 \u0920\u093e\u0915\u0941\u0930 )","Ram Manohar Lohia ( \u0930\u093e\u092e \u092e\u0928\u094b\u0939\u0930 \u0932\u094b\u0939\u093f\u092f\u093e )","Jayaprakash Narayan ( \u091c\u092f\u092a\u094d\u0930\u0915\u093e\u0936 \u0928\u093e\u0930\u093e\u092f\u0923 )","Jagjivan Ram ( \u091c\u0917\u091c\u0940\u0935\u0928 \u0930\u093e\u092e )"],"answer":"3","solution":"The 'Sampoorna Kranti' or Total Revolution was launched in 1974 by the veteran socialist leader Jayaprakash Narayan (JP). It began as a student movement in Bihar protesting against corruption, unemployment, and inflation, and quickly escalated into a massive national movement against the Indira Gandhi-led central government. Additional Info (a) Karpoori Thakur was a prominent socialist leader and former Chief Minister of Bihar. (b) Ram Manohar Lohia was a key socialist thinker who passed away in 1967. (c) JP's call at Gandhi Maidan, Patna, demanded comprehensive social, economic, and political transformation. (d) Jagjivan Ram was a prominent Dalit leader and long-serving cabinet minister. Positive Mark: 0.8 Negative Mark: 0"},{"id":"84897","q":"16. Lenz's Law of electromagnetic induction is a direct consequence of the law of conservation of: ( \u0935\u093f\u0926\u094d\u092f\u0941\u0924 \u091a\u0941\u092e\u094d\u092c\u0915\u0940\u092f \u092a\u094d\u0930\u0947\u0930\u0923 \u0915\u093e \u0932\u0947\u0928\u094d\u091c\u093c \u0915\u093e \u0928\u093f\u092f\u092e (Lenz's Law) \u0915\u093f\u0938\u0915\u0947 \u0938\u0902\u0930\u0915\u094d\u0937\u0923 \u0915\u0947 \u0928\u093f\u092f\u092e \u0915\u093e \u092a\u094d\u0930\u0924\u094d\u092f\u0915\u094d\u0937 \u092a\u0930\u093f\u0923\u093e\u092e \u0939\u0948 ?)","options":["Charge ( \u0906\u0935\u0947\u0936 )","Momentum ( \u0938\u0902\u0935\u0947\u0917 )","Mass ( \u0926\u094d\u0930\u0935\u094d\u092f\u092e\u093e\u0928 )","Energy ( \u090a\u0930\u094d\u091c\u093e )"],"answer":"4","solution":"Lenz's Law states that the direction of an induced electric current is always such that it opposes the change in magnetic flux that produced it. This opposition requires mechanical work to be done, which is then converted into electrical energy, perfectly demonstrating the law of conservation of energy. Additional Info (a) Kirchhoff's Current Law (KCL) is based on the conservation of charge. (b) Newton's laws address the conservation of momentum. (c) Conservation of mass is central to chemical stoichiometry. (d) If the induced current aided the motion instead of opposing it, it would create infinite energy out of nowhere, violating thermodynamics. Positive Mark: 0.8 Negative Mark: 0"},{"id":"84898","q":"17. The 'Kyoto Protocol' was an international treaty that primarily aimed to: (' \u0915\u094d\u092f\u094b\u091f\u094b \u092a\u094d\u0930\u094b\u091f\u094b\u0915\u0949\u0932 ' \u090f\u0915 \u0905\u0902\u0924\u0930\u0930\u093e\u0937\u094d\u091f\u094d\u0930\u0940\u092f \u0938\u0902\u0927\u093f \u0925\u0940 \u091c\u093f\u0938\u0915\u093e \u092e\u0941\u0916\u094d\u092f \u0909\u0926\u094d\u0926\u0947\u0936\u094d\u092f \u0925\u093e :)","options":["Protect the ozone layer ( \u0913\u091c\u094b\u0928 \u092a\u0930\u0924 \u0915\u0940 \u0930\u0915\u094d\u0937\u093e \u0915\u0930\u0928\u093e )","Reduce greenhouse gas emissions ( \u0917\u094d\u0930\u0940\u0928\u0939\u093e\u0909\u0938 \u0917\u0948\u0938 \u0909\u0924\u094d\u0938\u0930\u094d\u091c\u0928 \u0915\u094b \u0915\u092e \u0915\u0930\u0928\u093e )","Regulate international trade in endangered species ( \u0932\u0941\u092a\u094d\u0924\u092a\u094d\u0930\u093e\u092f \u092a\u094d\u0930\u091c\u093e\u0924\u093f\u092f\u094b\u0902 \u092e\u0947\u0902 \u0905\u0902\u0924\u0930\u094d\u0930\u093e\u0937\u094d\u091f\u094d\u0930\u0940\u092f \u0935\u094d\u092f\u093e\u092a\u093e\u0930 \u0915\u094b \u0935\u093f\u0928\u093f\u092f\u092e\u093f\u0924 \u0915\u0930\u0928\u093e )","Prevent marine plastic pollution ( \u0938\u092e\u0941\u0926\u094d\u0930\u0940 \u092a\u094d\u0932\u093e\u0938\u094d\u091f\u093f\u0915 \u092a\u094d\u0930\u0926\u0942\u0937\u0923 \u0915\u094b \u0930\u094b\u0915\u0928\u093e )"],"answer":"2","solution":"The Kyoto Protocol (adopted in 1997, entered into force in 2005) was an international treaty extending the 1992 United Nations Framework Convention on Climate Change (UNFCCC). It committed industrialized nations to reduce greenhouse gas emissions based on the scientific consensus regarding global warming. Additional Info (a) The Montreal Protocol protects the ozone layer. (b) It established legally binding emission reduction targets under the principle of \"common but differentiated responsibilities.\" (c) CITES regulates the trade of endangered flora and fauna. (d) MARPOL and the UN Convention on the Law of the Sea handle marine pollution. Positive Mark: 0.8 Negative Mark: 0"},{"id":"84899","q":"18. Which Constitutional Amendment Act added the 'Ninth Schedule' to the Indian Constitution to protect land reform laws from judicial review? ( \u0915\u093f\u0938 \u0938\u0902\u0935\u093f\u0927\u093e\u0928 \u0938\u0902\u0936\u094b\u0927\u0928 \u0905\u0927\u093f\u0928\u093f\u092f\u092e \u0928\u0947 \u092d\u0942\u092e\u093f \u0938\u0941\u0927\u093e\u0930 \u0915\u093e\u0928\u0942\u0928\u094b\u0902 \u0915\u094b \u0928\u094d\u092f\u093e\u092f\u093f\u0915 \u0938\u092e\u0940\u0915\u094d\u0937\u093e \u0938\u0947 \u092c\u091a\u093e\u0928\u0947 \u0915\u0947 \u0932\u093f\u090f \u092d\u093e\u0930\u0924\u0940\u092f \u0938\u0902\u0935\u093f\u0927\u093e\u0928 \u092e\u0947\u0902 ' \u0928\u094c\u0935\u0940\u0902 \u0905\u0928\u0941\u0938\u0942\u091a\u0940 ' \u091c\u094b\u0921\u093c\u0940 ?)","options":["First Amendment (1951) ( \u092a\u0939\u0932\u093e \u0938\u0902\u0936\u094b\u0927\u0928 , 1951)","Fourth Amendment (1955) ( \u091a\u094c\u0925\u093e \u0938\u0902\u0936\u094b\u0927\u0928 , 1955)","Seventh Amendment (1956) ( \u0938\u093e\u0924\u0935\u093e\u0902 \u0938\u0902\u0936\u094b\u0927\u0928 , 1956)","Forty-Second Amendment (1976) (42 \u0935\u093e\u0902 \u0938\u0902\u0936\u094b\u0927\u0928 , 1976)"],"answer":"1","solution":"The First Amendment Act of 1951 introduced the Ninth Schedule to the Indian Constitution. It was explicitly created to protect progressive state agrarian and land reform laws from being struck down by courts on the grounds that they violated Fundamental Rights (particularly the Right to Property). Additional Info (a) It also added Article 31B, which states that no act placed in the Ninth Schedule can be voided for violating fundamental rights. (b) The Fourth Amendment further restricted property rights. (c) The Seventh Amendment implemented the reorganization of states on linguistic lines. (d) The 42nd Amendment is known as the \"Mini Constitution.\" Positive Mark: 0.8 Negative Mark: 0"},{"id":"84900","q":"19. The ICC Women\u2019s Cricket World Cup 2025 is scheduled to be hosted by: (ICC \u092e\u0939\u093f\u0932\u093e \u0915\u094d\u0930\u093f\u0915\u0947\u091f \u0935\u093f\u0936\u094d\u0935 \u0915\u092a 2025 \u0915\u0940 \u092e\u0947\u091c\u092c\u093e\u0928\u0940 \u0915\u093f\u0938\u0915\u0947 \u0926\u094d\u0935\u093e\u0930\u093e \u0915\u0940 \u091c\u093e\u0928\u0940 \u0928\u093f\u0930\u094d\u0927\u093e\u0930\u093f\u0924 \u0939\u0948 ?)","options":["Australia ( \u0911\u0938\u094d\u091f\u094d\u0930\u0947\u0932\u093f\u092f\u093e )","England ( \u0907\u0902\u0917\u094d\u0932\u0948\u0902\u0921 )","India ( \u092d\u093e\u0930\u0924 )","South Africa ( \u0926\u0915\u094d\u0937\u093f\u0923 \u0905\u092b\u094d\u0930\u0940\u0915\u093e )"],"answer":"3","solution":"India is scheduled to host the ICC Women's Cricket World Cup in 2025. This prestigious 50-over tournament's return to India underscores the tremendous growth, popularity, and commercial viability of women's cricket in the subcontinent. Additional Info (a) Australia hosted the Women's T20 World Cup in 2020. (b) England hosted the 2017 Women's World Cup. (c) India previously hosted the Women's World Cup in 1978, 1997, and 2013. (d) South Africa hosted the ICC Women's T20 World Cup in 2023. Positive Mark: 0.8 Negative Mark: 0"},{"id":"84901","q":"20. In Database Management Systems (DBMS), the ACID properties ensure reliable transaction processing. What does the \"I\" in ACID stand for? \u0921\u0947\u091f\u093e\u092c\u0947\u0938 \u092e\u0948\u0928\u0947\u091c\u092e\u0947\u0902\u091f \u0938\u093f\u0938\u094d\u091f\u092e (DBMS) \u092e\u0947\u0902 , ACID \u0917\u0941\u0923 \u0935\u093f\u0936\u094d\u0935\u0938\u0928\u0940\u092f \u0932\u0947\u0928\u0926\u0947\u0928 \u092a\u094d\u0930\u0938\u0902\u0938\u094d\u0915\u0930\u0923 \u0938\u0941\u0928\u093f\u0936\u094d\u091a\u093f\u0924 \u0915\u0930\u0924\u0947 \u0939\u0948\u0902\u0964 ACID \u092e\u0947\u0902 \"I\" \u0915\u093e \u0915\u094d\u092f\u093e \u0905\u0930\u094d\u0925 \u0939\u0948 ?","options":["Integrity ( \u0907\u0902\u091f\u0940\u0917\u094d\u0930\u093f\u091f\u0940 )","Isolation ( \u0906\u0907\u0938\u094b\u0932\u0947\u0936\u0928 )","Indexing ( \u0907\u0902\u0921\u0947\u0915\u094d\u0938\u093f\u0902\u0917 )","Instantiation ( \u0907\u0902\u0938\u094d\u091f\u0947\u0902\u0936\u093f\u090f\u0936\u0928 )"],"answer":"2","solution":"In DBMS, ACID stands for Atomicity, Consistency, Isolation, and Durability. Isolation ensures that concurrent execution of multiple transactions leaves the database in the same state that would have been obtained if the transactions were executed sequentially. Additional Info (a) Integrity is managed via primary/foreign keys and constraints, but it is not the \"I\" in ACID. (b) Isolation prevents active transactions from interfering with one another (preventing issues like \"dirty reads\"). (c) Indexing is a performance optimization technique to speed up queries. (d) Instantiation is an Object-Oriented Programming concept. Positive Mark: 0.8 Negative Mark: 0"},{"id":"84902","q":"21. According to Valence Shell Electron Pair Repulsion (VSEPR) theory and hybridization principles, the hybridization state of sulfur in Sulfur hexafluoride ( ) is: VSEPR \u0938\u093f\u0926\u094d\u0927\u093e\u0902\u0924 \u0914\u0930 \u0938\u0902\u0915\u0930\u0923 (hybridization) \u0938\u093f\u0926\u094d\u0927\u093e\u0902\u0924\u094b\u0902 \u0915\u0947 \u0905\u0928\u0941\u0938\u093e\u0930 , \u0938\u0932\u094d\u092b\u0930 \u0939\u0947\u0915\u094d\u0938\u093e\u092b\u094d\u0932\u094b\u0930\u093e\u0907\u0921 (SF6) \u092e\u0947\u0902 \u0938\u0932\u094d\u092b\u0930 \u0915\u0940 \u0938\u0902\u0915\u0930\u0923 \u0905\u0935\u0938\u094d\u0925\u093e \u0915\u094d\u092f\u093e \u0939\u0948 ?","options":["","","",""],"answer":"3","solution":"In Sulfur hexafluoride ( ), the central sulfur atom is bonded to six fluorine atoms with zero lone pairs. To form six identical bonds, sulfur expands its octet and utilizes its 3s, 3p, and two 3d orbitals to form six hybrid orbitals, resulting in a perfect octahedral molecular geometry. Additional Info (a) hybridization creates a tetrahedral geometry (e.g., ). (b) hybridization creates a trigonal bipyramidal geometry (e.g., ). (c) The configuration minimizes repulsion between the six fluorine atoms. (d) is not a standard, stable hybridization state. Positive Mark: 0.8 Negative Mark: 0"},{"id":"84903","q":"22. The ancient and highly revered university of Vikramashila was established on the banks of which river? \u0935\u093f\u0915\u094d\u0930\u092e\u0936\u093f\u0932\u093e \u0915\u093e \u092a\u094d\u0930\u093e\u091a\u0940\u0928 \u0914\u0930 \u0905\u0924\u094d\u092f\u0927\u093f\u0915 \u0936\u094d\u0930\u0926\u094d\u0927\u0947\u092f \u0935\u093f\u0936\u094d\u0935\u0935\u093f\u0926\u094d\u092f\u093e\u0932\u092f \u0915\u093f\u0938 \u0928\u0926\u0940 \u0915\u0947 \u0924\u091f \u092a\u0930 \u0938\u094d\u0925\u093e\u092a\u093f\u0924 \u0915\u093f\u092f\u093e \u0917\u092f\u093e \u0925\u093e ?","options":["Ganga ( \u0917\u0902\u0917\u093e )","Kosi ( \u0915\u094b\u0938\u0940 )","Gandak ( \u0917\u0902\u0921\u0915 )","Son ( \u0938\u094b\u0928 )"],"answer":"1","solution":"Vikramashila University, established by the Pala King Dharmapala in the late 8th or early 9th century, was situated directly on the banks of the river Ganga in the present-day Bhagalpur district of Bihar. Additional Info (a) Its strategic location on the Ganga facilitated easy transport and made it a prominent cultural and religious center. (b) The Kosi is known as the Sorrow of Bihar, flowing further north. (c) The Gandak flows into the Ganga near Hajipur. (d) The Son River joins the Ganga near Patna. Positive Mark: 0.8 Negative Mark: 0"},{"id":"84904","q":"23. During the generation of an action potential in a human neuron, the rapid 'depolarization' phase is primarily caused by the: \u092e\u093e\u0928\u0935 \u0928\u094d\u092f\u0942\u0930\u0949\u0928 \u092e\u0947\u0902 \u090f\u0915\u094d\u0936\u0928 \u092a\u094b\u091f\u0947\u0902\u0936\u093f\u092f\u0932 (action potential) \u0915\u0947 \u0928\u093f\u0930\u094d\u092e\u093e\u0923 \u0915\u0947 \u0926\u094c\u0930\u093e\u0928 , \u0924\u0940\u0935\u094d\u0930 ' \u0935\u093f\u0927\u094d\u0930\u0941\u0935\u0923 ' (depolarization) \u091a\u0930\u0923 \u092e\u0941\u0916\u094d\u092f \u0930\u0942\u092a \u0938\u0947 \u0915\u093f\u0938\u0915\u0947 \u0915\u093e\u0930\u0923 \u0939\u094b\u0924\u093e \u0939\u0948 ?","options":["Efflux of Potassium ( ) ions ( \u092a\u094b\u091f\u0947\u0936\u093f\u092f\u092e (K+) \u0906\u092f\u0928\u094b\u0902 \u0915\u093e \u092c\u0939\u093f\u0930\u094d\u0935\u093e\u0939 )","Influx of Sodium ( ) ions ( \u0938\u094b\u0921\u093f\u092f\u092e (Na+) \u0906\u092f\u0928\u094b\u0902 \u0915\u093e \u092a\u094d\u0930\u0935\u093e\u0939 )","Influx of Calcium ( ) ions ( \u0915\u0948\u0932\u094d\u0936\u093f\u092f\u092e (Ca2+) \u0906\u092f\u0928\u094b\u0902 \u0915\u093e \u092a\u094d\u0930\u0935\u093e\u0939 )","Efflux of Chloride ( ) ions ( \u0915\u094d\u0932\u094b\u0930\u093e\u0907\u0921 (Cl-) \u0906\u092f\u0928\u094b\u0902 \u0915\u093e \u092c\u0939\u093f\u0930\u094d\u0935\u093e\u0939 )"],"answer":"2","solution":"During the depolarization phase of an action potential, voltage-gated sodium channels open rapidly. This allows a massive influx of positively charged Sodium ions ( ) into the neuron, rapidly changing the membrane potential from negative (resting state) to positive. Additional Info (a) The efflux of Potassium ( ) ions causes the subsequent repolarization phase. (b) This sodium influx is an all-or-nothing threshold response. (c) Calcium influx is vital for neurotransmitter release at the axon terminal, not the primary axonal depolarization. (d) Chloride influx generally causes hyperpolarization (inhibition) of the neuron. Positive Mark: 0.8 Negative Mark: 0"},{"id":"84905","q":"24. What is the minimum qualifying age for a person to be elected as the President of India? \u092d\u093e\u0930\u0924 \u0915\u0947 \u0930\u093e\u0937\u094d\u091f\u094d\u0930\u092a\u0924\u093f \u0915\u0947 \u0930\u0942\u092a \u092e\u0947\u0902 \u091a\u0941\u0928\u0947 \u091c\u093e\u0928\u0947 \u0915\u0947 \u0932\u093f\u090f \u0915\u093f\u0938\u0940 \u0935\u094d\u092f\u0915\u094d\u0924\u093f \u0915\u0940 \u0928\u094d\u092f\u0942\u0928\u0924\u092e \u0905\u0930\u094d\u0939\u0915 \u0906\u092f\u0941 \u0915\u093f\u0924\u0928\u0940 \u0939\u0948 ?","options":["25 years","30 years","35 years","40 years"],"answer":"3","solution":"According to Article 58 of the Indian Constitution, no person shall be eligible for election as President unless he is a citizen of India, has completed the age of 35 years, and is qualified for election as a member of the Lok Sabha. Additional Info (a) 25 years is the minimum age to be an MLA or a member of the Lok Sabha. (b) 30 years is the minimum age to be an MLC or a member of the Rajya Sabha. (c) 35 years is also the minimum age requirement for the Vice-President and State Governors. (d) 40 years is not a constitutional age requirement in India. Positive Mark: 0.8 Negative Mark: 0"},{"id":"84906","q":"25. Which of the following mountain ranges is structurally considered a 'Block Mountain'? \u0928\u093f\u092e\u094d\u0928\u0932\u093f\u0916\u093f\u0924 \u092e\u0947\u0902 \u0938\u0947 \u0915\u093f\u0938 \u092a\u0930\u094d\u0935\u0924 \u0936\u094d\u0930\u0943\u0902\u0916\u0932\u093e \u0915\u094b \u0938\u0902\u0930\u091a\u0928\u093e\u0924\u094d\u092e\u0915 \u0930\u0942\u092a \u0938\u0947 ' \u092c\u094d\u0932\u0949\u0915 \u092e\u093e\u0909\u0902\u091f\u0947\u0928 ' ( \u092d\u094d\u0930\u0902\u0936\u094b\u0924\u094d\u0925 \u092a\u0930\u094d\u0935\u0924 ) \u092e\u093e\u0928\u093e \u091c\u093e\u0924\u093e \u0939\u0948 ?","options":["Himalayas ( \u0939\u093f\u092e\u093e\u0932\u092f )","Alps ( \u0906\u0932\u094d\u092a\u094d\u0938 )","Vindhyas ( \u0935\u093f\u0902\u0927\u094d\u092f )","Andes ( \u090f\u0902\u0921\u0940\u091c )"],"answer":"3","solution":"The Vindhya Range in central India is a prominent example of a block mountain system (or horst). Block mountains are formed when large, massive blocks of the Earth's crust are uplifted vertically due to tensional tectonic forces and faulting. Additional Info (a) The Himalayas are young fold mountains formed by continental collision. (b) The Alps are also fold mountains. (c) The Vindhyas and the adjacent Satpura range form massive rift valleys (like the Narmada valley). (d) The Andes are fold-block and volcanic mountains created by oceanic-continental subduction. Positive Mark: 0.8 Negative Mark: 0"},{"id":"84907","q":"26. In modern cybersecurity, the RSA algorithm is a widely used cryptographic protocol. It operates on the principle of: \u0906\u0927\u0941\u0928\u093f\u0915 \u0938\u093e\u0907\u092c\u0930 \u0938\u0941\u0930\u0915\u094d\u0937\u093e \u092e\u0947\u0902 , RSA \u090f\u0932\u094d\u0917\u094b\u0930\u093f\u0926\u092e \u090f\u0915 \u0935\u094d\u092f\u093e\u092a\u0915 \u0930\u0942\u092a \u0938\u0947 \u0909\u092a\u092f\u094b\u0917 \u0915\u093f\u092f\u093e \u091c\u093e\u0928\u0947 \u0935\u093e\u0932\u093e \u0915\u094d\u0930\u093f\u092a\u094d\u091f\u094b\u0917\u094d\u0930\u093e\u092b\u093c\u093f\u0915 \u092a\u094d\u0930\u094b\u091f\u094b\u0915\u0949\u0932 \u0939\u0948\u0964 \u092f\u0939 \u0915\u093f\u0938 \u0938\u093f\u0926\u094d\u0927\u093e\u0902\u0924 \u092a\u0930 \u0915\u093e\u092e \u0915\u0930\u0924\u093e \u0939\u0948 ?","options":["Symmetric key encryption using a single shared private key ( \u090f\u0915\u0932 \u0938\u093e\u091d\u093e \u0928\u093f\u091c\u0940 \u0915\u0941\u0902\u091c\u0940 \u0915\u093e \u0909\u092a\u092f\u094b\u0917 \u0915\u0930\u0915\u0947 \u0938\u092e\u092e\u093f\u0924 \u0915\u0941\u0902\u091c\u0940 \u090f\u0928\u094d\u0915\u094d\u0930\u093f\u092a\u094d\u0936\u0928 )","Asymmetric key encryption using a public key and a private key ( \u0938\u093e\u0930\u094d\u0935\u091c\u0928\u093f\u0915 \u0915\u0941\u0902\u091c\u0940 \u0914\u0930 \u0928\u093f\u091c\u0940 \u0915\u0941\u0902\u091c\u0940 \u0915\u093e \u0909\u092a\u092f\u094b\u0917 \u0915\u0930\u0915\u0947 \u0905\u0938\u092e\u092e\u093f\u0924 \u0915\u0941\u0902\u091c\u0940 \u090f\u0928\u094d\u0915\u094d\u0930\u093f\u092a\u094d\u0936\u0928 )","Hashing algorithms that cannot be decrypted ( \u0939\u0948\u0936\u093f\u0902\u0917 \u090f\u0932\u094d\u0917\u094b\u0930\u093f\u0926\u092e \u091c\u093f\u0928\u094d\u0939\u0947\u0902 \u0921\u093f\u0915\u094d\u0930\u093f\u092a\u094d\u091f \u0928\u0939\u0940\u0902 \u0915\u093f\u092f\u093e \u091c\u093e \u0938\u0915\u0924\u093e )","MAC address filtering ( \u092e\u0948\u0915 \u090f\u0921\u094d\u0930\u0947\u0938 \u092b\u093c\u093f\u0932\u094d\u091f\u0930\u093f\u0902\u0917 )"],"answer":"2","solution":"The RSA (Rivest-Shamir-Adleman) algorithm is the foundation of modern public-key cryptography. It is an asymmetric cryptographic algorithm, meaning it uses a mathematical key pair: a public key used to encrypt the data, and a different, mathematically linked private key used to decrypt it. Additional Info (a) Symmetric encryption (like AES) uses the same key for both encryption and decryption. (b) RSA's security relies on the practical difficulty of factoring the product of two large prime numbers. (c) Hashing (like SHA-256) is a one-way mathematical function used for data integrity, not two-way encryption. (d) MAC filtering is a basic network access control method, not an encryption algorithm. Positive Mark: 0.8 Negative Mark: 0"},{"id":"84908","q":"27. The process by which solid waste is subjected to biological decomposition under controlled aerobic conditions to produce a humus-like product is called: \u0935\u0939 \u092a\u094d\u0930\u0915\u094d\u0930\u093f\u092f\u093e \u091c\u093f\u0938\u0915\u0947 \u0926\u094d\u0935\u093e\u0930\u093e \u0920\u094b\u0938 \u0905\u092a\u0936\u093f\u0937\u094d\u091f \u0915\u094b \u0928\u093f\u092f\u0902\u0924\u094d\u0930\u093f\u0924 \u090f\u0930\u094b\u092c\u093f\u0915 \u092a\u0930\u093f\u0938\u094d\u0925\u093f\u0924\u093f\u092f\u094b\u0902 \u092e\u0947\u0902 \u091c\u0948\u0935\u093f\u0915 \u0905\u092a\u0918\u091f\u0928 \u0915\u0947 \u0905\u0927\u0940\u0928 \u0915\u093f\u092f\u093e \u091c\u093e\u0924\u093e \u0939\u0948 \u0924\u093e\u0915\u093f \u0939\u094d\u092f\u0942\u092e\u0938 \u091c\u0948\u0938\u093e \u0909\u0924\u094d\u092a\u093e\u0926 \u0924\u0948\u092f\u093e\u0930 \u0915\u093f\u092f\u093e \u091c\u093e \u0938\u0915\u0947 , \u0915\u0939\u0932\u093e\u0924\u0940 \u0939\u0948 :","options":["Incineration ( \u092d\u0938\u094d\u092e\u0940\u0915\u0930\u0923 )","Pyrolysis ( \u092a\u093e\u092f\u0930\u094b\u0932\u093f\u0938\u093f\u0938 )","Composting ( \u0915\u092e\u094d\u092a\u094b\u0938\u094d\u091f\u093f\u0902\u0917 / \u0916\u093e\u0926 \u092c\u0928\u093e\u0928\u093e )","Landfilling ( \u0932\u0948\u0902\u0921\u092b\u093f\u0932\u093f\u0902\u0917 )"],"answer":"3","solution":"Composting is an aerobic (oxygen-requiring) biological process where microorganisms (bacteria and fungi) break down biodegradable organic waste (like food scraps and yard trimmings) into a stable, nutrient-rich soil amendment known as compost or humus. Additional Info (a) Incineration is the thermal destruction of waste in the presence of oxygen. (b) Pyrolysis is the thermal degradation of waste in the complete absence of oxygen. (c) Proper composting requires managing the carbon-to-nitrogen ratio, moisture, and aeration. (d) Landfilling is the physical burial of waste in engineered geological containments. Positive Mark: 0.8 Negative Mark: 0"},{"id":"84909","q":"28. In 2025, the 'BRICS' organization officially operates with its expanded membership. Which of the following countries was not integrated as a new member? 2025 \u092e\u0947\u0902 , ' \u092c\u094d\u0930\u093f\u0915\u094d\u0938 ' \u0938\u0902\u0917\u0920\u0928 \u0906\u0927\u093f\u0915\u093e\u0930\u093f\u0915 \u0924\u094c\u0930 \u092a\u0930 \u0905\u092a\u0928\u0940 \u0935\u093f\u0938\u094d\u0924\u093e\u0930\u093f\u0924 \u0938\u0926\u0938\u094d\u092f\u0924\u093e \u0915\u0947 \u0938\u093e\u0925 \u0915\u093e\u092e \u0915\u0930 \u0930\u0939\u093e \u0939\u0948\u0964 \u0928\u093f\u092e\u094d\u0928\u0932\u093f\u0916\u093f\u0924 \u092e\u0947\u0902 \u0938\u0947 \u0915\u093f\u0938 \u0926\u0947\u0936 \u0915\u094b \u0928\u090f \u0938\u0926\u0938\u094d\u092f \u0915\u0947 \u0930\u0942\u092a \u092e\u0947\u0902 \u090f\u0915\u0940\u0915\u0943\u0924 \u0928\u0939\u0940\u0902 \u0915\u093f\u092f\u093e \u0917\u092f\u093e \u0925\u093e ?","options":["Ethiopia ( \u0907\u0925\u093f\u092f\u094b\u092a\u093f\u092f\u093e )","Iran ( \u0908\u0930\u093e\u0928 )","UAE ( \u092f\u0942\u090f\u0908 )","Pakistan ( \u092a\u093e\u0915\u093f\u0938\u094d\u0924\u093e\u0928 )"],"answer":"4","solution":"During the major BRICS expansion announced at the 2023 Johannesburg summit (which took effect in 2024/2025), several nations were officially integrated into the bloc, including Egypt, Ethiopia, Iran, and the United Arab Emirates. Pakistan was not invited or integrated into the group. Additional Info (a) Ethiopia officially joined to expand the bloc's African representation alongside South Africa and Egypt. (b) Iran officially joined, heavily boosting the bloc's energy (oil/gas) influence. (c) The UAE officially joined, bringing significant financial capital to the organization. (d) Pakistan has expressed interest in joining but was not part of this historic expansion wave. Positive Mark: 0.8 Negative Mark: 0"},{"id":"84910","q":"29. The moment of inertia of a uniform solid sphere of mass M and radius R about an axis passing through its center is: \u0926\u094d\u0930\u0935\u094d\u092f\u092e\u093e\u0928 M \u0914\u0930 \u0924\u094d\u0930\u093f\u091c\u094d\u092f\u093e R \u0915\u0947 \u090f\u0915 \u0938\u092e\u093e\u0928 \u0920\u094b\u0938 \u0917\u094b\u0932\u0947 \u0915\u093e \u0909\u0938\u0915\u0947 \u0915\u0947\u0902\u0926\u094d\u0930 \u0938\u0947 \u0917\u0941\u091c\u0930\u0928\u0947 \u0935\u093e\u0932\u0947 \u0905\u0915\u094d\u0937 \u0915\u0947 \u092a\u0930\u093f\u0924\u0903 \u091c\u0921\u093c\u0924\u094d\u0935 \u0906\u0918\u0942\u0930\u094d\u0923 (moment of inertia) \u0939\u0948 :","options":["","","",""],"answer":"2","solution":"In classical mechanics, the moment of inertia (I) measures an object's resistance to changes in its rotation rate. For a uniform solid sphere rotating about any axis passing strictly through its center of mass, the formula is calculated via volume integration as . Additional Info (a) is the moment of inertia for a solid cylinder or disk rotating about its central axis. (b) The solid sphere has mass distributed closer to the center, hence a lower fractional multiplier than a hollow sphere. (c) is the moment of inertia for a thin-walled hollow sphere (spherical shell). (d) is the moment of inertia for a thin hoop or ring rotating about its central axis. Positive Mark: 0.8 Negative Mark: 0"},{"id":"84911","q":"30. The fundamental principle of establishing a 'Welfare State' in India is most prominently enshrined in the: \u092d\u093e\u0930\u0924 \u092e\u0947\u0902 ' \u0915\u0932\u094d\u092f\u093e\u0923\u0915\u093e\u0930\u0940 \u0930\u093e\u091c\u094d\u092f ' (Welfare State) \u0938\u094d\u0925\u093e\u092a\u093f\u0924 \u0915\u0930\u0928\u0947 \u0915\u093e \u092e\u0942\u0932 \u0938\u093f\u0926\u094d\u0927\u093e\u0902\u0924 \u0938\u092c\u0938\u0947 \u092a\u094d\u0930\u092e\u0941\u0916\u0924\u093e \u0938\u0947 \u0915\u093f\u0938\u092e\u0947\u0902 \u0928\u093f\u0939\u093f\u0924 \u0939\u0948 ?","options":["Preamble ( \u092a\u094d\u0930\u0938\u094d\u0924\u093e\u0935\u0928\u093e )","Fundamental Rights ( \u092e\u094c\u0932\u093f\u0915 \u0905\u0927\u093f\u0915\u093e\u0930 )","Directive Principles of State Policy ( \u0930\u093e\u091c\u094d\u092f \u0915\u0947 \u0928\u0940\u0924\u093f \u0928\u093f\u0926\u0947\u0936\u0915 \u0924\u0924\u094d\u0935 )","Fundamental Duties ( \u092e\u094c\u0932\u093f\u0915 \u0915\u0930\u094d\u0924\u0935\u094d\u092f )"],"answer":"3","solution":"The Directive Principles of State Policy (DPSP), contained in Part IV of the Indian Constitution, embody the concept of a 'Welfare State'. They provide comprehensive socio-economic guidelines directing the state to secure economic justice, public health, and equitable distribution of resources. Additional Info (a) The Preamble sets the philosophical tone but lacks the specific directives of Part IV. (b) Fundamental Rights (Part III) guarantee political democracy and protect individuals from state overreach (a 'Police State' concept). (c) While non-justiciable, DPSPs are fundamental in the governance of the country. (d) Fundamental Duties (Part IVA) are moral obligations placed on citizens, not the government. Positive Mark: 0.8 Negative Mark: 0"},{"id":"84912","q":"31. In recombinant DNA technology, \"Restriction Endonucleases\" are critical enzymes utilized primarily to: \u092a\u0941\u0928\u0930\u094d\u0938\u0902\u092f\u094b\u091c\u0915 \u0921\u0940\u090f\u0928\u090f (recombinant DNA) \u0924\u0915\u0928\u0940\u0915 \u092e\u0947\u0902 , \" \u092a\u094d\u0930\u0924\u093f\u092c\u0902\u0927 \u090f\u0902\u0921\u094b\u0928\u094d\u092f\u0942\u0915\u094d\u0932\u093f\u0905\u0938 \" (Restriction Endonucleases) \u092e\u0939\u0924\u094d\u0935\u092a\u0942\u0930\u094d\u0923 \u090f\u0902\u091c\u093e\u0907\u092e \u0939\u0948\u0902 \u091c\u093f\u0928\u0915\u093e \u0909\u092a\u092f\u094b\u0917 \u092e\u0941\u0916\u094d\u092f \u0930\u0942\u092a \u0938\u0947 \u0915\u093f\u0938\u0915\u0947 \u0932\u093f\u090f \u0915\u093f\u092f\u093e \u091c\u093e\u0924\u093e \u0939\u0948 ?","options":["Join two DNA strands together ( \u0926\u094b \u0921\u0940\u090f\u0928\u090f \u0938\u094d\u091f\u094d\u0930\u0948\u0902\u0921 \u0915\u094b \u090f\u0915 \u0938\u093e\u0925 \u091c\u094b\u0921\u093c\u0928\u0947 \u0915\u0947 \u0932\u093f\u090f )","Cleave DNA molecules at specific recognition sequences ( \u0935\u093f\u0936\u093f\u0937\u094d\u091f \u092e\u093e\u0928\u094d\u092f\u0924\u093e \u0905\u0928\u0941\u0915\u094d\u0930\u092e\u094b\u0902 \u092a\u0930 \u0921\u0940\u090f\u0928\u090f \u0905\u0923\u0941\u0913\u0902 \u0915\u094b \u0915\u093e\u091f\u0928\u0947 \u0915\u0947 \u0932\u093f\u090f )","Synthesize RNA from a DNA template ( \u0921\u0940\u090f\u0928\u090f \u091f\u0947\u092e\u094d\u092a\u0932\u0947\u091f \u0938\u0947 \u0906\u0930\u090f\u0928\u090f \u0915\u094b \u0938\u0902\u0936\u094d\u0932\u0947\u0937\u093f\u0924 \u0915\u0930\u0928\u0947 \u0915\u0947 \u0932\u093f\u090f )","Unwind the DNA double helix ( \u0921\u0940\u090f\u0928\u090f \u0921\u092c\u0932 \u0939\u0947\u0932\u093f\u0915\u094d\u0938 \u0915\u094b \u0916\u094b\u0932\u0928\u0947 \u0915\u0947 \u0932\u093f\u090f )"],"answer":"2","solution":"Restriction endonucleases (often called \"molecular scissors\") are enzymes that scan a DNA molecule and cleave (cut) the sugar-phosphate backbone at highly specific, short nucleotide sequences known as recognition sites. Additional Info (a) The enzyme DNA Ligase is responsible for joining (ligation) DNA strands together. (b) This precise cutting ability makes them the fundamental tool for creating recombinant DNA and genetic engineering. (c) RNA Polymerase is the enzyme that synthesizes RNA from a DNA template during transcription. (d) DNA Helicase is responsible for unwinding the double helix during replication. Positive Mark: 0.8 Negative Mark: 0"},{"id":"84913","q":"32. Which state in India has the longest coastline? ( \u092d\u093e\u0930\u0924 \u092e\u0947\u0902 \u0915\u093f\u0938 \u0930\u093e\u091c\u094d\u092f \u0915\u0940 \u0924\u091f\u0930\u0947\u0916\u093e \u0938\u092c\u0938\u0947 \u0932\u0902\u092c\u0940 \u0939\u0948 ?)","options":["Maharashtra ( \u092e\u0939\u093e\u0930\u093e\u0937\u094d\u091f\u094d\u0930 )","Andhra Pradesh ( \u0906\u0902\u0927\u094d\u0930 \u092a\u094d\u0930\u0926\u0947\u0936 )","Gujarat ( \u0917\u0941\u091c\u0930\u093e\u0924 )","Tamil Nadu ( \u0924\u092e\u093f\u0932\u0928\u093e\u0921\u0941 )"],"answer":"3","solution":"Gujarat possesses the longest mainland coastline in India, extending for approximately 1,600 kilometers. This vast coastline is highly indented, featuring the Gulf of Kutch and the Gulf of Khambhat, making it ideal for major seaports. Additional Info (a) Maharashtra has a coastline of approximately 720 km. (b) Andhra Pradesh has the second-longest mainland coastline (approx 974 km). (c) If Union Territories are included, the Andaman and Nicobar Islands have the longest total coastline (approx 1,962 km), but Gujarat leads the states. (d) Tamil Nadu has the third-longest mainland coastline (approx 906 km). Positive Mark: 0.8 Negative Mark: 0"},{"id":"84914","q":"33. The 'Biochemical Oxygen Demand' (BOD) of a municipal wastewater sample is a direct measure of: \u0928\u0917\u0930 \u0928\u093f\u0917\u092e \u0905\u092a\u0936\u093f\u0937\u094d\u091f \u091c\u0932 \u0915\u0947 \u0928\u092e\u0942\u0928\u0947 \u0915\u0940 ' \u092c\u093e\u092f\u094b\u0915\u0947\u092e\u093f\u0915\u0932 \u0911\u0915\u094d\u0938\u0940\u091c\u0928 \u0921\u093f\u092e\u093e\u0902\u0921 ' (BOD) \u0915\u093f\u0938\u0915\u093e \u092a\u094d\u0930\u0924\u094d\u092f\u0915\u094d\u0937 \u092e\u093e\u092a \u0939\u0948 ?","options":["The amount of oxygen required by bacteria to decompose organic matter under aerobic conditions ( \u090f\u0930\u094b\u092c\u093f\u0915 \u0938\u094d\u0925\u093f\u0924\u093f\u092f\u094b\u0902 \u0915\u0947 \u0924\u0939\u0924 \u0915\u093e\u0930\u094d\u092c\u0928\u093f\u0915 \u092a\u0926\u093e\u0930\u094d\u0925\u094b\u0902 \u0915\u094b \u0935\u093f\u0918\u091f\u093f\u0924 \u0915\u0930\u0928\u0947 \u0915\u0947 \u0932\u093f\u090f \u092c\u0948\u0915\u094d\u091f\u0940\u0930\u093f\u092f\u093e \u0926\u094d\u0935\u093e\u0930\u093e \u0906\u0935\u0936\u094d\u092f\u0915 \u0911\u0915\u094d\u0938\u0940\u091c\u0928 \u0915\u0940 \u092e\u093e\u0924\u094d\u0930\u093e )","The total dissolved oxygen natively present in the water ( \u092a\u093e\u0928\u0940 \u092e\u0947\u0902 \u092e\u0942\u0932 \u0930\u0942\u092a \u0938\u0947 \u092e\u094c\u091c\u0942\u0926 \u0915\u0941\u0932 \u0918\u0941\u0932\u093f\u0924 \u0911\u0915\u094d\u0938\u0940\u091c\u0928 )","The amount of heavy metals dissolved in the effluent ( \u092a\u094d\u0930\u0935\u093e\u0939 \u092e\u0947\u0902 \u0918\u0941\u0932\u0940 \u092d\u093e\u0930\u0940 \u0927\u093e\u0924\u0941\u0913\u0902 \u0915\u0940 \u092e\u093e\u0924\u094d\u0930\u093e )","The rate of photosynthesis by aquatic flora ( \u091c\u0932\u0940\u092f \u0935\u0928\u0938\u094d\u092a\u0924\u093f\u092f\u094b\u0902 \u0926\u094d\u0935\u093e\u0930\u093e \u092a\u094d\u0930\u0915\u093e\u0936 \u0938\u0902\u0936\u094d\u0932\u0947\u0937\u0923 \u0915\u0940 \u0926\u0930 )"],"answer":"1","solution":"Biochemical Oxygen Demand (BOD) is the amount of dissolved oxygen consumed by aerobic biological organisms to break down the organic material present in a given water sample at a certain temperature over a specific time period. Additional Info (a) High BOD indicates heavily polluted water (like raw sewage), which will rapidly deplete oxygen and kill aquatic life. (b) Total dissolved oxygen (DO) is a physical measurement of available oxygen; BOD measures the biological consumption of that oxygen. (c) Heavy metals are inorganic and their concentration is measured via chemical assays, not biological demand. (d) Photosynthesis is measured by primary productivity or oxygen generation, not oxygen demand. Positive Mark: 0.8 Negative Mark: 0"},{"id":"84915","q":"34. The famous 'Santhal Rebellion' (1855-56) against the British East India Company and the oppressive zamindari system was led by: \u092c\u094d\u0930\u093f\u091f\u093f\u0936 \u0908\u0938\u094d\u091f \u0907\u0902\u0921\u093f\u092f\u093e \u0915\u0902\u092a\u0928\u0940 \u0914\u0930 \u0926\u092e\u0928\u0915\u093e\u0930\u0940 \u091c\u092e\u0940\u0902\u0926\u093e\u0930\u0940 \u0935\u094d\u092f\u0935\u0938\u094d\u0925\u093e \u0915\u0947 \u0916\u093f\u0932\u093e\u092b \u092a\u094d\u0930\u0938\u093f\u0926\u094d\u0927 ' \u0938\u0902\u0925\u093e\u0932 \u0935\u093f\u0926\u094d\u0930\u094b\u0939 ' (1855-56) \u0915\u093e \u0928\u0947\u0924\u0943\u0924\u094d\u0935 \u0915\u093f\u0938\u0928\u0947 \u0915\u093f\u092f\u093e \u0925\u093e ?","options":["Birsa Munda ( \u092c\u093f\u0930\u0938\u093e \u092e\u0941\u0902\u0921\u093e )","Sidhu and Kanhu ( \u0938\u093f\u0926\u094d\u0927\u0942 \u0914\u0930 \u0915\u093e\u0928\u094d\u0939\u0942 )","Tilka Manjhi ( \u0924\u093f\u0932\u0915\u093e \u092e\u093e\u0902\u091d\u0940 )","Tana Bhagat ( \u0924\u093e\u0928\u093e \u092d\u0917\u0924 )"],"answer":"2","solution":"The Santhal Rebellion (known as the Santhal Hul) was a massive tribal uprising in the Damin-i-koh region (present-day Jharkhand) against the oppressive British colonial authority and corrupt zamindars. It was primarily organized and led by the Murmu brothers: Sidhu, Kanhu, Chand, and Bhairab. Additional Info (a) Birsa Munda led the famous Munda Rebellion (Ulgulan) a few decades later in 1899. (b) The rebellion resulted in the British creating the Santhal Parganas to pacify the tribal population. (c) Tilka Manjhi led an earlier tribal uprising against the British in the 1780s in Bhagalpur. (d) Tana Bhagat led a socio-religious movement among the Oraon tribe in the 1910s. Positive Mark: 0.8 Negative Mark: 0"},{"id":"84916","q":"35. In data structures and algorithms, the worst-case time complexity of finding a specific element using the \"Binary Search\" algorithm on a sorted array of n elements is: \u0921\u0947\u091f\u093e \u0938\u0902\u0930\u091a\u0928\u093e\u0913\u0902 \u0914\u0930 \u090f\u0932\u094d\u0917\u094b\u0930\u093f\u0926\u092e \u092e\u0947\u0902 , n \u0924\u0924\u094d\u0935\u094b\u0902 \u0915\u0947 \u090f\u0915 \u0938\u0949\u0930\u094d\u091f \u0915\u093f\u090f \u0917\u090f \u090f\u0930\u0947 \u092a\u0930 \" \u092c\u093e\u0907\u0928\u0930\u0940 \u0938\u0930\u094d\u091a \" \u090f\u0932\u094d\u0917\u094b\u0930\u093f\u0926\u092e \u0915\u093e \u0909\u092a\u092f\u094b\u0917 \u0915\u0930\u0915\u0947 \u090f\u0915 \u0935\u093f\u0936\u093f\u0937\u094d\u091f \u0924\u0924\u094d\u0935 \u0915\u094b \u0916\u094b\u091c\u0928\u0947 \u0915\u0940 \u0935\u0930\u094d\u0938\u094d\u091f - \u0915\u0947\u0938 \u091f\u093e\u0907\u092e \u0915\u0949\u092e\u094d\u092a\u094d\u0932\u0947\u0915\u094d\u0938\u093f\u091f\u0940 \u0915\u094d\u092f\u093e \u0939\u0948 ?","options":["O(1)","O(log n)","O(n)","O(n log n)"],"answer":"2","solution":"Binary search works by repeatedly dividing the search interval in half. Because the size of the search space is halved with each comparison, the maximum number of steps required to find an element (or determine it isn't there) in an array of size n is proportional to the base-2 logarithm of n, yielding a worst-case time complexity of O(log n). Additional Info (a) O(1) is the best-case scenario (the target element is exactly in the middle on the first check). (b) This logarithmic efficiency makes binary search exponentially faster than linear search for large datasets. (c) O(n) is the worst-case time complexity for a Linear Search. (d) O(n log n) is the optimal worst-case time complexity for comparison-based sorting algorithms (like Merge Sort). Positive Mark: 0.8 Negative Mark: 0"},{"id":"84917","q":"36. Which of the following economic concepts refers to the decline in the value of a physical asset over time due to wear, tear, and obsolescence? \u0928\u093f\u092e\u094d\u0928\u0932\u093f\u0916\u093f\u0924 \u092e\u0947\u0902 \u0938\u0947 \u0915\u094c\u0928 \u0938\u0940 \u0906\u0930\u094d\u0925\u093f\u0915 \u0905\u0935\u0927\u093e\u0930\u0923\u093e \u091f\u0942\u091f - \u092b\u0942\u091f \u0914\u0930 \u0905\u092a\u094d\u0930\u091a\u0932\u0928 \u0915\u0947 \u0915\u093e\u0930\u0923 \u0938\u092e\u092f \u0915\u0947 \u0938\u093e\u0925 \u092d\u094c\u0924\u093f\u0915 \u0938\u0902\u092a\u0924\u094d\u0924\u093f \u0915\u0947 \u092e\u0942\u0932\u094d\u092f \u092e\u0947\u0902 \u0917\u093f\u0930\u093e\u0935\u091f \u0915\u094b \u0938\u0902\u0926\u0930\u094d\u092d\u093f\u0924 \u0915\u0930\u0924\u0940 \u0939\u0948 ?","options":["Inflation ( \u092e\u0941\u0926\u094d\u0930\u093e\u0938\u094d\u092b\u0940\u0924\u093f )","Deflation ( \u0905\u092a\u0938\u094d\u092b\u0940\u0924\u093f )","Depreciation ( \u092e\u0942\u0932\u094d\u092f\u0939\u094d\u0930\u093e\u0938 )","Devaluation ( \u0905\u0935\u092e\u0942\u0932\u094d\u092f\u0928 )"],"answer":"3","solution":"Depreciation is an accounting and economic measure representing the loss in value of a tangible fixed asset over its useful lifespan. This loss in value is caused by physical wear and tear, age, or technological obsolescence (like a computer becoming outdated). Additional Info (a) Inflation is a general increase in prices, reducing the purchasing power of a currency. (b) Deflation is a general decrease in the prices of goods and services in an economy. (c) In corporate finance, depreciation allows businesses to spread the cost of an asset over several tax years. (d) Devaluation is the deliberate downward adjustment of a country's official exchange rate relative to other currencies. Positive Mark: 0.8 Negative Mark: 0"},{"id":"84918","q":"37. Which Indian state launched the popular 'Mukhyamantri Maiya Samman Yojana' (MMSY) to provide direct cash transfers to women, gaining major political traction leading into 2025? \u0915\u093f\u0938 \u092d\u093e\u0930\u0924\u0940\u092f \u0930\u093e\u091c\u094d\u092f \u0928\u0947 \u092e\u0939\u093f\u0932\u093e\u0913\u0902 \u0915\u094b \u0938\u0940\u0927\u0947 \u0928\u0915\u0926 \u0939\u0938\u094d\u0924\u093e\u0902\u0924\u0930\u0923 \u092a\u094d\u0930\u0926\u093e\u0928 \u0915\u0930\u0928\u0947 \u0915\u0947 \u0932\u093f\u090f \u0932\u094b\u0915\u092a\u094d\u0930\u093f\u092f ' \u092e\u0941\u0916\u094d\u092f\u092e\u0902\u0924\u094d\u0930\u0940 \u092e\u0907\u092f\u093e\u0902 \u0938\u092e\u094d\u092e\u093e\u0928 \u092f\u094b\u091c\u0928\u093e ' (MMSY) \u0936\u0941\u0930\u0942 \u0915\u0940 , \u091c\u093f\u0938\u0928\u0947 2025 \u0924\u0915 \u092c\u0921\u093c\u093e \u0930\u093e\u091c\u0928\u0940\u0924\u093f\u0915 \u0915\u0930\u094d\u0937\u0923 \u092a\u094d\u0930\u093e\u092a\u094d\u0924 \u0915\u093f\u092f\u093e ?","options":["Bihar ( \u092c\u093f\u0939\u093e\u0930 )","Jharkhand ( \u091d\u093e\u0930\u0916\u0902\u0921 )","Madhya Pradesh ( \u092e\u0927\u094d\u092f \u092a\u094d\u0930\u0926\u0947\u0936 )","Rajasthan ( \u0930\u093e\u091c\u0938\u094d\u0925\u093e\u0928 )"],"answer":"2","solution":"The Mukhyamantri Maiya Samman Yojana (MMSY) was a flagship welfare scheme launched by the Government of Jharkhand. It provides a direct cash transfer (\u20b91,000 per month) to eligible women from economically weaker sections to promote financial independence. Additional Info (a) Bihar runs the Kanya Utthan Yojana, focusing heavily on female education and health milestones. (b) The MMSY was a central pillar of socio-economic policy ahead of Jharkhand's recent state assembly elections. (c) Madhya Pradesh pioneered this style of direct benefit transfer with the highly successful 'Ladli Behna Yojana'. (d) Rajasthan operates the Bhamashah Yojana focusing on women as the head of the household. Positive Mark: 0.8 Negative Mark: 0"},{"id":"84919","q":"38. In complex electrical circuits, Kirchhoff's Voltage Law (KVL), which states that the directed sum of the potential differences around any closed loop is zero, is fundamentally based on the conservation of: \u091c\u091f\u093f\u0932 \u0935\u093f\u0926\u094d\u092f\u0941\u0924 \u092a\u0930\u093f\u092a\u0925\u094b\u0902 \u092e\u0947\u0902 , \u0915\u093f\u0930\u091a\u0949\u092b \u0915\u093e \u0935\u094b\u0932\u094d\u091f\u0947\u091c \u0928\u093f\u092f\u092e (KVL), \u091c\u094b \u092c\u0924\u093e\u0924\u093e \u0939\u0948 \u0915\u093f \u0915\u093f\u0938\u0940 \u092d\u0940 \u092c\u0902\u0926 \u0932\u0942\u092a \u0915\u0947 \u091a\u093e\u0930\u094b\u0902 \u0913\u0930 \u0938\u0902\u092d\u093e\u0935\u093f\u0924 \u0905\u0902\u0924\u0930\u094b\u0902 \u0915\u093e \u0928\u093f\u0930\u094d\u0926\u0947\u0936\u093f\u0924 \u092f\u094b\u0917 \u0936\u0942\u0928\u094d\u092f \u0939\u0948 , \u092e\u094c\u0932\u093f\u0915 \u0930\u0942\u092a \u0938\u0947 \u0915\u093f\u0938\u0915\u0947 \u0938\u0902\u0930\u0915\u094d\u0937\u0923 \u092a\u0930 \u0906\u0927\u093e\u0930\u093f\u0924 \u0939\u0948 ?","options":["Charge ( \u0906\u0935\u0947\u0936 )","Energy ( \u090a\u0930\u094d\u091c\u093e )","Momentum ( \u0938\u0902\u0935\u0947\u0917 )","Mass ( \u0926\u094d\u0930\u0935\u094d\u092f\u092e\u093e\u0928 )"],"answer":"2","solution":"Kirchhoff's Voltage Law (KVL) is a direct application of the principle of conservation of energy to electrical circuits. It dictates that the total work done by a charge moving around a complete, closed loop and returning to its starting point must be zero, meaning the energy supplied equals the energy consumed. Additional Info (a) Kirchhoff's Current Law (KCL), which states that the sum of currents entering a node equals the sum leaving, is based on the conservation of charge. (b) KVL is mathematically expressed as V = 0 for any closed loop. (c) Momentum conservation applies to physical collisions and kinematics. (d) Mass conservation applies to closed thermodynamic and chemical systems. Positive Mark: 0.8 Negative Mark: 0"},{"id":"84920","q":"39. The 'Right to Privacy' was declared a fundamental right by the Supreme Court of India under which Article? \u092d\u093e\u0930\u0924 \u0915\u0947 \u0938\u0930\u094d\u0935\u094b\u091a\u094d\u091a \u0928\u094d\u092f\u093e\u092f\u093e\u0932\u092f \u0926\u094d\u0935\u093e\u0930\u093e ' \u0928\u093f\u091c\u0924\u093e \u0915\u0947 \u0905\u0927\u093f\u0915\u093e\u0930 ' (Right to Privacy) \u0915\u094b \u0915\u093f\u0938 \u0905\u0928\u0941\u091a\u094d\u091b\u0947\u0926 \u0915\u0947 \u0924\u0939\u0924 \u092e\u094c\u0932\u093f\u0915 \u0905\u0927\u093f\u0915\u093e\u0930 \u0918\u094b\u0937\u093f\u0924 \u0915\u093f\u092f\u093e \u0917\u092f\u093e \u0925\u093e ?","options":["Article 14 ( \u0905\u0928\u0941\u091a\u094d\u091b\u0947\u0926 14)","Article 19 ( \u0905\u0928\u0941\u091a\u094d\u091b\u0947\u0926 19)","Article 21 ( \u0905\u0928\u0941\u091a\u094d\u091b\u0947\u0926 21)","Article 25 ( \u0905\u0928\u0941\u091a\u094d\u091b\u0947\u0926 25)"],"answer":"3","solution":"In the landmark Justice K.S. Puttaswamy (Retd.) v. Union of India case (2017), a nine-judge bench of the Supreme Court unanimously ruled that the Right to Privacy is an intrinsic part of the Right to Life and Personal Liberty guaranteed under Article 21 of the Indian Constitution. Additional Info (a) Article 14 guarantees equality before the law and equal protection of the laws. (b) Article 19 guarantees six freedoms, including freedom of speech and expression. (c) The ruling established that privacy is a natural right inherent to human dignity, heavily influencing subsequent data protection laws. (d) Article 25 guarantees the freedom of conscience and free profession, practice, and propagation of religion. Positive Mark: 0.8 Negative Mark: 0"},{"id":"84921","q":"40. Which of the following Indian states does the river Brahmaputra flow through? \u092c\u094d\u0930\u0939\u094d\u092e\u092a\u0941\u0924\u094d\u0930 \u0928\u0926\u0940 \u0928\u093f\u092e\u094d\u0928\u0932\u093f\u0916\u093f\u0924 \u092e\u0947\u0902 \u0938\u0947 \u0915\u093f\u0938 \u092d\u093e\u0930\u0924\u0940\u092f \u0930\u093e\u091c\u094d\u092f \u0938\u0947 \u0939\u094b\u0915\u0930 \u092c\u0939\u0924\u0940 \u0939\u0948 ?","options":["Sikkim and West Bengal ( \u0938\u093f\u0915\u094d\u0915\u093f\u092e \u0914\u0930 \u092a\u0936\u094d\u091a\u093f\u092e \u092c\u0902\u0917\u093e\u0932 )","Arunachal Pradesh and Assam ( \u0905\u0930\u0941\u0923\u093e\u091a\u0932 \u092a\u094d\u0930\u0926\u0947\u0936 \u0914\u0930 \u0905\u0938\u092e )","Meghalaya and Tripura ( \u092e\u0947\u0918\u093e\u0932\u092f \u0914\u0930 \u0924\u094d\u0930\u093f\u092a\u0941\u0930\u093e )","Manipur and Mizoram ( \u092e\u0923\u093f\u092a\u0941\u0930 \u0914\u0930 \u092e\u093f\u091c\u094b\u0930\u092e )"],"answer":"2","solution":"The Brahmaputra River enters India from Tibet (where it is known as the Yarlung Tsangpo) by passing through the state of Arunachal Pradesh. From there, it descends into the sprawling plains of Assam before eventually flowing south into Bangladesh. Additional Info (a) The Teesta is a major river flowing through Sikkim and West Bengal, eventually joining the Brahmaputra in Bangladesh. (b) In Arunachal Pradesh, it is known as the Siang or Dihang river before taking the name Brahmaputra in Assam. (c) Meghalaya features rivers like the Someshwari, and Tripura features the Gomati. (d) Manipur features the Barak River. Positive Mark: 0.8 Negative Mark: 0"},{"id":"84922","q":"41. Solid waste incineration primarily reduces the physical volume of municipal solid waste by approximately: \u0920\u094b\u0938 \u0905\u092a\u0936\u093f\u0937\u094d\u091f \u092d\u0938\u094d\u092e\u0940\u0915\u0930\u0923 (incineration) \u092e\u0941\u0916\u094d\u092f \u0930\u0942\u092a \u0938\u0947 \u0928\u0917\u0930\u092a\u093e\u0932\u093f\u0915\u093e \u0920\u094b\u0938 \u0915\u091a\u0930\u0947 \u0915\u0940 \u092d
