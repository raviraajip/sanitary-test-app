\u094c\u0924\u093f\u0915 \u092e\u093e\u0924\u094d\u0930\u093e \u0915\u094b \u0932\u0917\u092d\u0917 \u0915\u093f\u0924\u0928\u093e \u0915\u092e \u0915\u0930 \u0926\u0947\u0924\u093e \u0939\u0948 ?","options":["20-30%","40-50%","60-70%","80-90%"],"answer":"4","solution":"Incineration (thermal destruction) is a highly effective volume-reduction technology for municipal solid waste. Under optimal combustion conditions, incineration can reduce the physical volume of raw waste by 80% to 90% (and its mass by 70% to 80%), leaving only inert bottom ash and captured fly ash. Additional Info (a) Volume reduction this low is characteristic of basic mechanical compaction. (b) Biological composting reduces volume by roughly 40-50%. (c) An incorrect estimation for modern incineration. (d) This massive volume reduction heavily extends the lifespan of the landfills required to bury the remaining ash. Positive Mark: 0.8 Negative Mark: 0"},{"id":"84923","q":"42. Who among the following was a prominent leader of the 'Wahabi Movement', which had Patna as its major operational center in the 19th century? \u0928\u093f\u092e\u094d\u0928\u0932\u093f\u0916\u093f\u0924 \u092e\u0947\u0902 \u0938\u0947 \u0915\u094c\u0928 ' \u0935\u0939\u093e\u092c\u0940 \u0906\u0902\u0926\u094b\u0932\u0928 ' \u0915\u093e \u090f\u0915 \u092a\u094d\u0930\u092e\u0941\u0916 \u0928\u0947\u0924\u093e \u0925\u093e , \u091c\u093f\u0938\u0915\u093e 19 \u0935\u0940\u0902 \u0936\u0924\u093e\u092c\u094d\u0926\u0940 \u092e\u0947\u0902 \u092a\u094d\u0930\u092e\u0941\u0916 \u092a\u0930\u093f\u091a\u093e\u0932\u0928 \u0915\u0947\u0902\u0926\u094d\u0930 \u092a\u091f\u0928\u093e \u0925\u093e ?","options":["Syed Ahmed Barelvi ( \u0938\u0948\u092f\u0926 \u0905\u0939\u092e\u0926 \u092c\u0930\u0947\u0932\u0935\u0940 )","Sir Syed Ahmed Khan ( \u0938\u0930 \u0938\u0948\u092f\u0926 \u0905\u0939\u092e\u0926 \u0916\u093e\u0928 )","Maulana Abul Kalam Azad ( \u092e\u094c\u0932\u093e\u0928\u093e \u0905\u092c\u0941\u0932 \u0915\u0932\u093e\u092e \u0906\u091c\u093e\u0926 )","Haji Shariatullah ( \u0939\u093e\u091c\u0940 \u0936\u0930\u0940\u092f\u0924\u0941\u0932\u094d\u0932\u093e\u0939 )"],"answer":"1","solution":"Syed Ahmed Barelvi was the founder and primary ideological leader of the Wahabi Movement in India (Tariqah-i-Muhammadiya). The movement was a vigorous Islamic revivalist campaign that became staunchly anti-British. Syed Ahmed Barelvi established Patna as the movement's supreme operational headquarters, heavily supported by local leaders like Wilayat Ali and Enayat Ali. Additional Info (a) The Patna center operated a highly organized, covert network challenging British authority long after Barelvi's death. (b) Sir Syed Ahmed Khan was a modernist reformer who founded the Aligarh Muslim University and opposed the Wahabi ideology. (c) Maulana Abul Kalam Azad was an independence activist and India's first Education Minister. (d) Haji Shariatullah was the founder of the Faraizi movement in Bengal. Positive Mark: 0.8 Negative Mark: 0"},{"id":"84924","q":"43. In electrochemistry, the Nernst Equation is primarily utilized to: \u0907\u0932\u0947\u0915\u094d\u091f\u094d\u0930\u094b\u0915\u0948\u092e\u093f\u0938\u094d\u091f\u094d\u0930\u0940 \u092e\u0947\u0902 , \u0928\u0930\u094d\u0928\u0938\u094d\u091f \u0938\u092e\u0940\u0915\u0930\u0923 (Nernst Equation) \u0915\u093e \u092e\u0941\u0916\u094d\u092f \u0930\u0942\u092a \u0938\u0947 \u0909\u092a\u092f\u094b\u0917 \u0915\u093f\u092f\u093e \u091c\u093e\u0924\u093e \u0939\u0948 :","options":["Calculate the total heat of a reaction ( \u092a\u094d\u0930\u0924\u093f\u0915\u094d\u0930\u093f\u092f\u093e \u0915\u0940 \u0915\u0941\u0932 \u090a\u0937\u094d\u092e\u093e \u0915\u0940 \u0917\u0923\u0928\u093e \u0915\u0930\u0928\u0947 \u0915\u0947 \u0932\u093f\u090f )","Determine the activation energy of a catalyst ( \u0909\u0924\u094d\u092a\u094d\u0930\u0947\u0930\u0915 \u0915\u0940 \u0938\u0915\u094d\u0930\u093f\u092f\u0923 \u090a\u0930\u094d\u091c\u093e \u0928\u093f\u0930\u094d\u0927\u093e\u0930\u093f\u0924 \u0915\u0930\u0928\u0947 \u0915\u0947 \u0932\u093f\u090f )","Calculate the electromotive force (EMF) of a cell under non-standard conditions ( \u0917\u0948\u0930 - \u092e\u093e\u0928\u0915 \u0938\u094d\u0925\u093f\u0924\u093f\u092f\u094b\u0902 \u0915\u0947 \u0924\u0939\u0924 \u0938\u0947\u0932 \u0915\u0947 \u0907\u0932\u0947\u0915\u094d\u091f\u094d\u0930\u094b\u092e\u094b\u091f\u093f\u0935 \u092c\u0932 (EMF) \u0915\u0940 \u0917\u0923\u0928\u093e \u0915\u0930\u0928\u0947 \u0915\u0947 \u0932\u093f\u090f )","Determine the half-life of a radioactive isotope ( \u0930\u0947\u0921\u093f\u092f\u094b\u0927\u0930\u094d\u092e\u0940 \u0906\u0907\u0938\u094b\u091f\u094b\u092a \u0915\u093e \u0906\u0927\u093e \u091c\u0940\u0935\u0928 \u0928\u093f\u0930\u094d\u0927\u093e\u0930\u093f\u0924 \u0915\u0930\u0928\u0947 \u0915\u0947 \u0932\u093f\u090f )"],"answer":"3","solution":"The Nernst equation is a fundamental principle in electrochemistry used to determine the cell potential (Electromotive Force, or EMF) of an electrochemical cell at any given temperature, pressure, and ion concentration, directly relating it to the standard cell potential. Additional Info (a) Total heat (Enthalpy) of a reaction is calculated using Hess's Law. (b) Activation energy is determined using the Arrhenius equation. (c) The formula is , crucial for understanding batteries as they discharge. (d) Half-life calculations rely on first-order kinetics decay equations. Positive Mark: 0.8 Negative Mark: 0"},{"id":"84925","q":"44. What is the primary ecological function of the 'Ozone Layer' in the Earth's stratosphere? ( \u092a\u0943\u0925\u094d\u0935\u0940 \u0915\u0947 \u0938\u092e\u0924\u093e\u092a \u092e\u0902\u0921\u0932 (stratosphere) \u092e\u0947\u0902 ' \u0913\u091c\u094b\u0928 \u092a\u0930\u0924 ' \u0915\u093e \u092a\u094d\u0930\u093e\u0925\u092e\u093f\u0915 \u092a\u093e\u0930\u093f\u0938\u094d\u0925\u093f\u0924\u093f\u0915 \u0915\u093e\u0930\u094d\u092f \u0915\u094d\u092f\u093e \u0939\u0948 ?)","options":["To trap heat and sustain the Earth's average temperature ( \u0917\u0930\u094d\u092e\u0940 \u0915\u094b \u092b\u0902\u0938\u093e\u0928\u0947 \u0914\u0930 \u092a\u0943\u0925\u094d\u0935\u0940 \u0915\u0947 \u0914\u0938\u0924 \u0924\u093e\u092a\u092e\u093e\u0928 \u0915\u094b \u092c\u0928\u093e\u090f \u0930\u0916\u0928\u0947 \u0915\u0947 \u0932\u093f\u090f )","To absorb and filter harmful ultraviolet-B (UV-B) radiation from the Sun ( \u0938\u0942\u0930\u094d\u092f \u0938\u0947 \u0939\u093e\u0928\u093f\u0915\u093e\u0930\u0915 \u092a\u0930\u093e\u092c\u0948\u0902\u0917\u0928\u0940 - \u092c\u0940 (UV-B) \u0935\u093f\u0915\u093f\u0930\u0923 \u0915\u094b \u0905\u0935\u0936\u094b\u0937\u093f\u0924 \u0914\u0930 \u092b\u093c\u093f\u0932\u094d\u091f\u0930 \u0915\u0930\u0928\u0947 \u0915\u0947 \u0932\u093f\u090f )","To provide a concentrated layer of oxygen for high-altitude weather systems ( \u0909\u091a\u094d\u091a \u090a\u0902\u091a\u093e\u0908 \u0935\u093e\u0932\u0947 \u092e\u094c\u0938\u092e \u092a\u094d\u0930\u0923\u093e\u0932\u093f\u092f\u094b\u0902 \u0915\u0947 \u0932\u093f\u090f \u0911\u0915\u094d\u0938\u0940\u091c\u0928 \u0915\u0940 \u090f\u0915 \u0915\u0947\u0902\u0926\u094d\u0930\u093f\u0924 \u092a\u0930\u0924 \u092a\u094d\u0930\u0926\u093e\u0928 \u0915\u0930\u0928\u0947 \u0915\u0947 \u0932\u093f\u090f )","To reflect radio waves facilitating global communication ( \u0930\u0947\u0921\u093f\u092f\u094b \u0924\u0930\u0902\u0917\u094b\u0902 \u0915\u094b \u092a\u094d\u0930\u0924\u093f\u092c\u093f\u0902\u092c\u093f\u0924 \u0915\u0930\u0928\u0947 \u0915\u0947 \u0932\u093f\u090f \u091c\u093f\u0938\u0938\u0947 \u0935\u0948\u0936\u094d\u0935\u093f\u0915 \u0938\u0902\u091a\u093e\u0930 \u0915\u0940 \u0938\u0941\u0935\u093f\u0927\u093e \u092e\u093f\u0932\u0924\u0940 \u0939\u0948 )"],"answer":"2","solution":"The ozone layer acts as an invisible shield in the Earth's stratosphere, primarily absorbing and filtering out the vast majority (97-99%) of the Sun's medium-frequency ultraviolet light (particularly UV-B), which is highly damaging to cellular DNA and ecological food webs. Additional Info (a) Greenhouse gases (like and ) in the troposphere trap heat, not stratospheric ozone. (b) Depletion of this layer leads to increased rates of skin cancer and cataracts. (c) Most atmospheric weather and oxygen-breathing life are confined strictly to the much lower troposphere. (d) The Ionosphere reflects radio waves for communication. Positive Mark: 0.8 Negative Mark: 0"},{"id":"84926","q":"45. The 'Goods and Services Tax' (GST) implemented in India is classified as a: ( \u092d\u093e\u0930\u0924 \u092e\u0947\u0902 \u0932\u093e\u0917\u0942 ' \u0935\u0938\u094d\u0924\u0941 \u090f\u0935\u0902 \u0938\u0947\u0935\u093e \u0915\u0930 ' (GST) \u0915\u094b \u0915\u093f\u0938 \u0930\u0942\u092a \u092e\u0947\u0902 \u0935\u0930\u094d\u0917\u0940\u0915\u0943\u0924 \u0915\u093f\u092f\u093e \u0917\u092f\u093e \u0939\u0948 ?)","options":["Direct, origin-based tax ( \u092a\u094d\u0930\u0924\u094d\u092f\u0915\u094d\u0937 , \u0909\u0926\u094d\u0917\u092e - \u0906\u0927\u093e\u0930\u093f\u0924 \u0915\u0930 )","Indirect, destination-based tax ( \u0905\u092a\u094d\u0930\u0924\u094d\u092f\u0915\u094d\u0937 , \u0917\u0902\u0924\u0935\u094d\u092f - \u0906\u0927\u093e\u0930\u093f\u0924 \u0915\u0930 )","Direct, destination-based tax ( \u092a\u094d\u0930\u0924\u094d\u092f\u0915\u094d\u0937 , \u0917\u0902\u0924\u0935\u094d\u092f - \u0906\u0927\u093e\u0930\u093f\u0924 \u0915\u0930 )","Indirect, origin-based tax ( \u0905\u092a\u094d\u0930\u0924\u094d\u092f\u0915\u094d\u0937 , \u0909\u0926\u094d\u0917\u092e - \u0906\u0927\u093e\u0930\u093f\u0924 \u0915\u0930 )"],"answer":"2","solution":"The Goods and Services Tax (GST) is an indirect tax (meaning the burden is passed on to the final consumer) levied on the supply of goods and services. Crucially, it is a destination-based consumption tax, meaning the tax revenue accrues to the state where the goods are finally consumed, not where they are manufactured. Additional Info (a) Direct taxes (like Income Tax) are paid directly to the government by the earner. (b) This destination-based principle required significant structural changes in interstate taxation (IGST). (c) GST is never classified as a direct tax. (d) Pre-GST systems like the Central Sales Tax (CST) were origin-based, favoring manufacturing states. Positive Mark: 0.8 Negative Mark: 0"},{"id":"84927","q":"46. In computer architecture, Cache memory is highly effective at speeding up the CPU primarily due to the principle of: ( \u0915\u0902\u092a\u094d\u092f\u0942\u091f\u0930 \u0906\u0930\u094d\u0915\u093f\u091f\u0947\u0915\u094d\u091a\u0930 \u092e\u0947\u0902 , \u0915\u0948\u0936 \u092e\u0947\u092e\u094b\u0930\u0940 \u092e\u0941\u0916\u094d\u092f \u0930\u0942\u092a \u0938\u0947 \u0915\u093f\u0938 \u0938\u093f\u0926\u094d\u0927\u093e\u0902\u0924 \u0915\u0947 \u0915\u093e\u0930\u0923 CPU \u0915\u0940 \u0917\u0924\u093f \u092c\u0922\u093c\u093e\u0928\u0947 \u092e\u0947\u0902 \u0905\u0924\u094d\u092f\u0927\u093f\u0915 \u092a\u094d\u0930\u092d\u093e\u0935\u0940 \u0939\u0948 ?)","options":["Multithreading ( \u092e\u0932\u094d\u091f\u0940\u0925\u094d\u0930\u0947\u0921\u093f\u0902\u0917 )","Locality of Reference (Spatial and Temporal) ( \u0938\u0902\u0926\u0930\u094d\u092d \u0915\u0940 \u0938\u094d\u0925\u093e\u0928\u0940\u092f\u0924\u093e - \u0938\u094d\u0925\u093e\u0928\u093f\u0915 \u0914\u0930 \u0905\u0938\u094d\u0925\u093e\u092f\u0940 (Locality of Reference))","Virtual Memory Paging ( \u0935\u0930\u094d\u091a\u0941\u0905\u0932 \u092e\u0947\u092e\u094b\u0930\u0940 \u092a\u0947\u091c\u093f\u0902\u0917 )","Direct Memory Access (DMA) ( \u0921\u093e\u092f\u0930\u0947\u0915\u094d\u091f \u092e\u0947\u092e\u094b\u0930\u0940 \u090f\u0915\u094d\u0938\u0947\u0938 )"],"answer":"2","solution":"Cache memory relies on the principle of \"Locality of Reference\" to predict which data the CPU will need next. Temporal locality assumes that recently accessed data will be accessed again soon. Spatial locality assumes that data located near recently accessed data (in adjacent memory addresses) will be needed soon. Additional Info (a) Multithreading allows a CPU to execute multiple threads concurrently, which is an execution model, not a caching principle. (b) By storing this highly probable data in the ultra-fast SRAM cache, the CPU avoids waiting on the much slower main memory (DRAM). (c) Virtual Memory paging moves data between RAM and the hard drive. (d) DMA allows hardware subsystems to access main memory independently of the CPU. Positive Mark: 0.8 Negative Mark: 0"},{"id":"84928","q":"47. The 2025 United Nations Climate Change Conference (COP30) is scheduled to be held in: 2025 \u0938\u0902\u092f\u0941\u0915\u094d\u0924 \u0930\u093e\u0937\u094d\u091f\u094d\u0930 \u091c\u0932\u0935\u093e\u092f\u0941 \u092a\u0930\u093f\u0935\u0930\u094d\u0924\u0928 \u0938\u092e\u094d\u092e\u0947\u0932\u0928 (COP30) \u0915\u0939\u093e\u0901 \u0906\u092f\u094b\u091c\u093f\u0924 \u0915\u093f\u092f\u093e \u091c\u093e\u0928\u093e \u0928\u093f\u0930\u094d\u0927\u093e\u0930\u093f\u0924 \u0939\u0948 ?","options":["Baku, Azerbaijan ( \u092c\u093e\u0915\u0942 , \u0905\u091c\u093c\u0930\u092c\u0948\u091c\u093e\u0928 )","Bel\u00e9m, Brazil ( \u092c\u0947\u0932\u0947\u092e , \u092c\u094d\u0930\u093e\u091c\u093c\u0940\u0932 )","Bonn, Germany ( \u092c\u0949\u0928 , \u091c\u0930\u094d\u092e\u0928\u0940 )","New York, USA ( \u0928\u094d\u092f\u0942\u092f\u0949\u0930\u094d\u0915 , \u092f\u0942\u090f\u0938\u090f )"],"answer":"2","solution":"COP30 is scheduled to be hosted in 2025 in the city of Bel\u00e9m, located in the state of Par\u00e1, Brazil. Hosting the conference in a city situated within the Amazon rainforest is highly symbolic, emphasizing the critical role of tropical forests in fighting global climate change. Additional Info (a) Baku, Azerbaijan hosted COP29 in 2024. (b) The \"Road to Bel\u00e9m\" is seen as a crucial deadline for nations to submit their updated and much stricter Nationally Determined Contributions (NDCs). (c) Bonn is the headquarters of the UNFCCC Secretariat and hosts mid-year climate meetings. (d) New York hosts the UN General Assembly and Climate Ambition Summits. Positive Mark: 0.8 Negative Mark: 0"},{"id":"84929","q":"48. In Web Development, when designing a RESTful API, which HTTP method should strictly be used to completely replace or update an existing resource? \u0935\u0947\u092c \u0921\u0947\u0935\u0932\u092a\u092e\u0947\u0902\u091f \u092e\u0947\u0902 , RESTful API \u0921\u093f\u091c\u093c\u093e\u0907\u0928 \u0915\u0930\u0924\u0947 \u0938\u092e\u092f , \u0915\u093f\u0938\u0940 \u092e\u094c\u091c\u0942\u0926\u093e \u0938\u0902\u0938\u093e\u0927\u0928 (resource) \u0915\u094b \u092a\u0942\u0930\u0940 \u0924\u0930\u0939 \u0938\u0947 \u092c\u0926\u0932\u0928\u0947 \u092f\u093e \u0905\u092a\u0921\u0947\u091f \u0915\u0930\u0928\u0947 \u0915\u0947 \u0932\u093f\u090f \u0915\u0921\u093c\u093e\u0908 \u0938\u0947 \u0915\u093f\u0938 HTTP \u0935\u093f\u0927\u093f \u0915\u093e \u0909\u092a\u092f\u094b\u0917 \u0915\u093f\u092f\u093e \u091c\u093e\u0928\u093e \u091a\u093e\u0939\u093f\u090f ?","options":["GET","POST","PUT","PATCH"],"answer":"3","solution":"In RESTful API architecture, the PUT method is designed to completely update or replace a target resource with the request payload. It is idempotent, meaning making the same PUT request multiple times will always yield the exact same end state. Additional Info (a) GET is used solely to retrieve data. (b) POST is used to create a completely new resource. (c) PUT overwrites the entire resource. (d) PATCH is used to make partial modifications to a resource (updating just one field, rather than replacing the whole entity). Positive Mark: 0.8 Negative Mark: 0"},{"id":"84930","q":"49. In population genetics, the Hardy-Weinberg equilibrium principle states that allele and genotype frequencies in a population will remain constant from generation to generation in the absence of other evolutionary influences. Which of the following is an assumption required for this equilibrium? \u091c\u0928\u0938\u0902\u0916\u094d\u092f\u093e \u0906\u0928\u0941\u0935\u0902\u0936\u093f\u0915\u0940 \u092e\u0947\u0902 , \u0939\u093e\u0930\u094d\u0921\u0940 - \u0935\u0947\u0928\u092c\u0930\u094d\u0917 \u0938\u0902\u0924\u0941\u0932\u0928 \u0938\u093f\u0926\u094d\u0927\u093e\u0902\u0924 \u092c\u0924\u093e\u0924\u093e \u0939\u0948 \u0915\u093f \u090f\u0915 \u0906\u092c\u093e\u0926\u0940 \u092e\u0947\u0902 \u090f\u0932\u0940\u0932 \u0914\u0930 \u091c\u0940\u0928\u094b\u091f\u093e\u0907\u092a \u0906\u0935\u0943\u0924\u094d\u0924\u093f\u092f\u093e\u0901 \u0905\u0928\u094d\u092f \u0935\u093f\u0915\u093e\u0938\u0935\u093e\u0926\u0940 \u092a\u094d\u0930\u092d\u093e\u0935\u094b\u0902 \u0915\u0940 \u0905\u0928\u0941\u092a\u0938\u094d\u0925\u093f\u0924\u093f \u092e\u0947\u0902 \u092a\u0940\u0922\u093c\u0940 \u0926\u0930 \u092a\u0940\u0922\u093c\u0940 \u0938\u094d\u0925\u093f\u0930 \u0930\u0939\u0947\u0902\u0917\u0940\u0964 \u0907\u0938 \u0938\u0902\u0924\u0941\u0932\u0928 \u0915\u0947 \u0932\u093f\u090f \u0928\u093f\u092e\u094d\u0928\u0932\u093f\u0916\u093f\u0924 \u092e\u0947\u0902 \u0938\u0947 \u0915\u094c\u0928 \u0938\u0940 \u0927\u093e\u0930\u0923\u093e \u0906\u0935\u0936\u094d\u092f\u0915 \u0939\u0948 ?","options":["High rate of mutation ( \u0909\u0924\u094d\u092a\u0930\u093f\u0935\u0930\u094d\u0924\u0928 \u0915\u0940 \u0909\u091a\u094d\u091a \u0926\u0930 )","Non-random mating ( \u0917\u0948\u0930 - \u092f\u093e\u0926\u0943\u091a\u094d\u091b\u093f\u0915 \u0938\u0902\u092d\u094b\u0917 )","Small population size ( \u091b\u094b\u091f\u0940 \u091c\u0928\u0938\u0902\u0916\u094d\u092f\u093e \u0915\u093e \u0906\u0915\u093e\u0930 )","No gene flow (migration) ( \u0915\u094b\u0908 \u091c\u0940\u0928 \u092a\u094d\u0930\u0935\u093e\u0939 ( \u092a\u094d\u0930\u0935\u093e\u0938 ) \u0928\u0939\u0940\u0902 )"],"answer":"4","solution":"The Hardy-Weinberg equilibrium relies on five strict theoretical assumptions: 1) No mutation, 2) Random mating, 3) No gene flow (no immigration or emigration), 4) Very large (theoretically infinite) population size, and 5) No natural selection. Therefore, \"no gene flow\" is the correct requirement. Additional Info (a) Mutations introduce new alleles, disrupting the equilibrium. (b) Non-random mating changes genotype frequencies, violating the equilibrium. (c) A small population size leads to genetic drift (random fluctuations), violating the equilibrium. (d) Gene flow introduces external alleles into the gene pool, so its absence is required. Positive Mark: 0.8 Negative Mark: 0"},{"id":"84931","q":"50. The 'Concurrent List' contains subjects of common interest to both the Union and the States. How many items does it currently contain (following the 42nd Amendment)? ' \u0938\u092e\u0935\u0930\u094d\u0924\u0940 \u0938\u0942\u091a\u0940 ' \u092e\u0947\u0902 \u0938\u0902\u0918 \u0914\u0930 \u0930\u093e\u091c\u094d\u092f\u094b\u0902 \u0926\u094b\u0928\u094b\u0902 \u0915\u0947 \u0938\u092e\u093e\u0928 \u0939\u093f\u0924 \u0915\u0947 \u0935\u093f\u0937\u092f \u0936\u093e\u092e\u093f\u0932 \u0939\u0948\u0902\u0964 \u0935\u0930\u094d\u0924\u092e\u093e\u0928 \u092e\u0947\u0902 \u0907\u0938\u092e\u0947\u0902 \u0915\u093f\u0924\u0928\u0947 \u0935\u093f\u0937\u092f ( \u0906\u0907\u091f\u092e ) \u0936\u093e\u092e\u093f\u0932 \u0939\u0948\u0902 (42 \u0935\u0947\u0902 \u0938\u0902\u0936\u094b\u0927\u0928 \u0915\u0947 \u092c\u093e\u0926 )?","options":["47 items (originally 47, now 52)","66 items (originally 66, now 61)","97 items (originally 97, now 100)","100 items (originally 100, now 97)"],"answer":"1","solution":"The Concurrent List (List III in the Seventh Schedule) originally contained 47 items. The 42nd Constitutional Amendment Act of 1976 transferred five subjects from the State List to the Concurrent List, bringing the current total to 52 items (though the last numbered item remains 47). Additional Info (a) The five subjects moved were Education, Forests, Weights and Measures, Protection of Wild Animals and Birds, and Administration of Justice. (b) This represents the State List (originally 66, now 61 items). (c) This represents the Union List (originally 97, now 100 items). (d) Incorrect configuration of the Union List numbers. Positive Mark: 0.8 Negative Mark: 0"},{"id":"84932","q":"51. The 'Barabar Caves', representing some of the oldest surviving rock-cut caves in India, are located in which district of Bihar? \u092d\u093e\u0930\u0924 \u092e\u0947\u0902 \u0938\u092c\u0938\u0947 \u092a\u0941\u0930\u093e\u0928\u0940 \u091c\u0940\u0935\u093f\u0924 \u0930\u0949\u0915 - \u0915\u091f \u0917\u0941\u092b\u093e\u0913\u0902 \u0915\u093e \u092a\u094d\u0930\u0924\u093f\u0928\u093f\u0927\u093f\u0924\u094d\u0935 \u0915\u0930\u0928\u0947 \u0935\u093e\u0932\u0940 ' \u092c\u0930\u093e\u092c\u0930 \u0917\u0941\u092b\u093e\u090f\u0902 ' \u092c\u093f\u0939\u093e\u0930 \u0915\u0947 \u0915\u093f\u0938 \u091c\u093f\u0932\u0947 \u092e\u0947\u0902 \u0938\u094d\u0925\u093f\u0924 \u0939\u0948\u0902 ?","options":["Gaya ( \u0917\u092f\u093e )","Jehanabad ( \u091c\u0939\u093e\u0928\u093e\u092c\u093e\u0926 )","Nalanda ( \u0928\u093e\u0932\u0902\u0926\u093e )","Rohtas ( \u0930\u094b\u0939\u0924\u093e\u0938 )"],"answer":"2","solution":"The Barabar Caves are situated in the Makhdumpur region of Jehanabad district in Bihar. Carved out of solid granite during the Mauryan period (mostly under Emperor Ashoka), they are the oldest surviving rock-cut caves in India. Additional Info (a) Gaya is located south of Jehanabad and is famous for the Mahabodhi Temple. (b) The caves were primarily used by ascetics of the Ajivika sect and are famous for their highly polished interiors. (c) Nalanda is famous for the ancient Mahavihara university ruins. (d) Rohtas is known for the tomb of Sher Shah Suri and Rohtasgarh Fort. Positive Mark: 0.8 Negative Mark: 0"},{"id":"84933","q":"52. In astrophysics, the phenomenon where light emitted from a galaxy moving rapidly away from Earth shifts towards longer wavelengths is known as: \u0916\u0917\u094b\u0932 \u092d\u094c\u0924\u093f\u0915\u0940 \u092e\u0947\u0902 , \u0935\u0939 \u0918\u091f\u0928\u093e \u091c\u093f\u0938\u092e\u0947\u0902 \u092a\u0943\u0925\u094d\u0935\u0940 \u0938\u0947 \u0924\u0947\u091c\u0940 \u0938\u0947 \u0926\u0942\u0930 \u091c\u093e\u0928\u0947 \u0935\u093e\u0932\u0940 \u0906\u0915\u093e\u0936\u0917\u0902\u0917\u093e \u0938\u0947 \u0909\u0924\u094d\u0938\u0930\u094d\u091c\u093f\u0924 \u092a\u094d\u0930\u0915\u093e\u0936 \u0932\u0902\u092c\u0940 \u0924\u0930\u0902\u0917 \u0926\u0948\u0930\u094d\u0927\u094d\u092f (longer wavelengths) \u0915\u0940 \u0913\u0930 \u0936\u093f\u092b\u094d\u091f \u0939\u094b \u091c\u093e\u0924\u093e \u0939\u0948 , \u0915\u094d\u092f\u093e \u0915\u0939\u0932\u093e\u0924\u0940 \u0939\u0948 ?","options":["Blue shift ( \u092c\u094d\u0932\u0942 \u0936\u093f\u092b\u094d\u091f )","Red shift ( \u0930\u0947\u0921 \u0936\u093f\u092b\u094d\u091f )","Chromatic aberration ( \u0915\u094d\u0930\u094b\u092e\u0948\u091f\u093f\u0915 \u090f\u092c\u0930\u0947\u0936\u0928 )","Rayleigh scattering ( \u0930\u0947\u0932\u0947 \u0938\u094d\u0915\u0948\u091f\u0930\u093f\u0902\u0917 )"],"answer":"2","solution":"Cosmological \"Red shift\" occurs when light from an object moving away from the observer is stretched, increasing its wavelength and shifting it toward the red end of the electromagnetic spectrum. This provides primary evidence for the expansion of the universe. Additional Info (a) A \"Blue shift\" occurs when an object is moving towards the observer, compressing the wavelength. (b) It is a direct manifestation of the Doppler effect applied to light waves. (c) Chromatic aberration is an optical distortion in lenses where different colors focus at different distances. (d) Rayleigh scattering causes the Earth's sky to appear blue. Positive Mark: 0.8 Negative Mark: 0"},{"id":"84934","q":"53. In the specialized treatment of electronic waste (e-waste), 'Hydrometallurgy' refers to the process of: \u0907\u0932\u0947\u0915\u094d\u091f\u094d\u0930\u0949\u0928\u093f\u0915 \u0915\u091a\u0930\u0947 ( \u0908 - \u0915\u091a\u0930\u093e ) \u0915\u0947 \u0935\u093f\u0936\u0947\u0937 \u0909\u092a\u091a\u093e\u0930 \u092e\u0947\u0902 , ' \u0939\u093e\u0907\u0921\u094d\u0930\u094b\u092e\u0947\u091f\u093e\u0932\u0930\u094d\u091c\u0940 ' (Hydrometallurgy) \u0915\u0940 \u092a\u094d\u0930\u0915\u094d\u0930\u093f\u092f\u093e \u0915\u093e \u0924\u093e\u0924\u094d\u092a\u0930\u094d\u092f \u0939\u0948 :","options":["Melting e-waste at extremely high temperatures in a blast furnace ( \u092c\u094d\u0932\u093e\u0938\u094d\u091f \u092b\u0930\u094d\u0928\u0947\u0938 \u092e\u0947\u0902 \u0905\u0924\u094d\u092f\u0927\u093f\u0915 \u0909\u091a\u094d\u091a \u0924\u093e\u092a\u092e\u093e\u0928 \u092a\u0930 \u0908 - \u0915\u091a\u0930\u0947 \u0915\u094b \u092a\u093f\u0918\u0932\u093e\u0928\u093e )","Using liquid solvents and acids to leach and extract precious metals from circuit boards ( \u0938\u0930\u094d\u0915\u093f\u091f \u092c\u094b\u0930\u094d\u0921 \u0938\u0947 \u0915\u0940\u092e\u0924\u0940 \u0927\u093e\u0924\u0941\u0913\u0902 \u0915\u094b \u0928\u093f\u0915\u093e\u0932\u0928\u0947 \u0915\u0947 \u0932\u093f\u090f \u0924\u0930\u0932 \u0938\u0949\u0932\u094d\u0935\u0948\u0902\u091f\u094d\u0938 \u0914\u0930 \u090f\u0938\u093f\u0921 \u0915\u093e \u0909\u092a\u092f\u094b\u0917 \u0915\u0930\u0928\u093e )","Using microorganisms to break down toxic plastics ( \u091c\u0939\u0930\u0940\u0932\u0947 \u092a\u094d\u0932\u093e\u0938\u094d\u091f\u093f\u0915 \u0915\u094b \u0924\u094b\u0921\u093c\u0928\u0947 \u0915\u0947 \u0932\u093f\u090f \u0938\u0942\u0915\u094d\u0937\u094d\u092e\u091c\u0940\u0935\u094b\u0902 \u0915\u093e \u0909\u092a\u092f\u094b\u0917 \u0915\u0930\u0928\u093e )","Compacting e-waste using high-pressure hydraulic presses ( \u0909\u091a\u094d\u091a \u0926\u092c\u093e\u0935 \u0935\u093e\u0932\u0947 \u0939\u093e\u0907\u0921\u094d\u0930\u094b\u0932\u093f\u0915 \u092a\u094d\u0930\u0947\u0938 \u0915\u093e \u0909\u092a\u092f\u094b\u0917 \u0915\u0930\u0915\u0947 \u0908 - \u0915\u091a\u0930\u0947 \u0915\u094b \u0915\u0949\u092e\u094d\u092a\u0948\u0915\u094d\u091f \u0915\u0930\u0928\u093e )"],"answer":"2","solution":"Hydrometallurgy is an aqueous chemical process used in e-waste recycling to extract and recover precious and base metals (like gold, silver, and copper) from printed circuit boards using highly specific liquid chemical solvents and strong acids (leaching). Additional Info (a) Using high temperatures and furnaces to extract metals is called Pyrometallurgy. (b) Hydrometallurgy is generally more energy-efficient and precise than pyrometallurgy but requires careful management of toxic liquid wastewater. (c) Using microorganisms to extract metals is called Bioleaching or Biomining. (d) Hydraulic compaction is just volume reduction, not chemical metal extraction. Positive Mark: 0.8 Negative Mark: 0"},{"id":"84935","q":"54. The 'Repo Rate', a critical tool for managing inflation, is determined and announced by the: ( \u092e\u0941\u0926\u094d\u0930\u093e\u0938\u094d\u092b\u0940\u0924\u093f \u0915\u094b \u092a\u094d\u0930\u092c\u0902\u0927\u093f\u0924 \u0915\u0930\u0928\u0947 \u0915\u0947 \u0932\u093f\u090f \u090f\u0915 \u092e\u0939\u0924\u094d\u0935\u092a\u0942\u0930\u094d\u0923 \u0909\u092a\u0915\u0930\u0923 ' \u0930\u0947\u092a\u094b \u0930\u0947\u091f ', \u0915\u093f\u0938\u0915\u0947 \u0926\u094d\u0935\u093e\u0930\u093e \u0928\u093f\u0930\u094d\u0927\u093e\u0930\u093f\u0924 \u0914\u0930 \u0918\u094b\u0937\u093f\u0924 \u0915\u093f\u092f\u093e \u091c\u093e\u0924\u093e \u0939\u0948 ?)","options":["Ministry of Finance ( \u0935\u093f\u0924\u094d\u0924 \u092e\u0902\u0924\u094d\u0930\u093e\u0932\u092f )","State Bank of India ( \u092d\u093e\u0930\u0924\u0940\u092f \u0938\u094d\u091f\u0947\u091f \u092c\u0948\u0902\u0915 )","NITI Aayog ( \u0928\u0940\u0924\u093f \u0906\u092f\u094b\u0917 )","Monetary Policy Committee (MPC) of the RBI (RBI \u0915\u0940 \u092e\u094c\u0926\u094d\u0930\u093f\u0915 \u0928\u0940\u0924\u093f \u0938\u092e\u093f\u0924\u093f (MPC))"],"answer":"4","solution":"The Repo Rate is the key policy interest rate at which the Reserve Bank of India (RBI) lends money to commercial banks. It is determined and announced bi-monthly by the Monetary Policy Committee (MPC) of the RBI, which is tasked with keeping inflation within target limits. Additional Info (a) The Ministry of Finance manages fiscal policy (taxation and government spending). (b) The State Bank of India (SBI) is a commercial public sector bank. (c) NITI Aayog is a public policy think tank. (d) The MPC consists of six members: three from the RBI (including the Governor) and three external members appointed by the Government. Positive Mark: 0.8 Negative Mark: 0"},{"id":"84936","q":"55. Which Indian state was the first to pass a Uniform Civil Code (UCC) bill post-independence, enacting it in early 2024 for implementation ahead of 2025? \u0938\u094d\u0935\u0924\u0902\u0924\u094d\u0930\u0924\u093e \u0915\u0947 \u092c\u093e\u0926 2025 \u0938\u0947 \u092a\u0939\u0932\u0947 \u0915\u093e\u0930\u094d\u092f\u093e\u0928\u094d\u0935\u092f\u0928 \u0915\u0947 \u0932\u093f\u090f 2024 \u0915\u0940 \u0936\u0941\u0930\u0941\u0906\u0924 \u092e\u0947\u0902 \u0938\u092e\u093e\u0928 \u0928\u093e\u0917\u0930\u093f\u0915 \u0938\u0902\u0939\u093f\u0924\u093e (UCC) \u0935\u093f\u0927\u0947\u092f\u0915 \u092a\u093e\u0930\u093f\u0924 \u0915\u0930\u0928\u0947 \u0935\u093e\u0932\u093e \u092a\u0939\u0932\u093e \u092d\u093e\u0930\u0924\u0940\u092f \u0930\u093e\u091c\u094d\u092f \u0915\u094c\u0928 \u0938\u093e \u0925\u093e ?","options":["Gujarat ( \u0917\u0941\u091c\u0930\u093e\u0924 )","Goa ( \u0917\u094b\u0935\u093e )","Uttarakhand ( \u0909\u0924\u094d\u0924\u0930\u093e\u0916\u0902\u0921 )","Assam ( \u0905\u0938\u092e )"],"answer":"3","solution":"Uttarakhand became the first state in post-independence India to pass a Uniform Civil Code (UCC) bill. The state assembly passed the legislation in early 2024, aiming to establish uniform laws regarding marriage, divorce, succession, and live-in relationships across all religious communities. Additional Info (a) Gujarat has formed committees to explore a UCC but was not the first to pass the bill. (b) Goa has had a Uniform Civil Code since Portuguese rule (the Goa Civil Code of 1867), making it a pre-independence legacy. (c) The Uttarakhand UCC heavily regulates live-in relationships, making registration mandatory. (d) Assam has also signaled strong intentions to introduce a UCC following Uttarakhand's model. Positive Mark: 0.8 Negative Mark: 0"},{"id":"84937","q":"56. In Operating System theory, which of the following is not one of the four necessary conditions for a \"Deadlock\" to occur? \u0911\u092a\u0930\u0947\u091f\u093f\u0902\u0917 \u0938\u093f\u0938\u094d\u091f\u092e \u0925\u094d\u092f\u094b\u0930\u0940 \u092e\u0947\u0902 , \" \u0921\u0947\u0921\u0949\u0915 \" (Deadlock) \u0939\u094b\u0928\u0947 \u0915\u0947 \u0932\u093f\u090f \u091a\u093e\u0930 \u0906\u0935\u0936\u094d\u092f\u0915 \u0936\u0930\u094d\u0924\u094b\u0902 \u092e\u0947\u0902 \u0938\u0947 \u0915\u094c\u0928 \u0938\u0940 \u090f\u0915 \u0928\u0939\u0940\u0902 \u0939\u0948 ?","options":["Mutual Exclusion ( \u092e\u094d\u092f\u0942\u091a\u0941\u0905\u0932 \u090f\u0915\u094d\u0938\u0915\u094d\u0932\u0942\u091c\u0928 )","Hold and Wait ( \u0939\u094b\u0932\u094d\u0921 \u090f\u0902\u0921 \u0935\u0947\u091f )","Preemption ( \u092a\u094d\u0930\u093f\u090f\u092e\u094d\u092a\u0936\u0928 )","Circular Wait ( \u0938\u0930\u094d\u0915\u0941\u0932\u0930 \u0935\u0947\u091f )"],"answer":"3","solution":"For a deadlock to occur in a system, four Coffman conditions must hold simultaneously: Mutual Exclusion, Hold and Wait, No Preemption, and Circular Wait. Therefore, \"Preemption\" (the ability to forcibly take a resource away from a process) is the correct answer, as its presence actually prevents deadlocks. Additional Info (a) Mutual Exclusion means at least one resource must be held in a non-shareable mode. (b) Hold and Wait means a process holding at least one resource is waiting to acquire additional resources held by others. (c) Deadlock requires No Preemption (resources cannot be forcibly taken). (d) Circular Wait means a closed chain of processes exists, where each is waiting for a resource held by the next. Positive Mark: 0.8 Negative Mark: 0"},{"id":"84938","q":"57. According to VSEPR theory, the molecular geometry (shape) of Xenon tetrafluoride ( ) is: VSEPR \u0938\u093f\u0926\u094d\u0927\u093e\u0902\u0924 \u0915\u0947 \u0905\u0928\u0941\u0938\u093e\u0930 , \u091c\u093c\u0947\u0928\u0949\u0928 \u091f\u0947\u091f\u094d\u0930\u093e\u092b\u094d\u0932\u094b\u0930\u093e\u0907\u0921 (XeF4) \u0915\u0940 \u0906\u0923\u0935\u093f\u0915 \u091c\u094d\u092f\u093e\u092e\u093f\u0924\u093f ( \u0906\u0915\u093e\u0930 ) \u0915\u094d\u092f\u093e \u0939\u0948 ?","options":["Tetrahedral ( \u091a\u0924\u0941\u0937\u094d\u092b\u0932\u0915\u0940\u092f )","Square planar ( \u0935\u0930\u094d\u0917 \u0938\u092e\u0924\u0932\u0940\u092f )","See-saw ( \u0938\u0940 - \u0938\u0949 )","Octahedral ( \u0905\u0937\u094d\u091f\u092b\u0932\u0915\u0940\u092f )"],"answer":"2","solution":"In Xenon tetrafluoride ( ), the central Xenon atom has 8 valence electrons. It forms 4 single bonds with Fluorine and retains 2 lone pairs. This gives it a steric number of 6 (octahedral electron geometry). However, to minimize repulsion, the two lone pairs occupy opposite axial positions, resulting in a \"Square planar\" molecular geometry. Additional Info (a) Methane ( ) has a tetrahedral geometry. (b) The bond angles in a square planar geometry are 90 degrees. (c) Sulfur tetrafluoride ( ) has a see-saw geometry due to one lone pair. (d) Sulfur hexafluoride ( ) has a complete octahedral geometry with zero lone pairs. Positive Mark: 0.8 Negative Mark: 0"},{"id":"84939","q":"58. Who was awarded the \"Bharat Ratna\" (posthumously) in 2024 for his monumental contribution to social justice and reservation policies in Bihar? \u092c\u093f\u0939\u093e\u0930 \u092e\u0947\u0902 \u0938\u093e\u092e\u093e\u091c\u093f\u0915 \u0928\u094d\u092f\u093e\u092f \u0914\u0930 \u0906\u0930\u0915\u094d\u0937\u0923 \u0928\u0940\u0924\u093f\u092f\u094b\u0902 \u092e\u0947\u0902 \u0909\u0928\u0915\u0947 \u0938\u094d\u092e\u093e\u0930\u0915\u0940\u092f \u092f\u094b\u0917\u0926\u093e\u0928 \u0915\u0947 \u0932\u093f\u090f 2024 \u092e\u0947\u0902 ( \u092e\u0930\u0923\u094b\u092a\u0930\u093e\u0902\u0924 ) \u0915\u093f\u0938\u0947 \" \u092d\u093e\u0930\u0924 \u0930\u0924\u094d\u0928 \" \u0938\u0947 \u0938\u092e\u094d\u092e\u093e\u0928\u093f\u0924 \u0915\u093f\u092f\u093e \u0917\u092f\u093e \u0925\u093e ?","options":["Lalit Narayan Mishra ( \u0932\u0932\u093f\u0924 \u0928\u093e\u0930\u093e\u092f\u0923 \u092e\u093f\u0936\u094d\u0930\u093e )","Karpoori Thakur ( \u0915\u0930\u094d\u092a\u0942\u0930\u0940 \u0920\u093e\u0915\u0941\u0930 )","Jagjivan Ram ( \u091c\u0917\u091c\u0940\u0935\u0928 \u0930\u093e\u092e )","Jayaprakash Narayan ( \u091c\u092f\u092a\u094d\u0930\u0915\u093e\u0936 \u0928\u093e\u0930\u093e\u092f\u0923 )"],"answer":"2","solution":"Karpoori Thakur, a highly revered socialist leader and former Chief Minister of Bihar, was posthumously awarded the Bharat Ratna in early 2024. He is famously remembered as \"Jan Nayak\" (People's Hero) for his pioneering work in implementing the Mungeri Lal Commission recommendations, which provided layered reservations for backward classes in Bihar. Additional Info (a) Lalit Narayan Mishra was a prominent politician and Railway Minister. (b) His policies formed the blueprint for the later national Mandal Commission recommendations. (c) Jagjivan Ram was a champion for Dalit rights and a former Deputy Prime Minister. (d) Jayaprakash Narayan was awarded the Bharat Ratna in 1999 for leading the Total Revolution. Positive Mark: 0.8 Negative Mark: 0"},{"id":"84940","q":"59. Which of the following is NOT a tributary of the Ganga River? \u0928\u093f\u092e\u094d\u0928\u0932\u093f\u0916\u093f\u0924 \u092e\u0947\u0902 \u0938\u0947 \u0915\u094c\u0928 \u0917\u0902\u0917\u093e \u0928\u0926\u0940 \u0915\u0940 \u0938\u0939\u093e\u092f\u0915 \u0928\u0926\u0940 \u0928\u0939\u0940\u0902 \u0939\u0948 ?","options":["Yamuna ( \u092f\u092e\u0941\u0928\u093e )","Son ( \u0938\u094b\u0928 )","Kosi ( \u0915\u094b\u0938\u0940 )","Godavari ( \u0917\u094b\u0926\u093e\u0935\u0930\u0940 )"],"answer":"4","solution":"The Godavari is a major peninsular river in South India. It originates in Maharashtra and flows entirely separately from the Ganga basin, eventually draining into the Bay of Bengal. It is not a tributary of the Ganga. Additional Info (a) The Yamuna is the longest and most voluminous right-bank tributary of the Ganga. (b) The Son river is a major right-bank tributary that joins the Ganga near Patna. (c) The Kosi is a major left-bank tributary that joins the Ganga in Bihar. (d) The Godavari is often called the \"Dakshin Ganga\" (Ganges of the South) due to its immense size and cultural significance. Positive Mark: 0.8 Negative Mark: 0"},{"id":"84941","q":"60. The 'Bhojpur' region of Bihar is culturally renowned for a traditional folk theater form known as: \u092c\u093f\u0939\u093e\u0930 \u0915\u093e ' \u092d\u094b\u091c\u092a\u0941\u0930 ' \u0915\u094d\u0937\u0947\u0924\u094d\u0930 \u0938\u093e\u0902\u0938\u094d\u0915\u0943\u0924\u093f\u0915 \u0930\u0942\u092a \u0938\u0947 \u090f\u0915 \u092a\u093e\u0930\u0902\u092a\u0930\u093f\u0915 \u0932\u094b\u0915 \u0930\u0902\u0917\u092e\u0902\u091a \u0915\u0947 \u0930\u0942\u092a \u0915\u0947 \u0932\u093f\u090f \u092a\u094d\u0930\u0938\u093f\u0926\u094d\u0927 \u0939\u0948 \u091c\u093f\u0938\u0947 \u091c\u093e\u0928\u093e \u091c\u093e\u0924\u093e \u0939\u0948 :","options":["Bidesiya ( \u092c\u093f\u0926\u0947\u0938\u093f\u092f\u093e )","Jatra ( \u091c\u093e\u0924\u094d\u0930\u093e )","Yakshagana ( \u092f\u0915\u094d\u0937\u0917\u093e\u0928 )","Bhavai ( \u092d\u0935\u0908 )"],"answer":"1","solution":"Bidesiya is a highly popular traditional folk theater form originating from the Bhojpuri-speaking regions of Bihar. Created by the legendary playwright Bhikhari Thakur, it vividly portrays the social issues, migration, and emotional struggles of the rural working class. Additional Info (a) Bhikhari Thakur is widely celebrated as the \"Shakespeare of Bhojpuri.\" (b) Jatra is a popular folk theater form in West Bengal and Odisha. (c) Yakshagana is a traditional, elaborate theater form from Karnataka. (d) Bhavai is a popular folk theater form of Gujarat. Positive Mark: 0.8 Negative Mark: 0"},{"id":"84942","q":"61. Which specific class of immunoglobulins (antibodies) is most abundantly found in a mother's colostrum, providing critical early mucosal immunity to the newborn? \u0907\u092e\u094d\u092f\u0941\u0928\u094b\u0917\u094d\u0932\u094b\u092c\u0941\u0932\u093f\u0928 ( \u090f\u0902\u091f\u0940\u092c\u0949\u0921\u0940 ) \u0915\u093e \u0915\u094c\u0928 \u0938\u093e \u0935\u093f\u0936\u093f\u0937\u094d\u091f \u0935\u0930\u094d\u0917 \u092e\u093e\u0901 \u0915\u0947 \u0915\u094b\u0932\u094b\u0938\u094d\u091f\u094d\u0930\u092e \u092e\u0947\u0902 \u0938\u092c\u0938\u0947 \u092a\u094d\u0930\u091a\u0941\u0930 \u092e\u093e\u0924\u094d\u0930\u093e \u092e\u0947\u0902 \u092a\u093e\u092f\u093e \u091c\u093e\u0924\u093e \u0939\u0948 , \u091c\u094b \u0928\u0935\u091c\u093e\u0924 \u0936\u093f\u0936\u0941 \u0915\u094b \u092e\u0939\u0924\u094d\u0935\u092a\u0942\u0930\u094d\u0923 \u092a\u094d\u0930\u093e\u0930\u0902\u092d\u093f\u0915 \u0936\u094d\u0932\u0948\u0937\u094d\u092e\u093f\u0915 \u092a\u094d\u0930\u0924\u093f\u0930\u0915\u094d\u0937\u093e (mucosal immunity) \u092a\u094d\u0930\u0926\u093e\u0928 \u0915\u0930\u0924\u093e \u0939\u0948 ?","options":["IgG","IgM","IgA","IgE"],"answer":"3","solution":"Immunoglobulin A (IgA) is the principal antibody class found in bodily secretions, including saliva, tears, and breast milk. It is highly abundant in colostrum (the first milk produced after birth), providing the newborn with crucial passive mucosal immunity to protect against gastrointestinal and respiratory pathogens. Additional Info (a) IgG is the most abundant antibody in blood plasma and the only one capable of crossing the placenta to the fetus. (b) IgM is the first antibody produced by the immune system in response to an initial infection. (c) Secretory IgA forms a protective coating on the infant's mucous membranes. (d) IgE is primarily involved in allergic reactions and defense against parasitic worms. Positive Mark: 0.8 Negative Mark: 0"},{"id":"84943","q":"62. According to the Solid Waste Management Rules, 2016, the legal responsibility for the initial segregation of waste into wet, dry, and domestic hazardous categories lies exclusively with: \u0920\u094b\u0938 \u0905\u092a\u0936\u093f\u0937\u094d\u091f \u092a\u094d\u0930\u092c\u0902\u0927\u0928 \u0928\u093f\u092f\u092e , 2016 \u0915\u0947 \u0905\u0928\u0941\u0938\u093e\u0930 , \u0915\u091a\u0930\u0947 \u0915\u094b \u0917\u0940\u0932\u0947 , \u0938\u0942\u0916\u0947 \u0914\u0930 \u0918\u0930\u0947\u0932\u0942 \u0916\u0924\u0930\u0928\u093e\u0915 \u0936\u094d\u0930\u0947\u0923\u093f\u092f\u094b\u0902 \u092e\u0947\u0902 \u092a\u094d\u0930\u093e\u0930\u0902\u092d\u093f\u0915 \u0930\u0942\u092a \u0938\u0947 \u0905\u0932\u0917 \u0915\u0930\u0928\u0947 \u0915\u0940 \u0915\u093e\u0928\u0942\u0928\u0940 \u091c\u093f\u092e\u094d\u092e\u0947\u0926\u093e\u0930\u0940 \u0935\u093f\u0936\u0947\u0937 \u0930\u0942\u092a \u0938\u0947 \u0915\u093f\u0938\u0915\u0940 \u0939\u0948 ?","options":["The Municipal Corporation ( \u0928\u0917\u0930 \u0928\u093f\u0917\u092e )","The State Pollution Control Board ( \u0930\u093e\u091c\u094d\u092f \u092a\u094d\u0930\u0926\u0942\u0937\u0923 \u0928\u093f\u092f\u0902\u0924\u094d\u0930\u0923 \u092c\u094b\u0930\u094d\u0921 )","The Waste Generator ( \u0915\u091a\u0930\u093e \u0909\u0924\u094d\u092a\u0928\u094d\u0928 \u0915\u0930\u0928\u0947 \u0935\u093e\u0932\u093e )","The Central Pollution Control Board ( \u0915\u0947\u0902\u0926\u094d\u0930\u0940\u092f \u092a\u094d\u0930\u0926\u0942\u0937\u0923 \u0928\u093f\u092f\u0902\u0924\u094d\u0930\u0923 \u092c\u094b\u0930\u094d\u0921 )"],"answer":"3","solution":"The Solid Waste Management Rules, 2016 strongly mandate source segregation. The primary legal responsibility to segregate waste into three streams (Wet/Biodegradable, Dry/Plastics/Paper, and Domestic Hazardous Waste) lies strictly with the individual \"Waste Generator\" (households, institutions, etc.) before handing it over to collectors. Additional Info (a) The Municipal Corporation is responsible for the collection, transportation, and final processing of the segregated waste. (b) The State Pollution Control Board acts as the monitoring and regulatory authority. (c) This rule shifted the burden of basic segregation away from downstream processing plants directly to citizens. (d) The CPCB sets the overarching national environmental guidelines and standards. Positive Mark: 0.8 Negative Mark: 0"},{"id":"84944","q":"63. The economic condition termed 'Stagflation' is characterized by: ' \u0938\u094d\u091f\u0948\u0917\u092b\u094d\u0932\u0947\u0936\u0928 ' (Stagflation) \u0928\u093e\u092e\u0915 \u0906\u0930\u094d\u0925\u093f\u0915 \u0938\u094d\u0925\u093f\u0924\u093f \u0915\u0940 \u0935\u093f\u0936\u0947\u0937\u0924\u093e \u0939\u0948 :","options":["High economic growth and high inflation ( \u0909\u091a\u094d\u091a \u0906\u0930\u094d\u0925\u093f\u0915 \u0935\u093f\u0915\u093e\u0938 \u0914\u0930 \u0909\u091a\u094d\u091a \u092e\u0941\u0926\u094d\u0930\u093e\u0938\u094d\u092b\u0940\u0924\u093f )","High inflation combined with high unemployment and stagnant demand ( \u0909\u091a\u094d\u091a \u092e\u0941\u0926\u094d\u0930\u093e\u0938\u094d\u092b\u0940\u0924\u093f \u0915\u0947 \u0938\u093e\u0925 - \u0938\u093e\u0925 \u0909\u091a\u094d\u091a \u092c\u0947\u0930\u094b\u091c\u0917\u093e\u0930\u0940 \u0914\u0930 \u0938\u094d\u0925\u093f\u0930 \u092e\u093e\u0902\u0917 )","Low inflation and low unemployment ( \u0915\u092e \u092e\u0941\u0926\u094d\u0930\u093e\u0938\u094d\u092b\u0940\u0924\u093f \u0914\u0930 \u0915\u092e \u092c\u0947\u0930\u094b\u091c\u0917\u093e\u0930\u0940 )","Deflation and rapid industrialization ( \u0905\u092a\u0938\u094d\u092b\u0940\u0924\u093f \u0914\u0930 \u0924\u0940\u0935\u094d\u0930 \u0914\u0926\u094d\u092f\u094b\u0917\u0940\u0915\u0930\u0923 )"],"answer":"2","solution":"Stagflation is a portmanteau of \"stagnation\" and \"inflation.\" It describes a rare, difficult macroeconomic condition where high inflation rates occur simultaneously with a stagnant economy (low or negative GDP growth) and persistently high unemployment. Additional Info (a) High inflation and high growth is typical of a standard economic expansion or \"boom.\" (b) Stagflation presents a dilemma for central banks, as standard policies to lower inflation (like raising interest rates) can further suppress growth and worsen unemployment. (c) Low inflation and low unemployment is ideal and sometimes called a \"Goldilocks economy.\" (d) Deflation is a general decline in prices, typically occurring during severe economic depressions. Positive Mark: 0.8 Negative Mark: 0"},{"id":"84945","q":"64. Which constitutional amendment officially introduced the 'Anti-Defection Law' into the Indian Constitution by adding the Tenth Schedule? \u0915\u093f\u0938 \u0938\u0902\u0935\u0948\u0927\u093e\u0928\u093f\u0915 \u0938\u0902\u0936\u094b\u0927\u0928 \u0928\u0947 \u0926\u0938\u0935\u0940\u0902 \u0905\u0928\u0941\u0938\u0942\u091a\u0940 \u091c\u094b\u0921\u093c\u0915\u0930 \u0906\u0927\u093f\u0915\u093e\u0930\u093f\u0915 \u0924\u094c\u0930 \u092a\u0930 \u092d\u093e\u0930\u0924\u0940\u092f \u0938\u0902\u0935\u093f\u0927\u093e\u0928 \u092e\u0947\u0902 ' \u0926\u0932 - \u092c\u0926\u0932 \u0935\u093f\u0930\u094b\u0927\u0940 \u0915\u093e\u0928\u0942\u0928 ' \u092a\u0947\u0936 \u0915\u093f\u092f\u093e ?","options":["42nd Amendment (42 \u0935\u093e\u0902 \u0938\u0902\u0936\u094b\u0927\u0928 )","44th Amendment (44 \u0935\u093e\u0902 \u0938\u0902\u0936\u094b\u0927\u0928 )","52nd Amendment (52 \u0935\u093e\u0902 \u0938\u0902\u0936\u094b\u0927\u0928 )","73rd Amendment (73 \u0935\u093e\u0902 \u0938\u0902\u0936\u094b\u0927\u0928 )"],"answer":"3","solution":"The 52nd Constitutional Amendment Act of 1985 introduced the Anti-Defection Law by inserting the Tenth Schedule into the Constitution. It aimed to bring stability to Indian politics by disqualifying elected legislators who defected from their original political parties. Additional Info (a) The 42nd Amendment (1976) made massive, centralized changes during the National Emergency. (b) The 44th Amendment (1978) restored civil liberties and removed the Right to Property as a fundamental right. (c) The Anti-Defection Law was a direct response to the \"Aaya Ram, Gaya Ram\" political culture of frequent party-switching. (d) The 73rd Amendment (1992) institutionalized the Panchayati Raj system. Positive Mark: 0.8 Negative Mark: 0"},{"id":"84946","q":"65. NASA's highly anticipated 'Artemis II' mission, scheduled for launch around 2025, has the primary operational objective of: 2025 \u0915\u0947 \u0906\u0938\u092a\u093e\u0938 \u0932\u0949\u0928\u094d\u091a \u0939\u094b\u0928\u0947 \u0935\u093e\u0932\u0947 \u0928\u093e\u0938\u093e \u0915\u0947 \u092c\u0939\u0941\u092a\u094d\u0930\u0924\u0940\u0915\u094d\u0937\u093f\u0924 ' \u0906\u0930\u094d\u091f\u0947\u092e\u093f\u0938 II' \u092e\u093f\u0936\u0928 \u0915\u093e \u092a\u094d\u0930\u093e\u0925\u092e\u093f\u0915 \u092a\u0930\u093f\u091a\u093e\u0932\u0928 \u0909\u0926\u094d\u0926\u0947\u0936\u094d\u092f \u0939\u0948 :","options":["Deploying a robotic rover to the Martian surface ( \u092e\u0902\u0917\u0932 \u0915\u0940 \u0938\u0924\u0939 \u092a\u0930 \u0930\u094b\u092c\u094b\u091f\u093f\u0915 \u0930\u094b\u0935\u0930 \u0924\u0948\u0928\u093e\u0924 \u0915\u0930\u0928\u093e )","Conducting a crewed flyby mission around the Moon and returning to Earth ( \u091a\u0902\u0926\u094d\u0930\u092e\u093e \u0915\u0947 \u091a\u093e\u0930\u094b\u0902 \u0913\u0930 \u090f\u0915 \u0915\u094d\u0930\u0942 \u092b\u094d\u0932\u093e\u0908\u092c\u093e\u0908 \u092e\u093f\u0936\u0928 \u0915\u093e \u0938\u0902\u091a\u093e\u0932\u0928 \u0915\u0930\u0928\u093e \u0914\u0930 \u092a\u0943\u0925\u094d\u0935\u0940 \u092a\u0930 \u0932\u094c\u091f\u0928\u093e )","Establishing a permanent human base on the Moon's south pole ( \u091a\u0902\u0926\u094d\u0930\u092e\u093e \u0915\u0947 \u0926\u0915\u094d\u0937\u093f\u0923\u0940 \u0927\u094d\u0930\u0941\u0935 \u092a\u0930 \u090f\u0915 \u0938\u094d\u0925\u093e\u092f\u0940 \u092e\u093e\u0928\u0935 \u0906\u0927\u093e\u0930 \u0938\u094d\u0925\u093e\u092a\u093f\u0924 \u0915\u0930\u0928\u093e )","Executing a kinetic impact to alter the trajectory of an asteroid ( \u090f\u0915 \u0915\u094d\u0937\u0941\u0926\u094d\u0930\u0917\u094d\u0930\u0939 \u0915\u0947 \u092a\u094d\u0930\u0915\u094d\u0937\u0947\u092a\u0935\u0915\u094d\u0930 \u0915\u094b \u092c\u0926\u0932\u0928\u0947 \u0915\u0947 \u0932\u093f\u090f \u090f\u0915 \u0917\u0924\u093f\u091c \u092a\u094d\u0930\u092d\u093e\u0935 \u0915\u094b \u0928\u093f\u0937\u094d\u092a\u093e\u0926\u093f\u0924 \u0915\u0930\u0928\u093e )"],"answer":"2","solution":"Artemis II is the second scheduled flight of the Artemis program and the very first crewed mission of NASA's Orion spacecraft. Its primary objective is to take a crew of four astronauts on an approximate 10-day flyby mission around the Moon to test life-support systems before returning safely to Earth. Additional Info (a) Mars rover missions (like Perseverance) are completely separate programs. (b) Artemis II will not land on the Moon; it paves the way for the lunar landing slated for Artemis III. (c) Establishing a base camp is the long-term goal of later Artemis missions (Artemis IV and beyond). (d) The DART mission was explicitly designed for asteroid interception and redirection. Positive Mark: 0.8 Negative Mark: 0"},{"id":"84947","q":"66. In SQL Database querying, a LEFT OUTER JOIN between Table A and Table B will return: (SQL \u0921\u0947\u091f\u093e\u092c\u0947\u0938 \u0915\u094d\u0935\u0947\u0930\u0940 \u092e\u0947\u0902 , \u091f\u0947\u092c\u0932 A \u0914\u0930 \u091f\u0947\u092c\u0932 B \u0915\u0947 \u092c\u0940\u091a \u090f\u0915 LEFT OUTER JOIN \u0915\u094d\u092f\u093e \u0930\u093f\u091f\u0930\u094d\u0928 \u0915\u0930\u0947\u0917\u093e ?)","options":["Only the records that have matching values in both tables ( \u0915\u0947\u0935\u0932 \u0935\u0947 \u0930\u093f\u0915\u0949\u0930\u094d\u0921 \u091c\u093f\u0928\u0915\u0947 \u0926\u094b\u0928\u094b\u0902 \u0924\u093e\u0932\u093f\u0915\u093e\u0913\u0902 \u092e\u0947\u0902 \u092e\u093f\u0932\u093e\u0928 \u092e\u0942\u0932\u094d\u092f \u0939\u0948\u0902 )","All records from Table A, and the matched records from Table B (with NULLs for unmatched Table B rows) ( \u091f\u0947\u092c\u0932 A \u0938\u0947 \u0938\u092d\u0940 \u0930\u093f\u0915\u0949\u0930\u094d\u0921 , \u0914\u0930 \u091f\u0947\u092c\u0932 B \u0938\u0947 \u092e\u0947\u0932 \u0916\u093e\u0928\u0947 \u0935\u093e\u0932\u0947 \u0930\u093f\u0915\u0949\u0930\u094d\u0921 ( \u092c\u0947\u092e\u0947\u0932 \u091f\u0947\u092c\u0932 B \u092a\u0902\u0915\u094d\u0924\u093f\u092f\u094b\u0902 \u0915\u0947 \u0932\u093f\u090f NULL \u0915\u0947 \u0938\u093e\u0925 ))","All records from Table B, and the matched records from Table A ( \u091f\u0947\u092c\u0932 B \u0938\u0947 \u0938\u092d\u0940 \u0930\u093f\u0915\u0949\u0930\u094d\u0921 , \u0914\u0930 \u091f\u0947\u092c\u0932 A \u0938\u0947 \u092e\u0947\u0932 \u0916\u093e\u0928\u0947 \u0935\u093e\u0932\u0947 \u0930\u093f\u0915\u0949\u0930\u094d\u0921 )","All records from both tables, combining them completely regardless of matches ( \u0926\u094b\u0928\u094b\u0902 \u0924\u093e\u0932\u093f\u0915\u093e\u0913\u0902 \u0938\u0947 \u0938\u092d\u0940 \u0930\u093f\u0915\u0949\u0930\u094d\u0921 , \u092e\u0948\u091a\u094b\u0902 \u0915\u0940 \u092a\u0930\u0935\u093e\u0939 \u0915\u093f\u090f \u092c\u093f\u0928\u093e \u0909\u0928\u094d\u0939\u0947\u0902 \u092a\u0942\u0930\u0940 \u0924\u0930\u0939 \u0938\u0947 \u0938\u0902\u092f\u094b\u091c\u093f\u0924 \u0915\u0930\u0928\u093e )"],"answer":"2","solution":"In SQL, a LEFT OUTER JOIN (or simply LEFT JOIN) returns all records from the left table (Table A), and the matched records from the right table (Table B). If there is no match for a row in Table A, the result will still contain the row from Table A, but with NULL values in the columns originating from Table B. Additional Info (a) This describes an INNER JOIN. (b) It is extremely useful for finding data in one table that is \"missing\" corresponding data in another. (c) This describes a RIGHT OUTER JOIN. (d) This describes a FULL OUTER JOIN or a CROSS JOIN depending on the condition. Positive Mark: 0.8 Negative Mark: 0"},{"id":"84948","q":"67. In the fabrication of extrinsic semiconductors, a P-type semiconductor is created by doping pure Silicon or Germanium with a: \u092c\u093e\u0939\u094d\u092f \u0905\u0930\u094d\u0927\u091a\u093e\u0932\u0915\u094b\u0902 (extrinsic semiconductors) \u0915\u0947 \u0928\u093f\u0930\u094d\u092e\u093e\u0923 \u092e\u0947\u0902 , \u0936\u0941\u0926\u094d\u0927 \u0938\u093f\u0932\u093f\u0915\u0949\u0928 \u092f\u093e \u091c\u0930\u094d\u092e\u0947\u0928\u093f\u092f\u092e \u0915\u094b \u0915\u093f\u0938\u0915\u0947 \u0938\u093e\u0925 \u0921\u094b\u092a\u093f\u0902\u0917 \u0915\u0930\u0915\u0947 P- \u092a\u094d\u0930\u0915\u093e\u0930 \u0915\u093e \u0905\u0930\u094d\u0927\u091a\u093e\u0932\u0915 \u092c\u0928\u093e\u092f\u093e \u091c\u093e\u0924\u093e \u0939\u0948 ?","options":["Pentavalent impurity (e.g., Phosphorus, Arsenic) ( \u092a\u0947\u0902\u091f\u093e\u0935\u0948\u0932\u0947\u0902\u091f \u0905\u0936\u0941\u0926\u094d\u0927\u0924\u093e ( \u091c\u0948\u0938\u0947 , \u092b\u093e\u0938\u094d\u092b\u094b\u0930\u0938 , \u0906\u0930\u094d\u0938\u0947\u0928\u093f\u0915 ))","Trivalent impurity (e.g., Boron, Indium) ( \u0924\u094d\u0930\u093f\u0938\u0902\u092f\u094b\u091c\u0915 (Trivalent) \u0905\u0936\u0941\u0926\u094d\u0927\u0924\u093e ( \u091c\u0948\u0938\u0947 , \u092c\u094b\u0930\u094b\u0928 , \u0907\u0902\u0921\u093f\u092f\u092e ))","Tetravalent impurity (e.g., Carbon) ( \u091a\u0924\u0941\u0903\u0938\u0902\u092f\u094b\u091c\u0915 (Tetravalent) \u0905\u0936\u0941\u0926\u094d\u0927\u0924\u093e ( \u091c\u0948\u0938\u0947 , \u0915\u093e\u0930\u094d\u092c\u0928 ))","Hexavalent impurity (e.g., Sulfur) ( \u0939\u0947\u0915\u094d\u0938\u093e\u0935\u0948\u0932\u0947\u0902\u091f \u0905\u0936\u0941\u0926\u094d\u0927\u0924\u093e ( \u091c\u0948\u0938\u0947 , \u0938\u0932\u094d\u092b\u0930 ))"],"answer":"2","solution":"A P-type (Positive-type) semiconductor is created by doping a pure (intrinsic) semiconductor crystal lattice like Silicon (which has 4 valence electrons) with a trivalent impurity (which has 3 valence electrons, like Boron, Gallium, or Indium). This creates an electron deficiency, or a \"hole,\" which acts as a positive charge carrier. Additional Info (a) Doping with a pentavalent impurity (5 valence electrons) provides an extra free electron, creating an N-type (Negative-type) semiconductor. (b) The \"holes\" are the majority charge carriers in P-type semiconductors. (c) Tetravalent elements (like Carbon or Silicon itself) do not create a charge imbalance when used as the bulk material. (d) Hexavalent impurities are not used for standard semiconductor doping. Positive Mark: 0.8 Negative Mark: 0"},{"id":"84949","q":"68. The ancient ruins of Vaishali in Bihar are deeply associated with the birth of which great spiritual leader? ( \u092c\u093f\u0939\u093e\u0930 \u092e\u0947\u0902 \u0935\u0948\u0936\u093e\u0932\u0940 \u0915\u0947 \u092a\u094d\u0930\u093e\u091a\u0940\u0928 \u0916\u0902\u0921\u0939\u0930 \u0915\u093f\u0938 \u092e\u0939\u093e\u0928 \u0906\u0927\u094d\u092f\u093e\u0924\u094d\u092e\u093f\u0915 \u0928\u0947\u0924\u093e \u0915\u0947 \u091c\u0928\u094d\u092e \u0938\u0947 \u0917\u0939\u0930\u093e\u0908 \u0938\u0947 \u091c\u0941\u0921\u093c\u0947 \u0939\u0948\u0902 ?)","options":["Gautama Buddha ( \u0917\u094c\u0924\u092e \u092c\u0941\u0926\u094d\u0927 )","Mahavira ( \u092e\u0939\u093e\u0935\u0940\u0930 )","Guru Nanak ( \u0917\u0941\u0930\u0941 \u0928\u093e\u0928\u0915 )","Adi Shankaracharya ( \u0906\u0926\u093f \u0936\u0902\u0915\u0930\u093e\u091a\u093e\u0930\u094d\u092f )"],"answer":"2","solution":"Lord Mahavira, the 24th and last Tirthankara of Jainism, was born in the village of Kundagrama, which was a vital part of the ancient republic of Vaishali in present-day Bihar. Additional Info (a) Gautama Buddha was born in Lumbini (in modern-day Nepal) but frequently visited and gave his last sermon at Vaishali. (b) Vaishali is highly revered in Jainism and was the capital of the powerful Licchavi republic. (c) Guru Nanak, the founder of Sikhism, was born in Talwandi (Nankana Sahib in modern-day Pakistan). (d) Adi Shankaracharya was born in Kaladi, Kerala. Positive Mark: 0.8 Negative Mark: 0"},{"id":"84950","q":"69. Which of the following is considered an 'Indirect Tax' in the Indian tax structure? ( \u092d\u093e\u0930\u0924\u0940\u092f \u0915\u0930 \u0922\u093e\u0902\u091a\u0947 \u092e\u0947\u0902 \u0928\u093f\u092e\u094d\u0928\u0932\u093f\u0916\u093f\u0924 \u092e\u0947\u0902 \u0938\u0947 \u0915\u093f\u0938\u0947 ' \u0905\u092a\u094d\u0930\u0924\u094d\u092f\u0915\u094d\u0937 \u0915\u0930 ' (Indirect Tax) \u092e\u093e\u0928\u093e \u091c\u093e\u0924\u093e \u0939\u0948 ?)","options":["Income Tax ( \u0906\u092f\u0915\u0930 )","Corporate Tax ( \u0928\u093f\u0917\u092e \u0915\u0930 )","Goods and Services Tax (GST) ( \u0935\u0938\u094d\u0924\u0941 \u090f\u0935\u0902 \u0938\u0947\u0935\u093e \u0915\u0930 (GST))","Capital Gains Tax ( \u092a\u0942\u0902\u091c\u0940\u0917\u0924 \u0932\u093e\u092d \u0915\u0930 )"],"answer":"3","solution":"An indirect tax is a tax collected by an intermediary (such as a retail store) from the person who bears the ultimate economic burden of the tax (the consumer). The Goods and Services Tax (GST) is India's premier indirect tax, levied on the consumption of goods and services. Additional Info (a) Income Tax is a direct tax levied directly on the personal income of individuals. (b) Corporate Tax is a direct tax levied directly on the profits of a corporation. (c) GST successfully subsumed multiple cascading indirect taxes like VAT, excise duty, and service tax into a single, unified system. (d) Capital Gains Tax is a direct tax on the profit made from the sale of a capital asset. Positive Mark: 0.8 Negative Mark: 0"},{"id":"84951","q":"70. The international treaty known as the 'Montreal Protocol' deals exclusively with: ' \u092e\u0949\u0928\u094d\u091f\u094d\u0930\u093f\u092f\u0932 \u092a\u094d\u0930\u094b\u091f\u094b\u0915\u0949\u0932 ' \u0915\u0947 \u0930\u0942\u092a \u092e\u0947\u0902 \u091c\u093e\u0928\u0940 \u091c\u093e\u0928\u0947 \u0935\u093e\u0932\u0940 \u0905\u0902\u0924\u0930\u094d\u0930\u093e\u0937\u094d\u091f\u094d\u0930\u0940\u092f \u0938\u0902\u0927\u093f \u0935\u093f\u0936\u0947\u0937 \u0930\u0942\u092a \u0938\u0947 \u0915\u093f\u0938\u0938\u0947 \u0938\u0902\u092c\u0902\u0927\u093f\u0924 \u0939\u0948 ?","options":["Phasing out the production of ozone-depleting substances ( \u0913\u091c\u094b\u0928 - \u0918\u091f\u0928\u0947 \u0935\u093e\u0932\u0947 \u092a\u0926\u093e\u0930\u094d\u0925\u094b\u0902 \u0915\u0947 \u0909\u0924\u094d\u092a\u093e\u0926\u0928 \u0915\u094b \u091a\u0930\u0923\u092c\u0926\u094d\u0927 \u0924\u0930\u0940\u0915\u0947 \u0938\u0947 \u0938\u092e\u093e\u092a\u094d\u0924 \u0915\u0930\u0928\u093e )","Regulating international trade in hazardous waste ( \u0916\u0924\u0930\u0928\u093e\u0915 \u0915\u091a\u0930\u0947 \u092e\u0947\u0902 \u0905\u0902\u0924\u0930\u094d\u0930\u093e\u0937\u094d\u091f\u094d\u0930\u0940\u092f \u0935\u094d\u092f\u093e\u092a\u093e\u0930 \u0915\u094b \u0935\u093f\u0928\u093f\u092f\u092e\u093f\u0924 \u0915\u0930\u0928\u093e )","Mandating reductions in industrial greenhouse gas emissions ( \u0914\u0926\u094d\u092f\u094b\u0917\u093f\u0915 \u0917\u094d\u0930\u0940\u0928\u0939\u093e\u0909\u0938 \u0917\u0948\u0938 \u0909\u0924\u094d\u0938\u0930\u094d\u091c\u0928 \u092e\u0947\u0902 \u0915\u092e\u0940 \u0915\u094b \u0905\u0928\u093f\u0935\u093e\u0930\u094d\u092f \u0915\u0930\u0928\u093e )","Protecting globally significant wetlands ( \u0935\u093f\u0936\u094d\u0935 \u0938\u094d\u0924\u0930 \u092a\u0930 \u092e\u0939\u0924\u094d\u0935\u092a\u0942\u0930\u094d\u0923 \u0906\u0930\u094d\u0926\u094d\u0930\u092d\u0942\u092e\u093f \u0915\u0940 \u0930\u0915\u094d\u0937\u093e \u0915\u0930\u0928\u093e )"],"answer":"1","solution":"Finalized in 1987, the Montreal Protocol on Substances that Deplete the Ozone Layer is a landmark multilateral environmental agreement. Its exclusive goal is to protect the Earth's stratospheric ozone layer by phasing out the production and consumption of ozone-depleting substances (ODS) like CFCs and halons. Additional Info (a) It is widely considered the most successful environmental treaty in UN history, leading to the gradual healing of the \"ozone hole.\" (b) Regulating hazardous waste movement is governed by the Basel Convention. (c) Mandating reductions in greenhouse gas emissions is the goal of the Kyoto Protocol and the Paris Agreement. (d) Conserving wetlands is the goal of the Ramsar Convention. Positive Mark: 0.8 Negative Mark: 0"},{"id":"84952","q":"71. A 'Leachate Collection System' is a mandatory and critical engineering component of a: ' \u0932\u0940\u091a\u0947\u091f \u0915\u0932\u0947\u0915\u094d\u0936\u0928 \u0938\u093f\u0938\u094d\u091f\u092e ' (Leachate Collection System) \u0915\u093f\u0938\u0915\u093e \u090f\u0915 \u0905\u0928\u093f\u0935\u093e\u0930\u094d\u092f \u0914\u0930 \u092e\u0939\u0924\u094d\u0935\u092a\u0942\u0930\u094d\u0923 \u0907\u0902\u091c\u0940\u0928\u093f\u092f\u0930\u093f\u0902\u0917 \u0918\u091f\u0915 \u0939\u0948 ?","options":["Biomedical waste incinerator ( \u092c\u093e\u092f\u094b\u092e\u0947\u0921\u093f\u0915\u0932 \u0935\u0947\u0938\u094d\u091f \u0907\u0902\u0938\u093f\u0928\u0930\u0947\u091f\u0930 )","Municipal composting facility ( \u0928\u0917\u0930\u092a\u093e\u0932\u093f\u0915\u093e \u0915\u0902\u092a\u094b\u0938\u094d\u091f\u093f\u0902\u0917 \u0938\u0941\u0935\u093f\u0927\u093e )","Engineered sanitary landfill ( \u0907\u0902\u091c\u0940\u0928\u093f\u092f\u0930\u094d\u0921 \u0938\u0947\u0928\u0947\u091f\u0930\u0940 \u0932\u0948\u0902\u0921\u092b\u093f\u0932 )","E-waste physical dismantling plant ( \u0908 - \u0915\u091a\u0930\u093e \u092d\u094c\u0924\u093f\u0915 \u0928\u093f\u0930\u093e\u0915\u0930\u0923 \u0938\u0902\u092f\u0902\u0924\u094d\u0930 )"],"answer":"3","solution":"A Leachate Collection System is a network of perforated pipes embedded in a drainage layer at the base of an engineered sanitary landfill. Its critical purpose is to collect the highly toxic liquid (leachate) that percolates through the solid waste, preventing it from seeping into and contaminating the underlying groundwater. Additional Info (a) Incinerators manage flue gases and ash, not bulk percolating liquid leachate. (b) Composting facilities generate minor runoff, but heavy collection systems are the hallmark of massive landfills. (c) The collected leachate is pumped to the surface for complex chemical and biological treatment. (d) E-waste dismantling deals with dry solids; chemical leaching happens in separate hydrometallurgy vats. Positive Mark: 0.8 Negative Mark: 0"},{"id":"84953","q":"72. The Fundamental Duties of Indian citizens were incorporated into Part IV-A of the Constitution directly on the recommendation of the: \u092d\u093e\u0930\u0924\u0940\u092f \u0928\u093e\u0917\u0930\u093f\u0915\u094b\u0902 \u0915\u0947 \u092e\u094c\u0932\u093f\u0915 \u0915\u0930\u094d\u0924\u0935\u094d\u092f\u094b\u0902 \u0915\u094b \u0938\u0902\u0935\u093f\u0927\u093e\u0928 \u0915\u0947 \u092d\u093e\u0917 IV-A \u092e\u0947\u0902 \u0938\u0940\u0927\u0947 \u0915\u093f\u0938\u0915\u0940 \u0938\u093f\u092b\u093e\u0930\u093f\u0936 \u092a\u0930 \u0936\u093e\u092e\u093f\u0932 \u0915\u093f\u092f\u093e \u0917\u092f\u093e \u0925\u093e ?","options":["Sarkaria Commission ( \u0938\u0930\u0915\u093e\u0930\u093f\u092f\u093e \u0906\u092f\u094b\u0917 )","Kothari Commission ( \u0915\u094b\u0920\u093e\u0930\u0940 \u0906\u092f\u094b\u0917 )","Swaran Singh Committee ( \u0938\u094d\u0935\u0930\u094d\u0923 \u0938\u093f\u0902\u0939 \u0938\u092e\u093f\u0924\u093f )","Mandal Commission ( \u092e\u0902\u0921\u0932 \u0906\u092f\u094b\u0917 )"],"answer":"3","solution":"The Fundamental Duties were added to the Constitution by the 42nd Amendment Act of 1976. This addition was directly based on the recommendations of the Sardar Swaran Singh Committee, which was set up during the National Emergency to study and make recommendations regarding fundamental duties and obligations. Additional Info (a) The Sarkaria Commission (1983) examined Center-State relations. (b) The Kothari Commission (1964) recommended comprehensive educational reforms. (c) Originally 10 duties were added; an 11th duty (regarding education for children) was added in 2002 by the 86th Amendment. (d) The Mandal Commission (1979) identified socially and educationally backward classes for reservations. Positive Mark: 0.8 Negative Mark: 0"},{"id":"84954","q":"73. Which river is commonly referred to as the 'Lifeline of Kerala' due to its length and economic significance? \u0905\u092a\u0928\u0940 \u0932\u0902\u092c\u093e\u0908 \u0914\u0930 \u0906\u0930\u094d\u0925\u093f\u0915 \u092e\u0939\u0924\u094d\u0935 \u0915\u0947 \u0915\u093e\u0930\u0923 \u0915\u093f\u0938 \u0928\u0926\u0940 \u0915\u094b \u0906\u092e\u0924\u094c\u0930 \u092a\u0930 ' \u0915\u0947\u0930\u0932 \u0915\u0940 \u091c\u0940\u0935\u0928 \u0930\u0947\u0916\u093e ' (Lifeline of Kerala) \u0915\u0939\u093e \u091c\u093e\u0924\u093e \u0939\u0948 ?","options":["Pamba ( \u092a\u0902\u092c\u093e )","Periyar ( \u092a\u0947\u0930\u093f\u092f\u093e\u0930 )","Bharathappuzha ( \u092d\u0930\u0924\u092a\u094d\u092a\u0941\u091d\u093e )","Chaliyar ( \u091a\u093e\u0932\u093f\u092f\u093e\u0930 )"],"answer":"2","solution":"The Periyar River is the longest river in the state of Kerala. It is famously known as the \"Lifeline of Kerala\" because it provides vital drinking water to several major municipalities, heavily supports the state's agriculture, and is the primary source of hydroelectric power generation (such as the Idukki dam). Additional Info (a) The Pamba is the third-longest river in Kerala and is highly venerated (associated with the Sabarimala temple). (b) The Periyar river flows entirely within the borders of Kerala before joining the Arabian Sea. (c) The Bharathappuzha (or Nila) is the second-longest river in Kerala. (d) The Chaliyar is a major river flowing through the northern Malabar region of Kerala. Positive Mark: 0.8 Negative Mark: 0"},{"id":"84955","q":"74. In chemistry, a buffer solution resists changes in pH when small amounts of acid or base are added. The pH of a buffer solution can be calculated using the: \u0930\u0938\u093e\u092f\u0928 \u0935\u093f\u091c\u094d\u091e\u093e\u0928 \u092e\u0947\u0902 , \u091c\u092c \u0925\u094b\u0921\u093c\u0940 \u092e\u093e\u0924\u094d\u0930\u093e \u092e\u0947\u0902 \u090f\u0938\u093f\u0921 \u092f\u093e \u092c\u0947\u0938 \u092e\u093f\u0932\u093e\u092f\u093e \u091c\u093e\u0924\u093e \u0939\u0948 \u0924\u094b \u092c\u092b\u0930 \u0938\u092e\u093e\u0927\u093e\u0928 pH \u092e\u0947\u0902 \u092a\u0930\u093f\u0935\u0930\u094d\u0924\u0928 \u0915\u093e \u0935\u093f\u0930\u094b\u0927 \u0915\u0930\u0924\u093e \u0939\u0948\u0964 \u092c\u092b\u0930 \u0938\u092e\u093e\u0927\u093e\u0928 \u0915\u0947 pH \u0915\u0940 \u0917\u0923\u0928\u093e \u0915\u093f\u0938\u0915\u093e \u0909\u092a\u092f\u094b\u0917 \u0915\u0930\u0915\u0947 \u0915\u0940 \u091c\u093e \u0938\u0915\u0924\u0940 \u0939\u0948 ?","options":["Arrhenius equation ( \u0905\u0930\u0939\u0947\u0928\u093f\u092f\u0938 \u0938\u092e\u0940\u0915\u0930\u0923 )","Henderson-Hasselbalch equation ( \u0939\u0947\u0902\u0921\u0930\u0938\u0928 - \u0939\u0938\u0932\u092c\u093e\u0932\u091a \u0938\u092e\u0940\u0915\u0930\u0923 )","Nernst equation ( \u0928\u0930\u094d\u0928\u0938\u094d\u091f \u0938\u092e\u0940\u0915\u0930\u0923 )","Clausius-Clapeyron equation ( \u0915\u094d\u0932\u0949\u0938\u093f\u092f\u0938 - \u0915\u094d\u0932\u0948\u092a\u0947\u0930\u0949\u0928 \u0938\u092e\u0940\u0915\u0930\u0923 )"],"answer":"2","solution":"The Henderson-Hasselbalch equation is utilized to estimate the pH of a buffer solution. It relates the pH to the acid dissociation constant (pKa) of the weak acid and the ratio of the concentrations of the conjugate base to the weak acid: Additional Info (a) The Arrhenius equation relates the rate constant of a chemical reaction to the temperature and activation energy. (b) This equation is essential in biochemistry for understanding blood buffering systems. (c) The Nernst equation is used in electrochemistry to calculate cell potential. (d) The Clausius-Clapeyron equation relates vapor pressure to temperature. Positive Mark: 0.8 Negative Mark: 0"},{"id":"84956","q":"75. In early 2025, the 'Pradhan Mantri Surya Ghar: Muft Bijli Yojana' was heavily executed to boost: 2025 \u0915\u0940 \u0936\u0941\u0930\u0941\u0906\u0924 \u092e\u0947\u0902 , ' \u092a\u094d\u0930\u0927\u093e\u0928 \u092e\u0902\u0924\u094d\u0930\u0940 \u0938\u0942\u0930\u094d\u092f \u0918\u0930 : \u092e\u0941\u092b\u094d\u0924 \u092c\u093f\u091c\u0932\u0940 \u092f\u094b\u091c\u0928\u093e ' \u0915\u094b \u0915\u093f\u0938\u0915\u094b \u092c\u0922\u093c\u093e\u0935\u093e \u0926\u0947\u0928\u0947 \u0915\u0947 \u0932\u093f\u090f \u092d\u093e\u0930\u0940 \u0930\u0942\u092a \u0938\u0947 \u0928\u093f\u0937\u094d\u092a\u093e\u0926\u093f\u0924 \u0915\u093f\u092f\u093e \u0917\u092f\u093e \u0925\u093e ?","options":["Wind energy farms in coastal corridors ( \u0924\u091f\u0940\u092f \u0917\u0932\u093f\u092f\u093e\u0930\u094b\u0902 \u092e\u0947\u0902 \u092a\u0935\u0928 \u090a\u0930\u094d\u091c\u093e \u092b\u093e\u0930\u094d\u092e )","Rooftop solar installations in residential households ( \u0906\u0935\u093e\u0938\u0940\u092f \u0918\u0930\u094b\u0902 \u092e\u0947\u0902 \u0930\u0942\u092b\u091f\u0949\u092a \u0938\u094c\u0930 \u092a\u094d\u0930\u0924\u093f\u0937\u094d\u0920\u093e\u0928 )","Large-scale nuclear power plant infrastructure ( \u092c\u0921\u093c\u0947 \u092a\u0948\u092e\u093e\u0928\u0947 \u092a\u0930 \u092a\u0930\u092e\u093e\u0923\u0941 \u090a\u0930\u094d\u091c\u093e \u0938\u0902\u092f\u0902\u0924\u094d\u0930 \u0915\u093e \u092c\u0941\u0928\u093f\u092f\u093e\u0926\u0940 \u0922\u093e\u0902\u091a\u093e )","Hydroelectric projects in the Himalayan foothills ( \u0939\u093f\u092e\u093e\u0932\u092f \u0915\u0940 \u0924\u0932\u0939\u091f\u0940 \u092e\u0947\u0902 \u091c\u0932\u0935\u093f\u0926\u094d\u092f\u0941\u0924 \u092a\u0930\u093f\u092f\u094b\u091c\u0928\u093e\u090f\u0902 )"],"answer":"2","solution":"Launched to drastically increase decentralized renewable energy capacity, the PM Surya Ghar: Muft Bijli Yojana specifically aims to install rooftop solar panels on 1 crore (10 million) residential households across India. It provides substantial upfront subsidies to lower electricity bills and provide \"free electricity\" up to a specific monthly limit. Additional Info (a) Wind energy projects fall under completely different MNRE schemes. (b) The scheme shifts the financial burden of adopting solar power away from middle and low-income families, promoting grass-roots green energy. (c) Nuclear power is managed centrally by NPCIL, not through individual household schemes. (d) Hydroelectric projects are massive infrastructure undertakings requiring distinct ecological clearances. Positive Mark: 0.8 Negative Mark: 0"},{"id":"84957","q":"76. In network security, a \"Man-in-the-Middle\" (MitM) attack occurs when: \u0928\u0947\u091f\u0935\u0930\u094d\u0915 \u0938\u0941\u0930\u0915\u094d\u0937\u093e \u092e\u0947\u0902 , \" \u092e\u0948\u0928 - \u0907\u0928 - \u0926 - \u092e\u093f\u0921\u093f\u0932 \" (MitM) \u0939\u092e\u0932\u093e \u0924\u092c \u0939\u094b\u0924\u093e \u0939\u0948 \u091c\u092c :","options":["A hacker floods a server with requests to crash it ( \u090f\u0915 \u0939\u0948\u0915\u0930 \u0915\u093f\u0938\u0940 \u0938\u0930\u094d\u0935\u0930 \u0915\u094b \u0915\u094d\u0930\u0948\u0936 \u0915\u0930\u0928\u0947 \u0915\u0947 \u0932\u093f\u090f \u0909\u0938 \u092a\u0930 \u0905\u0928\u0941\u0930\u094b\u0927\u094b\u0902 \u0915\u0940 \u092c\u093e\u0922\u093c \u0932\u093e \u0926\u0947\u0924\u093e \u0939\u0948 )","An attacker secretly intercepts and relays communications between two parties who believe they are directly communicating ( \u090f\u0915 \u0939\u092e\u0932\u093e\u0935\u0930 \u0917\u0941\u092a\u094d\u0924 \u0930\u0942\u092a \u0938\u0947 \u0909\u0928 \u0926\u094b \u092a\u0915\u094d\u0937\u094b\u0902 \u0915\u0947 \u092c\u0940\u091a \u0938\u0902\u091a\u093e\u0930 \u0915\u094b \u0930\u094b\u0915\u0924\u093e \u0939\u0948 \u0914\u0930 \u0930\u093f\u0932\u0947 \u0915\u0930\u0924\u093e \u0939\u0948 \u091c\u094b \u092e\u093e\u0928\u0924\u0947 \u0939\u0948\u0902 \u0915\u093f \u0935\u0947 \u0938\u0940\u0927\u0947 \u0938\u0902\u091a\u093e\u0930 \u0915\u0930 \u0930\u0939\u0947 \u0939\u0948\u0902 )","Malicious software encrypts a user's hard drive and demands payment ( \u0926\u0941\u0930\u094d\u092d\u093e\u0935\u0928\u093e\u092a\u0942\u0930\u094d\u0923 \u0938\u0949\u092b\u093c\u094d\u091f\u0935\u0947\u092f\u0930 \u0909\u092a\u092f\u094b\u0917\u0915\u0930\u094d\u0924\u093e \u0915\u0940 \u0939\u093e\u0930\u094d\u0921 \u0921\u094d\u0930\u093e\u0907\u0935 \u0915\u094b \u090f\u0928\u094d\u0915\u094d\u0930\u093f\u092a\u094d\u091f \u0915\u0930\u0924\u093e \u0939\u0948 \u0914\u0930 \u092d\u0941\u0917\u0924\u093e\u0928 \u0915\u0940 \u092e\u093e\u0902\u0917 \u0915\u0930\u0924\u093e \u0939\u0948 )","An employee intentionally leaks company data from within the organization ( \u090f\u0915 \u0915\u0930\u094d\u092e\u091a\u093e\u0930\u0940 \u091c\u093e\u0928\u092c\u0942\u091d\u0915\u0930 \u0938\u0902\u0917\u0920\u0928 \u0915\u0947 \u092d\u0940\u0924\u0930 \u0938\u0947 \u0915\u0902\u092a\u0928\u0940 \u0915\u093e \u0921\u0947\u091f\u093e \u0932\u0940\u0915 \u0915\u0930\u0924\u093e \u0939\u0948 )"],"answer":"2","solution":"A Man-in-the-Middle (MitM) attack is a form of active eavesdropping where the attacker secretly intercepts, relays, and potentially alters the communication between two parties who believe they are directly communicating with each other over a secure connection. Additional Info (a) Flooding a server to crash it describes a Denial of Service (DoS) or Distributed Denial of Service (DDoS) attack. (b) MitM attacks frequently occur on unsecured or poorly secured public Wi-Fi networks. (c) Encrypting files and demanding a ransom describes Ransomware. (d) Intentionally leaking data from within is categorized as an Insider Threat. Positive Mark: 0.8 Negative Mark: 0"},{"id":"84958","q":"77. The historic \"Quit India Movement\" was launched by Mahatma Gandhi in the year: \u0910\u0924\u093f\u0939\u093e\u0938\u093f\u0915 \" \u092d\u093e\u0930\u0924 \u091b\u094b\u0921\u093c\u094b \u0906\u0902\u0926\u094b\u0932\u0928 \" \u092e\u0939\u093e\u0924\u094d\u092e\u093e \u0917\u093e\u0902\u0927\u0940 \u0926\u094d\u0935\u093e\u0930\u093e \u0915\u093f\u0938 \u0935\u0930\u094d\u0937 \u0936\u0941\u0930\u0942 \u0915\u093f\u092f\u093e \u0917\u092f\u093e \u0925\u093e ?","options":["1930","1940","1942","1945"],"answer":"3","solution":"The Quit India Movement (also known as the August Kranti) was officially launched at the Bombay session of the All India Congress Committee by Mahatma Gandhi on August 8, 1942, demanding an immediate and complete end to British rule in India. Additional Info (a) 1930 marks the launch of the Civil Disobedience Movement and the historic Dandi March. (b) 1940 marks the beginning of the Individual Satyagraha. (c) During this movement, Gandhi delivered his famous \"Do or Die\" speech at the Gowalia Tank Maidan. (d) 1945 marked the end of World War II and the beginning of the final political negotiations for the transfer of power. Positive Mark: 0.8 Negative Mark: 0"},{"id":"84959","q":"78. The 'Buxar' district of Bihar shares its geographical boundary with which neighboring entity? \u092c\u093f\u0939\u093e\u0930 \u0915\u093e ' \u092c\u0915\u094d\u0938\u0930 ' \u091c\u093f\u0932\u093e \u0905\u092a\u0928\u0940 \u092d\u094c\u0917\u094b\u0932\u093f\u0915 \u0938\u0940\u092e\u093e \u0915\u093f\u0938 \u092a\u0921\u093c\u094b\u0938\u0940 \u0907\u0915\u093e\u0908 \u0915\u0947 \u0938\u093e\u0925 \u0938\u093e\u091d\u093e \u0915\u0930\u0924\u093e \u0939\u0948 ?","options":["Jharkhand ( \u091d\u093e\u0930\u0916\u0902\u0921 )","West Bengal ( \u092a\u0936\u094d\u091a\u093f\u092e \u092c\u0902\u0917\u093e\u0932 )","Uttar Pradesh ( \u0909\u0924\u094d\u0924\u0930 \u092a\u094d\u0930\u0926\u0947\u0936 )","Nepal (International border) ( \u0928\u0947\u092a\u093e\u0932 ( \u0905\u0902\u0924\u0930\u094d\u0930\u093e\u0937\u094d\u091f\u094d\u0930\u0940\u092f \u0938\u0940\u092e\u093e ))"],"answer":"3","solution":"Buxar is a prominent western district of Bihar that shares its state boundary directly with the Ghazipur and Ballia districts of Uttar Pradesh. The river Ganga forms a natural geographical boundary between the two states in this specific region. Additional Info (a) Jharkhand borders the southern districts of Bihar (like Rohtas and Gaya). (b) West Bengal borders the eastern districts of Bihar (like Kishanganj). (c) Buxar is historically highly significant for the decisive Battle of Buxar fought in 1764. (d) Nepal borders the northern districts of Bihar (like West Champaran and Sitamarhi). Positive Mark: 0.8 Negative Mark: 0"},{"id":"84960","q":"79. The escape velocity ( ) required for a projectile to permanently break free from a planet's gravitational field is given by the formula (where G is the gravitational constant, M is the mass of the planet, and R is its radius): \u0915\u093f\u0938\u0940 \u092a\u094d\u0930\u0915\u094d\u0937\u0947\u092a\u094d\u092f (projectile) \u0915\u094b \u0917\u094d\u0930\u0939 \u0915\u0947 \u0917\u0941\u0930\u0941\u0924\u094d\u0935\u093e\u0915\u0930\u094d\u0937\u0923 \u0915\u094d\u0937\u0947\u0924\u094d\u0930 \u0938\u0947 \u0938\u094d\u0925\u093e\u092f\u0940 \u0930\u0942\u092a \u0938\u0947 \u092e\u0941\u0915\u094d\u0924 \u0939\u094b\u0928\u0947 \u0915\u0947 \u0932\u093f\u090f \u0906\u0935\u0936\u094d\u092f\u0915 \u092a\u0932\u093e\u092f\u0928 \u0935\u0947\u0917 (ve) \u0915\u093f\u0938 \u0938\u0942\u0924\u094d\u0930 \u0926\u094d\u0935\u093e\u0930\u093e \u0926\u093f\u092f\u093e \u091c\u093e\u0924\u093e \u0939\u0948 ( \u091c\u0939\u093e\u0902 G \u0917\u0941\u0930\u0941\u0924\u094d\u0935\u093e\u0915\u0930\u094d\u0937\u0923 \u0938\u094d\u0925\u093f\u0930\u093e\u0902\u0915 \u0939\u0948 , M \u0917\u094d\u0930\u0939 \u0915\u093e \u0926\u094d\u0930\u0935\u094d\u092f\u092e\u093e\u0928 \u0939\u0948 , \u0914\u0930 R \u0907\u0938\u0915\u0940 \u0924\u094d\u0930\u093f\u091c\u094d\u092f\u093e \u0939\u0948 ):","options":["","","",""],"answer":"2","solution":"Escape velocity is the absolute minimum speed needed for a free, non-propelled object to escape from the gravitational influence of a massive body. It is derived by equating the object's kinetic energy to its gravitational potential energy, resulting in the formula Additional Info (a) represents the orbital velocity of an object moving in a circular orbit near the planet's surface. (b) For planet Earth, this escape velocity is approximately 11.2 km/s. (c) represents the acceleration due to gravity (g) at the surface of the pl
