<!DOCTYPE html>
<html lang="hi">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>ASWMO — T33 Full Test-Tech</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
:root{--bg:#0b0c15;--surface:#12142a;--text:#e4e6f0;--accent:#00e8a0;--gold:#f0c040;--danger:#ff4d6d;--border:rgba(255,255,255,.08);--muted:#8a8fa8;}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:Inter,system-ui,sans-serif;background:radial-gradient(1000px 700px at 20% 0%,#00e8a011,transparent),var(--bg);color:var(--text);min-height:100vh;line-height:1.55;}
.container{max-width:900px;margin:2rem auto;padding:0 1.2rem;}
h1{font-size:1.6rem;font-weight:700;background:linear-gradient(135deg,#fff,var(--accent));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.card{background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:16px;padding:1.5rem;margin-bottom:1rem;}
.question{font-size:1.05rem;font-weight:500;margin-bottom:.8rem;line-height:1.35;}
.options{display:grid;gap:.5rem;}
.option{padding:.7rem 1rem;background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:10px;cursor:pointer;font-size:.92rem;transition:.2s;}
.option:hover,.option.selected{border-color:var(--accent);background:rgba(0,232,160,.12);font-weight:600;}
.timer{font-family:monospace;font-weight:700;font-size:2rem;color:var(--accent);}
button{background:linear-gradient(135deg,var(--accent),#00b87e);color:#0a0c12;border:none;padding:.7rem 1.4rem;border-radius:10px;font-weight:700;cursor:pointer;}
.hidden{display:none!important}</style>
</head>
<body>
<div class="container">
<header><h1 id="ptitle">ASWMO — T33 Full Test-Tech</h1></header>

<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;">
<div><div class="timer" id="timer">65:00</div><div style="font-size:.75rem;color:var(--muted);">Time Remaining</div></div>
<button onclick="submitTest()">Submit Test</button></div>
<div style="height:6px;background:rgba(255,255,255,.1);border-radius:3px;overflow:hidden;margin-top:.5rem;"><div id="bar" style="height:100%;width:100%;background:linear-gradient(90deg,var(--accent),#00b87e);transition:width 1s linear;"></div></div></div>

<div class="card" id="qCard">
<div style="font-size:.8rem;color:var(--muted);margin-bottom:.4rem;">Question <span id="qNum">1</span> / <span id="qTotal">?</span></div>
<div class="question" id="qText">Loading...</div>
<div class="options" id="opts"></div>
<div style="margin-top:1rem;display:flex;gap:.5rem;flex-wrap:wrap;">
<button onclick="prev()">&#8592; Prev</button><button onclick="next()">Next &#8594;</button><button onclick="submitTest()">Submit</button></div>
</div>

<div class="card hidden" id="resCard" style="text-align:center;padding:2rem;">
<h2 style="color:var(--gold);font-size:2rem;">Test Completed!</h2>
<div id="score" style="font-size:3rem;font-weight:800;color:var(--accent);margin:1rem 0;"></div>
<div id="detail" style="color:var(--muted);font-size:.95rem;"></div>
<div style="margin-top:1.5rem;"><a href="index.html" style="color:var(--accent);font-weight:600;">&#8592; Back</a></div>
</div>
</div>

<script>
const DATA=[{"id":"80222","q":"Sample A (100 kg) has a moisture content of 20%, and Sample B (100 kg) has a moisture content of 60%. If mixed, what is the resultant moisture content of the mixture?","options":["30%","40%","50%","35%"],"answer":"2"},{"id":"80223","q":"In the context of EPR (Extended Producer Responsibility), a \"PRO\" stands for:","options":["Public Relations Officer","Producer Responsibility Organization","Pollution Regulation Office","Product Recycling Order"],"answer":"2"},{"id":"80224","q":"Which zone in a sedimentation tank is designed to prevent the resuspension of settled particles?","options":["Inlet Zone","Outlet Zone","Sludge Zone","Settling Zone"],"answer":"3"},{"id":"80225","q":"If the noise level from one machine is 60 dB and from a second identical machine is also 60 dB, what is the combined noise level? (Logarithmic addition)","options":["120 dB","60 dB","63 dB","90 dB"],"answer":"3"},{"id":"80226","q":"Hazardous Waste Rules, 2016, categorizes wastes into how many schedules?","options":["4","6","8","3"],"answer":"3"},{"id":"80227","q":"Which gas is released by the anaerobic decomposition of organic matter in a Septic Tank?","options":["Oxygen","Hydrogen Sulfide ( ) and Methane","Chlorine gas","Nitrogen dioxide"],"answer":"2"},{"id":"80228","q":"A waste sample has an energy content of 4000 kJ/kg. What is this value in kcal/kg? (Use 1 kcal = 4.184 kJ)","options":["850 kcal/kg","956 kcal/kg","1000 kcal/kg","16000 kcal/kg"],"answer":"2"},{"id":"80229","q":"Biomedical Waste rules apply to:","options":["Hospitals & Nursing Homes","Veterinary Institutions","Blood Banks & Path Labs","All of the above"],"answer":"4"},{"id":"80230","q":"What is the main purpose of \"Equalization Tank\" in an ETP?","options":["To remove oil and grease.","To dampen flow and concentration fluctuations.","To settle sludge.","To aerate the waste."],"answer":"2"},{"id":"80231","q":"If a city has a population of 1 lakh and the per capita water supply is 135 LPCD. Assuming 80% becomes sewage, calculate the total sewage generation in MLD.","options":["13.5 MLD","10.8 MLD","108 MLD","8.0 MLD"],"answer":"2"},{"id":"80232","q":"Which method is best suited for the disposal of Petrochemical Industry oily sludge?","options":["Composting","Incineration / Co-processing in Cement Kiln","Open Dumping","River Discharge"],"answer":"2"},{"id":"80233","q":"The Stockholm Convention targets:","options":["Transboundary Hazardous Waste","Persistent Organic Pollutants (POPs)","Wetland Conservation","Mercury Pollution"],"answer":"2"},{"id":"80234","q":"Calculate the Volume of a circular sedimentation tank with Diameter = 20m and Depth = 3m.","options":["[Image-based option 1 — see original]","[Image-based option 2 — see original]","[Image-based option 3 — see original]","[Image-based option 4 — see original]"],"answer":"3"},{"id":"80235","q":"HDPE (High-Density Polyethylene) geomembranes are widely used in landfills as:","options":["Daily cover","Bottom Liners","Gas vents","Leachate pipes"],"answer":"2"},{"id":"80236","q":"Which of the following is a Secondary Air Pollutant?","options":["[Image-based option 1 — see original]","[Image-based option 2 — see original]","Ozone ( )","CO"],"answer":"3"},{"id":"80237","q":"The National Air Quality Index (AQI) has how many categories?","options":["4","5","6","8"],"answer":"3"},{"id":"80238","q":"If the Carbon content is 40% and Nitrogen content is 1% in a waste sample, what is the C/N ratio?","options":["20","30","40","10"],"answer":"3"},{"id":"80239","q":"Bhopal Gas Tragedy was caused by the leakage of:","options":["Ethyl Isocyanate","Methyl Isocyanate (MIC)","Potassium Cyanide","Sodium Isocyanate"],"answer":"2"},{"id":"80240","q":"Under Construction & Demolition Waste Rules 2016, who is responsible for segregation of waste?","options":["The Municipality","The Waste Generator","The Recycler","The State Govt"],"answer":"2"},{"id":"80241","q":"Calculate the hydraulic loading rate ( day) of a trickling filter if Flow = 1000~ /day and Surface Area = 200~ .","options":["2","5","10","50"],"answer":"2"},{"id":"80242","q":"Eutrophication in water bodies is primarily caused by:","options":["Excess Carbon","Excess Nitrogen and Phosphorus","Heavy Metals","Oil Spills"],"answer":"2"},{"id":"80243","q":"Which type of fire extinguisher is suitable for Class B (Flammable Liquids) fires?","options":["Water","Foam /","Dry Sand only","Wet Chemical"],"answer":"2"},{"id":"80244","q":"If the concentration of a pollutant is 10 ppm in water, what is it in mg/L? (Assume density of water 1 kg/L)","options":["1 mg/L","10 mg/L","100 mg/L","0.1 mg/L"],"answer":"2"},{"id":"80245","q":"Pyrolysis of tires produces:","options":["Compost","Char, Oil, and Gas","Glass","Ash only"],"answer":"2"},{"id":"80246","q":"The Minamata Convention is related to:","options":["Lead","Mercury","Cadmium","Arsenic"],"answer":"2"},{"id":"80247","q":"Septage refers to:","options":["Solid waste from hospitals.","Liquid and solid material pumped from a septic tank.","Treated effluent from STP.","Stormwater runoff."],"answer":"2"},{"id":"80248","q":"Blue Baby Syndrome (Methemoglobinemia) is caused by excess of what in drinking water?","options":["Sulphates","Nitrates","Chlorides","Fluorides"],"answer":"2"},{"id":"80249","q":"A sample of waste weighs 100 g. After drying in an oven at , it weighs 60 g. What is the Moisture Content (Wet Basis)?","options":["40%","60%","66%","20%"],"answer":"1"},{"id":"80250","q":"Biopiles are used for the remediation of:","options":["Nuclear Waste","Petroleum Contaminated Soils","Medical Waste","E-Waste"],"answer":"2"},{"id":"80251","q":"Which act created the Central Pollution Control Board (CPCB)?","options":["Air Act, 1981","Water (Prevention and Control of Pollution) Act, 1974","Environment Protection Act, 1986","National Green Tribunal Act, 2010"],"answer":"2"},{"id":"80252","q":"Coagulation is the process of:","options":["Settling of large particles.","Destabilization of colloidal particles by adding chemicals (like Alum).","Filtering water through sand.","Disinfecting water."],"answer":"2"},{"id":"80253","q":"The Self-Purification capacity of a stream depends on:","options":["Dilution and Oxygen Sag Curve.","Turbidity.","Hardness of water.","Conductivity."],"answer":"1"},{"id":"80254","q":"If 50 kg of plastic waste is generated per household per year, and a city has 10,000 households, what is the annual plastic waste generation in tonnes?","options":["50 tonnes","500 tonnes","5000 tonnes","5 tonnes"],"answer":"2"},{"id":"80255","q":"Reverse Logistics is a key component of:","options":["Landfilling","Extended Producer Responsibility (EPR)","Incineration","Composting"],"answer":"2"},{"id":"80256","q":"Which soil type is best suited for a Landfill Liner due to low permeability?","options":["Sand","Gravel","Clay","Loam"],"answer":"3"},{"id":"80257","q":"Baling of waste is done to:","options":["Increase moisture.","Reduce volume for transport/disposal (Densification).","Increase segregation.","Burn waste."],"answer":"2"},{"id":"80258","q":"ISO 45001 deals with:","options":["Quality Management","Environment Management","Occupational Health and Safety","Energy Management"],"answer":"3"},{"id":"80259","q":"Aerosols are:","options":["Solid particles suspended in water.","Solid or liquid particles suspended in gas/air.","Gases dissolved in water.","Liquids dissolved in liquids."],"answer":"2"},{"id":"80260","q":"The Global Warming Potential (GWP) of Methane over 100 years is approximately how many times that of ?","options":["1","10","25-28","100"],"answer":"3"},{"id":"80261","q":"Fecal Sludge Management (FSM) is critical for cities that rely on:","options":["Underground Sewerage Systems","On-site Sanitation Systems (Septic tanks/Pit latrines)","Open Defecation","Stormwater drains"],"answer":"2"},{"id":"80262","q":"Which is the First \"Water Plus\" city of India?","options":["Indore","Surat","Pune","Chandigarh"],"answer":"1"},{"id":"80263","q":"Electronic Waste (E-Waste) contains valuable metals like:","options":["Gold, Silver, Copper, Palladium","Uranium, Thorium","Calcium, Magnesium","Potassium, Sodium"],"answer":"1"},{"id":"80264","q":"Bio-mining of legacy waste refers to:","options":["Mining for coal under waste.","Excavation and treatment of old dumpsites to recover land and fines.","Using bacteria to mine metals.","Creating new landfills."],"answer":"2"},{"id":"80265","q":"Grit in wastewater consists of:","options":["Inorganic solids like sand, gravel, cinders.","Organic solids like food waste.","Dissolved salts.","Floating oil."],"answer":"1"},{"id":"80266","q":"Which type of pump is commonly used for pumping sewage?","options":["Centrifugal Pump (Non-clogging)","Reciprocating Pump","Gear Pump","Peristaltic Pump"],"answer":"1"},{"id":"80267","q":"Crown Corrosion in concrete sewers is caused by:","options":["Sulfuric Acid ( ) formation from","Hydrochloric Acid","High velocity of flow","Heavy load of traffic"],"answer":"1"},{"id":"80268","q":"Public Hearing is a mandatory step in EIA for which category of projects?","options":["Category A and B1","Category B2","Only Building Construction","All projects"],"answer":"1"},{"id":"80269","q":"What is the standard noise limit (Leq) for Residential Areas during the day?","options":["75 dB","65 dB","55 dB","50 dB"],"answer":"3"},{"id":"80270","q":"Ramsar Convention is related to the conservation of:","options":["Forests","Wetlands","Deserts","Coral Reefs"],"answer":"2"},{"id":"80271","q":"Which of the following is NOT a characteristic of Hazardous Waste?","options":["Ignitability","Corrosivity","Reactivity","Solubility (in water)"],"answer":"4"},{"id":"80272","q":"Namami Gange Programme functions under which Ministry?","options":["Ministry of Jal Shakti","Ministry of Agriculture","Ministry of Power","Ministry of Tourism"],"answer":"1"},{"id":"80273","q":"Manning’s Formula is used to calculate:","options":["Air pollution dispersion","Velocity of flow in open channels/sewers","Compaction of soil","Bacterial growth rate"],"answer":"2"},{"id":"80274","q":"Carbon Monoxide (CO) is dangerous because:","options":["It is carcinogenic.","It has a high affinity for Hemoglobin (forming Carboxyhemoglobin).","It causes skin irritation.","It depletes the Ozone layer."],"answer":"2"},{"id":"80275","q":"World Environment Day is celebrated on:","options":["22nd April","5th June","16th September","2nd October"],"answer":"2"},{"id":"80276","q":"Agenda 21 is a product of:","options":["Earth Summit (Rio 1992)","Kyoto Protocol 1997","Paris Agreement 2015","Stockholm 1972"],"answer":"1"},{"id":"80277","q":"Vermiwash is:","options":["Water used to wash worms.","Liquid fertilizer collected after passage through a worm column.","Pesticide.","Detergent."],"answer":"2"},{"id":"80278","q":"BOD/COD ratio > 0.6 indicates:","options":["Waste is biologically treatable (Biodegradable).","Waste is toxic.","Waste is non-biodegradable.","Waste needs chemical treatment."],"answer":"1"},{"id":"80279","q":"Swachh Bharat Kosh was set up to:","options":["Facilitate channelization of philanthropic contributions/CSR funds for Swachh Bharat.","Collect fines.","Pay salaries.","Buy land."],"answer":"1"},{"id":"80280","q":"Which Indian state has the highest number of Ramsar Sites (as of 2024)?","options":["Uttar Pradesh","Tamil Nadu","West Bengal","Punjab"],"answer":"2"},{"id":"80281","q":"Deep Injection Wells are a method for:","options":["Groundwater recharge.","Disposal of hazardous liquid waste.","Extracting oil.","Monitoring water quality."],"answer":"2"},{"id":"80282","q":"Alum is chemically known as:","options":["Ferrous Sulphate","Hydrated Aluminum Sulphate","Calcium Carbonate","Sodium Aluminate"],"answer":"2"},{"id":"80283","q":"NITI Aayog replaced which body?","options":["Planning Commission","Finance Commission","National Development Council","CPCB"],"answer":"1"},{"id":"80284","q":"The Green Bench has been constituted in the Supreme Court to deal with:","options":["Financial corruption","Environmental cases","Cyber crime","Election disputes"],"answer":"2"},{"id":"80285","q":"Montreal Protocol aims to protect:","options":["The Ozone Layer","Marine Biodiversity","Tropical Forests","Antarctica"],"answer":"1"},{"id":"80286","q":"Compost is rich in:","options":["Heavy Metals","Pathogens","Humus and Nutrients (NPK)","Plastic"],"answer":"3"}];
let idx=0, answers={}, timerSec=3900, timerInt=null;

function render(){
  const q=DATA[idx];
  if(!q){document.getElementById('qText').textContent='No data.';return;}
  document.getElementById('qNum').textContent=idx+1;
  document.getElementById('qTotal').textContent=DATA.length;
  document.getElementById('qText').textContent=q.q;
  document.getElementById('opts').innerHTML=q.options.map((o,i)=>
    `<div class="option ${answers[idx]==(i+1)?'selected':''}" onclick="select(${i+1})">${String.fromCharCode(65+i)}. ${o}</div>`
  ).join('');
}
window.select=o=>{answers[idx]=o; render();};
window.prev=()=>{if(idx>0){idx--; render();}};
window.next=()=>{if(idx<DATA.length-1){idx++; render();}};

function submitTest(){
  clearInterval(timerInt);
  let c=0; for(let i=0;i<DATA.length;i++){if(answers[i]==DATA[i].answer)c++;}
  const pct=Math.round(c/DATA.length*100)||0;
  document.getElementById('qCard').classList.add('hidden');
  document.getElementById('resCard').classList.remove('hidden');
  document.getElementById('score').textContent=pct+'%';
  document.getElementById('detail').innerHTML='<b>'+c+'/'+DATA.length+'</b> correct';
}

function tick(){timerSec--; document.getElementById('timer').textContent=Math.floor(timerSec/60)+':'+String(timerSec%60).padStart(2,'0'); document.getElementById('bar').style.width=(timerSec/3900*100)+'%'; if(timerSec<=0){clearInterval(timerInt); submitTest();}}

render(); timerInt=setInterval(tick,1000);
</script>
</body></html>
