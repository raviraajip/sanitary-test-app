<!DOCTYPE html>
<html lang="hi">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>ASWMO — T30 Non-Tech</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
:root{--bg:#0b0c15;--surface:#12142a;--text:#e4e6f0;--accent:#00e8a0;--gold:#f0c040;--danger:#ff4d6d;--border:rgba(255,255,255,.08);--muted:#8a8fa8;}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:Inter,system-ui,sans-serif;background:radial-gradient(1000px 700px at 20% 0%,#00e8a011,transparent),var(--bg);color:var(--text);min-height:100vh;line-height:1.55;}
.container{max-width:900px;margin:2rem auto;padding:0 1.2rem;}
h1{font-size:1.6rem;font-weight:700;background:linear-gradient(135deg,#fff,var(--accent));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.card{background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:16px;padding:1.5rem;margin-bottom:1rem;}
.question{font-size:1.05rem;font-weight:500;margin-bottom:.8rem;line-height:1.35;}
.options{display:grid;gap:.5rem;}
.option{padding:.7rem 1rem;background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:10px;cursor:pointer;font-size:.92rem;transition:.2s;}
.option:hover,.option.selected{border-color:var(--accent);background:rgba(0,232,160,.12);font-weight:600;}
.timer{font-family:monospace;font-weight:700;font-size:2rem;color:var(--accent);}
button{background:linear-gradient(135deg,var(--accent),#00b87e);color:#0a0c12;border:none;padding:.7rem 1.4rem;border-radius:10px;font-weight:700;cursor:pointer;}
.hidden{display:none!important}</style>
</head>
<body>
<div class="container">
<header><h1 id="ptitle">ASWMO — T30 Non-Tech</h1></header>

<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;">
<div><div class="timer" id="timer">65:00</div><div style="font-size:.75rem;color:var(--muted);">Time Remaining</div></div>
<button onclick="submitTest()">Submit Test</button></div>
<div style="height:6px;background:rgba(255,255,255,.1);border-radius:3px;overflow:hidden;margin-top:.5rem;"><div id="bar" style="height:100%;width:100%;background:linear-gradient(90deg,var(--accent),#00b87e);transition:width 1s linear;"></div></div></div>

<div class="card" id="qCard">
<div style="font-size:.8rem;color:var(--muted);margin-bottom:.4rem;">Question <span id="qNum">1</span> / <span id="qTotal">?</span></div>
<div class="question" id="qText">Loading...</div>
<div class="options" id="opts"></div>
<div style="margin-top:1rem;display:flex;gap:.5rem;flex-wrap:wrap;">
<button onclick="prev()">&#8592; Prev</button><button onclick="next()">Next &#8594;</button><button onclick="submitTest()">Submit</button></div>
</div>

<div class="card hidden" id="resCard" style="text-align:center;padding:2rem;">
<h2 style="color:var(--gold);font-size:2rem;">Test Completed!</h2>
<div id="score" style="font-size:3rem;font-weight:800;color:var(--accent);margin:1rem 0;"></div>
<div id="detail" style="color:var(--muted);font-size:.95rem;"></div>
<div style="margin-top:1.5rem;"><a href="index.html" style="color:var(--accent);font-weight:600;">&#8592; Back</a></div>
</div>
</div>

<script>
const DATA=[{"id":"78512","q":"In the context of Bihar's administration, which official is known as the \"Legal Advisor\" to the State Government?","options":["Chief Justice of Patna High Court","Advocate General","Solicitor General","Law Secretary"],"answer":"2"},{"id":"78513","q":"Which of the following atmospheric layers contains the 'Ozone Layer' that protects Earth from UV radiation?","options":["Troposphere","Stratosphere","Mesosphere","Exosphere"],"answer":"2"},{"id":"78514","q":"What is the keyboard shortcut to \"Permanently Delete\" a file without sending it to the Recycle Bin in Windows?","options":["Ctrl + Delete","Shift + Delete","Alt + Delete","Ctrl + Shift + D"],"answer":"2"},{"id":"78515","q":"The \"Quit India Movement\" (1942) was launched after the failure of which mission?","options":["Cabinet Mission","Cripps Mission","Simon Commission","Hunter Commission"],"answer":"2"},{"id":"78516","q":"Which of the following mirrors is commonly used by dentists to see a magnified image of teeth?","options":["Convex Mirror","Concave Mirror","Plane Mirror","Parabolic Mirror"],"answer":"2"},{"id":"78517","q":"Under the \"Saat Nishchay Part-2\" scheme of Bihar, what is the specific target for the \"Sashakt Mahila, Saksham Mahila\" component?","options":["Free bicycles for all girls","Financial assistance for higher education and entrepreneurship","50% reservation in all private jobs","Providing free smartphones to women"],"answer":"2"},{"id":"78518","q":"Which part of the human brain is responsible for maintaining body balance and posture?","options":["Cerebrum","Cerebellum","Medulla Oblongata","Thalamus"],"answer":"2"},{"id":"78519","q":"The \"Suez Canal\" connects which two major water bodies?","options":["Mediterranean Sea and Red Sea","Black Sea and Caspian Sea","Red Sea and Arabian Sea","Mediterranean Sea and Atlantic Ocean"],"answer":"1"},{"id":"78520","q":"Which chemical is added to LPG cylinders to give it a distinct smell for leak detection?","options":["Methane","Ethyl Mercaptan","Chloroform","Benzene"],"answer":"2"},{"id":"78521","q":"Who was the first Chief Minister of Bihar after the state was separated from Bengal in 1912?","options":["Shri Krishna Singh","Anugrah Narayan Sinha","Muhammad Yunus","Deep Narayan Singh"],"answer":"3"},{"id":"78522","q":"In MS-PowerPoint, which key is used to start a slideshow from the current slide?","options":["F5","Shift + F5","Ctrl + F5","Alt + F5"],"answer":"2"},{"id":"78523","q":"The \"Permanent Settlement\" of 1793 was introduced by Lord Cornwallis primarily to:","options":["Empower the peasantry","Fix the land revenue for the British government","Abolish the Zamindari system","Promote organic farming"],"answer":"2"},{"id":"78524","q":"Which of the following is a \"Secondary Pollutant\" formed in the atmosphere?","options":["Carbon Monoxide","Sulfur Dioxide","Ozone (O3)","Nitrogen Dioxide"],"answer":"3"},{"id":"78525","q":"The \"Panchayati Raj\" system in India is based on the recommendations of which committee?","options":["Ashok Mehta Committee","Balwant Rai Mehta Committee","Swaran Singh Committee","Verma Committee"],"answer":"2"},{"id":"78526","q":"What does the term \"Bandwidth\" refer to in a computer network?","options":["The physical length of the cable","The speed of the CPU","The amount of data that can be transmitted in a given time","The number of computers connected to a router"],"answer":"3"},{"id":"78527","q":"\"Bhimbandh Wildlife Sanctuary\" is located in which district of Bihar?","options":["Munger","Gaya","West Champaran","Rohtas"],"answer":"1"},{"id":"78528","q":"Which of the following is an example of an \"Inert Gas\" (Group 18)?","options":["Nitrogen","Oxygen","Argon","Hydrogen"],"answer":"3"},{"id":"78529","q":"The \"Golden Revolution\" in India is most closely associated with:","options":["Jute Production","Horticulture and Honey","Oilseeds Production","Wheat Production"],"answer":"2"},{"id":"78530","q":"Which Fundamental Right was struck down as a \"Right to Property\" and made a legal right?","options":["Article 19","Article 21","Article 31","Article 32"],"answer":"3"},{"id":"78531","q":"In computer networking, \"HTTP\" stands for:","options":["Hyperlink Text Transfer Protocol","Hypertext Transfer Protocol","High Transfer Text Process","Hyper Transfer Text Protocol"],"answer":"2"},{"id":"78532","q":"The \"Dihang-Dibang\" Biosphere Reserve is located in which Indian state?","options":["Assam","Arunachal Pradesh","Sikkim","Nagaland"],"answer":"2"},{"id":"78533","q":"Which enzyme is found in human saliva and helps in the digestion of starch?","options":["Pepsin","Trypsin","Salivary Amylase","Lipase"],"answer":"3"},{"id":"78534","q":"The \"Battle of Buxar\" (1764) was fought between the British and which of the following?","options":["Mir Jafar","Shuja-ud-Daula, Shah Alam II, and Mir Qasim","Siraj-ud-Daula","Tipu Sultan"],"answer":"2"},{"id":"78535","q":"In the modern periodic table, the \"Atomic Number\" of an element represents the number of:","options":["Neutrons","Protons","Protons and Neutrons","Electrons in the outermost shell"],"answer":"2"},{"id":"78536","q":"Which district of Bihar has the lowest literacy rate according to the 2011 Census?","options":["Purnia","Sheohar","Katihar","Araria"],"answer":"1"},{"id":"78537","q":"What is the decimal value of the binary number 1010?","options":["8","10","12","14"],"answer":"2"},{"id":"78538","q":"The \"Vibrant Villages Programme\" is aimed at the development of villages in:","options":["Coastal areas","Border areas of North India","Naxal-affected areas","Desert regions"],"answer":"2"},{"id":"78539","q":"\"Plaster of Paris\" is chemically produced from which mineral?","options":["Bauxite","Gypsum (","Limestone","Magnetite"],"answer":"2"},{"id":"78540","q":"The \"Finance Commission\" is constituted by the President under which Article?","options":["Article 243","Article 280","Article 324","Article 360"],"answer":"2"},{"id":"78541","q":"Which river in Bihar is known as the \"Mechi\" and forms a boundary with Nepal?","options":["Mahananda","Kosi","Kamla","Bagmati"],"answer":"1"},{"id":"78542","q":"A \"Firewall\" in a computer system is primarily used for:","options":["Monitoring the temperature of the CPU","Protecting the system from unauthorized access (Security)","Increasing the speed of the internet","Cleaning the hard disk"],"answer":"2"},{"id":"78543","q":"During \"Dehydration\", which substance is primarily lost from the human body?","options":["Sugar","Calcium Phosphate","Sodium Chloride (Salt)","Potassium Chloride"],"answer":"3"},{"id":"78544","q":"\"Ghadar Party\" was founded in 1913 in which foreign city?","options":["London","Berlin","San Francisco","Tokyo"],"answer":"3"},{"id":"78545","q":"Which of the following is NOT a part of the \"Union List\" in the 7th Schedule?","options":["Defense","Banking","Public Health and Sanitation","Railways"],"answer":"3"},{"id":"78546","q":"\"Dry Ice\" is the solid form of which gas?","options":["Nitrogen","Carbon Dioxide","Hydrogen","Methane"],"answer":"2"},{"id":"78547","q":"The \"Champaran Satyagraha\" of 1917 was primarily against the:","options":["Tinkathia system (Indigo)","Salt Tax","High Land Revenue","Forest Laws"],"answer":"1"},{"id":"78548","q":"Which software is used to \"Compile\" high-level programming language into machine code?","options":["Interpreter","Compiler","Assembler","Linker"],"answer":"2"},{"id":"78549","q":"What is the approximate length of the \"Coastline\" of mainland India?","options":["6100 km","7516 km","5200 km","8000 km"],"answer":"1"},{"id":"78550","q":"Which hormone is known as the \"Fight or Flight\" hormone?","options":["Insulin","Adrenaline (Epinephrine)","Thyroxine","Oxytocin"],"answer":"2"},{"id":"78551","q":"\"Article 32\" of the Indian Constitution is known as:","options":["Right to Equality","Right against Exploitation","Right to Constitutional Remedies","Right to Education"],"answer":"3"},{"id":"78552","q":"Who is the author of the book \"India Divided\"?","options":["Maulana Abul Kalam Azad","Dr. Rajendra Prasad","Mahatma Gandhi","Jawaharlal Nehru"],"answer":"2"},{"id":"78553","q":"Which data structure follows the \"FIFO\" (First-In, First-Out) principle?","options":["Stack","Queue","Array","Tree"],"answer":"2"},{"id":"78554","q":"The \"Mahabodhi Temple\" in Bodh Gaya was declared a UNESCO World Heritage Site in which year?","options":["2000","2002","2004","2010"],"answer":"2"},{"id":"78555","q":"What is the SI unit of \"Frequency\"?","options":["Decibel","Hertz","Joule","Watt"],"answer":"2"},{"id":"78556","q":"Which of the following is the \"Powerhouse of the Cell\"?","options":["Nucleus","Ribosome","Mitochondria","Golgi Body"],"answer":"3"},{"id":"78557","q":"\"Vikramshila Dolphin Sanctuary\" is situated in which district of Bihar?","options":["Patna","Bhagalpur","Muzaffarpur","Katihar"],"answer":"2"},{"id":"78558","q":"In computer terms, \"URL\" stands for:","options":["Universal Resource Locator","Uniform Resource Locator","Uniform Record Locator","Universal Record Link"],"answer":"2"},{"id":"78559","q":"Which Mughal emperor introduced the \"Mansabdari System\"?","options":["Babur","Humayun","Akbar","Shah Jahan"],"answer":"3"},{"id":"78560","q":"The \"Rikers Island\" is associated with which Indian city's waste management model?","options":["Indore","Ambikapur","Patna","Surat"],"answer":"2"},{"id":"78561","q":"Which Article of the Indian Constitution deals with the \"Abolition of Untouchability\"?","options":["Article 14","Article 15","Article 17","Article 18"],"answer":"3"},{"id":"78562","q":"What is the main component of \"Natural Gas\"?","options":["Ethane","Methane","Propane","Butane"],"answer":"2"},{"id":"78563","q":"\"BPSC\" (Bihar Public Service Commission) was established in which year?","options":["1947","1949","1950","1952"],"answer":"2"},{"id":"78564","q":"Which vitamin is known as \"Ascorbic Acid\"?","options":["Vitamin A","Vitamin B12","Vitamin C","Vitamin D"],"answer":"3"},{"id":"78565","q":"The \"Roaring Forties\" are powerful winds found in the:","options":["North Atlantic Ocean","Southern Hemisphere","Arctic Region","Sahara Desert"],"answer":"2"},{"id":"78566","q":"In MS-Excel, which function is used to calculate the \"Total\" of a range of cells?","options":["COUNT","SUM","AVERAGE","MAX"],"answer":"2"},{"id":"78567","q":"Who was the first Governor of Bihar after India's independence?","options":["Jairamdas Daulatram","Madhav Sharma","R.R. Diwakar","Zakir Hussain"],"answer":"1"},{"id":"78568","q":"Which metal is the \"Best Conductor\" of electricity?","options":["Gold","Silver","Copper","Aluminum"],"answer":"2"},{"id":"78569","q":"The \"Simon Commission\" visited India in which year?","options":["1927","1928","1930","1932"],"answer":"2"},{"id":"78570","q":"\"RAM\" (Random Access Memory) is a type of:","options":["Non-volatile memory","Volatile memory","Permanent storage","Offline storage"],"answer":"2"},{"id":"78571","q":"Which district of Bihar is famous for \"Madhubani Painting\"?","options":["Madhubani","Darbhanga","Saharsa","Muzaffarpur"],"answer":"1"},{"id":"78572","q":"What is the \"pH value\" of pure water?","options":["0","5","7","14"],"answer":"3"},{"id":"78573","q":"The \"Rajya Sabha\" can delay a Money Bill for a maximum period of:","options":["7 days","14 days","30 days","3 months"],"answer":"2"},{"id":"78574","q":"Which part of the computer is the \"Control Unit\" (CU) a part of?","options":["RAM","CPU","Hard Disk","Monitor"],"answer":"2"},{"id":"78575","q":"\"Lumbini\", the birthplace of Lord Buddha, is located in:","options":["Bihar","Uttar Pradesh","Nepal","Bhutan"],"answer":"3"},{"id":"78576","q":"Which gas is used in the \"Welding\" process?","options":["Oxygen and Acetylene","Methane and Oxygen","Nitrogen and Hydrogen","Helium and Neon"],"answer":"1"}];
let idx=0, answers={}, timerSec=3900, timerInt=null;

function render(){
  const q=DATA[idx];
  if(!q){document.getElementById('qText').textContent='No data.';return;}
  document.getElementById('qNum').textContent=idx+1;
  document.getElementById('qTotal').textContent=DATA.length;
  document.getElementById('qText').textContent=q.q;
  document.getElementById('opts').innerHTML=q.options.map((o,i)=>
    `<div class="option ${answers[idx]==(i+1)?'selected':''}" onclick="select(${i+1})">${String.fromCharCode(65+i)}. ${o}</div>`
  ).join('');
}
window.select=o=>{answers[idx]=o; render();};
window.prev=()=>{if(idx>0){idx--; render();}};
window.next=()=>{if(idx<DATA.length-1){idx++; render();}};

function submitTest(){
  clearInterval(timerInt);
  let c=0; for(let i=0;i<DATA.length;i++){if(answers[i]==DATA[i].answer)c++;}
  const pct=Math.round(c/DATA.length*100)||0;
  document.getElementById('qCard').classList.add('hidden');
  document.getElementById('resCard').classList.remove('hidden');
  document.getElementById('score').textContent=pct+'%';
  document.getElementById('detail').innerHTML='<b>'+c+'/'+DATA.length+'</b> correct';
}

function tick(){timerSec--; document.getElementById('timer').textContent=Math.floor(timerSec/60)+':'+String(timerSec%60).padStart(2,'0'); document.getElementById('bar').style.width=(timerSec/3900*100)+'%'; if(timerSec<=0){clearInterval(timerInt); submitTest();}}

render(); timerInt=setInterval(tick,1000);
</script>
</body></html>
