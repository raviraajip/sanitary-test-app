const DATA=[{"id":"77777","q":"Identify the INCORRECTELY matched pair(s) of the British Governor-Generals of India and the events with which they are associated: i) Lord Dalhousie-Revolt of 1857 ii) Lord Auckland -First Afghan War iii) Lord Canning - Wood's Despatch 1854","options":["Only (i)","Only (i) and (iii)","Only (ii) and (iii)","Only (ii)"],"answer":"2","solution":"Lord Dalhousie left India in 1856; the Revolt of 1857 occurred during Lord Canning's tenure. Wood's Despatch of 1854 occurred during Lord Dalhousie's tenure, not Canning's. Lord Auckland is correctly matched with the First Afghan War."},{"id":"77778","q":"Who was the second vice President of India?","options":["VV Giri","Dr. Zakir Hussain","Dr. S Radhakrishnan","Krishna Kant"],"answer":"2","solution":"Dr. Zakir Hussain served as the second Vice President of India from 1962 to 1967, succeeding Dr. Sarvepalli Radhakrishnan."},{"id":"77779","q":"The Constitution (Scheduled Tribes) Order (Fourth Amendment) Bill, 2022 was passed in Rajya Sabha in December 2022. It seeks to amend the Constitution (Scheduled Tribes) Order, 1950, with respect to its application to the State of 1920","options":["Karnataka","Manipur","Goa","Rajasthan"],"answer":"1","solution":"The Bil35l sought to include the Betta-Kuruba community as a synonym of the 'Kadu Kuruba' in the list of Scheduled Tribes in the state of Karnataka."},{"id":"77780","q":"Short Key for Taking Screenshot","options":["CTRL+S","Shift +S","CTRL+ Shift + S","Windows+Shift +S"],"answer":"4","solution":"In Windows, the combination of Windows Key + Shift + S opens the \"Snipping Tool\" or \"Snip & Sketch\" to capture a specific area or the full screen."},{"id":"77781","q":"Match the following subject matters with their concerned Articles. A. Area of Badland topography B. Vridh Ganga C. Tsangpo D. Sorrow of Bihar Godavari Brahmaputra Kosi Chambal (Contextual)","options":["A-1, B-2, C-3, D-4","A-4, B-1, C-2, D-3","A-4, B-3, C-2, D-1","A-4, B-1, C-3, D-2"],"answer":"2","solution":"Chambal is known for badland topography; Godavari is called Vridh Ganga; Brahmaputra is called Tsangpo in Tibet; and Kosi is the Sorrow of Bihar."},{"id":"77782","q":"What kind of energy is associated with falling coconuts, speeding cars, rolling stones and flying aircraft?","options":["Kinetic Energy","Radiant energy","Elastic energy","Potential energy"],"answer":"1","solution":"Kinetic energy is the energy an object possesses due to its motion; all the listed items are in a state of motion."},{"id":"77783","q":"Match the following subject matters with their concerned Articles. List I (Subject Matter) List II (Articles) A. Superintendence, direction and control of elections 1. Article 329 B. Power of Parliament to make provision with respect to elections 2. Article 324 C. Bar to interference by courts in electoral matters 3. Article 327","options":["A-1, B-2, C-3","A-2, B-3, C-1","A-3, B-2, C-1","A-1, B-3, C-2"],"answer":"2","solution":"Article Subject Matter Key Details Article 324 Superintendence of Elections This article vests the power of superintendence, direction, and control of elections (Parliament, State Legislatures, President, and VP) in the Election Commission . Article 327 Power of Parliament This empowers the Parliament to make laws regarding all matters relating to elections to either House of Parliament or State Legislatures (e.g., preparation of electoral rolls, delimitation of constituencies). Article 329 Bar of Interference by Courts This article prohibits the courts from questioning the validity of any law relating to the delimitation of constituencies or the allotment of seats. It states that election disputes can only be challenged via an election petition . Related Articles to Remember (Part XV - Elections): Article 325: No person to be ineligible for inclusion in, or to claim to be included in a special, electoral roll on grounds of religion, race, caste or sex. Article 326: Elections to the House of the People and to the Legislative Assemblies of States to be on the basis of adult suffrage ."},{"id":"77784","q":"What will be the average kinetic energy per molecule in Sl units for an ideal gas at a temperature of 25\u00b0C?","options":["6.17 x 10 -21 J","9.17 x 10 -22 J","8.17 x 10 -22 J","7.17 x 10 -20 J"],"answer":"1","solution":"Using KE = 3/2kT, where T = 298.15 K, the value is approximately 6.17 x 10 -21 Joules."},{"id":"77785","q":"According to Census of India 2011, in which of the following states was the gap in the literacy rates of males and females, highest?","options":["Mizoram","Meghalaya","Kerala","Rajasthan"],"answer":"4","solution":"Rajasthan recorded the highest gap between male and female literacy rates in the 2011 Census."},{"id":"77786","q":"Which of the following is the primary function of the CPU?","options":["Store data","Perform Calculation","Manage Input/Output","Connect to Internet"],"answer":"2","solution":"The Central Processing Unit (CPU) is responsible for processing data by performing calculations and logic operations."},{"id":"77787","q":"Which of the following options represents the total income earned by individuals from all the sources before deduction of personal income taxes?","options":["Personal Income","Disposable Income","National Income","Gross Income"],"answer":"1","solution":"Personal Income is the total income received by individuals before paying personal taxes."},{"id":"77788","q":"Among the following diseases, which one is NOT inherited?","options":["Muscular dystrophy","Malaria","Cystic Fibrosis","Down Syndrome"],"answer":"2","solution":"Malaria is caused by a parasite transmitted via mosquito bites, while the others are genetic disorders."},{"id":"77789","q":"Based on current scientific knowledge, it is currently postulated that the Earth has an estimated age of:","options":["about 65,00,000 years","about 95,00,00,00 years","about 45,00,000 years","about 4,50,00,00,000 years"],"answer":"4","solution":"The estimated age of the Earth is approximately 4.5 billion years."},{"id":"77790","q":"What does SQL stand for?","options":["Structured Query Language","Simple Query Language","Standard Query Language","Secure Query Language"],"answer":"1","solution":"SQL is Structured Query Language, the standard for managing relational databases."},{"id":"77791","q":"What are the elements in group zero commonly known as","options":["Inert gas","Volatile","Radioactive","Reactive"],"answer":"1","solution":"Group 0 elements are known as Inert or Noble gases due to their chemical stability."},{"id":"77792","q":"Who among the following has written the 'Badshah Nama'","options":["Abdul Hamid Lahori","Inayat Khan","Abul Fazl","Babur"],"answer":"1","solution":"Abdul Hamid Lahori was the author of Badshah Nama, the official history of Shah Jahan's reign."},{"id":"77793","q":"Which of the following is NOT a type of network topology?","options":["Star","Ring","Tree","Cloud"],"answer":"4","solution":"Star, Ring, and Tree are physical network topologies; Cloud refers to a computing model."},{"id":"77794","q":"Which of the following protocols is used for sending emails?","options":["FTP","SMTP","HTTP","IMAP"],"answer":"2","solution":"SMTP (Simple Mail Transfer Protocol) is used for sending emails; IMAP is used for retrieving them."},{"id":"77795","q":"Match List-I (Acid) with List-II (Food Source) A. Carbonic acid | B. Lauric acid | C. Butyric acid | D. Erucic acid Mustard Oil | 2. Butter | 3. Soda Water | 4. Coconut milk","options":["A-3, B-4, C-2, D-1","A-2, B-4, C-3, D-1","A-3, B-2, C-4, D-1","A-4, B-3, C-2, D-1"],"answer":"1","solution":"Carbonic acid is found in soda water; Lauric acid in coconut milk; Butyric acid in butter; and Erucic acid in mustard oil."},{"id":"77796","q":"Which of the following is a possible criticism of privatization","options":["Excessive government interference into private businesses","Expansion of bureaucracy and efficiency in public enterprises","Reduced competition and innovation in the market","Limited access to essential services for marginalized populations"],"answer":"4","solution":"Privatization is often criticized for prioritizing profits over service access for the poor."},{"id":"77797","q":"According to which of the following foreign travelers did Dhruvasena II attend Harsha's assembly at Prayag (Allahabad)?","options":["Hiuen Tsang","Fa-Hien","Itsing","Marco Polo"],"answer":"1","solution":"The Chinese traveler Hiuen Tsang documented Harsha's assembly and the presence of Dhruvasena II."},{"id":"77798","q":"Match the following details regarding Phase-I of Bharatmala Project A. Economic corridors 1. (9000 km) B. Border roads 2. (2000 km) C. Expressways 3. (800 km) D. Inter-corridors 4. (6000 km)","options":["A-4, B-2, C-3, D-1","A-2, B-4, C-3, D-1","A-1, B-2, C-3, D-4","A-1, B-4, C-3, D-2"],"answer":"3","solution":"Economic corridors are targeted at 9000km, Border connectivity at 2000km, Expressways at 800km, and Inter-corridors at 6000km. The Government of India approved Bharatmala Pariyojana Phase-I in 2017 with a total targeted length of 34,800 km . The specific targets for each category are defined as follows: Economic Corridors (9,000 km): Designed to improve connectivity between industrial hubs and consumption centers to reduce logistics costs. Border and International Connectivity Roads (2,000 km): Aimed at enhancing strategic infrastructure along India's borders and improving trade routes with neighboring countries like Nepal, Bhutan, Bangladesh, and Myanmar. Expressways (800 km): Development of high-speed greenfield expressways to manage heavy traffic and freight more efficiently. Inter-corridors and Feeder Roads (6,000 km): Targeted at bridging gaps between major corridors to ensure a seamless and uniform road network. Additional Components: Phase-I also includes National Corridors Efficiency Improvements (5,000 km), Coastal and Port Connectivity Roads (2,000 km), and residual NHDP works (10,000 km)."},{"id":"77799","q":"Which committee had suggested a penalty or punishment for the non-performance of fundamental Duties","options":["Swaran Singh Committee","Verma Committee","Morarji Desai Committee","Indira Gandhi Committee"],"answer":"1","solution":"The Swaran Singh Committee recommended punishments for failing to perform fundamental duties."},{"id":"77800","q":"Match List-I (Chemical compound) with List-II (Spices) A. Curcuminoids | B. 1,8 cineole | C. Eugenol | D. Piperline Cardamom | 2. Black Pepper | 3. Turmeric | 4. Cloves","options":["A-3, B-1, C-2, D-4","A-1, B-4, C-3, D-2","A-4, B-3, C-2, D-1","A-3, B-1, C-4, D-2"],"answer":"4","solution":"Curcuminoids are in turmeric; 1,8 cineole in cardamom; Eugenol in cloves; and Piperline in black pepper."},{"id":"77801","q":"Which of the following are some regions in the world, known for their thriving citrus fruits production","options":["Africa","Mediterranean regions","Caribbean","Equatorial"],"answer":"2","solution":""},{"id":"77802","q":"Match the following Prime Minister of India with the Five-Years Plans they initiated A. Jawaharlal Nehru | B. Manmohan Singh | C. Atal Bihari Vajpayee Second Plan | 2. Tenth Plan | 3. Eleventh Plan","options":["A-2, B-3, C-1","A-3, B-2, C-1","A-2, B-1, C-3","A-1, B-3, C-2"],"answer":"4","solution":"Nehru initiated the 2nd plan; Manmohan Singh the 11th; and Vajpayee the 10th."},{"id":"77803","q":"Sattriya dance form is famous in which of these states?","options":["Assam","Himachal Pradesh","Punjab","Tamil Nadu"],"answer":"1","solution":"Sattriya is a classical Indian dance that originated in the Vaishnavite monasteries of Assam."},{"id":"77804","q":"In which Five-Year Plan were Removal of Poverty(Garibi Hatao) and Self-Reliance declared as major plan objectives?","options":["Eighth Five-Year Plan","Seventh Five-Year Plan","Fifth Five-Year Plan","Sixth Five-Year Plan"],"answer":"3","solution":"The Fifth Five-Year Plan (1974-1979) focused on poverty alleviation and self-reliance."},{"id":"77805","q":"What does 'HTTP' stand for?","options":["Hypertext Transfer Protocol","Hypertext Transmission Protocol","Hyperlink Transfer Protocol","Hyper Transfer Text Protocol"],"answer":"1","solution":"HTTP stands for Hypertext Transfer Protocol, used for data communication on the web."},{"id":"77806","q":"Which of the following is the correct match between column-A and column-B? Elements in Earth Crust: A. Oxygen 1. 47% B. Silicon 2. 28% C. Aluminium 3. 8% D. Iron 4. 5%","options":["A-1, B-2, C-3, D-4","A-3, B-1, C-2, D-4","A-3, B-2, C-1, D-4","A-2, B-1, C-3, D-4"],"answer":"1","solution":"Oxygen makes up ~47%, Silicon ~28%, Aluminium ~8%, and Iron ~5% of the crust. The Earth's crust is primarily composed of eight major elements that account for approximately 98% of its total mass. The percentages for the elements in your query are the standard geological values: Oxygen (46.6% ~ 47%): The most abundant element, existing primarily in oxides and silicate minerals. Silicon (27.7% ~ 28%): The second most abundant element and a primary component of sand and silicate rocks. Aluminium (8.1% ~ 8%): The most abundant metal in the crust and the third most abundant element overall. Iron (5.0% ~ 5%): The fourth most abundant element in the crust; note that while it is only 5% of the crust, it is the most abundant element when considering the entire Earth (crust, mantle, and core"},{"id":"77807","q":"Which of the following is a characteristic of 'volatile' memory?","options":["It retains data even when powered off","It loses data when power is lost","It is slower than non-volatile memory","It is used for permanent storage"],"answer":"2","solution":"Volatile memory, such as RAM, requires electricity to maintain stored information."},{"id":"77808","q":"In July 1968, Indira Gandhi officially recorded impressive strides of the Green Revolution in agriculture by releasing a special stamp entitled","options":["Wheat Revolution","Fasal Kranti","Harit Kranti","Green Revolution"],"answer":"1","solution":"The stamp was titled \"Wheat Revolution\" to celebrate the high-yield variety success."},{"id":"77809","q":"Select the correct alternative of the basis of the given statements on the drainage system of the Harappan civilization Statement-I: In most of the Harappan cities, the houses had open drainage systems outside. Statement-II: In the Harappan civilization, water and garbage used to drain out from the drains located outside the houses and go into the main underground drain.","options":["Only Statement I is true","Both Statement I and Statement II are true","Only Statement II is true","Neither Statement I nor Statement II is true"],"answer":"3","solution":"Harappan drainage systems were typically covered, not open, making statement I false."},{"id":"77810","q":"Which of the following Musical instruments arts is popularized by Ustad Allarakha Qureshi","options":["Shehnai","Santoor","Tabla","Flute"],"answer":"3","solution":"Ustad Allarakha Qureshi was a legendary Indian tabla player and frequent accompanist to Ravi Shankar."},{"id":"77811","q":"What does the term 'bandwidth' refer to in networking","options":["The physical distance between devices","The amount of data that can be transmitted in a given time","The speed of the processor","The type of network cable used"],"answer":"2","solution":"Bandwidth is the maximum rate of data transfer across a network path."},{"id":"77812","q":"Through the 73th Constitutional Amendment Act, 1992, the government fulfilled the constitutional obligation stated in Article","options":["40","43","42","41"],"answer":"1","solution":"Article 40 directs the state to organize village panchayats, which was formalized by the 73rd Amendment."},{"id":"77813","q":"Which of the following storage devices is considered non-volatile?","options":["RAM","Cache","Hard Disk Drive (HDD)","CPU Register"],"answer":"3","solution":"HDDs are non-volatile storage because they retain data even when power is disconnected."},{"id":"77814","q":"Which Article deals with the election of the Vice President?","options":["Article 66","Article 72","Article 76","Article 52"],"answer":"1","solution":"Article 66 of the Indian Constitution specifies the manner of the election of the Vice President."},{"id":"77815","q":"Who was the auther of \"Mahabhashya\"?","options":["Bana","Panini","Patanjali","Kautilya"],"answer":"3","solution":"Patanjali wrote the Mahabhashya, a commentary on Panini's Ashtadhyayi."},{"id":"77816","q":"In what condition does the body's immune system attack the actual intrinsic factor protein or the cells in your stomach lining that make it?","options":["Wernicke-Korsakoff Syndrome","Hepatic cirrhosis","Pernicious anaemia","Hartnup disorder"],"answer":"3","solution":"Pernicious anemia is an autoimmune condition where the body cannot absorb Vitamin B12 due to a lack of intrinsic factor."},{"id":"77817","q":"What is a 'byte' composed of?","options":["4 bits","8 bits","16 bits","32 bits"],"answer":"2","solution":"A byte is the basic unit of digital information, consisting of 8 bits."},{"id":"77818","q":"Which of the following best describes 'phishing'?","options":["A method to improve network speed","A technique used to steal sensitive information","A type of computer virus","A way to enhance software performance"],"answer":"2","solution":"Phishing is a fraudulent practice of sending emails to trick individuals into revealing personal info."},{"id":"77819","q":"Disputes between two or more states come under the original jurisdiction of the supreme court:","options":["original jurisdiction","advisory jurisdiction","appellate Jurisdiction","writ Jurisdiction"],"answer":"1","solution":"The Correct Answer is original jurisdiction. Key Points Article-131: Original Jurisdiction The SC (as a federal court of India) possesses Original jurisdiction to decide the disputes arising between different units of the Indian Federation like: Centre and one or more states; or Centre & any state(s) on one side and one or more states on the other; or \u03a0 Two or more states. Additional Information Advisory Jurisdiction - The Constitution under Article 143 authorises the President to seek the opinion of the Supreme Court in the two categories of matters: On any question of law or fact of public importance which has arisen or which is likely to arise. On any dispute arising out of any pre-constitution treaty, agreement, covenant, engagement, sanador other similar instruments. Appellate Jurisdiction The Supreme Court is primarily a court of appeal and hears appeals against the judgements of the lower courts. It enjoys a wide appellate jurisdiction which can be classified under four heads: 1. Appeals in constitutional matters 2. Appeals in civil matters 3. Appeals in criminal matters 4. Appeals by special leave Writ Jurisdiction - The Supreme Court is empowered to issue writs, including habeas corpus, mandamus, prohibition, quo-warranto and certiorari for the enforcement of the fundamental rights of an aggrieved citizen. In this regard, the Supreme Court has original jurisdiction in the sense that an aggrieved citizen can go directly to the Supreme Court, not necessarily by way of appeal. However, the writ jurisdiction of the Supreme Court is not exclusive. The High Courts are also empowered to issue writs for the enforcement of the Fundamental Rights."},{"id":"77820","q":"Which unsaturated aliphatic hydrocarbon composed of 20 carbon atoms is used to make candles and paraffin wax?","options":["Octane","Eicosane","Nonane","Triacontane"],"answer":"2","solution":"Eicosane (C 20 H 42 ) is an alkane used in paraffin wax and candles."},{"id":"77821","q":"Which of the following is NOT a programming language?","options":["Python","HTML","Java","SQL"],"answer":"2","solution":"HTML is a markup language, not a programming language."},{"id":"77822","q":"Which of the following industries are engaged in the reproduction and multiplication of certain spices of plants and animals?","options":["Primary","Construction","Genetic","Extractive"],"answer":"3","solution":"Genetic industries focus on breeding plants and animals for sale."},{"id":"77823","q":"What was the dominant sources of income in the Vijayanagar Empire","options":["Mining","Industrial duty","Land revenue","Import duty"],"answer":"3","solution":"Land revenue (Sist) was the primary source of state income for the Vijayanagar rulers."},{"id":"77824","q":"\"Goal\" is the autobiography of","options":["Cristiano Ronaldo","Mary kom","Major Dhyanchand","Mike Tyson"],"answer":"3","solution":"\"Goal\" is the autobiography of the Indian hockey legend Major Dhyanchand."},{"id":"77825","q":"When RBI decides to decrease the repo rate, money supply will","options":["Decrease","Increase","Remain Unaffected","Initially stay constant"],"answer":"2","solution":""},{"id":"77826","q":"The Reserve Bank of India was nationalized on","options":["March 1, 1949","January 1, 1949","October 1, 1949","April 1, 1949"],"answer":"2","solution":"RBI was nationalized on January 1, 1949, under the RBI (Transfer of Public Ownership) Act, 1948."},{"id":"77827","q":"Which state became the first in India to partner with Starlink for satellite internet?","options":["Maharashtra","Karnataka","Telangana","Gujrat"],"answer":"3","solution":"Telangana was one of the early states to explore Starlink partnerships for rural connectivity."},{"id":"77828","q":"Who won Best Actor at Dadasaheb Phalke International Film Festival Awards 2025?","options":["Shahrukh khan","Vicky Kaushal","Karthik Aryan","Ranveer Singh"],"answer":"3","solution":"Kartik Aaryan received the Best Actor award at the 2025 DPIFF ceremony Shah Rukh Khan received the Best Actor award at the 2024 DPIFF ceremony."},{"id":"77829","q":"Consider the following pairs regarding Industrial units in Bihar: Refined Oil - Durgawati | 2. Sugar Mill - Patna | 3. Brewery - Sitamarhi | 4. Kraft Paper - Aurangabad","options":["Only 1","Only 2 & 3","Only 4","1, 2, 3 & 4"],"answer":"4","solution":"These pairs correctly represent the industrial locations for those specific units in Bihar."},{"id":"77830","q":"In which year, Patna secretariat was established?","options":["1917","1925","1920","1930"],"answer":"1","solution":"The Patna Secretariat building was completed in 1917."},{"id":"77831","q":"Which tree is designated as the state tree of Bihar?","options":["Peepal","sesame","mango","litchi"],"answer":"1","solution":"The Peepal tree (Ficus religiosa) is the state tree of Bihar."},{"id":"77832","q":"Which among the following imposes a greater burden on the poor than on the rich?","options":["Progressive tax","Regressive tax","LumpSum tax","Proportional tax"],"answer":"2","solution":"A regressive tax takes a larger percentage of income from low-income earners than high-income earners."},{"id":"77833","q":"Which among the following bodies estimates the national income of India?","options":["Office of the Economic Advisor","Ministry of Statistics","Central Statistical Office","Ministry of Finance"],"answer":"3","solution":"The Central Statistical Office (CSO) is the nodal agency for estimating National Income in India."},{"id":"77834","q":"Where is the Khuda Bakhsh Library located?","options":["Gaya","Nalanda","Patna","Bodh Gaya"],"answer":"3","solution":"The Khuda Bakhsh Oriental Public Library is located in Patna."},{"id":"77835","q":"The pattern of drainage in Bihar plain is:","options":["radial","rectangular","dendritic","superimposed"],"answer":"3","solution":"The drainage pattern of the Ganga and its tributaries in the Bihar plain is primarily dendritic."},{"id":"77836","q":"Which of the following lakes is situated in Bihar?","options":["Anupam Lake","Sambhar Lake","Sukhna Lake","Kama Lake"],"answer":"1","solution":"Anupam Lake is located in the Kaimur Wildlife Sanctuary of Bihar."},{"id":"77837","q":"Why Bagmati river is considered as a dangerous river?","options":["Due to its changing course","Due to its origin in the himalaya","Due to tendency to create floods","None of the above"],"answer":"3","solution":"The Bagmati is known for its sudden and devastating floods in North Bihar."},{"id":"77838","q":"The hottest spring of Rajgir is:","options":["Saptdhara","Surya kunda","Brahma kunda","Nanak kunda"],"answer":"3","solution":"Brahma Kunda is recorded as the hottest water spring in Rajgir."},{"id":"77839","q":"Out of total geographical area of India, Bihar comprises:","options":["3.76%","2.86%","4.02%","6.76%"],"answer":"2","solution":"Bihar covers 94,163 km 2 , which is approximately 2.86% of India's total area."},{"id":"77840","q":"How many UNESCO World Heritage Sites are located in Bihar?","options":["1","2","3","4"],"answer":"2","solution":"Bihar has two sites: Mahabodhi Temple and Nalanda Mahavihara."},{"id":"77841","q":"First foreign traveler to visit Bihar was:","options":["Megasthene","Fa-Hien","Hiuen Tsang","I-Tsin"],"answer":"1","solution":"Megasthenes visited the Mauryan capital Pataliputra (Patna) in the 4th century BCE."}];
let idx=0, answers={}, timerSec=65*60, timerInt=null;

function render(){
  const q=DATA[idx];
  if(!q){document.getElementById('qText').textContent='No data.';return;}
  document.getElementById('qNum').textContent=idx+1;
  document.getElementById('qTotal').textContent=DATA.length;
  document.getElementById('qText').textContent=q.q;
  document.getElementById('opts').innerHTML=q.options.map((o,i)=>
    `<div class="option ${answers[idx]==(i+1)?'selected':''}" onclick="select(${i+1})">${String.fromCharCode(65+i)}. ${o}</div>`
  ).join('');
}
window.select=o=>{answers[idx]=o; render();};
window.prev=()=>{if(idx>0){idx--; render();}};
window.next=()=>{if(idx<DATA.length-1){idx++; render();}};

function submitTest(){
  clearInterval(timerInt);
  let c=0; for(let i=0;i<DATA.length;i++){if(answers[i]==DATA[i].answer)c++;}
  const pct=Math.round(c/DATA.length*100)||0;
  document.getElementById('qCard').classList.add('hidden');
  document.getElementById('resCard').classList.remove('hidden');
  document.getElementById('score').textContent=pct+'%';
  document.getElementById('detail').innerHTML='<b>'+c+'/'+DATA.length+'</b> correct';
}

function tick(){timerSec--; document.getElementById('timer').textContent=Math.floor(timerSec/60)+':'+String(timerSec%60).padStart(2,'0'); document.getElementById('bar').style.width=(timerSec/(65*60)*100)+'%'; if(timerSec<=0){clearInterval(timerInt); submitTest();}}

render(); timerInt=setInterval(tick,1000);
</script>
