<script>
const DATA=[{"id":"75414","q":"During the EIA process under India's EIA Notification 2006, public consultation is a must for","options":["All 'A' category projects","All 'B1' category projects","All 'A' category projects except for a few exceptional ones","All 'A' and 'B1' category projects except for a few exceptional ones"],"answer":"4","solution":"According to the EIA notification 2006, all projects and activities are broadly categorized into two categories Category A and Category B. All projects or activities included as Category 'A' require prior environmental clearance from the Central Government in the Ministry of Environment and Forests (MoEF) on the recommendations of an Expert Appraisal Committee (EAC) to be constituted by the Central Government. All projects or activities included as Category 'B' require prior environmental clearance from the State/Union Territory Environment Impact Assessment Authority (SEIAA). The projects requiring an Environmental Impact Assessment report shall be termed Category 'B1'. The projects which do not require an Environmental Impact Assessment report shall be termed Category 'B2'."},{"id":"75415","q":"First notification of EIA with EMP in India was initiated on","options":["5 June 20000","1 August 1985","27 January 1994","1 January 1970"],"answer":"3","solution":"The first notification for the Environmental Impact Assessment (EIA) process in India, which made Environmental Clearance (EC) mandatory for new projects and expansion/modernization of existing ones, was initiated on 27 January 1994. This notification, issued under the Environment (Protection) Act, 1986, listed 29 categories of projects requiring an EIA before establishment."},{"id":"75416","q":"Noise was recognized specifically as a pollutant under the section","options":["Section 2(b) Air Pollution Act 1987","1981 under section 2(b)","Air Pollution Act 1987","1987 under section 7(c)"],"answer":"3","solution":"The Air (Prevention and Control of Pollution) Act, 1981, was amended in 1987 to include noise explicitly as a pollutant. While Section 2(b) defines 'air pollutant' (which includes noise), the specific legal recognition and standards related to noise pollution are often cited under Section 6(2)(b) of the Air (Prevention and Control of Pollution) Act, 1981 (as amended in 1987). Section 2(b) gives the definition of \"air pollutant\" (including noise). Section 6(2)(b) empowers the Central Pollution Control Board related to standards for emission of air pollutants including noise."},{"id":"75417","q":"Which of the following steps is typically performed first in the Environmental Impact Assessment (EIA) process?","options":["Screening","Scoping","Public consultation","Mitigation measures"],"answer":"1","solution":"Screening often results in a categorization of the project and from this a decision is made on whether or not a full EIA is to be carried out. The way in which an EIA is carried out is not rigid: it is a process comprising a series of steps. These steps are outlined below and the techniques more commonly used in EIA are described in some detail in the section Techniques. \uf0d8 The main steps in the EIA process are : screening scoping prediction and mitigation management and monitoring audit"},{"id":"75418","q":"All decisions of the State Level Environment Impact Assessment Authority shall ordinarily be taken","options":["By three-fourths majority","By simple majority","Unanimously","By two thirds majority"],"answer":"3","solution":"In exercise of the powers conferred by sub-section of the Environment (Protection) Act, 1986, State Level Environment Impact Assessment Authority: The Member-Secretary shall be a serving officer of the concerned State Government or Union territory administration familiar with environmental laws. The Chairman shall be an expert in terms of the eligibility criteria. The other member shall be an expert fulfilling the eligibility criteria. The State Government or Union territory Administration shall forward the names of the Members and the Chairman referred in sub- paragraph 3 to 4. The non-official Member and the Chairman shall have a fixed term of three years (from the date of the publication of the notification by the Central Government constituting the authority). All decisions of the SEIAA shall be taken in a meeting and shall ordinarily be unanimous . Provided that, in case a decision is taken by majority, the details of views, for and against it, shall be clearly recorded in the minutes and a copy thereof sent to MoEF."},{"id":"75419","q":"The Environmental Relief fund was created under","options":["Environmental Protection Act","Forest Conservation Act","Public Liability Insurance Act","Wildlife Protection Act"],"answer":"3","solution":"The Environment Relief Fund (ERF) was established under the Public Liability Act, 1991 (PLIA), to provide immediate relief to victims of accidents involving hazardous substances. It falls under Section 7A of the Public Liability Act, of 1991. ERF consists of compensation awarded by the National Green Tribunal (NGT) for damage to the environment under Section 24 of the NGT Act, 2010."},{"id":"75420","q":"Need of EPA was felt, in India, after","options":["Tsunami in Tamil Nadu","Bhopal Tragedy","Earthquake in Gujarat","Gas leakage in Delhi"],"answer":"2","solution":"Environment Protection Act, 1986 is an Act of the Parliament of India. It was enacted in May 1986 and came into force on 19 November 1986. It has 26 sections and 4 chapters. The Act is widely considered to have been a response to the Bhopal gas leak."},{"id":"75421","q":"Which one of the following types of ecology is dealt with autecology?","options":["Community ecology","Peripheral ecology","Ecosystem ecology","Individual species ecology"],"answer":"4","solution":"Autecology means the study of the Relationship of species with their environment. Autecology is also the study of individual organisms. The approach originally focused on the adaptiveness of an organism's physiology to the environment but has since been expanded to include the study of the distribution and dynamics of populations. In terms of biodiversity, autecology has embraced taxonomic diversity. The community approach defines diversity in terms of the number of species and relative abundances of species. The ecosystem approach defines diversity in terms of processes and function within the community."},{"id":"75422","q":"In a batch culture growth pattern of bacteria, the phase which represents the time required for organisms to acclimatize to the new environment is:","options":["Stationary phase","Death phase","Lag phase","Log phase"],"answer":"3","solution":"In autecological studies, the growth of bacteria (or other microorganisms, as protozoa, microalgae or yeasts) in batch culture can be moulded with four different phases: Lag phase :- Lag time is defined as the initial period in the life of a bacterial population when cells are adjusting to a new environment before starting exponential growth. Log phase :- The log phase (sometimes called the logarithmic phase or the exponential phase) is a period characterized by cell doubling. The number of new bacteria appearing per unit time is proportional to the present population. Stationary phase :- The stationary phase is often due to a growth-limiting factor such as the depletion of an essential nutrient, and/or the formation of an inhibitory product such as an organic acid. Stationary phase results from a situation in which growth rate and death rate are equal. Death phase :- At death phase (decline phase), bacteria die. This could be caused by lack of nutrients, environmental temperature above or below the tolerance band for the species, or other injurious conditions."},{"id":"75423","q":"What is MRR technique?","options":["Mark, Release, Recapture","Mark, Rescue, Restore","Mark, Revive, Rescue","Mark, Recapture, Release"],"answer":"1","solution":"MRR Technique - It is a technique to measure size of population of small mammals in an area. It stands for mark, release & recapture."},{"id":"75424","q":"Which one of the following is the largest ecosystem of the world?","options":["Ocean","Grassland","Forest","Mountains"],"answer":"1","solution":"Six major ecosystems of the world are : - 1. Fresh water ecosystem 2. Marine (ocean) ecosystem 3. Grassland ecosystem 4. Forest ecosystem 5. Desert ecosystem 6. Cropland ecosystem The ocean ecosystem is the largest ecosystem of the world as it covers 70 percent of earth's geographical area."},{"id":"75425","q":"The primary source of energy in Eco-body is-","options":["Energy emitted by fermentation","Preserved vegetable sugar","Solar energy","None of the above"],"answer":"3","solution":"On Earth, the primary source of energy comes from the sun. Sunlight carries an astonishingly high concentration of the kind of energy known as photons, called solar energy. A portion of the solar energy that a plant absorbs during photosynthesis is then used to create new chemical bonds as the plant continues to mature. When burning, plant products like wood break the bonds and release energy such as heat and light."},{"id":"75426","q":"Among the Sustainable Development Goals (SDG) which of the goal prescribe Affordable and clear energy.","options":["SDG-7","SDG-8","SDG-9","SDG-10"],"answer":"1","solution":"List of the 17 Sustainable Development Goals: No Poverty:- End poverty in all its forms everywhere. Zero Hunger: End hunger, achieve food security and improved nutrition and promote sustainable agriculture. Good Health and Well-being:- Ensure healthy lives and promote well-being for all at all ages. Quality Education:- Ensure inclusiv\u00e9 and equitable quality education and promote lifelong learning opportunities for all. Gender Equality:- Achieve gender equality and empower all women and girls. Clean Water and Sanitation:- Ensure availability and sustainable management of water and sanitation for all. Affordable and Clean Energy:- Ensure access to affordable, reliable, sustainable and modern energy for all. Decent Work and Economic Growth:- Promote sustained, inclusive and sustainable economic growth, full and productive employment and decent work for all. Industry, Innovation, and Infrastructure:- Build resilient infrastructure, promote inclusive and sustainable industrialization and foster innovation. Reduced Inequalities:- Reduce inequality within and among countries. Sustainable Cities and Communities:- Make cities and human settlements inclusive, safe, resilient and sustainable. Responsible Consumption and Production:- Ensure sustainable consumption and production patterns. Climate Action:- Take urgent action to combat climate change and its impacts. Life Below Water:- Conserve and sustainably use the oceans, seas and marine resources for sustainable development. Life on Land:- Protect, restore and promote sustainable use of terrestrial ecosystems, sustainably manage forests, combat desertification, and halt and reverse land degradation and halt biodiversity loss. Peace, Justice, and Strong Institutions:- Promote peaceful and inclusive societies for sustainable development, provide access to justice for all and build effective, accountable and inclusive institutions at all levels. Partnerships for the Goals:- Strengthen the means of implementation and revitalize the global partnership for sustainable development."},{"id":"75427","q":"Which of the following is an approach to design for sustainability?","options":["Selection of resources with low environmental impact","Design for safety and reliability","Design for manufacturability","Design for supply chain"],"answer":"1","solution":"Selection of resources with low environmental impact:- This option aligns with the principles of design for sustainability. Selecting resources with low environmental impact involves choosing materials and resources that are renewable, recyclable, biodegradable, or have a reduced environmental footprint throughout their lifecycle. By selecting environmentally friendly materials, designers can minimize resource depletion, pollution, and waste generation, contributing to sustainable product design and development. Sustainable development is the concept of development that meets the need of the present without compromising the ability of future generations to meet their own needs. Sustainable development is a subject of sensitivity in the context of natural resources from one to another generation. The main objective of sustainable development is the conservation of natural resources, proper management of natural resources and use of natural resources in a just manner. It is notable that the word 'Sustainable Development' was explained by WCED (World Commission on Environment and Development) in its report of 1987 titled \"Our Common Future\". It captured full attention by Agenda 21 (Rio Conference) in Earth Summit of 1992. It was the main point of discussion in the Johannesburg Conference of 2002."},{"id":"75428","q":"Which type of economy is best in terms of sustainability","options":["circular","linear","non-linear","All of the above"],"answer":"1","solution":"Circular economy :- Aims to minimize waste, reuse resources, and regenerate natural systems by keeping products and materials in use for as long as possible. This aligns with the principles of sustainability by reducing resource depletion, pollution, and greenhouse gas emissions. Linear economy :- This traditional model focuses on producing, consuming, and discarding products, which leads to high resource consumption, waste generation, and environmental degradation. This is considered unsustainable. Non-linear economy :- While this term is not commonly used in discussions around sustainability, it generally refers to an economy that is not structured in a linear fashion. It could encompass various models, but without a specific definition related to sustainability, it's difficult to assess its impact."},{"id":"75429","q":"Ozone is formed in the upper atmosphere by a photochemical reaction with","options":["Infra-red radiation","Visible light","Ultra violet solar radiation","All of the above"],"answer":"3","solution":"Stratospheric ozone is formed naturally by chemical reactions involving solar ultraviolet radiation (sunlight) and oxygen molecules, which make up about 21% of the atmosphere."},{"id":"75430","q":"Which of the following statements are correct about Ozone? (i) It is comprising of 3 oxygen atoms. (ii) It is light blue in colour (iii) Its thickness is measured in Rem (iv) It is present in both troposphere and stratosphere Select the correct answer using the codes given below:","options":["(i) and (ii)","(i), (ii) and (iii)","(i), (ii) and (iv)","(i), (ii), (iii) and (iv)"],"answer":"3","solution":"Ozone (O 3 ) is a molecule made up of three oxygen atoms. It is a highly reactive gas and plays a crucial role in the Earth's atmosphere, particularly in the stratosphere where it forms the ozone layer. Ozone is indeed light blue in colour when it is in its gaseous form. The thickness of the ozone layer is measured in Dobson Units (DU). Ozone is found in both the troposphere (the lowest layer of Earth's atmosphere) and the stratosphere (the second layer of the atmosphere)."},{"id":"75431","q":"The international treaty which aims at reducing global warming is","options":["CITES","Ramsar convention","Kyoto Protocol","Montreal Protocol"],"answer":"3","solution":"Kyoto Protocol:- Kyoto Protocol, in full Kyoto Protocol to the United Nations Framework Convention on Climate Change, international treaty, named for the Japanese city in which it was adopted in December 1997, that aimed to reduce the emission of gases that contribute to global warming."},{"id":"75432","q":"Abnormal, surface temperature on Venus is explain by","options":["Normal green house effect","Runoff green house effect","Stefan Bolzmann law","Wiens law"],"answer":"2","solution":"Runaway greenhouse effect:- A runaway greenhouse effect will occur when a planet's atmosphere contains greenhouse gas in an amount sufficient to block thermal radiation from leaving the planet, preventing the planet from cooling and from having liquid water on its surface. The abnormal surface temperature on Venus is primarily attributed to the runaway greenhouse effect. The atmosphere in Venus, consists 96.5% carbon dioxide, which blocks long wavelength infrared radiations and traps heat inside, causing greenhouse effect."},{"id":"75433","q":"Which among the following is the world's single largest contributor of greenhouse gases and is one of the most important causes of global warming?","options":["Wood","Oil","Coal","Biogas"],"answer":"3","solution":"Coal is a fossil fuel formed from plant material that was buried millions of years ago. When coal is burned for energy production, such as in power plants or industrial processes, it releases carbon dioxide (CO 2 ) and other greenhouse gases into the atmosphere. CO 2 is a major contributor to the greenhouse effect, which leads to global warming and climate change. While other fossil fuels like oil and natural gas also contribute to greenhouse gas emissions, coal is often considered the most significant contributor due to its high carbon content and widespread use, particularly in electricity generation and industrial applications. Wood, although it releases carbon dioxide when burned, is generally considered a renewable resource if harvested sustainably. Its contribution to greenhouse gas emissions is typically lower compared to fossil fuels like coal, oil, and natural gas. Oil is another significant source of greenhouse gas emissions, particularly through its use in transportation, heating, and industrial processes. However, it is not typically as large a contributor as coal. Biogas, derived from organic matter such as agricultural waste, sewage, or landfill gas, also produces greenhouse gases when burned. However, its overall contribution to global greenhouse gas emissions is relatively small compared to coal, oil, and natural gas. coal is the largest contributor of greenhouse gases and one of the most important causes of global warming."},{"id":"75434","q":"What was the theme of World Environment Day 2020","options":["Beat Air Pollution","Beat Plastic Pollution","Go Wild for Life","Time for Nature"],"answer":"4","solution":"World Environment Day 2020 focused on the theme \"Time for Nature,\" highlighting the importance of biodiversity and ecosystems for human well-being and the planet's health."},{"id":"75435","q":"Bacillus is a","options":["Virus","Bacteria","Protozoa","Medicinal drug"],"answer":"2","solution":"Bacillus is a genus of rod-shaped bacteria commonly found in soil and water. They are single-celled organisms with a distinct cell wall and internal structure."},{"id":"75436","q":"Who drafts or develops the Red List of Species","options":["Government of India","The United Programme National Environment","The International Union for the Conservation of Nature","Biodiversity"],"answer":"3","solution":"Red list of species:- International union for conservation of natures red list of threatened Endangered species was established in 1964. It has evolved as most comprehensive information source on global conservation status of animals, fungi & plant species."},{"id":"75437","q":"Biodiversity act of India was passed by the Parliament in the year?","options":["1999","2000","2014","2002"],"answer":"4","solution":"Convention on Biological Diversity (CBD) is the international legal instrument for \"the conservation of biological diversity, the sustainable use of its components and the fair and equitable sharing of the benefits arising out of the utilization of genetic resources\". Convention on Biological Diversity covers biodiversity at all levels: ecosystems, species and genetic resources and also covers biotechnology, including through the Cartagena Protocol on Biosafety. The Secretariat of the Convention on Biological Diversity is located in Montreal, Canada. To meet the obligations under the Convention on Biological Diversity (CBD), India enacted the Biodiversity Act 11th December 2002. Biological Diversity Act 2002 was enacted in order to conserve biodiversity, manage its sustainable use, and enable fair and equitable sharing benefits arising out of the use of biological resources with the local communities. National Biodiversity Authority (NBA) has been formed under the act and is headquartered in Chennai."},{"id":"75438","q":"The objectives of the Wild Life Protection, Act 1972 is","options":["To preserve the biodiversity","Protection and conservation of wild life","To maintain essential ecological and life supporting, systems","All the above"],"answer":"4","solution":"The Wild Life Protection Act, 1972 was enacted with a broad objective to protect wildlife, conserve their habitats, and maintain ecological balance. This encompasses biodiversity preservation, as protecting wildlife species contributes to the overall health of ecosystems. The Act also aims to ensure the continuation of essential ecological and life-supporting systems by safeguarding critical wildlife populations and their habitat"},{"id":"75439","q":"A partially enclosed coastal body with one or more rivers pouring into it which has a connection with the sea is known as","options":["Estuary","Stream","Bay","Lake"],"answer":"1","solution":"An estuaryis a partially confined coastal water body where salt water from oceans mix with fresh water from rivers and streams. It is a coastal area where a river meets the ocean. It is strongly affected by tidal actions and is very rich in nutrients and consequently very rich in biodiversity too. The organisms here are highly tolerant and many species are endemic. The ecosystem is known to have high food productivity. However this ecosystem has to be protected from pollution."},{"id":"75440","q":"Ground water mining in coastal areas can result into:","options":["Increase in the salinity of ground water","Decrease in the toxicity of ground water","Decrease in salinity","Increase in water table"],"answer":"1","solution":"Groundwater mining in coastal areas can lead to an increase in the salinity of the groundwater. This happens because excessive pumping of freshwater can cause saltwater from the ocean to seep into and contaminate the freshwater aquifers."},{"id":"75441","q":"Which of the following statement(s) is/are true regarding UN-REDD Programme ? (i) It was launched in 2008 as a collaborative initiative of FAO, UNDP and UNEP. (ii) It covers four regions: Africa, Asia-Pacific, Latin America and Caribbean (iii) It supports stakeholder engagement, including indigenous people and forest-dependent communities. (iv) Its primary focus is to provide financial incentives exclusively for afforestation in developed countries.","options":["(i) and (ii)","(ii) and (iii)","(i), (ii) and (iii)","(i), (ii), (iii) and (iv)"],"answer":"3","solution":"The UN-REDD Programme was launched in 2008 by the Food and Agriculture Organization (FAO), the United Nations Development Programme (UNDP), and the United Nations Environment Programme (UNEP). The UN-REDD Programme operates in several regions, including Africa, Asia-Pacific, Latin America, and the Caribbean. A key aspect of the program is engaging stakeholders, particularly indigenous people and forest-dependent communities. While the program can provide support, its primary focus is not solely on incentivizing afforestation in developed countries. It aims to address deforestation and forest degradation in developing countries."},{"id":"75442","q":"Which of the following statement(s) is/are true for In Joint Forest Management (JFM):","options":["Government and communities work together local","NGO and private sector work together","Government and private sector work together","Government and NGO work together"],"answer":"1","solution":"Joint Forest Management (JFM) is an initiative in India aimed at involving local communities in the management and protection of forests, with the government and local communities working together to ensure sustainable forest management."},{"id":"75443","q":"Which one of the following is not a fossil fuel ?","options":["Natural gas","Petrol","Coal","Uranium"],"answer":"4","solution":"Why? Uranium is a mineral found in rocks. It is a nuclear fuel used in nuclear power plants to generate electricity through fission. It is not formed from the remains of living organisms. Fossil fuels (like Natural Gas, Petrol, and Coal) are formed from the decomposition of buried carbon-based organisms (dead plants and animals) that died millions of years ago. Breakdown of the options: Natural Gas: Fossil fuel (Gas state). Petrol: Fossil fuel derivative (Liquid state). Coal: Fossil fuel (Solid state). Uranium: Nuclear fuel (Mineral/Element)."},{"id":"75444","q":"Derived from a wide variety of material of plant or animal origin is called","options":["passive energy","active energy","bioenergy","living energy"],"answer":"3","solution":"Bioenergy is one of many diverse resources available to help meet our demand for energy. It is a form of renewable energy that is derived from recently living organic materials known as biomass, which can be used to produce transportation fuels, heat, electricity, and products."},{"id":"75445","q":"Which alternative fuel can be produced through the process of electrolysis using renewable energy sources","options":["Biodiesel","Compressed natural gas","Ethanol","Hydrogen"],"answer":"4","solution":"Alternative fuels : also known as non-conventional and advanced fuels, are fuels derived from sources other than petroleum. Alternative fuels include gaseous fossil fuels like propane, natural gas, methane, and ammonia; biofuels like biodiesel, bio alcohol, and refuse-derived fuel; and other renewable fuels like hydrogen and electricity. These fuels are intended to substitute for more carbon intensive energy sources like gasoline and diesel in transportation and can help to contribute to decarbonization and reductions in pollution. Alternative fuel is also shown to reduce non-carbon emissions such as the release of nitric oxide and nitrogen dioxide, as well as sulfur dioxide and other harmful gases in the exhaust. This is especially important in industries such as mining, where toxic gases can accumulate more easily."},{"id":"75446","q":"Which of following is known as Fenton's reagent","options":["Hydrogen peroxide with an iron catalyst","Sodium Hypochlorite","Calcium Hypochlorite","UV with ozone"],"answer":"1","solution":"Fenton's reagent is a solution of hydrogen peroxide (H 2 O 2 ) and an iron catalyst (typically iron(II) sulphate, FeSO 4 ). It is used to oxidize contaminants or waste water as part of an advanced oxidation process. Fenton's reagent can be used to destroy organic compounds such as trichloroethylene and tetrachloroethylene (perchloroethylene) It was developed in the 1890s by Henry John Horst man Fenton as an analytical reagent."},{"id":"75447","q":"Which among the following is the green solvent?","options":["Ether","Acetone","Benzene","N-Alkylpyridinium salt"],"answer":"4","solution":"Green solvents:- are considered environmentally friendly alternatives to traditional solvents, often with properties like low toxicity, biodegradability, and renewability. N-Alkylpyridinium salts are a type of ionic liquid, which are generally recognized as green solvents due to their high polarity, good solvating power, and negligible volatility."},{"id":"75448","q":"Fick's law is related to:","options":["Mass transfer","Energy conservation","Heat transfer","Momentum"],"answer":"1","solution":"Fick's law of diffusion explains the diffusion process (movement of molecules from higher concentration to lower concentration region). In 1855, Adolf Fick described the Fick's Law of Diffusion. Fick's law describes the movement of a substance from a region of high concentration to a region of low concentration, which is a fundamental concept in mass transfer."},{"id":"75449","q":"Which of the following scattering phenomena is responsible for the blue colour of the sky?","options":["Non-selective scattering","Mie scattering","Diffraction","Rayleigh scattering"],"answer":"4","solution":"The blue colour of the sky is caused by the scattering of sunlight off the molecules of the atmosphere. This scattering, called Rayleigh scattering, is more effective at short wavelengths (the blue end of the visible spectrum)."},{"id":"75450","q":"Which of the following methods is generally NOT adopted for safe disposal of biomedical wastes?","options":["Incineration","Microwaving","Shredding after disinfection","Landfilling"],"answer":"4","solution":"Landfilling:- In this method refuse is dumped into low lying areas in layers of approximate depth of 1.5m. Each layer of refuse is termed as cell. Each layer is compacted properly and left for 7 days for its aerobic decomposition & it is covered with layer of mud to carry out further decomposition. Hospital waste has the ability to produce radiation, so it is harmful if it is used in landfilling. So the remaining processes like thermal treatment, incineration and electric pyrolysis is adopted for hospital waste. In these processes thermal breakdown of waste in the presence of excess of air occurs."},{"id":"75451","q":"High calorific value of solid waste is needed for:","options":["Composting","Anaerobic digestion","Landfilling","Incineration"],"answer":"4","solution":"Incineration:- This method involves the burning of solid wastes at high temperatures until the wastes are turned into ashes It is used when the calorific value of refuse is very high i.e. volume of refuse is reduced significantly."},{"id":"75452","q":"Which of the following wastes does not fall in Hazardous waste category","options":["Waste from Hospitals","Municipal solid waste","Sludge from industrial","Discarded computers and electronic"],"answer":"2","solution":"Hazardous substance can be defined as anything which because of its quantity concentration or characteristics may contributes to increased mortality, illness or hazard to human health and environment if not properly stored and transported or disposed off. Eg:- (1) Waste from foundries (2) Waste from hospitals (3) Waste from industries (cement, petroleum, chemical etc.) (4) Electronics wastes"},{"id":"75453","q":"Household wastes are governed by","options":["Hazardous Waste Rules, 1989","Municipal Solid Waste Rules, 2000","Biomedical Waste Rules, 1998","Water (P & C) Act, 1974"],"answer":"2","solution":"The Municipal Solid Waste Rules, 2000 specifically address the management and handling of household waste. These rules govern the collection, segregation, storage, transportation, processing, and disposal of municipal solid waste. Municipal solid waste encompasses commonly discarded items like household garbage, paper, plastics, food waste, and construction debris. \"door to door collection\" means collection of solid waste from the door step of households, shops, commercial establishments, offices, institutional or any other non-residential premises and includes collection of such waste from entry gate or a designated location on the ground floor in a housing society, multi storied building or apartments, large residential, commercial or institutional complex or premises."},{"id":"75454","q":"As per CPHEEO-2016, the minimum siting distance of land for sanitary landfill sites shall be ______ away from the centre line of a highway or railway line and water supply wells.","options":["100 m","500 m","1000 m","1500 m"],"answer":"2","solution":"According to CPHEEO-2016, the minimum siting distance for a sanitary landfill site from the center line of a highway, railway line, and water supply wells is 500 meters."},{"id":"75455","q":"The size dependent collection efficiency of particles is the following","options":["Grade efficiency","Overall collection efficiency","Murphree efficiency","Structure efficiency"],"answer":"1","solution":"Classification is the art of separating solid particles in a mixture of solids and fluid into fraction according to particle size or density by method other than screening. Most methods of separation are not 100% effective. There is usually a range of particle size that are separated with various degree of efficiency. The variation in the efficiency is referred to as the grade efficiency curve."},{"id":"75456","q":"Which of the following can be the most beneficial method of solid waste disposal?","options":["Landfilling","Disposing directly into rivers","Composting","Burning"],"answer":"3","solution":"Composting is the natural process of breaking down organic materials, such as food scraps, leaves, and yard waste, into nutrient-rich soil. This decomposition process is carried out by microorganisms like bacteria, fungi, and worms, which break down the organic matter into humus, a dark, crumbly substance that is excellent for improving soil quality. Composting is commonly done in controlled environments like compost bins or piles, where factors such as moisture, temperature, and aeration are managed to speed up decomposition. The end product, called compost, is used as a natural fertilizer to enrich soil, improve its structure, and promote healthy plant growth. Advantages of composting include: Reducing waste sent to landfills. Recycling nutrients back into the ecosystem. Reducing the need for chemical fertilizers. Improving soil health and moisture retention. Reducing greenhouse gas emissions from organic waste in landfills. Composting is an environmentally friendly and sustainable most beneficial way to manage organic waste while creating valuable resources for gardening and agriculture."},{"id":"75457","q":"A collection system in which people dump their household waste in the bins present on road sides is called:","options":["door to door collection system","open dump system","kerbside collection system","drop-off system"],"answer":"3","solution":"Kerbside collection system refers to the edge of the road, so this system involves placing waste bins on the curb for collection. Key points about other options: Door to door collection system:- In this system, waste collectors directly collect bins from individual homes. Open dump system:-- This is an unsanitary method where waste is dumped in open areas without proper management. Drop-off system:- This involves residents taking their waste to designated collection points."},{"id":"75458","q":"The liquid from a landfill containing contaminants which ultimately pollute ground water is called:","options":["filtrate","percolate","leachate","run off"],"answer":"3","solution":"As rainwater infiltrates through sanitary landfill waste, it becomes contaminated with dissolved and suspended matter originating from the decomposing waste."},{"id":"75459","q":"According to the Biomedical Waste Management (BMWM) Rules 2016, within how much time the anatomical waste, soiled waste and biotechnology waste if generated should be treated and disposed?","options":["36 hours","24 hours","72 hours","48 hours"],"answer":"4","solution":"According to the Biomedical Waste Management (BMWM) Rules, 2016, anatomical waste, soiled waste, and biotechnology waste must be treated and disposed of within 48 hours of their generation. This rule is in place to prevent contamination and protect public health and the environment."},{"id":"75460","q":"What is the minimum distance that is kept from a river for the construction of a hazardous waste landfill?","options":["100 m","300 m","200 m","400 m"],"answer":"1","solution":"As per the Solid Waste Management Rules, 2016 new rules, the landfill site shall be; 100 metres away from a river, 200 metres from a pond, 200 metres away from highways, habitations, public parks and water supply wells 20 km away from airports/airbase."},{"id":"75461","q":"As per the biomedical waste (Management and Handling Rules, 2016), the human and animal anatomical waste should be treated and disposed using which method?","options":["Autoclaving","Microwaving","Incineration/deep burial","Chemical treatment"],"answer":"3","solution":"Incineration has particularly strong benefits for the treatment of certain waste types in niche areas such as clinical wastes and certain hazardous wastes where pathogens and toxins can be destroyed by high temperatures. Examples include the waste of humans and animal tissues, organs, infected body parts."},{"id":"75462","q":"The most serious environmental effect posed by hazardous waste is","options":["Air pollution","Contamination of ground water","Destruction of habitats","Increased use of land for land fills"],"answer":"2","solution":"Hazardous waste is the waste that has serious threats to public health and Environment health. The most serious environmental effect posed by the hazardous waste is contamination of groundwater."},{"id":"75463","q":"Autoclaving is used for","options":["Municipal waste","Industrial Waste","Biomedical waste","Agriculture waste"],"answer":"3","solution":"Autoclaving is a sterilization method that uses high-pressure steam. The autoclaving process works by the concept that the boiling point of water (or steam) increases when it is under pressure. For medical waste that will be disposed off, autoclaves can be used as heat treatment processing units to destroy microorganisms before disposal in a traditional landfill or further treatment."},{"id":"75464","q":"For the application of recycled plastics in fence post, park benches, docks, etc. ________ is used.","options":["PE","Plastic lumber","PP","PS"],"answer":"2","solution":"Plastic lumber specifically denotes recycled plastic processed into lumber-like forms for construction of outdoor items. Products like fence posts, park benches, docks, and similar outdoor structures are commonly made from recycled plastic lumber (RPL). RPL is a durable, low-maintenance alternative to wood, produced by recycling plastics such as HDPE. It resists rot, moisture, insects, and weathering, making it ideal for outdoor applications like fencing, benches, and docks."},{"id":"75465","q":"The commonly used unit of absorbed radiation is defined as that dose of ionizing radiation that imparts 1 Joule of energy to 1 kg of absorbing material. This unit is known as","options":["Rem","Sievert","Rad","Gray (Gr)"],"answer":"3","solution":"Rationale: The Gray (Gr) is the unit of absorbed radiation dose in the International System of Units (SI). It measures the amount of radiation energy absorbed per unit mass of tissue, specifically joules per kilogram. One Gray is equivalent to the absorption of one joule of radiation energy by one kilogram of matter. The Gray is a critical unit in radiation protection, radiology, and radiotherapy, as it helps quantify the potential biological effects of different types of radiation."},{"id":"75466","q":"Peritoneal Mesothelioma is a rare form of cancer and is associated with:","options":["Asbestos","Randon gas","Pesticides","Lead"],"answer":"1","solution":"Peritoneal mesothelioma is a rare cancer most strongly associated with asbestos exposure. Asbestos fibres, when inhaled or ingested, can accumulate in the abdominal lining (peritoneum) and over time may lead to cancer development."},{"id":"75467","q":"Which metal couple, poisons the water:","options":["Silver - Gold","Brass - Nickel","Mercury - Lead","Copper - Tin"],"answer":"3","solution":"Metals:- Ca, Na, K, Fe, Mn, Zn are non-toxic metals. According to W.H.O., assumed limit of arsenic in drinking water is 0.01 ppm Arsenic, Barium, Cadmium, Chromium, Cyanide, Lead & Mercury are toxic metals. Elements acts as neurotoxin are Al, Mn, Hg, Pb & As."},{"id":"75468","q":"Which of the following can be considered as an \"End of Pipeline\" treatment process?","options":["Green Chemistry approach to reduce pollution","Catalytic converters in automobiles to reduce emissions","Soil excavation to remove historical contamination","Usage of personal respiratory protection masks"],"answer":"2","solution":"End of pipe technology- There are the methods/processes to remove already formed contaminants from a stream of air, water, water or in any other similar surrounding. As these technology are implemented at the last stage hence these are named as end of pipe technology."},{"id":"75469","q":"Process by which mined land is returned to its original state or better is known as","options":["Refurbishing","Regeneration","Revolution","Reclamation"],"answer":"4","solution":"Land reclamation is the process of creating new land from the sea by filling submerged areas with materials like rock, cement, clay, and soil."},{"id":"75470","q":"The process of land degradation in arid, semi-arid and sub-humid areas due to various factor including climatic variations and human activities is called as","options":["Land degradation","Soil erosion","Desertification","Landslide"],"answer":"3","solution":"Desertification is the process of degradation by which a fertile land undergoes changes by which it changes into a desert by losing its biodiversity, water bodies, vegetation and wildlife. As per United Nations convention for combating desertification desertification is defined as Land Degradation in arid semi-arid and dry sub humid areas resulting from various factors including climate variations and human activities. Here \"land\" refers to the terrestrial bio productive system and \"land degradation\" refers to production or laws of biological or economic productivity and complexity of rainfed, cropland, irrigated cropland or pasture forest resulting from land uses are from a process or combination of processes."},{"id":"75471","q":"Thermal stratification leads to:","options":["Algal bloom","Layered temperature zones","Increased turbidity","High DO"],"answer":"2","solution":"Thermal stratification refers to the formation of distinct layers in a water body with different temperatures, essentially creating a vertical temperature gradient."},{"id":"75472","q":"Which human activity is a major contributor to deforestation?","options":["Fishing","Urbanization","Wind farming","Solar panel installation"],"answer":"2","solution":"Urbanization involves clearing forests to make way for housing, infrastructure, and industries, leading to significant loss of forest cover. While agriculture is the largest driver globally, urbanization plays a major role by expanding cities and infrastructure. Fishing, wind farming, and solar panel installation have comparatively minimal direct impacts on deforestation"},{"id":"75473","q":"How the water-flow rate is useful in conventional models?","options":["For predicting velocity","To estimate the amount of contaminant that will be transported along with solids","To estimate the amount of pollutant which was carried along with the water","To find Reynolds number"],"answer":"3","solution":"In conventional water quality models, the water-flow rate (discharge) plays a critical role in determining how much pollutant is transported by the flowing water. Flow rate (Q) \u00d7 pollutant concentration (C) = Pollutant loading."},{"id":"75474","q":"Two primary air pollutants are","options":["Ozone and Peroxyacetyl nitrate","Sulphur dioxide and hydrocarbon","Nitrogen oxide and Peroxyacetyl nitrate","Ozone and Oxides of Oxygen"],"answer":"2","solution":"Primary pollutant:- Pollutants which are emitted directly from the identifiable sources, either from the natural hazardous events like dust storms, volcanoes, etc or from human activities like burning of wood, coal, oil in homes or industries or automobiles, etc. EXAMPLE - 1. Oxides of sulphur, particularly the sulphur dioxide (SO 2 ); 2. Oxides of carbon like carbon monoxide (CO) and carbon dioxide (CO 2 ), particularly the carbon monoxide (CO); 3. Oxides of nitrogen, like NO, NO 2 , NO 3 (expressed as NOx); 4. Volatile organic compounds, mostly hydrocarbons; and 5. Suspended particulate matter (SPM)."},{"id":"75475","q":"Green muffler is related to pollution of __________","options":["Soil","Noise","Water","Air"],"answer":"2","solution":"A green muffler is a measure adopted to control noise pollution by planting green plants. Generally, 4-5 rows of plants are grown near noisy places like roadsides and industrial areas to prevent the noise from reaching the citizens. A muffler is an acoustic soundproofing device designed to reduce the intensity of sound pressure created by an engine through acoustic quiet. Green mufflers are woody plants that are grown near noisy places to reduce the effects of noise."},{"id":"75476","q":"Which of the following units is used to measure noise pollution ?","options":["Candela","Kelvin","Decibel","Ampere"],"answer":"3","solution":"Decibel:- Sound intensity (also referred to as sound power or sound pressure) in units called decibels. Decibels (dB) are named in honour of Alexander Graham Bell, the inventor of both the telephone and the audiometer. An audiometer is a device that measures how well a person can hear certain sounds. A modern version of it is still used today to diagnose hearing loss. Decibels are different from other familiar scales of measurement. While many standard measuring devices, such as rulers, are linear, the decibel scale is logarithmic. This kind of scale better represents how changes in sound intensity actually feel to our ears."},{"id":"75477","q":"The primary air pollutant which is formed due to incomplete combustion of organic matter is ____","options":["Methane","Carbon monoxide","Ozone","Sulphur dioxide"],"answer":"2","solution":"Carbon monoxide (CO) is formed when organic matter burns incompletely, meaning it doesn't have enough oxygen to fully combust, resulting in this toxic gas being released into the atmosphere."},{"id":"75478","q":"The composition of biogas is an follows","options":["Methane, Carbon dioxide, H 2 S, and N 2","Methane, Carbon dioxide, H 2 O, and SO 2","Methane, Carbon monoxide, and SO 2","Methane, Carbon monoxide, SO 2 and hydrocarbons"],"answer":"1","solution":"The chemical composition of biogas is follow is Methane (CH 4 ) \u21d2 50-85%, CO 2 \u21d2 20-35%, H 2 S and N 2 Biogas is usually made up of around 50-85% methane and carbon dioxide (CO 2 ) is 20-35%."}];
let idx=0, answers={}, timerSec=65*60, timerInt=null;

function render(){
  const q=DATA[idx];
  if(!q){document.getElementById('qText').textContent='No data.';return;}
  document.getElementById('qNum').textContent=idx+1;
  document.getElementById('qTotal').textContent=DATA.length;
  document.getElementById('qText').textContent=q.q;
  document.getElementById('opts').innerHTML=q.options.map((o,i)=>
    `<div class="option ${answers[idx]==(i+1)?'selected':''}" onclick="select(${i+1})">${String.fromCharCode(65+i)}. ${o}</div>`
  ).join('');
}
window.select=o=>{answers[idx]=o; render();};
window.prev=()=>{if(idx>0){idx--; render();}};
window.next=()=>{if(idx<DATA.length-1){idx++; render();}};

function submitTest(){
  clearInterval(timerInt);
  let c=0; for(let i=0;i<DATA.length;i++){if(answers[i]==DATA[i].answer)c++;}
  const pct=Math.round(c/DATA.length*100)||0;
  document.getElementById('qCard').classList.add('hidden');
  document.getElementById('resCard').classList.remove('hidden');
  document.getElementById('score').textContent=pct+'%';
  document.getElementById('detail').innerHTML='<b>'+c+'/'+DATA.length+'</b> correct';
}

function tick(){timerSec--; document.getElementById('timer').textContent=Math.floor(timerSec/60)+':'+String(timerSec%60).padStart(2,'0'); document.getElementById('bar').style.width=(timerSec/(65*60)*100)+'%'; if(timerSec<=0){clearInterval(timerInt); submitTest();}}

render(); timerInt=setInterval(tick,1000);
</script>
</body></html>
