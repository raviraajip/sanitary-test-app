const DATA=[{"id":"84657","q":"Which of the following best describes the concept of \"waste to wealth\"?","options":["Burning waste to generate electricity","Selling waste to other countries","Converting waste materials into valuable resources through recycling, composting, and energy recovery","Storing waste in secure landfills"],"answer":"3"},{"id":"84658","q":"The \"polluter pays principle\" in environmental law means:","options":["The party responsible for pollution bears the cost of managing it to prevent harm to human health and the environment","The government pays for pollution cleanup","Only industries pay for pollution","Individuals are exempt from pollution costs"],"answer":"1"},{"id":"84659","q":"What is the primary purpose of a \"waste characterization study\"?","options":["To determine the total weight of waste generated","To calculate collection costs","To identify the physical and chemical composition of the waste stream for planning treatment facilities","To measure the volume of waste trucks"],"answer":"3"},{"id":"84660","q":"Which of the following is a key factor in determining the \"self-sustainability\" of an incineration process?","options":["The ash content of the waste","The moisture content and calorific value of the waste","The color of the waste","The volume of the waste"],"answer":"2"},{"id":"84661","q":"In a septic tank system, what is the primary function of the \"baffle\" at the inlet and outlet?","options":["To filter the wastewater","To aerate the wastewater","To prevent scum and solids from leaving the tank with the effluent","To add chemicals for treatment"],"answer":"3"},{"id":"84662","q":"Which of the following is a major challenge for composting in urban areas?","options":["Availability of organic waste","Odor control and space constraints","Lack of microorganisms","Excessive sunlight"],"answer":"2"},{"id":"84663","q":"What is the primary environmental concern associated with the land application of sewage sludge (biosolids)?","options":["Potential contamination with heavy metals, pathogens, and emerging contaminants","It is too expensive","It reduces soil fertility","It increases the pH of the soil"],"answer":"1"},{"id":"84664","q":"The term \"co-processing\" in waste management refers to:-","options":["Treating waste and wastewater together","Using waste as a raw material and energy source in industrial processes, such as cement kilns","Landfilling hazardous and non-hazardous waste together","Recycling two types of materials together"],"answer":"4"},{"id":"84665","q":"Which of the following is a key property of \"biochar\" produced from pyrolysis?","options":["It is a liquid fuel","It is a stable form of carbon that can sequester carbon in soil and improve soil fertility","It is a potent greenhouse gas","It is a hazardous waste"],"answer":"2"},{"id":"84666","q":"A city is experiencing a high rate of illegal dumping. Which of the following is the most effective long-term solution?","options":["Increasing fines and enforcement only","Installing surveillance cameras at all known sites","A combination of enforcement, community engagement, and providing convenient, accessible, and affordable waste disposal options","Closing all public disposal sites"],"answer":"3"},{"id":"84667","q":"What is the primary purpose of \"denitrification\" in advanced wastewater treatment?","options":["To remove ammonia from wastewater","To convert nitrate (NO3-) to nitrogen gas (N2), removing it from the water","To add nitrogen to the water as a nutrient","To kill pathogenic bacteria"],"answer":"2"},{"id":"84668","q":"Which of the following is a \"physical\" method of treating hazardous waste?","options":["Chemical oxidation","Incineration","Evaporation","Neutralization"],"answer":"3"},{"id":"84669","q":"A \"leachate recirculation\" system in a bioreactor landfill is designed to:","options":["Reduce the volume of leachate to be treated","Increase the moisture content of the waste to accelerate decomposition","Prevent groundwater contamination","Collect landfill gas more efficiently"],"answer":"2"},{"id":"84670","q":"Which of the following is a key disadvantage of using \"open dumps\" for waste disposal?","options":["They are too expensive to operate","They generate too much methane","They require highly skilled labor","They do not have environmental controls, leading to air and water pollution, and public health risks"],"answer":"4"},{"id":"84671","q":"In the context of wastewater treatment, what does \"BOD\" measure?","options":["The amount of oxygen consumed by microorganisms to decompose organic matter","The amount of bacteria in the water","The chemical content of the water","The temperature of the water"],"answer":"1"},{"id":"84672","q":"Which of the following is an example of \"source reduction\"?","options":["Using a reusable coffee mug instead of a disposable cup","Recycling a plastic bottle","Composting food scraps","Burning waste for energy"],"answer":"1"},{"id":"84673","q":"A \"trickling filter\" is classified as what type of biological treatment system?","options":["Aerobic attached growth","Anaerobic suspended growth","Aerobic suspended growth","Anaerobic attached growth"],"answer":"1"},{"id":"84674","q":"Which of the following is the most common method for treating municipal solid waste in India?","options":["Incineration","Sanitary landfilling","Open dumping","Pyrolysis"],"answer":"3"},{"id":"84675","q":"What is the primary purpose of a \"buffer zone\" around a landfill?","options":["To provide space for future expansion","To serve as a parking area for waste trucks","To store leachate","To protect nearby communities from potential nuisances like odor, dust, and litter"],"answer":"4"},{"id":"84676","q":"The \"UASB\" reactor is particularly suitable for treating:","options":["High-strength industrial wastewater with low suspended solids","Low-strength domestic sewage only","Solid waste","Gaseous emissions"],"answer":"1"},{"id":"84677","q":"Which of the following is a key parameter for assessing the \"stability\" of a landfill?","options":["The rate of settlement and gas generation","The temperature of the waste","The color of the leachate","The type of cover material"],"answer":"1"},{"id":"84678","q":"What is the primary function of a \"scum collector\" in a primary clarifier?","options":["To remove settled solids","To aerate the wastewater","To remove floating materials like grease, oil, and other light solids","To add chemicals for coagulation"],"answer":"3"},{"id":"84679","q":"Which of the following is a \"characteristic\" of hazardous waste?","options":["It exhibits ignitability, corrosivity, reactivity, or toxicity","It is generated in large quantities","It is always a liquid","It is produced only by large industries"],"answer":"1"},{"id":"84680","q":"In a landfill, the \"daily cover\" is typically applied:","options":["Once a year","Only during the rainy season","Only when the landfill is closed","At the end of each working day"],"answer":"4"},{"id":"84681","q":"A \"package sewage treatment plant\" is most suitable for:","options":["A large metropolitan city","An industrial facility with complex wastewater","A small community, housing complex, or resort with no access to a centralized sewer system","A large-scale agricultural operation"],"answer":"3"},{"id":"84682","q":"Which of the following is a major limitation of \"land application\" of untreated wastewater?","options":["It is too expensive","It requires highly skilled labor","It can lead to soil contamination with pathogens, salts, and heavy metals, and groundwater pollution","It is a very slow process"],"answer":"3"},{"id":"84683","q":"The \"pyrolysis\" of biomass produces all of the following EXCEPT:","options":["Bio-oil","Syngas","Biochar","Compost"],"answer":"4"},{"id":"84684","q":"A \"dry composting toilet\" is an example of:","options":["An on-site sanitation system that converts human waste into a usable soil amendment without water","A centralized wastewater treatment system","An incineration system","A landfill disposal method"],"answer":"1"},{"id":"84685","q":"What is the primary purpose of \"equalization\" in a wastewater treatment plant?","options":["To remove grit","To add oxygen to the wastewater","To disinfect the effluent","To dampen variations in flow rate and pollutant concentration"],"answer":"4"},{"id":"84686","q":"Which of the following is a key element of a \"circular economy\"?","options":["A linear \"take-make-dispose\" model","Increasing the use of virgin raw materials","Focusing solely on recycling","Designing out waste and pollution, keeping products and materials in use, and regenerating natural systems"],"answer":"4"},{"id":"84687","q":"A \"fluidized bed\" incinerator is advantageous because it:","options":["Operates at lower temperatures","Provides excellent mixing and heat transfer, allowing for efficient combustion of a variety of wastes","Does not require any pollution control","Is very small in size"],"answer":"2"},{"id":"84688","q":"Which of the following is a key consideration for the \"siting\" of a new landfill?","options":["Geology with low-permeability soils and a deep water table to protect groundwater","Proximity to a major highway for easy access","Location in a densely populated area to reduce transport costs","Ownership by a private company"],"answer":"1"},{"id":"84689","q":"In an \"activated sludge\" system, the \"food-to-microorganism\" (F/M) ratio is used to:","options":["Control the aeration rate","Measure the effluent BOD","Determine the pH","Control the biological activity and sludge age"],"answer":"4"},{"id":"84690","q":"Which of the following is a major source of \"e-waste\"?","options":["Kitchen appliances","Construction debris","Discarded computers, mobile phones, and televisions","Garden waste"],"answer":"3"},{"id":"84691","q":"What is the primary purpose of a \"leachate treatment plant\" at a landfill?","options":["To treat the contaminated liquid collected from the landfill before it is discharged","To generate electricity","To add water to the waste","To collect landfill gas"],"answer":"1"},{"id":"84692","q":"Which of the following is a key characteristic of \"compostable plastics\"?","options":["They are made from petrochemicals","They undergo biological degradation during composting, breaking down into CO2, water, and biomass","They are non-biodegradable","They are thicker than 50 microns"],"answer":"2"},{"id":"84693","q":"A \"bioswale\" is a green infrastructure practice used to:","options":["Treat sewage","Incinerate waste","Manage stormwater runoff by slowing it down and allowing it to infiltrate and filter through vegetation","Compost yard waste"],"answer":"3"},{"id":"84694","q":"Which of the following is a key advantage of \"anaerobic digestion\" over aerobic composting?","options":["It produces a biogas that can be used for energy recovery","It is a faster process","It requires less capital investment","It produces no odor"],"answer":"1"},{"id":"84695","q":"What is the primary function of \"coagulation\" in water treatment?","options":["To kill pathogens","To filter out large solids","To remove dissolved gases","To neutralize the electrical charges of suspended particles so they can agglomerate"],"answer":"4"},{"id":"84696","q":"Which of the following is a key limitation of \"incineration\"?","options":["It does not reduce waste volume","It requires significant land area","It requires skilled operation and can produce air pollutants that must be controlled","It is only suitable for organic waste"],"answer":"3"},{"id":"84697","q":"In the context of solid waste, \"compaction\" is primarily used to:","options":["Increase the volume of waste","Decrease the density of waste","Increase the density and reduce the volume of waste for transport and disposal","Separate recyclable materials"],"answer":"3"},{"id":"84698","q":"A \"constructed wetland\" is an example of:","options":["A high-tech industrial treatment system","A natural or engineered system that uses wetland plants and soil to treat wastewater","A type of landfill","An incinerator"],"answer":"2"},{"id":"84699","q":"Which of the following is a key responsibility of a \"waste generator\" under the SWM Rules?","options":["To operate a landfill","To issue authorizations","To build a waste-to-energy plant","To segregate waste at source into wet, dry, and hazardous categories"],"answer":"4"},{"id":"84700","q":"What is the primary purpose of a \"sludge drying bed\"?","options":["To anaerobically digest sludge","To incinerate sludge","To chemically stabilize sludge","To dewater sludge by a combination of drainage and evaporation"],"answer":"4"},{"id":"84701","q":"Which of the following is a key advantage of \"gasification\" over \"incineration\"?","options":["The syngas produced can be used in gas engines or turbines, which are more efficient than steam turbines for power generation","Gasification produces no emissions","Gasification is a simpler technology","Gasification does not require any pre-treatment of waste"],"answer":"1"},{"id":"84702","q":"A \"rain garden\" is a green infrastructure practice designed to:","options":["Collect rainwater for drinking","Treat sewage","Capture and infiltrate stormwater runoff from roofs, driveways, and other impervious surfaces","Generate electricity"],"answer":"3"},{"id":"84703","q":"Which of the following is a key parameter for assessing the \"biodegradability\" of a waste?","options":["Its color","Its density","Its lignin content","Its moisture content"],"answer":"3"},{"id":"84704","q":"What is the primary purpose of \"chemical precipitation\" in wastewater treatment?","options":["To remove dissolved heavy metals by converting them into an insoluble solid","To kill pathogens","To remove large solids","To equalize the flow"],"answer":"1"},{"id":"84705","q":"Which of the following is a key disadvantage of \"landfills\"?","options":["They are a permanent solution","They require long-term management and monitoring after closure and can generate methane and leachate for decades","They are the cheapest option in the long run","They do not require any land"],"answer":"2"},{"id":"84706","q":"A \"magnetic separator\" in a material recovery facility (MRF) is used to remove:","options":["Paper","Plastics","Ferrous metals (like iron and steel)","Glass"],"answer":"3"},{"id":"84707","q":"Which of the following is a key feature of a \"sanitary landfill\"?","options":["Open burning of waste","Uncontrolled scavenging","Engineered design with a liner and leachate collection system","No cover material is used"],"answer":"3"},{"id":"84708","q":"In a \"trickling filter,\" the media provides:","options":["A source of carbon for the microorganisms","A surface for the biofilm to attach and grow","Oxygen for the process","Nutrients for the bacteria"],"answer":"2"},{"id":"84709","q":"Which of the following is a key advantage of \"composting\"?","options":["It produces a valuable soil amendment that improves soil structure and fertility","It generates electricity","It is a very fast process","It requires no maintenance"],"answer":"1"},{"id":"84710","q":"A \"waste-to-energy\" incinerator is typically classified as:","options":["A renewable energy source","A non-renewable energy source","A fossil fuel plant","A nuclear power plant"],"answer":"1"},{"id":"84711","q":"Which of the following is a key factor in the \"spread of diseases\" from unmanaged waste?","options":["The presence of inert materials like glass","The breeding of vectors like flies and rodents that can carry pathogens","The generation of methane","The aesthetic impact of litter"],"answer":"2"},{"id":"84712","q":"What is the primary purpose of a \"dewatering\" unit in sludge management?","options":["To increase the volume of sludge","To reduce the water content and volume of sludge for easier and cheaper disposal","To disinfect the sludge","To stabilize the sludge"],"answer":"2"},{"id":"84713","q":"Which of the following is a key component of a \"circular economy\" for plastics?","options":["Using virgin plastics for all products","Designing plastic products for recyclability and using recycled content","Landfilling all plastic waste","Incinerating all plastic waste"],"answer":"2"},{"id":"84714","q":"A \"septic tank\" is a form of:","options":["Centralized wastewater treatment","Solid waste disposal","Industrial wastewater treatment","Decentralized or on-site wastewater treatment"],"answer":"4"},{"id":"84715","q":"Which of the following is a key advantage of \"aerobic\" over \"anaerobic\" treatment?","options":["It produces methane gas","It produces less biomass","It requires no energy input","It has a faster reaction rate and produces less odor"],"answer":"4"},{"id":"84716","q":"What is the primary purpose of \"environmental impact assessment\" (EIA) for a waste management project?","options":["To approve the project without conditions","To identify, predict, and evaluate the potential environmental and social impacts of the project before it is implemented","To calculate the project's budget","To design the project's infrastructure"],"answer":"2"},{"id":"84717","q":"Which of the following is a key challenge in managing \"construction and demolition (C&D) waste\"?","options":["Its bulky nature makes transportation and disposal costly","It is non-biodegradable","It is highly toxic","It generates odors"],"answer":"1"},{"id":"84718","q":"In the context of \"hazardous waste,\" what does \"cradle-to-grave\" responsibility mean?","options":["The waste generator is responsible for the waste from its creation to its final disposal","The government is responsible for all waste","The transporter is responsible for the waste","The waste is buried in a grave-like structure"],"answer":"1"},{"id":"84719","q":"Which of the following is a key advantage of \"membrane bioreactors\" (MBRs)?","options":["They produce a high-quality effluent with very low suspended solids in a smaller footprint","They are very cheap to operate","They do not require aeration","They are only suitable for small flows"],"answer":"1"},{"id":"84720","q":"Which of the following is a major source of \"air pollution\" from a landfill?","options":["Leachate generation","Methane and other gases produced from the decomposition of organic matter","Heavy metals in the waste","Visual impact"],"answer":"2"},{"id":"84721","q":"A \"container deposit scheme\" is an example of:","options":["A subsidy for manufacturers","A ban on plastic bottles","A tax on beverages","An economic incentive to encourage recycling and reduce litter"],"answer":"4"},{"id":"84722","q":"Which of the following is a key parameter for assessing the \"quality\" of compost?","options":["Its color","Its volume","Its moisture content, heavy metal content, and pathogen levels","Its temperature"],"answer":"3"},{"id":"84723","q":"What is the primary function of a \"grit chamber\" in a wastewater treatment plant?","options":["To remove heavy inorganic solids like sand, gravel, and silt","To remove organic solids","To equalize the flow","To add chemicals for treatment"],"answer":"1"},{"id":"84724","q":"Which of the following is a key advantage of \"anaerobic digestion\" over \"composting\"?","options":["It is an aerobic process","It requires less capital investment","It produces a renewable energy source (biogas) in addition to a soil conditioner","It is faster"],"answer":"3"},{"id":"84725","q":"A \"waste picker\" plays what role in the waste management system?","options":["They are a part of the informal sector, recovering recyclable materials from the waste stream","They are government employees","They operate incinerators","They design landfills"],"answer":"1"},{"id":"84726","q":"Which of the following is a key consideration for \"emergency response\" in hazardous waste management?","options":["The color of the waste","The location of the nearest landfill","The chemical properties of the waste and the potential for fire, explosion, or toxic release","The type of collection vehicle used"],"answer":"3"},{"id":"84727","q":"What is the primary purpose of \"flocculation\" in water treatment?","options":["To neutralize the charge of particles","To gently mix the water to encourage the agglomeration of destabilized particles into larger, settleable flocs","To kill pathogens","To remove large solids"],"answer":"2"},{"id":"84728","q":"Which of the following is a key advantage of \"low-flush toilets\"?","options":["They reduce water consumption and the volume of wastewater generated","They increase water consumption","They are more expensive to install","They require a larger sewer line"],"answer":"1"},{"id":"84729","q":"In a \"landfill,\" what is the purpose of the \"final cover\"?","options":["To provide a working platform","To compact the waste","To collect leachate","To minimize water infiltration and promote vegetative growth after the landfill is closed"],"answer":"4"},{"id":"84730","q":"Which of the following is a key parameter for assessing the \"strength\" of a wastewater?","options":["Biochemical Oxygen Demand (BOD) and Chemical Oxygen Demand (COD)","pH","Temperature","Color"],"answer":"1"},{"id":"84731","q":"A \"waste characterization study\" would typically involve:","options":["Measuring the temperature of the waste","Calculating the cost of collection","Physically sorting and weighing the different components of a waste sample","Determining the population of the city"],"answer":"3"},{"id":"84732","q":"Which of the following is a key advantage of \"greywater reuse\"?","options":["It reduces the demand for fresh water and the volume of wastewater","It is always potable","It requires no treatment","It is a new technology"],"answer":"1"},{"id":"84733","q":"What is the primary purpose of a \"sludge digester\"?","options":["To dewater sludge","To stabilize sludge and reduce its volume through biological decomposition","To incinerate sludge","To store sludge"],"answer":"2"},{"id":"84734","q":"Which of the following is a key advantage of \"in-vessel composting\"?","options":["It requires a large land area","It requires no aeration","It is the cheapest composting method","It provides better control of process parameters (temperature, moisture, aeration) and odor"],"answer":"4"},{"id":"84735","q":"A \"waste minimization\" strategy aims to:","options":["Reduce the amount and toxicity of waste generated at the source","Increase the amount of waste generated","Increase the amount of waste sent to landfills","Burn more waste"],"answer":"1"},{"id":"84736","q":"Which of the following is a key factor in the \"sustainability\" of a recycling program?","options":["The color of the recycling bins","The location of the city hall","The number of trucks in the fleet","The existence of stable markets for the recovered materials"],"answer":"4"},{"id":"84737","q":"In an \"activated sludge\" system, the \"secondary clarifier\" is used to:","options":["Separate the treated water from the microbial biomass (sludge)","Provide aeration","Remove grit","Equalize the flow"],"answer":"1"},{"id":"84738","q":"Which of the following is a key advantage of \"pyrolysis\" over \"incineration\"?","options":["Pyrolysis is a simpler technology","Pyrolysis can produce valuable products (oil, gas, char) that can be stored and used in different applications","Pyrolysis produces no emissions","Pyrolysis requires no pre-treatment"],"answer":"2"},{"id":"84739","q":"A \"municipal solid waste\" landfill is designed to receive:","options":["Only hazardous waste","Only biomedical waste","Household, commercial, and non-hazardous industrial waste","Only construction and demolition waste"],"answer":"3"},{"id":"84740","q":"What is the primary purpose of \"disinfection\" in a wastewater treatment plant?","options":["To remove suspended solids","To remove nutrients","To reduce the organic load","To kill or inactivate pathogenic microorganisms"],"answer":"4"},{"id":"84741","q":"Which of the following is a key advantage of \"windrow composting\"?","options":["It is a low-tech, relatively low-cost method suitable for processing large volumes of yard waste","It requires a small land area","It has excellent odor control","It is a very fast process"],"answer":"1"},{"id":"84742","q":"A \"secure landfill\" for hazardous waste differs from a sanitary landfill primarily in that it:","options":["Is smaller","Has more stringent design standards, including double liners and leachate detection systems","Is located in a remote area","Accepts only liquid waste"],"answer":"2"},{"id":"84743","q":"Which of the following is a key factor in the \"efficiency\" of a composting process?","options":["The carbon-to-nitrogen (C:N) ratio, moisture content, and aeration","The color of the compost pile","The size of the composting facility","The type of collection truck"],"answer":"1"},{"id":"84744","q":"In a \"trickling filter,\" the \"distributor arm\" is responsible for:","options":["Removing solids","Evenly distributing the wastewater over the surface of the filter media","Adding air to the system","Collecting the treated effluent"],"answer":"2"},{"id":"84745","q":"Which of the following is a key advantage of \"waste-to-energy\" (WtE) over landfilling?","options":["WtE requires less capital investment","WtE is a simpler technology","WtE produces no air emissions","WtE significantly reduces the volume of waste and recovers energy, while landfilling occupies land and generates methane"],"answer":"4"},{"id":"84746","q":"What is the primary purpose of \"stabilization\" in hazardous waste treatment?","options":["To increase the volume of waste","To convert hazardous constituents into a less mobile or less toxic form","To separate the waste into its components","To burn the waste"],"answer":"2"},{"id":"84747","q":"A \"curbside collection\" program is most effective when:","options":["Residents are educated and participate in separating recyclables or organics from trash","Residents are not required eachate recirculation\" in a bioreactor landfill?","options":["It reduces the volume of leachate to be treated","It accelerates waste decomposition and gas generation","It prevents gas migration","It reduces the need for a final cover"],"answer":"2"},{"id":"84755","q":"What is the primary function of a \"bar screen\" in a wastewater treatment plant?","options":["To remove sand and grit","To remove large, coarse solids like rags, sticks, and plastics","To equalize the flow","To provide aeration"],"answer":"2"},{"id":"84756","q":"Which of the following is a key disadvantage of \"incineration\"?","options":["It does not reduce waste volume","It requires a large land area","It can produce air pollutants like dioxins, furans, and heavy metals that require costly control systems","It is a low-cost technology"],"answer":"3"},{"id":"84757","q":"A \"sludge thickener\" is used to:","options":["Increase the water content of sludge","Increase the solids content of sludge by removing some of the water","Disinfect the sludge","Digest the sludge"],"answer":"2"},{"id":"84758","q":"Which of the following is a key principle of \"integrated solid waste management\" (ISWM)?","options":["Relying solely on landfills","Using a combination of waste management techniques (source reduction, recycling, composting, WtE, landfilling) to handle waste sustainably","Using only incineration","Using only composting"],"answer":"2"},{"id":"84759","q":"A \"waste hierarchy\" prioritizes which option as the most preferred?","options":["Disposal in a landfill","Energy recovery (incineration)","Waste prevention and minimization","Recycling"],"answer":"3"},{"id":"84760","q":"Which of the following is a key advantage of \"co-composting\" (composting sewage sludge with municipal solid waste)?","options":["It is a very slow process","It can improve the nutrient content and physical structure of the compost","It requires no aeration","It produces no odors"],"answer":"2"},{"id":"84761","q":"In a \"landfill,\" what is the \"active working face\"?","options":["The area that has been permanently closed","The area where waste is currently being deposited, spread, and compacted","The area where leachate is collected","The area where gas wells are located"],"answer":"2"},{"id":"84762","q":"Which of the following is a key factor in the \"biodegradability\" of a waste in a landfill?","options":["The presence of oxygen","The presence of heavy metals","The moisture content, temperature, and the nature of the organic matter","The color of the waste"],"answer":"3"},{"id":"84763","q":"A \"pyrolysis\" plant is particularly well-suited for processing:","options":["Wet, putrescible waste","High-moisture organic waste","Tires, plastics, and other materials that produce valuable products under high temperatures in an oxygen-free environment","Mixed MSW with high inert content"],"answer":"3"},{"id":"84764","q":"Which of the following is a key advantage of \"constructed wetlands\" for wastewater treatment?","options":["They have a very small footprint","They are a low-cost, low-energy, and aesthetically pleasing treatment option","They require highly skilled operators","They are effective at removing heavy metals only"],"answer":"2"},{"id":"84765","q":"What is the primary purpose of \"compaction\" in a landfill?","options":["To increase the void space","To increase the density of the waste, extending the landfill's life","To separate recyclable materials","To add moisture to the waste"],"answer":"2"},{"id":"84766","q":"Which of the following is a key parameter for assessing the \"treatability\" of a hazardous waste by incineration?","options":["Its color","Its volume","Its heating value and ash fusion temperature","Its source"],"answer":"3"},{"id":"84767","q":"A \"biodigester\" is a system that:","options":["Composts waste aerobically","Uses anaerobic digestion to treat organic waste and produce biogas","Incinerates waste","Landfills waste"],"answer":"2"},{"id":"84768","q":"Which of the following is a key advantage of \"greywater reuse\" for landscape irrigation?","options":["Greywater contains high levels of pathogens","It requires no treatment","It reduces the demand for potable water and provides nutrients for plants","It is a complex, expensive technology"],"answer":"3"},{"id":"84769","q":"In a \"waste-to-energy\" incinerator, the \"heat recovery steam generator\" (HRSG) is used to:","options":["Cool the flue gas","Capture the heat from combustion to generate steam for power generation","Remove pollutants from the flue gas","Feed the waste into the furnace"],"answer":"2"},{"id":"84770","q":"Which of the following is a key challenge in the \"recycling of glass\"?","options":["Different colors of glass must be separated to produce high-quality cullet","Glass is not recyclable","Glass is too heavy to transport","Glass is a hazardous material"],"answer":"1"},{"id":"84771","q":"A \"landfill gas collection well\" is designed to:","options":["Collect leachate","Inject air into the landfill","Extract gas from the waste mass under vacuum","Monitor groundwater"],"answer":"3"},{"id":"84772","q":"Which of the following is a key advantage of \"source-separated organic waste\" collection?","options":["It is more complex for residents","It produces a higher quality, less contaminated feedstock for composting or anaerobic digestion","It requires no additional infrastructure","It is only suitable for yard waste"],"answer":"2"},{"id":"84773","q":"What is the primary purpose of \"chemical oxidation\" in wastewater treatment?","options":["To break down organic pollutants using strong oxidizing agents","To remove suspended solids","To equalize the flow","To remove grit"],"answer":"1"},{"id":"84774","q":"A \"stormwater management\" system is designed to:","options":["Treat sewage","Collect drinking water","Manage runoff from rainfall events to prevent flooding and pollution","Generate electricity"],"answer":"3"},{"id":"84775","q":"Which of the following is a key advantage of \"geotextiles\" in landfill construction?","options":["They are used as a fuel","They can act as filters, separators, or reinforcement layers in the liner and drainage systems","They are biodegradable","They are a type of waste"],"answer":"2"},{"id":"84776","q":"A \"leachate pond\" is used to:","options":["Collect landfill gas","Store and sometimes treat leachate before it is sent for final treatment or disposal","Compost organic waste","Store daily cover soil"],"answer":"2"},{"id":"84777","q":"Which of the following is a key factor in the \"public acceptance\" of a new waste management facility?","options":["The color of the building","Effective community engagement, transparency, and demonstration of environmental safeguards","The size of the facility","The brand of equipment used"],"answer":"2"},{"id":"84778","q":"In a \"waste-to-energy\" incinerator, what is the \"bottom ash\"?","options":["The fine particles captured from the flue gas","The solid residue that remains on the grate after combustion","The gas produced during combustion","The water used for cooling"],"answer":"2"},{"id":"84779","q":"Which of the following is a key advantage of \"co-processing\" waste in a cement kiln?","options":["It requires no pollution control","It completely destroys the waste and uses the mineral content as a raw material substitute, with no residual ash","It is a low-temperature process","It is only suitable for liquid waste"],"answer":"2"},{"id":"84780","q":"A \"floating cover\" on a leachate pond is used to:","options":["Reduce odor emissions, prevent algal growth, and minimize evaporation","Prevent birds from landing on the pond","Add chemicals to the leachate","Aerate the leachate"],"answer":"1"},{"id":"84781","q":"Which of the following is a key principle of \"sustainable waste management\"?","options":["Focusing only on disposal","Ignoring community concerns","Using the cheapest disposal option","Considering the environmental, economic, and social impacts of waste management decisions"],"answer":"4"}];
let idx=0, answers={}, timerSec=7500, timerInt=null;

function render(){
  const q=DATA[idx];
  if(!q){document.getElementById('qText').textContent='No data.';return;}
  document.getElementById('qNum').textContent=idx+1;
  document.getElementById('qTotal').textContent=DATA.length;
  document.getElementById('qText').textContent=q.q;
  document.getElementById('opts').innerHTML=q.options.map((o,i)=>
    `<div class="option ${answers[idx]==(i+1)?'selected':''}" onclick="select(${i+1})">${String.fromCharCode(65+i)}. ${o}</div>`
  ).join('');
}
window.select=o=>{answers[idx]=o; render();};
window.prev=()=>{if(idx>0){idx--; render();}};
window.next=()=>{if(idx<DATA.length-1){idx++; render();}};

function submitTest(){
  clearInterval(timerInt);
  let c=0; for(let i=0;i<DATA.length;i++){if(answers[i]==DATA[i].answer)c++;}
  const pct=Math.round(c/DATA.length*100)||0;
  document.getElementById('qCard').classList.add('hidden');
  document.getElementById('resCard').classList.remove('hidden');
  document.getElementById('score').textContent=pct+'%';
  document.getElementById('detail').innerHTML='<b>'+c+'/'+DATA.length+'</b> correct';
}

function tick(){timerSec--; document.getElementById('timer').textContent=Math.floor(timerSec/60)+':'+String(timerSec%60).padStart(2,'0'); document.getElementById('bar').style.width=(timerSec/7500*100)+'%'; if(timerSec<=0){clearInterval(timerInt); submitTest();}}

render(); timerInt=setInterval(tick,1000);
</script>
