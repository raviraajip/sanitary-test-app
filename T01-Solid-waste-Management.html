<script>
const DATA=[{"id":"68138","q":"Which of the following is not a result of mishandling of solid waste ?","options":["Dysentery","Fire","Odor","Hydrolysis of sugar"],"answer":"4","solution":"Mishandling of solid waste can lead to fire from ashes when added to combustible refuse, dysentery like bacillary dysentery, amoebic dysentery from human fecal matter spread by flies to food and water, odor due to rotting of garbage but hydrolysis of sugar is not a result of mismanagement of solid waste."},{"id":"68139","q":"Which of the following is a visual pollution?","options":["Flowers","Mashing with Fibers","Insightfulness of piles of garbage","Mashing with Adhesives"],"answer":"3","solution":"Explanation : Insightfulness of piles of garbage which offends the aesthetic feeling is referred to as visual pollution, whereas, mashing with Adhesives or fibers is not related to visual pollution and flowers are fine-looking to watch."},{"id":"68140","q":"Which of the following organism degrade the organic matter thereby, transfer the matter to the environment?","options":["Methanogens","Carbon dioxide","Manganese","Methane"],"answer":"1","solution":"Correct Answer (a): Explanation: Methanogens degrade the organic matter under anaerobic conditions producing natural biogas, whereas, manganese, carbon dioxide and methane are not microorganisms that degrade the organic matter."},{"id":"68141","q":"Why recycling of metal is more cost effective?","options":["Reduces odour","Reduces operating cost","Extraction of metal increases","Increases operating cost"],"answer":"2","solution":"Recycling metals is cost-effective because it is significantly cheaper to melt and reform existing metal than to mine, transport, and process new ore, thus reducing overall operating costs"},{"id":"68142","q":"Which was the first city to an established system of waste removal?","options":["Lahore","Athens","Paris"],"answer":"2","solution":"Explanation : In ancient cities, food scraps and other waste were simply thrown onto the unpaved streets where they accumulated and cause various diseases. Around 320 BC in Athens, the first known law forbidding this practice was established."},{"id":"68143","q":"Why burning waste is not an acceptable practice of solid waste management?","options":["Because it is very costly","Because it requires modern technologies","Because it cause several environmental issues","Because it requires lot of space"],"answer":"3","solution":"Correct Answer : c Explanation : Burning waste is not an acceptable practice, because if we look into environmental or health prospective burning waste creates lots of pollution and it is harmful to both environment and as well as organisms."},{"id":"68144","q":"What plan should we make to the disposal of solid waste?","options":["Integrated waste management plan.","Recycling of waste management plan","Reducing of waste management plan","Use of waste management plan"],"answer":"1","solution":"Answer: a Explanation: The disposal of solid waste should be part of an integrated waste management plan. This integrated solid waste management is the method of collection, processing, resource recovery and final disposal of solid waste."},{"id":"68145","q":"Why plastics are difficult to recycle?","options":["Because it is very adhesive in its nature","Because of different sizes of plastic","Because of different types of polymer resins","Because it is very hard material"],"answer":"3","solution":"Correct Answer (c): Explanation: Plastic are difficult to recycle because of the different types of polymer resins in their production. Since each type has a distinct chemical composition, different plastics cannot be recycled together"},{"id":"68146","q":"What is called for the process of burning municipal solid waste in a properly designed furnace under suitable temperature and operating","options":["Incineration","Vermicomposting","Recycling","Landfill"],"answer":"1","solution":"Explanation: Incineration is a chemical process in which the combustible portion of the waste is combined with oxygen forming carbon dioxide and water, which are released into the atmosphere. Suitable temperature and operating conditions are required to achieve for incineration"},{"id":"68147","q":"How many major sources of solid waste are there based on their origin?","options":["10","5","6","9"],"answer":"4","solution":"There are broadly 9 major sources of solid waste when categorized based on their origin. These sources include: Residential: Waste from houses and apartments (food scraps, plastics, paper). Industrial: Waste from light and heavy manufacturing, power, and chemical plants. Commercial: Waste from stores, restaurants, markets, and office buildings. Institutional: Waste from schools, colleges, hospitals, and government centers. Construction & Demolition: Debris from building, renovation, and road repair sites. Municipal Services: Waste from street cleaning, landscaping, and parks. Treatment Plants: Residual waste from water, wastewater, or industrial treatment processes. Agriculture: Waste from crop farms, orchards, dairies, and feedlots. Biomedical: Specialized waste from healthcare facilities and laboratories."},{"id":"68148","q":"Under which rule of Government, guidelines for solid waste management are followed today?","options":["Municipal Solid Waste Rules, 2000","Municipal Solid Waste Rules, 2016","Solid Waste Rules, 2000","Solid Waste Rules, 2016"],"answer":"4","solution":"At present, we have to follow the Solid Waste Management Rules, 2016. This new rule was notified on 8th April 2016 and it supersedes the Municipal Solid Waste Rules, 2000. This new sets of rules have been extended to all Indian local bodies ."},{"id":"68149","q":"The average composition of Municipal solid waste is:","options":["41% organic, 40% inert & 19% recyclable","20% organic, 60% inert & 20% recyclable","30% organic, 20% inert & 50% recyclable Solid","19% organic, 41% inert & 40% recyclable"],"answer":"1","solution":"Answer: a Explanation: The bulk of organic waste arrives from households and agriculture. The inert waste is generated from construction sites, demolitions, public places, etc."},{"id":"68150","q":"The WHO has classified the bio-medical waste into ___________ categories.","options":["5","6","7","8"],"answer":"4","solution":"The World Health Organization (WHO) has classified bio-medical waste into eight categories. These categories are: Infectious Waste: Waste suspected to contain pathogens (e.g., laboratory cultures, waste from isolation wards). Pathological Waste: Human tissues or fluids (e.g., body parts, blood). Sharps: Sharp objects like needles, scalpels, and broken glass. Pharmaceutical Waste: Expired or unused medicines/drugs. Genotoxic Waste: Waste containing cytotoxic drugs (often used in cancer therapy). Chemical Waste: Chemical substances like laboratory reagents, disinfectants, or heavy metals. Radioactive Waste: Waste containing radioactive substances. General/Other Waste: Non-hazardous waste. Note: While some local regulations (like those in India) may have different classifications, the standard WHO classification is eight categories."},{"id":"68151","q":"Which of the following is NOT correct regarding disposal of waste by land filling?","options":["Reduce","Replace","Reuse","Recycle"],"answer":"2","solution":"In the context of waste management and disposal strategies, the widely recognized hierarchy is the \"3 Rs\": Reduce, Reuse, and Recycle. While Replace (e.g., substituting hazardous materials with safer ones) is a valid sustainability concept, it is not part of the standard core trio used to define waste management and landfill diversion practices. Explanation Reduce: Refers to minimizing the amount of waste generated at the source, which directly decreases the volume of material that eventually reaches a landfill. Reuse: Involves using an item multiple times before discarding it, thereby extending its lifespan and keeping it out of the waste stream for longer. Recycle: The process of converting waste materials into new materials and objects, which is a key alternative to conventional waste disposal in landfills. Why other options are incorrect Reduce: This is a standard and correct principle of waste management aimed at decreasing landfill usage. Reuse: This is a core part of the waste hierarchy and is considered a correct method for managing waste effectively. Recycle: This is one of the primary methods for diverting waste from landfills and is a fundamental part of the 3Rs."},{"id":"68152","q":"Which of the following can be recycled many times?","options":["Wood","Plastic","Aluminium","Organic materials"],"answer":"3","solution":"Explanation Aluminum is considered indefinitely or infinitely recyclable because it does not lose its quality, purity, or structural properties during the recycling process. It can be melted down and reshaped repeatedly, which is significantly more energy-efficient than mining new ore (saving up to 95% of the energy required for primary production). Why other options are incorrect Wood: Wood cannot be recycled indefinitely because the cellulose fibers shorten and degrade with each cycle; it is typically only recycled 3\u20135 times into products like particleboard. Plastic: Most plastics can only be recycled a limited number of times (usually 1\u20133 times) before the polymers break down, causing the material to become brittle and lose quality. Organic Materials: While these can be composted or biodegraded, they do not undergo a technical recycling process that allows them to be reformed into their original state multiple times."},{"id":"68153","q":"Identify a Sort of Plan That We Should Make to the Disposal of Solid Waste from the Given Ones?","options":["The integrated waste management plan","Recycling of waste management plan","Reducing the waste management plan","Use of waste management plan"],"answer":"1","solution":"Explanation Solid waste disposal should be part of an integrated waste management plan. This integrated solid waste management method is a plan of collection, processing, resource recovery, and final disposal of solid waste."},{"id":"68154","q":"How Does an Organic Material Decompose in the Buried Solid Waste?","options":["By the action of microorganisms","By the action of oxidation","By the soil particles","By the flow of water"],"answer":"1","solution":"Organic material in buried solid waste decomposes primarily through the biological activity of microorganisms such as bacteria and fungi. When waste is buried (e.g., in a landfill), the process typically follows these stages: Aerobic Decomposition : Initially, aerobic bacteria use the available oxygen to break down organic matter into carbon dioxide and water. Anaerobic Decomposition: Once the oxygen is depleted, anaerobic microorganisms take over, breaking down the remaining complex molecules into simpler substances like methane and organic acids."},{"id":"68155","q":"Identify the Wastes That Are Known as the Municipal Solid Waste (MSW) from the Following?","options":["All of the Below","Food wastes","Plastic cans","Wood pieces"],"answer":"1","solution":"Correct Answer (a): Explanation Trash or rubbish is made up of ordinary goods such as product packaging, grass clippings, furniture, clothing, bottles, food scraps, newspapers, appliances, paint, and batteries that we use and then discard. This is found in our homes, schools, hospitals, and workplaces."},{"id":"68156","q":"The Wastes Burning Is Not an Acceptable Practice of Solid Waste Management Because ____?","options":["It requires a lot of space","It requires modern technologies","It causes several environmental issues","It is very costly"],"answer":"3","solution":"Explanation: Burning waste is not acceptable practice, because if we look into environmental or health prospective burning waste creates lots of pollution and it is harmful to both environment and as well as organisms."},{"id":"68157","q":"Which of the Following Ones Is the Simplest and Most Common Method Used in the Cities to Dump the Wastes That Are Collected? River","options":["River","Ocean","Landfill","None of the above"],"answer":"3","solution":"Correct Answer (c): Explanation The most widely utilized form of trash disposal today is to dump everyday waste/garbage in landfills. This garbage disposal method relies on burying the material in the ground. In developing countries, landfills are common."},{"id":"68158","q":"When the Matter Present Inside the Sanitary Landfill Breaks Down, Which of the Following Gas Generates","options":["Methane","Nitrogen","Hydrogen","All of the above"],"answer":"1","solution":"Landfill gas is a mix of methane and carbon dioxide, with a few other trace elements thrown in for good measure. It is formed naturally as organic matter decomposes in landfills."},{"id":"68159","q":"Identify the Correct One from the Given List About Wastes?","options":["There is no real waste in nature","The apparent wastes collected from one process becomes the input to another","All processes of consumption and production produce waste","All of the above"],"answer":"4","solution":"There is no real waste in nature: For millions of years, nature has had its own waste disposal solutions. Decomposers such as protozoa, bacteria, and scavengers decompose the dead bodies of animals and humans. Scavengers and Detrivorous organisms also help nature to decompose its waste. Someone's waste can be someone's treasure. Something that is a waste for someone is not necessarily is a waste for another person as well. In totality, there is no waste in nature. Waste from one process becomes the input for another: Dead animals and humans become a source of food for bacteria, protozoa, and scavengers who in turn decompose their materials. Faeces is can be used to make manure for plants. Fly ash which is a waste from thermal power plants is used to make fly ash bricks. In various instances, it could be seen that waste from one process becomes an input for another. All processes of production and consumption produce waste: Hot metal pretreatment slag, dust, GCP sludge, mill scale, refractories, scrap, muck & detritus, and other solid wastes, are produced as waste material during the production of steel. During consumption of various fruits such as orange, banana, kiwi, etc. their peel is the waste material. All processes of production and consumption produce waste."},{"id":"68160","q":"Which of the Following Methods is a Good One in Dealing With the Solid Waste Problem?","options":["Recycling","Landfilling","Neither a and b","Both a and b"],"answer":"4","solution":"Both Recycling and Landfilling are recognized methods for dealing with solid waste, though they serve different roles in waste management: Recycling: This is widely considered the best and most sustainable method. It involves processing waste materials into new products, which conserves natural resources, saves energy, and reduces the overall volume of waste that needs final disposal. Landfilling: While less environmentally friendly than recycling, it is the most common and practical method for disposing of waste that cannot be recycled or composted. Modern \"sanitary landfills\" are engineered to minimize environmental impact by layering and compacting waste and covering it with soil to prevent pests and odors"},{"id":"68161","q":"Identify the Incorrect Statement from the Given List for Plastic Wastes?","options":["All of the below","Toxic fumes are produced when plastic is burnt","It lasts for a longer time period","Plastic can be used to make compost"],"answer":"4","solution":"Plastics are made of non-biodegradable polymers like polyethylene. When buried in soil, the microorganisms take hundreds of years to decompose plastics. Plastic wastes like bottles, bags, and wrappers when burnt produce a highly toxic gas Carbon Monoxide (CO). In a compost pit, biodegradable wastes like vegetable peels and paper are added. These can be easily broken down by microorganisms in the soil and are then converted into manure."},{"id":"68162","q":"From the Below Statements, Which One Features Zero Waste Management?","options":["Separate collection of each kind","Separation of garbage at the source","Involvement of the community in all activities","All of the above"],"answer":"4","solution":"Correct answer (d) Explanation : Zero Waste is a holistic approach to resource management that emphasizes waste reduction, reuse, and recycling. We need to buy items manufactured from the materials we recycle if we want recycling to work for everyone. By reusing materials that have already been utilized, decreases the requirement for non-renewable resources."},{"id":"68163","q":"which of the following is not the landfilling method?","options":["Bangalore method","Area method","Depression method","Trench method"],"answer":"1","solution":"Explanation: Bangalore method is a method of composting whereas area, depression, and trench method are the land filling method"},{"id":"68164","q":"are the cutting and tearing of municipal solid waste","options":["Land fill","Shredding","Pulverization","Composting"],"answer":"2","solution":"Explanation : Shredding is the cutting and tearing of municipal solid waste. It helps in reducing the size and volume of municipal solid waste."},{"id":"68165","q":"which of the integrated waste management is reduced on an individual level","options":["Source reduction","Recycling","Disposal","Burning"],"answer":"1","solution":"Correct Answer (a): Explanation: Source reduction is one of the fundamental ways to reduce waste. On an individual level, we can reduce the use of unnecessary items while shopping, avoid buying disposable items and avoid using plastic carry bags."},{"id":"68166","q":"why the recycled paper is banned for use in food containers?","options":["Because it creates contamination","Because it creates a lot of spaces","Because paper can be used only one time","Because paper is very thick and can\u2019t cover the food containers"],"answer":"1","solution":"Explanation: Recycled paper is banned for use in food containers to prevent the possibility of contamination. It very often costs less to transport"},{"id":"68167","q":"which of the following is most suitable for dry wastes?","options":["Aerobic composting","Anaerobic composting","Closed vessel","Anaerobic digestion"],"answer":"1","solution":"Correct Answer (a): Explanation : Aerobic composting is usually used to treat the solid wastes which are generally dry in nature and not moist or wet wastes, whereas, anaerobic composting is used to degrade moist solid wastes which are very easy to degrade, and anaerobic digestion and Anaerobic composting is the same thing, and it is carried out under controlled temperature and high moisture control conditions, which takes place inside the vessel, a closed vessel."},{"id":"68168","q":"what is a major advantage of anaerobic fermentation over aerobic composting?","options":["Human control","Production of methane","High water content","Less water contents"],"answer":"2","solution":"Explanation A major advantage of anaerobic fermentation over aerobic composting is the production of methane-rich biogas, which serves as a renewable energy source, combined with the capability to process waste in a sealed environment with lower operational energy requirements. It also produces less biological sludge and allows for nutrient-rich digestate to be utilized as fertilizer"},{"id":"68169","q":"which of the following type of waste is best suited for anaerobic treatment of solid wastes","options":["Readily biodegradable compounds","Less moisture content","Less moisture content","High temperature content"],"answer":"1","solution":"Correct Answer (a): Explanation: Readily biodegradable compounds and wastes with high moisture content are best suited for anaerobic treatment as the anaerobic digestion of wastes is carried out under anaerobic conditions where the temperature and moisture is controlled. So, moisture content is high and is highly degradable and temperature need not be very high"},{"id":"68170","q":"In solid waste management, waste utilization is achieved by","options":["Recover, reclamation of reproduce","Reuse, Reclamation, and Recycling","Recover, Recycle, and Reproduce","Reuse, Reproduce, and Recycling"],"answer":"2","solution":"Correct Answer (B): Explanation: In solid waste management, waste utilization is achieved by implementing strategies such as reusing, reclaiming, and recycling. These methods help reduce the amount of waste that ends up in landfills and promote a more sustainable approach to waste management ."},{"id":"68171","q":"How many ways are there to treat the waste thermally?","options":["3","6","2","5"],"answer":"1","solution":"Explanation: The process which use heat to treat the waste are referred to as a thermal treatment. These include incineration (combustion of waste & recover energy for electricity/heating), pyrolysis (decomposition of organic waste with low oxygen and high temperature), and open burning (environmentally harmful and mostly practical)."},{"id":"68172","q":"With reference to disposal of solid wastes, pulverisation refers to:","options":["heating at 1,100\u00b0C","cutting and tearing","crushing and grinding","cutting only"],"answer":"3","solution":"Correct Answer (c): Pulverisation is a mechanical process used in solid waste management. It involves the breaking down of bulky solid waste materials into smaller particles. The process is carried out by crushing, grinding, or shredding machines."},{"id":"68173","q":"Which of the following are correct about Gasification in MSW processing? 1. It takes place in a low-oxygen environment 2. Produces syngas, a fuel-rich product 3. Does not emit any toxic gases 4. Is a purely biological process","options":["3 and 2 only","1 and 2 only","1, 2 and 4 only","All of the above"],"answer":"2","solution":"Correct Answer (b): Gasification is a process that converts organic or fossil fuel-based carbonaceous materials into carbon monoxide, hydrogen, and carbon dioxide. It takes place in a low-oxygen environment where the amount of oxygen is not enough to support complete combustion. Gasification produces syngas (synthesis gas), which is a fuel-rich product consisting mainly of carbon monoxide and hydrogen."},{"id":"68174","q":"As per CPCB, how much solid waste is generated per capita per day in large cities?","options":["0.1 kg","0.5 kg","0.3 kg to 0.4 kg","2.8 kg"],"answer":"2","solution":"Correct Answer (b): As per CPCB (Central Pollution Control Board) Solid waste generated in small cities \u2026\u2026\u2026\u2026\u2026 0.1 kg per capita per day Solid waste generated in medium cities \u2026\u2026\u2026\u2026\u2026 0.3-0.4 kg per capita per day Solid waste generated in large cities \u2026\u2026\u2026\u2026\u2026. 0.5 kg per capita per day."},{"id":"68175","q":"Match List-I (Methods of solid wastes disposal) with List-II (Terms pertaining to the methods) and select the correct answer using the codes given below the lists: List-I List-II (a) Incineration (i) Requires pre-sorting, grinding and turning (b) Sanitary landfill (ii) Limited to special wastes and selected materials (c) Composting (iii) High operational and maintenance cost (d) Salvage by sorting (iv) Rat and fly breeding","options":["(a) - ii, (b) - i, (c) - iv, (d) - iii","(a) -I, (b) - iv, (c) - ii, (d) - iii","(a) - iii, (b) - iv, (c) - i, (d) - ii","(a) - iii, (b) - iv, (c) - ii, (d) - i"],"answer":"4","solution":"Incineration- Burning of refuse at high temperatures in furnaces, called incinerators, is quite a sanitary method of refuse disposal and is widely adopted in developed countries. Incineration is a method in which disposal of refuse is carried out by burning it at high temperature either in presence of oxygen. There is no odour trouble or dust nuisances. It requires very less space. Disadvantages- It is a very costly method and requires a lot of technical knowledge. Solid waste to be burnt should have a high calorific value. Composting- It is a biological method of decomposing solid wastes. This can be done in both aerobic and anaerobic conditions. Inorganic materials like plastics, rubber, and leather are separated from municipal solid wastes and the entire process involving both separation and bacterial conversion of the solid wastes is known as composting. So it is limited to special wastes and selected materials. Sanitary Landfill- In this method of refuse of disposal, refuse is carried and dumped into the low-lying area under an engineered operation, designed and operated in an environmental manner as not to cause any public nuisance or hazards to public health or safety. This method is most simple and economical. No separation is required and no byproducts are left out or evolved in this method. Disadvantages- The continuous evolution of foul gases near the fill site. These gases may often be explosive in nature and are produced by decomposing organic matter. During the rainy season when excess water seeping through the area may come out of the dump as a coloured liquid called leachate. Rat and fly breeding also occurs here. Salvage by sorting- Waste sorting is the process by which waste is separated into different elements. Waste sorting can occur manually at the household and collected through curbside collection schemes, or automatically separated in materials recovery facilities or mechanical biological treatment systems. In salvage by sorting process, it requires presorting, grinding and turning."},{"id":"68176","q":"Consider the following statements regarding autoclaving and incineration: 1. Autoclaving is a high heat thermal process while incineration is low heat thermal process. 2. Incineration systems convert wastes containing infections and pathological material into inert mineral residues and gases. 3. Autoclaving is designed to bring steam into direct contact with wastes. Which of the statements are correct?","options":["1 and 2 only","2 and 3 only","1 and 3 only","1, 2 and 3"],"answer":"2","solution":"Explanation Statement 2 is correct: Incineration is a high-temperature combustion process that destroys infectious and pathological materials. It converts these materials into inert mineral residues (ash) and gases (flue gas), effectively reducing waste volume. Statement 3 is correct: Autoclaving is specifically designed to use pressurized steam that comes into direct contact with the waste for a specific duration to achieve sterilization and disinfection."},{"id":"68177","q":"The method of refuse disposal, involving burial in trenches is called","options":["Incineration","Pulverization","Composting","Autoclaving"],"answer":"3","solution":"The method of refuse disposal involving the burial of waste in excavated trenches, which is then compacted and covered with soil, is called Landfilling (or specifically, a Sanitary Landfill using the trench method). Based on the options provided: Incineration: Burning waste in a furnace. Pulverization: Grinding/crushing waste. Composting: Biological decomposition of organic matter. Autoclaving: Sterilization using steam."},{"id":"68178","q":"Statement (I): The field capacity of municipal solid waste is the total amount of moisture that can be retained in a waste sample against surface tension. Statement (II): The field capacity of municipal solid waste plays a critical role in determining the volume of leachate produced in landfills.","options":["Both Statement (I) and Statement (II) are true and Statement (II) is the correct explanation of Statement (I).","Both Statement (I) and Statement (II) are true but Statement (II) is not a correct explanation of Statement (I).","Statement (I) is true but Statement (II) is false.","Statement (I) is false but Statement (II) is true."],"answer":"4","solution":"Statement (I): False Field capacity is defined as the total amount of moisture that can be retained in a waste sample subject to the downward pull of gravity , not surface tension. While surface tension is the mechanism holding the water, the definition specifically refers to retention against gravity . Once the moisture content exceeds the field capacity, gravity pulls the excess liquid down, forming leachate. Statement (II): True The field capacity is indeed a critical parameter in landfill management. Leachate is only produced when the moisture content of the waste exceeds its field capacity. Until the waste reaches this saturation point, it will absorb liquids rather than releasing them. Therefore, knowing the field capacity is essential for predicting when and how much leachate will be generated."},{"id":"68179","q":"Match List-I (Methods of solid waste management) with List-II (Characteristic) and select the correct answer using the codes given below the lists: List-I A. Incineration B. Vermi-composting C. Pyrolysis List-II 1. Exothermic combustion process. 2. Decomposition of organic matter by earthworms. 3. Highly endothermic process.","options":["A-3,B-2,C-1","A-2,B-1,C-3","A-1,B-2,C-3","A-2,B-3,C-1"],"answer":"3","solution":"Explanation A. Incineration \u2014 1. Exothermic combustion process: Incineration involves the burning of organic substances in waste materials. Since it is a combustion process that releases heat, it is classified as exothermic. B. Vermi-composting \u2014 2. Decomposition of organic matter by earthworms: This is a specific type of composting that utilizes various species of earthworms to accelerate the process of decomposing organic waste. C. Pyrolysis \u2014 3. Highly endothermic process: Pyrolysis is the thermochemical decomposition of organic material at elevated temperatures in the absence of oxygen. Unlike incineration, it typically requires a significant input of external heat to break down chemical bonds, making it an endothermic process."},{"id":"68180","q":"Which of the following methods is/are used for disposal of the municipal solid waste? I: Sanitary landfilling II: Shredding or pulverisation III: Barging out into the sea","options":["Only I","All of I, II and III","Only I and II","Only II"],"answer":"2","solution":"Correct Answer (b): Methods for Disposal of Municipal Solid Waste (MSW): 1. Sanitary Land-Filling: In this method, refuse is transported and dumped into a designated low-lying area, known as the landfill site. This operation is engineered to be environmentally sound, ensuring it does not pose any public health or safety hazards. The refuse is compacted in layers approximately 0.5 meters thick. Once the filling reaches a depth of about 1.5 meters , it is covered with a layer of good earth about 15 cm thick. 2. Shredding and Pulverisation: This method involves the physical processes of reducing the size and volume of municipal solid waste (MSW). Shredding refers to the cutting and tearing actions, while pulverisation involves crushing and grinding the waste. This method can reduce the overall volume of MSW by as much as 40%. 3. Barging Out into the Sea: This method, used in the past, involved disposing of refuse by carrying it a reasonable distance into the sea (several kilometers offshore) on barges and then throwing it into the sea. The disposal point should have a sea depth of at least 30 meters , and the currents should be such that the refuse does not return to shore. 4. Composting: Composting is a biological method used to decompose organic waste, making it both environmentally and economically viable. It can be done either in the presence of oxygen (aerobic composting) or in its absence (anaerobic composting). The end product of this process is humus or composted manure. Two main methods adopted in India are the Indore and Bangalore methods. 5. Incineration and Thermal Pyrolysis: This method involves burning refuse at high temperatures in furnaces known as incinerators. It is a sanitary method widely used in developed countries like the USA, where the refuse is of high calorific value, making it suitable for burning."},{"id":"68181","q":"Which of the following is the hazardous waste produced by petroleum refining industries?","options":["Tarry residues","Cyanide-containing sludge","Lead ash","Spent clay-containing oil"],"answer":"4","solution":"Correct Answer (d): Spent Clay-Containing Oil: Spent clay is used in the petroleum refining industry to remove impurities, color, and unwanted materials from oil products through a process called bleaching or adsorption. After being used, the clay becomes saturated with oil and various contaminants, making it a hazardous waste due to the presence of toxic and potentially harmful substances. Spent clay-containing oil is classified as hazardous waste because it can pose significant environmental and health risks if not properly managed. Proper disposal or recycling methods are necessary to mitigate these risks."},{"id":"68182","q":"Which of the following municipal solid wastes CANNOT be recycled?","options":["Fruit peelings","Papers","Glasses","Plastics"],"answer":"1","solution":"Correct Answer (a): Fruit peelings cannot be recycled in the conventional sense, as they are organic, biodegradable waste intended for composting. Unlike paper, glass, and plastic, which can be reprocessed into new products, fruit waste decomposes and is categorized under organic waste rather than recyclable municipal waste Fruit Peelings: These are organic waste materials that decompose naturally and are typically used in composting rather than recycling. They are biodegradable and can be turned into compost, which enriches soil, but they are not considered recyclable in the traditional sense. Papers: Paper is one of the most commonly recycled materials. It can be recycled to produce new paper products, reducing the need for raw materials and conserving resources. Glasses: Glass can be recycled indefinitely without losing quality. Recycled glass is used to make new glass products, including bottles, jars, and other items. Plastics: Many types of plastics can be recycled, though the process and feasibility depend on the type of plastic. Recycled plastics are used in the manufacturing of a variety of new products, from packaging to clothing and more."},{"id":"68183","q":"The waste from printers, scanners, refrigerators, etc. is called _____.","options":["industrial waste","electrical waste","municipal waste","e-waste"],"answer":"4","solution":"Correct Answer (d): e-waste: The waste from printers, scanners, refrigerators, and similar devices is called e-waste (electronic waste). E-waste refers to discarded electronic devices or components that are no longer in use or have reached the end of their useful life. This category includes a wide range of items, from small gadgets like phones to larger appliances like refrigerators. Industrial Waste: Definition: Industrial waste refers to waste produced by industrial activities. This type of waste can include materials that are left over from the manufacturing process, like scrap metal, chemicals, and other byproducts. Industrial waste can be solid, liquid, or gaseous, and it often requires special handling and disposal methods to prevent environmental contamination. Examples: Waste from factories, refineries, chemical plants, etc. Municipal Waste: Definition: Municipal waste, also known as urban waste, is the waste collected be municipalities from residential, commercial, and institutional areas. It includes everyday items discarded by the public. Examples: Household trash, food waste packaging materials, etc."},{"id":"68184","q":"The 3R Principle is a concept for ________.","options":["waste management","plastic waste treatment","water treatment","sanitation"],"answer":"1","solution":"Correct Answer (a): The 3R Principle: The 3R Principle stands for Reduce, Reuse, and Recycle. It is a widely adopted concept aimed at promoting sustainable waste management practices to minimize the impact of waste on the environment. The principle encourages individuals and organizations to take active steps to manage waste more effectively. Explanation of the Correct Option: Option 1: Waste Management The 3R Principle is primarily a concept for waste management. It aims to reduce the amount of waste generated, promote the reuse of materials, and encourage recycling to convert waste into useful products. This helps in conserving natural resources, reducing pollution, and minimizing the amount of waste sent to landfills. Reduce: The first step is to minimize the amount of waste produced by using fewer resources and generating less waste. This can be achieved through efficient production processes, mindful consumption, and avoiding single-use items Reuse: The second step is to extend the life of products by reusing them. This involves finding new ways to use items instead of discarding them, which reduces the need for new products and conserves resources. Recycle: The third step is to convert waste materials into new products. Recycling involves collecting and processing materials that would otherwise be thrown away as trash, turning them into new products to reduce the consumption of fresh raw materials and reduce energy usage."},{"id":"68185","q":"Identify whether the following statements about sanitary landfill are true or false. Statement I: There is continuous evolution of foul gases near the fill side. Statement II: During rainy season, leachate may come out of the dump. Statement III: The method requires further treatments for completion.","options":["Statements I and II are true, but Statement III is false","Statement I is true, but 2. Statements II and III are false","Statements I and III are true, but Statement II is false","Statements I and II are false and Statement III is true"],"answer":"1","solution":"Correct Answer (a): Advantages and Disadvantages of Sanitary Landfill Method: Advantages: 1. Simplicity and Cost-Effectiveness: This method is one of the simplest and most economical ways of refuse disposal. It does not require costly plants or equipment, unlike other methods such as incineration or pulverization. 2. No Need for Separation: Unlike incineration, which often requires the separation of different types of refuse, sanitary landfill does not require such separation, simplifying the process. 3. Complete Disposal Method: Sanitary landfills are designed to be a complete disposal method, with no residues or byproducts left that would require further disposal. 4. Reclamation of Low-Lying Areas: Low-lying, water-logged areas or old quarry pits can be easily reclaimed and put to better use through this method. It also helps in eliminating mosquito-breeding places. Disadvantages: 1. Scarcity of Dumping Sites: Suitable low-lying depressions or dumping sites may not always be available. Even if they are available today, they may become scarce or unavailable in the future due to the continuous production of solid waste. 2. Evolution of Foul Gases: There is a continuous evolution of foul gases near the landfill site, especially during the dumping process. These gases, known as landfill gases, are produced by decomposing or evaporating organic matter and can be explosive. 3. Leachate Formation: The dumped garbage may contain harmful substances, including non-biodegradable materials like plastics and unused chemicals. During the rainy season, excess water seeping through the landfill may result in the formation of a colored liquid called leachate, which can be harmful to the environment."},{"id":"68186","q":"Which of the following is NOT broadly classified as a part of agrochemicals?","options":["Insecticides","Herbicides","Fungicides","Digesicides"],"answer":"4","solution":"Correct Answer (d): Agrochemicals: Agrochemicals refer to the various chemical products used in agriculture to enhance crop production and protect crops from pests, diseases, and weeds. The main categories of agrochemicals include: Insecticides: Chemicals used to kill or manage insect pests. Herbicides: Chemicals used to control or eliminate unwanted plants (weeds). Fungicides: Chemicals used to prevent or treat fungal infections in plants. The term \"digesicides\" is not commonly used or recognized as a category of agrochemicals. It appears to be a non-existent or incorrect term in the context of agricultural chemicals."},{"id":"68187","q":"The kind of sealant appropriate for landfill sites aimed at both controlling gas emissions and facilitating gas recovery.","options":["Asphalt","Inorganic Chemicals","Synthetic membrane liners","Synthetic chemicals"],"answer":"3","solution":"For landfill gas control and recovery, effective sealants include Compacted Clay (Bentonite/Illite) for low permeability barriers and Synthetic Geomembranes (like HDPE) , often layered with clay, while specialized Polymer Sealants (Polysulfide/MS Polymers) are used for liner joints and concrete surfaces, all creating impermeable layers to contain methane for collection, with clay offering self-sealing properties and polymers providing high chemical resistance. Common landfill sealants for the control of gases and leachate movement: Sealant Remarks Classification Representative type Compacted clay Bentonite, illites, kaolinite Most commonly used sealant for landfills, layer thickness varies from 0.15 m-1.2 m Inorganic chemicals Sodium carbonate, silicate Use depends in local soil charateristics Synthetic chemicals Polymers, robber latex Experimental, use not well established Synthetic membrane liners PVC, Butyl rubber, Hypalon, polyethylene, nylone reinforced liners Expensive and can be justified where gas is to be recovred Asphalt Modified asphalt, asphalt concrete Layer must be thick enough to maintain continuity under differential settling conditions"},{"id":"81034","q":"The \"proximate analysis\" of solid waste is used to determine which of the following components?","options":["Carbon, Hydrogen, Oxygen, Nitrogen","Moisture, Volatile Matter, Fixed Carbon, Ash","Heavy metals, Pesticides, Toxins","Biodegradable and Non-biodegradable fraction"],"answer":"2","solution":"Proximate analysis is a standardized procedure used to characterize the burning properties of waste or fuel. It specifically determines the percentage of Moisture, Volatile Matter (combustible gases), Fixed Carbon (char), and Ash (non-combustible residue). In contrast, \"Ultimate Analysis\" determines the chemical elemental composition (Carbon, Hydrogen, Oxygen, Nitrogen, etc.)."},{"id":"81035","q":"In the context of waste collection systems, what does \"HCS\" stand for?","options":["High Capacity System","Hauled Container System","Hazardous Collection Standard","Home Collection Service"],"answer":"2","solution":"HCS stands for \"Hauled Container System.\" In this waste collection system, the collection container itself is hauled from the collection point to the disposal site, emptied, and then returned (or replaced with an empty one). This contrasts with the \"Stationary Container System\" (SCS), where the container remains at the site and is emptied into a collection vehicle."},{"id":"81036","q":"Which of the following plastic resin codes corresponds to \"High-Density Polyethylene\" (HDPE), commonly used in milk jugs and detergent bottles?","options":["Code 1","Code 2","Code 4","Code 5"],"answer":"2","solution":"The Resin Identification Codes (RIC) classify plastics types: Code 1: PET (Polyethylene Terephthalate) Code 2: HDPE (High-Density Polyethylene) Code 3: PVC (Polyvinyl Chloride) Code 4: LDPE (Low-Density Polyethylene) Code 5: PP (Polypropylene)"},{"id":"81037","q":"The \"Hauled Container System\" (HCS) is generally economically feasible when:","options":["The waste generation rate is high and containers are large","The waste generation rate is low and containers are small","The distance to the disposal site is very long (>50 km)","The waste is purely organic"],"answer":"1","solution":"The Hauled Container System (HCS) is most suitable for areas with high waste generation rates and where large containers are used (e.g., construction sites, industrial zones). Because the truck must make a round trip to the disposal site for every single container, it is only efficient if the volume of waste moved per trip is very large."},{"id":"81038","q":"For optimal aerobic composting, the initial Carbon-to-Nitrogen (C/N) ratio of the waste mixture should ideally be:","options":["10:1 to 15:1","25:1 to 30:1","50:1 to 60:1","80:1 to 100:1"],"answer":"2","solution":"The ideal initial C/N ratio for composting is between 25:1 and 30:1. If the ratio is too high (>40:1), the process slows down because nitrogen (needed for microbial growth) is the limiting factor. If the ratio is too low (<20:1), there is excess nitrogen, which is released as ammonia gas, causing bad odors and loss of nutrient value."},{"id":"81039","q":"Which of the following terms describes the liquid that drains from a landfill and contains dissolved and suspended materials?","options":["Sludge","Leachate","Effluent","Supernatant"],"answer":"2","solution":"Leachate is the liquid formed when rainwater filters through the decomposing waste in a landfill. As it percolates, it extracts (leaches) dissolved and suspended matter, heavy metals, and other contaminants from the waste. Proper landfill design requires leachate collection and treatment systems to protect groundwater."},{"id":"81040","q":"In a sanitary landfill, the primary purpose of the \"Daily Cover\" (usually 15 cm of soil) is to:","options":["Prevent the entry of rainwater","Control fly breeding, scavenging, and fires","Enhance methane production","Reduce the weight of the landfill"],"answer":"2","solution":"A \"Daily Cover\" of soil (approx. 15 cm) is applied at the end of each working day. Its primary functions are to control vector breeding (preventing flies, rats, and birds from accessing the waste), prevent waste from blowing away (litter control), and reduce the risk of fires and foul odors escaping the active face of the landfill."},{"id":"81041","q":"Which earthworm species is most commonly used in vermicomposting in India due to its high voracity and adaptability?","options":["Lumbricus terrestris","Eisenia fetida","Eudrilus eugeniae","Pheretima posthuman"],"answer":"2","solution":"Eisenia fetida (often called the Red Wiggler) is the most widely used earthworm species for vermicomposting globally and in India. It is preferred because it is a surface feeder (epigeic), has a very high appetite for organic waste, reproduces rapidly, and tolerates a wide range of environmental conditions compared to other species."},{"id":"81042","q":"\"Refuse Derived Fuel\" (RDF) typically has a calorific value in the range of:","options":["500 - 800~kcal/kg","1000 - 1500~kcal/kg","2500 - 4000~kcal/kg","8000 - 9000~kcal/kg"],"answer":"3","solution":"Refuse Derived Fuel (RDF) consists of the combustible fraction of municipal solid waste (like plastics, paper, cloth) that has been processed to remove non-combustibles and moisture. This processing significantly increases its energy content compared to raw waste. Good quality RDF typically has a calorific value between 2500 kcal/kg and 4000 kcal/kg , making it suitable for use in cement kilns or power plants."},{"id":"81043","q":"The process of heating solid waste in an oxygen-starved environment to produce char, oil, and syngas is known as:","options":["Incineration","Pyrolysis","Aerobic Digestion","Composting"],"answer":"2","solution":"Pyrolysis is the thermal degradation of organic material in the absence of oxygen (or oxygen-starved environment). Unlike incineration (which uses excess oxygen to burn waste completely), pyrolysis breaks down the molecules to produce three by-products: a solid residue (char), a liquid bio-oil, and a combustible gas (syngas)."},{"id":"81044","q":"A \"Transfer Station\" is economically justified in a solid waste management system when:","options":["The disposal site is located close (< 10 km) to the collection area","The disposal site is located far (> 20-30 km) from the collection area","The waste contains only hazardous materials","The collection vehicles are very large compactors"],"answer":"2","solution":"A Transfer Station is a facility where waste is transferred from smaller local collection vehicles to larger long-haul transport vehicles. It becomes economically viable when the disposal site is located far away (>20-30 km) from the collection area. The cost savings from transporting waste in bulk (using large trailers) outweigh the additional cost of constructing and operating the transfer station."},{"id":"81045","q":"Under the Solid Waste Management Rules, 2016, sanitary napkins and diapers should be wrapped securely and placed in:","options":["Green Bin (Biodegradable)","Blue Bin (Recyclable)","Yellow Bin or separate pouch (Domestic Hazardous Waste)","Black Bin (Inert Waste)"],"answer":"3","solution":"Under the SWM Rules 2016 (and typical municipal by-laws), sanitary waste (diapers, sanitary napkins) is considered potentially infectious or offensive. It is mandated to be wrapped securely. While sometimes categorized generally with dry waste in simpler systems, the specific correct disposal route to prevent contamination of recyclables is the Domestic Hazardous Waste stream (often designated by a Yellow bin or separate pouch/bag), so that it can be sent for incineration or deep burial rather than recycling."},{"id":"81046","q":"The density of Municipal Solid Waste (MSW) in India is typically ____________ compared to MSW in Western countries (like the USA).","options":["Much Lower (due to high paper/packaging)","Much Higher (due to high moisture/organic/ash content)","Exactly the same","Negligible"],"answer":"2","solution":"Solution : Indian MSW typically has a much higher density (approx. 400-600 kg/m\u00b3) compared to Western MSW (approx. 100-150 kg/m\u00b3). This is because Indian waste contains a higher proportion of biodegradable/wet organic matter (food waste) and inert materials (dust, ash, silt), and a lower proportion of voluminous light packaging materials like paper and plastics."},{"id":"81047","q":"Which of the following is NOT a functional element of a solid waste management system?","options":["Waste Generation","Waste Storage","Waste Dilution","Waste Processing and Recovery"],"answer":"3","solution":"The six standard functional elements of a Solid Waste Management (SWM) system are: (1) Waste Generation, (2) Waste Handling & Storage, (3) Collection, (4) Transfer & Transport, (5) Processing & Recovery, and (6) Disposal. Waste Dilution is a concept often associated with liquid wastewater treatment (reducing concentration), but it is not a functional element of solid waste management."},{"id":"81048","q":"What is the minimum temperature required in the secondary combustion chamber of a hazardous waste incinerator to ensure destruction of toxic organics?","options":["","","",""],"answer":"3","solution":"For hazardous waste incinerators, maintaining a high temperature in the secondary chamber is critical to break down stable toxic compounds like dioxins, furans, and PCBs. Regulations (such as those by the CPCB in India or USEPA) typically mandate a minimum temperature of 1100\u00b0C (often within the range of 900\u00b0C to 1100\u00b0C +) with a residence time of at least 2 seconds to ensure complete thermal destruction."}];
let idx=0, answers={}, timerSec=65*60, timerInt=null;

function render(){
  const q=DATA[idx];
  if(!q){document.getElementById('qText').textContent='No data.';return;}
  document.getElementById('qNum').textContent=idx+1;
  document.getElementById('qTotal').textContent=DATA.length;
  document.getElementById('qText').textContent=q.q;
  document.getElementById('opts').innerHTML=q.options.map((o,i)=>
    `<div class="option ${answers[idx]==(i+1)?'selected':''}" onclick="select(${i+1})">${String.fromCharCode(65+i)}. ${o}</div>`
  ).join('');
}
window.select=o=>{answers[idx]=o; render();};
window.prev=()=>{if(idx>0){idx--; render();}};
window.next=()=>{if(idx<DATA.length-1){idx++; render();}};

function submitTest(){
  clearInterval(timerInt);
  let c=0; for(let i=0;i<DATA.length;i++){if(answers[i]==DATA[i].answer)c++;}
  const pct=Math.round(c/DATA.length*100)||0;
  document.getElementById('qCard').classList.add('hidden');
  document.getElementById('resCard').classList.remove('hidden');
  document.getElementById('score').textContent=pct+'%';
  document.getElementById('detail').innerHTML='<b>'+c+'/'+DATA.length+'</b> correct';
}

function tick(){timerSec--; document.getElementById('timer').textContent=Math.floor(timerSec/60)+':'+String(timerSec%60).padStart(2,'0'); document.getElementById('bar').style.width=(timerSec/(65*60)*100)+'%'; if(timerSec<=0){clearInterval(timerInt); submitTest();}}

render(); timerInt=setInterval(tick,1000);
</script>
</body></html>
