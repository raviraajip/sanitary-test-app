<script>
const DATA=[{"id":"74329","q":"Which component is often referred to as the \"brain\" of the computer?","options":["RAM","CPU","Motherboard","Hard Disk"],"answer":"2","solution":"Answer: (B) CPU Solution: The CPU (Central Processing Unit) is the \"brain\" of the computer. It is responsible for executing instructions, performing arithmetic and logical operations, and controlling the flow of data within the computer. RAM (Random Access Memory) is the temporary (volatile) working memory. The Motherboard is the main circuit board that connects all components. The Hard Disk is the permanent (non-volatile) storage."},{"id":"74330","q":"Which of the following types of memory is volatile?","options":["ROM","SSD","RAM","EPROM"],"answer":"3","solution":"Answer: (C) RAM Solution: Volatile memory is computer memory that requires power to maintain the stored information. Its contents are lost when the power is turned off. RAM (Random Access Memory) is the primary example of volatile memory. It's used to hold data and applications that are currently running. ROM (Read-Only Memory) , SSD (Solid State Drive) , and EPROM (Erasable Programmable ROM) are all non-volatile , meaning they retain their data even without power."},{"id":"74331","q":"Which of the following is not a function of an Operating System?","options":["Memory Management","Process Management","Application Programming","File Management"],"answer":"3","solution":"Answer: (C) Application Programming Solution: An Operating System (OS) is system software that manages all the computer's hardware and software resources. Its core functions include: Memory Management: Allocating and deallocating memory space to programs. Process Management: Managing the CPU's time between different running processes. File Management: Organizing and keeping track of files and directories."},{"id":"74332","q":"What is the decimal equivalent of the binary number 1101?","options":["11","13","15","9"],"answer":"2","solution":"Answer: (B) 13 Solution: To convert a binary (base-2) number to decimal (base-10), you multiply each digit by the power of 2 corresponding to its position, starting from the rightmost digit (which is $2^0$). 1101 = ($1 \\times 2^3$) + ($1 \\times 2^2$) + ($0 \\times 2^1$) + ($1 \\times 2^0$) = ($1 \\times 8$) + ($1 \\times 4$) + ($0 \\times 2$) + ($1 \\times 1$) = 8 + 4 + 0 + 1 = 13"},{"id":"74333","q":"In a relational database, what is a Primary Key?","options":["A key used to log in to the database.","A column or set of columns that uniquely identifies each row in a table.","The first column in every table.","A key that is used to link two tables together."],"answer":"2","solution":"Answer: (B) A column or set of columns that uniquely identifies each row in a table. Solution: A Primary Key is a fundamental concept in database design. Its main purpose is to enforce data integrity and ensure that every row (or record) in a table is unique. For example, in a Students table, the Roll_Number or Student_ID would be a perfect primary key because no two students can have the same ID. A key that links two tables is called a Foreign Key ."},{"id":"74334","q":"Which data structure follows the LIFO (Last-In, First-Out) principle?","options":["Queue","Array","Stack","Linked List"],"answer":"3","solution":"Answer: (C) Stack Solution: A Stack operates on the LIFO (Last-In, First-Out) principle. Think of a stack of plates: you add a new plate to the top (Push), and you remove a plate from the top (Pop). The last plate you put on is the first one you take off. A Queue follows the FIFO (First-In, First-Out) principle, like a line of people."},{"id":"74335","q":"Which of the following is considered an Input Device ONLY?","options":["Touchscreen","Headset","Scanner","Printer"],"answer":"3","solution":"Answer: (C) Scanner Solution: An Input Device sends data to the computer. An Output Device receives data from the computer. A Scanner is only an input device. It converts a physical document into a digital image and sends it to the computer. A Touchscreen is both input (when you touch it) and output (when it displays information). A Headset (with a microphone) is both input (microphone) and output (speakers). A Printer is an output device only."},{"id":"74336","q":"What is considered the \"brain\" of the computer, responsible for processing all instructions?","options":["RAM","CPU","Motherboard","Hard Disk"],"answer":"2","solution":"Answer: (B) CPU Detailed Explanation: The CPU (Central Processing Unit) performs all the arithmetic, logical, control, and input/output (I/O) operations specified by the instructions in a program. (A) RAM (Random Access Memory) is the computer's short-term (volatile) memory, where data is stored temporarily while it's being actively used. (C) Motherboard is the main circuit board that connects all the components (like the CPU, RAM, and hard drive) together. (D) Hard Disk is a non-volatile storage device used for long-term data storage."},{"id":"74337","q":"Which of the following is a type of volatile memory?","options":["ROM","RAM","SSD","CD-ROM"],"answer":"2","solution":"Answer: (B) RAM Detailed Explanation: Volatile memory requires power to maintain the stored information. Its contents are lost when the power is turned off. (B) RAM (Random Access Memory) is the primary example of volatile memory. (A) ROM (Read-Only Memory) , (C) SSD (Solid State Drive) , and (D) CD-ROM are all non-volatile , meaning they retain their data even when the power is off."},{"id":"74338","q":"Which acid is present in vinegar?","options":["Formic acid","Lactic acid","Citric acid","Acetic acid"],"answer":"4","solution":"Answer: (D) Acetic acid Explanation: Vinegar is essentially a dilute solution of acetic acid ($CH_3COOH$). (A) Formic acid: Found in the stings of ants and bees. (B) Lactic acid: Found in sour milk (curd) and is also produced in muscles during strenuous exercise. (C) Citric acid: A weak acid found in citrus fruits like lemons and oranges."},{"id":"74339","q":"Which of the following is not an operating system?","options":["Windows","Linux","Oracle","Android"],"answer":"3","solution":"Answer: (C) Oracle Detailed Explanation: An Operating System (OS) is system software that manages computer hardware and software resources and provides common services for computer programs. (A) Windows , (B) Linux , and (D) Android are all popular operating systems. (C) Oracle is primarily a company known for its Relational Database Management System (RDBMS) , which is an application software, not an OS."},{"id":"74340","q":"What is the full form of 'Malware'?","options":["Malicious Hardware","Manual Software","Malicious Software","Multi-purpose Software"],"answer":"3","solution":"Answer: (C) Malicious Software Detailed Explanation: Malware is a broad term that stands for \"malicious software.\" It refers to any software intentionally designed to cause disruption, damage, or gain unauthorized access to a computer system. Examples include viruses, worms, trojan horses, and ransomware."},{"id":"74341","q":"What does 'URL' stand for?","options":["Universal Resource Link","Uniform Resource Locator","Uniform Record Link","Universal Record Locator"],"answer":"2","solution":"Answer: (B) Uniform Resource Locator Detailed Explanation: A URL (Uniform Resource Locator) is the address of a resource on the World Wide Web. It specifies the protocol to use (like https:// ), the domain name (like www.google.com ), and the specific path to the file or page."},{"id":"74342","q":"A 'LAN' connects computers in a...","options":["Large geographical area, like a country","Limited geographical area, like a building or office","Global network using satellites","Personal network for a single user"],"answer":"2","solution":"Answer: (B) Limited geographical area, like a building or office Detailed Explanation: LAN (Local Area Network) connects devices within a limited area such as a home, school, or office building. (A) WAN (Wide Area Network) covers a large geographical area, like a city or country. The Internet is the largest WAN. (D) PAN (Personal Area Network) is for a single user, typically connecting devices like a phone, laptop, and wireless earbuds via Bluetooth."},{"id":"74343","q":"In MS Excel, what character is used to start all formulas?","options":["* (Asterisk)","= (Equals sign)","+ (Plus sign)","( (Parenthesis)"],"answer":"2","solution":"Answer: (B) = (Equals sign) Detailed Explanation: All formulas and functions in Microsoft Excel must begin with an equals sign ( = ) . This tells Excel that the contents of the cell should be calculated. For example, =SUM(A1:A5) or =B2+C2 ."},{"id":"74344","q":"Who is known as the \"Father of the Computer\"?","options":["Blaise Pascal","Charles Babbage","Bill Gates","James Gosling"],"answer":"2","solution":"Answer: (B) Charles Babbage Explanation: Charles Babbage, an English mathematician, is credited with originating the concept of a programmable computer. He designed the Analytical Engine in the 19th century, which contained the basic components of a modern computer (ALU, memory, control flow)."},{"id":"74345","q":"Which of the following is NOT an input device?","options":["Keyboard","Mouse","Scanner","Plotter"],"answer":"4","solution":"Answer: (D) Plotter Explanation: An input device is used to send data to the computer. Keyboard and Mouse are the most common input devices. A Scanner converts physical documents into digital data (input). A Plotter is an output device, similar to a printer, used for producing high-quality graphics, maps, and blueprints."},{"id":"74346","q":"Which of the following is used as a moderator in a nuclear reactor?","options":["Uranium","Boron","Heavy water","Cadmium"],"answer":"3","solution":"Answer: (C) Heavy water Explanation: A moderator is a substance used in a nuclear reactor to slow down the fast-moving neutrons produced during nuclear fission. This is necessary because slow neutrons are much more effective at causing further fission (a chain reaction). Heavy water ($D_2O$) and graphite are the most common moderators. (A) Uranium: This is the fuel that undergoes fission. (B) Boron and (D) Cadmium: These are used in control rods to absorb neutrons and control or stop the chain reaction."},{"id":"74347","q":"The CPU (Central Processing Unit) consists of which of the following main components?","options":["RAM and ROM","ALU and Control Unit","Hard Disk and Motherboard","Operating System and Application Software"],"answer":"2","solution":"Answer: (B) ALU and Control Unit Explanation: The CPU is the \"brain\" of the computer. Its two primary components are: ALU (Arithmetic Logic Unit): Performs all mathematical calculations (add, subtract) and logical operations (AND, OR, NOT). CU (Control Unit): Directs and coordinates all operations of the computer. It tells the other parts what to do."},{"id":"74348","q":"Which of the following is system software?","options":["Microsoft Word","Google Chrome","Windows 11","Adobe Photoshop"],"answer":"3","solution":"Answer: (C) Windows 11 Explanation: System Software manages the computer's hardware and provides a platform for applications to run. The Operating System (like Windows, macOS, or Linux) is the primary example. Application Software is designed to help the user perform specific tasks. MS Word (word processing), Google Chrome (web browser), and Photoshop (photo editing) are all application software."},{"id":"74349","q":"In MS Word, the \"Mail Merge\" feature is used to:","options":["Check the spelling and grammar of a document.","Automatically format a document with predefined styles.","Create personalized letters and labels from a single template and a data source.","Insert a hyperlink to a webpage."],"answer":"3","solution":"Answer: (C) Create personalized letters and labels from a single template and a data source. Explanation: Mail Merge is a powerful tool for mass communication. It allows you to take a list of contacts (like names and addresses in an Excel sheet) and merge them into a single template (like a letter or envelope) to create unique documents for each contact. and are subject to the full RCRA regulations, including the use of a manifest system for tracking waste shipments."},{"id":"74350","q":"In MS Excel, all formulas must begin with which symbol?","options":["@ (At sign)","# (Hash sign)","& (Ampersand)","= (Equals sign)"],"answer":"4","solution":"Answer: (D) = (Equals sign) Explanation: The equals sign (=) signals to Excel that the following characters constitute a formula. For example, to add cells A1 and B1, you would type =SUM(A1, B1) or =A1+B1 ."},{"id":"74351","q":"What is the keyboard shortcut to start a presentation from the very first slide in MS PowerPoint?","options":["F5","Shift + F5","Ctrl + P","Alt + F4"],"answer":"1","solution":"Answer: (A) F5 Explanation: F5: Starts the slide show from the beginning (slide 1). Shift + F5: Starts the slide show from the current slide you are editing. Ctrl + P: Opens the Print dialog. Alt + F4: Closes the application."},{"id":"74352","q":"What is the keyboard shortcut to Undo the last action in most Windows applications?","options":["Ctrl + C","Ctrl + V","Ctrl + Z","Ctrl + X"],"answer":"3","solution":"Answer: (C) Ctrl + Z Explanation: These are the most fundamental shortcuts: Ctrl + Z: Undo (reverses the last action). Ctrl + Y: Redo (reverses the last Undo). Ctrl + C: Copy (copies selected item to clipboard). Ctrl + X: Cut (removes selected item and copies it to clipboard). Ctrl + V: Paste (inserts the item from the clipboard)."},{"id":"74353","q":"According to the Swachh Survekshan 2024 results, which city became the first in Bihar to achieve the prestigious 'Water Plus' certification?","options":["Gaya","Muzaffarpur","Patna","Bhagalpur"],"answer":"3","solution":"Answer: (C) Patna Explanation: In the Swachh Survekshan 2024 rankings, the Patna Municipal Corporation achieved a major milestone by becoming the first city in Bihar to be certified as 'Water Plus'. This certification is awarded to cities that have treated 100% of their wastewater and have ensured that the treated water is reused, preventing it from being released into rivers or drains. Patna also saw a significant jump in its national ranking to 21st among million-plus cities."},{"id":"74354","q":"As per the Swachh Survekshan 2024 data, which city became the only one in Bihar to be certified as 'ODF++' (Open Defecation Free Plus Plus)?","options":["Patna","Gaya","Munger","Darbhanga"],"answer":"2","solution":"Answer: (B) Gaya Explanation: Gaya achieved the unique distinction of being the only city in Bihar to receive the 'ODF++' certification in the 2024 survey. This is a higher-level certification than ODF+. ODF: No open defecation. ODF+: ODF status plus all public and community toilets are functional and well-maintained. ODF++: ODF+ status plus the city ensures that all fecal sludge and septage are safely managed and treated, with no untreated discharge into the open."},{"id":"74355","q":"What is the primary focus of the Swachh Bharat Mission - Urban 2.0 (SBM-U 2.0), which distinguishes it from the first phase of the mission?","options":["To ensure all cities become ODF (Open Defecation Free).","To achieve the vision of \"Garbage Free Cities\" (GFC) and sustainable waste management.","To focus exclusively on cleaning major rivers.","To provide subsidies for building individual household toilets."],"answer":"2","solution":"Answer: (B) To achieve the vision of \"Garbage Free Cities\" (GFC) and sustainable waste management. Explanation: The first phase of SBM-U (2014-2019) was overwhelmingly focused on achieving ODF status by building toilets. SBM-U 2.0 (launched in October 2021) has a broader, more sustainable goal. Its main objective is to make cities \"Garbage Free\" by focusing on source segregation, scientific waste processing (treatment-based model, not just collection), and remediation of old dumpsites. It also aims to sustain the ODF gains by moving towards ODF+ and ODF++ certifications."},{"id":"74356","q":"The Plastic Waste Management (Amendment) Rules, 2024, introduced a key new provision. What was it?","options":["It banned all plastic items, including water bottles, for the first time.","It transferred all enforcement powers from Gram Panchayats to the Central Government.","It mandated that manufacturers of biodegradable plastics must obtain a certificate from the Central Pollution Control Board (CPCB).","It set a new national target to eliminate all plastic by 2025."],"answer":"3","solution":"Answer: (C) It mandated that manufacturers of biodegradable plastics must obtain a certificate from the Central Pollution Control Board (CPCB). Explanation: The 2024 amendment rules specifically target \"biodegradable plastics.\" They formally defined them as plastics that can degrade by biological processes without leaving any microplastics. To prevent \"greenwashing\" (false environmental claims), the rules now require any manufacturer of compostable or biodegradable plastic to get a certificate from the CPCB before they can market or sell their products. The rules also expanded the responsibility of Gram Panchayats for implementation in rural areas."},{"id":"74357","q":"Regarding the Jal Jeevan Mission (JJM), which aims to provide Functional Household Tap Connections (FHTC) to all rural households, what has been Bihar's performance?","options":["Bihar is lagging significantly behind the national average.","Bihar's progress is exactly at the national average.","Bihar is a top-performing state that had set an ambitious target to achieve 100% coverage by 2022.","The mission has not yet been implemented in Bihar."],"answer":"3","solution":"Answer: (C) Bihar is a top-performing state that had set an ambitious target to achieve 100% coverage by 2022. Explanation: Bihar has been one of the front-runners in implementing the Jal Jeevan Mission. While the national target was 2024 (since extended to 2028), the Bihar government set an aggressive state-level target to complete the \"Har Ghar Jal\" (water in every home) scheme by 2022, positioning it as a leader in providing rural tap water connections."},{"id":"74358","q":"A washing machine works on the principle of:","options":["Diffusion","Reverse Osmosis","Centrifugation","Dialysis"],"answer":"3","solution":"Answer: (C) Centrifugation Explanation: A washing machine's spin dryer works on the principle of centrifugal force. This is an apparent outward force experienced by objects moving in a circular path. When the drum spins rapidly, the water is forced out through the small holes in the drum, separating it from the clothes."},{"id":"74359","q":"The phenomenon of a mirage is caused by:","options":["Interference of light","Diffraction of light","Polarization of light","Total Internal Reflection (TIR) of light"],"answer":"4","solution":"Answer: (D) Total Internal Reflection (TIR) of light Explanation: A mirage is an optical illusion. It occurs in hot areas (like deserts or paved roads) where the air near the ground is much hotter and less dense than the air above it. As light from the sky travels down into this less dense air, it bends (refracts). At a certain angle, it strikes the boundary between the hot and cooler air layers and is completely reflected upwards. This reflected light appears to be coming from the ground, creating the illusion of a reflection, such as a puddle of water."},{"id":"74360","q":"What is \"Dry Ice\"?","options":["Solid Hydrogen Peroxide","Solid Carbon Dioxide","Solid Nitrogen","Solid Water (at -100\u00b0C)"],"answer":"2","solution":"Answer: (B) Solid Carbon Dioxide Explanation: Dry ice is the solid form of carbon dioxide ($CO_2$). Its most notable property is sublimation , meaning it turns directly from a solid into a gas at -78.5\u00b0C (-109.3\u00b0F), without first melting into a liquid. This makes it extremely useful for cooling."},{"id":"74361","q":"Baking soda is chemically known as:","options":["Sodium Carbonate (Na 2 CO 3 )","Sodium Bicarbonate (NaHCO 3 )","Sodium Chloride (NaCl)","Calcium Carbonate (CaCO 3 )"],"answer":"2","solution":"Answer: (B) Sodium Bicarbonate (NaHCO 3 ) Explanation: Baking Soda (also called Meetha Soda ) is Sodium Bicarbonate (NaHCO 3 ) . It is a base that reacts with acid to produce CO 2 gas, causing dough to rise. Washing Soda (or Dhovan Soda ) is Sodium Carbonate (Na 2 CO 3 ) . Common Salt is Sodium Chloride (NaCl) . Limestone/Chalk is Calcium Carbonate (CaCO 3 ) ."},{"id":"74362","q":"Which blood group is known as the \"universal recipient\"?","options":["A","B","AB","O"],"answer":"3","solution":"Answer: (C) AB Explanation: Universal Recipient (AB): A person with AB blood group has both A and B antigens on their red blood cells but no antibodies (anti-A or anti-B) in their plasma. Since they have no antibodies to attack A or B blood, they can safely receive blood from any group (A, B, AB, or O). Universal Donor (O): A person with O blood group (specifically O-negative) has no antigens on their red blood cells, so their blood can be given to anyone without causing an immune reaction."},{"id":"74363","q":"Which of the following diseases is caused by a virus?","options":["Typhoid","Cholera","Polio","Tuberculosis (TB)"],"answer":"3","solution":"Answer: (C) Polio Explanation: Polio (Poliomyelitis) is caused by the Poliovirus . Typhoid is caused by the Salmonella typhi bacterium . Cholera is caused by the Vibrio cholerae bacterium . Tuberculosis (TB) is caused by the Mycobacterium tuberculosis bacterium ."},{"id":"74364","q":"The spherical shape of a raindrop is due to which of the following phenomena?","options":["Viscosity","Atmospheric Pressure","Surface Tension","Gravity"],"answer":"3","solution":"Answer: (C) Surface Tension Explanation: Surface tension is the property of a liquid that allows it to resist an external force. It's the tendency of liquid surfaces to shrink into the minimum possible surface area. For a given volume, the shape with the smallest surface area is a sphere . This is why liquid droplets, like raindrops, naturally assume a spherical shape."},{"id":"74365","q":"Brass is an alloy (mixture) of which two metals?","options":["Copper and Tin","Zinc and Copper","Copper and Aluminum","Lead and Tin"],"answer":"2","solution":"Answer: (B) Zinc and Copper Explanation: Alloys are mixtures of metals, and they are a very common topic in BPSC exams. Brass = Copper (Cu) + Zinc (Zn) Bronze (Option A) = Copper (Cu) + Tin (Sn) Solder (related to Option D) = Lead (Pb) + Tin (Sn)"},{"id":"74366","q":"What is the chemical name for Bleaching Powder?","options":["Sodium Bicarbonate","Calcium Hypochlorite","Sodium Carbonate","Calcium Carbonate"],"answer":"2","solution":"Answer: (B) Calcium Hypochlorite ($CaOCl_2$) Explanation: Bleaching powder is chemically known as Calcium Hypochlorite. It is produced by the action of chlorine gas ($Cl_2$) on dry slaked lime ($Ca(OH)_2$). (A) Sodium Bicarbonate ($NaHCO_3$) is Baking Soda . (C) Sodium Carbonate ($Na_2CO_3$) is Washing Soda . (D) Calcium Carbonate ($CaCO_3$) is Limestone or Chalk ."},{"id":"74367","q":"Which organelle is known as the \"Powerhouse of the Cell\"?","options":["Nucleus","Ribosome","Lysosome","Mitochondria"],"answer":"4","solution":"Answer: (D) Mitochondria Explanation: Mitochondria are responsible for cellular respiration . This is the process where glucose (sugar) is broken down to produce ATP (Adenosine Triphosphate) . ATP is the main energy currency of the cell, which is why mitochondria are called the \"powerhouse.\" (A) Nucleus: Controls all cell activities and contains the genetic material (DNA). (B) Ribosome: Responsible for protein synthesis. (C) Lysosome: Known as the \"suicide bag\"; it contains digestive enzymes to break down waste."},{"id":"74368","q":"Which gland in the human body is known as the \"Master Gland\"?","options":["Thyroid Gland","Adrenal Gland","Pituitary Gland","Pancreas"],"answer":"3","solution":"Answer: (C) Pituitary Gland Explanation: The Pituitary Gland , a small, pea-sized gland located at the base of the brain, is called the \"Master Gland.\" This is because it produces hormones that control many other glands in the endocrine system, including the thyroid, adrenal glands, ovaries, and testes. (A) Thyroid Gland: Regulates metabolism (using thyroxine hormone). (B) Adrenal Gland: Produces adrenaline, the \"fight or flight\" hormone. (D) Pancreas: Produces insulin to regulate blood sugar levels."},{"id":"74369","q":"What was the name of the landing point on the Moon for ISRO's Chandrayaan-3 mission?","options":["Vikram Point","Tiranga Point","Shiv Shakti Point","Jawahar Point"],"answer":"3","solution":"Answer: (C) Shiv Shakti Point Explanation: Shiv Shakti Point: This is the specific site where the Chandrayaan-3's Vikram lander successfully soft-landed on August 23, 2023. Tiranga Point: This is the name given to the site where the Chandrayaan-2's orbiter located the crash-landed Vikram lander in 2019. Jawahar Point: This is the name of the site where the Chandrayaan-1's Moon Impact Probe (MIP) intentionally hard-landed in 2008."},{"id":"74370","q":"The 'Astra' missile, often seen in the news, is a:","options":["Surface-to-Surface Ballistic Missile","Air-to-Air Beyond Visual Range (BVR) Missile","Anti-Tank Guided Missile","Submarine-Launched Cruise Missile"],"answer":"2","solution":"Answer: (B) Air-to-Air Beyond Visual Range (BVR) Missile Explanation: The Astra is India's first indigenously developed Beyond Visual Range Air-to-Air Missile (BVRAAM) . It is designed and developed by the Defence Research and Development Organisation (DRDO). \"Air-to-Air\" means it is launched from a fighter aircraft (like the Su-30MKI or Tejas) to destroy an enemy aircraft. \"Beyond Visual Range\" (BVR) means it can engage targets at distances greater than 50-80 km, well before the pilot can visually see the enemy aircraft."},{"id":"74371","q":"What does \"Li-Fi\" (Light Fidelity) technology use to transmit data?","options":["Radio waves","Visible light from LEDs","Infrared rays","Ultrasonic waves"],"answer":"2","solution":"Answer: (B) Visible light from LEDs Explanation: Li-Fi is a wireless communication technology that uses the visible light spectrum to transmit data at very high speeds. It works by flickering the light from LED (Light Emitting Diode) bulbs on and off at extremely high, imperceptible speeds. A receiver on a device (like a laptop or phone) detects these flickers and decodes them as data. It is considered a potential supplement or alternative to Wi-Fi , which uses radio waves . Li-Fi's advantages include higher speeds, better security (light doesn't pass through walls), and no radio-frequency interference."},{"id":"74372","q":"CRISPR-Cas9, a revolutionary technology in modern science, is primarily used for:","options":["Water purification","Gene editing","Artificial intelligence","Manufacturing biofuels"],"answer":"2","solution":"Answer: (B) Gene editing Explanation: CRISPR-Cas9 (Clustered Regularly Interspaced Short Palindromic Repeats and CRISPR-associated protein 9) is a powerful and precise gene-editing tool . It acts like a pair of \"molecular scissors\" that can be programmed to find a specific sequence of DNA within a cell. Once it finds the target DNA sequence, the Cas9 enzyme (the \"scissors\") cuts the DNA. This allows scientists to remove, add, or alter specific sections of the DNA, which can be used to correct genetic defects, treat diseases, or modify organisms."},{"id":"74373","q":"What is the primary objective of India's National Green Hydrogen Mission?","options":["To replace all petrol vehicles with electric vehicles by 2030.","To make India a global hub for the production, use, and export of green hydrogen.","To mandate the use of hydrogen fuel in all government buildings.","To build new nuclear power plants using hydrogen as a coolant."],"answer":"2","solution":"Answer: (B) To make India a global hub for the production, use, and export of green hydrogen. Explanation: Green Hydrogen is hydrogen gas produced using renewable energy (like solar or wind) to power an electrolyzer, which splits water (H 2 O) into hydrogen (H 2 ) and oxygen (O 2 ). The National Green Hydrogen Mission is a major policy initiative aimed at promoting this clean fuel. Its goals are to reduce dependence on fossil fuels, decarbonize hard-to-abate sectors (like steel and fertilizer production), and position India as a leading exporter of this new fuel"},{"id":"74374","q":"The mass number of an atom is the total number of:","options":["Protons only","Protons and Electrons","Neutrons and Electrons","Protons and Neutrons"],"answer":"4","solution":"Answer: (D) Protons and Neutrons Explanation: The Atomic Number (Z) is the number of protons , which defines the element. The Mass Number (A) is the total count of particles in the nucleus. The nucleus contains protons and neutrons . Electrons have negligible mass and are not included in the mass number."},{"id":"74375","q":"What is the chemical formula for Washing Soda?","options":["NaHCO 3","Na2CO 3 .10H 2 O","Ca(OH) 2","CaSO4.H 2 O"],"answer":"2","solution":"Answer: (B) Na 2 CO 3 cdot 10H 2 O Explanation: (B) Na 2 CO 3 cdot 10H 2 O is Sodium Carbonate Decahydrate , commonly known as Washing Soda . (A) NaHCO 3 is Sodium Bicarbonate , or Baking Soda . (C) Ca(OH) 2 is Calcium Hydroxide , or Slaked Lime . (D) CaSO 4 cdot frac{1}{2}H 2 O is Calcium Sulfate Hemihydrate , or Plaster of Paris ."},{"id":"74376","q":"Which type of chemical bond is formed by the transfer of electrons from one atom to another?","options":["Ionic Bond","Covalent Bond","Hydrogen Bond","Metallic Bond"],"answer":"1","solution":"Answer: (A) Ionic Bond Explanation: An Ionic Bond forms when one atom (usually a metal) gives one or more electrons to another atom (usually a non-metal). This creates charged ions that are attracted to each other (e.g., $Na^+$ and $Cl^-$ forming $NaCl$). A Covalent Bond (B) is formed by the sharing of electrons between atoms. A Hydrogen Bond (C) is a weaker attraction between a hydrogen atom and an electronegative atom (like oxygen or nitrogen). A Metallic Bond (D) is the force holding metal atoms together, involving a \"sea\" of shared electrons."},{"id":"74377","q":"The process of a solid changing directly into a gas, without passing through the liquid state, is called:","options":["Evaporation","Condensation","Sublimation","Deposition"],"answer":"3","solution":"Answer: (C) Sublimation Explanation: Sublimation: Solid $\\rightarrow$ Gas (Example: Dry ice, camphor) Evaporation: Liquid $\\rightarrow$ Gas (at the surface) Condensation: Gas $\\rightarrow$ Liquid Deposition: Gas $\\rightarrow$ Solid (Example: Frost)"},{"id":"74378","q":"A solution with a pH of 7 is considered:","options":["Strongly Acidic","Strongly Basic","Neutral","Weakly Acidic"],"answer":"3","solution":"Answer: (C) Neutral Explanation: The pH scale measures acidity or alkalinity. pH < 7: Acidic pH = 7: Neutral (Example: Pure water) pH > 7: Basic (or Alkaline)"},{"id":"74379","q":"Which of the following non-metals is a liquid at room temperature?","options":["Carbon","Sulfur","Iodine","Bromine"],"answer":"4","solution":"Answer: (D) Bromine ($Br$) Explanation: Bromine ($Br$) is the only non-metal that is a liquid at standard room temperature. Mercury ($Hg$) is the only metal that is a liquid at room temperature. Carbon and Sulfur are solids. Iodine is also a solid (though it sublimes easily)."},{"id":"74380","q":"Bronze is an alloy primarily composed of:","options":["Copper and Zinc","Copper and Tin","Iron and Carbon","Lead and Tin"],"answer":"2","solution":"Answer: (B) Copper and Tin Explanation: Alloys are a frequent topic. Bronze: Copper ($Cu$) + Tin ($Sn$). It is used for statues, medals, and bells. Brass (A): Copper ($Cu$) + Zinc ($Zn$). Used for musical instruments and plumbing fittings. Steel (C): Iron ($Fe$) + Carbon ($C$). The primary alloy used in construction. Solder (D): Lead ($Pb$) + Tin ($Sn$). Used in electronics for joining components."},{"id":"74381","q":"Which of the following gases is the main component of natural gas, which is also found in biogas (Gobar Gas)?","options":["Ethane (C 2 H 6 )","Propane (C 3 H 8 )","Methane (CH 4 )","Butane (C 4 H 10 )"],"answer":"3","solution":"Answer: (C) Methane ($CH_4$) Explanation: Methane is the simplest alkane and the primary component (80-90%) of natural gas. It is also produced by the anaerobic decomposition of organic matter, making it the main component of biogas. Propane (B) and Butane (D) are heavier hydrocarbons that are liquefied and sold as LPG (Liquefied Petroleum Gas) for cooking."},{"id":"74382","q":"What is the chemical formula for Plaster of Paris (PoP)?","options":["CaSO 4 . H 2 O","CaSO 4 H 2 O","CaCO 3","Ca(OH) 2"],"answer":"1","solution":"Answer: (a) CaSO 4 H 2 O (Calcium Sulphate Hemihydrate) Explanation: Plaster of Paris (Calcium Sulphate Hemi hydrate) is made by heating Gypsum (A) , which is Calcium Sulphate Di hydrate ($CaSO_4 \\cdot 2H_2O$), to about 100\u00b0C (373 K), causing it to lose water molecules. When water is added back to Plaster of Paris, it re-forms into hard, solid Gypsum, which is why it's used for casts and molds. $CaCO_3$ (C) is Limestone. $Ca(OH)_2$ (D) is Slaked Lime."},{"id":"74383","q":"In the modern periodic table, elements are arranged in order of increasing:","options":["Atomic Mass","Number of Neutrons","Atomic Number","Mass Number"],"answer":"3","solution":"Answer: (C) Atomic Number Explanation: The Modern Periodic Law , given by Henry Moseley, states that the properties of elements are a periodic function of their atomic number (Z) , which is the number of protons in the nucleus. Dmitri Mendeleev's original periodic table (Option A) was arranged by increasing atomic mass , but this led to some inconsistencies (e.g., Tellurium and Iodine)."},{"id":"74384","q":"In the process of oxidation, a substance:","options":["Gains electrons","Loses electrons","Gains protons","Loses protons"],"answer":"2","solution":"Answer: (B) Loses electrons Explanation: A helpful mnemonic is \"LEO says GER\" or \"OIL RIG\" . LEO: L oss of E lectrons is O xidation. GER: Gain of Electrons is Reduction. (or) OIL: O xidation I s L oss (of electrons). RIG: R eduction I s G ain (of electrons). For example, when neutral sodium (Na) becomes a positive ion ($Na^+$), it loses an electron, so it is oxidized ."},{"id":"74385","q":"Which of the following gases is NOT considered a primary greenhouse gas?","options":["Carbon Dioxide (CO 2 )","Methane (CH 4 )","Nitrogen (N 2 )","Water Vapour (H 2 O)"],"answer":"3","solution":"Answer: (C) Nitrogen ($N_2$) Explanation: Greenhouse gases are gases that trap heat (infrared radiation) in the Earth's atmosphere. The primary greenhouse gases are Water Vapour , Carbon Dioxide , Methane , and Nitrous Oxide ($N_2O$) . Nitrogen ($N_2$) makes up about 78% of our atmosphere, but it is not a greenhouse gas because its molecular structure (two identical atoms) does not allow it to absorb and trap infrared radiation effectively."},{"id":"74386","q":"What is the SI unit of Power?","options":["Joule","Watt","Newton","Pascal"],"answer":"2","solution":"Answer: (B) Watt Explanation: Power is the rate at which work is done or energy is transferred. Work/Energy is measured in Joules (J) (Option A). Power = Work / Time = Joules / second. One Joule per second is defined as one Watt (W) . Newton (N) (Option C) is the SI unit of Force . Pascal (Pa) (Option D) is the SI unit of Pressure ."},{"id":"74387","q":"A person suffering from Myopia (nearsightedness) is advised to use:","options":["Concave lens","Convex lens","Cylindrical lens","Plain glass"],"answer":"1","solution":"Answer: (A) Concave lens Explanation: Myopia (nearsightedness) is a defect where a person can see nearby objects clearly but cannot see distant objects. This happens because the eye's lens focuses the image in front of the retina, instead of directly on it. A concave lens is a \"diverging\" lens. It spreads out the light rays before they enter the eye, allowing the eye's lens to then focus them correctly back onto the retina. Convex lens (B) is used to correct Hypermetropia (farsightedness). Cylindrical lens (C) is used to correct Astigmatism ."},{"id":"74388","q":"In a domestic electric circuit, devices like the fan, lights, and TV are connected in:","options":["Series","Parallel","A combination of series and parallel","They are not connected to each other"],"answer":"2","solution":"Answer: (B) Parallel Explanation: Household appliances are connected in parallel for two main reasons: Independent Operation: If one appliance (like a bulb) fuses or is switched off, the others continue to work. In a series circuit, if one bulb fused, the entire circuit would break. Constant Voltage: Every appliance in a parallel circuit receives the same full voltage from the main supply (e.g., 220V in India), allowing it to operate at its correct power rating. In a series circuit, the voltage would be divided among the appliances."},{"id":"74389","q":"How does heat from the Sun reach the Earth?","options":["Conduction","Convection","Radiation","Evaporation"],"answer":"3","solution":"Answer: (C) Radiation Explanation: There are three modes of heat transfer: Conduction: Heat transfer through direct contact (mostly in solids). Convection: Heat transfer through the movement of fluids (liquids or gases). Radiation: Heat transfer through electromagnetic waves (like light and infrared). Radiation is the only mode that does not require a medium (it can travel through the vacuum of space). Since there is a vacuum between the Sun and Earth, the heat can only travel via radiation."},{"id":"74390","q":"The working of a hydraulic lift or hydraulic brake is based on which law?","options":["Pascal's Law","Archimedes' Principle","Newton's Second Law","Bernoulli's Principle"],"answer":"1","solution":"Answer: (A) Pascal's Law Explanation: Pascal's Law states that pressure applied to an enclosed fluid is transmitted undiminished to every portion of the fluid and the walls of the containing vessel. In a hydraulic lift, a small force on a small-area piston creates pressure, which is transmitted through the fluid to a large-area piston, creating a large force. Archimedes' Principle (B) explains buoyancy and why ships float. Bernoulli's Principle (D) explains how the wings of an airplane generate lift."},{"id":"74391","q":"The 'pitch' (shrillness or highness) of a sound is determined by its:","options":["Amplitude","Frequency","Wavelength","Speed"],"answer":"2","solution":"Answer: (B) Frequency Explanation: Frequency: This is the number of vibrations per second (measured in Hertz, Hz). A high frequency produces a high-pitched (shrill) sound, like a whistle. A low frequency produces a low-pitched (bass) sound, like a drum. Amplitude (A): This determines the loudness or intensity of the sound. A high amplitude means a loud sound."},{"id":"74392","q":"Why does the sky appear blue on a clear day?","options":["Dispersion of light by water droplets","Scattering of light by dust particles and air molecules","Refraction of light by different layers of the atmosphere","Reflection of light from the ocean"],"answer":"2","solution":"Answer: (B) Scattering of light by dust particles and air molecules Explanation: This phenomenon is called Rayleigh scattering . When sunlight enters Earth's atmosphere, it interacts with the tiny gas molecules (like nitrogen and oxygen) and dust particles. These particles scatter shorter wavelengths of light (like blue and violet) much more effectively than longer wavelengths (like red and orange). Since our eyes are more sensitive to blue than violet, the sky appears blue."},{"id":"74393","q":"The material used for an electric fuse wire must have:","options":["High melting point and high resistance","Low melting point and high resistance","Low melting point and low resistance","High melting point and low resistance"],"answer":"2","solution":"Answer: (B) Low melting point and high resistance Explanation: A fuse is a safety device. Its purpose is to melt and break the circuit if the current becomes dangerously high. Low Melting Point: This is the most crucial property. The wire must melt before the appliance or household wiring is damaged. High Resistance: Compared to the copper wires in the circuit, the fuse wire (often an alloy of lead and tin) has a higher resistance. This causes it to heat up significantly ($P = I^2R$) and melt when the current ($I$) surges."}];
let idx=0, answers={}, timerSec=65*60, timerInt=null;

function render(){
  const q=DATA[idx];
  if(!q){document.getElementById('qText').textContent='No data.';return;}
  document.getElementById('qNum').textContent=idx+1;
  document.getElementById('qTotal').textContent=DATA.length;
  document.getElementById('qText').textContent=q.q;
  document.getElementById('opts').innerHTML=q.options.map((o,i)=>
    `<div class="option ${answers[idx]==(i+1)?'selected':''}" onclick="select(${i+1})">${String.fromCharCode(65+i)}. ${o}</div>`
  ).join('');
}
window.select=o=>{answers[idx]=o; render();};
window.prev=()=>{if(idx>0){idx--; render();}};
window.next=()=>{if(idx<DATA.length-1){idx++; render();}};

function submitTest(){
  clearInterval(timerInt);
  let c=0; for(let i=0;i<DATA.length;i++){if(answers[i]==DATA[i].answer)c++;}
  const pct=Math.round(c/DATA.length*100)||0;
  document.getElementById('qCard').classList.add('hidden');
  document.getElementById('resCard').classList.remove('hidden');
  document.getElementById('score').textContent=pct+'%';
  document.getElementById('detail').innerHTML='<b>'+c+'/'+DATA.length+'</b> correct';
}

function tick(){timerSec--; document.getElementById('timer').textContent=Math.floor(timerSec/60)+':'+String(timerSec%60).padStart(2,'0'); document.getElementById('bar').style.width=(timerSec/(65*60)*100)+'%'; if(timerSec<=0){clearInterval(timerInt); submitTest();}}

render(); timerInt=setInterval(tick,1000);
</script>
</body></html>
