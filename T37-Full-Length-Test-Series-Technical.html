<script>
const DATA=[{"id":"80909","q":"\"Green Muffler\" is a technique related to the control of:","options":["Air Pollution","Water Pollution","Noise Pollution (using vegetation belts)","Soil Erosion"],"answer":"3","solution":"The \"Green Muffler\" scheme involves planting rows of trees and shrubs in noisy places (like roadsides and industrial areas) to reduce noise pollution. The dense vegetation acts as a sound barrier, absorbing and deflecting sound waves, thereby reducing the noise level reaching nearby residential areas."},{"id":"80910","q":"Under the SWM Rules 2016, \"Street Sweepings\" should be:","options":["Burned locally","Washed into the drains","Collected separately and transported to landfill/processing","Left on the median"],"answer":"3","solution":"According to the Solid Waste Management (SWM) Rules, 2016, burning waste (including sweepings) is prohibited to prevent air pollution. Washing them into drains causes clogging. They must be collected separately and transported to appropriate processing facilities or sanitary landfills."},{"id":"80911","q":"Calculate the \"Sludge Volume Index\" (SVI) if the settled sludge volume after 30 minutes in a 1-liter cylinder is 300 mL and the Mixed Liquor Suspended Solids (MLSS) concentration is 3000 mg/L.","options":["10 mL/g","100 mL/g","150 mL/g","300 mL/g"],"answer":"2","solution":"SVI is calculated as the volume occupied by one gram of sludge. Formula: Given: Settled Volume = 300 mL/L MLSS = 3000 mg/L"},{"id":"80912","q":"Which International Standard refers to \"Environmental Management Systems\" (EMS)?","options":["ISO 9001","ISO 14001","ISO 22000","ISO 45001"],"answer":"2","solution":"ISO 14001: Environmental Management Systems (EMS). ISO 9001: Quality Management Systems. ISO 45001: Occupational Health and Safety. ISO 22000: Food Safety Management."},{"id":"80913","q":"A landfill cell has dimensions 50m 50m. If the waste is compacted to a height of 2m with a density of 800 kg/m 3 , what is the total mass of waste in the cell?","options":["2,000 tonnes","4,000 tonnes","5,000 tonnes","8,000 tonnes"],"answer":"2","solution":"Volume of the cell = . Mass = Converting to tonnes (1 tonne = 1000 kg): Mass = 4,000,000 / 1000 = 4,000 tonnes."},{"id":"80914","q":"The \"National Air Quality Monitoring Programme\" (NAMP) is executed by:","options":["ISRO","CPCB","IMD","NITI Aayog"],"answer":"2","solution":"The Central Pollution Control Board (CPCB) executes the Nation Air Quality Monitoring Programme (NAMP) in association with State Pollution Control Boards (SPCBs) to determine the status and trends of ambient air quality in India."},{"id":"80915","q":"Which of the following is a \"Criteria Pollutant\" for calculation of the Air Quality Index (AQI) in India?","options":["Carbon Dioxide (CO 2 )","Methane (CH 4 )","Ammonia (NH 3 )","CFCs"],"answer":"3","solution":"The National Air Quality Index (AQI) in India considers 8 pollutants: PM 10 , PM 2.5 , NO 2 , SO 2 , CO, O 3 , NH 3 (Ammonia), and Pb (Lead). Carbon Dioxide and Methane are greenhouse gases but are not part of the standard daily AQI calculation."},{"id":"80916","q":"\"Reverse Logistics\" is primarily associated with:","options":["Collection of raw material for manufacturing","Movement of goods from consumer back to producer (e.g., for recycling/EPR)","Transport of waste to landfill","Flow of leachate in a drain"],"answer":"2","solution":"Reverse Logistics refers to the supply chain process of moving goods from their typical final destination (the consumer) back to the producer or a processing point. This is crucial for Extended Producer Responsibility (EPR), recycling, and product take-back schemes."},{"id":"80917","q":"Which metal is known as a \"Cumulative Poison\" in the human body?","options":["Sodium","Potassium","Lead","Calcium"],"answer":"3","solution":"Lead (Pb) is a heavy metal that is not easily excreted by the body. It accumulates in tissues (bones, brain, kidneys) over time, leading to \"cumulative poisoning\" or chronic toxicity. Sodium, Potassium, and Calcium are essential electrolytes."},{"id":"80918","q":"A compost pile has 100 kg of waste with 60% moisture content (MC) mixed with 50 kg of dry sawdust (10% MC). What is the moisture content of the combined mixture?","options":["35.5%","43.3%","50.0%","55.5%"],"answer":"2","solution":"Total Mass = 100 + 50 = 150kg. Water in waste = = 60kg. Water in sawdust = = 5kg. Total Water = 60 + 5 = 65kg."},{"id":"80919","q":"In the context of waste water, \"Sullage\" typically excludes:","options":["Bath water","Kitchen water","Laundry water","Human excreta"],"answer":"4","solution":"Sullage (or Greywater) refers to wastewater from household sinks, showers, and baths. It excludes wastewater containing human excreta (feces and urine), which is referred to as \"Sewage\" or \"Blackwater\"."},{"id":"80920","q":"\"Pyrolysis\" of tires typically yields:","options":["Carbon Black, Pyrolysis Oil, and Steel","Only Ash","Compost","Methane gas only"],"answer":"1","solution":"Pyrolysis is the thermal decomposition of materials in the absence of oxygen. When applied to tires, it recovers valuable byproducts: Pyrolysis Oil (fuel), Carbon Black (industrial use), Steel wire (scrap metal), and some hydrocarbon gas."},{"id":"80921","q":"The \"Water (Prevention and Control of Pollution) Cess Act\" was enacted to:","options":["Ban water use","Collect a cess (tax) on water consumption to augment the resources of Pollution Control Boards","Privatize water rivers","Stop rainfall"],"answer":"2","solution":"The Water Cess Act (1977) provides for the levy and collection of a cess on water consumed by certain industries and local authorities. The revenue generated is used to augment the financial resources of the Central and State Pollution Control Boards."},{"id":"80922","q":"The term \"NIMBY\" syndrome in waste management stands for:","options":["Not In My Back Yard","New Integrated Management By Year","No Incineration Many Benefits Yielded","Never Include Municipal Bio-waste Yards"],"answer":"1","solution":"NIMBY stands for \"Not In My Back Yard.\" It refers to the opposition by residents to a proposal for a new development (like a landfill, incinerator, or recycling plant) close to them, even if they acknowledge that such facilities are needed by society generally."},{"id":"80923","q":"A city generates 50,000 kg of solid waste per day. If the density of the waste in the truck is 500 kg/m 3 and the truck capacity is 10 m\u00b3, how many trips per day are required to collect all the waste?","options":["5 trips","8 trips","10 trips","20 trips"],"answer":"3","solution":"Capacity of one truck (in kg) = . Total Waste generated = 50,000 kg. Number of trips = = = 10 trips."},{"id":"80924","q":"The \"Activated Carbon Adsorption\" process is best suited for removing:","options":["Large suspended solids","Dissolved organics and colour","Nitrates","Hardness"],"answer":"2","solution":"Activated carbon has a vast surface area and is highly effective at adsorbing dissolved organic compounds (which cause taste, odor, and color) and micro-pollutants (like pesticides). It is not efficient for large suspended solids (which clog it) or hardness removal."},{"id":"80925","q":"Which microorganism is most effective in the \"Bio-leaching\" of copper and gold from electronic waste?","options":["E. coli","Thiobacillus ferrooxidans","Salmonella","Giardia"],"answer":"2","solution":"Thiobacillus ferrooxidans (now often called Acidithiobacillus ferrooxidans) is an acidophilic bacteria used in bio-hydrometallurgy. It oxidizes iron and sulfur, creating an acidic environment that leaches metals like copper and gold from ores and e-waste."},{"id":"80926","q":"Under the Battery Waste Management Rules, 2022, the \"Producer\" must register with:","options":["State Pollution Control Board only","Central Pollution Control Board (via centralized portal)","Ministry of Power","Local Municipal Corporation"],"answer":"2","solution":"The 2022 Rules introduced a centralized online portal system. Producers (manufacturers, importers) must register with the Central Pollution Control Board (CPCB) through this portal to fulfill their Extended Producer Responsibility (EPR) obligations."},{"id":"80927","q":"In an anaerobic digester, \"Acidogenesis\" is immediately followed by:","options":["Hydrolysis","Acetogenesis","Methanogenesis","Oxidation"],"answer":"2","solution":"The stages of anaerobic digestion are: Hydrolysis (Complex organics to simple monomers) Acidogenesis (Monomers to Volatile Fatty Acids/VFAs) Acetogenesis (VFAs to Acetate, H 2 , CO 2 ) Methanogenesis (Acetate/H 2 to Methane) Thus, Acidogenesis is followed by Acetogenesis."},{"id":"80928","q":"Which Act governs the \"Public Liability Insurance\" for handling hazardous substances?","options":["The Environment Protection Act, 1986","The Public Liability Insurance Act, 1991","The Factories Act, 1948","The Disaster Management Act, 2005"],"answer":"2","solution":"The Public Liability Insurance Act, 1991, was enacted to provide immediate relief to persons affected by accidents occurring while handling hazardous substances. It mandates industries handling such substances to take out insurance policies."},{"id":"80929","q":"\"Bio-medical waste\" generated from households (e.g., insulin syringes) should be:","options":["Mixed with wet waste","Handed over separately as Domestic Hazardous Waste","Flushed down the toilet","Burnt in the backyard"],"answer":"2","solution":"According to SWM Rules 2016, hazardous waste generated at the household level (like paint cans, pesticide bottles, and medical waste like syringes) constitutes \"Domestic Hazardous Waste.\" It must be handed over separately to waste collectors, not mixed with general wet or dry waste."},{"id":"80930","q":"If the sound pressure levels from two independent sources are 70 dB and 70 dB, what is the combined sound pressure level?","options":["70 dB","73 dB","76 dB","140 dB"],"answer":"2","solution":"Decibels are logarithmic. When adding two equal sound sources, the level increases by 3 dB. Formula: (where n is the number of equal sources)."},{"id":"80931","q":"Which of the following is NOT an Advanced Oxidation Process (AOP)?","options":["Ozonation","Fenton's Reagent","UV/H 2 O 2","Plain Sedimentation"],"answer":"4","solution":"Advanced Oxidation Processes (AOPs) involve the generation of highly reactive hydroxyl radicals ( ) to oxidize persistent contaminants. Examples include Ozone (O 3 ), Fenton's Reagent (H 2 O 2 + ), and UV/Peroxide. Plain Sedimentation is a physical separation process using gravity, not a chemical oxidation process."},{"id":"80932","q":"In a sanitary landfill, \"Methane\" is lighter than air, while \"Carbon Dioxide\" is:","options":["Lighter than air","Heavier than air (tends to sink)","Same density as air","Unstable"],"answer":"2","solution":"Methane (CH 4 , MW 16) is lighter than air (MW 29). Carbon Dioxide (CO 2 , MW 44) is significantly heavier than air. This causes CO 2 to accumulate in low-lying areas or the bottom of poorly ventilated spaces, posing an asphyxiation risk."},{"id":"80933","q":"\"Cradle-to-Cradle\" (C2C) design concept emphasizes:","options":["Disposal at the end of life","Designing products so materials can be perpetually recycled/regenerated (c) Increasing the lifespan of landfills","Reducing transport costs"],"answer":"2","solution":"Cradle-to-Cradle is a biomimetic approach to design. Unlike \"Cradle-to-Grave\" (which ends in disposal), C2C models industry on nature's processes, where materials are viewed as nutrients circulating in healthy, safe metabolisms (biological or technical cycles), allowing perpetual recycling."},{"id":"80934","q":"Which filter is most suitable for dewatering sludge in large STPs?","options":["Slow Sand Filter","Rapid Sand Filter","Filter Press (Belt or Plate)","Trickling Filter"],"answer":"3","solution":"Slow and Rapid Sand filters are used for liquid water filtration, not sludge. Trickling filters are for biological treatment. Filter Presses (Belt Filter Press or Plate and Frame Press) are mechanical devices specifically designed to squeeze water out of sludge (dewatering) to produce a solid cake."},{"id":"80935","q":"A \"Combined Sewer System\" carries:","options":["Only industrial waste","Only domestic sewage","Both sanitary sewage and stormwater runoff in the same pipe","Sewage and drinking water"],"answer":"3","solution":"A Combined Sewer System is designed to collect rainwater runoff, domestic sewage, and industrial wastewater in the same pipe. During heavy rainfall, these systems often overflow (Combined Sewer Overflow - CSO), causing pollution issues."},{"id":"80936","q":"Under C&D Waste Rules, who is responsible for the transport of waste to the processing facility?","options":["The Municipality only","The Waste Generator (for large generators)","The State Government","NGOs"],"answer":"2","solution":"Under the Construction and Demolition (C&D) Waste Management Rules, 2016, large generators (generating more than 20 tons/day or 300 tons/project) are responsible for segregating the waste and transporting it to the processing facility or collection center at their own cost."},{"id":"80937","q":"An aeration tank has a volume of 2000 m\u00b3. If the sewage flow rate is 10 MLD (10,000~m^{3}/day), what is the Hydraulic Retention Time (HRT)?","options":["2.4 hours","4.8 hours","6.5 hours","12.0 hours"],"answer":"2","solution":"Volume = 2000m 3 . Flow Rate = 10,000 m 3 /day. HRT (days) = 2000/10000 = 0.2 days. HRT (hours) = = 4.8 hours."},{"id":"80938","q":"The \"Minamata Convention\" prohibits the primary mining of:","options":["Gold","Lead","Mercury","Silver"],"answer":"3","solution":"The Minamata Convention on Mercury is an international treaty designed to protect human health and the environment from anthropogenic emissions and releases of mercury and mercury compounds. It includes a ban on new mercury mines and the phase-out of existing ones."},{"id":"80939","q":"\"Vermiwash\" is:","options":["The water used to wash worms","A liquid fertilizer collected after passing water through a column of worm action","A pesticide","The leachate from a hazardous landfill"],"answer":"2","solution":"Vermiwash is a liquid extract collected from a vermicomposting unit. As water passes through the column of worms and compost, it washes the nutrients, enzymes, and coelomic fluid from the earthworms, resulting in a nutrient-rich liquid fertilizer."},{"id":"80940","q":"The \"Biomedical Waste Management Rules\" do NOT apply to:","options":["Radioactive waste","Vaccination camps","Blood donation camps","First aid rooms of schools"],"answer":"1","solution":"The Bio-medical Waste Management Rules apply to all persons who generate, collect, receive, store, transport, treat, dispose, or handle bio-medical waste. However, they explicitly do not apply to Radioactive Wastes (covered under the Atomic Energy Act) or Municipal Solid Wastes."},{"id":"80941","q":"In a trickling filter, the \"Hydraulic Loading Rate\" is expressed as:","options":["kg BOD/m 3 /day","m 3 /m 2 /day","hours","mg/L"],"answer":"2","solution":"Hydraulic Loading Rate (HLR) refers to the volume of liquid applied per unit area of the filter per day (m 3 /m 2 /day). Option (a) refers to Organic Loading Rate (OLR)."},{"id":"80942","q":"\"Gasification\" differs from \"Incineration\" because Gasification:","options":["Occurs in excess oxygen","Occurs in limited oxygen (sub-stoichiometric)","Produces only ash and heat","Is an exothermic process only"],"answer":"2","solution":"Incineration is full combustion in excess oxygen, producing heat, CO 2 , and water. Gasification involves partial combustion in limited (sub-stoichiometric) oxygen/air, producing a combustible gas (Syngas - CO and H 2 )."},{"id":"80943","q":"Which of the following waste streams has the highest Carbon-to-Nitrogen (C/N) ratio?","options":["Food waste","Sewage sludge","Sawdust/Wood chips","Grass clippings"],"answer":"3","solution":"Food waste and grass clippings are \"Greens\" (High Nitrogen, Low C/N ~ 15-20:1). Sawdust, dry leaves, and wood chips are \"Browns\" (High Carbon, Very High C/N 200-500:1). High C/N ratio materials degrade slowly unless mixed with nitrogen-rich materials."},{"id":"80944","q":"The \"Ring and Ball Apparatus\" is used to determine which property of bitumen or tar used in road works (often using plastic waste)?","options":["Ductility","Softening Point","Penetration Value","Viscosity"],"answer":"2","solution":"The Ring and Ball test determines the Softening Point of bitumen\u2014the temperature at which the substance attains a particular degree of softness under specified conditions of test. This is crucial for determining the temperature susceptibility of the binder."},{"id":"80945","q":"The \"Kyoto Protocol\" operationalized the:","options":["United Nations Framework Convention on Climate Change (UNFCCC)","Convention on Biological Diversity (CBD)","Vienna Convention","Ramsar Convention"],"answer":"1","solution":"The Kyoto Protocol is an international treaty that operationalizes the United Nations Framework Convention on Climate Change (UNFCCC) by committing industrialized countries and economies in transition to limit and reduce greenhouse gas (GHG) emissions."},{"id":"80946","q":"Which zone of a lake is closest to the shore and supports rooted vegetation?","options":["Limnetic Zone","Profundal Zone","Littoral Zone","Benthic Zone"],"answer":"3","solution":"Littoral Zone: The shallow, near-shore area where sunlight penetrates to the sediment, allowing aquatic plants (macrophytes) to grow. Limnetic Zone: Open water surface layer. Profundal Zone: Deep water where sunlight does not penetrate."},{"id":"80947","q":"\"Fecal Sludge\" refers to:","options":["Fresh sewage in pipes","Sludge removed from on-site sanitation systems (like septic tanks/pit latrines)","Industrial sludge","Compost Form"],"answer":"2","solution":"Fecal sludge is the raw or partially digested slurry (solid and liquid) that is contained in on-site sanitation systems such as pit latrines and septic tanks. It differs from \"sewage,\" which typically refers to wastewater transported via sewers."},{"id":"80948","q":"A sedimentation tank has a surface area of 200m 2 . If the flow rate is 6000m 3 /day, what is the Surface Overflow Rate (SOR)?","options":["20m 3 /m 2 /day","30m 3 /m 2 /day","40m 3 /m 2 /day","60m 3 /m 2 /day"],"answer":"2","solution":"Surface Overflow Rate (SOR) = ("},{"id":"80949","q":"The \"Environment Compensation\" (EC) regime is based on the principle of:","options":["Profit Sharing","Polluter Pays","Corporate Social Responsibility","Subsidy"],"answer":"2","solution":"The National Green Tribunal (NGT) and CPCB impose \"Environmental Compensation\" on industries/individuals damaging the environment. This is grounded in the \"Polluter Pays Principle,\" which dictates that those who produce pollution should bear the costs of managing it to prevent damage to human health or the environment."},{"id":"80950","q":"\"Yellow Haze\" or photochemical smog is primarily caused by:","options":["Sulphur Dioxide","Nitrogen Dioxide (NO 2 ) and Sunlight","Carbon Monoxide","Water vapour"],"answer":"2","solution":"Photochemical smog (often visible as a yellow/brown haze) is formed by the reaction of sunlight, Nitrogen Oxides (NO x ), and Volatile Organic Compounds (VOCs). Nitrogen Dioxide (NO 2 ) gives the smog its characteristic brownish/yellow color."},{"id":"80951","q":"Which of the following plastic resins is most difficult to recycle and is often phased out?","options":["PET (Code 1)","HDPE (Code 2)","PVC (Code 3)","PP (Code 5)"],"answer":"3","solution":"PVC (Polyvinyl Chloride - Code 3) contains chlorine and various additives. It is difficult to recycle with other plastics (it contaminates PET/HDPE streams) and releases harmful dioxins if burned. Therefore, it is often targeted for phase-outs in packaging."},{"id":"80952","q":"Determine the height of a chimney required to disperse sulphur dioxide (SO2) emissions of 100 kg/hr using the formula H= , where Q is in kg/hr.","options":["42.5 m","50.2 m","55.7 m","65.0 m"],"answer":"3","solution":"Formula:"},{"id":"80953","q":"In the context of EIA, \"Accreditation\" of EIA consultant organizations in India is granted by:","options":["MoEF&CC directly","QCI/NABET (Quality Council of India)","NGT","IITs"],"answer":"2","solution":"To ensure quality, the Ministry of Environment, Forest and Climate Change (MoEF&CC) mandates that EIA consultants must be accredited by the National Accreditation Board for Education and Training (NABET), which is a constituent board of the Quality Council of India (QCI)."},{"id":"80954","q":"\"Geotextiles\" are used in landfills primarily for:","options":["Waterproofing","Separation and filtration","Gas generation","aesthetics"],"answer":"2","solution":"Geotextiles are permeable fabrics. In landfills, they are used for separation (keeping drainage layers separate from waste) and filtration (allowing liquid to pass into drainage pipes while blocking solid particles to prevent clogging). (Geomembranes are used for waterproofing)."},{"id":"80955","q":"The \"Dobson Unit\" (DU) is used to measure the thickness of:","options":["Landfill liner","Ozone layer","Sludge cake","Plastic film"],"answer":"2","solution":"The Dobson Unit (DU) is a unit of measurement for the total amount of ozone in the atmosphere above a point. It effectively measures the \"thickness\" of the ozone layer if it were compressed to standard temperature and pressure (100 DU = 1 mm thickness)."},{"id":"80956","q":"The \"Cone of Depression\" is a term associated with:","options":["Air pollution dispersion","Groundwater drawdown due to pumping","Landfill settlement","Noise attenuation"],"answer":"2","solution":"When water is pumped from a well, the water table around the well lowers, forming a cone-shaped depression in the groundwater surface. This is known as the \"Cone of Depression.\""},{"id":"80957","q":"What is the primary function of a \"Baffle Wall\" in a Septic Tank?","options":["To support the roof","To prevent short-circuiting and retain scum/sludge","To increase aeration","To measure flow"],"answer":"2","solution":"Baffle walls (inlet and outlet baffles) in septic tanks prevent the direct flow of sewage from inlet to outlet (short-circuiting). They ensure the wastewater spends enough time in the tank for settling and prevent floating scum and settled sludge from escaping with the effluent."},{"id":"80958","q":"The \"Zero Waste\" philosophy targets:","options":["100% incineration","100% landfilling","Maximizing resource recovery and minimizing final disposal","Stopping all industrial production"],"answer":"3","solution":"Zero Waste is a philosophy that encourages the redesign of resource life cycles so that all products are reused. It aims to maximize recycling and recovery, reducing the amount of waste sent to landfills and incinerators to as close to zero as possible."},{"id":"80959","q":"The \"National Green Hydrogen Mission\" aims to decarbonize which sectors?","options":["Refining and Fertilizer","IT Sector","Education","Banking"],"answer":"1","solution":"The mission focuses on hard-to-abate sectors. The initial demand for Green Hydrogen is expected to come from the industrial sectors that currently use grey hydrogen (derived from fossil fuels), primarily Petroleum Refining and Fertilizer production."},{"id":"80960","q":"Which of the following is a \"Non-Point Source\" of pollution?","options":["Factory chimney","Sewage pipe outlet","Agricultural runoff from a field","Landfill vent pipe"],"answer":"3","solution":"Point Sources: Discharges from a specific, identifiable location (pipe, chimney, ditch). Non-Point Sources: Diffuse sources without a single point of origin, such as agricultural runoff (fertilizers/pesticides washing off fields) or urban stormwater runoff."},{"id":"80961","q":"\"Carbon Sequestration\" refers to:","options":["Release of carbon into the atmosphere","Capture and long-term storage of atmospheric carbon dioxide","Burning of carbon fuels","Measuring carbon footprint"],"answer":"2","solution":"Carbon Sequestration is the process of capturing and storing atmospheric carbon dioxide (CO 2 ). It is one method of reducing the amount of carbon dioxide in the atmosphere to reduce global climate change."},{"id":"80962","q":"\"Poly-Aluminum Chloride\" (PAC) is a modern alternative to which traditional coagulant?","options":["Alum","Chlorine","Bleaching Powder","Lime"],"answer":"1","solution":"PAC is a coagulant used in water treatment. It is often used as a replacement for Alum (Aluminum Sulphate) because it works effectively over a wider pH range, produces less sludge, and requires lower dosage."},{"id":"80963","q":"The \"Break-point Chlorination\" is the point where:","options":["Chlorine demand is zero","Combined residual chlorine is maximum","All combined chlorine is oxidized, and free residual chlorine begins to appear","Smell of chlorine vanishes"],"answer":"3","solution":"Break-point chlorination occurs when enough chlorine has been added to satisfy the chlorine demand and oxidize all ammonia and organic amines (combined chlorine). Beyond this point, any further addition of chlorine results in a proportional increase in \"free residual chlorine\" (HOCl and OCl-)."},{"id":"80964","q":"The \"Manifest\" for hazardous waste transport must be signed and dated by:","options":["Generator, Transporter, and Receiver (TSDF)","Only the Generator","Only the Transporter","The District Magistrate"],"answer":"1","solution":"The Hazardous Waste Manifest system tracks waste from \"cradle to grave.\" It requires signatures from every party handling the waste: the Generator (who creates it), the Transporter (who moves it), and the Receiver/TSDF operator (who disposes/treats it) to ensure accountability."},{"id":"80965","q":"A \"Grab Sample\" represents the characteristics of the water:","options":["Over a period of 24 hours","At the specific time and place of collection only","After mixing multiple samples","After treatment"],"answer":"2","solution":"A Grab Sample is a single sample collected at a specific spot at a specific time. It provides a \"snapshot\" of the water quality at that exact moment, unlike a composite sample which represents the average over time."},{"id":"80966","q":"A wastewater treatment plant receives a flow of 5 MLD (Million Liters per Day). If the influent BOD is 200mg/L and the effluent BOD is required to be 20~mg/L, what is the required BOD removal efficiency?","options":["80%","85%","90%","95%"],"answer":"3","solution":""},{"id":"80967","q":"\"Biomethanation\" is the process of:","options":["Burning biomass","Anaerobic digestion of organic waste to produce biogas","Composting with worms","Drying waste in the sun"],"answer":"2","solution":"Biomethanation is a process by which organic material is microbiologically converted under anaerobic conditions to biogas (primarily methane and carbon dioxide). It is also known as Anaerobic Digestion."},{"id":"80968","q":"The \"Hazardous Waste Management Rules\" were last significantly amended in:","options":["2000","2008","2016","2024"],"answer":"3","solution":"The primary current framework is the \"Hazardous and Other Wastes (Management and Transboundary Movement) Rules, 2016 ,\" which superseded the 2008 rules. While minor amendments occur (e.g., 2019, 2022), 2016 is the major legislative milestone listed in the options."},{"id":"80969","q":"In the context of air pollution, \"PM 2.5\" refers to particulate matter with a diameter:","options":["Less than 2.5 millimeters","Less than or equal to 2.5 micrometers","Exactly 2.5 nanometers","Greater than 2.5 centimeters"],"answer":"2","solution":"PM 2.5 refers to fine particulate matter with an aerodynamic diameter of 2.5 micrometers ( m) or less. These particles are small enough to penetrate deep into the lungs and enter the bloodstream."},{"id":"80970","q":"The \"Swachh Survekshan\" is conducted by:","options":["Ministry of Rural Development","Ministry of Housing and Urban Affairs (MoHUA)","NITI Aayog","WHO"],"answer":"2","solution":"Swachh Survekshan is an annual survey of cleanliness, hygiene, and sanitation in cities and towns across India. It is launched and conducted by the Ministry of Housing and Urban Affairs (MoHUA)."},{"id":"80971","q":"\"Bio-medical waste\" does NOT include:","options":["Animal anatomical waste","Microbiology waste","General municipal waste (kitchen waste) from hospitals","Discarded medicines"],"answer":"3","solution":"Bio-medical waste refers to waste generated during diagnosis, treatment, or immunization. General waste like food scraps (kitchen waste) or office paper generated in a hospital is treated as Municipal Solid Waste, not Bio-medical waste."},{"id":"80972","q":"Which bacteria is used as a biological indicator for sterilization efficiency in autoclaves?","options":["Bacillus stearothermophilus","E. coli","Vibrio cholerae","Salmonella typhi"],"answer":"1","solution":"Geobacillus stearothermophilus (formerly Bacillus stearothermophilus) spores are highly heat-resistant. If an autoclave cycle can kill these spores, it is confirmed to be effective at sterilizing other, less resistant pathogens."},{"id":"80973","q":"Using the \"Arithmetic Increase Method\", if the population of a town was 20,000 in 2000 and 24,000 in 2010, what is the forecasted population for 2020?","options":["26,000","28,000","30,000","32,000"],"answer":"2","solution":"Arithmetic Increase Method assumes a constant rate of increase (dP/dt = K). Population in 2000 (P 1 ) = 20,000. Population in 2010 (P 2 ) = 24,000. Increase per decade = 24,000 - 20,000 = 4,000. Forecast for 2020 (P 3 ) = P 2 + Increase. P 3 = 24,000 + 4,000 = 28,000."}];
let idx=0, answers={}, timerSec=65*60, timerInt=null;

function render(){
  const q=DATA[idx];
  if(!q){document.getElementById('qText').textContent='No data.';return;}
  document.getElementById('qNum').textContent=idx+1;
  document.getElementById('qTotal').textContent=DATA.length;
  document.getElementById('qText').textContent=q.q;
  document.getElementById('opts').innerHTML=q.options.map((o,i)=>
    `<div class="option ${answers[idx]==(i+1)?'selected':''}" onclick="select(${i+1})">${String.fromCharCode(65+i)}. ${o}</div>`
  ).join('');
}
window.select=o=>{answers[idx]=o; render();};
window.prev=()=>{if(idx>0){idx--; render();}};
window.next=()=>{if(idx<DATA.length-1){idx++; render();}};

function submitTest(){
  clearInterval(timerInt);
  let c=0; for(let i=0;i<DATA.length;i++){if(answers[i]==DATA[i].answer)c++;}
  const pct=Math.round(c/DATA.length*100)||0;
  document.getElementById('qCard').classList.add('hidden');
  document.getElementById('resCard').classList.remove('hidden');
  document.getElementById('score').textContent=pct+'%';
  document.getElementById('detail').innerHTML='<b>'+c+'/'+DATA.length+'</b> correct';
}

function tick(){timerSec--; document.getElementById('timer').textContent=Math.floor(timerSec/60)+':'+String(timerSec%60).padStart(2,'0'); document.getElementById('bar').style.width=(timerSec/(65*60)*100)+'%'; if(timerSec<=0){clearInterval(timerInt); submitTest();}}

render(); timerInt=setInterval(tick,1000);
</script>
</body></html>
