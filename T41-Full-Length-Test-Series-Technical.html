const DATA=[{"id":"81274","q":"A town generates 100 tonnes of municipal solid waste per day. If the compacted density of the waste in the landfill is 500 ( kg/m)^3 and the permitted depth of the landfill is 5 meters, what is the active landfill area required per year? (Ignore daily cover)","options":["1.46 Hectares","2.92 Hectares","0.73 Hectares","14.6 Hectares"],"answer":"1","solution":"Total mass per day = 100,000 kg. Volume per day = = 200 m 3 . Area per day = = = 40 . Area per year = = 1.46 ( Hectares)."},{"id":"81275","q":"If the BOD reaction rate constant k (base e) at , what is the approximate value of the rate constant at ? (Assume temperature coefficient = 1.047)","options":["","","",""],"answer":"2","solution":"The rate constant at temperature T is given by"},{"id":"81276","q":"An industry discharges of wastewater with a of 200 (mg/L). If the standard per capita BOD contribution is 0.08 kg/day, what is the \"Population Equivalent\" of this industrial discharge?","options":["12,500","25,000","5,000","10,000"],"answer":"1","solution":"Total BOD load = Population Equivalent ="},{"id":"81277","q":"A circular primary clarifier has a diameter of 10 meters and handles a flow rate of 3140 /(day). What is the Weir Loading Rate (WLR) assuming the weir runs along the entire perimeter?","options":["50 (m/day)","100 (m/day)","314 (m/day)","150 (m/day)"],"answer":"2","solution":"Perimeter (Weir Length) = Weir Loading Rate ="},{"id":"81278","q":"A sludge sample has a mass of 100 kg and a moisture content of 98%. If the sludge is dried until the moisture content is reduced to 96%, what is the new total mass of the sludge?","options":["50 kg","98 kg","96 kg","25 kg"],"answer":"1","solution":"Initial solid mass = 2% of 100 kg = 2 kg. Since the solid mass remains constant, in the new sludge, 4% represents 2 kg. Total new mass = = 50 ( kg)."},{"id":"81279","q":"A water sample contains 40 mg/L of and 24 mg/L of . What is the Total Hardness expressed as equivalent? (Equivalent weights: Ca = 20, Mg = 12, = 50)","options":["64 mg/L","100 mg/L","200 mg/L","164 mg/L"],"answer":"3","solution":"Total Hardness ="},{"id":"81280","q":"Four identical diesel generators are operating simultaneously, each producing a noise level of 60 dB. What is the combined noise level of all four generators?","options":["240 dB","66 dB","63 dB","120 dB"],"answer":"2","solution":"The formula for combining n identical noise sources is Here,"},{"id":"81281","q":"In an elemental analysis of solid waste, it contains 50% Carbon, 6% Hydrogen, and 32% Oxygen by mass. Using Dulong's formula (approximate), what is the Higher Heating Value (HHV) contribution from the Hydrogen content?","options":["2,885 kJ/kg","8,655 kJ/kg","16,900 kJ/kg","1,442 kJ/kg"],"answer":"1","solution":"Dulong's formula allocates energy based on available hydrogen: Contribution ="},{"id":"81282","q":"A grit chamber is designed to remove particles with a specific gravity of 2.65. According to Stokes' Law, if the diameter of the target particle is doubled, the settling velocity will:","options":["Double","Quadruple (increase by a factor of 4)","Halve","Remain constant"],"answer":"2","solution":"According to Stokes' Law, the settling velocity of a discrete particle in a laminar regime is directly proportional to the square of its diameter ( ). If diameter is doubled, velocity increases by times."},{"id":"81283","q":"In a solid waste routing system, a collection truck takes 30 minutes to travel from the dispatch center to the first pickup, 120 minutes for the actual collection route, 20 minutes to travel to the landfill, 15 minutes to unload, and 25 minutes to return to the dispatch center. What is the total route time?","options":["180 minutes","195 minutes","210 minutes","230 minutes"],"answer":"3","solution":"Total Route Time = Dispatch to first pickup + Collection + Haul to disposal + Unload + Return to dispatch = 30 + 120 + 20 + 15 + 25 = 210 minutes."},{"id":"81284","q":"Which method is predominantly used to physically separate non-ferrous metals like aluminum from a mixed solid waste stream?","options":["Magnetic Separator","Eddy Current Separator","Trommel Screen","Air Classifier"],"answer":"2","solution":"An Eddy Current Separator uses a rapidly rotating magnetic rotor to induce eddy currents in non-ferrous metals (like aluminum), which creates a repelling magnetic field, throwing the metals out of the waste stream."},{"id":"81285","q":"Under the E-Waste (Management) Rules, 2022, which of the following new categories was added to the schedule of electrical and electronic equipment that was NOT heavily regulated in the 2016 rules?","options":["Personal Computers","Solar Photo-voltaic Modules or Panels","Mobile Phones","Refrigerators"],"answer":"2","solution":"The E-Waste Rules 2022 expanded the scope significantly and explicitly included Solar Photo-voltaic (PV) modules and panels, mandating Extended Producer Responsibility (EPR) for their end-of-life management."},{"id":"81286","q":"The \"Battelle Environmental Evaluation System\" (BEES) is a methodology used in EIA primarily for:","options":["Evaluating the financial feasibility of a project","Public consultation scheduling","Quantitative assessment of environmental impacts using an Environmental Quality Index (EQI)","Preparing the Disaster Management Plan"],"answer":"3","solution":"BEES is a comprehensive, quantitative methodology that uses a hierarchical system of environmental categories, components, and parameters to calculate an Environmental Quality Index for comparing project alternatives."},{"id":"81287","q":"In the context of Upflow Anaerobic Sludge Blanket (UASB) reactors, what is the primary function of the \"GLSS\" unit located at the top?","options":["To aerate the effluent","To separate Gas, Liquid, and Solid Sludge","To pre-treat the incoming grit","To add chemical coagulants"],"answer":"2","solution":"The Gas-Liquid-Solid Separator (GLSS) or three-phase separator is a critical component of a UASB reactor that deflects biogas into a collection dome while allowing settled sludge to slide back into the digestion zone."},{"id":"81288","q":"According to the Bio-Medical Waste Management Rules, 2016, liquid chemical waste generated from laboratories and floor washings should be disposed of in which category?","options":["Yellow Category","Red Category","White Category","Blue Category"],"answer":"1","solution":"Under Schedule I of the BMW Rules 2016, \"Chemical Liquid Waste\" (generated from labs, disinfecting activities, etc.) is classified under the Yellow Category and must be pre-treated before discharge into drains."},{"id":"81289","q":"The \"Kessener Brush\" is an aeration device historically associated with which secondary wastewater treatment process?","options":["Trickling Filters","Upflow Anaerobic Sludge Blanket","Oxidation Ditches","Sequencing Batch Reactors"],"answer":"3","solution":"The Kessener brush is a type of mechanical surface aerator consisting of a rotating horizontal shaft with bristles/blades, traditionally used to provide oxygen and maintain velocity in an Oxidation Ditch."},{"id":"81290","q":"Which section of the Environment (Protection) Act, 1986 grants the Central Government the power to give direct directions for the closure, prohibition, or regulation of any industry?","options":["Section 3","Section 5","Section 15","Section 25"],"answer":"2","solution":"Section 5 of the EPA, 1986 gives the Central Government the extraordinary power to issue directions in writing, including the closure of offending industries or the stoppage of their water/electricity supply."},{"id":"81291","q":"In air pollution control equipment, which device is highly susceptible to decreased efficiency if the \"electrical resistivity\" of the particulate matter is too high?","options":["Venturi Scrubber","Cyclone Separator","Baghouse Filter","Electrostatic Precipitator (ESP)"],"answer":"4","solution":"ESPs rely on giving particles an electric charge so they migrate to collection plates. If the dust has very high electrical resistivity, it resists taking the charge and releasing it at the plate, severely impairing collection efficiency."},{"id":"81292","q":"In composting, what is the role of \"Actinomycetes\"?","options":["They primarily carry out the initial rapid heating phase","They break down tough organic materials like cellulose and lignin during the later stages of composting","They are responsible for methane generation","They lower the pH of the compost pile to acidic levels"],"answer":"2","solution":"Actinomycetes are a higher form of bacteria (often resembling fungi) that thrive during the thermophilic and curing phases of composting, excelling at breaking down complex, woody organics like cellulose, lignin, and chitin."},{"id":"81293","q":"According to the Water (Prevention and Control of Pollution) Act, 1974, establishing a new industry that is likely to discharge sewage or trade effluent requires prior \"Consent to Establish\" under which Section?","options":["Section 19","Section 21","Section 25","Section 33"],"answer":"3","solution":"Section 25 of the Water Act stipulates that no person shall establish or take any steps to establish any industry, operation, or process without the previous consent of the State Board."},{"id":"81294","q":"\"Bentonite\" is widely used in the construction of sanitary landfills primarily because of its:","options":["High calorific value","Ability to swell upon wetting, creating a highly impermeable clay liner","High nutrient value for bioremediation","Capability to filter methane gas"],"answer":"2","solution":"Bentonite is a type of montmorillonite clay that swells significantly when hydrated. This swelling fills voids, resulting in a highly impermeable layer with extremely low hydraulic conductivity, ideal for landfill liners."},{"id":"81295","q":"The \"Quartering Method\" is a standard procedure used in solid waste management for:","options":["Routing collection vehicles","Securing landfill permits","Reducing the size of a bulk waste sample for laboratory analysis","Calculating tipping fees"],"answer":"3","solution":"Coning and quartering is a statistical sampling technique where a large pile of mixed waste is divided into four quarters; two diagonal quarters are discarded, and the remaining two are remixed. This is repeated to obtain a representative manageable sample for lab analysis."},{"id":"81296","q":"Which of the following advanced wastewater treatment processes uses an ion-exchange membrane and an electrical potential gradient to separate dissolved salts from water?","options":["Reverse Osmosis","Electrodialysis","Microfiltration","Air Stripping"],"answer":"2","solution":"Electrodialysis uses an applied direct current (electrical potential) to move ions through selectively permeable ion-exchange membranes, effectively desalinating or removing specific dissolved ions from wastewater."},{"id":"81297","q":"Under the Construction and Demolition Waste Management Rules, 2016, which entity is responsible for drafting the state policy on C&D waste management?","options":["State Pollution Control Board","Secretary, Urban Development Department of the State","Central Pollution Control Board","Municipal Commissioner"],"answer":"2","solution":"The rules mandate that the Secretary, Urban Development Department of the State or Union Territory shall prepare a comprehensive state policy on the management of C&D waste."},{"id":"81298","q":"\"Plume Rise\" in air dispersion modeling ( h) is dependent on the exhaust gas velocity and its:","options":["Carbon content","Humidity","Temperature relative to the ambient air (Buoyancy)","Dust concentration"],"answer":"3","solution":"Plume rise occurs due to two factors: momentum (the physical velocity of the gas exiting the stack) and buoyancy (the density difference caused by the gas being hotter than the surrounding ambient air)."},{"id":"81299","q":"In EIA methodologies, the \"Sorensen Network\" is specifically designed to:","options":["Map the public road network around the project site","Identify cause-condition-effect pathways, showing secondary and tertiary impacts","Determine the critical path for project construction","Measure baseline air quality dynamically"],"answer":"2","solution":"The Sorensen Network is a stepped matrix or network diagram used in EIA to trace the chain of events from primary project activities to secondary and tertiary environmental consequences."},{"id":"81300","q":"In wastewater engineering, \"Relative Stability\" is defined as the ratio of:","options":["Dissolved Oxygen to BOD","Oxygen available in the effluent (as DO, nitrite, and nitrate) to the total oxygen required to satisfy its first-stage BOD","MLSS to MLVSS","Ultimate BOD to COD"],"answer":"2","solution":"Relative Stability is a measure used for treated effluents, representing the percentage of total oxygen required (to fully stabilize the organic matter) that is already available in the sample."},{"id":"81301","q":"According to the Plastic Waste Management Rules, what does the term \"Brand Owner\" specifically refer to?","options":["A person or company who sells any commodity under a registered brand label","The manufacturer of the plastic raw material","The local municipality managing the waste","The end consumer"],"answer":"1","solution":"A Brand Owner is legally defined as a person or company who sells any commodity under a registered brand label. They carry strict Extended Producer Responsibility (EPR) targets to recover the plastic packaging they introduce into the market."},{"id":"81302","q":"The \"Nitrification\" process in wastewater treatment converts ammonia into nitrate. This biological reaction inherently consumes a significant amount of:","options":["Alkalinity","Acidity","Volatile Fatty Acids","Phosphorus"],"answer":"1","solution":"Nitrification is an acid-producing process. The conversion of ammonia to nitrate releases ions, which consumes the alkalinity of the wastewater, often requiring chemical addition (like lime) if natural alkalinity is too low."},{"id":"81303","q":"What is the primary purpose of a \"TCLP\" (Toxicity Characteristic Leaching Procedure) test in Hazardous Waste Management?","options":["To determine the explosive limits of the waste","To simulate landfill conditions and measure the potential of heavy metals/organics to leach into groundwater","To assess the biological oxygen demand of the waste","To calculate the calorific value for incineration"],"answer":"2","solution":"TCLP is an analytical method used to determine the mobility of organic and inorganic analytes present in liquid, solid, and multiphasic wastes, simulating the leaching action that occurs in a municipal landfill."},{"id":"81304","q":"Under the EIA Notification 2006, \"Category B\" projects are further categorized into B1 and B2. The primary difference is that:","options":["B2 projects require central clearance, B1 requires state clearance","B2 projects do not require an EIA report and public consultation, whereas B1 projects do","B2 projects are strictly for nuclear plants","B1 projects are exempt from all environmental laws"],"answer":"2","solution":"During the screening stage, the SEAC categorizes B projects. B1 projects must carry out a full EIA and Public Hearing, while B2 projects are exempt from preparing an EIA report and undergoing public consultation."},{"id":"81305","q":"The phenomenon of \"Sewage Sickness\" of land occurs when:","options":["Untreated sewage is disposed into a river","Sewage is applied continuously on agricultural land without resting, causing the soil pores to clog and become anaerobic","Workers in a sewage plant fall ill","Sewer pipes corrode due to hydrogen sulfide"],"answer":"2","solution":"Sewage sickness happens when land is overloaded with sewage effluent. The soil pores become clogged with suspended solids and biological slimes, blocking air circulation and leading to anaerobic, foul-smelling conditions."},{"id":"81306","q":"Which piece of equipment is commonly used for the \"Dewatering\" of municipal wastewater sludge by applying centrifugal force?","options":["Filter Press","Sludge Drying Bed","Solid Bowl Centrifuge","Gravity Thickener"],"answer":"3","solution":"A solid bowl centrifuge rotates at high speeds, using centrifugal force to rapidly separate the heavier solid sludge particles from the lighter liquid (centrate) for efficient dewatering."},{"id":"81307","q":"In the context of waste disposal, \"Deep Well Injection\" is a technology strictly reserved for:","options":["Municipal organic waste","E-waste","Liquid hazardous wastes and industrial effluents","Construction and Demolition debris"],"answer":"3","solution":"Deep well injection is a liquid waste disposal technology. It involves pumping liquid hazardous or toxic wastes deep underground into porous geological formations, far below the deepest usable aquifers."},{"id":"81308","q":"The \"Air (Prevention and Control of Pollution) Act, 1981\" defines an \"Air Pollutant\" as:","options":["Any solid, liquid or gaseous substance present in the atmosphere in such concentration as may be or tend to be injurious to human beings or other living creatures or plants or property or environment","Only synthetic chemical gases","Only particulate matter above 10 microns","Any gas with an unpleasant odor"],"answer":"1","solution":"Section 2(a) of the Air Act 1981 gives this comprehensive legal definition, explicitly including solid, liquid, or gaseous substances (which includes noise, added via a 1987 amendment) that cause injury to life, property, or the environment."},{"id":"81309","q":"Which method of solid waste collection utilizes underground pipes to suck waste bags directly from chutes to a central collection terminal?","options":["Hauled Container System","Stationary Container System","Pneumatic Waste Collection System","Community Bin System"],"answer":"3","solution":"A Pneumatic Waste Collection System uses a network of underground pipes and vacuum technology to rapidly transport waste from building chutes directly to a central processing facility, eliminating street-level truck collection."},{"id":"81310","q":"The presence of \"Fecal Coliform\" bacteria in a water sample is primarily an indicator of:","options":["Heavy metal contamination","Recent contamination by sewage or animal feces","Industrial chemical spills","Algal blooms"],"answer":"2","solution":"Fecal coliforms (like E. coli) are harmless bacteria naturally found in the intestines of warm-blooded animals. Their presence in water strongly indicates recent fecal contamination and the potential presence of dangerous waterborne pathogens."},{"id":"81311","q":"In Hazardous Waste classification, a waste is designated as \"Reactive\" if it:","options":["Has a pH less than 2","Has a flash point below","Is normally unstable and readily undergoes violent change without detonating, or reacts violently with water","Leaches heavy metals in a TCLP test"],"answer":"3","solution":"Reactivity is a characteristic of hazardous waste where the material is unstable, reacts violently with water, forms explosive mixtures with water, or generates toxic gases when mixed with water."},{"id":"81312","q":"Under the SWM Rules 2016, \"Inert Waste\" refers to waste that:","options":["Is highly flammable","Is biologically active and produces methane","Is neither biologically nor chemically reactive and will not decompose (e.g., sand, glass, stones)","Contains infectious pathogens"],"answer":"3","solution":"Inert waste is stable matter that does not undergo significant physical, chemical, or biological transformations in a landfill, posing minimal risk to groundwater or air quality."},{"id":"81313","q":"In a typical municipal wastewater treatment plant, \"Secondary Treatment\" is primarily designed to remove:","options":["Large floating debris","Heavy inorganic grit","Dissolved and colloidal biodegradable organic matter","Dissolved heavy metals"],"answer":"3","solution":"While primary treatment removes settleable suspended solids, secondary treatment relies on biological processes (like activated sludge or trickling filters) to consume and remove dissolved and colloidal biodegradable organics (measured as BOD)."},{"id":"81314","q":"The \"Ramsar Convention\" is an international treaty primarily focused on the conservation and sustainable use of:","options":["The Ozone Layer","Wetlands","Tropical Rainforests","Endangered Species"],"answer":"2","solution":"Signed in 1971 in Ramsar, Iran, the convention provides the framework for national action and international cooperation for the conservation and wise use of wetlands and their resources."},{"id":"81315","q":"The \"Fenton's Reagent\" used in advanced wastewater treatment is a mixture of:","options":["Chlorine and Ammonia","Hydrogen Peroxide and Ferrous Iron ( ) catalyst","Ozone and Ultraviolet light","Alum and Lime"],"answer":"2","solution":"Fenton's reagent is an Advanced Oxidation Process (AOP) that uses hydrogen peroxide catalyzed by ferrous iron to generate highly reactive hydroxyl radicals, which destroy complex, toxic organic pollutants."},{"id":"81316","q":"Which functional element of a solid waste management system involves the \"movement of waste from small collection vehicles to larger transport equipment\"?","options":["Waste Generation","Waste Processing","Transfer and Transport","Disposal"],"answer":"3","solution":"Transfer stations serve the functional element of \"Transfer and Transport,\" consolidating loads from smaller local collection trucks into large semi-trailers or trains for economical long-haul transport to a distant landfill."},{"id":"81317","q":"Under the EIA Notification 2006, the \"Expert Appraisal Committee\" (EAC) at the Central level evaluates projects for environmental clearance. Who constitutes the EAC?","options":["The Supreme Court of India","The Ministry of Environment, Forest and Climate Change (MoEF&CC)","The State Government","The Central Pollution Control Board"],"answer":"2","solution":"The EAC is a multi-disciplinary committee of experts constituted by the MoEF&CC to appraise Category A projects and make recommendations regarding the grant of Environmental Clearance."},{"id":"81318","q":"The \"Windrow\" method of composting requires regular turning of the waste piles primarily to:","options":["Prevent the escape of methane","Ensure uniform temperature distribution and provide oxygen (aeration) to the microbes","Increase the moisture content of the pile","Hide the waste from scavengers"],"answer":"2","solution":"Windrow composting is an aerobic process. Turning the piles re-introduces oxygen into the core, releases trapped heat, and ensures all parts of the waste are exposed to the high temperatures necessary for pathogen destruction."},{"id":"81319","q":"What is \"Leachate Recirculation\" in the context of a bioreactor landfill?","options":["Pumping leachate out of the landfill to a municipal sewer","Pumping collected leachate back into the waste mass to increase moisture and accelerate biological decomposition","Evaporating leachate using landfill gas flares","Mixing leachate with fresh drinking water"],"answer":"2","solution":"Bioreactor landfills purposely recirculate leachate to maintain optimal moisture levels. This rapidly accelerates the degradation of organic waste, increasing methane production rates and stabilizing the landfill in years rather than decades."},{"id":"81320","q":"According to the Bio-Medical Waste Management Rules, 2016, \"Animal Anatomical Waste\" should be disposed of in which colored bag?","options":["Red","Yellow","Blue","White"],"answer":"2","solution":"Both human and animal anatomical wastes are highly infectious and organic. They are categorized under the Yellow bag system, which mandates disposal via deep burial or high-temperature incineration."},{"id":"81321","q":"\"Sewer Appurtenances\" include all of the following EXCEPT:","options":["Manholes","Catch Basins","Inverted Siphons","Sedimentation Tanks"],"answer":"4","solution":"Sewer appurtenances are devices installed on a sewerage network to assist in its operation and maintenance (like manholes, catch basins, siphons, flushing tanks). A sedimentation tank is a treatment plant unit, not a network appurtenance."},{"id":"81322","q":"In noise pollution assessment, what does \" \" signify?","options":["The noise level exceeded for 10% of the measurement time","The noise level exceeded for 90% of the measurement time","The lowest 10 decibels recorded","The average noise level over 10 hours"],"answer":"1","solution":"is a statistical descriptor representing the peak or intrusive noise level. It is the noise level (in dB) that was exceeded for 10% of the total observation time."},{"id":"81323","q":"Which plastic additive, commonly used to make PVC soft and flexible, is highly criticized for its potential as an endocrine disruptor and ability to leach into the environment?","options":["Phthalates","Polyethylene","Polystyrene","Cellulose"],"answer":"1","solution":"Phthalates are plasticizers added to rigid plastics (like PVC) to impart flexibility. They are not chemically bound to the plastic and can easily leach out, posing severe health and environmental risks."},{"id":"81324","q":"\"Biomagnification\" refers to the process where:","options":["Microbes break down pollutants","The concentration of a toxic substance increases at each successive level of the food chain","A single organism accumulates a toxin over its lifespan","Wetlands act as natural sponges to filter water"],"answer":"2","solution":"Biomagnification (or bioamplification) occurs when a non-biodegradable toxin (like DDT or Mercury) is ingested by lower organisms and passed up the food chain, resulting in highly concentrated, toxic levels in apex predators."},{"id":"81325","q":"The \"Grit Chamber\" in a sewage treatment plant is designed to remove particles based on which primary parameter?","options":["Biochemical Oxygen Demand","Specific Gravity and Settling Velocity","Chemical Oxygen Demand","Electrical Conductivity"],"answer":"2","solution":"Grit chambers are designed to slow the velocity of wastewater just enough to allow heavy inorganic particles (specific gravity ~2.65) to settle out, while keeping lighter organic particles in suspension."},{"id":"81326","q":"Under the E-Waste Rules, \"Dismantlers\" are strictly prohibited from performing which process unless they also hold authorization as a Recycler?","options":["Sorting electronic components","Breaking open plastic casings","Metallurgical recovery processes (like acid leaching for gold/copper)","Storing E-waste temporarily"],"answer":"3","solution":"Dismantlers are only permitted to physically separate components (plastic, glass, PCBs). Chemical or metallurgical processing to extract precious metals generates severe hazardous waste and is strictly reserved for authorized Recyclers with appropriate pollution control systems."},{"id":"81327","q":"A \"Permeable Reactive Barrier\" (PRB) is a remediation technology used for:","options":["Treating contaminated groundwater in-situ as it flows through a trench filled with reactive material","Filtering particulate matter from industrial smokestacks","Preventing landfill gas from escaping into the atmosphere","Blocking noise pollution near highways"],"answer":"1","solution":"A PRB is installed below ground across the path of a contaminated groundwater plume. As the water passively flows through the barrier, reactive materials (like zero-valent iron) degrade or precipitate the contaminants, allowing clean water to emerge on the other side."},{"id":"81328","q":"Which method of Population Forecasting assumes that the rate of increase of population is proportional to the current population, leading to a compounding effect?","options":["Arithmetic Increase Method","Geometric Increase Method","Incremental Increase Method","Decreasing Rate of Growth Method"],"answer":"2","solution":"The Geometric Increase Method (or uniform percentage growth method) assumes the population grows at a constant percentage rate, resulting in an exponential or compounding curve, typically used for rapidly expanding young cities."},{"id":"81329","q":"What is the primary operational advantage of a \"Sequencing Batch Reactor\" (SBR) over a conventional Activated Sludge Process?","options":["It does not require any oxygen","Equalization, aeration, and sedimentation occur in a single tank in a time-sequenced manner, saving space","It produces no sludge","It utilizes trickling filter media"],"answer":"2","solution":"An SBR operates in fill-and-draw batches. The critical steps of aeration (reaction) and clarification (settling) happen sequentially in the exact same biological reactor tank, eliminating the need for separate, large secondary clarifiers and sludge return pumps."},{"id":"81330","q":"The \"Basel Ban Amendment\" (which entered into force globally in 2019) specifically prohibits:","options":["The use of single-use plastics","The export of hazardous waste from OECD/EU countries to developing nations for any reason","The mining of asbestos","The import of all recycled paper"],"answer":"2","solution":"The Basel Ban Amendment significantly strengthened the Basel Convention by strictly prohibiting all exports of hazardous wastes (including E-waste and obsolete ships) from wealthy, industrialized nations (OECD) to non-OECD developing countries."},{"id":"81331","q":"\"Coagulation\" in water treatment is necessary to remove colloidal particles because these particles:","options":["Are too heavy to stay in suspension","Possess a negative electrical surface charge that causes them to repel each other and resist settling","Are completely dissolved in the water","Form large, heavy flocs naturally"],"answer":"2","solution":"Colloidal particles (like clay and organic matter) do not settle because their negatively charged surfaces repel each other. Coagulants (like Alum) provide positive ions ( ) to neutralize these charges, allowing the particles to agglomerate."},{"id":"81332","q":"Under the Solid Waste Management Rules 2016, municipalities are mandated to set up material recovery facilities (MRF). What is the main activity inside an MRF?","options":["Anaerobic digestion of food waste","Incineration of hazardous waste","Sorting, baling, and temporary storage of dry recyclable waste","Final disposal of inert waste"],"answer":"3","solution":"A Material Recovery Facility (MRF) receives co-mingled or pre-segregated dry waste (paper, plastic, metal, glass) and utilizes manual labor and machinery to sort, clean, and bale these materials for sale to recycling industries."},{"id":"81333","q":"What is the defining characteristic of \"Class F\" Fly Ash compared to \"Class C\" Fly Ash?","options":["Class F is produced from burning wood","Class F contains high amounts of calcium oxide (lime) and is self-cementing","Class F contains low calcium oxide and requires a cementing agent (like Portland cement) to react","Class F is purely liquid"],"answer":"3","solution":"Produced from burning anthracite or bituminous coal, Class F fly ash has very low calcium content (pozzolanic). It requires the addition of an activator (like lime or cement) and water to form cementitious compounds, unlike the self-cementing Class C."},{"id":"81334","q":"In an Environmental Impact Assessment, what is a \"Baseline Study\"?","options":["A study conducted after the project is completed to measure pollution","The collection of data on the existing environmental status of the project area before any construction begins","The financial auditing of the project's environmental budget","A survey of the project workers' health"],"answer":"2","solution":"A baseline study establishes the current state of the environment (air quality, flora/fauna, water levels, socio-economic status) prior to the project. It serves as the reference point against which all future project impacts are predicted and measured."},{"id":"81335","q":"The \"National Clean Air Programme\" (NCAP) launched by the Government of India aims to reduce particulate matter (PM10 and PM2.5) concentrations by what target percentage initially by 2024?","options":["10-15%","20-30%","50-60%","100%"],"answer":"2","solution":"Launched in 2019, the NCAP established a national framework with a target to achieve a 20% to 30% reduction in particulate matter concentrations by 2024, keeping 2017 as the base year for comparison in non-attainment cities."},{"id":"81336","q":"A \"Scrubber\" installed in the exhaust stack of a municipal solid waste incinerator is primarily designed to control:","options":["Large particulate matter and heavy metals","Acid gases like Sulfur Dioxide ( ) and Hydrogen Chloride (HCl)","Carbon Monoxide (CO)","Methane ( )"],"answer":"2","solution":"Scrubbers (wet or dry) spray alkaline reagents (like a lime slurry) into the exhaust gas stream. The alkaline reagent chemically reacts with and neutralizes highly corrosive acid gases, preventing acid rain."},{"id":"81337","q":"What does \"Biochemical Oxygen Demand\" (BOD) physically represent in a wastewater sample?","options":["The amount of oxygen generated by algae during photosynthesis","The total amount of oxygen required to chemically oxidize all organic and inorganic matter","The amount of dissolved oxygen consumed by microorganisms to aerobically decompose organic matter","The amount of oxygen required to burn the waste"],"answer":"3","solution":"BOD is a surrogate measure of organic pollution. It represents the mass of dissolved oxygen consumed by aerobic bacteria as they metabolize and break down the biodegradable organic matter present in the water at a specific temperature over a specific time."},{"id":"81338","q":"The \"Central Pollution Control Board\" (CPCB) of India is a statutory organization constituted under which of the following Acts?","options":["The Environment (Protection) Act, 1986","The Air (Prevention and Control of Pollution) Act, 1981","The Water (Prevention and Control of Pollution) Act, 1974","The National Green Tribunal Act, 2010"],"answer":"3","solution":"The CPCB was originally constituted in September 1974 under the Water (Prevention and Control of Pollution) Act, 1974. Further powers and functions were later entrusted to it under the Air Act (1981) and the EPA (1986)."}];
let idx=0, answers={}, timerSec=65*60, timerInt=null;

function render(){
  const q=DATA[idx];
  if(!q){document.getElementById('qText').textContent='No data.';return;}
  document.getElementById('qNum').textContent=idx+1;
  document.getElementById('qTotal').textContent=DATA.length;
  document.getElementById('qText').textContent=q.q;
  document.getElementById('opts').innerHTML=q.options.map((o,i)=>
    `<div class="option ${answers[idx]==(i+1)?'selected':''}" onclick="select(${i+1})">${String.fromCharCode(65+i)}. ${o}</div>`
  ).join('');
}
window.select=o=>{answers[idx]=o; render();};
window.prev=()=>{if(idx>0){idx--; render();}};
window.next=()=>{if(idx<DATA.length-1){idx++; render();}};

function submitTest(){
  clearInterval(timerInt);
  let c=0; for(let i=0;i<DATA.length;i++){if(answers[i]==DATA[i].answer)c++;}
  const pct=Math.round(c/DATA.length*100)||0;
  document.getElementById('qCard').classList.add('hidden');
  document.getElementById('resCard').classList.remove('hidden');
  document.getElementById('score').textContent=pct+'%';
  document.getElementById('detail').innerHTML='<b>'+c+'/'+DATA.length+'</b> correct';
}

function tick(){timerSec--; document.getElementById('timer').textContent=Math.floor(timerSec/60)+':'+String(timerSec%60).padStart(2,'0'); document.getElementById('bar').style.width=(timerSec/(65*60)*100)+'%'; if(timerSec<=0){clearInterval(timerInt); submitTest();}}

render(); timerInt=setInterval(tick,1000);
</script>
</body></html>
