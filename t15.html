<!DOCTYPE html>
<html lang="hi">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>ASWMO — T15 Computer+Science</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
:root{--bg:#0b0c15;--surface:#12142a;--text:#e4e6f0;--accent:#00e8a0;--gold:#f0c040;--danger:#ff4d6d;--border:rgba(255,255,255,.08);--muted:#8a8fa8;}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:Inter,system-ui,sans-serif;background:radial-gradient(1000px 700px at 20% 0%,#00e8a011,transparent),var(--bg);color:var(--text);min-height:100vh;line-height:1.55;}
.container{max-width:900px;margin:2rem auto;padding:0 1.2rem;}
h1{font-size:1.6rem;font-weight:700;background:linear-gradient(135deg,#fff,var(--accent));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.card{background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:16px;padding:1.5rem;margin-bottom:1rem;}
.question{font-size:1.05rem;font-weight:500;margin-bottom:.8rem;line-height:1.35;}
.options{display:grid;gap:.5rem;}
.option{padding:.7rem 1rem;background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:10px;cursor:pointer;font-size:.92rem;transition:.2s;}
.option:hover,.option.selected{border-color:var(--accent);background:rgba(0,232,160,.12);font-weight:600;}
.timer{font-family:monospace;font-weight:700;font-size:2rem;color:var(--accent);}
button{background:linear-gradient(135deg,var(--accent),#00b87e);color:#0a0c12;border:none;padding:.7rem 1.4rem;border-radius:10px;font-weight:700;cursor:pointer;}
.hidden{display:none!important}</style>
</head>
<body>
<div class="container">
<header><h1 id="ptitle">ASWMO — T15 Computer+Science</h1></header>

<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;">
<div><div class="timer" id="timer">65:00</div><div style="font-size:.75rem;color:var(--muted);">Time Remaining</div></div>
<button onclick="submitTest()">Submit Test</button></div>
<div style="height:6px;background:rgba(255,255,255,.1);border-radius:3px;overflow:hidden;margin-top:.5rem;"><div id="bar" style="height:100%;width:100%;background:linear-gradient(90deg,var(--accent),#00b87e);transition:width 1s linear;"></div></div></div>

<div class="card" id="qCard">
<div style="font-size:.8rem;color:var(--muted);margin-bottom:.4rem;">Question <span id="qNum">1</span> / <span id="qTotal">?</span></div>
<div class="question" id="qText">Loading...</div>
<div class="options" id="opts"></div>
<div style="margin-top:1rem;display:flex;gap:.5rem;flex-wrap:wrap;">
<button onclick="prev()">&#8592; Prev</button><button onclick="next()">Next &#8594;</button><button onclick="submitTest()">Submit</button></div>
</div>

<div class="card hidden" id="resCard" style="text-align:center;padding:2rem;">
<h2 style="color:var(--gold);font-size:2rem;">Test Completed!</h2>
<div id="score" style="font-size:3rem;font-weight:800;color:var(--accent);margin:1rem 0;"></div>
<div id="detail" style="color:var(--muted);font-size:.95rem;"></div>
<div style="margin-top:1.5rem;"><a href="index.html" style="color:var(--accent);font-weight:600;">&#8592; Back</a></div>
</div>
</div>

<script>
const DATA=[{"id":"74329","q":"Which component is often referred to as the \"brain\" of the computer?","options":["RAM","CPU","Motherboard","Hard Disk"],"answer":"2"},{"id":"74330","q":"Which of the following types of memory is volatile?","options":["ROM","SSD","RAM","EPROM"],"answer":"3"},{"id":"74331","q":"Which of the following is not a function of an Operating System?","options":["Memory Management","Process Management","Application Programming","File Management"],"answer":"3"},{"id":"74332","q":"What is the decimal equivalent of the binary number 1101?","options":["11","13","15","9"],"answer":"2"},{"id":"74333","q":"In a relational database, what is a Primary Key?","options":["A key used to log in to the database.","A column or set of columns that uniquely identifies each row in a table.","The first column in every table.","A key that is used to link two tables together."],"answer":"2"},{"id":"74334","q":"Which data structure follows the LIFO (Last-In, First-Out) principle?","options":["Queue","Array","Stack","Linked List"],"answer":"3"},{"id":"74335","q":"Which of the following is considered an Input Device ONLY?","options":["Touchscreen","Headset","Scanner","Printer"],"answer":"3"},{"id":"74336","q":"What is considered the \"brain\" of the computer, responsible for processing all instructions?","options":["RAM","CPU","Motherboard","Hard Disk"],"answer":"2"},{"id":"74337","q":"Which of the following is a type of volatile memory?","options":["ROM","RAM","SSD","CD-ROM"],"answer":"2"},{"id":"74338","q":"Which acid is present in vinegar?","options":["Formic acid","Lactic acid","Citric acid","Acetic acid"],"answer":"4"},{"id":"74339","q":"Which of the following is not an operating system?","options":["Windows","Linux","Oracle","Android"],"answer":"3"},{"id":"74340","q":"What is the full form of 'Malware'?","options":["Malicious Hardware","Manual Software","Malicious Software","Multi-purpose Software"],"answer":"3"},{"id":"74341","q":"What does 'URL' stand for?","op ["F5","Shift + F5","Ctrl + P","Alt + F4"],"answer":"1"},{"id":"74352","q":"What is the keyboard shortcut to Undo the last action in most Windows applications?","options":["Ctrl + C","Ctrl + V","Ctrl + Z","Ctrl + X"],"answer":"3"},{"id":"74353","q":"According to the Swachh Survekshan 2024 results, which city became the first in Bihar to achieve the prestigious 'Water Plus' certification?","options":["Gaya","Muzaffarpur","Patna","Bhagalpur"],"answer":"3"},{"id":"74354","q":"As per the Swachh Survekshan 2024 data, which city became the only one in Bihar to be certified as 'ODF++' (Open Defecation Free Plus Plus)?","options":["Patna","Gaya","Munger","Darbhanga"],"answer":"2"},{"id":"74355","q":"What is the primary focus of the Swachh Bharat Mission - Urban 2.0 (SBM-U 2.0), which distinguishes it from the first phase of the mission?","options":["To ensure all cities become ODF (Open Defecation Free).","To achieve the vision of \"Garbage Free Cities\" (GFC) and sustainable waste management.","To focus exclusively on cleaning major rivers.","To provide subsidies for building individual household toilets."],"answer":"2"},{"id":"74356","q":"The Plastic Waste Management (Amendment) Rules, 2024, introduced a key new provision. What was it?","options":["It banned all plastic items, including water bottles, for the first time.","It transferred all enforcement powers from Gram Panchayats to the Central Government.","It mandated that manufacturers of biodegradable plastics must obtain a certificate from the Central Pollution Control Board (CPCB).","It set a new national target to eliminate all plastic by 2025."],"answer":"3"},{"id":"74357","q":"Regarding the Jal Jeevan Mission (JJM), which aims to provide Functional Household Tap Connections (FHTC) to all rural households, what has been Bihar's performance?","options":["Bihar is lagging significantly behind the national average.","Bihar's progress is exactly at the national average.","Bihar is a top-performing state that had set an ambitious target to achieve 100% coverage by 2022.","The mission has not yet been implemented in Bihar."],"answer":"3"},{"id":"74358","q":"A washing machine works on the principle of:","options":["Diffusion","Reverse Osmosis","Centrifugation","Dialysis"],"answer":"3"},{"id":"74359","q":"The phenomenon of a mirage is caused by:","options":["Interference of light","Diffraction of light","Polarization of light","Total Internal Reflection (TIR) of light"],"answer":"4"},{"id":"74360","q":"What is \"Dry Ice\"?","options":["Solid Hydrogen Peroxide","Solid Carbon Dioxide","Solid Nitrogen","Solid Water (at -100°C)"],"answer":"2"},{"id":"74361","q":"Baking soda is chemically known as:","options":["Sodium Carbonate (Na 2 CO 3 )","Sodium Bicarbonate (NaHCO 3 )","Sodium Chloride (NaCl)","Calcium Carbonate (CaCO 3 )"],"answer":"2"},{"id":"74362","q":"Which blood group is known as the \"universal recipient\"?","options":["A","B","AB","O"],"answer":"3"},{"id":"74363","q":"Which of the following diseases is caused by a virus?","options":["Typhoid","Cholera","Polio","Tuberculosis (TB)"],"answer":"3"},{"id":"74364","q":"The spherical shape of a raindrop is due to which of the following phenomena?","options":["Viscosity","Atmospheric Pressure","Surface Tension","Gravity"],"answer":"3"},{"id":"74365","q":"Brass is an alloy (mixture) of which two metals?","options":["Copper and Tin","Zinc and Copper","Copper and Aluminum","Lead and Tin"],"answer":"2"},{"id":"74366","q":"What is the chemical name for Bleaching Powder?","options":["Sodium Bicarbonate","Calcium Hypochlorite","Sodium Carbonate","Calcium Carbonate"],"answer":"2"},{"id":"74367","q":"Which organelle is known as the \"Powerhouse of the Cell\"?","options":["Nucleus","Ribosome","Lysosome","Mitochondria"],"answer":"4"},{"id":"74368","q":"Which gland in the human body is known as the \"Master Gland\"?","options":["Thyroid Gland","Adrenal Gland","Pituitary Gland","Pancreas"],"answer":"3"},{"id":"74369","q":"What was the name of the dered:","options":["Strongly Acidic","Strongly Basic","Neutral","Weakly Acidic"],"answer":"3"},{"id":"74379","q":"Which of the following non-metals is a liquid at room temperature?","options":["Carbon","Sulfur","Iodine","Bromine"],"answer":"4"},{"id":"74380","q":"Bronze is an alloy primarily composed of:","options":["Copper and Zinc","Copper and Tin","Iron and Carbon","Lead and Tin"],"answer":"2"},{"id":"74381","q":"Which of the following gases is the main component of natural gas, which is also found in biogas (Gobar Gas)?","options":["Ethane (C 2 H 6 )","Propane (C 3 H 8 )","Methane (CH 4 )","Butane (C 4 H 10 )"],"answer":"3"},{"id":"74382","q":"What is the chemical formula for Plaster of Paris (PoP)?","options":["CaSO 4 . H 2 O","CaSO 4 H 2 O","CaCO 3","Ca(OH) 2"],"answer":"1"},{"id":"74383","q":"In the modern periodic table, elements are arranged in order of increasing:","options":["Atomic Mass","Number of Neutrons","Atomic Number","Mass Number"],"answer":"3"},{"id":"74384","q":"In the process of oxidation, a substance:","options":["Gains electrons","Loses electrons","Gains protons","Loses protons"],"answer":"2"},{"id":"74385","q":"Which of the following gases is NOT considered a primary greenhouse gas?","options":["Carbon Dioxide (CO 2 )","Methane (CH 4 )","Nitrogen (N 2 )","Water Vapour (H 2 O)"],"answer":"3"},{"id":"74386","q":"What is the SI unit of Power?","options":["Joule","Watt","Newton","Pascal"],"answer":"2"},{"id":"74387","q":"A person suffering from Myopia (nearsightedness) is advised to use:","options":["Concave lens","Convex lens","Cylindrical lens","Plain glass"],"answer":"1"},{"id":"74388","q":"In a domestic electric circuit, devices like the fan, lights, and TV are connected in:","options":["Series","Parallel","A combination of series and parallel","They are not connected to each other"],"answer":"2"},{"id":"74389","q":"How does heat from the Sun reach the Earth?","options":["Conduction","Convection","Radiation","Evaporation"],"answer":"3"},{"id":"74390","q":"The working of a hydraulic lift or hydraulic brake is based on which law?","options":["Pascal's Law","Archimedes' Principle","Newton's Second Law","Bernoulli's Principle"],"answer":"1"},{"id":"74391","q":"The 'pitch' (shrillness or highness) of a sound is determined by its:","options":["Amplitude","Frequency","Wavelength","Speed"],"answer":"2"},{"id":"74392","q":"Why does the sky appear blue on a clear day?","options":["Dispersion of light by water droplets","Scattering of light by dust particles and air molecules","Refraction of light by different layers of the atmosphere","Reflection of light from the ocean"],"answer":"2"},{"id":"74393","q":"The material used for an electric fuse wire must have:","options":["High melting point and high resistance","Low melting point and high resistance","Low melting point and low resistance","High melting point and low resistance"],"answer":"2"}];
let idx=0, answers={}, timerSec=3900, timerInt=null;

function render(){
  const q=DATA[idx];
  if(!q){document.getElementById('qText').textContent='No data.';return;}
  document.getElementById('qNum').textContent=idx+1;
  document.getElementById('qTotal').textContent=DATA.length;
  document.getElementById('qText').textContent=q.q;
  document.getElementById('opts').innerHTML=q.options.map((o,i)=>
    `<div class="option ${answers[idx]==(i+1)?'selected':''}" onclick="select(${i+1})">${String.fromCharCode(65+i)}. ${o}</div>`
  ).join('');
}
window.select=o=>{answers[idx]=o; render();};
window.prev=()=>{if(idx>0){idx--; render();}};
window.next=()=>{if(idx<DATA.length-1){idx++; render();}};

function submitTest(){
  clearInterval(timerInt);
  let c=0; for(let i=0;i<DATA.length;i++){if(answers[i]==DATA[i].answer)c++;}
  const pct=Math.round(c/DATA.length*100)||0;
  document.getElementById('qCard').classList.add('hidden');
  document.getElementById('resCard').classList.remove('hidden');
  document.getElementById('score').textContent=pct+'%';
  document.getElementById('detail').innerHTML='<b>'+c+'/'+DATA.length+'</b> correct';
}

function tick(){timerSec--; document.getElementById('timer').textContent=Math.floor(timerSec/60)+':'+String(timerSec%60).padStart(2,'0'); document.getElementById('bar').style.width=(timerSec/3900*100)+'%'; if(timerSec<=0){clearInterval(timerInt); submitTest();}}

render(); timerInt=setInterval(tick,1000);
</script>
</body></html>
