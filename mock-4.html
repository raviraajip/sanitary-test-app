<script>
const DATA=[{"id":"84882","q":"1. The joint Earth-observing mission 'NISAR', heavily monitored ahead of its 2025 launch to measure changes in Earth's ecosystems, is a collaboration between ISRO and: पृथ्वी के पारिस्थितिक तंत्र में परिवर्तनों को मापने के लिए अपने 2025 के प्रक्षेपण से पहले भारी निगरानी वाला संयुक्त पृथ्वी - अवलोकन मिशन 'NISAR', ISRO और किसके बीच एक सहयोग है ?","options":["ESA (European Space Agency)","NASA","JAXA","Roscosmos"],"answer":"2"},{"id":"84883","q":"2. In Operating Systems, a \"Page Fault\" occurs when: ऑपरेटिंग सिस्टम में , \" पेज फॉल्ट \" (Page Fault) तब होता है जब :","options":["The CPU tries to divide a number by zero (CPU किसी संख्या को शून्य से विभाजित करने का प्रयास करता है )","A process attempts to access a memory page that is not currently mapped in the physical RAM ( कोई प्रक्रिया उस मेमोरी पेज तक पहुंचने का प्रयास करती है जो वर्तमान में भौतिक RAM में मैप नहीं है )","Two processes are deadlocked waiting for the same resource ( दो प्रक्रियाएं एक ही संसाधन की प्रतीक्षा में डेडलॉक हो जाती हैं )","The hard drive experiences a mechanical read error ( हार्ड ड्राइव में यांत्रिक रीड त्रुटि होती है )"],"answer":"2"},{"id":"84884","q":"3. In molecular biology, \"Okazaki fragments\" are short sequences of DNA nucleotides. They are synthesized during DNA replication on which strand? आणविक जीव विज्ञान में , \" ओकाजाकी खंड \" (Okazaki fragments) डीएनए न्यूक्लियोटाइड के छोटे अनुक्रम हैं। डीएनए प्रतिकृति (replication) के दौरान इन्हें किस स्ट्रैंड पर संश्लेषित किया जाता है ?","options":["The leading strand ( लीडिंग स्ट्रैंड )","The lagging strand ( लैगिंग स्ट्रैंड )","The template RNA strand ( टेम्पलेट आरएनए स्ट्रैंड )","The promoter region ( प्रमोटर क्षेत्र )"],"answer":"2"},{"id":"84885","q":"4. According to the 2011 Census, which district of Bihar boasts the highest literacy rate? 2011 की जनगणना के अनुसार , बिहार के किस जिले की साक्षरता दर सबसे अधिक है ?","options":["Patna ( पटना )","Rohtas ( रोहतास )","Munger ( मुंगेर )","Bhojpur ( भोजपुर )"],"answer":"2"},{"id":"84886","q":"5. In the context of the Indian Constitution, the writ of 'Quo Warranto' is primarily issued to: भारतीय संविधान के संदर्भ में , ' अधिकार पृच्छा ' (Quo Warranto) की रिट मुख्य रूप से किसके लिए जारी की जाती है ?","options":["Compel a public authority to perform its mandatory duty ( किसी सार्वजनिक प्राधिकरण को अपना अनिवार्य कर्तव्य निभाने के लिए बाध्य करना )","Transfer a case from a lower court to a higher court ( निचली अदालत से उच्च न्यायालय में मामला स्थानांतरित करना )","Inquire into the legality of a person's claim to a public office ( सार्वजनिक कार्यालय में किसी व्यक्ति के दावे की वैधता की जांच करना )","Protect a citizen against unlawful arrest and detention ( गैरकानूनी गिरफ्तारी और हिरासत के खिलाफ एक नागरिक की रक्षा करना )"],"answer":"3"},{"id":"84887","q":"6. For a first-order chemical reaction, if the rate constant is k, the half-life ( ) of the reaction is given by the expression: प्रथम कोटि (first-order) की रासायनिक अभिक्रिया के लिए , यदि दर स्थिरांक k है , तो अभिक्रिया की अर्ध - आयु (t1/2) किस व्यंजक द्वारा दी जाती है ?","options":["0.693 / k","k / 0.693","1 / k","[Image-based option 4 — see original]"],"answer":"1"},{"id":"84888","q":"7. Under the Biomedical Waste Management Rules, 2016, discarded and broken glass ampoules and medicine vials must be disposed of in which specific container? बायोमेडिकल अपशिष्ट प्रबंधन नियम , 2016 के तहत , फेंके गए और टूटे हुए कांच के एम्प्यूल्स और दवा की शीशियों को किस विशिष्ट कंटेनर में निपटाया जाना चाहिए ?","options":["Red plastic bag ( लाल प्लास्टिक बैग )","Yellow plastic bag ( पीला प्लास्टिक बैग )","Blue cardboard box / puncture-proof container ( नीला कार्डबोर्ड बॉक्स / पंचर - प्रूफ कंटेनर )","White translucent container ( सफेद पारभासी कंटेनर )"],"answer":"3"},{"id":"84889","q":"8. The term 'Open Market Operations' (OMO) used by the Reserve Bank of India strictly refers to the: भारतीय रिज़र्व बैंक द्वारा उपयोग किए जाने वाले ' ओपन मार्केट ऑपरेशंस ' (OMO) शब्द का कड़ाई से तात्पर्य है :","options":["Buying and selling of foreign exchange in the international market ( अंतरराष्ट्रीय बाजार में विदेशी मुद्रा की खरीद और बिक्री )","Auctioning of non-performing assets of commercial banks ( वाणिज्यिक बैंकों की गैर - निष्पादित संपत्तियों की नीलामी )","Buying and selling of government securities to regulate systemic liquidity ( प्रणालीगत तरलता को नियंत्रित करने के लिए सरकारी प्रतिभूतियों की खरीद और बिक्री )","Issuance of sovereign gold bonds to the public ( जनता को सॉवरेन गोल्ड बॉन्ड जारी करना )"],"answer":"3"},{"id":"84890","q":"9. In the photoelectric effect, the minimum energy required to eject an electron from the surface of a metal is called the: ( प्रकाश वैद्युत प्रभाव (photoelectric effect) में , किसी धातु की सतह से इलेक्ट्रॉन को बाहर निकालने के लिए आवश्यक न्यूनतम ऊर्जा को क्या कहा जाता है ?)","options":["Stopping potential ( स्टॉपिंग पोटेंशियल )","Kinetic energy maximum ( अधिकतम गतिज ऊर्जा )","Work function ( कार्य फलन )","Threshold frequency ( देहली आवृत्ति )"],"answer":"3"},{"id":"84891","q":"10. The World Expo 2025, operating under the highly anticipated theme \"Designing Future Society for Our Lives\", is hosted by which global city? \" हमारे जीवन के लिए भविष्य के समाज को डिजाइन करना \" के बहुप्रतीक्षित विषय के तहत संचालित वर्ल्ड एक्सपो 2025 की मेजबानी किस वैश्विक शहर द्वारा की जा रही है ?","options":["Dubai, UAE","Osaka, Japan","Milan, Italy","Paris, France"],"answer":"2"},{"id":"84892","q":"11. In computer networking, the primary operational difference between TCP (Transmission Control Protocol) and UDP (User Datagram Protocol) is that: कंप्यूटर नेटवर्किंग में , TCP और UDP के बीच प्राथमिक परिचालन अंतर यह है कि :","options":["TCP operates at the Application layer; UDP operates at the Network layer (TCP एप्लीकेशन लेयर पर कार्य करता है ; UDP नेटवर्क लेयर पर कार्य करता है )","TCP is connectionless and fast; UDP is connection-oriented and reliable (TCP कनेक्शन रहित और तेज है ; UDP कनेक्शन - उन्मुख और विश्वसनीय है )","TCP is connection-oriented and guarantees delivery; UDP is connectionless and does not guarantee delivery (TCP कनेक्शन - उन्मुख है और डिलीवरी की गारंटी देता है ; UDP कनेक्शन रहित है और डिलीवरी की गारंटी नहीं देता है )","TCP is used exclusively for wireless networks; UDP is used for wired networks (TCP का उपयोग विशेष रूप से वायरलेस नेटवर्क के लिए किया जाता है ; UDP का उपयोग वायर्ड नेटवर्क के लिए किया जाता है )"],"answer":"3"},{"id":"84893","q":"12. The Tropic of Cancer passes through the middle of India. Which of the following Indian rivers is crossed twice by the Tropic of Cancer? ( कर्क रेखा भारत के मध्य से होकर गुजरती है। निम्नलिखित में से किस भारतीय नदी को कर्क रेखा दो बार पार करती है ?)","options":["Narmada ( नर्मदा )","Tapi ( ताप्ती )","Mahi ( माही )","Sabarmati ( साबरमती )"],"answer":"3"},{"id":"84894","q":"13. Which ancient Indian text is a foundational treatise on statecraft, economic policy, and military strategy? ( कौन सा प्राचीन भारतीय ग्रंथ शासन कला , आर्थिक नीति और सैन्य रणनीति पर एक आधारभूत ग्रंथ है ?)","options":["Manusmriti ( मनुस्मृति )","Arthashastra ( अर्थशास्त्र )","Upanishads ( उपनिषद )","Rigveda ( ऋग्वेद )"],"answer":"2"},{"id":"84895","q":"14. To minimize water loss while maximizing photosynthesis, C4 plants (like maize and sugarcane) exhibit a specialized leaf anatomy characterized by prominent bundle sheath cells. This is known as: प्रकाश संश्लेषण को अधिकतम करते हुए पानी के नुकसान को कम करने के लिए , C4 पौधे ( जैसे मक्का और गन्ना ) एक विशेष पत्ती शरीर रचना प्रदर्शित करते हैं जो प्रमुख बंडल आवरण कोशिकाओं द्वारा विशेषता है। इसे किस रूप में जाना जाता है ?","options":["Reticulate anatomy ( जालिकावत शरीर रचना )","Krantz anatomy ( क्रैन्ज़ एनाटॉमी )","Xerophytic anatomy ( ज़ेरोफाइटिक एनाटॉमी )","Spongy mesophyll anatomy ( स्पंजी मेसोफिल एनाटॉमी )"],"answer":"2"},{"id":"84896","q":"15. The historic 'Sampoorna Kranti' (Total Revolution) movement in 1974, which had a profound impact on Indian national politics, was launched in Bihar by: 1974 में ऐतिहासिक ' संपूर्ण क्रांति ' आंदोलन , जिसका भारतीय राष्ट्रीय राजनीति पर गहरा प्रभाव पड़ा , बिहार में किसके द्वारा शुरू किया गया था ?","options":["Karpoori Thakur ( कर्पूरी ठाकुर )","Ram Manohar Lohia ( राम मनोहर लोहिया )","Jayaprakash Narayan ( जयप्रकाश नारायण )","Jagjivan Ram ( जगजीवन राम )"],"answer":"3"},{"id":"84897","q":"16. Lenz's Law of electromagnetic induction is a direct consequence of the law of conservation of: ( विद्युत चुम्बकीय प्रेरण का लेन्ज़ का नियम (Lenz's Law) किसके संरक्षण के नियम का प्रत्यक्ष परिणाम है ?)","options":["Charge ( आवेश )","Momentum ( संवेग )","Mass ( द्रव्यमान )","Energy ( ऊर्जा )"],"answer":"4"},{"id":"84898","q":"17. The 'Kyoto Protocol' was an international treaty that primarily aimed to: (' क्योटो प्रोटोकॉल ' एक अंतरराष्ट्रीय संधि थी जिसका मुख्य उद्देश्य था :)","options":["Protect the ozone layer ( ओजोन परत की रक्षा करना )","Reduce greenhouse gas emissions ( ग्रीनहाउस गैस उत्सर्जन को कम करना )","Regulate international trade in endangered species ( लुप्तप्राय प्रजातियों में अंतर्राष्ट्रीय व्यापार को विनियमित करना )","Prevent marine plastic pollution ( समुद्री प्लास्टिक प्रदूषण को रोकना )"],"answer":"2"},{"id":"84899","q":"18. Which Constitutional Amendment Act added the 'Ninth Schedule' to the Indian Constitution to protect land reform laws from judicial review? ( किस संविधान संशोधन अधिनियम ने भूमि सुधार कानूनों को न्यायिक समीक्षा से बचाने के लिए भारतीय संविधान में ' नौवीं अनुसूची ' जोड़ी ?)","options":["First Amendment (1951) ( पहला संशोधन , 1951)","Fourth Amendment (1955) ( चौथा संशोधन , 1955)","Seventh Amendment (1956) ( सातवां संशोधन , 1956)","Forty-Second Amendment (1976) (42 वां संशोधन , 1976)"],"answer":"1"},{"id":"84900","q":"19. The ICC Women’s Cricket World Cup 2025 is scheduled to be hosted by: (ICC महिला क्रिकेट विश्व कप 2025 की मेजबानी किसके द्वारा की जानी निर्धारित है ?)","options":["Australia ( ऑस्ट्रेलिया )","England ( इंग्लैंड )","India ( भारत )","South Africa ( दक्षिण अफ्रीका )"],"answer":"3"},{"id":"84901","q":"20. In Database Management Systems (DBMS), the ACID properties ensure reliable transaction processing. What does the \"I\" in ACID stand for? डेटाबेस मैनेजमेंट सिस्टम (DBMS) में , ACID गुण विश्वसनीय लेनदेन प्रसंस्करण सुनिश्चित करते हैं। ACID में \"I\" का क्या अर्थ है ?","options":["Integrity ( इंटीग्रिटी )","Isolation ( आइसोलेशन )","Indexing ( इंडेक्सिंग )","Instantiation ( इंस्टेंशिएशन )"],"answer":"2"},{"id":"84902","q":"21. According to Valence Shell Electron Pair Repulsion (VSEPR) theory and hybridization principles, the hybridization state of sulfur in Sulfur hexafluoride ( ) is: VSEPR सिद्धांत और संकरण (hybridization) सिद्धांतों के अनुसार , सल्फर हेक्साफ्लोराइड (SF6) में सल्फर की संकरण अवस्था क्या है ?","options":["[Image-based option 1 — see original]","[Image-based option 2 — see original]","[Image-based option 3 — see original]","[Image-based option 4 — see original]"],"answer":"3"},{"id":"84903","q":"22. The ancient and highly revered university of Vikramashila was established on the banks of which river? विक्रमशिला का प्राचीन और अत्यधिक श्रद्धेय विश्वविद्यालय किस नदी के तट पर स्थापित किया गया था ?","options":["Ganga ( गंगा )","Kosi ( कोसी )","Gandak ( गंडक )","Son ( सोन )"],"answer":"1"},{"id":"84904","q":"23. During the generation of an action potential in a human neuron, the rapid 'depolarization' phase is primarily caused by the: मानव न्यूरॉन में एक्शन पोटेंशियल (action potential) के निर्माण के दौरान , तीव्र ' विध्रुवण ' (depolarization) चरण मुख्य रूप से किसके कारण होता है ?","options":["Efflux of Potassium ( ) ions ( पोटेशियम (K+) आयनों का बहिर्वाह )","Influx of Sodium ( ) ions ( सोडियम (Na+) आयनों का प्रवाह )","Influx of Calcium ( ) ions ( कैल्शियम (Ca2+) आयनों का प्रवाह )","Efflux of Chloride ( ) ions ( क्लोराइड (Cl-) आयनों का बहिर्वाह )"],"answer":"2"},{"id":"84905","q":"24. What is the minimum qualifying age for a person to be elected as the President of India? भारत के राष्ट्रपति के रूप में चुने जाने के लिए किसी व्यक्ति की न्यूनतम अर्हक आयु कितनी है ?","options":["25 years","30 years","35 years","40 years"],"answer":"3"},{"id":"84906","q":"25. Which of the following mountain ranges is structurally considered a 'Block Mountain'? निम्नलिखित में से किस पर्वत श्रृंखला को संरचनात्मक रूप से ' ब्लॉक माउंटेन ' ( भ्रंशोत्थ पर्वत ) माना जाता है ?","options":["Himalayas ( हिमालय )","Alps ( आल्प्स )","Vindhyas ( विंध्य )","Andes ( एंडीज )"],"answer":"3"},{"id":"84907","q":"26. In modern cybersecurity, the RSA algorithm is a widely used cryptographic protocol. It operates on the principle of: आधुनिक साइबर सुरक्षा में , RSA एल्गोरिदम एक व्यापक रूप से उपयोग किया जाने वाला क्रिप्टोग्राफ़िक प्रोटोकॉल है। यह किस सिद्धांत पर काम करता है ?","options":["Symmetric key encryption using a single shared private key ( एकल साझा निजी कुंजी का उपयोग करके सममित कुंजी एन्क्रिप्शन )","Asymmetric key encryption using a public key and a private key ( सार्वजनिक कुंजी और निजी कुंजी का उपयोग करके असममित कुंजी एन्क्रिप्शन )","Hashing algorithms that cannot be decrypted ( हैशिंग एल्गोरिदम जिन्हें डिक्रिप्ट नहीं किया जा सकता )","MAC address filtering ( मैक एड्रेस फ़िल्टरिंग )"],"answer":"2"},{"id":"84908","q":"27. The process by which solid waste is subjected to biological decomposition under controlled aerobic conditions to produce a humus-like product is called: वह प्रक्रिया जिसके द्वारा ठोस अपशिष्ट को नियंत्रित एरोबिक परिस्थितियों में जैविक अपघटन के अधीन किया जाता है ताकि ह्यूमस जैसा उत्पाद तैयार किया जा सके , कहलाती है :","options":["Incineration ( भस्मीकरण )","Pyrolysis ( पायरोलिसिस )","Composting ( कम्पोस्टिंग / खाद बनाना )","Landfilling ( लैंडफिलिंग )"],"answer":"3"},{"id":"84909","q":"28. In 2025, the 'BRICS' organization officially operates with its expanded membership. Which of the following countries was not integrated as a new member? 2025 में , ' ब्रिक्स ' संगठन आधिकारिक तौर पर अपनी विस्तारित सदस्यता के साथ काम कर रहा है। निम्नलिखित में से किस देश को नए सदस्य के रूप में एकीकृत नहीं किया गया था ?","options":["Ethiopia ( इथियोपिया )","Iran ( ईरान )","UAE ( यूएई )","Pakistan ( पाकिस्तान )"],"answer":"4"},{"id":"84910","q":"29. The moment of inertia of a uniform solid sphere of mass M and radius R about an axis passing through its center is: द्रव्यमान M और त्रिज्या R के एक समान ठोस गोले का उसके केंद्र से गुजरने वाले अक्ष के परितः जड़त्व आघूर्ण (moment of inertia) है :","options":["[Image-based option 1 — see original]","[Image-based option 2 — see original]","[Image-based option 3 — see original]","[Image-based option 4 — see original]"],"answer":"2"},{"id":"84911","q":"30. The fundamental principle of establishing a 'Welfare State' in India is most prominently enshrined in the: भारत में ' कल्याणकारी राज्य ' (Welfare State) स्थापित करने का मूल सिद्धांत सबसे प्रमुखता से किसमें निहित है ?","options":["Preamble ( प्रस्तावना )","Fundamental Rights ( मौलिक अधिकार )","Directive Principles of State Policy ( राज्य के नीति निदेशक तत्व )","Fundamental Duties ( मौलिक कर्तव्य )"],"answer":"3"},{"id":"84912","q":"31. In recombinant DNA technology, \"Restriction Endonucleases\" are critical enzymes utilized primarily to: पुनर्संयोजक डीएनए (recombinant DNA) तकनीक में , \" प्रतिबंध एंडोन्यूक्लिअस \" (Restriction Endonucleases) महत्वपूर्ण एंजाइम हैं जिनका उपयोग मुख्य रूप से किसके लिए किया जाता है ?","options":["Join two DNA strands together ( दो डीएनए स्ट्रैंड को एक साथ जोड़ने के लिए )","Cleave DNA molecules at specific recognition sequences ( विशिष्ट मान्यता अनुक्रमों पर डीएनए अणुओं को काटने के लिए )","Synthesize RNA from a DNA template ( डीएनए टेम्पलेट से आरएनए को संश्लेषित करने के लिए )","Unwind the DNA double helix ( डीएनए डबल हेलिक्स को खोलने के लिए )"],"answer":"2"},{"id":"84913","q":"32. Which state in India has the longest coastline? ( भारत में किस राज्य की तटरेखा सबसे लंबी है ?)","options":["Maharashtra ( महाराष्ट्र )","Andhra Pradesh ( आंध्र प्रदेश )","Gujarat ( गुजरात )","Tamil Nadu ( तमिलनाडु )"],"answer":"3"},{"id":"84914","q":"33. The 'Biochemical Oxygen Demand' (BOD) of a municipal wastewater sample is a direct measure of: नगर निगम अपशिष्ट जल के नमूने की ' बायोकेमिकल ऑक्सीजन डिमांड ' (BOD) किसका प्रत्यक्ष माप है ?","options":["The amount of oxygen required by bacteria to decompose organic matter under aerobic conditions ( एरोबिक स्थितियों के तहत कार्बनिक पदार्थों को विघटित करने के लिए बैक्टीरिया द्वारा आवश्यक ऑक्सीजन की मात्रा )","The total dissolved oxygen natively present in the water ( पानी में मूल रूप से मौजूद कुल घुलित ऑक्सीजन )","The amount of heavy metals dissolved in the effluent ( प्रवाह में घुली भारी धातुओं की मात्रा )","The rate of photosynthesis by aquatic flora ( जलीय वनस्पतियों द्वारा प्रकाश संश्लेषण की दर )"],"answer":"1"},{"id":"84915","q":"34. The famous 'Santhal Rebellion' (1855-56) against the British East India Company and the oppressive zamindari system was led by: ब्रिटिश ईस्ट इंडिया कंपनी और दमनकारी जमींदारी व्यवस्था के खिलाफ प्रसिद्ध ' संथाल विद्रोह ' (1855-56) का नेतृत्व किसने किया था ?","options":["Birsa Munda ( बिरसा मुंडा )","Sidhu and Kanhu ( सिद्धू और कान्हू )","Tilka Manjhi ( तिलका मांझी )","Tana Bhagat ( ताना भगत )"],"answer":"2"},{"id":"84916","q":"35. In data structures and algorithms, the worst-case time complexity of finding a specific element using the \"Binary Search\" algorithm on a sorted array of n elements is: डेटा संरचनाओं और एल्गोरिदम में , n तत्वों के एक सॉर्ट किए गए एरे पर \" बाइनरी सर्च \" एल्गोरिदम का उपयोग करके एक विशिष्ट तत्व को खोजने की वर्स्ट - केस टाइम कॉम्प्लेक्सिटी क्या है ?","options":["O(1)","O(log n)","O(n)","O(n log n)"],"answer":"2"},{"id":"84917","q":"36. Which of the following economic concepts refers to the decline in the value of a physical asset over time due to wear, tear, and obsolescence? निम्नलिखित में से कौन सी आर्थिक अवधारणा टूट - फूट और अप्रचलन के कारण समय के साथ भौतिक संपत्ति के मूल्य में गिरावट को संदर्भित करती है ?","options":["Inflation ( मुद्रास्फीति )","Deflation ( अपस्फीति )","Depreciation ( मूल्यह्रास )","Devaluation ( अवमूल्यन )"],"answer":"3"},{"id":"84918","q":"37. Which Indian state launched the popular 'Mukhyamantri Maiya Samman Yojana' (MMSY) to provide direct cash transfers to women, gaining major political traction leading into 2025? किस भारतीय राज्य ने महिलाओं को सीधे नकद हस्तांतरण प्रदान करने के लिए लोकप्रिय ' मुख्यमंत्री मइयां सम्मान योजना ' (MMSY) शुरू की , जिसने 2025 तक बड़ा राजनीतिक कर्षण प्राप्त किया ?","options":["Bihar ( बिहार )","Jharkhand ( झारखंड )","Madhya Pradesh ( मध्य प्रदेश )","Rajasthan ( राजस्थान )"],"answer":"2"},{"id":"84919","q":"38. In complex electrical circuits, Kirchhoff's Voltage Law (KVL), which states that the directed sum of the potential differences around any closed loop is zero, is fundamentally based on the conservation of: जटिल विद्युत परिपथों में , किरचॉफ का वोल्टेज नियम (KVL), जो बताता है कि किसी भी बंद लूप के चारों ओर संभावित अंतरों का निर्देशित योग शून्य है , मौलिक रूप से किसके संरक्षण पर आधारित है ?","options":["Charge ( आवेश )","Energy ( ऊर्जा )","Momentum ( संवेग )","Mass ( द्रव्यमान )"],"answer":"2"},{"id":"84920","q":"39. The 'Right to Privacy' was declared a fundamental right by the Supreme Court of India under which Article? भारत के सर्वोच्च न्यायालय द्वारा ' निजता के अधिकार ' (Right to Privacy) को किस अनुच्छेद के तहत मौलिक अधिकार घोषित किया गया था ?","options":["Article 14 ( अनुच्छेद 14)","Article 19 ( अनुच्छेद 19)","Article 21 ( अनुच्छेद 21)","Article 25 ( अनुच्छेद 25)"],"answer":"3"},{"id":"84921","q":"40. Which of the following Indian states does the river Brahmaputra flow through? ब्रह्मपुत्र नदी निम्नलिखित में से किस भारतीय राज्य से होकर बहती है ?","options":["Sikkim and West Bengal ( सिक्किम और पश्चिम बंगाल )","Arunachal Pradesh and Assam ( अरुणाचल प्रदेश और असम )","Meghalaya and Tripura ( मेघालय और त्रिपुरा )","Manipur and Mizoram ( मणिपुर और मिजोरम )"],"answer":"2"},{"id":"84922","q":"41. Solid waste incineration primarily reduces the physical volume of municipal solid waste by approximately: ठोस अपशिष्ट भस्मीकरण (incineration) मुख्य रूप से नगरपालिका ठोस कचरे की भौतिक मात्रा को लगभग कितना कम कर देता है ?","options":["20-30%","40-50%","60-70%","80-90%"],"answer":"4"},{"id":"84923","q":"42. Who among the following was a prominent leader of the 'Wahabi Movement', which had Patna as its major operational center in the 19th century? निम्नलिखित में से कौन ' वहाबी आंदोलन ' का एक प्रमुख नेता था , जिसका 19 वीं शताब्दी में प्रमुख परिचालन केंद्र पटना था ?","options":["Syed Ahmed Barelvi ( सैयद अहमद बरेलवी )","Sir Syed Ahmed Khan ( सर सैयद अहमद खान )","Maulana Abul Kalam Azad ( मौलाना अबुल कलाम आजाद )","Haji Shariatullah ( हाजी शरीयतुल्लाह )"],"answer":"1"},{"id":"84924","q":"43. In electrochemistry, the Nernst Equation is primarily utilized to: इलेक्ट्रोकैमिस्ट्री में , नर्नस्ट समीकरण (Nernst Equation) का मुख्य रूप से उपयोग किया जाता है :","options":["Calculate the total heat of a reaction ( प्रतिक्रिया की कुल ऊष्मा की गणना करने के लिए )","Determine the activation energy of a catalyst ( उत्प्रेरक की सक्रियण ऊर्जा निर्धारित करने के लिए )","Calculate the electromotive force (EMF) of a cell under non-standard conditions ( गैर - मानक स्थितियों के तहत सेल के इलेक्ट्रोमोटिव बल (EMF) की गणना करने के लिए )","Determine the half-life of a radioactive isotope ( रेडियोधर्मी आइसोटोप का आधा जीवन निर्धारित करने के लिए )"],"answer":"3"},{"id":"84925","q":"44. What is the primary ecological function of the 'Ozone Layer' in the Earth's stratosphere? ( पृथ्वी के समताप मंडल (stratosphere) में ' ओजोन परत ' का प्राथमिक पारिस्थितिक कार्य क्या है ?)","options":["To trap heat and sustain the Earth's average temperature ( गर्मी को फंसाने और पृथ्वी के औसत तापमान को बनाए रखने के लिए )","To absorb and filter harmful ultraviolet-B (UV-B) radiation from the Sun ( सूर्य से हानिकारक पराबैंगनी - बी (UV-B) विकिरण को अवशोषित और फ़िल्टर करने के लिए )","To provide a concentrated layer of oxygen for high-altitude weather systems ( उच्च ऊंचाई वाले मौसम प्रणालियों के लिए ऑक्सीजन की एक केंद्रित परत प्रदान करने के लिए )","To reflect radio waves facilitating global communication ( रेडियो तरंगों को प्रतिबिंबित करने के लिए जिससे वैश्विक संचार की सुविधा मिलती है )"],"answer":"2"},{"id":"84926","q":"45. The 'Goods and Services Tax' (GST) implemented in India is classified as a: ( भारत में लागू ' वस्तु एवं सेवा कर ' (GST) को किस रूप में वर्गीकृत किया गया है ?)","options":["Direct, origin-based tax ( प्रत्यक्ष , उद्गम - आधारित कर )","Indirect, destination-based tax ( अप्रत्यक्ष , गंतव्य - आधारित कर )","Direct, destination-based tax ( प्रत्यक्ष , गंतव्य - आधारित कर )","Indirect, origin-based tax ( अप्रत्यक्ष , उद्गम - आधारित कर )"],"answer":"2"},{"id":"84927","q":"46. In computer architecture, Cache memory is highly effective at speeding up the CPU primarily due to the principle of: ( कंप्यूटर आर्किटेक्चर में , कैश मेमोरी मुख्य रूप से किस सिद्धांत के कारण CPU की गति बढ़ाने में अत्यधिक प्रभावी है ?)","options":["Multithreading ( मल्टीथ्रेडिंग )","Locality of Reference (Spatial and Temporal) ( संदर्भ की स्थानीयता - स्थानिक और अस्थायी (Locality of Reference))","Virtual Memory Paging ( वर्चुअल मेमोरी पेजिंग )","Direct Memory Access (DMA) ( डायरेक्ट मेमोरी एक्सेस )"],"answer":"2"},{"id":"84928","q":"47. The 2025 United Nations Climate Change Conference (COP30) is scheduled to be held in: 2025 संयुक्त राष्ट्र जलवायु परिवर्तन सम्मेलन (COP30) कहाँ आयोजित किया जाना निर्धारित है ?","options":["Baku, Azerbaijan ( बाकू , अज़रबैजान )","Belém, Brazil ( बेलेम , ब्राज़ील )","Bonn, Germany ( बॉन , जर्मनी )","New York, USA ( न्यूयॉर्क , यूएसए )"],"answer":"2"},{"id":"84929","q":"48. In Web Development, when designing a RESTful API, which HTTP method should strictly be used to completely replace or update an existing resource? वेब डेवलपमेंट में , RESTful API डिज़ाइन करते समय , किसी मौजूदा संसाधन (resource) को पूरी तरह से बदलने या अपडेट करने के लिए कड़ाई से किस HTTP विधि का उपयोग किया जाना चाहिए ?","options":["GET","POST","PUT","PATCH"],"answer":"3"},{"id":"84930","q":"49. In population genetics, the Hardy-Weinberg equilibrium principle states that allele and genotype frequencies in a population will remain constant from generation to generation in the absence of other evolutionary influences. Which of the following is an assumption required for this equilibrium? जनसंख्या आनुवंशिकी में , हार्डी - वेनबर्ग संतुलन सिद्धांत बताता है कि एक आबादी में एलील और जीनोटाइप आवृत्तियाँ अन्य विकासवादी प्रभावों की अनुपस्थिति में पीढ़ी दर पीढ़ी स्थिर रहेंगी। इस संतुलन के लिए निम्नलिखित में से कौन सी धारणा आवश्यक है ?","options":["High rate of mutation ( उत्परिवर्तन की उच्च दर )","Non-random mating ( गैर - यादृच्छिक संभोग )","Small population size ( छोटी जनसंख्या का आकार )","No gene flow (migration) ( कोई जीन प्रवाह ( प्रवास ) नहीं )"],"answer":"4"},{"id":"84931","q":"50. The 'Concurrent List' contains subjects of common interest to both the Union and the States. How many items does it currently contain (following the 42nd Amendment)? ' समवर्ती सूची ' में संघ और राज्यों दोनों के समान हित के विषय शामिल हैं। वर्तमान में इसमें कितने विषय ( आइटम ) शामिल हैं (42 वें संशोधन के बाद )?","options":["47 items (originally 47, now 52)","66 items (originally 66, now 61)","97 items (originally 97, now 100)","100 items (originally 100, now 97)"],"answer":"1"},{"id":"84932","q":"51. The 'Barabar Caves', representing some of the oldest surviving rock-cut caves in India, are located in which district of Bihar? भारत में सबसे पुरानी जीवित रॉक - कट गुफाओं का प्रतिनिधित्व करने वाली ' बराबर गुफाएं ' बिहार के किस जिले में स्थित हैं ?","options":["Gaya ( गया )","Jehanabad ( जहानाबाद )","Nalanda ( नालंदा )","Rohtas ( रोहतास )"],"answer":"2"},{"id":"84933","q":"52. In astrophysics, the phenomenon where light emitted from a galaxy moving rapidly away from Earth shifts towards longer wavelengths is known as: खगोल भौतिकी में , वह घटना जिसमें पृथ्वी से तेजी से दूर जाने वाली आकाशगंगा से उत्सर्जित प्रकाश लंबी तरंग दैर्ध्य (longer wavelengths) की ओर शिफ्ट हो जाता है , क्या कहलाती है ?","options":["Blue shift ( ब्लू शिफ्ट )","Red shift ( रेड शिफ्ट )","Chromatic aberration ( क्रोमैटिक एबरेशन )","Rayleigh scattering ( रेले स्कैटरिंग )"],"answer":"2"},{"id":"84934","q":"53. In the specialized treatment of electronic waste (e-waste), 'Hydrometallurgy' refers to the process of: इलेक्ट्रॉनिक कचरे ( ई - कचरा ) के विशेष उपचार में , ' हाइड्रोमेटालर्जी ' (Hydrometallurgy) की प्रक्रिया का तात्पर्य है :","options":["Melting e-waste at extremely high temperatures in a blast furnace ( ब्लास्ट फर्नेस में अत्यधिक उच्च तापमान पर ई - कचरे को पिघलाना )","Using liquid solvents and acids to leach and extract precious metals from circuit boards ( सर्किट बोर्ड से कीमती धातुओं को निकालने के लिए तरल सॉल्वैंट्स और एसिड का उपयोग करना )","Using microorganisms to break down toxic plastics ( जहरीले प्लास्टिक को तोड़ने के लिए सूक्ष्मजीवों का उपयोग करना )","Compacting e-waste using high-pressure hydraulic presses ( उच्च दबाव वाले हाइड्रोलिक प्रेस का उपयोग करके ई - कचरे को कॉम्पैक्ट करना )"],"answer":"2"},{"id":"84935","q":"54. The 'Repo Rate', a critical tool for managing inflation, is determined and announced by the: ( मुद्रास्फीति को प्रबंधित करने के लिए एक महत्वपूर्ण उपकरण ' रेपो रेट ', किसके द्वारा निर्धारित और घोषित किया जाता है ?)","options":["Ministry of Finance ( वित्त मंत्रालय )","State Bank of India ( भारतीय स्टेट बैंक )","NITI Aayog ( नीति आयोग )","Monetary Policy Committee (MPC) of the RBI (RBI की मौद्रिक नीति समिति (MPC))"],"answer":"4"},{"id":"84936","q":"55. Which Indian state was the first to pass a Uniform Civil Code (UCC) bill post-independence, enacting it in early 2024 for implementation ahead of 2025? स्वतंत्रता के बाद 2025 से पहले कार्यान्वयन के लिए 2024 की शुरुआत में समान नागरिक संहिता (UCC) विधेयक पारित करने वाला पहला भारतीय राज्य कौन सा था ?","options":["Gujarat ( गुजरात )","Goa ( गोवा )","Uttarakhand ( उत्तराखंड )","Assam ( असम )"],"answer":"3"},{"id":"84937","q":"56. In Operating System theory, which of the following is not one of the four necessary conditions for a \"Deadlock\" to occur? ऑपरेटिंग सिस्टम थ्योरी में , \" डेडॉक \" (Deadlock) होने के लिए चार आवश्यक शर्तों में से कौन सी एक नहीं है ?","options":["Mutual Exclusion ( म्यूचुअल एक्सक्लूजन )","Hold and Wait ( होल्ड एंड वेट )","Preemption ( प्रिएम्पशन )","Circular Wait ( सर्कुलर वेट )"],"answer":"3"},{"id":"84938","q":"57. According to VSEPR theory, the molecular geometry (shape) of Xenon tetrafluoride ( ) is: VSEPR सिद्धांत के अनुसार , ज़ेनॉन टेट्राफ्लोराइड (XeF4) की आणविक ज्यामिति ( आकार ) क्या है ?","options":["Tetrahedral ( चतुष्फलकीय )","Square planar ( वर्ग समतलीय )","See-saw ( सी - सॉ )","Octahedral ( अष्टफलकीय )"],"answer":"2"},{"id":"84939","q":"58. Who was awarded the \"Bharat Ratna\" (posthumously) in 2024 for his monumental contribution to social justice and reservation policies in Bihar? बिहार में सामाजिक न्याय और आरक्षण नीतियों में उनके स्मारकीय योगदान के लिए 2024 में ( मरणोपरांत ) किसे \" भारत रत्न \" से सम्मानित किया गया था ?","options":["Lalit Narayan Mishra ( ललित नारायण मिश्रा )","Karpoori Thakur ( कर्पूरी ठाकुर )","Jagjivan Ram ( जगजीवन राम )","Jayaprakash Narayan ( जयप्रकाश नारायण )"],"answer":"2"},{"id":"84940","q":"59. Which of the following is NOT a tributary of the Ganga River? निम्नलिखित में से कौन गंगा नदी की सहायक नदी नहीं है ?","options":["Yamuna ( यमुना )","Son ( सोन )","Kosi ( कोसी )","Godavari ( गोदावरी )"],"answer":"4"},{"id":"84941","q":"60. The 'Bhojpur' region of Bihar is culturally renowned for a traditional folk theater form known as: बिहार का ' भोजपुर ' क्षेत्र सांस्कृतिक रूप से एक पारंपरिक लोक रंगमंच के रूप के लिए प्रसिद्ध है जिसे जाना जाता है :","options":["Bidesiya ( बिदेसिया )","Jatra ( जात्रा )","Yakshagana ( यक्षगान )","Bhavai ( भवई )"],"answer":"1"},{"id":"84942","q":"61. Which specific class of immunoglobulins (antibodies) is most abundantly found in a mother's colostrum, providing critical early mucosal immunity to the newborn? इम्युनोग्लोबुलिन ( एंटीबॉडी ) का कौन सा विशिष्ट वर्ग माँ के कोलोस्ट्रम में सबसे प्रचुर मात्रा में पाया जाता है , जो नवजात शिशु को महत्वपूर्ण प्रारंभिक श्लैष्मिक प्रतिरक्षा (mucosal immunity) प्रदान करता है ?","options":["IgG","IgM","IgA","IgE"],"answer":"3"},{"id":"84943","q":"62. According to the Solid Waste Management Rules, 2016, the legal responsibility for the initial segregation of waste into wet, dry, and domestic hazardous categories lies exclusively with: ठोस अपशिष्ट प्रबंधन नियम , 2016 के अनुसार , कचरे को गीले , सूखे और घरेलू खतरनाक श्रेणियों में प्रारंभिक रूप से अलग करने की कानूनी जिम्मेदारी विशेष रूप से किसकी है ?","options":["The Municipal Corporation ( नगर निगम )","The State Pollution Control Board ( राज्य प्रदूषण नियंत्रण बोर्ड )","The Waste Generator ( कचरा उत्पन्न करने वाला )","The Central Pollution Control Board ( केंद्रीय प्रदूषण नियंत्रण बोर्ड )"],"answer":"3"},{"id":"84944","q":"63. The economic condition termed 'Stagflation' is characterized by: ' स्टैगफ्लेशन ' (Stagflation) नामक आर्थिक स्थिति की विशेषता है :","options":["High economic growth and high inflation ( उच्च आर्थिक विकास और उच्च मुद्रास्फीति )","High inflation combined with high unemployment and stagnant demand ( उच्च मुद्रास्फीति के साथ - साथ उच्च बेरोजगारी और स्थिर मांग )","Low inflation and low unemployment ( कम मुद्रास्फीति और कम बेरोजगारी )","Deflation and rapid industrialization ( अपस्फीति और तीव्र औद्योगीकरण )"],"answer":"2"},{"id":"84945","q":"64. Which constitutional amendment officially introduced the 'Anti-Defection Law' into the Indian Constitution by adding the Tenth Schedule? किस संवैधानिक संशोधन ने दसवीं अनुसूची जोड़कर आधिकारिक तौर पर भारतीय संविधान में ' दल - बदल विरोधी कानून ' पेश किया ?","options":["42nd Amendment (42 वां संशोधन )","44th Amendment (44 वां संशोधन )","52nd Amendment (52 वां संशोधन )","73rd Amendment (73 वां संशोधन )"],"answer":"3"},{"id":"84946","q":"65. NASA's highly anticipated 'Artemis II' mission, scheduled for launch around 2025, has the primary operational objective of: 2025 के आसपास लॉन्च होने वाले नासा के बहुप्रतीक्षित ' आर्टेमिस II' मिशन का प्राथमिक परिचालन उद्देश्य है :","options":["Deploying a robotic rover to the Martian surface ( मंगल की सतह पर रोबोटिक रोवर तैनात करना )","Conducting a crewed flyby mission around the Moon and returning to Earth ( चंद्रमा के चारों ओर एक क्रू फ्लाईबाई मिशन का संचालन करना और पृथ्वी पर लौटना )","Establishing a permanent human base on the Moon's south pole ( चंद्रमा के दक्षिणी ध्रुव पर एक स्थायी मानव आधार स्थापित करना )","Executing a kinetic impact to alter the trajectory of an asteroid ( एक क्षुद्रग्रह के प्रक्षेपवक्र को बदलने के लिए एक गतिज प्रभाव को निष्पादित करना )"],"answer":"2"},{"id":"84947","q":"66. In SQL Database querying, a LEFT OUTER JOIN between Table A and Table B will return: (SQL डेटाबेस क्वेरी में , टेबल A और टेबल B के बीच एक LEFT OUTER JOIN क्या रिटर्न करेगा ?)","options":["Only the records that have matching values in both tables ( केवल वे रिकॉर्ड जिनके दोनों तालिकाओं में मिलान मूल्य हैं )","All records from Table A, and the matched records from Table B (with NULLs for unmatched Table B rows) ( टेबल A से सभी रिकॉर्ड , और टेबल B से मेल खाने वाले रिकॉर्ड ( बेमेल टेबल B पंक्तियों के लिए NULL के साथ ))","All records from Table B, and the matched records from Table A ( टेबल B से सभी रिकॉर्ड , और टेबल A से मेल खाने वाले रिकॉर्ड )","All records from both tables, combining them completely regardless of matches ( दोनों तालिकाओं से सभी रिकॉर्ड , मैचों की परवाह किए बिना उन्हें पूरी तरह से संयोजित करना )"],"answer":"2"},{"id":"84948","q":"67. In the fabrication of extrinsic semiconductors, a P-type semiconductor is created by doping pure Silicon or Germanium with a: बाह्य अर्धचालकों (extrinsic semiconductors) के निर्माण में , शुद्ध सिलिकॉन या जर्मेनियम को किसके साथ डोपिंग करके P- प्रकार का अर्धचालक बनाया जाता है ?","options":["Pentavalent impurity (e.g., Phosphorus, Arsenic) ( पेंटावैलेंट अशुद्धता ( जैसे , फास्फोरस , आर्सेनिक ))","Trivalent impurity (e.g., Boron, Indium) ( त्रिसंयोजक (Trivalent) अशुद्धता ( जैसे , बोरोन , इंडियम ))","Tetravalent impurity (e.g., Carbon) ( चतुःसंयोजक (Tetravalent) अशुद्धता ( जैसे , कार्बन ))","Hexavalent impurity (e.g., Sulfur) ( हेक्सावैलेंट अशुद्धता ( जैसे , सल्फर ))"],"answer":"2"},{"id":"84949","q":"68. The ancient ruins of Vaishali in Bihar are deeply associated with the birth of which great spiritual leader? ( बिहार में वैशाली के प्राचीन खंडहर किस महान आध्यात्मिक नेता के जन्म से गहराई से जुड़े हैं ?)","options":["Gautama Buddha ( गौतम बुद्ध )","Mahavira ( महावीर )","Guru Nanak ( गुरु नानक )","Adi Shankaracharya ( आदि शंकराचार्य )"],"answer":"2"},{"id":"84950","q":"69. Which of the following is considered an 'Indirect Tax' in the Indian tax structure? ( भारतीय कर ढांचे में निम्नलिखित में से किसे ' अप्रत्यक्ष कर ' (Indirect Tax) माना जाता है ?)","options":["Income Tax ( आयकर )","Corporate Tax ( निगम कर )","Goods and Services Tax (GST) ( वस्तु एवं सेवा कर (GST))","Capital Gains Tax ( पूंजीगत लाभ कर )"],"answer":"3"},{"id":"84951","q":"70. The international treaty known as the 'Montreal Protocol' deals exclusively with: ' मॉन्ट्रियल प्रोटोकॉल ' के रूप में जानी जाने वाली अंतर्राष्ट्रीय संधि विशेष रूप से किससे संबंधित है ?","options":["Phasing out the production of ozone-depleting substances ( ओजोन - घटने वाले पदार्थों के उत्पादन को चरणबद्ध तरीके से समाप्त करना )","Regulating international trade in hazardous waste ( खतरनाक कचरे में अंतर्राष्ट्रीय व्यापार को विनियमित करना )","Mandating reductions in industrial greenhouse gas emissions ( औद्योगिक ग्रीनहाउस गैस उत्सर्जन में कमी को अनिवार्य करना )","Protecting globally significant wetlands ( विश्व स्तर पर महत्वपूर्ण आर्द्रभूमि की रक्षा करना )"],"answer":"1"},{"id":"84952","q":"71. A 'Leachate Collection System' is a mandatory and critical engineering component of a: ' लीचेट कलेक्शन सिस्टम ' (Leachate Collection System) किसका एक अनिवार्य और महत्वपूर्ण इंजीनियरिंग घटक है ?","options":["Biomedical waste incinerator ( बायोमेडिकल वेस्ट इंसिनरेटर )","Municipal composting facility ( नगरपालिका कंपोस्टिंग सुविधा )","Engineered sanitary landfill ( इंजीनियर्ड सेनेटरी लैंडफिल )","E-waste physical dismantling plant ( ई - कचरा भौतिक निराकरण संयंत्र )"],"answer":"3"},{"id":"84953","q":"72. The Fundamental Duties of Indian citizens were incorporated into Part IV-A of the Constitution directly on the recommendation of the: भारतीय नागरिकों के मौलिक कर्तव्यों को संविधान के भाग IV-A में सीधे किसकी सिफारिश पर शामिल किया गया था ?","options":["Sarkaria Commission ( सरकारिया आयोग )","Kothari Commission ( कोठारी आयोग )","Swaran Singh Committee ( स्वर्ण सिंह समिति )","Mandal Commission ( मंडल आयोग )"],"answer":"3"},{"id":"84954","q":"73. Which river is commonly referred to as the 'Lifeline of Kerala' due to its length and economic significance? अपनी लंबाई और आर्थिक महत्व के कारण किस नदी को आमतौर पर ' केरल की जीवन रेखा ' (Lifeline of Kerala) कहा जाता है ?","options":["Pamba ( पंबा )","Periyar ( पेरियार )","Bharathappuzha ( भरतप्पुझा )","Chaliyar ( चालियार )"],"answer":"2"},{"id":"84955","q":"74. In chemistry, a buffer solution resists changes in pH when small amounts of acid or base are added. The pH of a buffer solution can be calculated using the: रसायन विज्ञान में , जब थोड़ी मात्रा में एसिड या बेस मिलाया जाता है तो बफर समाधान pH में परिवर्तन का विरोध करता है। बफर समाधान के pH की गणना किसका उपयोग करके की जा सकती है ?","options":["Arrhenius equation ( अरहेनियस समीकरण )","Henderson-Hasselbalch equation ( हेंडरसन - हसलबालच समीकरण )","Nernst equation ( नर्नस्ट समीकरण )","Clausius-Clapeyron equation ( क्लॉसियस - क्लैपेरॉन समीकरण )"],"answer":"2"},{"id":"84956","q":"75. In early 2025, the 'Pradhan Mantri Surya Ghar: Muft Bijli Yojana' was heavily executed to boost: 2025 की शुरुआत में , ' प्रधान मंत्री सूर्य घर : मुफ्त बिजली योजना ' को किसको बढ़ावा देने के लिए भारी रूप से निष्पादित किया गया था ?","options":["Wind energy farms in coastal corridors ( तटीय गलियारों में पवन ऊर्जा फार्म )","Rooftop solar installations in residential households ( आवासीय घरों में रूफटॉप सौर प्रतिष्ठान )","Large-scale nuclear power plant infrastructure ( बड़े पैमाने पर परमाणु ऊर्जा संयंत्र का बुनियादी ढांचा )","Hydroelectric projects in the Himalayan foothills ( हिमालय की तलहटी में जलविद्युत परियोजनाएं )"],"answer":"2"},{"id":"84957","q":"76. In network security, a \"Man-in-the-Middle\" (MitM) attack occurs when: नेटवर्क सुरक्षा में , \" मैन - इन - द - मिडिल \" (MitM) हमला तब होता है जब :","options":["A hacker floods a server with requests to crash it ( एक हैकर किसी सर्वर को क्रैश करने के लिए उस पर अनुरोधों की बाढ़ ला देता है )","An attacker secretly intercepts and relays communications between two parties who believe they are directly communicating ( एक हमलावर गुप्त रूप से उन दो पक्षों के बीच संचार को रोकता है और रिले करता है जो मानते हैं कि वे सीधे संचार कर रहे हैं )","Malicious software encrypts a user's hard drive and demands payment ( दुर्भावनापूर्ण सॉफ़्टवेयर उपयोगकर्ता की हार्ड ड्राइव को एन्क्रिप्ट करता है और भुगतान की मांग करता है )","An employee intentionally leaks company data from within the organization ( एक कर्मचारी जानबूझकर संगठन के भीतर से कंपनी का डेटा लीक करता है )"],"answer":"2"},{"id":"84958","q":"77. The historic \"Quit India Movement\" was launched by Mahatma Gandhi in the year: ऐतिहासिक \" भारत छोड़ो आंदोलन \" महात्मा गांधी द्वारा किस वर्ष शुरू किया गया था ?","options":["1930","1940","1942","1945"],"answer":"3"},{"id":"84959","q":"78. The 'Buxar' district of Bihar shares its geographical boundary with which neighboring entity? बिहार का ' बक्सर ' जिला अपनी भौगोलिक सीमा किस पड़ोसी इकाई के साथ साझा करता है ?","options":["Jharkhand ( झारखंड )","West Bengal ( पश्चिम बंगाल )","Uttar Pradesh ( उत्तर प्रदेश )","Nepal (International border) ( नेपाल ( अंतर्राष्ट्रीय सीमा ))"],"answer":"3"},{"id":"84960","q":"79. The escape velocity ( ) required for a projectile to permanently break free from a planet's gravitational field is given by the formula (where G is the gravitational constant, M is the mass of the planet, and R is its radius): किसी प्रक्षेप्य (projectile) को ग्रह के गुरुत्वाकर्षण क्षेत्र से स्थायी रूप से मुक्त होने के लिए आवश्यक पलायन वेग (ve) किस सूत्र द्वारा दिया जाता है ( जहां G गुरुत्वाकर्षण स्थिरांक है , M ग्रह का द्रव्यमान है , और R इसकी त्रिज्या है ):","options":["[Image-based option 1 — see original]","[Image-based option 2 — see original]","[Image-based option 3 — see original]","[Image-based option 4 — see original]"],"answer":"2"},{"id":"84961","q":"80. The 'Consumer Price Index' (CPI) in India is primarily utilized by policymakers to measure: भारत में ' उपभोक्ता मूल्य सूचकांक ' (CPI) का मुख्य रूप से नीति निर्माताओं द्वारा क्या मापने के लिए उपयोग किया जाता है ?","options":["Overall stock market volatility ( समग्र शेयर बाजार अस्थिरता )","Wholesale price inflation of industrial raw materials ( औद्योगिक कच्चे माल की थोक मूल्य मुद्रास्फीति )","Retail inflation experienced by ordinary consumers ( आम उपभोक्ताओं द्वारा अनुभव की जाने वाली खुदरा मुद्रास्फीति )","The country's total balance of trade ( देश का कुल व्यापार संतुलन )"],"answer":"3"},{"id":"84962","q":"81. Which Article of the Indian Constitution grants independent, constitutional status to the Election Commission of India? भारतीय संविधान का कौन सा अनुच्छेद भारत के चुनाव आयोग को स्वतंत्र , संवैधानिक दर्जा प्रदान करता है ?","options":["Article 280 ( अनुच्छेद 280)","Article 315 ( अनुच्छेद 315)","Article 324 ( अनुच्छेद 324)","Article 352 ( अनुच्छेद 352)"],"answer":"3"},{"id":"84963","q":"82. Under solid and e-waste management regulations, 'Extended Producer Responsibility' (EPR) legally mandates that manufacturers: ठोस और ई - कचरा प्रबंधन नियमों के तहत , ' विस्तारित उत्पादक उत्तरदायित्व ' (EPR) कानूनी रूप से निर्माताओं को अनिवार्य करता है कि वे :","options":["Ensure fair labor wages throughout their supply chain ( अपनी संपूर्ण आपूर्ति श्रृंखला में उचित श्रम मजदूरी सुनिश्चित करें )","Take back, recycle, and safely dispose of their products at the end of their useful life ( अपने उत्पादों के उपयोगी जीवन के अंत में उन्हें वापस लें , रीसायकल करें और सुरक्षित रूप से निपटान करें )","Provide a lifetime warranty for consumer electronics ( उपभोक्ता इलेक्ट्रॉनिक्स के लिए आजीवन वारंटी प्रदान करें )","Export all hazardous electronic waste to developing nations ( सभी खतरनाक इलेक्ट्रॉनिक कचरे को विकासशील देशों में निर्यात करें )"],"answer":"2"},{"id":"84964","q":"83. Unlike steroid hormones, peptide hormones (like Glucagon or Epinephrine) cannot cross the cell membrane. Instead, they bind to surface receptors and exert their effects inside the cell via \"secondary messengers\". The most common secondary messenger in human physiology is: स्टेरॉयड हार्मोन के विपरीत , पेप्टाइड हार्मोन ( जैसे ग्लूकागन या एपिनेफ्रिन ) कोशिका झिल्ली को पार नहीं कर सकते हैं। इसके बजाय , वे सतह रिसेप्टर्स से जुड़ते हैं और \" द्वितीयक दूतों \" (secondary messengers) के माध्यम से कोशिका के अंदर अपना प्रभाव डालते हैं। मानव शरीर क्रिया विज्ञान में सबसे आम द्वितीयक दूत कौन सा है ?","options":["Cyclic AMP (cAMP)","ATP","Messenger RNA (mRNA)","Acetylcholine ( एसिटाइलकोलाइन )"],"answer":"1"},{"id":"84965","q":"84. Which of the following planets in our solar system is widely known as the \"Red Planet\" due to the iron oxide prevalent on its surface? हमारे सौरमंडल के निम्नलिखित में से किस ग्रह को इसकी सतह पर मौजूद लौह ऑक्साइड के कारण व्यापक रूप से \" लाल ग्रह \" (Red Planet) के रूप में जाना जाता है ?","options":["Venus ( शुक्र )","Mars ( मंगल )","Jupiter ( बृहस्पति )","Saturn ( शनि )"],"answer":"2"},{"id":"84966","q":"85. The 2025 World Athletics Championships are scheduled to take place in: 2025 विश्व एथलेटिक्स चैंपियनशिप कहाँ होने वाली है ?","options":["Tokyo, Japan ( टोक्यो , जापान )","Paris, France ( पेरिस , फ्रांस )","Eugene, USA ( यूजीन , यूएसए )","Budapest, Hungary ( बुडापेस्ट , हंगरी )"],"answer":"1"},{"id":"84967","q":"86. In IPv4 networking, a standard IP address is 32 bits long. This limits the theoretical maximum number of unique, public IPv4 addresses to approximately: IPv4 नेटवर्किंग में , एक मानक IP पता 32 बिट लंबा होता है। यह अद्वितीय , सार्वजनिक IPv4 पतों की सैद्धांतिक अधिकतम संख्या को लगभग किस तक सीमित करता है ?","options":["4.3 Million","4.3 Billion","256 Million","128 Billion"],"answer":"2"},{"id":"84968","q":"87. The 'Munger' division of Bihar holds immense historical significance and is specifically known for: बिहार का ' मुंगेर ' प्रमंडल अत्यधिक ऐतिहासिक महत्व रखता है और विशेष रूप से किसके लिए जाना जाता है ?","options":["Madhubani paintings and textile mills ( मधुबनी पेंटिंग और कपड़ा मिलें )","Ancient gun manufacturing facilities and global yoga centers ( प्राचीन बंदूक निर्माण सुविधाएं और वैश्विक योग केंद्र )","Being the largest producer of Litchi in the state ( राज्य में लीची का सबसे बड़ा उत्पादक होना )","Extensive silk weaving and jute mills ( व्यापक रेशम बुनाई और जूट मिलें )"],"answer":"2"},{"id":"84969","q":"88. The most abundant gas in the Earth's atmosphere by volume is: आयतन के हिसाब से पृथ्वी के वायुमंडल में सबसे प्रचुर गैस कौन सी है ?","options":["Oxygen ( ऑक्सीजन )","Carbon dioxide ( कार्बन डाइऑक्साइड )","Nitrogen ( नाइट्रोजन )","Argon ( आर्गन )"],"answer":"3"},{"id":"84970","q":"89. The 'NITI Aayog' replaced the Planning Commission as the apex public policy think tank in India. Who serves as the ex-officio Chairperson of NITI Aayog? ' नीति आयोग ' ने भारत में शीर्ष सार्वजनिक नीति थिंक टैंक के रूप में योजना आयोग का स्थान लिया। नीति आयोग के पदेन अध्यक्ष के रूप में कौन कार्य करता है ?","options":["President of India ( भारत के राष्ट्रपति )","Finance Minister ( वित्त मंत्री )","Prime Minister of India ( भारत के प्रधान मंत्री )","Governor of the RBI (RBI के गवर्नर )"],"answer":"3"},{"id":"84971","q":"90. The \"Great Barrier Reef\", the world's largest and most biologically diverse coral reef system, is located off the coast of: \" ग्रेट बैरियर रीफ \", जो दुनिया की सबसे बड़ी और सबसे अधिक जैविक रूप से विविध प्रवाल भित्ति प्रणाली है , किसके तट पर स्थित है ?","options":["Brazil ( ब्राज़ील )","Indonesia ( इंडोनेशिया )","Australia ( ऑस्ट्रेलिया )","South Africa ( दक्षिण अफ्रीका )"],"answer":"3"},{"id":"84972","q":"91. The ecological phenomenon 'Biomagnification' refers to the: ( पारिस्थितिक घटना ' बायोमैग्निफिकेशन ' (Biomagnification) का तात्पर्य है :)","options":["Rapid, localized growth of algae in a stagnant lake ( एक स्थिर झील में शैवाल की तीव्र , स्थानीय वृद्धि )","Accumulation and increasing concentration of toxic, non-biodegradable substances at successive trophic levels in a food chain ( खाद्य श्रृंखला में क्रमिक पोषी स्तरों पर विषाक्त , गैर - बायोडिग्रेडेबल पदार्थों का संचय और बढ़ती सांद्रता )","Natural breakdown of organic waste by soil bacteria ( मिट्टी के जीवाणुओं द्वारा जैविक कचरे का प्राकृतिक टूटना )","Process of purifying heavy metals using aquatic plants ( जलीय पौधों का उपयोग करके भारी धातुओं को शुद्ध करने की प्रक्रिया )"],"answer":"2"},{"id":"84973","q":"92. The 'Right to Education' was enshrined as a fundamental right in the Indian Constitution by which amendment? भारतीय संविधान में किस संशोधन द्वारा ' शिक्षा का अधिकार ' (Right to Education) को मौलिक अधिकार के रूप में शामिल किया गया था ?","options":["44th Amendment (44 वां संशोधन )","73rd Amendment (73 वां संशोधन )","86th Amendment (86 वां संशोधन )","92nd Amendment (92 वां संशोधन )"],"answer":"3"},{"id":"84974","q":"93. In coordination chemistry, EDTA (Ethylenediaminetetraacetic acid) is widely used in complexometric titrations. It is classified as what type of ligand? समन्वय रसायन विज्ञान (coordination chemistry) में , कॉम्प्लेक्सोमेट्रिक अनुमापन में EDTA का व्यापक रूप से उपयोग किया जाता है। इसे किस प्रकार के लिगैंड के रूप में वर्गीकृत किया गया है ?","options":["Monodentate ( एकदंतुर )","Bidentate ( द्विदंतुर )","Tetradentate ( चतुर्दंतुर )","Hexadentate ( षटदंतुर )"],"answer":"4"},{"id":"84975","q":"94. In cellular respiration, the Krebs cycle (Citric Acid cycle) takes place specifically in the: कोशिकीय श्वसन में , क्रेब्स चक्र ( साइट्रिक एसिड चक्र ) विशेष रूप से कहाँ होता है ?","options":["Cytoplasm ( कोशिका द्रव्य )","Mitochondrial matrix ( माइटोकॉन्ड्रियल मैट्रिक्स )","Inner mitochondrial membrane ( आंतरिक माइटोकॉन्ड्रियल झिल्ली )","Endoplasmic reticulum ( एंडोप्लाज्मिक रेटिकुलम )"],"answer":"2"},{"id":"84976","q":"95. In early 2025, which Indian classical dance form was globally recognized after achieving a Guinness World Record for the largest synchronized performance at the Khajuraho Dance Festival? (Based on 2024/2025 records) 2025 की शुरुआत में , खजुराहो नृत्य महोत्सव में सबसे बड़े सिंक्रोनाइज़्ड प्रदर्शन के लिए गिनीज वर्ल्ड रिकॉर्ड हासिल करने के बाद किस भारतीय शास्त्रीय नृत्य शैली को विश्व स्तर पर मान्यता मिली ?","options":["Kathak ( कथक )","Odissi ( ओडिसी )","Bharatanatyam ( भरतनाट्यम )","Manipuri ( मणिपुरी )"],"answer":"1"},{"id":"84977","q":"96. In Operating Systems, the concept of \"Virtual Memory\" allows a computer to: ऑपरेटिंग सिस्टम में , \" वर्चुअल मेमोरी \" की अवधारणा कंप्यूटर को अनुमति देती है :","options":["Run an operating system within another operating system ( एक ऑपरेटिंग सिस्टम के भीतर दूसरा ऑपरेटिंग सिस्टम चलाने की )","Use a portion of the hard drive (disk space) to simulate additional RAM, allowing larger programs to execute ( अतिरिक्त रैम का अनुकरण करने के लिए हार्ड ड्राइव ( डिस्क स्पेस ) के एक हिस्से का उपयोग करने की , जिससे बड़े प्रोग्राम निष्पादित हो सकें )","Compress files to save space on the physical disk ( भौतिक डिस्क पर स्थान बचाने के लिए फ़ाइलों को संपीड़ित करने की )","Store data securely on remote cloud servers ( डेटा को सुरक्षित रूप से रिमोट क्लाउड सर्वर पर संग्रहीत करने की )"],"answer":"2"},{"id":"84978","q":"97. The 'Sonpur Cattle Fair', considered one of Asia's largest animal fairs, is traditionally held at the confluence of the Ganga and which river? एशिया के सबसे बड़े पशु मेलों में से एक माना जाने वाला ' सोनपुर पशु मेला ' पारंपरिक रूप से गंगा और किस नदी के संगम पर आयोजित किया जाता है ?","options":["Kosi ( कोसी )","Gandak ( गंडक )","Bagmati ( बागमती )","Punpun ( पुनपुन )"],"answer":"2"},{"id":"84979","q":"98. The highest peak in the Western Ghats mountain range is: ( पश्चिमी घाट पर्वत श्रृंखला की सबसे ऊँची चोटी कौन सी है ?)","options":["Anamudi ( अनामुडी )","Doda Betta ( डोड्डाबेट्टा )","Guru Shikhar ( गुरु शिखर )","Mahendragiri ( महेंद्रगिरि )"],"answer":"1"},{"id":"84980","q":"99. The 'Basel Convention' is an international treaty strictly designed to: ' बेसल कन्वेंशन ' एक अंतरराष्ट्रीय संधि है जिसे कड़ाई से किसलिए डिज़ाइन किया गया है :","options":["Protect endangered marine species in international waters ( अंतरराष्ट्रीय जल में लुप्तप्राय समुद्री प्रजातियों की रक्षा के लिए )","Control the transboundary movement of hazardous wastes and their disposal, particularly from developed to developing countries ( खतरनाक कचरे के सीमा पार संचलन और उनके निपटान को नियंत्रित करने के लिए , विशेष रूप से विकसित से विकासशील देशों में )","Regulate international intellectual property rights regarding green technology ( हरित प्रौद्योगिकी के संबंध में अंतर्राष्ट्रीय बौद्धिक संपदा अधिकारों को विनियमित करने के लिए )","Promote global free trade in recyclable materials ( पुनर्चक्रण योग्य सामग्री में वैश्विक मुक्त व्यापार को बढ़ावा देने के लिए )"],"answer":"2"},{"id":"84981","q":"100. In organic chemistry, the (Bimolecular Nucleophilic Substitution) reaction mechanism proceeds via a single transition state. A key stereochemical outcome of an reaction at a chiral center is: कार्बनिक रसायन विज्ञान में , SN2 प्रतिक्रिया तंत्र एक एकल संक्रमण अवस्था के माध्यम से आगे बढ़ता है। एक चिराल केंद्र पर SN2 प्रतिक्रिया का एक प्रमुख स्टीरियोकेमिकल परिणाम क्या है ?","options":["Retention of configuration ( विन्यास का प्रतिधारण )","Complete racemization ( पूर्ण रेसमाइजेशन )","Inversion of configuration (Walden inversion) ( विन्यास का उलटाव )","Formation of a carbocation intermediate ( कार्बोकेशन मध्यवर्ती का निर्माण )"],"answer":"3"},{"id":"84982","q":"101. In the Indian Parliamentary system, the \"Zero Hour\" refers to the specific time: ( भारतीय संसदीय प्रणाली में , \" शून्य काल \" (Zero Hour) किस विशिष्ट समय को संदर्भित करता है :)","options":["When no legislative business can be legally conducted ( जब कोई विधायी कार्य कानूनी रूप से नहीं किया जा सकता है )","Strictly reserved for voting on the union budget ( केंद्रीय बजट पर मतदान के लिए कड़ाई से आरक्षित )","Immediately following the Question Hour when members can raise matters of urgent public importance without prior notice ( प्रश्नकाल के ठीक बाद जब सदस्य बिना पूर्व सूचना के तत्काल सार्वजनिक महत्व के मामले उठा सकते हैं )","When the Prime Minister officially addresses the nation ( जब प्रधान मंत्री आधिकारिक तौर पर राष्ट्र को संबोधित करते हैं )"],"answer":"3"},{"id":"84983","q":"102. A government's 'Fiscal Deficit' is accurately represented by the: किसी सरकार के ' राजकोषीय घाटे ' (Fiscal Deficit) का सटीक प्रतिनिधित्व किसके द्वारा किया जाता है ?","options":["Total tax revenue collected minus welfare expenditures ( एकत्रित कुल कर राजस्व में से कल्याणकारी व्यय घटाना )","Difference between the government's total expenditure and its total receipts (excluding borrowings) ( सरकार के कुल व्यय और उसकी कुल प्राप्तियों ( उधार को छोड़कर ) के बीच का अंतर )","Total debt of the country owed to foreign multilateral institutions ( विदेशी बहुपक्षीय संस्थानों पर देश का कुल कर्ज )","Difference between physical exports and imports over a fiscal year ( एक वित्तीय वर्ष में भौतिक निर्यात और आयात के बीच का अंतर )"],"answer":"2"},{"id":"84984","q":"103. According to Faraday's First Law of Electrolysis, the mass of a substance deposited or liberated at an electrode is directly proportional to the: फैराडे के इलेक्ट्रोलिसिस के पहले नियम के अनुसार , इलेक्ट्रोड पर जमा या मुक्त होने वाले पदार्थ का द्रव्यमान किसके सीधे आनुपातिक होता है ?","options":["Concentration of the electrolyte solution ( इलेक्ट्रोलाइट समाधान की सांद्रता )","Temperature of the electrolytic bath ( इलेक्ट्रोलाइटिक स्नान का तापमान )","Quantity of electricity (charge) passed through the electrolyte ( इलेक्ट्रोलाइट से गुजरने वाली बिजली ( चार्ज ) की मात्रा )","Surface area of the electrode ( इलेक्ट्रोड का सतह क्षेत्र )"],"answer":"3"},{"id":"84985","q":"104. Which international organization is responsible for compiling and publishing the 'Human Development Index' (HDI)? कौन सा अंतर्राष्ट्रीय संगठन ' मानव विकास सूचकांक ' (HDI) को संकलित और प्रकाशित करने के लिए जिम्मेदार है ?","options":["World Bank ( विश्व बैंक )","International Monetary Fund (IMF) ( अंतर्राष्ट्रीय मुद्रा कोष )","United Nations Development Programme (UNDP) ( संयुक्त राष्ट्र विकास कार्यक्रम (UNDP))","World Economic Forum (WEF) ( विश्व आर्थिक मंच )"],"answer":"3"},{"id":"84986","q":"105. The 2025 'Pritzker Architecture Prize', often regarded as the Nobel Prize of architecture, highlights sustainable urban design. Which entity sponsors this prestigious award? 2025 का ' प्रित्ज़कर आर्किटेक्चर पुरस्कार ', जिसे अक्सर वास्तुकला का नोबेल पुरस्कार माना जाता है , टिकाऊ शहरी डिजाइन पर प्रकाश डालता है। कौन सी इकाई इस प्रतिष्ठित पुरस्कार को प्रायोजित करती है ?","options":["The Hyatt Foundation ( हयात फाउंडेशन )","The Royal Institute of British Architects ( रॉयल इंस्टीट्यूट ऑफ ब्रिटिश आर्किटेक्ट्स )","The United Nations Environmental Assembly ( संयुक्त राष्ट्र पर्यावरण सभा )","The Guggenheim Foundation ( गुगेनहाइम फाउंडेशन )"],"answer":"1"},{"id":"84987","q":"106. Standard ASCII (American Standard Code for Information Interchange) uses 7 bits to represent characters, allowing for 128 unique symbols. In contrast, modern systems use Unicode (like UTF-8) primarily because Unicode: मानक ASCII वर्णों का प्रतिनिधित्व करने के लिए 7 बिट्स का उपयोग करता है , जिससे 128 अद्वितीय प्रतीकों की अनुमति मिलती है। इसके विपरीत , आधुनिक सिस्टम यूनिकोड ( जैसे UTF-8) का उपयोग मुख्य रूप से इसलिए करते हैं क्योंकि यूनिकोड :","options":["Processes data faster than ASCII (ASCII की तुलना में डेटा को तेजी से प्रोसेस करता है )","Consumes less memory than ASCII (ASCII की तुलना में कम मेमोरी की खपत करता है )","Can represent characters and symbols from virtually all written languages in the world ( दुनिया की लगभग सभी लिखित भाषाओं के वर्णों और प्रतीकों का प्रतिनिधित्व कर सकता है )","Automatically encrypts the text data ( टेक्स्ट डेटा को स्वचालित रूप से एन्क्रिप्ट करता है )"],"answer":"3"},{"id":"84988","q":"107. According to Abbe's criterion, the resolving power of an optical microscope (its ability to distinguish two close points) can be mathematically increased by: एब्बे (Abbe) के मानदंड के अनुसार , एक ऑप्टिकल माइक्रोस्कोप की संकल्प शक्ति (resolving power) को गणितीय रूप से किसके द्वारा बढ़ाया जा सकता है ?","options":["Increasing the wavelength of the light used ( उपयोग किए गए प्रकाश की तरंग दैर्ध्य को बढ़ाकर )","Decreasing the refractive index of the medium between the object and the objective lens ( वस्तु और अभिदृश्यक लेंस (objective lens) के बीच माध्यम के अपवर्तनांक को कम करके )","Increasing the numerical aperture of the objective lens ( अभिदृश्यक लेंस के न्यूमेरिकल अपर्चर को बढ़ाकर )","Decreasing the diameter of the objective lens ( अभिदृश्यक लेंस के व्यास को कम करके )"],"answer":"3"},{"id":"84989","q":"108. 'Eutrophication' is an environmental issue caused by the excessive presence of which specific nutrients in water bodies? (' यूट्रोफिकेशन ' (Eutrophication) जल निकायों में किन विशिष्ट पोषक तत्वों की अत्यधिक उपस्थिति के कारण होने वाला एक पर्यावरणीय मुद्दा है ?)","options":["Sodium and Potassium ( सोडियम और पोटेशियम )","Calcium and Magnesium ( कैल्शियम और मैग्नीशियम )","Nitrogen and Phosphorus ( नाइट्रोजन और फास्फोरस )","Iron and Zinc ( लोहा और जस्ता )"],"answer":"3"},{"id":"84990","q":"109. Who served as the first Chief Minister of the state of Bihar post-independence? स्वतंत्रता के बाद बिहार राज्य के प्रथम मुख्यमंत्री के रूप में किसने कार्य किया ?","options":["Sri Krishna Sinha ( श्री कृष्ण सिन्हा )","Anugrah Narayan Sinha ( अनुग्रह नारायण सिन्हा )","Karpoori Thakur ( कर्पूरी ठाकुर )","Nitish Kumar ( नीतीश कुमार )"],"answer":"1"},{"id":"84991","q":"110. Which constitutional body is mandated to conduct and supervise the elections to the local Panchayats and Municipalities within a state? किस संवैधानिक निकाय को किसी राज्य के भीतर स्थानीय पंचायतों और नगर पालिकाओं के चुनाव कराने और उनकी निगरानी करने का अधिकार है ?","options":["Election Commission of India ( भारत का चुनाव आयोग )","State Election Commission ( राज्य चुनाव आयोग )","State Public Service Commission ( राज्य लोक सेवा आयोग )","Delimitation Commission ( परिसीमन आयोग )"],"answer":"2"},{"id":"84992","q":"111. The longest and heaviest bone in the human skeletal system is the: मानव कंकाल तंत्र की सबसे लंबी और भारी हड्डी कौन सी है ?","options":["Humerus ( ह्यूमरस )","Tibia ( टिबिया )","Femur ( फीमर / जांघ की हड्डी )","Fibula ( फाइबुला )"],"answer":"3"},{"id":"84993","q":"112. A 'Bull Market' in the financial stock exchange refers to a sustained period when: वित्तीय स्टॉक एक्सचेंज में ' बुल मार्केट ' (Bull Market) एक निरंतर अवधि को संदर्भित करता है जब :","options":["Share prices are falling rapidly due to panic selling ( घबराहट में बिकवाली के कारण शेयर की कीमतें तेजी से गिर रही हैं )","Share prices are rising or are broadly expected to rise ( शेयरों की कीमतें बढ़ रही हैं या उनके बढ़ने की व्यापक उम्मीद है )","Trading volume is extremely low due to high interest rates ( उच्च ब्याज दरों के कारण ट्रेडिंग वॉल्यूम बेहद कम है )","The market is closed by regulators to prevent a crash ( क्रैश को रोकने के लिए नियामकों द्वारा बाज़ार बंद कर दिया जाता है )"],"answer":"2"},{"id":"84994","q":"113. Which highly reactive chemical radical is primarily responsible for the catalytic destruction of ozone molecules in the stratosphere, following the breakdown of CFCs? CFCs के टूटने के बाद , समताप मंडल में ओजोन अणुओं के उत्प्रेरक विनाश के लिए मुख्य रूप से कौन सा अत्यधिक प्रतिक्रियाशील रासायनिक मूलक (radical) जिम्मेदार है ?","options":["Hydroxyl radical ( ) ( हाइड्रॉक्सिल रेडिकल )","Chlorine radical ( ) ( क्लोरीन रेडिकल )","Methyl radical ( ) ( मिथाइल रेडिकल )","Nitrate radical ( ) ( नाइट्रेट रेडिकल )"],"answer":"2"},{"id":"84995","q":"114. The ancient, UNESCO-recognized site of 'Nalanda' in Bihar was historically a globally renowned center of: बिहार में ' नालंदा ' का प्राचीन , यूनेस्को द्वारा मान्यता प्राप्त स्थल ऐतिहासिक रूप से विश्व स्तर पर किसका प्रसिद्ध केंद्र था ?","options":["Jain philosophy ( जैन दर्शन )","Buddhist learning and monasticism ( बौद्ध शिक्षा और मठवाद )","Vedic rituals ( वैदिक अनुष्ठान )","Islamic theology ( इस्लामी धर्मशास्त्र )"],"answer":"2"},{"id":"84996","q":"115. The 2025 'World Economic Forum' (WEF) annual meeting of global leaders and billionaires was hosted in its traditional location of: ( वैश्विक नेताओं और अरबपतियों की 2025 ' विश्व आर्थिक मंच ' (WEF) की वार्षिक बैठक की मेजबानी उसके पारंपरिक स्थान पर की गई थी :)","options":["Geneva ( जिनेवा )","Zurich ( ज्यूरिख )","Davos ( दावोस )","Basel ( बेसल )"],"answer":"3"},{"id":"84997","q":"116. In Object-Oriented Programming (OOP), the ability of different classes to be treated as instances of the same class through a common interface, allowing a single function name to behave differently based on the object calling it, is known as: ऑब्जेक्ट - ओरिएंटेड प्रोग्रामिंग (OOP) में , एक सामान्य इंटरफ़ेस के माध्यम से विभिन्न वर्गों को एक ही वर्ग के उदाहरण के रूप में व्यवहार करने की क्षमता , जिससे एकल फ़ंक्शन नाम को कॉलिंग ऑब्जेक्ट के आधार पर अलग - अलग व्यवहार करने की अनुमति मिलती है , इसे किस रूप में जाना जाता है ?","options":["Encapsulation ( एनकैप्सुलेशन )","Inheritance ( इनहेरिटेंस )","Polymorphism ( पॉलीमॉरफिज़्म )","Abstraction ( एब्स्ट्रेक्शन )"],"answer":"3"},{"id":"84998","q":"117. In human physiology, oxygen is transported from the lungs to the body's tissues primarily by binding to which specific metalloprotein? ( मानव शरीर क्रिया विज्ञान में , फेफड़ों से शरीर के ऊतकों तक ऑक्सीजन मुख्य रूप से किस विशिष्ट धातुप्रोटीन से बंध कर ले जाई जाती है ?)","options":["Myoglobin ( मायोग्लोबिन )","Hemoglobin ( हीमोग्लोबिन )","Albumin ( एल्ब्यूमिन )","Fibrinogen ( फाइब्रिनोजेन )"],"answer":"2"},{"id":"84999","q":"118. Under the Solid Waste Management Rules, the term 'Wet Waste' typically refers specifically to: ( ठोस अपशिष्ट प्रबंधन नियमों के तहत , ' गीला कचरा ' (Wet Waste) शब्द आम तौर पर विशेष रूप से किसको संदर्भित करता है ?)","options":["Plastics and metals that have been washed ( धोए गए प्लास्टिक और धातु )","Biodegradable organic waste (e.g., food scraps) ( बायोडिग्रेडेबल जैविक अपशिष्ट ( जैसे , भोजन के टुकड़े ))","Liquid biomedical waste ( तरल बायोमेडिकल कचरा )","E-waste exposed to the elements ( तत्वों के संपर्क में आने वाला ई - कचरा )"],"answer":"2"},{"id":"85000","q":"119. The structural foundation of the 'Panchayati Raj' system in India is based on the democratic principle of: भारत में ' पंचायती राज ' प्रणाली की संरचनात्मक नींव किस लोकतांत्रिक सिद्धांत पर आधारित है ?","options":["Centralization of power ( सत्ता का केंद्रीकरण )","Democratic decentralization ( लोकतांत्रिक विकेंद्रीकरण )","Single-party rule ( एक दलीय शासन )","Authoritarianism ( अधिनायकवाद )"],"answer":"2"},{"id":"85001","q":"120. Which is the largest continent by physical land area on Earth? पृथ्वी पर भौतिक भूमि क्षेत्र के हिसाब से सबसे बड़ा महाद्वीप कौन सा है ?","options":["Africa ( अफ्रीका )","North America ( उत्तरी अमेरिका )","Europe ( यूरोप )","Asia ( एशिया )"],"answer":"4"},{"id":"85002","q":"121. Heisenberg’s Uncertainty Principle in quantum mechanics states that it is impossible to simultaneously measure, with perfect precision, both the position and the ____________ of a microscopic particle. क्वांटम यांत्रिकी में हाइजेनबर्ग का अनिश्चितता सिद्धांत बताता है कि एक साथ पूर्ण सटीकता के साथ किसी सूक्ष्म कण की स्थिति और ____________ दोनों को मापना असंभव है।","options":["Mass ( द्रव्यमान )","Spin ( स्पिन )","Momentum ( संवेग )","Charge ( आवेश )"],"answer":"3"},{"id":"85003","q":"122. The 'Beti Bachao, Beti Padhao' scheme was launched by the Government of India primarily to address the critical social issue of: भारत सरकार द्वारा ' बेटी बचाओ , बेटी पढ़ाओ ' योजना मुख्य रूप से किस महत्वपूर्ण सामाजिक मुद्दे को संबोधित करने के लिए शुरू की गई थी ?","options":["Female infanticide and the declining child sex ratio ( कन्या भ्रूण हत्या और घटता बाल लिंगानुपात )","Severe malnutrition among adolescent girls ( किशोरियों में गंभीर कुपोषण )","Providing free laptops to college-going women ( कॉलेज जाने वाली महिलाओं को मुफ्त लैपटॉप उपलब्ध कराना )","Subsidizing housing for single working women ( अकेली कामकाजी महिलाओं के लिए आवास पर सब्सिडी देना )"],"answer":"1"},{"id":"85004","q":"123. In the context of waste management, which of the following is strictly classified and regulated as 'Hazardous Waste'? अपशिष्ट प्रबंधन के संदर्भ में , निम्नलिखित में से किसे ' खतरनाक अपशिष्ट ' (Hazardous Waste) के रूप में सख्ती से वर्गीकृत और विनियमित किया जाता है ?","options":["Vegetable peels ( सब्जी के छिलके )","Paper coffee cups ( कागज के कॉफी कप )","Used automotive batteries containing lead and sulfuric acid ( प्रयुक्त ऑटोमोटिव बैटरियां जिनमें सीसा और सल्फ्यूरिक एसिड होता है )","Discarded cotton clothes ( फेंके गए सूती कपड़े )"],"answer":"3"},{"id":"85005","q":"124. The historical monument 'Sher Shah Suri Tomb', situated in Sasaram, Bihar, is a prime architectural example of which style? ( सासाराम , बिहार में स्थित ऐतिहासिक स्मारक ' शेर शाह सूरी का मकबरा ', किस शैली का प्रमुख स्थापत्य उदाहरण है ?)","options":["Mughal architecture ( मुगल वास्तुकला )","Dravidian architecture ( द्रविड़ वास्तुकला )","Indo-Islamic (specifically Afghan) architecture ( इंडो - इस्लामिक ( विशेष रूप से अफगान ) वास्तुकला )","Gothic architecture ( गॉथिक वास्तुकला )"],"answer":"3"},{"id":"85006","q":"125. Which country officially holds the presidency of the G20 summit for the year 2025? वर्ष 2025 के लिए G20 शिखर सम्मेलन की अध्यक्षता आधिकारिक तौर पर किस देश के पास है ?","options":["India ( भारत )","Brazil ( ब्राज़ील )","South Africa ( दक्षिण अफ्रीका )","USA ( यूएसए )"],"answer":"3"}];
let idx=0, answers={}, timerSec=7500, timerInt=null;

function render(){
  const q=DATA[idx];
  if(!q){document.getElementById('qText').textContent='No data.';return;}
  document.getElementById('qNum').textContent=idx+1;
  document.getElementById('qTotal').textContent=DATA.length;
  document.getElementById('qText').textContent=q.q;
  document.getElementById('opts').innerHTML=q.options.map((o,i)=>
    `<div class="option ${answers[idx]==(i+1)?'selected':''}" onclick="select(${i+1})">${String.fromCharCode(65+i)}. ${o}</div>`
  ).join('');
}
window.select=o=>{answers[idx]=o; render();};
window.prev=()=>{if(idx>0){idx--; render();}};
window.next=()=>{if(idx<DATA.length-1){idx++; render();}};

function submitTest(){
  clearInterval(timerInt);
  let c=0; for(let i=0;i<DATA.length;i++){if(answers[i]==DATA[i].answer)c++;}
  const pct=Math.round(c/DATA.length*100)||0;
  document.getElementById('qCard').classList.add('hidden');
  document.getElementById('resCard').classList.remove('hidden');
  document.getElementById('score').textContent=pct+'%';
  document.getElementById('detail').innerHTML='<b>'+c+'/'+DATA.length+'</b> correct';
}

function tick(){timerSec--; document.getElementById('timer').textContent=Math.floor(timerSec/60)+':'+String(timerSec%60).padStart(2,'0'); document.getElementById('bar').style.width=(timerSec/7500*100)+'%'; if(timerSec<=0){clearInterval(timerInt); submitTest();}}

render(); timerInt=setInterval(tick,1000);
</script>
</body></html>
