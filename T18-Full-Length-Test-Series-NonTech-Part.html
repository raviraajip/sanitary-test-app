<script>
const DATA=[{"id":"76091","q":"At the time of partition of India, which of the following provinces of British India came forward with a plan for United and Independent existence?","options":["Assam","Punjab","Bengal","Bihar"],"answer":"2","solution":"The Punjab province of British India came forward with a plan for a united and independent existence at the time of Partition. Various political groups, including the Unionist Party and some Sikh leaders, were concerned about the potential division of the province and advocated for maintaining its unity or exploring an independent status separate from both India and Pakistan."},{"id":"76092","q":"Who was India's Governor-General at the time of First Anglo-Burmese War?","options":["Cornwallis","Ellenborough","Amherst","Auckland"],"answer":"3","solution":"The First Anglo-Burmese War (1824-1826) ended in a British East India Company victory. and by the Treaty of Yandabo, Burma lost territory previously conquered in Assam, Manipur, and Arakan. Lord Amherst served as Governor-General of India between 1823 and 1828. He had served as British commander in America from 1758 to 1763. He faced the foes which were beyond the sea.In 1824, there was Conflict between British India and Burma called the First Anglo Burmese War."},{"id":"76093","q":"The author of the book \"India Divided\" is","options":["M.K. Gandhi","Dr. Rajendra Prasad","J.L. Nehru","Maulana A.K. Azad"],"answer":"2","solution":""},{"id":"76094","q":"Which of the following inscriptions of Ashoka, indicates the principle of religious tolerance?","options":["Rock Edict XII","Rock Edict X","Pillar Edict VII","None of the above"],"answer":"1","solution":"Rock Edict XII directed and determined request for tolerance among different religious sects."},{"id":"76095","q":"Through which Article, the Parliament can enact a law even on the state subjects, in the interest of Nation?","options":["Article 249","Article 256","Article 257","Article 265"],"answer":"1","solution":"Article 249 says that If Rajya Sabha declares by Resolution supported by 2/3rd of the members present and voting (special majority), that it is necessary to expedient in the national interest that Parliament should make laws with respect to any matter enumerated in the State List then, Parliament is competent to make laws on such matters for whole or part of India."},{"id":"76096","q":"Which Article in Indian Constitution is related to Fundamental Rights against exploitation of children?","options":["Article 17","Article 19","Article 23","Article 24"],"answer":"4","solution":"Article 24 mandates that No child below the age of 14 years shall be employed to work in any factory or mine or engaged in any other hazardous employment."},{"id":"76097","q":"The Speaker can ask a member of the 'House' to stop speaking and let another member speak. This is called","options":["Decorum","Crossing the floor","Interpellation","Yielding the floor"],"answer":"4","solution":"The speaker of the Lok Sabha can ask a member of the house to stop speaking and let another member speak is called yielding the floor. The general rule is that the first member to rise and address the chair after another member has yielded the floor (by sitting down) is entitled to the floor."},{"id":"76098","q":"Under which Article of the Indian Constitution, 'NITI Aayog' has been formed?","options":["Article 280","Article 282","Article 286","None of the Articles"],"answer":"4","solution":"The NITI Aayog (National Institution for Transforming India) is a policy think tank of the Government of India, established with the aim to achieve sustainable development goals with cooperative federalism by fostering the involvement of State Governments of India in the economic policy-making process using a bottom-up approach. It was established in 2015, by the NDA government, to replace the Planning Commission which followed a top-down model. The NITI Aayog council comprises all the state Chief Ministers, along with the Chief Ministers of Delhi and Puducherry, the Lieutenant Governor of Andaman and Nicobar, and a vice chairman nominated by the Prime Minister. In addition, temporary members are selected from leading universities and research institutions."},{"id":"76099","q":"A resolution for removing the Vice-President of India can be moved in","options":["Lok Sabha alone","Rajya Sabha alone","Joint sitting of the Parliament","Either house of the Parliament"],"answer":"2","solution":"The Vice President can be removed by a resolution of the Rajya Sabha passed by an effective majority (i.e., the majority of all the then member of the house) and agreed by the Lok Sabha with simple majority (Article 67(b))."},{"id":"76100","q":"Which of the following makes India's maritime boundary with Maldives?","options":["Great channel","Coco channel","Eight degree channel","None of these"],"answer":"3","solution":"Minicoy is in the Eight Degree Channel, which separates Lakshadweep from the independent Maldives Islands."},{"id":"76101","q":"Which of the following is the smallest (in terms of area) Union Territory of India?","options":["Lakshadweep","Puducherry","Daman and Diu","Chandigarh"],"answer":"1","solution":"India's smallest Union Territory Lakshadweep is an archipelago consisting of 36 islands with an area of 32 sq km."},{"id":"76102","q":"Which of the following is Prime Meridian?","options":["0\u00b0 longitude","180\u00b0 longitude","90\u00b0E longitude","90\u00b0W longitude"],"answer":"1","solution":"A prime meridian is the meridian in a geographic coordinate system at which longitude is defined to be 0\u00b0. Together, a prime meridian and its anti-meridian form a great circle. This great circle divides a spheroid into two hemispheres."},{"id":"76103","q":"Renin (an enzyme) is used in which of the following industries?","options":["Soft drink","Leather","Paper","Cheese"],"answer":"4","solution":"Rennin is the enzyme used to produce rennet . After the milk is collected, the cheesemaking process begins by adding starter cultures that change lactose (milk sugar) into lactic acid. This process changes the acidity level of the milk and starts the process of thickening the milk into a solid."},{"id":"76104","q":"The breath that we throw out contains carbon dioxide upto an extent of","options":["16%","12%","8%","4%"],"answer":"4","solution":"After a human breathes in Earth's air, he or she exhales a mixture of compounds similar to the air inhaled: 78 percent nitrogen, 16 percent oxygen, 0.09 percent argon, and 4 percent carbon dioxide."},{"id":"76105","q":"The red colour of tomato is due to the presence of which of the following compounds in it?","options":["Lutein","Lycopene","Flavones","-carotene"],"answer":"2","solution":"As the tomato ripens, its colour starts to change from green to yellow and then eventually to red . This is due to the breakdown of chlorophyll, which in turn synthesizes a red carotenoid (another pigment group), lycopene."},{"id":"76106","q":"What do we call a computer on a network that requests files from another computer?","options":["a client","a host","a router","a web server"],"answer":"1","solution":"(a) a client \u2013 \u2714 Correct . In networking, a client is a computer or software that sends a request to another system (typically a server) for resources such as files, data, or services. (b) a host \u2013 A host is any computer connected to a network, which can be a server or a client. (c) a router \u2013 A router is a networking device that routes data between different networks. (d) a web server \u2013 A web server responds to requests from clients (typically web browsers), not the requester itself."},{"id":"76107","q":"Bihar launches scheme for checking crimes against women at public places, what is the name of the scheme?","options":["One Stop Centre","Safe City Surveillance","SWADHAR Greh","Mahila e-Haat"],"answer":"2","solution":"(a) One Stop Centre \u2013 Provides integrated services to women affected by violence but is not a surveillance initiative. (b) Safe City Surveillance \u2013 \u2714 Correct . Bihar launched this initiative to monitor and improve women\u2019s safety in public places using CCTV and other surveillance mechanisms. (c) SWADHAR Greh \u2013 A scheme that provides shelter and rehabilitation to women in difficult circumstances. (d) Mahila e-Haat \u2013 An online platform for women entrepreneurs, not related to crime prevention."},{"id":"76108","q":"The DOGE-1 Mission to the Moon will be launched by which company in 2022?","options":["SpaceX","ISRO","NASA","Roscosmos"],"answer":"1","solution":"(a) SpaceX \u2013 \u2714 Correct . DOGE-1 is a lunar mission funded using the cryptocurrency Dogecoin and launched by SpaceX. (b) ISRO \u2013 India\u2019s space agency, not involved in this mission. (c) NASA \u2013 While active in lunar missions, DOGE-1 is not their initiative. (d) Roscosmos \u2013 Russian space agency, unrelated to DOGE-1."},{"id":"76109","q":"Anti COVID Drug 2-DG has been developed by which organization?","options":["DRDO","ISRO","CDIR","DGCI"],"answer":"1","solution":"(a) DRDO \u2013 \u2714 Correct . The Defence Research and Development Organisation developed 2-Deoxy-D-glucose (2-DG) to treat COVID-19. (b) ISRO \u2013 Focuses on space exploration, not drug development. (c) CDIR \u2013 Likely a typographical confusion; no known body by this abbreviation related to this drug. (d) DGCI \u2013 Probably meant as DCGI (Drug Controller General of India), which approves drugs but doesn\u2019t develop them."},{"id":"76110","q":"Which telecom company has become the first one in India to demonstrate the operation of the 5G network?","options":["Reliance Jio","Airtel","Vi","BSNL"],"answer":"2","solution":"(a) Reliance Jio \u2013 Jio is a leading telecom player but was second in demonstrating live 5G. (b) Airtel \u2013 \u2714 Correct . Airtel was the first to demonstrate a live 5G service in India in 2021. (c) Vi \u2013 Vodafone Idea has been testing 5G but was not the first. (d) BSNL \u2013 A government operator, still lagging in 5G rollout."},{"id":"76111","q":"Defence Research and Development Organisation will establish a research cell at which Indian Institute of Technology to meet the future defence technological requirements of the country?","options":["IIT-Jodhpur","IIT-Indore","IIT-Bhilai","IIT-Hyderabad"],"answer":"4","solution":"(a) IIT-Jodhpur \u2013 Not the selected institute for this collaboration. (b) IIT-Indore \u2013 Not involved in this particular DRDO initiative. (c) IIT-Bhilai \u2013 Also not associated with this research cell. (d) IIT-Hyderabad \u2013 \u2714 Correct . DRDO set up a research cell at IIT-Hyderabad in 2020 to promote defence-related research and innovation."},{"id":"76112","q":"Which coompany has launched its first brand campaign 'It's Between You' in India that narrates real stories about how Indians communicate daily' in their closest relationships?","options":["Instagram","Facebook","WhatsApp","Snapchat"],"answer":"3","solution":""},{"id":"76113","q":"What is the name of the mobile application launched for locating outlets and searching Generic medicine?","options":["Janaushadhi Sugam","Digicop","Khelo India","Kumbh JioPhone"],"answer":"1","solution":"(a) Janaushadhi Sugam \u2013 \u2714 Correct . Launched by the Government of India to help users locate Pradhan Mantri Bhartiya Janaushadhi Kendras and access details about generic medicines. (b) Digicop \u2013 Chennai Police app for reporting stolen vehicles and lost mobile phones. (c) Khelo India \u2013 Sports promotion initiative, not related to medicines. (d) Kumbh JioPhone \u2013 A feature phone developed by Reliance Jio for pilgrims, not for medicine tracking."},{"id":"76114","q":"The Indian Railway has Indigenously designed and manufactured a high speed locomotive, with top speed 180 km/hr. In which locomotive workshop is it built?","options":["Bharat Heavy Electricals Limited (BHEL)","Chittaranjan Locomotive Works, Chittaranjan.","Diesel Locomotive Works, Varanasi.","Diesel-Loco Modernisation Works, Patiala."],"answer":"2","solution":"(a) BHEL \u2013 Primarily deals with power generation and electrical equipment, not railway locomotives. (b) Chittaranjan Locomotive Works (CLW) \u2013 \u2714 Correct . CLW developed the WAG-12 class high-speed electric locomotive. (c) Diesel Locomotive Works, Varanasi \u2013 Specializes in diesel locomotives. (d) Diesel-Loco Modernisation Works, Patiala \u2013 Focuses on modernization and repair, not indigenous manufacturing of new models."},{"id":"76115","q":"Which state's Chief Minister has inaugurated India's first ethanol plant, set up by Eastern India Biofuels Private Limited for Rs 105 crores","options":["Assam","Rajasthan","Haryana","Bihar"],"answer":"4","solution":"(a) Assam \u2013 Not associated with this ethanol plant. (b) Rajasthan \u2013 Also not the first state for this ethanol initiative. (c) Haryana \u2013 Known for agro-based industries but not this specific plant. (d) Bihar \u2013 \u2714 Correct . Inaugurated by CM Nitish Kumar , Bihar became the first Indian state to have a privately-owned ethanol production plant."},{"id":"76116","q":"Which state has topped the NITI Aayog's State Energy and Climate Index-(SECI) Round 1?","options":["Punjab","Odisha","Gujarat","Kerala"],"answer":"3","solution":"(a) Punjab \u2013 Ranked lower due to less efficiency in renewable energy and distribution reforms. (b) Odisha \u2013 Showed moderate performance but not the top state. (c) Gujarat \u2013 \u2714 Correct . Topped the SECI Round 1 released in April 2022 for best performance in energy access, efficiency, sustainability, and clean energy initiatives. (d) Kerala \u2013 Performed well in some indicators but did not top the index."},{"id":"76117","q":"Which country will be the official 'Country of honour' at Cannes Marche' Du Film?","options":["Germany","Ukraine","Spain","India"],"answer":"4","solution":"(a) Germany \u2013 A regular participant but not the country of honour in 2022. (b) Ukraine \u2013 Gained support at Cannes due to the war situation but was not the official 'country of honour.' (c) Spain \u2013 Not awarded this status in the specific edition. (d) India \u2013 \u2714 Correct . In 2022, India was chosen as the 'Country of Honour' at the Cannes Marche du Film as part of the 75th year of diplomatic ties and Indian independence."},{"id":"76118","q":"India has announced to set up 'Transmission interconnection' for transfer of renewable power with which Country","options":["Nepal","Maldives","Bangladesh","Sri Lanka"],"answer":"4","solution":"(a) Nepal \u2013 India already has power exchange arrangements but this specific interconnection project was not for Nepal. (b) Maldives \u2013 Receives energy support from India but not through transmission interconnection. (c) Bangladesh \u2013 Has existing transmission lines; the question refers to a newer initiative. (d) Sri Lanka \u2013 \u2714 Correct . India announced plans to establish a transmission interconnection for renewable energy exchange with Sri Lanka , enhancing regional energy cooperation."},{"id":"76119","q":"In which city Australia will host the 2026 Commonwealth Games?","options":["Victoria","Sydney","Perth","Brisbane"],"answer":"1","solution":"(a) Victoria \u2013 \u2714 Correct . The 2026 Commonwealth Games will be hosted in multiple regional cities across the state of Victoria , Australia (not just one city). (b) Sydney \u2013 Previously hosted the Olympics, but not chosen for this event. (c) Perth \u2013 Was considered but not selected. (d) Brisbane \u2013 Chosen for the 2032 Summer Olympics, not the Commonwealth Games 2026."},{"id":"76120","q":"Who is the author of the book title \"Crunch Time: Narendra Modi's National Security Crises\"?","options":["Satish Chandra","Jeetthayil","Ruby Miranda","Sreeram Chaulia"],"answer":"4","solution":"(a) Satish Chandra \u2013 A historian, but not the author of this book. (b) Jeet Thayil \u2013 Known for literary fiction like Narcopolis , not national security topics. (c) Ruby Miranda \u2013 Not known for this work. (d) Sreeram Chaulia \u2013 \u2714 Correct . A prominent international affairs expert who authored \"Crunch Time\" , analyzing national security challenges under PM Modi."},{"id":"76121","q":"Percentage of silver in German silver is?","options":["1%","5%","0%","None of the above"],"answer":"3","solution":"(a) 1% \u2013 Incorrect. There is no silver in German silver. (b) 5% \u2013 Incorrect. Misconception due to the name. (c) 0% \u2013 \u2714 Correct . German silver is an alloy of copper, nickel, and zinc , and contains 0% actual silver . (d) None of the above \u2013 Incorrect since (c) is the correct answer."},{"id":"76122","q":"Allminium surface is often \u2018Anodized\u2019. This means the deposition of a layer of?","options":["Chromium Oxide","Aluminium Oxide","Nickel Oxide","Zinc Oxide"],"answer":"2","solution":"(a) Chromium Oxide \u2013 Found in chrome plating, not anodizing. (b) Aluminium Oxide \u2013 \u2714 Correct . Anodizing thickens the natural oxide layer (Al\u2082O\u2083) on aluminium to prevent corrosion. (c) Nickel Oxide \u2013 Related to nickel plating, not aluminium. (d) Zinc Oxide \u2013 Used in galvanization, not anodizing."},{"id":"76123","q":"The sensation of fatigue in the muscles after prolonged strenuous physical work is caused by?","options":["A decrease in the supply of oxygen","minor wear and tear of muscle fibres","The depletion of glucose","The accumulation of lactic acid"],"answer":"4","solution":"(a) A decrease in oxygen \u2013 Indirectly contributes but not the direct cause of fatigue. (b) Minor wear and tear \u2013 Happens, but not the immediate reason for fatigue. (c) Glucose depletion \u2013 Important for energy, but fatigue is more directly related to lactic acid. (d) Lactic acid \u2013 \u2714 Correct . When muscles work anaerobically (lack of oxygen), lactic acid builds up , causing fatigue."},{"id":"76124","q":"To avoid \u2018knocking\u2019 if the engine of a car, which one of the following is used as an anti-knocking agent?","options":["Ethyl alcohol","Butane","Lead tetra ethyl","White petrol"],"answer":"3","solution":"(a) Ethyl alcohol \u2013 Used as a fuel additive, not primarily for anti-knocking. (b) Butane \u2013 A hydrocarbon gas, not used as anti-knocking. (c) Lead tetra ethyl \u2013 \u2714 Correct . Previously added to petrol to prevent knocking by increasing octane rating. (d) White petrol \u2013 Refined fuel, not an anti-knocking agent. Note: Lead tetra ethyl is now banned in many countries due to environmental and health concerns."},{"id":"76125","q":"Which of the following chemical is used in the artificial rain?","options":["Silver Iodide","Potassium chlorate","Calcium Carbonate","zinc Iodide"],"answer":"1","solution":"(a) Silver Iodide \u2013 \u2714 Correct . Used in cloud seeding to induce precipitation in artificial rainmaking. (b) Potassium chlorate \u2013 An oxidizing agent, not used in cloud seeding. (c) Calcium Carbonate \u2013 Not relevant in this context. (d) Zinc Iodide \u2013 Has some radiographic uses, but not typical for artificial rain."},{"id":"76126","q":"Starch is a?","options":["Monosaccharide","Disaccharide","Polysaccharide","None of the above"],"answer":"3","solution":"(a) Monosaccharide \u2013 Incorrect. Examples include glucose and fructose, which are single sugar units. (b) Disaccharide \u2013 Incorrect. Examples include sucrose and lactose, which are made of two monosaccharides. (c) Polysaccharide \u2013 \u2714 Correct . Starch is a complex carbohydrate made of many glucose units, hence a polysaccharide . (d) None of the above \u2013 Incorrect, since (c) is correct."},{"id":"76127","q":"Which one of the following creatures have no blood but respires?","options":["Hydra","Cockroach","Earthworm","Fish"],"answer":"1","solution":"(a) Hydra \u2013 \u2714 Correct . Hydra is a simple aquatic organism with no circulatory system (no blood) but performs respiration through its body surface . (b) Cockroach \u2013 Has hemolymph (blood-like fluid). (c) Earthworm \u2013 Has blood with hemoglobin dissolved in plasma. (d) Fish \u2013 Have red blood and gills for respiration."},{"id":"76128","q":"Diseases of inner parts of the human body are diagnosed through?","options":["Cardiograph","Endoscope","Gyroscope","Crestograph"],"answer":"2","solution":"(a) Cardiograph \u2013 Records heart activity, not for internal viewing. (b) Endoscope \u2013 \u2714 Correct . A device inserted into the body to view internal organs and diagnose diseases. (c) Gyroscope \u2013 A device to maintain orientation; unrelated to diagnosis. (d) Crestograph \u2013 Not a medical diagnostic tool."},{"id":"76129","q":"During the metamorphosis of frog?","options":["Hind leg disappear","Ingestion of food is slowed down","Skin becomes rough","Intestine is shortened"],"answer":"4","solution":"(a) Hind leg disappear \u2013 Incorrect. Hind legs develop , they do not disappear. (b) Ingestion slows down \u2013 Not a characteristic change of metamorphosis. (c) Skin becomes rough \u2013 Incorrect. Frog skin remains moist and adapted for respiration. (d) Intestine is shortened \u2013 \u2714 Correct . As tadpoles transition from herbivores to carnivorous adults, their long intestines shorten to suit the adult diet."},{"id":"76130","q":"Lichen are the complex creature, made from?","options":["Fungus and Bacteria","Fungus and Algae","Fungus and Bryophyta","Algae and Bacteria"],"answer":"2","solution":"(a) Fungus and Bacteria \u2013 Incorrect combination for lichens. (b) Fungus and Algae \u2013 \u2714 Correct . Lichens are symbiotic associations between fungi (structure provider) and algae (photosynthesis provider) . (c) Fungus and Bryophyta \u2013 Bryophytes are non-vascular plants; not part of lichen formation. (d) Algae and Bacteria \u2013 Incorrect. Bacteria may form other associations, but not lichens."},{"id":"76131","q":"Keeping pigs away from human settlement helps in the eradication of?","options":["Malaria","Elephantiasis","Japanese encephalitis","Polio"],"answer":"3","solution":"(a) Malaria \u2013 Spread by Anopheles mosquitoes, which breed in stagnant water, not related to pigs. (b) Elephantiasis \u2013 Caused by filarial worms spread by Culex mosquitoes; no link with pigs. (c) Japanese encephalitis \u2013 \u2714 Correct . Pigs act as amplifying hosts for the Japanese Encephalitis Virus. Keeping pigs away from humans helps reduce transmission. (d) Polio \u2013 Caused by a virus spread via the fecal-oral route, not connected to pigs."},{"id":"76132","q":"In AIDS virus , there is?","options":["DNA +Protein","RNA +DNA","RNA + Protein","DNA only"],"answer":"3","solution":"(a) DNA + Protein \u2013 Incorrect for HIV. (b) RNA + DNA \u2013 Not simultaneously present. HIV has RNA, and during replication, it produces DNA via reverse transcriptase. (c) RNA + Protein \u2013 \u2714 Correct . HIV is an RNA virus (retrovirus) with RNA as genetic material and structural proteins. (d) DNA only \u2013 Incorrect, as HIV primarily contains RNA."},{"id":"76133","q":"Rearing of silk is known as?","options":["Sericulture","Horticulture","Floriculture","Apiculture"],"answer":"1","solution":"(a) Sericulture \u2013 \u2714 Correct . It is the rearing of silkworms for silk production. (b) Horticulture \u2013 Cultivation of fruits, vegetables, and ornamental plants. (c) Floriculture \u2013 Cultivation of flowers. (d) Apiculture \u2013 Beekeeping for honey and wax."},{"id":"76134","q":"What is the botanical name of opium?","options":["Emblica officinalis","Papaver somniferum","Rauwolfia Serpentina","Cinchona species"],"answer":"2","solution":"(a) Emblica officinalis \u2013 Botanical name of Amla (Indian Gooseberry). (b) Papaver somniferum \u2013 \u2714 Correct . It is the opium poppy , source of morphine, codeine, etc. (c) Rauwolfia serpentina \u2013 Known for producing reserpine , used in hypertension. (d) Cinchona species \u2013 Source of quinine , used in malaria treatment."},{"id":"76135","q":"Pungency in chillies is due to the presence of?","options":["Lycopene","Carotene","Anthocyanin","Capsaicin"],"answer":"4","solution":"(a) Lycopene \u2013 Red pigment in tomatoes, not responsible for pungency. (b) Carotene \u2013 Pigment in carrots and other plants; not responsible for heat. (c) Anthocyanin \u2013 Pigment causing blue/red color in some fruits/flowers. (d) Capsaicin \u2013 \u2714 Correct . Alkaloid compound responsible for the spicy heat in chillies."},{"id":"76136","q":"Blood grouping was discovered by?","options":["Louis pasture","William Harvey","Landsteiner","Robert Koch"],"answer":"3","solution":"(a) Louis Pasteur \u2013 Famous for his work on vaccination, pasteurization, and germ theory, but not blood groups. (b) William Harvey \u2013 Known for discovering the circulation of blood. (c) Landsteiner \u2013 \u2714 Correct . Karl Landsteiner discovered the ABO blood group system . (d) Robert Koch \u2013 Known for his work on tuberculosis and Koch's postulates, not blood types."},{"id":"76137","q":"Normally the pitch of females are?","options":["More than that of males","Slightly low than that of males","Very low than that of males","Exactly same as that of males"],"answer":"1","solution":"(a) More than that of males \u2013 \u2714 Correct . Generally, females have a higher pitch (frequency) of voice compared to males due to anatomical differences like vocal cords. (b) Slightly lower than that of males \u2013 Incorrect, as females usually have higher-pitched voices. (c) Very low than that of males \u2013 Incorrect. Males typically have a lower-pitched voice. (d) Exactly same as that of males \u2013 Incorrect, as pitch varies by gender."},{"id":"76138","q":"During the dehydration the substance that is usually lost by the body is?","options":["Sugar","Calcium Phosphate","Sodium chloride","Potassium chloride"],"answer":"3","solution":"(a) Sugar \u2013 Not the primary substance lost during dehydration. (b) Calcium Phosphate \u2013 Not significantly lost in dehydration. (c) Sodium chloride \u2013 \u2714 Correct . During dehydration, the body loses sodium chloride (salt), which affects electrolyte balance. (d) Potassium chloride \u2013 While potassium is lost, sodium chloride loss is more prominent during dehydration."},{"id":"76139","q":"A man feels unpleasant due to humidity and heat. The reason for this is?","options":["More sweating","Less sweating","Sweat does not evaporate due to humidity","Sweat is not formed due to humidity"],"answer":"3","solution":"(a) More sweating \u2013 While sweating increases, it does not necessarily lead to discomfort. (b) Less sweating \u2013 Decreased sweating typically makes heat more uncomfortable, but the key issue is not the quantity. (c) Sweat does not evaporate due to humidity \u2013 \u2714 Correct . High humidity prevents sweat from evaporating, causing discomfort as the body cannot cool down effectively. (d) Sweat is not formed due to humidity \u2013 Incorrect, sweating still occurs but doesn\u2019t evaporate in high humidity."},{"id":"76140","q":"Which of the following gas mixture is used in welding gas?","options":["Acetylene and Hydrogen","Oxygen and Acetylene","Hydrogen and Oxygen","Hydrogen and helium"],"answer":"2","solution":"(a) Acetylene and Hydrogen \u2013 Not commonly used in welding. (b) Oxygen and Acetylene \u2013 \u2714 Correct . Oxygen and acetylene are commonly used in oxy-acetylene welding , where oxygen supports acetylene combustion to produce a high-temperature flame. (c) Hydrogen and Oxygen \u2013 Not typically used in welding. (d) Hydrogen and Helium \u2013 Not a common welding gas mixture."},{"id":"76141","q":"Tear gas is?","options":["Ammonia","Chlorine","Hydrogen Carbide","Hydrogen Sulphide"],"answer":"2","solution":"(a) Ammonia \u2013 While ammonia is an irritant, it is not commonly used as tear gas. (b) Chlorine \u2013 \u2714 Correct . Chlorine compounds, such as chlorobenzylidene malonitrile (CS) and chloropicrin , are typically used as tear gases. (c) Hydrogen Carbide \u2013 Incorrect, this is not a compound used in tear gas. (d) Hydrogen Sulphide \u2013 Incorrect, while it is an irritant, it is not used as tear gas."},{"id":"76142","q":"Which of the following devices is used to cool the engine of the vehicles?","options":["Polygraph","Quadrant","Turbine","Radiator"],"answer":"4","solution":"(a) Polygraph \u2013 Used for lie detection, not engine cooling. (b) Quadrant \u2013 Not related to cooling an engine. (c) Turbine \u2013 Although turbines are used in certain engines, they are not used for vehicle engine cooling. (d) Radiator \u2013 \u2714 Correct . A radiator is used in vehicles to cool the engine by dissipating heat through the circulation of coolant."},{"id":"76143","q":"In the case of rusting, the weight of iron?","options":["Decrease","Increase","Remain the same","Uncertain"],"answer":"2","solution":""},{"id":"76144","q":"The full form of SIM is?","options":["Subscriber\u2019s identity Module","Subscriber\u2019s identity Machine","Self Identity Machine","Self Identity Module"],"answer":"1","solution":""},{"id":"76145","q":"who delivered the principle of \u2018jumping gene\u2019?","options":["Watson and crick","Barbara Mc Clintock","Tomas Hunt Morgan","Gregor Johan Mendal"],"answer":"2","solution":"(a) Watson and Crick \u2013 Famous for discovering the DNA double helix structure , but not for the principle of \"jumping genes.\" (b) Barbara McClintock \u2013 \u2714 Correct . Barbara McClintock discovered transposons , or \"jumping genes,\" which can move from one position to another within a genome. (c) Tomas Hunt Morgan \u2013 Known for his work in genetics, especially with fruit flies, but not for \"jumping genes.\" (d) Gregor Johann Mendel \u2013 Known as the father of genetics for his work on inheritance, but not related to \"jumping genes."},{"id":"76146","q":"Which of the following is a biofertilizer?","options":["Urea","2,4 \u2013D","Streptrocycline","Azolla"],"answer":"4","solution":"(a) Urea \u2013 Urea is a chemical fertilizer , not a biofertilizer. (b) 2,4-D \u2013 A herbicide , not a biofertilizer. (c) Streptocycline \u2013 An antibiotic used in medicine, not a biofertilizer. (d) Azolla \u2013 \u2714 Correct . Azolla is a biofertilizer , as it is a water fern that helps in nitrogen fixation, benefiting crops."},{"id":"76147","q":"The most abundant element of human body is ?","options":["Sodium","Oxygen","Iodine","Iron"],"answer":"2","solution":"(a) Sodium \u2013 Sodium is present in the human body, but it is not the most abundant element. (b) Oxygen \u2013 \u2714 Correct . Oxygen is the most abundant element in the human body, primarily found in water (H2O) and cells. (c) Iodine \u2013 Present in small amounts in the human body (mainly in the thyroid), but not the most abundant. (d) Iron \u2013 Important in the body, especially in red blood cells, but not the most abundant element."},{"id":"76148","q":"Which of the following are required for the formation of bones and teeth ?","options":["sodium and potassium","Iron and calcium","sodium and calcium","Calcium and phosphorus"],"answer":"4","solution":"(a) Sodium and potassium \u2013 These are important for nerve function and fluid balance, not for bone and tooth formation. (b) Iron and calcium \u2013 Iron is essential for blood, but calcium and phosphorus are key for bones and teeth. (c) Sodium and calcium \u2013 Sodium is not as critical for bone formation as phosphorus. (d) Calcium and phosphorus \u2013 \u2714 Correct . Both calcium and phosphorus are essential for the formation of bones and teeth."},{"id":"76149","q":"\u2018Phloem\u2019 in plants is mainly responsible for \u2013","options":["Transportation of food","Transportation of oxygen","Transportation of amino acid","Transportation of water"],"answer":"1","solution":"(a) Transportation of food \u2013 \u2714 Correct . Phloem is the vascular tissue in plants responsible for transporting the products of photosynthesis (mainly sugars) from the leaves to other parts of the plant. (b) Transportation of oxygen \u2013 Oxygen is not transported by phloem; it is transported by air and absorbed through leaves. (c) Transportation of amino acid \u2013 Phloem carries food (mainly sugars), not amino acids. (d) Transportation of water \u2013 Water is transported by xylem , not phloem."},{"id":"76150","q":"Coastal length of India is","options":["7,516 km","6100 km","7515 km","6516 km"],"answer":"1","solution":"(a) 7,516 km \u2013 \u2714 Correct . The coastal length of India is approximately 7,516 kilometers , which includes the mainland, Lakshadweep, and Andaman & Nicobar Islands. (b) 6100 km \u2013 Incorrect, this is a lower estimation of the length. (c) 7515 km \u2013 Incorrect, slightly underestimates the total length. (d) 6516 km \u2013 Incorrect, not the correct figure for India\u2019s coastal length."},{"id":"76151","q":"Which of these articles was implemented on 26 November?","options":["392","394","256","257"],"answer":"2","solution":"(a) 392 \u2013 Incorrect. Article 392 deals with the power to amend the Constitution during the transition period, not specifically linked to November 26. (b) 394 \u2013 \u2714 Correct . Article 394 of the Indian Constitution was implemented on 26 November . It mentions the commencement of the Constitution of India. (c) 256 \u2013 Incorrect. Article 256 deals with the obligation of states and Union to comply with laws made by Parliament. (d) 257 \u2013 Incorrect. Article 257 deals with control of the Union over States in certain matters."},{"id":"76152","q":"How many Schedules and Parts are there in the constitution?","options":["12 Schedule 25 Parts","08 Schedule 22 Parts","08 Schedule 24 Parts","12 Schedule 22 Parts"],"answer":"1","solution":"(a) 12 Schedule 25 Parts \u2013 \u2714 Correct . The Indian Constitution originally had 8 Schedules , but currently, it contains 12 Schedules . The Constitution has 25 Parts . (b) 08 Schedule 22 Parts \u2013 Incorrect. While the Constitution had 8 Schedules originally, the correct count is 12 Schedules. (c) 08 Schedule 24 Parts \u2013 Incorrect. The number of parts is 25, not 24. (d) 12 Schedule 22 Parts \u2013 Incorrect. This option does not reflect the correct number of Parts."},{"id":"76153","q":"Tick the correct statements i At present there is 245 members in Rajya Sabha ii Vice-President is elected by Secret Ballot System iii There is No Reservation of Seat for ST in Rajya Sabha iv Lok Sabha is the Upper House & Interim Political","options":["Only i & ii","i, ii, iv","i, ii, iii","ii and iv"],"answer":"3","solution":"i. Correct : There are 245 members in Rajya Sabha (as of 2023). ii. Correct : The Vice-President is elected via Secret Ballot . iii. Correct : There is no reservation for ST (Scheduled Tribes) in Rajya Sabha . iv. Incorrect : Lok Sabha is the Lower House , not the Upper House (Rajya Sabha is the Upper House)."},{"id":"76154","q":"Who among the following was not a member of Drafting Committee.","options":["K N Munsi","N Madhav Rao","JL Nehru","NG Ayenger"],"answer":"3","solution":"(a) K N Munsi \u2013 K N Munsi was a member of the Drafting Committee. (b) N Madhav Rao \u2013 N Madhav Rao was a member of the Drafting Committee. (c) JL Nehru \u2013 \u2714 Correct . Jawaharlal Nehru was not a member of the Drafting Committee ; he was, however, a member of the Constituent Assembly. (d) NG Ayenger \u2013 NG Ayenger was also a member of the Drafting Committee."},{"id":"76155","q":"Gadar Party was established in the year","options":["1907","1913","1917","1920"],"answer":"2","solution":"(a) 1907 \u2013 Incorrect. The Gadar Party was not established in 1907. (b) 1913 \u2013 \u2714 Correct . The Gadar Party was established in 1913 by Indian immigrants in the United States to fight for India's independence from British rule. (c) 1917 \u2013 Incorrect. By this time, the Gadar Party had already been formed. (d) 1920 \u2013 Incorrect. The Gadar Party was dissolved by this time, and its activities had largely diminished."}];
let idx=0, answers={}, timerSec=65*60, timerInt=null;

function render(){
  const q=DATA[idx];
  if(!q){document.getElementById('qText').textContent='No data.';return;}
  document.getElementById('qNum').textContent=idx+1;
  document.getElementById('qTotal').textContent=DATA.length;
  document.getElementById('qText').textContent=q.q;
  document.getElementById('opts').innerHTML=q.options.map((o,i)=>
    `<div class="option ${answers[idx]==(i+1)?'selected':''}" onclick="select(${i+1})">${String.fromCharCode(65+i)}. ${o}</div>`
  ).join('');
}
window.select=o=>{answers[idx]=o; render();};
window.prev=()=>{if(idx>0){idx--; render();}};
window.next=()=>{if(idx<DATA.length-1){idx++; render();}};

function submitTest(){
  clearInterval(timerInt);
  let c=0; for(let i=0;i<DATA.length;i++){if(answers[i]==DATA[i].answer)c++;}
  const pct=Math.round(c/DATA.length*100)||0;
  document.getElementById('qCard').classList.add('hidden');
  document.getElementById('resCard').classList.remove('hidden');
  document.getElementById('score').textContent=pct+'%';
  document.getElementById('detail').innerHTML='<b>'+c+'/'+DATA.length+'</b> correct';
}

function tick(){timerSec--; document.getElementById('timer').textContent=Math.floor(timerSec/60)+':'+String(timerSec%60).padStart(2,'0'); document.getElementById('bar').style.width=(timerSec/(65*60)*100)+'%'; if(timerSec<=0){clearInterval(timerInt); submitTest();}}

render(); timerInt=setInterval(tick,1000);
</script>
</body></html>
