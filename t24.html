<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>ASWMO — T24 Non-Tech</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
:root{--bg:#0b0c15;--surface:#12142a;--text:#e4e6f0;--accent:#00e8a0;--gold:#f0c040;--danger:#ff4d6d;--border:rgba(255,255,255,.08);--muted:#8a8fa8;}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:Inter,system-ui,sans-serif;background:radial-gradient(1000px 700px at 20% 0%,#00e8a011,transparent),var(--bg);color:var(--text);min-height:100vh;line-height:1.55;}
.container{max-width:900px;margin:2rem auto;padding:0 1.2rem;}
h1{font-size:1.6rem;font-weight:700;background:linear-gradient(135deg,#fff,var(--accent));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.card{background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:16px;padding:1.5rem;margin-bottom:1rem;}
.question{font-size:1.05rem;font-weight:500;margin-bottom:.8rem;line-height:1.35;}
.options{display:grid;gap:.5rem;}
.option{padding:.7rem 1rem;background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:10px;cursor:pointer;font-size:.92rem;transition:.2s;}
.option:hover,.option.selected{border-color:var(--accent);background:rgba(0,232,160,.12);font-weight:600;}
.timer{font-family:monospace;font-weight:700;font-size:2rem;color:var(--accent);}
button{background:linear-gradient(135deg,var(--accent),#00b87e);color:#0a0c12;border:none;padding:.7rem 1.4rem;border-radius:10px;font-weight:700;cursor:pointer;}
.hidden{display:none!important}</style>
</head>

</div>

er","Transport Layer","Network Layer","Application Layer"],"answer":"3"},{"id":"77467","q":"The process of converting a high-level language program into machine code, executing it instruction by instruction without prior full translation, is performed by a:","options":["Compiler","Assembler","Interpreter","Linker"],"answer":"3"},{"id":"77468","q":"Which one of the following is the most stable ecosystem?","options":["Forest","Desert","Mountain","Ocean"],"answer":"4"},{"id":"77469","q":"In an ecological pyramid of energy, the trophic level that always occupies the base is:","options":["Herbivores","Carnivores","Producers","Decomposers"],"answer":"3"},{"id":"77470","q":"The maximum biological oxygen demand (BOD) in a river indicates:","options":["Low level of microbial activity.","High concentration of toxic pollutants.","High level of organic pollution.","High levels of dissolved oxygen (DO)."],"answer":"3"},{"id":"77471","q":"Which of the following conventions addresses the transboundary movement of hazardous wastes and their disposal?","options":["Vienna Convention","Stockholm Convention","Basel Convention","Rotterdam Convention"],"answer":"3"},{"id":"77472","q":"In the context of the Carbon Cycle, which of the following processes is the fastest mechanism for removing carbon dioxide (CO 2 ) from the atmosphere?","options":["Formation of sedimentary rocks (long-term geological storage)","Photosynthesis by terrestrial plants and phytoplankton","Diffusion of CO 2 into deep ocean currents","Decomposition of organic matter"],"answer":"2"},{"id":"77473","q":"The phenomenon of Eutrophication in a water body leads to:","options":["An increase in the dissolved oxygen (DO) level due to algal bloom.","A decrease in the concentration of toxic heavy metals.","A reduction in the dissolved oxygen (DO) level, leading to the death of aquatic fauna.","A shift in the primary producers from algae to aquatic grasses."],"answer":"3"},{"id":"77474","q":"A 20 kg object is accelerated from let idx=0, answers={}, timerSec=3900, timerInt=null;

function render(){
  const q=DATA[idx];
  if(!q){document.getElementById('qText').textContent='No data.';return;}
  document.getElementById('qNum').textContent=idx+1;
  document.getElementById('qTotal').textContent=DATA.length;
  document.getElementById('qText').textContent=q.q;
  document.getElementById('opts').innerHTML=q.options.map((o,i)=>
    `<div class="option ${answers[idx]==(i+1)?'selected':''}" onclick="select(${i+1})">${String.fromCharCode(65+i)}. ${o}</div>`
  ).join('');
}
window.select=o=>{answers[idx]=o; render();};
window.prev=()=>{if(idx>0){idx--; render();}};
window.next=()=>{if(idx<DATA.length-1){idx++; render();}};

function submitTest(){
  clearInterval(timerInt);
  let c=0; for(let i=0;i<DATA.length;i++){if(answers[i]==DATA[i].answer)c++;}
  const pct=Math.round(c/DATA.length*100)||0;
  document.getElementById('qCard').classList.add('hidden');
  document.getElementById('resCard').classList.remove('hidden');
  document.getElementById('score').textContent=pct+'%';
  document.getElementById('detail').innerHTML='<b>'+c+'/'+DATA.length+'</b> correct';
}

function tick(){timerSec--; document.getElementById('timer').textContent=Math.floor(timerSec/60)+':'+String(timerSec%60).padStart(2,'0'); document.getElementById('bar').style.width=(timerSec/3900*100)+'%'; if(timerSec<=0){clearInterval(timerInt); submitTest();}}

render(); timerInt=setInterval(tick,1000);
</script>
