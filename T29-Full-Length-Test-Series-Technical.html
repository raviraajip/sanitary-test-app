<script>
const DATA=[{"id":"78577","q":"Identify the treatment technology/technologies NOT recommended for highly biodegradable organic solid wastes.","options":["Biohydrogenation","Anaerobic digestion","Composting","Open dumping"],"answer":"4","solution":"Open dumping - Composing and anaerobic digestion are two most commonly adopted process for biological conversion of organic fraction of municipal solid waste. Bio-hydrogenation is a process in which bacteria converts unsaturated fatty acid to saturated fatty acid. So, it can be used for treating highly biodegradable organic solid waste. Open dumping i.e. dumping in unoccupied land stretch, poses environmental and health concerns. Open dumping is a breeding ground for disease carrying vectors. It attracts mosquitos, rats and flies. Dumped material Positive may catch fire assisted by CH 4 emission. Rain washes off the contaminents and contaminates surface water, percolating water contaminates the soil and ground water. So, it is not recommended for highly biodegradable organic solid wastes."},{"id":"78578","q":"The following table gives various components of Municipal Solid Waste (MSW) and a list of treatment/separation techniques. Component of MSW P. Ferrous metals Q. Aluminum and copper R. Food waste S. Cardboardin Treatment/separation technique i. Incineration ii. Rapid composting iii. Eddy current separator iv. Magnetic separator The CORRECT match is","options":["P-iv, Q-iii, R-i, S-ii","P-iii, Q-iv, R-i, S-ii","P-iv, Q-iii, R-ii, S-i","P-iii, Q-iv, R-ii, S-i"],"answer":"3","solution":"P-iii, Q-iv, R-i, S-ii - I. Various MSW separation techniques (a) Screening process (b) Size reduction process Reduction in size of MSW can be done using following mechanical devices: (a) Shredders (b) Flail mill hammer (c) Glass crus (c) Density separation process It is the process of separation of light materials such as paper and plastic from heavy materials such as metals. It is carried out using air density separators. (d) Magnetic separation process It is the process of separating ferrous metals from MSW. It is carried out using magnetic separators. (e) Current separation process It is the process of separating aluminium and copper from MSW. It is carried out using Eddy current separator. II. Various MSW treatment technique (a) Sanitary landfills (b) Composting (c) Incineration (d) Pyrolysister"},{"id":"78579","q":"Which of the following statements is/are TRUE for the Refuse-Derived Fuel (RDF) in the context of Municipal Solid Waste (MSW) management?","options":["Higher Heating Value (HHV) of the unprocessed MSW is higher than the HHV of RDF processed from the same MSW.","RDF can be made in the powdered form","Inorganic fraction of MSW is mostly converted to RDF.","RDF cannot be used in conjunction with oil."],"answer":"2","solution":"RDF can be made in the powdered form - (a) is false. The Higher Heating Value (HHV) of Refuse-Derived Fuel (RDF) processed from Municipal Solid Waste (MSW) is typically higher than the HHV of unprocessed MSW. This is because RDF processing removes non-combustible materials from MSW and concentrates the combustible fraction. (b) is true. RDF can be produced in various forms including pellets, fluff, and powdered form. The form of RDF depends on the specific process and intended end use. (c) is partially true. RDF processing typically removes a significant portion of the inorganic fraction of MSW, but not all of it. The remaining inorganic fraction is typically mixed with the RDF product. (d) is false. RDF can be used as a fuel in a variety of combustion systems, including those that burn oil. In fact, RDF is often used as a supplemental fuel in cement kilns and other industrial processes that also use oil as a fuel."},{"id":"78580","q":"In the context of Municipal Solid Waste Management, 'Haul' in 'Hauled Container System operated in conventional mode' includes the ______.","options":["time spent by the transport truck at the disposal site","time spent by the transport truck in traveling between a pickup point and the disposal site with a loaded container","time spent by the transport truck in picking up a loaded container at a pickup point","time spent by the transport truck in driving from the depot to the first pickup point"],"answer":"2","solution":"time spent by the transport truck in traveling between a pickup point and the disposal site with a loaded container - starting after the container whose contents are to be emptied has been loaded on the track, plus the time after leaving the disposal site until the truck arrives at the location where the empty container is to be redeposited. Time spent at the disposal site is not included. (a, b)"},{"id":"78581","q":"In a solid waste handling facility, the moisture contents (MC) of food waste, paper waste, and glass waste were found to be MCf, MCp, and MCg, respectively. Similarly, the energy contents (EC) of plastic waste, food waste, and glass waste were found to be ECpp, ECf, and ECg, respectively. Which of the following statement(s) is/are correct?","options":["MCf > MCp > MCg","ECp > ECf > ECg","MCf < MCP < MCg","ECpp < ECf < ECg"],"answer":"1","solution":"MCf > MC p > MCg , ECpp > ECf > ECg - Typical specific weight and moisture content data for residential, commercial, industrial, and agricultural wastes. Moisture content Mcf > Mcp > Mcg Typical values for short residue and energy conent of residentail MSW. a After complete combustion b As discarded basis c Energy content is from coatings, labels and attached materials. Note: Btu/lb x 2.326 = kJ/kg Energy content ECpp > ECf > ECg"},{"id":"78582","q":"To design an optimum municipal solid waste collection route, which of the following is/are NOT desired:","options":["Collection vehicle should not travel twice down the same street in a day.","Waste collection on congested roads should not occur during rush hours in morning or evening.","Collection should occur in the uphill direction.","The last collection point on a route should be as close as possible to the waste disposal facility."],"answer":"3","solution":"Collection should occur in the uphill direction. - Some heuristic guidelines that should be taken into consideration when laying out routes are as follows : 1. Existing policies and regulations related to such items as the point of collection and frequency of collection must be identified. 2. Existing system characteristics such as crew size and vehicle types must be coordinated. 3. Wherever possible, routes should be laid out so that they begin and end near arterial streets, using topographical and physical barriers as route boundaries. 4. In hilly area, routes should start at the top of the grade and proceed downhill as the vehicle becomes loaded. 5. Routes should be laid out so that the last container to be collected on the route is located nearest to the disposal site. 6. Waste generated at traffic-congested locations should be collected as early in the day as possible. 7. Sources at which extremely, large quantities of waste are generated should be serviced during the first part of the days. 8. Scattered pickup points (where small quantities of solid waste are generated) that receive the same collection frequency should, if possible, be serviced during one trip or on the same day."},{"id":"78583","q":"Two biodegradable components of municipal solid waste are","options":["plastics & wood","cardboard & glass","leather and tin cans","food waste and garden trimming"],"answer":"4","solution":"Food waste and garden trimmings are organic materials that are naturally broken down by microorganisms such as bacteria and fungi over a relatively short period. This process makes them excellent candidates for composting to create organic manure."},{"id":"78584","q":"Determine the correctness or otherwise of the following assertion [a] and the Reason [r]. Assertion [a]: One of the best ways to reduce the amount of solid wastes is to reduce the consumption of raw materials. Reason [r]: Solid wastes are seldom generated when raw materials are converted to goods for consumption.","options":["Both [a] and [r] are true and [r] is the correct reason for [a]","Both [a] and [r] are true but [r] is not the correct reason for [a]","[a] is true but [r] is false","Both [a] and [r] are false."],"answer":"3","solution":"[a] is true but [r] is false \u2013 (27272.7 m 2 \\year) 260 10 (27272.7 m\u00b2/yr) MSW generated = 40 x 106 Kg/year Recovery = 10% Going to landfill = 90% Single lift = 3m Compacted density = 550 Kg/m\u00b3 80% of MSW Amount of MSW going to landfill = 0.9 \u00d7 40 \u00d7 10 6 Kg/year = 36 x 10 6 Kg/year Volume of compacted landfill = m 3 \\yr This volume accounts for 80% of landfill Total volume of landfill = m 3 \\yr Landfill has single lift of 3m. Area of landfill required = = 27272.7 m 2 \\yr"},{"id":"78585","q":"In a town, garbage is produced at the rate of","options":["150 gm","800 gm","450 gm","600 gm per head per day"],"answer":"3","solution":"450 gm - In town city garbage is generated at the rate of 450 gram per day per head."},{"id":"78586","q":"The rate of deoxygeneration L D in a river may be expressed as","options":["L D = -K.L O e- kt","L D = L O e- kt","L D =","L D ="],"answer":"1","solution":"L D = -K.L O e- kt - The rate of deoxygeneration L D = -K.L O e- kt"},{"id":"78587","q":"During sewer cleaning the workers are exposed to hazards primarily due to","options":["presence of methane","absence of oxygen","hazardous chemicals","slippery floors of the manholes"],"answer":"1","solution":"presence of methane -: During sever cleaning the workers are exposed to hazards primarily due to presence of methane. Inhalation of massive quantities of hydrogen sulfide will rapidly produce anoxia resulting in death by asphyxia."},{"id":"78588","q":"Disappearance of pink colour of water from a well due to addition of KMnO4 indicates that water contained","options":["Acidity","Alkalinity","Turbidity","Organic matter"],"answer":"4","solution":"Organic matter -: Disappearance of pink colour of water of a well due to addition of KMnO4 indicates that water contained organic matter. KMnO4 removes both organic matter and microorganism from water."},{"id":"78589","q":"Which of the following tests employ ferroin indicator?","options":["Iron","Fluoride","Chemical oxygen demand","Nitrate nitrogen"],"answer":"3","solution":"Chemical oxygen demand -: Chemical oxygen demand texts employ ferroin indicator."},{"id":"78590","q":"If a sewer carrying a discharge of 3 cumec outfalls into a river having a discharge of 10 cumec and DO equal to 9.1 mg/L, the resultant DO of the mix is","options":["7 mg/L","5 mg/L","6 mg/L","8 mg/L"],"answer":"1","solution":"7 mg/L -: BOD mix = = BOD mix = 7mg\\L"},{"id":"78591","q":"Non-disposal of solid waste may cause the spread of","options":["malaria","rodent related plague","typhoid","dysentery"],"answer":"2","solution":"The non-disposal of solid waste is a significant public health hazard that primarily facilitates the spread of rodent-related plague . While all the diseases listed are linked to poor sanitation, they spread through different primary mechanisms: Disease Primary Vector/Cause Connection to Solid Waste Rodent-related Plague Rats and Fleas Accumulated solid waste provides food and harborage for rats, which carry fleas that transmit the plague. Malaria Anopheles Mosquitoes Primarily spreads via stagnant water. While waste can collect water, it is more specifically a \"water-borne vector\" disease. Typhoid Bacteria ( S. Typhi ) Spreads through contaminated food and water (fecal-oral route). Dysentery Bacteria or Amoeba Spreads through contaminated food and water; flies attracted to waste can mechanically transfer these pathogens."},{"id":"78592","q":"Method to prevent 'sewage sickness' is","options":["Rotation of crop","Pretreatment of sewage","Shallow depth application","All of the above"],"answer":"4","solution":"All of the above :- Sewage sickness-When sewage is continuously applied on a piece of land the pores or void in the soil gets clogged and the free circulation of air will be prevented. Method to prevent sewage sickness is rotation cro, pretreatment of sewage and shallow depth application."},{"id":"78593","q":"The ultimate BOD value of a waste:","options":["Remains the same at all temperatures","Decreases with temperature","Increase with temperature","Doubles with every 10\u00b0 C rise in temperature"],"answer":"1","solution":"Remains the same at all temperatures :- Ultimate BOD of sewage is a fixed quantity and does not depend upon temperature of oxidation."},{"id":"78594","q":"A solution has 100 mg/L NH 3 and 100 mg/L glucose. Calculate theoretical oxygen demand of this solution?","options":["483.14 mg/L","106.67 mg/L","400 mg/L","350 mg/L"],"answer":"1","solution":"483.14 mg/L:- Theoretical oxygen demand is total amount of oxygen required for complete digestion of waste. for NH 3 NH 3 + 2O 2 HNO 3 + H 2 O 17 mg of HNO 3 requires = 2 \u00d7 32 mg of oxygen Therefore 100 mg/Ltr will require mg/L of oxygen = 376.4 mg\\liter For glucose C 6 H 12 O 6 + 60 2 6CO 2 +6H 2 O 180 mg of glucose require 192 gm oxygen 100 mg of glucose require 100 mg oxygen 100 mg/Ltr glucose require 106.67 mg/Ltr oxygen Total oxygen required = 376.4 + 106.67"},{"id":"78595","q":"The dominating microorganisms in an activated sludge process reactor are:","options":["Aerobic heterotrophs","Anaerobic heterotrophs","Autotrophs","Phototrophs"],"answer":"1","solution":"Aerobic heterotrophs:- in activated sludge process, the treated sewage from, other treated plant, there by which contain microorganism in get mixed with sewage in presence of oxygen to degrade."},{"id":"78596","q":"In a sludge digestion tank, if the moisture content of sludge is reduced from 90% to 80% then the percentage decrease in the volume of sludge is","options":["5%","10%","25%","50%"],"answer":"4","solution":"50%:- Sludge and its moisture content Given, P 1 = 80 P 2 = 90 V 2 (100-P 2 ) = V 1 (100 - P 1 ) V 2 (100-80) = V 1 (100 - 90) V 2 = 2 % decrease in volume = ="},{"id":"78597","q":"As per the Solid Waste Management Rules, 2016, the landfill site shall be (i) 100 meter away from river. (ii) 200 meter away from a pond. (iii) 200 meter away from Highways, Habitations, Public Parks and water supply wells. (iv) 20 km away from Airports or Airbase.","options":["(i) and (ii)","(i) and (iii)","(i), (ii) and (iii)","(i), (ii), (iii) and (iv)"],"answer":"4","solution":"(i), (ii), (iii) and (iv) :- Solid waste management should"},{"id":"78598","q":"In order to design waste water disposal system for a locality the important information to be collected is","options":["record of population and its change","water consumption rate and sewage flow","hydrological data","all of these"],"answer":"4","solution":"all of these :- In order to design waste water disposal system for a locality the important information to be collected is (a) Record of population and its change (b) Water consumption rate and sewage flow (c) Hydrological data"},{"id":"78599","q":"Say a raw waste water sample from AA WWTP has 5-day BOD equals to 2000 mg/L (reaction constant k = 0.23/day at 20 0 C). Calculate value of ultimate BOD?","options":["2826 mg/L","2296 mg/L","2000 mg/L","2926 mg/L"],"answer":"4","solution":"2926 mg/L :- Given, BOD5 = 2000 mg/L Ultimate BOD = L o , K = 0.23 BOD 5 = L o (1-e -kx5 ) 2000 = L o (1-e -0.23x5 ) L o = 2926.7mg \\"},{"id":"78600","q":"For discharging sewage and industrial effuents into stream, 5 day BOD at 20 0 C should not exceed","options":["30 mg/L","50 mg/L","100 mg/L","200 mg/L"],"answer":"1","solution":""},{"id":"78601","q":"Which of the following is an attached growth process used for treating waste water?","options":["Rotating biological contactors","Aerated lagoons","Activated sludge process","Sludge digestion system"],"answer":"1","solution":"Rotating biological contactors:- Waste water treatment processes in which the microorganisms and bacteria treating the wastes are attached to the media in the reactor. The waster being treated flow over the media. Trickling filters and rotating biological contractors are attached growth reactors."},{"id":"78602","q":"The growth of algae is useful in","options":["sedimentation tank","slow sand filter","oxidation pond","sludge digestion tank"],"answer":"3","solution":"oxidation pond:- Algae growth in oxidation pond, using energy from the sun and carbon dioxide and inorganic compounds released by bacteria in water."},{"id":"78603","q":"Activated sludge process is an-","options":["Aerobic attached growth system","Anaerobic attached growth system","Anaerobic suspended growth system","Aerobic suspended system"],"answer":"4","solution":"Aerobic suspended system:- The activated sludge process is a type of waste water treatment process for treating sewage or industrial waste waters using aerobic suspended system a biological floc composed of bacteria and protozoa."},{"id":"78604","q":"Imhoff cone is employed to determine","options":["suspended solids","volatile solids","settleable solids","filterable solids"],"answer":"3","solution":"settleable solids:- A clear cone shaped container marked with graduations. The cone is used to measure the volume of settleable solids in a specific volume (usually one liter) of water or waste water."},{"id":"78605","q":"A grit chamber of dimensions 12.0 m \u00d7 1.50 m \u00d7 0.80 m liquid depth has a flow of 720 m\u00b3/hr. Its surface loading rate and detention time are respectively","options":["4000 m\u00b3/hr/m\u00b2 and 1.2 minute","40000 Lph/m\u00b2 and 40 minute","40 m\u00b3/hr/m\u00b2 / and 12 minute","4000 Lph/m\u00b2 and 1.2 minute"],"answer":"3","solution":"40 m\u00b3/hr/m\u00b2 / and 1.2 minute :- Explanation- Surface loading rate = Q/A m 3 / hr / m 2 Detention time ="},{"id":"78606","q":"Which type of equalization tank is mainly useful in assisting self neutralization or evening out of fluctuating concentrations, and not for balancing of flows?","options":["Flow through type","Intermittent flow type","Variable inflow/constant discharge type","Variable discharge/constant inflow type"],"answer":"1","solution":"Flow through type:- Flow through type of equalization tank is mainly useful in assisting self neutralization or evening out of fluctuating concentrations and not for balancing of flows."},{"id":"78607","q":"Activated sludge is the","options":["aerated sludge in the aeration unit","sludge settled in the humus tank","sludge in the secondary tank after aeration and rich in microbial masses","sludge in the secondary tank after aeration and rich in nutrients"],"answer":"3","solution":"sludge in the secondary tank after aeration and rich in microbial masses"},{"id":"78608","q":"The removal of dissolved organic matter occurs in","options":["slow sand filters","trickling filters","rapid sand filters","dual media filters"],"answer":"2","solution":"Sewage sickness occurs when sewage is applied continuously to a piece of land, causing the soil pores to become clogged with sewage matter retained in them. This prevents proper aeration and percolation, leading to anaerobic conditions and potential odor problems and soil degradation. The preventive measures work as follows: Rotation of crop: This practice allows the land to rest and recover, preventing the continuous buildup of sewage matter in the soil. Pretreatment of sewage: Treating the sewage to remove solids and organic matter before land application reduces the clogging potential and overall load on the soil's natural treatment capacity. Shallow depth application: Applying sewage in shallow depths (or intermittently) aids in maintaining aerobic conditions in the soil, allowing microorganisms to break down the organic matter effectively and preventing clogging. The second part of the query, \"The removal of dissolved organic matter occurs in (a) slow sand filters (b) trickling filters (c) rapid sand filters (d) dual media filters,\" is a separate question. The removal of dissolved organic matter primarily occurs in (b) trickling filters. Trickling filters are biological treatment systems where microorganisms in a biofilm degrade the dissolved organic matter in the wastewater."},{"id":"78609","q":"Presence of excess nitrates in river water indicates","options":["recent pollution of water with sewage","past pollution of water with sewage","immediate pollution of water with sewage","no pollution of water with sewage."],"answer":"2","solution":"Nitrates (NO\u2083\u207b) are the stable, fully oxidized end-product of the decomposition of organic nitrogenous matter found in sewage. The breakdown of complex organic matter (albuminoid nitrogen) first produces free ammonia, which indicates recent pollution. This ammonia is then converted to nitrites, indicating ongoing decomposition, and finally to nitrates through the process of nitrification. Therefore, the presence of nitrates signifies that the decomposition process is complete, meaning the original sewage contamination occurred in the past, allowing sufficient time for full oxidation."},{"id":"78610","q":"Critical factors for the activated sludge treatment process are","options":["maximum hourly flow rate","maximum and minimum flow rate","maximum hourly flow rate and maximum daily organic load","minimum hourly flow rate and minimum daily organic load"],"answer":"3","solution":"The critical factors for the design and operation of an activated sludge treatment process are: Maximum hourly flow rate: This determines the required hydraulic capacity and the peak flow the system must be able to handle to prevent untreated sewage from bypassing the system. Maximum daily organic load: This dictates the required capacity of the biological treatment components (e.g., aeration tanks and blowers) to ensure sufficient microorganisms and oxygen are available to break down the maximum amount of organic pollutants (BOD) entering the system daily"},{"id":"78611","q":"A completely mixed activated process is to be used to treat a wastewater flow of 500 m\u00b3/hr having soluble BOD 5 of 250 mg/L. If the concentration of soluble BOD 5 escaping treatment is 10 mg/L, the treatment efficiency will be","options":["82%","86%","92%","96%"],"answer":"4","solution":"Step 1: Calculate the treatment efficiency The treatment efficiency is calculated using the formula: Efficiency = Where C in is the influent BOD5 concentration 250 mg/L250 mg/L and Efficiency equals the fraction with numerator cap in end-sub minus cap C out end-sub and \ud835\udc36 out is the effluent BOD concentration (10mg/L) Efficiency = Efficiency = = 0.96"},{"id":"78612","q":"The excessive acidity or alkalinity of the particular wastewater is neutralized by adding alkali or acid, and this is achieved in","options":["the sedimentation tank","the equalization tank","the flocculation tank","the purification tank"],"answer":"2","solution":"Neutralization of excessive acidity or alkalinity in wastewater by adding acid or alkali is commonly achieved in the equalization tank (also known as an equalization basin or neutralization tank). The primary purpose of this tank is to homogenize the widely varying flow rates and compositions (including pH variations) of industrial wastewater. This process ensures a stable and consistent pH level before the wastewater proceeds to subsequent treatment stages, protecting downstream biological and chemical processes from pH shocks and optimizing their efficiency."},{"id":"78613","q":"Which of the following measures is/are to be adopted against water pollution? 1. The sewage before discharging into the water body may need not to be treated 2. The industrial waste should not be treated before disposing it off. 3. As far as possible, water sources should not be used for discharging the sewage Select the correct answer.","options":["1, 2, and 3","1 only","3 only","1 and 2 only"],"answer":"3","solution":"Statement 3 is the only valid measure to be adopted against water pollution. It is a key principle of water pollution control to minimize or avoid the direct discharge of sewage into natural water sources. Statements 1 and 2 are incorrect measures: Statement 1 is incorrect because sewage must be treated before discharge to remove pollutants like organic matter, nutrients, and pathogens, thereby protecting aquatic life and human health. Statement 2 is incorrect because industrial waste, which often contains toxic chemicals and heavy metals, must be treated to neutralize or remove harmful substances before disposal."},{"id":"78614","q":"Which one of the following is the process in which ammonia is oxidised to nitrites and then to nitrates by aerobic bacteria ?","options":["Nitrification","Denitrification","Adsorption","Regeneration"],"answer":"1","solution":"Nitrification is the biological process in which ammonia is oxidized into nitrite, followed by a subsequent transformation of nitrites into nitrates by aerobic bacteria."},{"id":"78615","q":"Bulking sludge refers to having","options":["F/M < 0.3/d","0.3/d < F/M < 0.6/d","F/M = zero","F/M > 0.6/d"],"answer":"3","solution":"Bulking sludge refers to poor settling in activated sludge systems, typically caused by filamentous bacteria, and is characterized by a low Food-to-Microorganism (F/M) ratio, generally below 0.3/day, indicating too much food relative to the biomass, promoting filamentous growth, alongside high sludge age and low nutrients, making (a) the correct answer. Explanation F/M Ratio (Food-to-Microorganism Ratio): This is a crucial operational parameter in wastewater treatment, representing the amount of incoming organic load (food) per unit of active microbial mass. Bulking Sludge Conditions: Bulking happens when filamentous bacteria grow excessively, forming long strands that prevent the sludge flocs from settling properly in the clarifier. Causes: Low F/M ratios (less food per microorganism), high sludge age (long time the sludge stays in the system), and low nutrient levels (like nitrogen or phosphorus) favor these filamentous organisms. Correct Option: A low F/M ratio, specifically less than 0.3/day, creates conditions for filamentous growth, leading to bulking sludge."},{"id":"78616","q":"In aerobic environment, Nitrosomonas convert","options":["NH 3 to NO 2","NO 2 - to NO 3 -","NH 3 to N 2 O","NO 2 - to HNO 3"],"answer":"1","solution":"In nitrification, ammonia is first converted to nitrites and then to nitrates. The initial step of this process, known as nitration, involves a type of bacteria called nitrosomonas. During the process of nitration, nitrosomonas convert ammonia (NH 3 ) into nitrogen dioxide(NO 2 ) The chemical reaction involves in this process are,"},{"id":"78617","q":"In a wastewater treatment plant, Primary Sedimentation Tank (PST) designed at an overflow rate of 32.5 m\u00b3/day/m\u00b2 is 32.5 m long, 8.0 m wide and liquid depth of 2.25 m. If the length of the weir is 75 m, the weir loading rate (in m\u00b3/day/m) is _______.","options":["14.08 m\u00b3/day/m","112.67 m\u00b3/day/m","20911 m\u00b3/day/m","199m\u00b3/day/m"],"answer":"2","solution":""},{"id":"78618","q":"The wastewater having an organic concentration of 54 mg/l is flowing at a steady rate of 0.8 m\u00b3/day through a detention tank of dimensions 2m \u00d7 4m \u00d7 2m. If the contents of the tank are well mixed and the decay content is 0.1 per day, the outlet concentration (in mg/ l , up to one decimal place) is _____.","options":["319","43","40","11"],"answer":"4","solution":""},{"id":"78619","q":"The composition of a certain MSW sample and specific weights of its various components are given below: Component Percent by weight Specific weight (kg/(m 3 ) Food Dirt and Ash Plastics Wood and Yard waste 50 30 10 10 300 500 65 125 Specific weight (kg/(m 3 ) of the MSW sample is","options":["319","217","2091","199"],"answer":"4","solution":"Given : Component Percent by weight Specific weight (kg/(m 3 ) Food Dirt and Ash Plastics Wood and Yard waste 50 30 10 10 300 500 65 125 The composition of sample, percent and specific weight is given in the table Formula of specific weight of the MSW sample is given by,"},{"id":"78620","q":"50 g of CO 2 and 25 g of CH 4 are produced from the decomposition of municipal solid waste (MSW) with a formula weight of 120 g. What is the average per capita green house gas production in a city of 1 million people with a MSW production rate of 500 ton/day?","options":["104 g/day","120 g/day","208 g/day","313 g/day"],"answer":"4","solution":""},{"id":"78621","q":"A coastal city produces municipal solid waste (MSW) with high moisture content, high organic materials, low calorific value and low inorganic materials. The most effective and sustainable option for MSW management in that city is","options":["Composting","Dumping in sea","Incineration","Landfill"],"answer":"1","solution":"Composting:- Incineration can be adopted when the calorific value of the MSW is high. Land fill can be adopted when the density of MSW is high. Since in the given MSW the quantity of inorganic material is low, its density is less. Composting can be adopted when the MSW contains high organic content. Barging the MSW into the sea is now a days generally not used and has become obsolete."},{"id":"78622","q":"A landfill is to be designed to serve a population of 200000 for a period of 25 years. The solid waste (SW) generation is 2 kg/person/day. The density of the un-compacted SW is 100kg/m 3 and a compaction ratio of 4 is suggested. The ratio of compacted fill (i.e. SW + Cover) to compacted SW is 1.5. The landfill volume (in million m 3 ) required is _____.","options":["13.6875 Millions","16.7563 Millions","19.1582 Millions","12.358 Millions"],"answer":"1","solution":"Solid waste generated per day = 2 200000 = 4000000 kg Total solid waste generated in 25 years = 40000 365 25 = 3.65 10 9 kg Compaction ratio, 4 = Volume of waste before compaction, V = 10 7 m 3 Volume of waste after compaction, V\u2019 = 10 6 m 3 = 0.5 9.125 10 6 = 4.5625 10 6 m 3 Total volume = SW + Cover = (9.125 + 4.5625) 10 6 m\u00b3 = 13.6875 million m 3"},{"id":"78623","q":"Solid waste generated from an industry contains only two components, X and Y as shown in the table below: Assuming (C 1 + C 2 ) = 100, the composite density prof the solid waste ( ) is given by","options":["(b) 100","100 ( ) (d) 100"],"answer":"1","solution":"Let density of sludge is , Assuming + = 100"},{"id":"78624","q":"The composition of a municipal solid waste sample is given below: Component Percent by Mass Moisture content (%) Energy content ( kJ/kg on as discarded basis) Food waste Paper Cardboard Plastics Garden trimmings Wood Tin Cans 20 10 10 10 40 5 5 70 4 4 1 60 20 2 2500 10000 8000 14000 3500 14000 100 The difference between the energy content of the waste sample calculated on dry basis and as discarded basis (in kJ/kg) would be ______.","options":["3870 kJ/kg","4800 kJ/kg","480 kJ/kg","48 kJ/kg"],"answer":"1","solution":"Energy on dry basis: It will be the total energy when whole mass is dry. Since in this case only 60% mass in dry. Energy corresponding to 60% drymass Energy corresponding to 100% dry mass = 9675 kJ/kg So energy as on dry basis = kJ/kg Difference = (9675 - 5805) = 3870 kJ/kg"},{"id":"78625","q":"There are 20,000 vehicles operating in a city with an average annual travel of 12,000 km per vehicle. The NO x emission rate is 2.0 g/km per vehicle. The total annual release of NO x will be","options":["4,80,000 kg","4,800 kg","480 kg","48 kg"],"answer":"1","solution":"4,80,000 kg Total no. of kms. travelled by all the vehicles = 20000 12000km = 24 10 7 km Total NO, emission = 2g / k m 24 10 7 km = 48 10 7 g = 48 10 4 kg"},{"id":"78626","q":"A waste activated sludge (WAS) is to be blended with green waste (GW). The carbon (C) and nitrogen (N) contents, per kg of WAS and GW on dry basis are given in the table. Parameter WAS GW Carbon (g) 54 360 Nitrogen (g) 10 6 The ratio of WAS to GW required (up to two decimal places) to achieved a blended C:N ratio of 20:1 on dry basis is _______.","options":["1.64: 1","2:1","53:1","3:1"],"answer":"1","solution":"Let the ratio of WAS and GW be : 1 According to question"},{"id":"78627","q":"Which document forms the basis for granting Environmental Clearance (EC)?","options":["Detailed Project Report (DPR)","Environmental Impact Assessment Report","Consent to Operate","Pollution load calculation only"],"answer":"2","solution":"Environmental Impact Assessment Report The Environmental Impact Assessment Report (EIA Report) is a critical document that forms the basis for granting Environmental Clearance (EC) for most major projects. The EIA process helps decision-makers analyze the potential environmental, social, and economic impacts of a proposed project before it is implemented. The regulatory authority (MoEF&CC or SEIAA) conducts a detailed scrutiny (appraisal) of the final EIA report, along with other documents like public hearing proceedings, to make an informed decision about granting or rejecting the clearance"},{"id":"78628","q":"Public hearing in EIA is mainly conducted by:","options":["MoEF&CC","District Collector with SPCB support","Municipal Commissioner","National Green Tribunal"],"answer":"2","solution":"District Collector with SPCB support The public hearing process for Environmental Impact Assessment (EIA) is primarily conducted by a panel that includes the District Collector (or District Magistrate/Deputy Commissioner) or their nominee, who acts as the chairperson. This panel is also assisted by a representative of the concerned State Pollution Control Board (SPCB). The main responsibility of this panel is to accurately record the proceedings, including oral and written submissions from the public, and submit a report to the relevant regulatory authority (MoEF&CC or SEIAA)"},{"id":"78629","q":"If a project site falls within 10 km of an eco-sensitive zone, EC is granted by:","options":["SEIAA only","SPCB","MoEF&CC irrespective of category","District Environment Committee"],"answer":"3","solution":"MoEF&CC irrespective of category"},{"id":"78630","q":"Which of the following projects is generally exempted from detailed EIA?","options":["Large thermal power plant","Mining project","White category industry","River valley project"],"answer":"3","solution":"White category industry White category industries are those industrial sectors which are practically non-polluting and are generally exempted from the requirements of a detailed Environmental Impact Assessment (EIA)."},{"id":"78631","q":"Post-EC compliance reports are usually submitted:","options":["Once in project lifetime","Monthly","Six-monthly","Only during inspection"],"answer":"3","solution":"Six-monthly As per the Environmental Impact Assessment (EIA) Notification, 2006, and subsequent regulations, project proponents are mandated to submit compliance reports every six months (also referred to as half-yearly reports). These reports detail the project's adherence to the conditions stipulated in the Environmental Clearance (EC) letter and are submitted to the relevant regulatory authorities, such as the Ministry of Environment, Forest and Climate Change (MoEF&CC) or the State Environmental Impact Assessment Authority (SEIAA)"},{"id":"78632","q":"Site authorization primarily checks:","options":["Market potential","Environmental suitability of location","Availability of raw material","Financial strength of promoter"],"answer":"2","solution":"Environmental suitability of location Site authorization, which is part of the overall site selection and evaluation process, primarily focuses on regulatory and compliance issues related to the physical location. A crucial aspect of this involves checking the site's suitability from a physical and environmental standpoint to ensure the proposed activities are legally permissible and safe for that specific location. Environmental suitability involves aspects like zoning compliance, potential environmental impact, stability of the soil, flood history, and proximity to prohibited zones (e.g., residential areas for certain industrial activities, defense installations, heritage zones). Authorities grant authorization or permits only after verifying these conditions are met."},{"id":"78633","q":"Which factor is most critical while approving site authorization for a solid waste facility?","options":["Distance from airport","Proximity to residential areas","Brand value of operator","Number of employees"],"answer":"2","solution":"Proximity to residential areas Proximity to residential areas is a primary concern due to potential adverse effects on human health and quality of life. Regulations and public opposition often center around minimizing these impacts, making the location relative to residential areas a critical determinant in the approval process."},{"id":"78634","q":"Site authorization for waste processing facilities is generally issued under:","options":["Water Act, 1974","Solid Waste Management Rules, 2016","Air Act, 1981","Forest Act"],"answer":"2","solution":"Solid Waste Management Rules, 2016"},{"id":"78635","q":"Which authority grants site authorization in Bihar for waste management facilities?","options":["Urban Local Body","District Magistrate","Bihar State Pollution Control Board","Municipal Health Officer"],"answer":"3","solution":"Bihar State Pollution Control Board"},{"id":"78636","q":"Consent to Establish ensures that:","options":["Pollution is eliminated","Pollution control systems are planned before construction","Production has started","Workers are trained"],"answer":"2","solution":"Pollution control systems are planned before construction The Consent to Establish (CTE) is a mandatory No Objection Certificate (NOC) issued by the State Pollution Control Board (SPCB) or Pollution Control Committee (PCC) that industries and project developers must obtain before the actual commencement of construction or installation activities. The primary purpose is to ensure that necessary arrangements and facilities for the treatment and control of air and water pollution (such as effluent treatment facilities, air pollution control equipment, and waste management systems) are planned and incorporated into the project design from the outset, before the plant is even built or commissioned. This proactive approach ensures environmental safeguards are in place early in the development process."},{"id":"78637","q":"CTE is granted under which Acts?","options":["Environment Protection Act only","Water Act and Air Act","Forest Conservation Act","Municipal Act"],"answer":"2","solution":"Water Act and Air Act CTE (Consent to Establish) for industries is primarily governed by provisions under the Water (Prevention and Control of Pollution) Act, 1974, the Air (Prevention and Control of Pollution) Act, 1981, and further umbrella regulations under the Environment (Protection) Act, 1986 (EPA), which mandates these consents for preventing pollution, making option B the most encompassing and correct answer in the Indian context. Here's why: Water Act & Air Act: These laws specifically empower State Pollution Control Boards (SPCBs) and Central Pollution Control Board (CPCB) to issue Consents to Establish (CTE) and Operate (CTO) to control and prevent water and air pollution from industries. Environment (Protection) Act, 1986 (EPA): This is an umbrella Act that provides the framework for environmental regulations, including the basis for the Pollution Control Boards and their powers to enforce consents, effectively covering the other acts' requirements. Therefore, the best answer is (b) Water Act and Air Act, as these are the specific acts that mandate and define the process for CTE/CTO, within the broader framework of the EPA"},{"id":"78638","q":"An industry that starts construction without CTE is liable for:","options":["Warning only","Environmental compensation and legal action","No penalty","Tax penalty only"],"answer":"2","solution":"Environmental compensation and legal action An industry that starts construction without first obtaining a Consent to Establish (CTE) from the concerned State Pollution Control Board (SPCB) is in violation of environmental laws, specifically the Water (Prevention and Control of Pollution) Act, 1974 and the Air (Prevention and Control of Pollution) Act, 1981. Authorities, such as the National Green Tribunal (NGT) and SPCBs, enforce the \"Polluter Pays\" principle, which makes the defaulting industry liable for: Environmental compensation: This compensation is calculated based on the period and severity of the violation, aiming to recover the cost of environmental damage and restoration. Legal action: This can include directions for closure of the unit, disconnection of power/water supply, and prosecution under the relevant environmental protection acts."},{"id":"78639","q":"Which document is not mandatory for CTE application?","options":["Site plan","Manufacturing process flow diagram","Proof of CTO","Proposed pollution control measures"],"answer":"3","solution":"Proof of CTO (Consent to Operate) is not mandatory for a CTE (Consent to Establish) application because CTE is a prerequisite for CTO. One must obtain the Consent to Establish before construction and operation can begin; the Consent to Operate is applied for and obtained after the establishment of the industrial unit and before commercial production starts"},{"id":"78640","q":"CTO confirms that:","options":["Project proposal is not acceptable","Pollution control devices are installed and functional","Land ownership is clear","EC is not required"],"answer":"2","solution":"Pollution control devices are installed and functional"},{"id":"78641","q":"CTO is generally granted after:","options":["Land purchase","Completion of construction","Installation of pollution control systems","Public hearing"],"answer":"2","solution":"CTO (Consent to Operate) is a mandatory environmental authorization granted by the State Pollution Control Board (SPCB) in India to industrial units after they have completed construction and installed all required pollution control systems. It certifies that the facility is ready to commence commercial operations in compliance with prescribed environmental standards under the Water (Prevention and Control of Pollution) Act, 1974, and the Air (Prevention and Control of Pollution) Act, 1981. The State Pollution Control Board conducts a site inspection to verify compliance with the conditions set during the initial Consent to Establish (CTE) phase before issuing the CTO"}];
let idx=0, answers={}, timerSec=65*60, timerInt=null;

function render(){
  const q=DATA[idx];
  if(!q){document.getElementById('qText').textContent='No data.';return;}
  document.getElementById('qNum').textContent=idx+1;
  document.getElementById('qTotal').textContent=DATA.length;
  document.getElementById('qText').textContent=q.q;
  document.getElementById('opts').innerHTML=q.options.map((o,i)=>
    `<div class="option ${answers[idx]==(i+1)?'selected':''}" onclick="select(${i+1})">${String.fromCharCode(65+i)}. ${o}</div>`
  ).join('');
}
window.select=o=>{answers[idx]=o; render();};
window.prev=()=>{if(idx>0){idx--; render();}};
window.next=()=>{if(idx<DATA.length-1){idx++; render();}};

function submitTest(){
  clearInterval(timerInt);
  let c=0; for(let i=0;i<DATA.length;i++){if(answers[i]==DATA[i].answer)c++;}
  const pct=Math.round(c/DATA.length*100)||0;
  document.getElementById('qCard').classList.add('hidden');
  document.getElementById('resCard').classList.remove('hidden');
  document.getElementById('score').textContent=pct+'%';
  document.getElementById('detail').innerHTML='<b>'+c+'/'+DATA.length+'</b> correct';
}

function tick(){timerSec--; document.getElementById('timer').textContent=Math.floor(timerSec/60)+':'+String(timerSec%60).padStart(2,'0'); document.getElementById('bar').style.width=(timerSec/(65*60)*100)+'%'; if(timerSec<=0){clearInterval(timerInt); submitTest();}}

render(); timerInt=setInterval(tick,1000);
</script>
</body></html>
