<!DOCTYPE html>
<html lang="hi">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>ASWMO — T39 Full Test-Tech</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
:root{--bg:#0b0c15;--surface:#12142a;--text:#e4e6f0;--accent:#00e8a0;--gold:#f0c040;--danger:#ff4d6d;--border:rgba(255,255,255,.08);--muted:#8a8fa8;}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:Inter,system-ui,sans-serif;background:radial-gradient(1000px 700px at 20% 0%,#00e8a011,transparent),var(--bg);color:var(--text);min-height:100vh;line-height:1.55;}
.container{max-width:900px;margin:2rem auto;padding:0 1.2rem;}
h1{font-size:1.6rem;font-weight:700;background:linear-gradient(135deg,#fff,var(--accent));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.card{background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:16px;padding:1.5rem;margin-bottom:1rem;}
.question{font-size:1.05rem;font-weight:500;margin-bottom:.8rem;line-height:1.35;}
.options{display:grid;gap:.5rem;}
.option{padding:.7rem 1rem;background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:10px;cursor:pointer;font-size:.92rem;transition:.2s;}
.option:hover,.option.selected{border-color:var(--accent);background:rgba(0,232,160,.12);font-weight:600;}
.timer{font-family:monospace;font-weight:700;font-size:2rem;color:var(--accent);}
button{background:linear-gradient(135deg,var(--accent),#00b87e);color:#0a0c12;border:none;padding:.7rem 1.4rem;border-radius:10px;font-weight:700;cursor:pointer;}
.hidden{display:none!important}</style>
</head>
<body>
<div class="container">
<header><h1 id="ptitle">ASWMO — T39 Full Test-Tech</h1></header>

<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;">
<div><div class="timer" id="timer">65:00</div><div style="font-size:.75rem;color:var(--muted);">Time Remaining</div></div>
<button onclick="submitTest()">Submit Test</button></div>
<div style="height:6px;background:rgba(255,255,255,.1);border-radius:3px;overflow:hidden;margin-top:.5rem;"><div id="bar" style="height:100%;width:100%;background:linear-gradient(90deg,var(--accent),#00b87e);transition:width 1s linear;"></div></div></div>

<div class="card" id="qCard">
<div style="font-size:.8rem;color:var(--muted);margin-bottom:.4rem;">Question <span id="qNum">1</span> / <span id="qTotal">?</span></div>
<div class="question" id="qText">Loading...</div>
<div class="options" id="opts"></div>
<div style="margin-top:1rem;display:flex;gap:.5rem;flex-wrap:wrap;">
<button onclick="prev()">&#8592; Prev</button><button onclick="next()">Next &#8594;</button><button onclick="submitTest()">Submit</button></div>
</div>

<div class="card hidden" id="resCard" style="text-align:center;padding:2rem;">
<h2 style="color:var(--gold);font-size:2rem;">Test Completed!</h2>
<div id="score" style="font-size:3rem;font-weight:800;color:var(--accent);margin:1rem 0;"></div>
<div id="detail" style="color:var(--muted);font-size:.95rem;"></div>
<div style="margin-top:1.5rem;"><a href="index.html" style="color:var(--accent);font-weight:600;">&#8592; Back</a></div>
</div>
</div>

<script>
const DATA=[{"id":"81079","q":"In solid waste management, the \"Break-Even Point\" analysis for a Transfer Station compares:","options":["The cost of landfilling versus the cost of incineration","The time taken for waste collection versus waste processing","The cost of direct haul to the disposal site versus the cost of using a transfer station and large haul vehicles","The revenue from recycling versus the cost of waste collection"],"answer":"3"},{"id":"81080","q":"Under the Plastic Waste Management Rules, 2016 (and amendments), \"Compostable Plastics\" must conform to which Indian Standard?","options":["IS 14534","IS 17088","IS 10500","IS 2212"],"answer":"2"},{"id":"81081","q":"A 5 mL sample of raw sewage is diluted to 500 mL with aerated dilution water. The initial Dissolved Oxygen (DO) is 8.0 mg/L and the DO after 5 days of incubation at 20°C is 3.0 mg/L. What is the BOD5 of the sewage?","options":["250 mg/L","500 mg/L","400 mg/L","15 mg/L"],"answer":"2"},{"id":"81082","q":"The \"Streeter-Phelps Equation\" (DO Sag Curve) is used to mathematically model:","options":["The settling of discrete particles in a clarifier","The dispersion of air pollutants from a smokestack","The depletion and recovery of Dissolved Oxygen in a river receiving biodegradable waste","The rate of methane production in a landfill"],"answer":"3"},{"id":"81083","q":"According to the EIA Notification 2006, the \"Prior Environmental Clearance\" compliance reports must be submitted by the project proponent to the regulatory authority:","options":["Monthly","Quarterly","Half-yearly (every 6 months)","Annually"],"answer":"3"},{"id":"81084","q":"Which of the following diseases is primarily associated with chronic exposure to \"Arsenic\" contaminated water?","options":["Itai-Itai Disease","Blackfoot Disease","Minamata Disease","Blue Baby Syndrome"],"answer":"2"},{"id":"81085","q":"Under the Hazardous Waste Management Rules, 2016, \"Form 3\" is used for:","options":["Application for authorization to handle hazardous waste","Format for maintaining records of hazardous waste handled by the generator/operator","The manifest document for transport","Annual returns submitted to the SPCB"],"answer":"2"},{"id":"81086","q":"In an Activated Sludge Process (ASP), the Food-to-Microorganism (F/M) ratio is calculated as:","options":["kg BOD applied / kg MLSS per day","kg MLSS / kg BOD applied / day","Volume of Aeration Tank / Flow Rate","Total Solids / Volatile Solids"],"answer":"1"},{"id":"81087","q":"An industry emits a noise level of 80 dB. A second identical industry is set up next to it, also emitting 80 dB. What is the total resultant noise level?","options":["160 dB","86 dB","83 dB","80 dB"],"answer":"3"},{"id":"81088","q":"The \"NADEP Method\" of composting is characterized by:","options":["Deep trench anaerobic digestion","Aerobic composting in a brick structure with holes for aeration, utilizing agricultural waste and cow dung","Vermicomposting using specific earthworm species","Mechanical in-vessel high-rate composting"],"answer":"2"},{"id":"81089","q":"In air pollution control, a \"Cyclone Separator\" works primarily on the principle of:","options":["Electrostatic attraction","Centrifugal force","Chemical scrubbing","Brownian motion"],"answer":"2"},{"id":"81090","q":"According to the Noise Pollution (Regulation and Control) Rules, 2000, the permissible noise limit for a \"Commercial Area\" during the Night time (10:00 PM to 6:00 AM) is:","options":["45 dB(A)","50 dB(A)","55 dB(A)","65 dB(A)"],"answer":"3"},{"id":"81091","q":"A town has a population of 100,000. If the water supply rate is 150 LPCD and 80% of it becomes wastewater, what is the daily wastewater flow (in MLD)?","options":["12 MLD","15 MLD","120 MLD","80 MLD"],"answer":"1"},{"id":"81092","q":"The \"Stockholm Convention\" is a global treaty specifically designed to protect human health and the environment from:","options":["Ozone Depleting Substances (ODS)","Persistent Organic Pollutants (POPs)","Transboundary movement of hazardous waste","Mercury emissions"],"answer":"2"},{"id":"81093","q":"In wastewater treatment, the \"Optimum pH\" for coagulation using Alum (Aluminum Sulfate) is generally in the range of:","options":["4.0 - 5.0","6.5 - 8.5","9.0 - 10.5","11.0 - 12.0"],"answer":"2"},{"id":"81094","q":"\"Microplastics\" are formally defined as plastic fragments, pellets, or fibers with a length of less than:","options":["1 mm","5 mm","10 mm","100 micrometers"],"answer":"2"},{"id":"81095","q":"Under the Bio-Medical Waste Management Rules, 2016, \"Expired or Discarded Medicines\" (except cytotoxics) should be disposed of in which colored container?","options":["Yellow","Red","White","Blue"],"answer":"1"},{"id":"81096","q":"The \"Gaussian Plume Model\" used in air quality dispersion studies assumes that the pollutant concentrations follow a normal (Gaussian) distribution in which directions?","options":["Downwind (x) and Crosswind (y)","Crosswind (y) and Vertical (z)","Downwind (x) and Vertical (z)","Only Vertical (z)"],"answer":"2"},{"id":"81097","q":"A solid waste sample has a total mass of 200 kg. After oven drying at 105°C, the mass is reduced to 120 kg. What is the moisture content on a dry-weight basis?","options":["40%","66.67%","60%","80%"],"answer":"2"},{"id":"81098","q":"\"Type II Settling\" in wastewater engineering refers to the settling of:","options":["Discrete, non-flocculating particles","Flocculent particles in a dilute suspension where they coalesce and increase in mass/settling velocity","Zone or hindered settling where particles settle as a mass","Compression settling of sludge at the bottom of a clarifier"],"answer":"2"},{"id":"81099","q":"Which section of the Water (Prevention and Control of Pollution) Act, 1974 deals with the power of the State Board to obtain information?","options":["Section 20","Section 25","Section 33A","Section 41"],"answer":"1"},{"id":"81100","q":"Which of the following statements about Strategic Environmental Assessment (SEA) are correct? (I) SEA is applied to policies, plans, and programs rather than individual projects. (II) SEA is mandatory under the Environment (Protection) Act, 1986. (III) SEA is proactive and done early in decision-making. (IV) SEA always replaces EIA.","options":["I & IV Only","I, III, & IV","I & III Only","I, II, & III"],"answer":"3"},{"id":"81101","q":"The primary purpose of a \"Drop Manhole\" in a sewerage system is to:","options":["Connect branch sewers to main sewers at the same invert level","Measure the velocity of sewage","Connect a high-level branch sewer to a low-level main sewer without causing scour","Provide ventilation for sewer gases"],"answer":"3"},{"id":"81102","q":"According to the C&D Waste Management Rules, 2016, a facility is required for the processing of Construction and Demolition waste. The final processed products (aggregates) must meet the standards specified by:","options":["Central Pollution Control Board (CPCB)","Bureau of Indian Standards (BIS) and Indian Roads Congress (IRC)","National Green Tribunal (NGT)","State Municipal Corporations"],"answer":"2"},{"id":"81103","q":"What is the theoretical volume of methane (CH4) produced at standard temperature and pressure (STP) per kg of ultimate BOD (L0) stabilized under anaerobic conditions?","options":["0.20 m³","0.35 m³","0.50 m³","1.00 m³"],"answer":"2"},{"id":"81104","q":"Which of the following is considered an \"In-situ\" bioremediation technique for hazardous waste sites?","options":["Excavation and Landfarming","Bioventing","Composting in windrows","Slurry phase bioreactor"],"answer":"2"},{"id":"81105","q":"In the context of solid waste collection, \"SCS\" stands for:","options":["Standard Collection System","Stationary Container System","Sanitary Compartment System","Shredded Combustible Solid"],"answer":"2"},{"id":"81106","q":"The \"Air-to-Cloth Ratio\" is a critical design parameter for which air pollution control device?","options":["Wet Scrubber","Electrostatic Precipitator","Baghouse Filter (Fabric Filter)","Gravity Settling Chamber"],"answer":"3"},{"id":"81107","q":"According to the EIA Notification 2006, the \"Scoping\" stage determines the Terms of Reference (TOR). The expert appraisal committee must communicate the TOR to the applicant within:","options":["15 days","30 days","60 days","90 days"],"answer":"3"},{"id":"81108","q":"\"Phosphorus\" in municipal wastewater is typically removed chemically by precipitating it with:","options":["Sodium Chloride","Alum, Ferric Chloride, or Lime","Chlorine Gas","Activated Carbon"],"answer":"2"},{"id":"81109","q":"A trickling filter has an influent BOD of 200 mg/L and an effluent BOD of 40 mg/L. What is the BOD removal efficiency of the filter?","options":["70%","75%","80%","85%"],"answer":"3"},{"id":"81110","q":"The \"National Green Tribunal\" (NGT) consists of a full-time Chairperson and:","options":["At least 5 but not more than 10 Judicial and Expert Members","At least 10 but not more than 20 Judicial and Expert Members","Exactly 15 Judicial Members","No Expert Members, only Judicial Members"],"answer":"2"},{"id":"81111","q":"In a water quality test, the presence of \"Ammonia Nitrogen\" (Free Ammonia) indicates:","options":["Old and stabilized organic pollution","Recent and active organic pollution","High dissolved oxygen levels","Industrial heavy metal contamination"],"answer":"2"},{"id":"81112","q":"Which technology uses an electric arc to generate temperatures upwards of 3000°C to melt hazardous waste and biomedical waste into a glassy slag?","options":["Autoclaving","Plasma Gasification / Plasma Arc Technology","Rotary Kiln Incineration","Deep Well Injection"],"answer":"2"},{"id":"81113","q":"Under the Battery Waste Management Rules, 2022, the rules apply to which types of batteries?","options":["Only Lead-Acid Batteries","Only Lithium-Ion Batteries","All types of batteries (Portable, EV, Automotive, Industrial) regardless of chemistry","Only disposable alkaline batteries"],"answer":"3"},{"id":"81114","q":"\"Crown Corrosion\" in concrete sewer pipes is primarily caused by:","options":["Methane (CH 4 )","Hydrogen Sulfide (H 2 S) oxidizing to Sulfuric Acid (H 2 SO 4 )","Carbon Dioxide (CO 2 ) forming Carbonic Acid","Direct abrasion by grit particles"],"answer":"2"},{"id":"81115","q":"The dry weather flow of a sanitary sewer is 100 L/s. If the peaking factor is 3, what is the design peak flow?","options":["100 L/s","200 L/s","300 L/s","400 L/s"],"answer":"3"},{"id":"81116","q":"In solid waste compaction, if the initial volume of waste is 10 m³ and the final compacted volume is 2 m³, the \"Compaction Ratio\" is:","options":["0.2","2.0","5.0","8.0"],"answer":"3"},{"id":"81117","q":"Which of the following greenhouse gases has the highest Global Warming Potential (GWP) over a 100-year period?","options":["Carbon Dioxide (CO 2 )","Methane (CH 4 )","Nitrous Oxide (N 2 O)","Sulfur Hexafluoride (SF 6 )"],"answer":"4"},{"id":"81118","q":"The \"ISO 14001\" Environmental Management System framework is fundamentally based on which management model?","options":["Six Sigma","PDCA (Plan-Do-Check-Act) Cycle","Just-In-Time (JIT)","Total Quality Management (TQM)"],"answer":"2"},{"id":"81119","q":"As per the E-Waste (Management) Rules, 2016, fluorescent and other mercury-containing lamps fall under the purview of E-Waste and are assigned the waste code:","options":["CEEW1","CEEW2","CEEW3","CEEW5"],"answer":"4"},{"id":"81120","q":"By the \"Geometric Increase Method\", if the population of a city was 10,000 in 2000 and 12,000 in 2010 (a 20% growth rate per decade), what is the forecasted population for 2020?","options":["14,000","14,400","15,000","16,000"],"answer":"2"},{"id":"81121","q":"Which component of an Electrostatic Precipitator (ESP) is periodically vibrated or hammered to dislodge the collected dust?","options":["Discharge Electrodes","Rapping Mechanism","Hopper","Gas Flow Distribution Baffles"],"answer":"2"},{"id":"81122","q":"\"Dulong's Formula\" is used in Solid Waste Management to estimate the:","options":["Total generation rate of municipal solid waste","Heating value (Calorific value) of the waste based on its elemental composition (C, H, O, S)","Moisture content of the waste","Landfill settlement rate"],"answer":"2"},{"id":"81123","q":"In EIA, the \"Leopold Matrix\" is a tool used for:","options":["Public hearing documentation","Economic cost-benefit analysis","Identifying and assessing the impact of project actions on various environmental characteristics","Designing the pollution control equipment"],"answer":"3"},{"id":"81124","q":"\"Sphaerotilus natans\" is an organism most commonly associated with which operational problem in wastewater treatment?","options":["Nitrification failure","Foaming in anaerobic digesters","Sludge bulking in secondary clarifiers","Membrane fouling in RO"],"answer":"3"},{"id":"81125","q":"The \"Extended Aeration Process\" (a variation of ASP) is designed with a:","options":["Low HRT and High F/M ratio","High HRT and Low F/M ratio (causing endogenous respiration)","High HRT and High F/M ratio","Zero sludge return"],"answer":"2"},{"id":"81126","q":"Which statutory body in India enforces the provisions of the Environment (Protection) Act, 1986 regarding the closure, prohibition, or regulation of any industry?","options":["National Green Tribunal (NGT)","Central Government (often delegated to CPCB/SPCBs)","Supreme Court of India","District Magistrate"],"answer":"2"},{"id":"81127","q":"A sewer pipe has a diameter of 1.0 m and is flowing half-full. The wetted perimeter (P) is:","options":["m","0.5 m","0.25 m","2 m"],"answer":"2"},{"id":"81128","q":"In Biomedical waste, standard \"Sharps\" (like needles, scalpels, and blades) are disposed of in:","options":["Puncture-proof, leak-proof, White Translucent containers","Red Plastic Bags","Yellow Plastic Bags","Blue Cardboard Boxes"],"answer":"1"},{"id":"81129","q":"The \"Proportional Flow Weir\" (Sutro Weir) is specifically used in which wastewater treatment unit to maintain a constant horizontal velocity?","options":["Primary Sedimentation Tank","Grit Chamber","Aeration Tank","Sludge Thickener"],"answer":"2"},{"id":"81130","q":"\"Fly Ash\" utilization is mandated for the manufacturing of building materials within what radius of a coal/lignite-based thermal power plant?","options":["50 km","100 km","300 km","500 km"],"answer":"3"},{"id":"81131","q":"What does the acronym \"TSDF\" stand for in Hazardous Waste Management?","options":["Toxic Substances Disposal Facility","Treatment, Storage, and Disposal Facility","Transport, Sorting, and Dumping Facility","Thermal Stabilization and Destruction Facility"],"answer":"2"},{"id":"81132","q":"Which phase of a landfill's life cycle is characterized by the rapid depletion of oxygen and the production of CO 2 and volatile fatty acids?","options":["Initial Aerobic Phase","Acid Phase (Acidogenesis)","Initial Methanogenic Phase","Stable Methanogenic Phase"],"answer":"2"},{"id":"81133","q":"Under the Water (Prevention and Control of Pollution) Act, 1974, the term \"Trade Effluent\" means:","options":["Any liquid, gaseous, or solid substance discharged from any premises used for carrying on any industry, operation, or process","Domestic sewage from trade centers","Rainwater runoff from markets","Only hazardous chemicals"],"answer":"1"},{"id":"81134","q":"\"Blackfoot Disease\" is caused by chronic exposure to which heavy metal in drinking water?","options":["Lead","Arsenic","Cadmium","Mercury"],"answer":"2"},{"id":"81135","q":"For a municipal solid waste sample, if the Wet Weight is 50 kg and the Dry Weight is 30 kg, the moisture content on a Wet-Weight basis is:","options":["40%","60%","66.6%","20%"],"answer":"1"},{"id":"81136","q":"\"Bioventing\" is a technique used primarily for:","options":["Treating groundwater in-situ","Stimulating aerobic biodegradation of soil contaminants in-situ by providing oxygen to the unsaturated zone","Extracting hazardous gases from a landfill","Pumping liquid waste into deep wells"],"answer":"2"},{"id":"81137","q":"The \"Swachh Bharat Mission (Urban) 2.0\" places a strong emphasis on achieving \"Garbage Free City\" (GFC) star ratings. A 7-Star GFC rating implies:","options":["50% door-to-door collection","100% source segregation, 100% door-to-door collection, and zero waste to landfill (complete processing)","Only sweeping of all commercial areas twice a day","Eliminating only plastic waste"],"answer":"2"},{"id":"81138","q":"According to standard IS 10500:2012 for drinking water, what is the acceptable limit for \"Total Dissolved Solids\" (TDS) in the absence of an alternate source?","options":["500 mg/L","1000 mg/L","2000 mg/L","3000 mg/L"],"answer":"3"},{"id":"81139","q":"In solid waste processing, a \"Trommel\" is used for:","options":["Magnetic separation of ferrous metals","Size separation (screening) using a rotating cylindrical sieve","Shredding and size reduction of plastics","Baling and compaction of paper"],"answer":"2"},{"id":"81140","q":"The legal doctrine holding that the state is the trustee of all natural resources (like rivers, forests, and air) which are meant for public use, is known as:","options":["Polluter Pays Principle","Precautionary Principle","Public Trust Doctrine","Absolute Liability Doctrine"],"answer":"3"},{"id":"81141","q":"A \"Sludge Digester\" typically operates optimally in the mesophilic temperature range of:","options":["10°C - 20°C","30°C - 38°C","50°C - 60°C","70°C - 80°C"],"answer":"2"},{"id":"81142","q":"\"Phytostabilization\" in bioremediation involves:","options":["Plants absorbing metals and accumulating them in leaves","Plants converting organic pollutants into a gaseous state","Plants immobilizing contaminants in the soil and groundwater through absorption and accumulation by roots","Breaking down pollutants via microbes in the leaves"],"answer":"3"},{"id":"81143","q":"Under the Solid Waste Management Rules, 2016, \"Domestic Hazardous Waste\" includes:","options":["Only kitchen organic waste","E-waste, batteries, and old medicines generated at the household level","Industrial effluents discharged into municipal sewers","Construction debris from household renovations"],"answer":"2"}];
let idx=0, answers={}, timerSec=3900, timerInt=null;

function render(){
  const q=DATA[idx];
  if(!q){document.getElementById('qText').textContent='No data.';return;}
  document.getElementById('qNum').textContent=idx+1;
  document.getElementById('qTotal').textContent=DATA.length;
  document.getElementById('qText').textContent=q.q;
  document.getElementById('opts').innerHTML=q.options.map((o,i)=>
    `<div class="option ${answers[idx]==(i+1)?'selected':''}" onclick="select(${i+1})">${String.fromCharCode(65+i)}. ${o}</div>`
  ).join('');
}
window.select=o=>{answers[idx]=o; render();};
window.prev=()=>{if(idx>0){idx--; render();}};
window.next=()=>{if(idx<DATA.length-1){idx++; render();}};

function submitTest(){
  clearInterval(timerInt);
  let c=0; for(let i=0;i<DATA.length;i++){if(answers[i]==DATA[i].answer)c++;}
  const pct=Math.round(c/DATA.length*100)||0;
  document.getElementById('qCard').classList.add('hidden');
  document.getElementById('resCard').classList.remove('hidden');
  document.getElementById('score').textContent=pct+'%';
  document.getElementById('detail').innerHTML='<b>'+c+'/'+DATA.length+'</b> correct';
}

function tick(){timerSec--; document.getElementById('timer').textContent=Math.floor(timerSec/60)+':'+String(timerSec%60).padStart(2,'0'); document.getElementById('bar').style.width=(timerSec/3900*100)+'%'; if(timerSec<=0){clearInterval(timerInt); submitTest();}}

render(); timerInt=setInterval(tick,1000);
</script>
</body></html>
