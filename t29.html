<!DOCTYPE html>
<html lang="hi">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>ASWMO — T29 Full Test-Tech</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
:root{--bg:#0b0c15;--surface:#12142a;--text:#e4e6f0;--accent:#00e8a0;--gold:#f0c040;--danger:#ff4d6d;--border:rgba(255,255,255,.08);--muted:#8a8fa8;}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:Inter,system-ui,sans-serif;background:radial-gradient(1000px 700px at 20% 0%,#00e8a011,transparent),var(--bg);color:var(--text);min-height:100vh;line-height:1.55;}
.container{max-width:900px;margin:2rem auto;padding:0 1.2rem;}
h1{font-size:1.6rem;font-weight:700;background:linear-gradient(135deg,#fff,var(--accent));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.card{background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:16px;padding:1.5rem;margin-bottom:1rem;}
.question{font-size:1.05rem;font-weight:500;margin-bottom:.8rem;line-height:1.35;}
.options{display:grid;gap:.5rem;}
.option{padding:.7rem 1rem;background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:10px;cursor:pointer;font-size:.92rem;transition:.2s;}
.option:hover,.option.selected{border-color:var(--accent);background:rgba(0,232,160,.12);font-weight:600;}
.timer{font-family:monospace;font-weight:700;font-size:2rem;color:var(--accent);}
button{background:linear-gradient(135deg,var(--accent),#00b87e);color:#0a0c12;border:none;padding:.7rem 1.4rem;border-radius:10px;font-weight:700;cursor:pointer;}
.hidden{display:none!important}</style>
</head>
<body>
<div class="container">
<header><h1 id="ptitle">ASWMO — T29 Full Test-Tech</h1></header>

<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;">
<div><div class="timer" id="timer">65:00</div><div style="font-size:.75rem;color:var(--muted);">Time Remaining</div></div>
<button onclick="submitTest()">Submit Test</button></div>
<div style="height:6px;background:rgba(255,255,255,.1);border-radius:3px;overflow:hidden;margin-top:.5rem;"><div id="bar" style="height:100%;width:100%;background:linear-gradient(90deg,var(--accent),#00b87e);transition:width 1s linear;"></div></div></div>

<div class="card" id="qCard">
<div style="font-size:.8rem;color:var(--muted);margin-bottom:.4rem;">Question <span id="qNum">1</span> / <span id="qTotal">?</span></div>
<div class="question" id="qText">Loading...</div>
<div class="options" id="opts"></div>
<div style="margin-top:1rem;display:flex;gap:.5rem;flex-wrap:wrap;">
<button onclick="prev()">&#8592; Prev</button><button onclick="next()">Next &#8594;</button><button onclick="submitTest()">Submit</button></div>
</div>

<div class="card hidden" id="resCard" style="text-align:center;padding:2rem;">
<h2 style="color:var(--gold);font-size:2rem;">Test Completed!</h2>
<div id="score" style="font-size:3rem;font-weight:800;color:var(--accent);margin:1rem 0;"></div>
<div id="detail" style="color:var(--muted);font-size:.95rem;"></div>
<div style="margin-top:1.5rem;"><a href="index.html" style="color:var(--accent);font-weight:600;">&#8592; Back</a></div>
</div>
</div>

espectively. Which of the following statement(s) is/are correct?","options":["MCf > MCp > MCg","ECp > ECf > ECg","MCf < MCP < MCg","ECpp < ECf < ECg"],"answer":"1"},{"id":"78582","q":"To design an optimum municipal solid waste collection route, which of the following is/are NOT desired:","options":["Collection vehicle should not travel twice down the same street in a day.","Waste collection on congested roads should not occur during rush hours in morning or evening.","Collection should occur in the uphill direction.","The last collection point on a route should be as close as possible to the waste disposal facility."],"answer":"3"},{"id":"78583","q":"Two biodegradable components of municipal solid waste are","options":["plastics & wood","cardboard & glass","leather and tin cans","food waste and garden trimming"],"answer":"4"},{"id":"78584","q":"Determine the correctness or otherwise of the following assertion [a] and the Reason [r]. Assertion [a]: One of the best ways to reduce the amount of solid wastes is to reduce the consumption of raw materials. Reason [r]: Solid wastes are seldom generated when raw materials are converted to goods for consumption.","options":["Both [a] and [r] are true and [r] is the correct reason for [a]","Both [a] and [r] are true but [r] is not the correct reason for [a]","[a] is true but [r] is false","Both [a] and [r] are false."],"answer":"3"},{"id":"78585","q":"In a town, garbage is produced at the rate of","options":["150 gm","800 gm","450 gm","600 gm per head per day"],"answer":"3"},{"id":"78586","q":"The rate of deoxygeneration L D in a river may be expressed as","options":["L D = -K.L O e- kt","L D = L O e- kt","L D =","L D ="],"answer":"1"},{"id":"78587","q":"During sewer cleaning the workers are exposed to hazards primarily due to","options":["presence of methane","absence of oxygen","hazardous chemicals","slippery floors of the manholes"],"answer":"1"},{"id":"78588","q":"Disappearance of pink colour of water from a well due to addition of KMnO4 indicates that water contained","options":["Acidity","Alkalinity","Turbidity","Organic matter"],"answer":"4"},{"id":"78589","q":"Which of the following tests employ ferroin indicator?","options":["Iron","Fluoride","Chemical oxygen demand","Nitrate nitrogen"],"answer":"3"},{"id":"78590","q":"If a sewer carrying a discharge of 3 cumec outfalls into a river having a discharge of 10 cumec and DO equal to 9.1 mg/L, the resultant DO of the mix is","options":["7 mg/L","5 mg/L","6 mg/L","8 mg/L"],"answer":"1"},{"id":"78591","q":"Non-disposal of solid waste may cause the spread of","options":["malaria","rodent related plague","typhoid","dysentery"],"answer":"2"},{"id":"78592","q":"Method to prevent 'sewage sickness' is","options":["Rotation of crop","Pretreatment of sewage","Shallow depth application","All of the above"],"answer":"4"},{"id":"78593","q":"The ultimate BOD value of a waste:","options":["Remains the same at all temperatures","Decreases with temperature","Increase with temperature","Doubles with every 10° C rise in temperature"],"answer":"1"},{"id":"78594","q":"A solution has 100 mg/L NH 3 and 100 mg/L glucose. Calculate theoretical oxygen demand of this solution?","options":["483.14 mg/L","106.67 mg/L","400 mg/L","350 mg/L"],"answer":"1"},{"id":"78595","q":"The dominating microorganisms in an activated sludge process reactor are:","options":["Aerobic heterotrophs","Anaerobic heterotrophs","Autotrophs","Phototrophs"],"answer":"1"},{"id":"78596","q":"In a sludge digestion tank, if the moisture content of sludge is reduced from 90% to 80% then the percentage decrease in the volume of sludge is","options":["5%","10%","25%","50%"],"answer":"4"},{"id":"78597","q":"As per the Solid Waste Management Rules, 2016, the landfill site shall be (i) 100 meter away from river. (ii) 200 meter away from a pond. (iii) 200 meter away from Highways, Habitations, Public Parks and water supply wells. (iv) 20 km away from Airports or Airbase.","options":["(i) and (ii)","(i) and (iii)","(i), (ii) and (iii)","(i), (ii), (iii) and (iv)"],"answer":"4"},{"id":"78598","q":"In order to design waste water disposal system for a locality the important information to be collected is","options":["record of population and its change","water consumption rate and sewage flow","hydrological data","all of these"],"answer":"4"},{"id":"78599","q":"Say a raw waste water sample from AA WWTP has 5-day BOD equals to 2000 mg/L (reaction constant k = 0.23/day at 20 0 C). Calculate value of ultimate BOD?","options":["2826 mg/L","2296 mg/L","2000 mg/L","2926 mg/L"],"answer":"4"},{"id":"78600","q":"For discharging sewage and industrial effuents into stream, 5 day BOD at 20 0 C should not exceed","options":["30 mg/L","50 mg/L","100 mg/L","200 mg/L"],"answer":"1"},{"id":"78601","q":"Which of the following is an attached growth process used for treating waste water?","options":["Rotating biological contactors","Aerated lagoons","Activated sludge process","Sludge digestion system"],"answer":"1"},{"id":"78602","q":"The growth of algae is useful in","options":["sedimentation tank","slow sand filter","oxidation pond","sludge digestion tank"],"answer":"3"},{"id":"78603","q":"Activated sludge process is an-","options":["Aerobic attached growth system","Anaerobic attached growth system","Anaerobic suspended growth system","Aerobic suspended system"],"answer":"4"},{"id":"78604","q":"Imhoff cone is employed to determine","options":["suspended solids","volatile solids","settleable solids","filterable solids"],"answer":"3"},{"id":"78605","q":"A grit chamber of dimensions 12.0 m × 1.50 m × 0.80 m liquid depth has a flow of 720 m³/hr. Its surface loading rate and detention time are respectively","options":["4000 m³/hr/m² and 1.2 minute","40000 Lph/m² and 40 minute","40 m³/hr/m² / and 12 minute","4000 Lph/m² and 1.2 minute"],"answer":"3"},{"id":"78606","q":"Which type of equalization tank is mainly useful in assisting self neutralization or evening out of fluctuating concentrations, and not for balancing of flows?","options":["Flow through type","Intermittent flow type","Variable inflow/constant discharge type","Variable discharge/constant inflow type"],"answer":"1"},{"id":"78607","q":"Activated sludge is the","options":["aerated sludge in the aeration unit","sludge settled in the humus tank","sludge in the secondary tank after aeration and rich in microbial masses","sludge in the secondary tank after aeration and rich in nutrients"],"answer":"3"},{"id":"78608","q":"The removal of dissolved organic matter occurs in","options":["slow sand filters","trickling filters","rapid sand filters","dual media filters"],"answer":"2"},{"id":"78609","q":"Presence of excess nitrates in river water indicates","options":["recent pollution of water with sewage","past pollution of water with sewage","immediate pollution of water with sewage","no pollution of water with sewage."],"answer":"2"},{"id":"78610","q":"Critical factors for the activated sludge treatment process are","options":["maximum hourly flow rate","maximum and minimum flow rate","maximum hourly flow rate and maximum daily organic load","minimum hourly flow rate and minimum daily organic load"],"answer":"3"},{"id":"78611","q":"A completely mixed activated process is to be used to treat a wastewater flow of 500 m³/hr having soluble BOD 5 of 250 mg/L. If the concentration of soluble BOD 5 escaping treatment is 10 mg/L, the treatment efficiency will be","options":["82%","86%","92%","96%"],"answer":"4"},{"id":"78612","q":"The excessive acidity or alkalinity of the particular wastewater is neutralized by adding alkali or acid, and this is achieved in","options":["the sedimentation tank","the equalization tank","the flocculation tank","the purification tank"],"answer":"2"},{"id":"78613","q":"Which of the following measures is/are to be adopted against water pollution? 1. The sewage before discharging into the water body may need not to be treated 2. The industrial waste should not be treated before disposing it off. 3. As far as possible, water sources should not be used for discharging the sewage Select the correct answer.","options":["1, 2, and 3","1 only","3 only","1 and 2 only"],"answer":"3"},{"id":"78614","q":"Which one of the following is the process in which ammonia is oxidised to nitrites and then to nitrates by aerobic bacteria ?","options":["Nitrification","Denitrification","Adsorption","Regeneration"],"answer":"1"},{"id":"78615","q":"Bulking sludge refers to having","options":["F/M < 0.3/d","0.3/d < F/M < 0.6/d","F/M = zero","F/M > 0.6/d"],"answer":"3"},{"id":"78616","q":"In aerobic environment, Nitrosomonas convert","options":["NH 3 to NO 2","NO 2 - to NO 3 -","NH 3 to N 2 O","NO 2 - to HNO 3"],"answer":"1"},{"id":"78617","q":"In a wastewater treatment plant, Primary Sedimentation Tank (PST) designed at an overflow rate of 32.5 m³/day/m² is 32.5 m long, 8.0 m wide and liquid depth of 2.25 m. If the length of the weir is 75 m, the weir loading rate (in m³/day/m) is _______.","options":["14.08 m³/day/m","112.67 m³/day/m","20911 m³/day/m","199m³/day/m"],"answer":"2"},{"id":"78618","q":"The wastewater having an organic concentration of 54 mg/l is flowing at a steady rate of 0.8 m³/day through a detention tank of dimensions 2m × 4m × 2m. If the contents of the tank are well mixed and the decay content is 0.1 per day, the outlet concentration (in mg/ l , up to one decimal place) is _____.","options":["319","43","40","11"],"answer":"4"},{"id":"78619","q":"The composition of a certain MSW sample and specific weights of its various components are given below: Component Percent by weight Specific weight (kg/(m 3 ) Food Dirt and Ash Plastics Wood and Yard waste 50 30 10 10 300 500 65 125 Specific weight (kg/(m 3 ) of the MSW sample is","options":["319","217","2091","199"],"answer":"4"},{"id":"78620","q":"50 g of CO 2 and 25 g of CH 4 are produced from the decomposition of municipal solid waste (MSW) with a formula weight of 120 g. What is the average per capita green house gas production in a city of 1 million people with a MSW production rate of 500 ton/day?","options":["104 g/day","120 g/day","208 g/day","313 g/day"],"answer":"4"},{"id":"78621","q":"A coastal city produces municipal solid waste (MSW) with high moisture content, high organic materials, low calorific value and low inorganic materials. The most effective and sustainable option for MSW management in that city is","options":["Composting","Dumping in sea","Incineration","Landfill"],"answer":"1"},{"id":"78622","q":"A landfill is to be designed to serve a population of 200000 for a period of 25 years. The solid waste (SW) generation is 2 kg/person/day. The density of the un-compacted SW is 100kg/m 3 and a compaction ratio of 4 is suggested. The ratio of compacted fill (i.e. SW + Cover) to compacted SW is 1.5. The landfill volume (in million m 3 ) required is _____.","options":["13.6875 Millions","16.7563 Millions","19.1582 Millions","12.358 Millions"],"answer":"1"},{"id":"78623","q":"Solid waste generated from an industry contains only two components, X and Y as shown in the table below: Assuming (C 1 + C 2 ) = 100, the composite density prof the solid waste ( ) is given by","options":["(b) 100","100 ( ) (d) 100"],"answer":"1"},{"id":"78624","q":"The composition of a municipal solid waste sample is given below: Component Percent by Mass Moisture content (%) Energy content ( kJ/kg on as discarded basis) Food waste Paper Cardboard Plastics Garden trimmings Wood Tin Cans 20 10 10 10 40 5 5 70 4 4 1 60 20 2 2500 10000 8000 14000 3500 14000 100 The difference between the energy content of the waste sample calculated on dry basis and as discarded basis (in kJ/kg) would be ______.","options":["3870 kJ/kg","4800 kJ/kg","480 kJ/kg","48 kJ/kg"],"answer":"1"},{"id":"78625","q":"There are 20,000 vehicles operating in a city with an average annual travel of 12,000 km per vehicle. The NO x emission rate is 2.0 g/km per vehicle. The total annual release of NO x will be","options":["4,80,000 kg","4,800 kg","480 kg","48 kg"],"answer":"1"},{"id":"78626","q":"A waste activated sludge (WAS) is to be blended with green waste (GW). The carbon (C) and nitrogen (N) contents, per kg of WAS and GW on dry basis are given in the table. Parameter WAS GW Carbon (g) 54 360 Nitrogen (g) 10 6 The ratio of WAS to GW required (up to two decimal places) to achieved a blended C:N ratio of 20:1 on dry basis is _______.","options":["1.64: 1","2:1","53:1","3:1"],"answer":"1"},{"id":"78627","q":"Which document forms the basis for granting Environmental Clearance (EC)?","options":["Detailed Project Report (DPR)","Environmental Impact Assessment Report","Consent to Operate","Pollution load calculation only"],"answer":"2"},{"id":"78628","q":"Public hearing in EIA is mainly conducted by:","options":["MoEF&CC","District Collector with SPCB support","Municipal Commissioner","National Green Tribunal"],"answer":"2"},{"id":"78629","q":"If a project site falls within 10 km of an eco-sensitive zone, EC is granted by:","options":["SEIAA only","SPCB","MoEF&CC irrespective of category","District Environment Committee"],"answer":"3"},{"id":"78630","q":"Which of the following projects is generally exempted from detailed EIA?","options":["Large thermal power plant","Mining project","White category industry","River valley project"],"answer":"3"},{"id":"78631","q":"Post-EC compliance reports are usually submitted:","options":["Once in project lifetime","Monthly","Six-monthly","Only during inspection"],"answer":"3"},{"id":"78632","q":"Site authorization primarily checks:","options":["Market potential","Environmental suitability of location","Availability of raw material","Financial strength of promoter"],"answer":"2"},{"id":"78633","q":"Which factor is most critical while approving site authorization for a solid waste facility?","options":["Distance from airport","Proximity to residential areas","Brand value of operator","Number of employees"],"answer":"2"},{"id":"78634","q":"Site authorization for waste processing facilities is generally issued under:","options":["Water Act, 1974","Solid Waste Management Rules, 2016","Air Act, 1981","Forest Act"],"answer":"2"},{"id":"78635","q":"Which authority grants site authorization in Bihar for waste management facilities?","options":["Urban Local Body","District Magistrate","Bihar State Pollution Control Board","Municipal Health Officer"],"answer":"3"},{"id":"78636","q":"Consent to Establish ensures that:","options":["Pollution is eliminated","Pollution control systems are planned before construction","Production has started","Workers are trained"],"answer":"2"},{"id":"78637","q":"CTE is granted under which Acts?","options":["Environment Protection Act only","Water Act and Air Act","Forest Conservation Act","Municipal Act"],"answer":"2"},{"id":"78638","q":"An industry that starts construction without CTE is liable for:","options":["Warning only","Environmental compensation and legal action","No penalty","Tax penalty only"],"answer":"2"},{"id":"78639","q":"Which document is not mandatory for CTE application?","options":["Site plan","Manufacturing process flow diagram","Proof of CTO","Proposed pollution control measures"],"answer":"3"},{"id":"78640","q":"CTO confirms that:","options":["Project proposal is not acceptable","Pollution control devices are installed and functional","Land ownership is clear","EC is not required"],"answer":"2"},{"id":"78641","q":"CTO is generally granted after:","options":["Land purchase","Completion of construction","Installation of pollution control systems","Public hearing"],"answer":"2"}];
let idx=0, answers={}, timerSec=3900, timerInt=null;

function render(){
  const q=DATA[idx];
  if(!q){document.getElementById('qText').textContent='No data.';return;}
  document.getElementById('qNum').textContent=idx+1;
  document.getElementById('qTotal').textContent=DATA.length;
  document.getElementById('qText').textContent=q.q;
  document.getElementById('opts').innerHTML=q.options.map((o,i)=>
    `<div class="option ${answers[idx]==(i+1)?'selected':''}" onclick="select(${i+1})">${String.fromCharCode(65+i)}. ${o}</div>`
  ).join('');
}
window.select=o=>{answers[idx]=o; render();};
window.prev=()=>{if(idx>0){idx--; render();}};
window.next=()=>{if(idx<DATA.length-1){idx++; render();}};

function submitTest(){
  clearInterval(timerInt);
  let c=0; for(let i=0;i<DATA.length;i++){if(answers[i]==DATA[i].answer)c++;}
  const pct=Math.round(c/DATA.length*100)||0;
  document.getElementById('qCard').classList.add('hidden');
  document.getElementById('resCard').classList.remove('hidden');
  document.getElementById('score').textContent=pct+'%';
  document.getElementById('detail').innerHTML='<b>'+c+'/'+DATA.length+'</b> correct';
}

function tick(){timerSec--; document.getElementById('timer').textContent=Math.floor(timerSec/60)+':'+String(timerSec%60).padStart(2,'0'); document.getElementById('bar').style.width=(timerSec/3900*100)+'%'; if(timerSec<=0){clearInterval(timerInt); submitTest();}}

render(); timerInt=setInterval(tick,1000);
</script>
